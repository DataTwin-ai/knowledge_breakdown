# GOVERNANCE MASTER TSG01_07 Goods or Services Characterisation by Notification (TG01 Supply & Taxability)
# LAW ARC - 4 laws - status APPROVED
name: TSG01_07 Goods or Services Characterisation by Notification - GOVERNANCE MASTER rulebook
version: TSG01_07
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_SCS:  # 1. 1 gate | 2 law(s)
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_SKOT:  # 2. 1 gate | 2 law(s)
    name: Supply Kind Of Transaction
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_ACBN:  # 3. 1 gate | 1 law(s)
    name: Activity Covered By Notification
    type: BOOLEAN
    tier: T1
  F_NIA:  # 4. 1 gate | 1 law(s)
    name: Notification Issuing Authority
    type: CODE
    options:
    - GOVERNMENT
    - OTHER
    tier: T1
  F_NRB:  # 5. 1 gate | 1 law(s)
    name: Notification Recommending Body
    type: CODE
    options:
    - COUNCIL
    - NONE_STATED
    - OTHER
    tier: T1
  F_NTOT:  # 6. 1 gate | 1 law(s)
    name: Notified Treatment Of Transaction
    type: CODE
    options:
    - GOODS
    - NONE_SPECIFIED
    - OTHER_TREATMENT
    - SERVICES_NOT_GOODS
    tier: T1
  F_SCT:  # 7. 1 gate | 1 law(s)
    name: Supply Consideration Type
    type: CODE
    options:
    - MONEY
    - NON_MONEY
    - NONE
    tier: T1
  # ---- level 2: asked only when that law's gates pass
  F_FOS:  # 8. 2 | 1 law(s) | asked only if M_SIAFOS: F_SCS + F_SKOT
    name: Form Of Supply
    type: CODE
    options:
    - BARTER
    - DISPOSAL
    - EXCHANGE
    - LEASE
    - LICENCE
    - OTHER
    - RENTAL
    - SALE
    - TRANSFER
    tier: T1
  # ---- LAST: only heavy checks (free text) need these
  F_DOTA:  # 9. LAST (heavy check only) | 2 law(s) | asked only if M_SIAFOS: F_SCS + F_SKOT | M_SIAWC: F_SCS
    name: Description Of The Activity
    type: TEXT
    tier: T1
  F_DOAOT:  # 10. LAST (heavy check only) | 1 law(s) | asked only if M_NTTAS: F_ACBN + F_NIA + F_NRB + F_NTOT
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
  F_SOOT:  # 11. LAST (heavy check only) | 1 law(s) | asked only if M_IOSFC: F_SCT
    name: Supply Origin Of Transaction
    type: CODE
    options:
    - IMPORT
    - DOMESTIC
    - EXPORT
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply takes the form of a sale of goods or services or both
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply takes the form of a transfer of goods or services or both
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply takes the form of a barter of goods or services or both
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply takes the form of an exchange of goods or services or both
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply takes the form of a licence of goods or services or both
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply takes the form of a rental of goods or services or both
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply takes the form of a lease of goods or services or both
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply takes the form of a disposal of goods or services or both
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAQF:
    statement: The supply is another qualifying form of supply of goods or services or both, not one of the listed forms
    order: HIGH
    interpretation: Is this unlisted form of supply a form of supply of the same kind as sale, transfer, barter, exchange,
      licence, rental, lease or disposal, given that the list is only illustrative?
    grounding:
    - F_FOS
    - F_DOTA
    handler: heavy
  M_SIAFOS_A_SIOGOS:
    statement: The supply is of goods or services or both
    order: LOW
    rule: F_SKOT IN ['GOODS', 'SERVICES', 'BOTH']
    handler: python
  M_SIAFOS_A_SIMFC:
    statement: The supply is made for a consideration
    order: LOW
    rule: F_SCS = 'PAID'
    handler: python
  M_SIAFOS_A_SIAFC:
    statement: The supply is agreed to be made for a consideration
    order: LOW
    rule: F_SCS = 'AGREED'
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Is the person making the supply doing so in the course or furtherance of business, judged from the description
      of the activity?
    grounding:
    - F_DOTA
    handler: heavy
  M_IOSFC_A_TISI:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Does the documented transaction amount to an import of services under the Act, given its supply origin
      and whether the supply is of services?
    grounding:
    - F_SOOT
    - F_SKOT
    handler: light
  M_IOSFC_A_IMFC:
    statement: The import of services was made for a consideration
    order: LOW
    rule: F_SCT IN ['MONEY', 'NON_MONEY']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I.
    order: HIGH
    interpretation: Does the described activity fall within an entry of Schedule I, read with the Schedule entry wording
    grounding:
    - F_DOTA
    handler: heavy
  M_SIAWC_A_AMWC:
    statement: The activity was made, or agreed to be made, without a consideration.
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_NTTAS_A_GITN:
    statement: The Government has specified the transactions by notification.
    order: LOW
    rule: F_NIA = 'GOVERNMENT'
    handler: python
  M_NTTAS_A_TCBN:
    statement: The transaction is one of the transactions specified in the notification.
    order: LOW
    rule: F_ACBN = TRUE
    handler: python
  M_NTTAS_A_NTIS:
    statement: The notification specifies that the transaction is to be treated as a supply of services and not as a supply
      of goods.
    order: LOW
    rule: F_NTOT = 'SERVICES_NOT_GOODS'
    handler: python
  M_NTTAS_A_TSTS:
    statement: The notified treatment of the transaction is subject to the provisions of sub-sections (1), (1A) and (2) and
      is not displaced by them.
    order: HIGH
    interpretation: Having regard to sub-sections (1), (1A) and (2), does any of them apply to this transaction so as to override
      or displace its treatment as a supply of services and not of goods under the notification?
    grounding:
    - F_DOAOT
    handler: heavy
  M_GPTNQR_A_NOCR:
    statement: The Government's notification of the class of registered persons is made on the recommendations of the Council
    order: LOW
    rule: F_NRB = 'COUNCIL'
    handler: python
groups:
  M_SIAFOS_G_SFA:
    name: Supply Form Alternatives
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAQF
    description: Any one listed form or any other qualifying form of supply. The list after such as is illustrative and not
      closed.
  M_SIAFOS_G_MOAC:
    name: Made Or Agreed Consideration
    logic: ANY
    members:
    - M_SIAFOS_A_SIMFC
    - M_SIAFOS_A_SIAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_IFCG:
    name: Import For Consideration Group
    logic: ALL
    members:
    - M_IOSFC_A_TISI
    - M_IOSFC_A_IMFC
    description: Both the import of services and its consideration are required for the inclusion
  M_SIAWC_G_SAWC:
    name: Schedule Activity Without Consideration
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMWC
    description: Both the Schedule I activity test and the nil consideration test must be met for this inclusion.
  M_NTTAS_G_NPC:
    name: Notification Power Conditions
    logic: ALL
    members:
    - M_NTTAS_A_GITN
    - M_GPTNQR_A_NOCR
    - M_NTTAS_A_TCBN
    - M_NTTAS_A_NTIS
    description: The Government notifies on Council recommendation a transaction as treated as services and not goods.
outcomes:
  M_SIAFOS_LE_SIBC:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAFOS_G_SFA AND M_SIAFOS_A_SIOGOS AND M_SIAFOS_G_MOAC AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction is included in supply under Section 7(1)(a) when it is in a qualifying form, is of goods
      or services or both, is made or agreed to be made for a consideration, and is by a person in the course or furtherance
      of business.
  M_IOSFC_LE_IOSI:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_IFCG
    module: M_IOSFC
    description: Import of services for a consideration is included in supply; the business test is not a member of this expression
  M_SIAWC_LE_SIO:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_SAWC
    module: M_SIAWC
    description: The supply is included under this limb only when the Schedule I activity group is met.
  M_NTTAS_LE_NSTP:
    outcome: TREATED_AS_SERVICES_NOT_GOODS
    expr: M_NTTAS_G_NPC AND M_NTTAS_A_TSTS
    module: M_NTTAS
    description: The transaction is treated as a supply of services and not of goods under this power only if the Government
      has notified it on Council recommendation and the notified treatment is not displaced by sub-sections (1), (1A) and
      (2).
products:
  M_SIAFOS_PD_SIBC:
    statement: The transaction is included in supply under Section 7(1)(a) when it is in a qualifying form, is of goods or
      services or both, is made or agreed to be made for a consideration, and is by a person in the course or furtherance
      of business.
  M_IOSFC_PD_IOSI:
    statement: Import of services for a consideration is included in supply; the business test is not a member of this expression
  M_SIAWC_PD_SIO:
    statement: The supply is included under this limb only when the Schedule I activity group is met.
  M_NTTAS_PD_NSTP:
    statement: The transaction is treated as a supply of services and not of goods under this power only if the Government
      has notified it on Council recommendation and the notified treatment is not displaced by sub-sections (1), (1A) and
      (2).
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_SIBC
  - M_IOSFC_LE_IOSI
  - M_SIAWC_LE_SIO
  produces:
  - product: M_SIAFOS_PD_SIBC
    from:
    - M_SIAFOS_LE_SIBC
  - product: M_IOSFC_PD_IOSI
    from:
    - M_IOSFC_LE_IOSI
  - product: M_SIAWC_PD_SIO
    from:
    - M_SIAWC_LE_SIO
- id: C_NTTAS
  question: 'Section 7(3)(b): Notified Transactions Treated As Services?'
  includes:
  - M_NTTAS_LE_NSTP
  produces:
  - product: M_NTTAS_PD_NSTP
    from:
    - M_NTTAS_LE_NSTP
time:
  law_date: F_DOI
