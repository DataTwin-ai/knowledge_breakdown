# GOVERNANCE MASTER TSG01_08 Schedule II Building Lease Deeming (TG01 Supply & Taxability)
# LAW ARC - 7 laws - status APPROVED
name: TSG01_08 Schedule II Building Lease Deeming - GOVERNANCE MASTER rulebook
version: TSG01_08
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_CRT:  # 1. 1 gate | 1 law(s)
    name: Consideration Receipt Timing
    type: CODE
    options:
    - AFTER_EARLIER_MILESTONE
    - ON_OR_BEFORE_EARLIER_MILESTONE
    - NOT_RECEIVED_IN_FULL
    tier: T1
  F_PLF:  # 2. 1 gate | 1 law(s)
    name: Property Letting Form
    type: CODE
    options:
    - LEASE
    - LETTING_OUT
    - OTHER
    tier: T1
  F_SLF:  # 3. 1 gate | 1 law(s)
    name: Supplier Legal Form
    type: CODE
    options:
    - UNINCORPORATED_ASSOCIATION_OR_BODY
    - OTHER
    tier: T0
  F_SS:  # 4. 1 gate | 1 law(s)
    name: Structure Status
    type: CODE
    options:
    - EXISTING_CIVIL_STRUCTURE
    - NOT_EXISTING
    - OTHER
    tier: T1
  F_WF:  # 5. 1 gate | 1 law(s)
    name: Work Form
    type: CODE
    options:
    - ADDITION
    - ALTERATION
    - REPLACEMENT
    - REMODELLING
    - OTHER
    tier: T1
  # ---- level 2: asked only when that law's gates pass
  F_CAK:  # 6. 2 | 3 law(s)
    name: Competent Authority Kind
    type: CODE
    options:
    - AUTHORISED_CERT_ISSUER
    - GOVERNMENT
    - OTHER
    tier: T1
  F_CCR:  # 7. 2 | 3 law(s)
    name: Completion Certificate Requirement
    type: CODE
    options:
    - NOT_REQUIRED
    - REQUIRED
    tier: T1
  F_ACR:  # 8. 2 | 1 law(s)
    name: Architect Council Registration
    type: CODE
    options:
    - REGISTERED_WITH_COA
    - NOT_REGISTERED
    tier: T0
  F_PER:  # 9. 2 | 1 law(s)
    name: Person Engineer Registration
    type: CODE
    options:
    - REGISTERED_CHARTERED_ENGINEER_IEI
    - OTHER
    tier: T0
  # ---- LAST: only heavy checks (free text) need these
  F_DOTA:  # 10. LAST (heavy check only) | 1 law(s) | asked only if M_COBTAS: F_CRT
    name: Description Of The Activity
    type: TEXT
    tier: T1
  F_PLP:  # 11. LAST (heavy check only) | 1 law(s) | asked only if M_BLSOS: F_PLF
    name: Property Letting Purpose
    type: CODE
    options:
    - BUSINESS_OR_COMMERCE_WHOLLY
    - BUSINESS_OR_COMMERCE_PARTLY
    - OTHER
    tier: T1
  F_PLS:  # 12. LAST (heavy check only) | 1 law(s) | asked only if M_BLSOS: F_PLF
    name: Property Letting Subject
    type: CODE
    options:
    - BUILDING
    - COMMERCIAL_INDUSTRIAL_OR_RESIDENTIAL_COMPLEX
    - LAND
    - OTHER
    tier: T1
  F_PSLS:  # 13. LAST (heavy check only) | 1 law(s)
    name: Person Surveyor Licence Status
    type: CODE
    options:
    - LICENSED_SURVEYOR_LOCAL_BODY
    - LICENSED_SURVEYOR_PLANNING_AUTHORITY
    - NOT_LICENSED_SURVEYOR
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_AACA_A_CAIG:
    statement: For the purposes of this clause the expression "competent authority" means the Government
    order: LOW
    rule: F_CAK = 'GOVERNMENT'
    handler: python
  M_AACA_A_AATIC:
    statement: For the purposes of this clause the expression "competent authority" means any authority authorised to issue
      completion certificate under any law for the time being in force
    order: HIGH
    interpretation: Is the authority authorised under any law for the time being in force to issue a completion certificate?
    grounding:
    - F_CAK
    handler: light
  M_AACA_A_CCNR:
    statement: In case of non-requirement of such completion certificate from such authority
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_AACA_A_ARWC:
    statement: The competent authority is an architect registered with the Council of Architecture constituted under the Architects
      Act, 1972
    order: LOW
    rule: F_ACR = 'REGISTERED_WITH_COA'
    handler: python
  M_CEACA_A_CERWI:
    statement: The competent authority is a chartered engineer registered with the Institution of Engineers (India)
    order: LOW
    rule: F_PER = 'REGISTERED_CHARTERED_ENGINEER_IEI'
    handler: python
  M_LSACA_A_GOCIA:
    statement: The authority is the Government or any authority authorised to issue completion certificate under any law for
      the time being in force
    order: LOW
    rule: F_CAK IN ['GOVERNMENT', 'AUTHORISED_CERT_ISSUER']
    handler: python
  M_LSACA_A_LSOLB:
    statement: The competent authority is, from any of the following, a licensed surveyor of the respective local body of
      the city or town or village or development or planning authority
    order: HIGH
    interpretation: Is the person a licensed surveyor of the respective local body of the city or town or village or of the
      development or planning authority concerned?
    grounding:
    - F_PSLS
    handler: light
  M_CIAAA_A_WCOA:
    statement: The work consists of additions to a civil structure
    order: LOW
    if_false: F_WF is not ADDITION
    rule: F_WF = 'ADDITION'
    handler: python
  M_CIAAA_A_AFOW:
    statement: The work consists of alterations to a civil structure
    order: LOW
    if_false: F_WF is not ALTERATION
    rule: F_WF = 'ALTERATION'
    handler: python
  M_CIAAA_A_ROP:
    statement: The work consists of replacements to a civil structure
    order: LOW
    if_false: F_WF is not REPLACEMENT
    rule: F_WF = 'REPLACEMENT'
    handler: python
  M_CIAAA_A_ROS:
    statement: The work consists of remodelling of a civil structure
    order: LOW
    if_false: F_WF is not REMODELLING
    rule: F_WF = 'REMODELLING'
    handler: python
  M_CIAAA_A_WOES:
    statement: The work is done on a civil structure that already exists
    order: LOW
    if_false: F_SS is NOT_EXISTING or OTHER
    rule: F_SS = 'EXISTING_CIVIL_STRUCTURE'
    handler: python
  M_UASOG_A_SIUA:
    statement: The supply is made by any unincorporated association or body of persons
    order: LOW
    rule: F_SLF = 'UNINCORPORATED_ASSOCIATION_OR_BODY'
    handler: python
  M_BLSOS_A_BILOLO:
    statement: The transaction is a lease or letting out of the building
    order: LOW
    rule: F_PLF IN ['LEASE','LETTING_OUT']
    handler: python
  M_BLSOS_A_SIABOC:
    statement: The property leased or let out is a building, including a commercial, industrial or residential complex
    order: HIGH
    interpretation: Is the property leased or let out a building, including a commercial, industrial or residential complex,
      and not land alone? The word including keeps the list of building types open.
    grounding:
    - F_PLS
    handler: light
  M_BLSOS_A_LIFBOC:
    statement: The lease or letting out of the building is for business or commerce, either wholly or partly
    order: HIGH
    interpretation: Is the building leased or let out for business or commerce, either wholly or partly, judged from the stated
      or actual use? Use wholly or partly for business or commerce satisfies the test.
    grounding:
    - F_PLP
    handler: light
  M_COBTAS_A_AIBC:
    statement: The activity is construction of a complex, building, civil structure or a part thereof, including a complex
      or building intended for sale to a buyer, wholly or partly
    order: HIGH
    interpretation: Does the described activity amount to construction of a complex, building, civil structure or a part thereof,
      including a complex or building intended for sale to a buyer wholly or partly? The sale-intent wording is inclusive
      and does not narrow the construction subject.
    grounding:
    - F_DOTA
    handler: light
  M_COBTAS_A_CRAM:
    statement: The entire consideration has been received after issuance of completion certificate, where required, by the
      competent authority or after its first occupation, whichever is earlier
    order: LOW
    rule: F_CRT = 'AFTER_EARLIER_MILESTONE'
    handler: python
groups:
  M_AACA_G_CAR:
    name: Competent Authority Routes
    logic: ANY
    members:
    - M_AACA_A_CAIG
    - M_AACA_A_AATIC
    - M_AACA_G_ARC
    description: Any one of the three routes makes the person or body a competent authority
  M_AACA_G_ARC:
    name: Architect Route Conditions
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_AACA_A_ARWC
    description: Architect route - no completion certificate is required from the authority and the person is a registered
      architect
  M_CEACA_G_GOAI:
    name: Government Or Authorised Issuer
    logic: ANY
    members:
    - M_AACA_A_CAIG
    - M_AACA_A_AATIC
    description: Either the Government or an authority authorised to issue a completion certificate under any law in force
  M_CEACA_G_NCACE:
    name: No Certificate And Chartered Engineer
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_CEACA_A_CERWI
    description: The chartered engineer route applies only where no completion certificate is required from such authority
      and the person is a registered chartered engineer
  M_LSACA_G_SRC:
    name: Surveyor Route Conditions
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_LSACA_A_LSOLB
    description: The surveyor route applies only when no completion certificate is required from the authority and the person
      is a licensed surveyor of the respective local body or planning authority
  M_CIAAA_G_LWF:
    name: Listed Work Forms
    logic: ANY
    members:
    - M_CIAAA_A_WCOA
    - M_CIAAA_A_AFOW
    - M_CIAAA_A_ROP
    - M_CIAAA_A_ROS
    description: Any one of the four listed forms of work, joined by or
outcomes:
  M_AACA_LE_CAD:
    outcome: COMPETENT_AUTHORITY
    expr: M_AACA_G_CAR
    module: M_AACA
    description: A person or body is a competent authority if it is the Government, or an authority authorised to issue completion
      certificates, or - where no certificate is required - a registered architect
  M_CEACA_LE_CADO:
    outcome: COMPETENT_AUTHORITY_FOR_CLAUSE_5B
    expr: M_CEACA_G_GOAI OR M_CEACA_G_NCACE
    module: M_CEACA
    description: A competent authority for clause 5(b) is reached only through the Government or authorised certificate-issuing
      authority route, or through the registered chartered engineer route where no completion certificate is required.
  M_LSACA_LE_CAIE:
    outcome: COMPETENT_AUTHORITY_UNDER_THIS_ITEM
    expr: M_LSACA_A_GOCIA OR M_LSACA_G_SRC
    module: M_LSACA
    description: The authority is the Government or an authorised completion certificate issuer, or else a licensed surveyor
      where no certificate is required from that authority
  M_CIAAA_LE_CFO:
    outcome: IS_CONSTRUCTION_FOR_CLAUSE_5B
    expr: M_CIAAA_G_LWF AND M_CIAAA_A_WOES
    module: M_CIAAA
    description: A listed form of work on an existing civil structure counts as construction for this clause
  M_UASOG_LE_SIUA:
    outcome: SUPPLIER_IS_UNINCORPORATED_ASSOCIATION
    expr: M_UASOG_A_SIUA
    module: M_UASOG
    description: The supply is made by any unincorporated association or body of persons (Schedule II, paragraph 7, part of
      the law)
  M_BLSOS_LE_BLDS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_BLSOS_A_BILOLO AND M_BLSOS_A_SIABOC AND M_BLSOS_A_LIFBOC
    module: M_BLSOS
    description: The lease or letting out is treated as a supply of services when it is a lease or letting out, of a building,
      for business or commerce wholly or partly
  M_COBTAS_LE_CTAS:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: M_COBTAS_A_AIBC AND NOT M_COBTAS_A_CRAM
    module: M_COBTAS
    description: Deemed supply of services applies when the activity is construction as described and the entire consideration
      was not received after the earlier completion or occupation milestone.
products:
  M_AACA_PD_CAD:
    statement: A person or body is a competent authority if it is the Government, or an authority authorised to issue completion
      certificates, or - where no certificate is required - a registered architect
  M_CEACA_PD_CADO:
    statement: A competent authority for clause 5(b) is reached only through the Government or authorised certificate-issuing
      authority route, or through the registered chartered engineer route where no completion certificate is required.
  M_LSACA_PD_CAIE:
    statement: The authority is the Government or an authorised completion certificate issuer, or else a licensed surveyor
      where no certificate is required from that authority
  M_CIAAA_PD_CFO:
    statement: A listed form of work on an existing civil structure counts as construction for this clause
  M_UASOG_PD_SIUA:
    statement: The supply is made by any unincorporated association or body of persons
  M_BLSOS_PD_BLDS:
    statement: The lease or letting out is treated as a supply of services when it is a lease or letting out, of a building,
      for business or commerce wholly or partly
  M_COBTAS_PD_CTAS:
    statement: Deemed supply of services applies when the activity is construction as described and the entire consideration
      was not received after the earlier completion or occupation milestone.
compounds:
- id: C_SCHII_EN5_CB_E1_N1
  question: 'Schedule II, paragraph 5(b), Explanation, item (1): which clause applies?'
  includes:
  - M_AACA_LE_CAD
  - M_CEACA_LE_CADO
  - M_LSACA_LE_CAIE
  produces:
  - product: M_AACA_PD_CAD
    from:
    - M_AACA_LE_CAD
  - product: M_CEACA_PD_CADO
    from:
    - M_CEACA_LE_CADO
  - product: M_LSACA_PD_CAIE
    from:
    - M_LSACA_LE_CAIE
- id: C_CIAAA
  question: 'Schedule II, paragraph 5(b), Explanation, item (2): Construction Includes Additions And Alterations?'
  includes:
  - M_CIAAA_LE_CFO
  produces:
  - product: M_CIAAA_PD_CFO
    from:
    - M_CIAAA_LE_CFO
- id: C_UASOG
  question: The supply is made by any unincorporated association or body of persons? (Schedule II, paragraph 7)
  includes:
  - M_UASOG_LE_SIUA
  produces:
  - product: M_UASOG_PD_SIUA
    from:
    - M_UASOG_LE_SIUA
- id: C_BLSOS
  question: 'Schedule II, paragraph 2(b): Building Lease Supply Of Services?'
  includes:
  - M_BLSOS_LE_BLDS
  produces:
  - product: M_BLSOS_PD_BLDS
    from:
    - M_BLSOS_LE_BLDS
- id: C_COBTAS
  question: 'Schedule II, paragraph 5(b): Construction Of Building Treated As Services?'
  includes:
  - M_COBTAS_LE_CTAS
  produces:
  - product: M_COBTAS_PD_CTAS
    from:
    - M_COBTAS_LE_CTAS
time:
  law_date: F_DOI
