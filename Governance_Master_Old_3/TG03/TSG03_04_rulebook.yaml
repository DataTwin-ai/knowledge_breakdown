# GOVERNANCE MASTER TSG03_04 Imports (TG03 Location & Tax Type)
# LAW ARC - 4 laws - status APPROVED
name: TSG03_04 Imports - GOVERNANCE MASTER rulebook
version: TSG03_04
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_ACBN:  # 1. 1 gate | 1 law(s)
    name: Activity Covered By Notification
    type: BOOLEAN
    tier: T1
  F_AUT:  # 2. 1 gate | 1 law(s)
    name: Activity Undertaker Type
    type: CODE
    options:
    - CENTRAL_GOVT
    - STATE_GOVT
    - LOCAL_AUTHORITY
    - OTHER
    tier: T1
  F_NRB:  # 3. 1 gate | 1 law(s)
    name: Notification Recommending Body
    type: CODE
    options:
    - COUNCIL
    - NONE_STATED
    - OTHER
    tier: T1
  F_SCT:  # 4. 1 gate | 1 law(s)
    name: Supply Consideration Type
    type: CODE
    options:
    - MONEY
    - NON_MONEY
    - NONE
    tier: T1
  F_SEL:  # 5. 1 gate | 1 law(s)
    name: Supplier Establishment Location
    type: CODE
    options:
    - OTHER
    - OTHER_ESTABLISHMENT_OUTSIDE_INDIA
    tier: T1
  # ---- LAST: only heavy checks (free text) need these
  F_SKOT:  # 6. LAST (heavy check only) | 2 law(s) | asked only if M_IOSFC: F_SCT
    name: Supply Kind Of Transaction
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SOOT:  # 7. LAST (heavy check only) | 2 law(s) | asked only if M_IOSFC: F_SCT
    name: Supply Origin Of Transaction
    type: CODE
    options:
    - IMPORT
    - DOMESTIC
    - EXPORT
    tier: T1
  F_DOAOT:  # 8. LAST (heavy check only) | 1 law(s)
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
  F_DOTA:  # 9. LAST (heavy check only) | 1 law(s) | asked only if M_NGANGNS: F_ACBN + F_AUT + F_NRB
    name: Description Of The Activity
    type: TEXT
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_IOSFRP_A_SIOOE:
    statement: The import of services is made from any of his other establishments outside India
    order: LOW
    rule: F_SEL = 'OTHER_ESTABLISHMENT_OUTSIDE_INDIA'
    handler: python
  M_IOSFC_A_TISI:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Does the documented transaction amount to an import of services under the Act, given its supply origin
      and whether the supply is of services?
    grounding:
    - F_SOOT
    - F_SKOT
    handler: light
  M_ANGNS_A_ASISIII:
    statement: The activity or transaction is specified in Schedule III
    order: HIGH
    interpretation: Does the activity or transaction described in the document match an entry specified in Schedule III?
    grounding:
    - F_DOAOT
    handler: heavy
  M_NGANGNS_A_UBGB:
    statement: The activity or transaction is undertaken by the Central Government, a State Government or any local authority.
    order: LOW
    rule: F_AUT IN ['CENTRAL_GOVT', 'STATE_GOVT', 'LOCAL_AUTHORITY']
    handler: python
  M_NGANGNS_A_EAPA:
    statement: The Central Government, State Government or local authority is engaged in the activity or transaction as a
      public authority.
    order: HIGH
    if_false: the activity is carried on other than as a public authority
    interpretation: On the description of the activity, is the government body engaged in it as a public authority, rather
      than in an ordinary commercial or private capacity?
    grounding:
    - F_DOTA
    handler: heavy
  M_NGANGNS_A_AINBG:
    statement: The activity or transaction is one that may be notified by the Government and has been so notified.
    order: LOW
    rule: F_ACBN = TRUE
    handler: python
  M_GPTNQR_A_NOCR:
    statement: The Government's notification of the class of registered persons is made on the recommendations of the Council
    order: LOW
    rule: F_NRB = 'COUNCIL'
    handler: python
  M_IOSFC_A_IMFC:
    statement: The import of services was made for a consideration
    order: LOW
    rule: F_SCT IN ['MONEY', 'NON_MONEY']
    handler: python
groups:
  M_IOSFC_G_IFCG:
    name: Import For Consideration Group
    logic: ALL
    members:
    - M_IOSFC_A_TISI
    - M_IOSFC_A_IMFC
    description: Both the import of services and its consideration are required for the inclusion
outcomes:
  M_IOSFRP_LE_SIOOE:
    outcome: SUPPLIER_IS_OTHER_OVERSEAS_ESTABLISHMENT
    expr: M_IOSFRP_A_SIOOE
    module: M_IOSFRP
    description: The import of services is made from any of his other establishments outside India (Schedule I, paragraph
      4, part of the law)
  M_IOSFC_LE_TISI:
    outcome: TRANSACTION_IS_IMPORT_OF_SERVICES
    expr: M_IOSFC_A_TISI
    module: M_IOSFRP
    description: The transaction is an import of services (Schedule I, paragraph 4, part of the law)
  M_ANGNS_LE_SIIINSO:
    outcome: NEITHER_GOODS_NOR_SERVICES
    expr: M_ANGNS_A_ASISIII
    module: M_ANGNS
    description: The activity or transaction is treated neither as a supply of goods nor as a supply of services when it is
      specified in Schedule III, notwithstanding sub-section (1).
  M_NGANGNS_LE_NANS:
    outcome: NEITHER_GOODS_NOR_SERVICES
    expr: M_NGANGNS_A_UBGB AND M_NGANGNS_A_EAPA AND M_NGANGNS_A_AINBG AND M_GPTNQR_A_NOCR
    module: M_NGANGNS
    description: When all four conditions hold, the activity or transaction shall be treated neither as a supply of goods
      nor a supply of services, overriding sub-section (1).
  M_IOSFC_LE_IOSI:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_IFCG
    module: M_IOSFC
    description: Import of services for a consideration is included in supply; the business test is not a member of this expression
overrides:
  IH_ANGNS_IOSFC:
    outcome: NEITHER_GOODS_NOR_SERVICES
    expr: M_ANGNS_A_ASISIII
    module: M_ANGNS
    description: The activity or transaction is treated neither as a supply of goods nor as a supply of services when it is
      specified in Schedule III, notwithstanding sub-section (1).
  IH_NGANGNS_IOSFC:
    outcome: NEITHER_GOODS_NOR_SERVICES
    expr: M_NGANGNS_A_UBGB AND M_NGANGNS_A_EAPA AND M_NGANGNS_A_AINBG AND M_GPTNQR_A_NOCR
    module: M_NGANGNS
    description: When all four conditions hold, the activity or transaction shall be treated neither as a supply of goods
      nor a supply of services, overriding sub-section (1).
products:
  M_IOSFRP_PD_SIOOE:
    statement: The import of services is made from any of his other establishments outside India
  M_IOSFC_PD_TISI:
    statement: The supply is an import of services by a person
  M_ANGNS_PD_SIIINSO:
    statement: The activity or transaction is treated neither as a supply of goods nor as a supply of services when it is
      specified in Schedule III, notwithstanding sub-section (1).
  M_NGANGNS_PD_NANS:
    statement: When all four conditions hold, the activity or transaction shall be treated neither as a supply of goods nor
      a supply of services, overriding sub-section (1).
  M_IOSFC_PD_IOSI:
    statement: Import of services for a consideration is included in supply; the business test is not a member of this expression
compounds:
- id: C_IOSFRP
  question: The import of services is made from any of his other establishments outside India; The transaction is an import
    of services? (Schedule I, paragraph 4)
  includes:
  - M_IOSFRP_LE_SIOOE
  - M_IOSFC_LE_TISI
  produces:
  - product: M_IOSFRP_PD_SIOOE
    from:
    - M_IOSFRP_LE_SIOOE
  - product: M_IOSFC_PD_TISI
    from:
    - M_IOSFC_LE_TISI
- id: C_S7_SS2
  question: 'Section 7(2): which clause applies?'
  includes:
  - M_ANGNS_LE_SIIINSO
  - M_NGANGNS_LE_NANS
  produces:
  - product: M_ANGNS_PD_SIIINSO
    from:
    - M_ANGNS_LE_SIIINSO
  - product: M_NGANGNS_PD_NANS
    from:
    - M_NGANGNS_LE_NANS
- id: C_IOSFC
  question: 'Section 7(1)(b): Import Of Services For Consideration?'
  includes:
  - M_IOSFC_LE_IOSI
  produces:
  - product: M_IOSFC_PD_IOSI
    from:
    - M_IOSFC_LE_IOSI
  overrides:
  - IH_ANGNS_IOSFC
  - IH_NGANGNS_IOSFC
time:
  law_date: F_DOI
