products:
  M_CEACA_PD_CERWI:
    statement: The competent authority is a chartered engineer registered with the Institution of Engineers (India)
  M_AACA_PD_CAD:
    statement: A person or body is a competent authority if it is the Government, or an authority authorised to issue completion
      certificates, or - where no certificate is required - a registered architect
  M_LSACA_PD_CAIE:
    statement: The authority is the Government or an authorised completion certificate issuer, or else a licensed surveyor
      where no certificate is required from that authority
  M_CIAAA_PD_CFO:
    statement: A listed form of work on an existing civil structure counts as construction for this clause
  M_SBRODP_PD_SEWC:
    statement: All three conditions are met, so the transaction is treated as supply under Schedule I paragraph 2 even if
      made without consideration.
  M_UASOG_PD_AGDS:
    statement: Treated as a supply of goods where the association supplies goods to its member for consideration
  M_TOPOGIS_PD_TOAGIS:
    statement: The deemed supply of services follows when the whole treatment group is satisfied
  M_UASOG_PD_SFVC:
    statement: The supply or service is for cash, deferred payment or other valuable consideration.
  M_WCAS_PD_WCDS:
    statement: a composite supply that is a works contract is treated as a supply of services
  M_BLSOS_PD_BILOLO:
    statement: The transaction is a lease or letting out of the building
  M_LISOS_PD_LIDO:
    statement: The listed interest in land is deemed a supply of services, with no consideration or value test.
  M_TTOIPS_PD_DSR:
    statement: the activity shall be treated as supply of services when it is a temporary transfer or permitting use or enjoyment
      and the right concerned is an intellectual property right
  M_TORTUGS_PD_T:
    statement: The right-to-use transfer for consideration is deemed a supply of services under paragraph 5(f)
  M_ROIPIS_PD_DSOS:
    statement: The renting of immovable property is treated as a supply of services
  M_COBTAS_PD_CTAS:
    statement: Deemed supply of services applies when the activity is construction as described and the entire consideration
      was not received after the earlier completion or occupation milestone.
  M_ISDIS_PD_SSD:
    statement: A listed activity is performed on information technology software, so the activity is deemed a supply of services
  M_ATROTAS_PD_ADSOS:
    statement: An agreement to one of the three listed obligation kinds is treated as a supply of services
  M_FTTISOG_PD_DSOG:
    statement: A transfer of title under a future-passing agreement paid in full as agreed is a supply of goods under paragraph
      1(c)
  M_TOTISOG_PD_GDO:
    statement: The transaction is a supply of goods when a transfer of the title in goods has taken place.
  M_TORISOS_PD_TDSS:
    statement: A transfer of a right or of an undivided share in goods, made without the transfer of title, is deemed a supply
      of services.
  M_PUOBGIS_PD_BGPUDS:
    statement: The deeming applies when the business context is met and at least one of the three use routes is met.
  M_TOBASOG_PD_BAGS:
    statement: Where all transfer conditions are met, the transfer or disposal is a deemed supply of goods by the person.
  M_IOSFC_PD_TISI:
    statement: The supply is an import of services by a person
  M_SIAFOS_PD_SBPIB:
    statement: The import of services is in the course or furtherance of business
  M_ANGNS_PD_SIIINSO:
    statement: The activity or transaction is treated neither as a supply of goods nor as a supply of services when it is
      specified in Schedule III, notwithstanding sub-section (1).
  M_NGANGNS_PD_NANS:
    statement: When all four conditions hold, the activity or transaction shall be treated neither as a supply of goods nor
      a supply of services, overriding sub-section (1).
  M_IOSFC_PD_IOSI:
    statement: Import of services for a consideration is included in supply; the business test is not a member of this expression
  M_SIAFOS_PD_SIBC:
    statement: The transaction is included in supply under Section 7(1)(a) when it is in a qualifying form, is of goods or
      services or both, is made or agreed to be made for a consideration, and is by a person in the course or furtherance
      of business.
  M_SIAWC_PD_SIO:
    statement: The supply is included under this limb only when the Schedule I activity group is met.
  M_COTPBTE_PD_DSOC:
    statement: The deeming applies when the person has ceased to be a taxable person and the goods are business assets, and
      the business is not transferred as a going concern to another person.
  M_COTPRE_PD_DSOC:
    statement: Where the person ceases to be a taxable person and the goods are business assets, the goods are deemed supplied
      by him in the course or furtherance of his business immediately before cessation, unless the business is carried on
      by a personal representative who is deemed to be a taxable person.
