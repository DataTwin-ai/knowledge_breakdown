    tier: T1
  F_EL:  # 39. LAST (heavy check only) | 3 law(s)
    name: Establishing Law
    type: TEXT
    tier: T1
  F_PBT:  # 40. LAST (heavy check only) | 2 law(s)
    name: Provider Body Type
    type: CODE
    options:
    - COURT
    - TRIBUNAL
    - OTHER
    tier: T0
  F_PPH:  # 41. LAST (heavy check only) | 2 law(s)
    name: Person Post Held
    type: CODE
    options:
