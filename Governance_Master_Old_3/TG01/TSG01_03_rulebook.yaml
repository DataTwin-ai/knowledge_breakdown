    tier: T0
  F_POGU:  # 36. 2 | 1 law(s) | asked only if M_PUOBGIS: F_BAS
    name: Purpose Of Goods Use
    type: CODE
    options:
    - BUSINESS
    - NON_BUSINESS
    tier: T1
  # ---- LAST: only heavy checks (free text) need these
  F_DOTA:  # 37. LAST (heavy check only) | 10 law(s) | asked only if M_DBGBM: F_BEA + F_PBR + F_PDEBC | M_FOEM: F_PEO | M_COBTAS: F_CRT | M_NGANGNS: F_ACBN + F_AUT + F_NRB | M_SIAFOS: F_SKOT + F_SCS | M_SIAWC: F_SCS
