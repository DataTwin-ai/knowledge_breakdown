compounds:
- id: C_PSD
  question: 'Section 2(90): Principal Supply Definition?'
  includes:
  - M_PSD_LE_PSDO
  produces:
  - product: M_PSD_PD_PSDO
    from:
    - M_PSD_LE_PSDO
- id: C_TSD
  question: The supply is leviable to tax under this Act? (Section 2(108))
  includes:
  - M_TSD_LE_SILTT
  produces:
  - product: M_TSD_PD_SILTT
    from:
    - M_TSD_LE_SILTT
- id: C_DOCOS
  question: 'Section 2(30): Definition Of Composite Supply?'
  includes:
  - M_DOCOS_LE_CSDM
  produces:
  - product: M_DOCOS_PD_CSDM
    from:
    - M_DOCOS_LE_CSDM
- id: C_SCHII_EN5_CB_E1_N1
  question: 'Schedule II, paragraph 5(b), Explanation, sub-item (1): which clause applies?'
  includes:
  - M_CALS_LE_CADM
  - M_DOCACE_LE_CADO
  - M_CAA_LE_CAO
  produces:
  - product: M_CALS_PD_CADM
    from:
    - M_CALS_LE_CADM
  - product: M_DOCACE_PD_CADO
    from:
    - M_DOCACE_LE_CADO
  - product: M_CAA_PD_CAO
    from:
    - M_CAA_LE_CAO
- id: C_DOCFS
  question: 'Schedule II, paragraph 5(b), Explanation (2): Definition Of Construction For Services?'
  includes:
  - M_DOCFS_LE_CMO
