predicates:
  M_PSD_A_CDNROM:
    statement: The context does not otherwise require a different meaning for 'principal supply'.
    order: LOW
    rule: F_DCS = 'NO_CONTRARY_CONTEXT'
    handler: python
  M_PSD_A_SITPE:
    statement: The supply of goods or services constitutes the predominant element of a composite supply.
    order: HIGH
    interpretation: Considering the component under test, is it the predominant element of the composite supply, having regard
      to the nature, value, and overall purpose of all components described?
    grounding:
    - F_CUT
    - F_CSCD
    - F_CSCV
    handler: heavy
  M_PSD_A_OSAA:
    statement: Any other supply forming part of that composite supply is ancillary to the supply being tested.
    order: HIGH
    interpretation: Are all other supplies forming part of the composite supply ancillary to the component under test?
    grounding:
    - F_CUT
    - F_CSCD
    - F_CSCV
    handler: heavy
  M_TSD_A_SILTT:
    statement: The supply is leviable to tax under this Act
    order: HIGH
    interpretation: Considering the nature, description, and classification (HSN/SAC) of the supply, is it subject to tax
      under this Act, or is it exempt, nil-rated, or non-GST?
    grounding:
    - F_SIK
    - F_DOS
    - F_HOSCOS
    handler: heavy
  M_DOCOS_A_CROM:
    statement: The context requires an interpretation of composite supply other than the one provided in this definition
    order: HIGH
    interpretation: Does the statutory context in which the term composite supply is used require a meaning different from
      the definition in Section 2(30)?
    grounding:
    - F_SCW
    handler: heavy
  M_DOCOS_A_SITP:
    statement: The supply is made by a taxable person
    order: LOW
    rule: F_STPS2 = TRUE
    handler: python
  M_DOCOS_A_SITR:
    statement: The supply is made to a recipient
    order: LOW
    rule: F_SRP = TRUE
    handler: python
  M_DOCOS_A_TOMTS:
    statement: The supply consists of two or more taxable supplies of goods or services or both or any combination thereof
    order: LOW
    rule: F_TCSC >= 2
    handler: python
  M_DOCOS_A_SANB:
    statement: The two or more taxable supplies are naturally bundled
    order: HIGH
    interpretation: Having regard to the nature of the supplies and how they are offered, are the constituent supplies naturally
      bundled together and not artificially combined?
    grounding:
    - F_BOD
    handler: heavy
  M_DOCOS_A_SICOC:
    statement: The supplies are supplied in conjunction with each other in the ordinary course of business
    order: HIGH
    interpretation: Are the constituent supplies supplied together in conjunction with each other, as a normal part of the
      supplier's ordinary course of business?
    grounding:
    - F_BOD
    - F_SPS
    handler: heavy
  M_DOCOS_A_OSIP:
    statement: One of the constituent supplies is a principal supply
    order: HIGH
    interpretation: Is one of the bundled supplies the principal supply of the bundle, as shown by the contract or invoice
      and the nature of the supplies?
    grounding:
    - F_PCI
    handler: heavy
  M_CALS_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CALS_A_AIAI:
    statement: The competent authority is an authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the authority authorised under any law for the time being in force to issue a completion certificate?
    grounding:
    - F_IAUL
    handler: heavy
  M_CALS_A_CNRFA:
    statement: A completion certificate is not required from the Government or the authority authorised to issue it (non-requirement
      of such certificate from such authority)
    order: HIGH
    interpretation: Is there a non-requirement of a completion certificate from such authority for the property or work concerned?
    grounding:
    - F_CCR
    handler: light
  M_CALS_A_AILS:
    statement: The competent authority is a licensed surveyor of the respective local body of the city or town or village
      or development or planning authority
    order: HIGH
    interpretation: Is the person a licensed surveyor of the respective local body of the city or town or village or of the
      development or planning authority? The source wording is ambiguous on how the list attaches and is retained as written.
    grounding:
    - F_SLS2
    handler: heavy
  M_DOCACE_A_CAIG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_DOCACE_A_AULA:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue completion certificates under a law for the time being in
      force?
    grounding:
    - F_CIT
    handler: heavy
  M_DOCACE_A_CNRFA:
    statement: In case of non-requirement of such completion certificate from such authority, the certificate is not required
      from that authority
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_DOCACE_A_CERWI:
    statement: The competent authority is a chartered engineer registered with the Institution of Engineers (India)
    order: LOW
    rule: F_CERS = 'REGISTERED_IEI'
    handler: python
  M_CAA_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CAA_A_AAUL:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue a completion certificate under any law for the time being
      in force?
    grounding:
    - F_IAUL
    handler: light
  M_CAA_A_CNRFA:
    statement: A completion certificate is not required from the Government or authority authorised under any law to issue
      it
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_CAA_A_ARWC:
    statement: The competent authority is an architect registered with the Council of Architecture constituted under the Architects
      Act, 1972
    order: LOW
    rule: F_ACR = TRUE
    handler: python
  M_DOCFS_A_WIAA:
