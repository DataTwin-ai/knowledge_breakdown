    handler: light
  M_DNPFGOS_A_SADAC:
    statement: The supplier applies such deposit as consideration for the said supply
    order: LOW
    rule: F_AODA = 'APPLIED_AS_CONSIDERATION'
    handler: python
groups:
  M_PSD_G_PSDC:
    name: Principal Supply Definition Conditions
    logic: ALL
    members:
    - M_PSD_A_CDNROM
    - M_PSD_A_SITPE
    - M_PSD_A_OSAA
  M_DOCOS_G_CSP:
    name: Composite Supply Parties
    logic: ALL
    members:
    - M_DOCOS_A_SITP
    - M_DOCOS_A_SITR
    description: The supply is made by a taxable person and to a recipient.
  M_DOCOS_G_CSBC:
    name: Composite Supply Bundle Conditions
    logic: ALL
    members:
    - M_DOCOS_A_TOMTS
    - M_DOCOS_A_SANB
    - M_DOCOS_A_SICOC
    - M_DOCOS_A_OSIP
    description: The supply consists of two or more taxable supplies that are naturally bundled and supplied in conjunction
      in the ordinary course of business, one being a principal supply.
  M_CALS_G_PAA:
    name: Primary Authority Alternatives
    logic: ANY
    members:
    - M_CALS_A_AITG
    - M_CALS_A_AIAI
    description: The Government or any authority authorised to issue completion certificate under any law for the time being
      in force.
  M_CALS_G_SRC:
