  M_FODCSAS_G_DOTAL:
    name: Drink Other Than Alcoholic Liquor
    logic: ALL
    members:
    - M_FODCSAS_A_GSAAD
    - M_FODCSAS_A_DINAL
    description: The drink route requires a drink that is not alcoholic liquor for human consumption.
  M_TOTIG_G_TGC:
    name: Title Goods Conditions
    logic: ALL
    members:
    - M_TOTIG_A_TOTIG
    - M_TOTIG_A_TSIG
    description: Both the transfer of title and the goods subject must be satisfied.
  M_TORIGIS_G_TSA:
    name: Transfer Subject Alternatives
    logic: ANY
    members:
    - M_TORIGIS_A_TORIG
    - M_TORIGIS_A_TOUS
    description: At least one of the transfer subject forms must hold
  M_TOTIG2_G_TTTG:
    name: Title Transfer Terms Group
    logic: ALL
    members:
    - M_TOTIG2_A_ATOTIG
    - M_TOTIG2_A_ASPP
    - M_TOTIG2_A_PPAFD
    - M_TOTIG2_A_PUFC
    description: All four title transfer terms must hold together, as the source joins them with an agreement, a future date
