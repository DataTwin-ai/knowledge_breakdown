predicates:
  M_DOAFGOS_A_BIOBOA:
    statement: The person carries on the business of supply or receipt of goods or services or both on behalf of another
    order: HIGH
    interpretation: Does the contract or authorisation show that the person carries on that business on behalf of another
      person rather than on its own account?
    grounding:
    - F_PRR
    - F_AOTD
    handler: light
  M_ROSWC_A_NCIPFTS:
    statement: No consideration is payable for the supply.
    order: LOW
    rule: F_SCS3 = 'NOT_PAYABLE'
    handler: python
  M_ROSWC_A_SIAS:
    statement: The supply is a supply of a service.
    order: LOW
    rule: F_SIK = 'SERVICES'
    handler: python
  M_RDFGWC_A_NCIPFTS:
    statement: No consideration is payable for the supply.
    order: LOW
    rule: F_SCS3 = 'NOT_PAYABLE'
    handler: python
  M_DOCOP_A_CDNRO:
    statement: The context of this Act does not otherwise require a different meaning of consideration
    order: HIGH
    interpretation: Does the context in which consideration is used in this Act require a meaning different from the meaning
      given in Section 2(31)(a)?
    grounding:
    - F_SCW
    handler: heavy
  M_DOCOP_A_SIGOS:
    statement: The supply concerned is a supply of goods or services or both
    order: LOW
    rule: F_SIK IN ['GOODS','CAPITAL_GOODS','SERVICES','BOTH']
    handler: python
  M_DOCOP_A_PHBM:
    statement: A payment has been made in relation to the supply
    order: LOW
    rule: F_PMODS = 'MADE'
    handler: python
  M_DOCOP_A_PITBM:
    statement: A payment is to be made in relation to the supply
    order: LOW
    rule: F_PMODS = 'TO_BE_MADE'
    handler: python
  M_DOCOP_A_PIIMOO:
    statement: The payment is made or to be made whether in money or otherwise
    order: LOW
    rule: F_FOP IN ['MONEY','NON_MONEY']
    handler: python
  M_DOCOP_A_PLTTS:
    statement: The payment is in respect of, in response to, or for the inducement of, the supply of goods or services or
      both
    order: HIGH
    interpretation: On the facts, is the payment made in respect of, in response to, or for the inducement of, the supply?
      Any one of these links is enough.
    grounding:
    - F_PSR
    handler: heavy
  M_DOCOP_A_PIROO:
    statement: The payment is made by the recipient of the supply or by any other person
    order: LOW
    rule: F_ROP IN ['RECIPIENT','OTHER_PERSON']
    handler: python
  M_DOCOP_A_PIGS:
    statement: The payment is a subsidy given by the Central Government or a State Government, which the definition shall
      not include
    order: HIGH
    interpretation: Is the payment a subsidy given by the Central Government or a State Government?
    grounding:
    - F_PSS
    handler: light
  M_CMVOAF_A_CORDM:
    statement: The context otherwise requires a different meaning of consideration than the one given in this definition
    order: HIGH
    interpretation: Does the wording and context of the provision where consideration is used require a different meaning
      from this definition?
    grounding:
    - F_SCW2
    handler: heavy
  M_CMVOAF_A_CIAOF:
    statement: What is given includes any act or forbearance
    order: HIGH
    interpretation: Is what was given an act done or a forbearance (abstention from doing something)?
    grounding:
    - F_DOAG
    handler: light
  M_CMVOAF_A_AHAMV:
    statement: The act or forbearance has a monetary value, and consideration includes that monetary value
    order: LOW
    rule: F_MVOA IS_SET
    handler: python
  M_CMVOAF_A_AIROS:
    statement: The act or forbearance is in respect of the supply of goods or services or both
    order: HIGH
    interpretation: Is the act or forbearance given in respect of the supply?
    grounding:
    - F_LOATS
    - F_DOAG
    handler: light
  M_CMVOAF_A_AIRTS:
    statement: The act or forbearance is in response to the supply of goods or services or both
    order: HIGH
    interpretation: Is the act or forbearance given in response to the supply?
    grounding:
    - F_LOATS
    - F_DOAG
    handler: light
  M_CMVOAF_A_AFIOS:
    statement: The act or forbearance is for the inducement of the supply of goods or services or both
    order: HIGH
    interpretation: Is the act or forbearance given to induce the supply?
    grounding:
    - F_LOATS
    - F_DOAG
    handler: light
  M_CMVOAF_A_ABROO:
    statement: The act or forbearance is by the recipient or by any other person
    order: LOW
    rule: F_ROP IN ['RECIPIENT','OTHER_PERSON']
    handler: python
  M_CMVOAF_A_SOGOS:
    statement: The consideration is in relation to the supply of goods or services or both
    order: LOW
    rule: F_SIK IN ['GOODS','SERVICES','BOTH','CAPITAL_GOODS']
    handler: python
  M_CMVOAF_A_SGBG:
    statement: The item is a subsidy given by the Central Government or a State Government
    order: HIGH
    interpretation: Is the item a subsidy, and was it given by the Central Government or a State Government?
    grounding:
    - F_GGOS
    - F_NOS
    handler: heavy
  M_DOS_A_SMATTA:
    statement: '"Schedule" means a Schedule appended to this Act.'
    order: LOW
    rule: F_RSIA = TRUE
    handler: python
  M_DOS_A_CROM:
    statement: The context otherwise requires a different meaning for 'Schedule' in this Act.
    order: HIGH
    interpretation: Does the specific context in which 'Schedule' is used in this Act clearly indicate that it should not
      refer to a Schedule appended to this Act?
    grounding:
    - F_DCS
    handler: heavy
  M_BITCM_A_CDNROM:
    statement: In this Act the context does not require a meaning of business other than this inclusive definition
    order: HIGH
    interpretation: Does the provision in which business is used, or a related provision, require a meaning of business other
      than the inclusive definition, with UNKNOWN left unresolved
    grounding:
    - F_DCS
    handler: heavy
  M_BITCM_A_AIT:
    statement: The activity is a trade, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a trade in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIC:
    statement: The activity is commerce, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity commerce in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIM:
    statement: The activity is manufacture, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity manufacture in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIP:
    statement: The activity is a profession, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a profession in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIV:
    statement: The activity is a vocation, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a vocation in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIA:
    statement: The activity is an adventure, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity an adventure as the term is used in this Act
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIW:
    statement: The activity is a wager, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a wager in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIOS:
    statement: The activity is any other similar activity to those listed, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity similar in kind to trade, commerce, manufacture, profession, vocation, adventure
      or wager, the list being open and not exhaustive
    grounding:
    - F_AOTD
    handler: heavy
  M_BIIA_A_IIAOT:
    statement: The item is an activity or transaction
    order: HIGH
    interpretation: Is the described item an activity or a transaction?
    grounding:
    - F_AOTD
    handler: light
  M_BIIA_A_AICWSCA:
    statement: The activity or transaction is in connection with sub-clause (a)
    order: HIGH
    interpretation: Does the described activity or transaction have a connection with the activity described in sub-clause
      (a)?
    grounding:
    - F_AOTD
    - F_LCD
    handler: heavy
  M_BIIA_A_AITSCA:
    statement: The activity or transaction is incidental to sub-clause (a)
    order: HIGH
    interpretation: Is the described activity or transaction incidental to the activity described in sub-clause (a)?
    grounding:
    - F_AOTD
    - F_LCD
    handler: heavy
  M_BIIA_A_AATSCA:
    statement: The activity or transaction is ancillary to sub-clause (a)
    order: HIGH
    interpretation: Is the described activity or transaction ancillary to the activity described in sub-clause (a)?
    grounding:
    - F_AOTD
    - F_LCD
    handler: heavy
  M_BIIA_A_CDNROM:
    statement: The context does not otherwise require business to bear a meaning other than this inclusive definition
    order: HIGH
    interpretation: Does the provision or its context require business to bear a meaning other than this inclusive definition?
    grounding:
    - F_DCS
    - F_SCW
    handler: heavy
  M_BIAROF_A_CRNOM:
    statement: The context of the provision in which business is used does not otherwise require a different meaning from
      this definition
    order: HIGH
    interpretation: Does the provision in which business is used, or a related provision, require a meaning of business different
      from this definition?
    grounding:
    - F_DCS
    handler: light
  M_BIAROF_A_AINOSA:
    statement: The activity or transaction is in the nature of sub-clause (a), whether or not there is volume, frequency,
      continuity or regularity of such transaction
    order: HIGH
    interpretation: Is the activity or transaction of the nature described in sub-clause (a), without requiring any volume,
      frequency, continuity or regularity?
    grounding:
    - F_AOTD
    handler: heavy
  M_BISFCOC_A_NCCA:
    statement: Unless the context otherwise requires, the term business takes this inclusive meaning, so the context of the
      provision where business is used does not require a different meaning
    order: HIGH
    interpretation: Does the context of the provision in which business is used require a meaning other than this inclusive
      definition?
    grounding:
    - F_DCS
    handler: light
  M_BISFCOC_A_TIAS:
    statement: The transaction is a supply of the goods or services concerned, made by the person whose business is being
      tested
    order: LOW
    rule: F_SOAD = 'SUPPLY'
    handler: python
  M_BISFCOC_A_TIAA:
    statement: The transaction is an acquisition of the goods or services concerned, made by the person whose business is
      being tested
    order: LOW
    rule: F_SOAD = 'ACQUISITION'
    handler: python
  M_BISFCOC_A_SIGIC:
    statement: The supply or acquisition is of goods including capital goods
    order: LOW
    rule: F_SIK IN ['GOODS', 'CAPITAL_GOODS', 'BOTH']
    handler: python
  M_BISFCOC_A_SIS:
    statement: The supply or acquisition is of services
    order: LOW
    rule: F_SIK IN ['SERVICES', 'BOTH']
    handler: python
  M_BISFCOC_A_CWBC:
    statement: The supply or acquisition is in connection with commencement of business
    order: HIGH
    interpretation: Is this supply or acquisition in connection with the commencement of the business? Weigh the described
      activity against the business event.
    grounding:
    - F_BLES
    - F_AOTD
    handler: heavy
  M_BISFCOC_A_CWBC2:
    statement: The supply or acquisition is in connection with closure of business
    order: HIGH
    interpretation: Is this supply or acquisition in connection with the closure of the business? Weigh the described activity
      against the business event.
    grounding:
    - F_BLES
    - F_AOTD
    handler: heavy
  M_BICMF_A_CDNRO:
    statement: In this Act, the context does not otherwise require a different meaning of 'business' than the inclusive meaning
      in this clause
    order: HIGH
    interpretation: Does the provision in which 'business' is used, or a related provision, require a different meaning so
      that this inclusive meaning should not apply?
    grounding:
    - F_DCS
    - F_SCW
    handler: heavy
  M_BICMF_A_PICOSB:
    statement: The provision is made by a club, association, society, or any such body
    order: HIGH
    interpretation: Is the provider a club, association or society, or a body of the same kind as these, judged from its legal
      form and the activity it carries on?
