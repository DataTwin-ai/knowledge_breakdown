# GOVERNANCE MASTER TSG05_03 Advances (TG05 Time & Period)
# LAW ARC - 1 laws - status APPROVED
name: TSG05_03 Advances - GOVERNANCE MASTER rulebook
version: TSG05_03
facts:
  F_SPRD:
    name: Supplier Payment Receipt Date
    type: DATE
    tier: T1
  F_PSR:
    name: Payment Supply Reference
    type: TEXT
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_TOSGPD_A_SRPFS:
    statement: The supplier receives the payment with respect to the supply.
    order: HIGH
    if_false: No payment receipt by the supplier is recorded or the payment does not relate to this supply
    interpretation: Does the record show a date on which the supplier received a payment, and is that payment made with respect
      to this supply?
    grounding:
    - F_SPRD
    - F_PSR
    handler: light
groups: {}
outcomes:
  M_TOSGPD_LE_PRDC:
    outcome: The date on which the supplier receives the payment with respect to the supply is a candidate date for the time
      of supply of goods; the time of supply is the earlier of the candidate dates
    expr: M_TOSGPD_A_SRPFS
    module: M_TOSGPD
    description: When the supplier receives payment with respect to the supply, the receipt date becomes a candidate time
      of supply of goods. The earlier-of comparison with the other dates is made at parent level.
products:
  M_TOSGPD_PD_PRDC:
    statement: When the supplier receives payment with respect to the supply, the receipt date becomes a candidate time of
      supply of goods. The earlier-of comparison with the other dates is made at parent level.
compounds:
- id: C_TOSGPD
  question: 'Section 12(2)(b): Time Of Supply Goods Payment Date?'
  includes:
  - M_TOSGPD_LE_PRDC
  produces:
  - product: M_TOSGPD_PD_PRDC
    from:
    - M_TOSGPD_LE_PRDC
time:
  law_date: F_DOI
