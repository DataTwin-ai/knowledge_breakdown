predicates:
  M_CALS_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CALS_A_AIAI:
    statement: The competent authority is an authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the authority authorised under any law for the time being in force to issue a completion certificate?
    grounding:
    - F_IAUL
    handler: heavy
  M_CALS_A_CNRFA:
    statement: A completion certificate is not required from the Government or the authority authorised to issue it (non-requirement
      of such certificate from such authority)
    order: HIGH
    interpretation: Is there a non-requirement of a completion certificate from such authority for the property or work concerned?
    grounding:
    - F_CCR
    handler: light
  M_CALS_A_AILS:
    statement: The competent authority is a licensed surveyor of the respective local body of the city or town or village
      or development or planning authority
    order: HIGH
    interpretation: Is the person a licensed surveyor of the respective local body of the city or town or village or of the
      development or planning authority? The source wording is ambiguous on how the list attaches and is retained as written.
    grounding:
    - F_SLS2
    handler: heavy
  M_DOCACE_A_CAIG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_DOCACE_A_AULA:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue completion certificates under a law for the time being in
      force?
    grounding:
    - F_CIT
    handler: heavy
  M_DOCACE_A_CNRFA:
    statement: In case of non-requirement of such completion certificate from such authority, the certificate is not required
      from that authority
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_DOCACE_A_CERWI:
    statement: The competent authority is a chartered engineer registered with the Institution of Engineers (India)
    order: LOW
    rule: F_CERS = 'REGISTERED_IEI'
    handler: python
  M_CAA_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CAA_A_AAUL:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue a completion certificate under any law for the time being
      in force?
    grounding:
    - F_IAUL
    handler: light
  M_CAA_A_CNRFA:
    statement: A completion certificate is not required from the Government or authority authorised under any law to issue
      it
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_CAA_A_ARWC:
    statement: The competent authority is an architect registered with the Council of Architecture constituted under the Architects
      Act, 1972
    order: LOW
    rule: F_ACR = TRUE
    handler: python
  M_ROGBD_A_CDNO:
    statement: The context does not otherwise require a different meaning for 'removal' in this Act.
    order: HIGH
    interpretation: Does the surrounding legal text or specific provision context indicate that 'removal' should be interpreted
      differently than this definition?
    grounding:
    - F_DCS
    handler: light
  M_ROGBD_A_GAD:
    statement: There is a despatch of the goods.
    order: LOW
    rule: F_GDS = 'DESPATCHED'
    handler: python
  M_ROGBD_A_DIFD:
    statement: The despatch of the goods is for delivery.
    order: LOW
    rule: F_DP = 'DELIVERY'
    handler: python
  M_ROGBD_A_DBS:
    statement: The despatch of the goods for delivery is by the supplier thereof.
    order: LOW
    rule: F_DAR = 'SUPPLIER'
    handler: python
  M_ROGBD_A_DBSA:
    statement: The despatch of the goods for delivery is by any other person acting on behalf of such supplier.
    order: LOW
    rule: F_DAR = 'AGENT_OF_SUPPLIER'
    handler: python
  M_DOCSOG_A_CRDM:
    statement: The context in which the term continuous supply of goods is used in this Act otherwise requires a meaning different
      from this definition
    order: HIGH
    if_false: context does not require a different meaning
    interpretation: Does the wording or context of the provision of this Act where the term is used require a meaning of continuous
      supply of goods different from the one given in this definition?
    grounding:
    - F_SCW
    handler: heavy
  M_DOCSOG_A_SIASOG:
    statement: The supply is a supply of goods
    order: LOW
    rule: F_SIK IN ['GOODS','CAPITAL_GOODS']
    handler: python
  M_DOCSOG_A_GPCOR:
    statement: The supply of goods is provided continuously or on recurrent basis, whether or not by means of a wire, cable,
      pipeline or other conduit
    order: HIGH
    if_false: goods are not provided or are provided only once
    interpretation: From the contract, delivery schedule and invoices, are the goods actually being provided continuously
      or on a recurrent basis? The delivery means such as wire, cable or pipeline is irrelevant.
    grounding:
    - F_SDP
    - F_SES
    handler: light
  M_DOCSOG_A_GACOR:
    statement: The supply of goods is agreed to be provided continuously or on recurrent basis, whether or not by means of
      a wire, cable, pipeline or other conduit
    order: HIGH
    if_false: no agreement for continuous or recurrent provision
    interpretation: Do the contract or agreement terms provide that the goods are to be supplied continuously or on a recurrent
      basis? The delivery means such as wire, cable or pipeline is irrelevant.
    grounding:
    - F_SDP
    - F_SES
    handler: light
  M_DOCSOG_A_SIUAC:
    statement: The supply of goods is provided or agreed to be provided under a contract
    order: LOW
    rule: F_SIUC = TRUE
    handler: python
  M_DOCSOG_A_SIROP:
    statement: The supplier invoices the recipient on a regular or periodic basis for the supply of goods
    order: LOW
    rule: F_IP = 'REGULAR_OR_PERIODIC'
    handler: python
  M_DOCSOG_A_GSBGN:
    statement: The supply is a supply of such goods as the Government may by notification specify as included in continuous
      supply of goods
    order: HIGH
    if_false: no notification specifies these goods
    interpretation: Is there a Government notification under this definition that specifies the goods supplied as included
      in continuous supply of goods?
    grounding:
    - F_GNS
    handler: light
  M_DOCSOG_A_NCAM:
    statement: The conditions the Government has set by notification for the inclusion of such goods are met
    order: LOW
    rule: F_NCS IN ['MET','NO_CONDITIONS_SPECIFIED']
    handler: python
  M_DOVI_A_CDNROM:
    statement: Unless the context otherwise requires, the definition of 'voucher' applies.
    order: HIGH
    interpretation: Does the context of the provision where 'voucher' is used require a meaning different from the one in
      Section 2(118)?
    grounding:
    - F_DCS
    handler: heavy
  M_DOVI_A_TIIAI:
    statement: The item is an instrument.
    order: HIGH
    interpretation: Does the item being assessed qualify as an 'instrument' (e.g., a document or electronic record that gives
      rights)?
    grounding:
    - F_IIAI
    handler: light
  M_DOVI_A_OTAAC:
    statement: There is an obligation to accept the instrument as consideration or part consideration.
    order: HIGH
    interpretation: Do the terms of the instrument or related documentation create an obligation for a supplier to accept
      it as full or part payment?
    grounding:
    - F_OTAACE
    handler: light
  M_DOVI_A_CIFAS:
    statement: The consideration is for a supply of goods or services or both.
    order: LOW
    rule: F_SIK IN ['GOODS', 'SERVICES', 'BOTH']
    handler: python
  M_DOVI_A_SIOTI:
    statement: The goods or services or both to be supplied are indicated on the instrument itself.
    order: HIGH
    interpretation: Are the specific goods or services that can be redeemed identified on the face of the instrument?
    grounding:
    - F_SIOI
    handler: light
  M_DOVI_A_SIIRD:
    statement: The goods or services or both to be supplied are indicated in related documentation, including the terms and
      conditions of use of such instrument.
    order: HIGH
    interpretation: Are the specific goods or services that can be redeemed identified in documentation related to the instrument
      (e.g., its terms and conditions)?
    grounding:
    - F_SIIRD
    handler: light
  M_DOVI_A_SIOTI2:
    statement: The identities of potential suppliers are indicated on the instrument itself.
    order: HIGH
    interpretation: Are the identities of the potential suppliers who will accept the voucher identified on the face of the
      instrument?
    grounding:
    - F_SIOI2
    handler: light
  M_DOVI_A_SIIRD2:
    statement: The identities of potential suppliers are indicated in related documentation, including the terms and conditions
      of use of such instrument.
    order: HIGH
    interpretation: Are the identities of the potential suppliers who will accept the voucher identified in documentation
      related to the instrument (e.g., its terms and conditions)?
    grounding:
    - F_SIIRD2
    handler: light
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
