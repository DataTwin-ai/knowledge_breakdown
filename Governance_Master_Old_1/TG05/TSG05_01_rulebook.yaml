groups:
  M_CALS_G_PAA:
    name: Primary Authority Alternatives
    logic: ANY
    members:
    - M_CALS_A_AITG
    - M_CALS_A_AIAI
    description: The Government or any authority authorised to issue completion certificate under any law for the time being
      in force.
  M_CALS_G_SRC:
    name: Surveyor Route Conditions
    logic: ALL
    members:
    - M_CALS_A_CNRFA
    - M_CALS_A_AILS
    description: Where a completion certificate is not required from such authority - the licensed surveyor listed in the
      clause.
  M_DOCACE_G_GOAIR:
    name: Government Or Authorised Issuer Route
    logic: ANY
    members:
    - M_DOCACE_A_CAIG
    - M_DOCACE_A_AULA
    description: The competent authority is the Government or an authority authorised to issue the completion certificate
  M_DOCACE_G_ERCNR:
    name: Engineer Route Certificate Not Required
    logic: ALL
    members:
    - M_DOCACE_A_CNRFA
    - M_DOCACE_A_CERWI
    description: Where the certificate is not required from such authority, a chartered engineer registered with the Institution
      of Engineers (India) is the competent authority
  M_CAA_G_GOAA:
    name: Government Or Authorised Authority
    logic: ANY
    members:
    - M_CAA_A_AITG
    - M_CAA_A_AAUL
    description: The Government or any authority authorised under any law in force to issue a completion certificate
  M_CAA_G_RAR:
    name: Registered Architect Route
    logic: ALL
    members:
    - M_CAA_A_CNRFA
    - M_CAA_A_ARWC
    description: No certificate is required from such authority and the certifier is a registered architect
  M_ROGBD_G_DAIV:
    name: Despatch Actor Is Valid
    logic: ANY
    members:
    - M_ROGBD_A_DBS
    - M_ROGBD_A_DBSA
    description: The goods are despatched by either the supplier or their agent.
  M_DOCSOG_G_MOIR:
    name: Means Or Includes Routes
    logic: ANY
    members:
    - M_DOCSOG_G_CMDC
    - M_DOCSOG_G_NGIR
    description: Either the core means-definition conditions are met or the open includes-route for Government notified goods
      applies.
  M_DOCSOG_G_CMDC:
    name: Core Means Definition Conditions
    logic: ALL
    members:
    - M_DOCSOG_A_SIASOG
    - M_DOCSOG_G_POAC
    - M_DOCSOG_A_SIUAC
    - M_DOCSOG_A_SIROP
    description: All joint requirements of the means-part of the definition.
  M_DOCSOG_G_POAC:
    name: Provided Or Agreed Continuity
    logic: ANY
    members:
    - M_DOCSOG_A_GPCOR
    - M_DOCSOG_A_GACOR
    description: The supply is provided OR agreed to be provided continuously or on recurrent basis - either event is enough
      and both are not required.
  M_DOCSOG_G_NGIR:
    name: Notified Goods Inclusion Route
    logic: ALL
    members:
    - M_DOCSOG_A_GSBGN
    - M_DOCSOG_A_NCAM
    description: 'Open inclusion: supply of goods the Government specifies by notification, subject to the conditions it sets.'
  M_DOVI_G_SOSII:
    name: Supply Or Supplier Is Indicated
    logic: ANY
    members:
    - M_DOVI_G_SDAI
    - M_DOVI_G_SDAI2
  M_DOVI_G_SDAI:
    name: Supply Details Are Indicated
    logic: ANY
    members:
    - M_DOVI_A_SIOTI
    - M_DOVI_A_SIIRD
  M_DOVI_G_SDAI2:
    name: Supplier Details Are Indicated
    logic: ANY
    members:
    - M_DOVI_A_SIOTI2
    - M_DOVI_A_SIIRD2
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_DORE_G_RFC:
    name: Return Furnishing Criteria
    logic: ALL
    members:
    - M_DORE_G_RT
    - M_DORE_G_RS
    description: A return must meet both type and source requirements.
  M_DORE_G_RT:
    name: Return Type
    logic: ANY
    members:
    - M_DORE_A_RIP
    - M_DORE_A_RIOR
    description: A return must either be prescribed or otherwise required.
  M_DORE_G_RS:
    name: Requirement Source
    logic: ANY
    members:
    - M_DORE_A_RRBA
    - M_DORE_A_RRBR
    description: The requirement to furnish the return must come from the Act or the Rules.
  M_DOD_G_DFA:
    name: Document Form Alternatives
    logic: ANY
    members:
    - M_DOD_A_DIWOPR
    - M_DOD_A_DIER
    - M_DOD_A_RWOM
    description: At least one form of record must be shown
  M_RCD_G_LBFRC:
    name: Legal Basis For Reverse Charge
    logic: ANY
    members:
    - M_RCD_A_LAUCAS93
    - M_RCD_A_LAUCAS94
    - M_RCD_A_LAUIAS53
    - M_RCD_A_LAUIAS54
  M_DOGO_G_GBCD:
    name: Goods By Core Definition
    logic: ALL
    members:
    - M_DOGO_A_TIIMP
    - M_DOGO_A_TIINM
    - M_DOGO_A_TIINS
  M_DOGO_G_GBSI:
    name: Goods By Specific Inclusion
    logic: ANY
    members:
    - M_DOGO_A_TIIAAC
    - M_DOGO_A_TIIGC
    - M_DOGO_A_TIIG
    - M_DOGO_G_ATLAATBS
  M_DOGO_G_ATLAATBS:
    name: Attached To Land And Agreed To Be Severed
    logic: ALL
    members:
    - M_DOGO_A_IIATL
    - M_DOGO_A_IIATBS
  M_DOCOA_G_DMC:
    name: Defined Meaning Conditions
    logic: ALL
    members:
    - M_DOCOA_A_CDNROM
    - M_DOCOA_A_ANBG
    description: Both the context test and the notification test must hold for the defined meaning
  M_PIAOP_G_EIAOB:
    name: Entity Is AOP Or BOI
    logic: ANY
    members:
    - M_PIAOP_A_EIAAOP
    - M_PIAOP_A_EIABOI
  M_PISCOGC_G_EISCOGC:
    name: Entity Is Statutory Corp Or Govt Co
    logic: ANY
    members:
    - M_PISCOGC_A_EIASC
    - M_PISCOGC_A_EIAGC
    description: The entity is either a statutory corporation or a Government company.
  M_PIFBC_G_FBCC:
    name: Foreign Body Corporate Conditions
    logic: ALL
    members:
    - M_PIFBC_A_EIBC
    - M_PIFBC_A_BCIOI
    description: All conditions for a foreign body corporate to be included in the definition of 'person'.
  M_PICOSG_G_IAGE:
    name: Is A Government Entity
    logic: ANY
    members:
    - M_PICOSG_A_PICG
    - M_PICOSG_A_PISG
    description: Checks if the entity is either the Central Government or a State Government.
  M_RCGTID_G_SIOLD:
    name: Supplier Invoice Or Lieu Document
    logic: ANY
    members:
    - M_RCGTID_A_IIBS
    - M_RCGTID_A_LDIBS
    description: Either an invoice or any other document in lieu of it was issued by the supplier
  M_TOSGRRD_G_RCRC:
    name: Reverse Charge Receipt Conditions
    logic: ALL
    members:
    - M_TOSGRRD_A_SURCB
    - M_TOSGRRD_A_GRDIL
    - M_TOSGRRD_A_RDIEL
    description: All three must hold - reverse charge supply, a goods receipt date exists, and that date is the earliest of
      the listed dates.
  M_FTOSGRB_A_TNDUC:
    name: Any of the referred steps (M_FTOSGRB_A_TNDUC)
    logic: ANY
    members:
    - M_RCGTID_PD_CCCDA
    - M_TOSGRCP_PD_TOSBD
    - M_TOSGRCP_PD_TOSBD2
    - M_TOSGRRD_PD_RDITOS
    description: TRUE when any step of the law this check refers to is TRUE
  M_FTOSGRB_G_BFTM:
    name: Both Fallback Tests Met
    logic: ALL
    members:
    - M_FTOSGRB_A_TNDUC
    - M_FTOSGRB_A_RBED
    description: Non-determinability under the clauses and the recipient books entry must both hold.
  M_TOSGPD_G_PRTT:
    name: Payment Receipt Tests Together
    logic: ALL
    members:
    - M_TOSGPD_A_PRFS
    - M_TOSGPD_A_PRDIR
    description: The supplier receives payment with respect to the supply AND the date of that receipt is established.
  M_EAOGTOS_G_PCA:
    name: Proviso Conditions All
    logic: ALL
    members:
    - M_EAOGTOS_A_SOTG
    - M_EAOGTOS_A_SREA
    - M_EAOGTOS_A_EUTOT
    - M_EAOGTOS_A_SEID
    description: All four proviso conditions must hold together.
  M_VSTOSRD_G_VSC:
    name: Voucher Supply Case
    logic: ALL
    members:
    - M_TOSVI_A_SOVBS
    - M_VSTOSRD_A_SFIOC
    description: Both the voucher-by-supplier condition and the all-other-cases condition must hold.
  M_TOSSVI_G_VTRC:
    name: Voucher Time Rule Conditions
    logic: ALL
    members:
    - M_GVTOSR_A_SIVBS
    - M_TOSVI_A_SIAI
    description: Both the voucher supply condition and the identifiability condition must be met.
outcomes:
  M_CALS_LE_CADM:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CALS_G_PAA OR M_CALS_G_SRC
    module: M_CALS
    description: The expression competent authority is satisfied by either the primary authority route or the licensed surveyor
      route.
  M_DOCACE_LE_CADO:
    outcome: COMPETENT_AUTHORITY_DEFINED
    expr: M_DOCACE_G_GOAIR OR M_DOCACE_G_ERCNR
    module: M_DOCACE
    description: The entity is a competent authority for paragraph 5(b) under the exhaustive definition
  M_CAA_LE_CAO:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CAA_G_GOAA OR M_CAA_G_RAR
    module: M_CAA
    description: The certifying body is a competent authority if it is the Government or an authority authorised under law,
      or if no certificate is required from such authority and it is a registered architect
  M_ROGBD_LE_RDM:
    outcome: REMOVAL_DEFINITION_MET
    expr: M_ROGBD_A_CDNO AND M_ROGBD_A_GAD AND M_ROGBD_A_DIFD AND M_ROGBD_G_DAIV
    module: M_ROGBD
    description: The definition of 'removal' for goods is met.
  M_DOCSOG_LE_CSOGO:
    outcome: IS_CONTINUOUS_SUPPLY_OF_GOODS
    expr: NOT M_DOCSOG_A_CRDM AND M_DOCSOG_G_MOIR
    module: M_DOCSOG
    description: The definition is met when the context does not require otherwise and either the means-core conditions or
      the notified-goods inclusion route is satisfied.
  M_DOVI_LE_OIV:
    outcome: IS_VOUCHER
    expr: M_DOVI_A_CDNROM AND M_DOVI_A_TIIAI AND M_DOVI_A_OTAAC AND M_DOVI_A_CIFAS AND M_DOVI_G_SOSII
    module: M_DOVI
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_DORE_LE_IAR:
    outcome: IS_A_RETURN
    expr: NOT M_DORE_A_CROM AND M_DORE_G_RFC
    module: M_DORE
    description: Determines if a document qualifies as a 'return' as per Section 2(97).
  M_DOD_LE_DMA:
    outcome: DOCUMENT_MEANING_APPLIES
    expr: M_DOD_A_CDNROM AND M_DOD_G_DFA
    module: M_DOD
    description: The defined meaning of document applies where the context does not otherwise require and at least one document
      form is shown
  M_RCD_LE_DORCIM:
    outcome: IS_REVERSE_CHARGE
    expr: M_RCD_A_CDNROM AND M_RCD_G_LBFRC
    module: M_RCD
  M_DOGO_LE_DOIAG:
    outcome: IS_GOODS
    expr: M_DOGO_A_CDNROM AND (M_DOGO_G_GBCD OR M_DOGO_G_GBSI)
    module: M_DOGO
  M_DOCOA_LE_CAD:
    outcome: DEFINED_MEANING
    expr: M_DOCOA_G_DMC
    module: M_DOCOA
    description: The defined meaning applies where the context does not require otherwise and the authority is notified by
      the Government
  M_DOCOA_LE_COD:
    outcome: CONTEXT_MEANING_APPLIES
    expr: NOT M_DOCOA_A_CDNROM
    module: M_DOCOA
    description: The definition does not govern the term where the context requires another meaning
  M_DOG_LE_GDM:
    outcome: IS_GOVERNMENT_AS_DEFINED
    expr: M_DOG_A_ITCG AND M_DOG_A_CDNROM
    module: M_DOG
    description: Determines if an entity qualifies as 'Government' according to Section 2(53).
  M_DOPI_LE_PDII:
    outcome: PERSON_INCLUDES_INDIVIDUAL
    expr: M_DOPI_A_PII AND M_DOPI_A_CDNO
    module: M_DOPI
    description: Determines if an individual is considered a 'person' under this specific inclusive definition, considering
      the context.
  M_PIHUF_LE_PIH:
    outcome: PERSON_INCLUDES_HUF
    expr: M_PIHUF_A_EIHUF
    module: M_PIHUF
    description: This clause contributes to the definition of 'person' by including a Hindu Undivided Family.
  M_PIC_LE_CIP:
    outcome: ENTITY_IS_PERSON_VIA_COMPANY
    expr: M_PIC_A_EIAC
    module: M_PIC
  M_DOPF_LE_PIF:
    outcome: IS_PERSON
    expr: M_DOPF_A_AFIIITDOP
    module: M_DOPF
  M_PILLP_LE_LIIP:
    outcome: IS_PERSON
    expr: M_PILLP_A_LLPIP AND M_PILLP_A_CAI
    module: M_PILLP
  M_PIAOP_LE_IAPUS84F:
    outcome: IS_PERSON_UNDER_S2_84_f
    expr: M_PIAOP_A_CDNRDM AND M_PIAOP_G_EIAOB
    module: M_PIAOP
  M_PISCOGC_LE_IIIPDS84G:
    outcome: IS_INCLUDED_IN_PERSON_DEFINITION_S2_84_g
    expr: M_PISCOGC_A_CDNRO AND M_PISCOGC_G_EISCOGC
    module: M_PISCOGC
    description: The entity is included in the definition of 'person' under Section 2(84)(g).
  M_PIFBC_LE_PIFBC:
    outcome: PERSON_INCLUDED
    expr: M_PIFBC_G_FBCC AND M_PIFBC_A_DAUCRO
    module: M_PIFBC
    description: Determines if an entity is considered a 'person' under this Act because it is a body corporate incorporated
      outside India, unless the context otherwise requires.
  M_PICS_LE_CSIP:
    outcome: M_PICS_PD_IPCS
    expr: M_PICS_A_CDNOR AND M_PICS_A_EIRCS
    module: M_PICS
    description: This LE determines if a co-operative society is considered a 'person' under this specific sub-clause, subject
      to contextual requirements.
  M_PILA_LE_LAIP:
    outcome: ENTITY_IS_PERSON
    expr: M_PILA_A_UTCOR AND M_PILA_A_PIALA
    module: M_PILA
    description: Determines if an entity is considered a 'person' under this specific inclusive definition.
  M_PICOSG_LE_GEIAP:
    outcome: PERSON_INCLUDED
    expr: M_PICOSG_A_CDNOR AND M_PICOSG_G_IAGE
    module: M_PICOSG
    description: Determines if a Central or State Government is included in the definition of 'person' under this clause,
      considering contextual requirements.
  M_PIS_LE_P:
    outcome: PERSON_INCLUDES_SOCIETY
    expr: M_PIS_A_EIAS AND M_PIS_A_CDNRO
    module: M_PIS
    description: Determines if a society is included in the definition of 'person' based on the Act and context.
  M_PIT_LE_PDI:
    outcome: PERSON_INCLUDED
    expr: M_PIT_A_PIT AND M_PIT_A_CDNRO
    module: M_PIT
    description: Determines if a trust is included in the definition of 'person' based on the explicit inclusion and contextual
      requirements.
  M_PIAJP_LE_P:
    outcome: PERSON_INCLUDES_AJP
    expr: M_PIAJP_A_EIAAJP AND M_PIAJP_A_ANIPC
    module: M_PIAJP
    description: Determines if an entity qualifies as an artificial juridical person under this specific clause of the definition
      of 'person', subject to contextual requirements.
  M_DONAN_LE_ND:
    outcome: NOTIFICATION_DEFINED
    expr: M_DONAN_A_NMPIOG AND (NOT M_DONAN_A_DAUCRO)
    module: M_DONAN
    description: Determines if a given item qualifies as a 'notification' under the Act, subject to contextual override.
  M_DONAN_LE_RTI:
    outcome: RELATED_TERMS_INTERPRETED
    expr: M_DONAN_A_NANCA AND (NOT M_DONAN_A_DAUCRO)
    module: M_DONAN
    description: Provides the rule for construing 'notify' and 'notified' based on the definition of 'notification' and contextual
      override.
  M_GVTOSR_LE_TOSIRD:
    outcome: The time of supply is the date of redemption of the voucher (value taken from F_VRD)
    expr: M_GVTOSR_A_SIVBS AND M_GVTOSR_A_CIOTPC
    module: M_GVTOSR
    description: Where the supply is a supply of vouchers by a supplier and the case is one of the 'all other cases', the
      time of supply shall be the voucher redemption date.
  M_TOSVI_LE_TOSVID:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_ISSUE_DATE
    expr: M_TOSVI_A_SOVBS AND M_TOSVI_A_SIAI
    module: M_TOSVI
    description: 'The time of supply is the date of issue of the voucher when both conditions hold: it is a supply of vouchers
      by a supplier, and the supply is identifiable at the point of issue.'
  M_TOSGAIP_LE_SRSA:
    outcome: SUPPLIER_RECEIVES_SUCH_ADDITION
    expr: M_TOSGAIP_A_SRSA
    module: M_TOSGAIP
    description: The supplier receives such addition in value, and the date of that receipt fixes the time of supply of the
      addition (Section 12(6), part of the law)
  M_RCGTID_LE_CCCDA:
    outcome: CLAUSE_C_CANDIDATE_DATE
    expr: M_RCGTID_A_SORCB AND M_RCGTID_G_SIOLD AND M_RCGTID_A_DFTDC
    module: M_RCGTID
    description: The clause (c) date is a candidate for the time of supply when the supply is under reverse charge and the
      supplier issued an invoice or a document in lieu of it
  M_TOSGRRD_LE_RDITOS:
    outcome: TIME_OF_SUPPLY_IS_GOODS_RECEIPT_DATE
    expr: M_TOSGRRD_G_RCRC
    module: M_TOSGRRD
    description: On a reverse charge supply the time of supply is the date of receipt of goods when that date is the earliest
      of the listed dates.
  M_TOSGRCP_LE_TOSBD:
    outcome: TIME_OF_SUPPLY_IS_BOOKS_PAYMENT_DATE
    expr: M_TOSGRCP_A_SIORC AND M_TOSGRCP_A_BPDIE
    module: M_TOSGRCP
    description: For a reverse charge supply where the books payment date is the same as or earlier than the bank debit date,
      the time of supply is the date of payment entered in the recipient's books.
  M_TOSGRCP_LE_TOSBD2:
    outcome: TIME_OF_SUPPLY_IS_BANK_DEBIT_DATE
    expr: M_TOSGRCP_A_SIORC AND M_TOSGRCP_A_BDDIE
    module: M_TOSGRCP
    description: For a reverse charge supply where the bank debit date is earlier than the books payment date, the time of
      supply is the date on which the payment is debited in the recipient's bank account.
  M_FTOSGRB_LE_FTA:
    outcome: TIME_OF_SUPPLY_FALLBACK
    expr: M_FTOSGRB_G_BFTM
    module: M_FTOSGRB
    description: Fallback applies only when the non-determinability condition and the recipient books entry both hold.
  M_TOSGPD_LE_PDICD:
    outcome: PAYMENT_RECEIPT_DATE_IS_CANDIDATE_TIME_OF_SUPPLY
    expr: M_TOSGPD_A_SIOG AND M_TOSGPD_G_PRTT
    module: M_TOSGPD
    description: For a supply of goods where the supplier receives payment with respect to the supply, the date of that receipt
      is the date offered by this clause as the time of supply. Under the parent chapeau it is the earlier of the listed dates.
  M_TOSGID_LE_TIIID:
    outcome: TIME_OF_SUPPLY_IS_INVOICE_ISSUE_DATE
    expr: M_TOSGID_A_IIOOBDD
    module: M_TOSGID
    description: The time of supply of goods is the date of issue of the invoice by the supplier. This applies when that date
      is not later than the section 31 last date, and on a tie both dates are the same.
  M_TOSGID_LE_TIS31LD:
    outcome: TIME_OF_SUPPLY_IS_LAST_DATE_TO_ISSUE_INVOICE
    expr: M_TOSGID_A_S31DIE
    module: M_TOSGID
    description: The time of supply of goods is the last date on which the supplier is required under section 31 to issue
      the invoice. This applies when that date is earlier than the invoice issue date.
  M_LTPTOG_LE_GTLAAS:
    outcome: LIABILITY_TO_PAY_TAX_ON_GOODS_ARISES_AT_TIME_OF_SUPPLY
    expr: M_LTPTOG_A_SIOG AND M_LTPTOG_A_TOSDUS
    module: M_LTPTOG
    description: For a supply of goods, the liability to pay tax arises at the time of supply, once that time is determined
      under the provisions of this section.
  M_EAOGTOS_LE_ETOS:
    outcome: TIME_OF_SUPPLY_EXCESS_INVOICE_DATE
    expr: M_EAOGTOS_G_PCA
    module: M_EAOGTOS
    description: The excess-amount time of supply outcome applies only when all proviso conditions hold together.
  M_VSTOSRD_LE_VRDT:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_REDEMPTION_DATE
    expr: M_VSTOSRD_G_VSC
    module: M_VSTOSRD
    description: Where the supply is of vouchers by a supplier and falls in all other cases, the time of supply is the date
      of redemption of the voucher.
  M_TOSSVI_LE_TOSIVID:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_ISSUE_DATE
    expr: M_TOSSVI_G_VTRC
    module: M_TOSSVI
    description: The time of supply shall be the date of issue of the voucher when the supply is a supply of vouchers by a
      supplier and is identifiable at that point.
triggers:
  M_FTOSGRB_CT_DRR:
    question: Does the time of supply determination record show whether clause (a), clause (b) or clause (c) fixes the time
      of supply?
    trigger: F_TDUC = 'UNKNOWN'
    beside: M_FTOSGRB_LE_FTA
