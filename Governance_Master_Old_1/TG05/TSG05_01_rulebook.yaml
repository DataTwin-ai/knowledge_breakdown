    statement: Determines if a society is included in the definition of 'person' based on the Act and context.
  M_PIT_PD_PDI:
    statement: Determines if a trust is included in the definition of 'person' based on the explicit inclusion and contextual
      requirements.
  M_PIAJP_PD_P:
    statement: Determines if an entity qualifies as an artificial juridical person under this specific clause of the definition
      of 'person', subject to contextual requirements.
  M_DONAN_PD_ND:
    statement: Determines if a given item qualifies as a 'notification' under the Act, subject to contextual override.
  M_DONAN_PD_RTI:
    statement: Provides the rule for construing 'notify' and 'notified' based on the definition of 'notification' and contextual
      override.
  M_GVTOSR_PD_TOSIRD:
    statement: Where the supply is a supply of vouchers by a supplier and the case is one of the 'all other cases', the time
      of supply shall be the voucher redemption date.
  M_TOSVI_PD_TOSVID:
    statement: 'The time of supply is the date of issue of the voucher when both conditions hold: it is a supply of vouchers
      by a supplier, and the supply is identifiable at the point of issue.'
  M_TOSGAIP_PD_SRSA:
    statement: The supplier receives such addition in value, and the date of that receipt fixes the time of supply of the
      addition
  M_RCGTID_PD_CCCDA:
    statement: The clause (c) date is a candidate for the time of supply when the supply is under reverse charge and the supplier
      issued an invoice or a document in lieu of it
  M_TOSGRRD_PD_RDITOS:
    statement: On a reverse charge supply the time of supply is the date of receipt of goods when that date is the earliest
      of the listed dates.
  M_TOSGRCP_PD_TOSBD:
    statement: For a reverse charge supply where the books payment date is the same as or earlier than the bank debit date,
      the time of supply is the date of payment entered in the recipient's books.
  M_TOSGRCP_PD_TOSBD2:
    statement: For a reverse charge supply where the bank debit date is earlier than the books payment date, the time of supply
      is the date on which the payment is debited in the recipient's bank account.
  M_FTOSGRB_PD_FTA:
    statement: Fallback applies only when the non-determinability condition and the recipient books entry both hold.
  M_TOSGPD_PD_PDICD:
    statement: For a supply of goods where the supplier receives payment with respect to the supply, the date of that receipt
      is the date offered by this clause as the time of supply. Under the parent chapeau it is the earlier of the listed dates.
  M_TOSGID_PD_TIIID:
    statement: The time of supply of goods is the date of issue of the invoice by the supplier. This applies when that date
      is not later than the section 31 last date, and on a tie both dates are the same.
  M_TOSGID_PD_TIS31LD:
    statement: The time of supply of goods is the last date on which the supplier is required under section 31 to issue the
      invoice. This applies when that date is earlier than the invoice issue date.
  M_LTPTOG_PD_GTLAAS:
    statement: For a supply of goods, the liability to pay tax arises at the time of supply, once that time is determined
      under the provisions of this section.
  M_EAOGTOS_PD_ETOS:
    statement: The excess-amount time of supply outcome applies only when all proviso conditions hold together.
  M_VSTOSRD_PD_VRDT:
    statement: Where the supply is of vouchers by a supplier and falls in all other cases, the time of supply is the date
      of redemption of the voucher.
  M_TOSSVI_PD_TOSIVID:
    statement: The time of supply shall be the date of issue of the voucher when the supply is a supply of vouchers by a supplier
      and is identifiable at that point.
