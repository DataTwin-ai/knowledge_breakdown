predicates:
  M_CALS_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CALS_A_AIAI:
    statement: The competent authority is an authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the authority authorised under any law for the time being in force to issue a completion certificate?
    grounding:
    - F_IAUL
    handler: heavy
  M_CALS_A_CNRFA:
    statement: A completion certificate is not required from the Government or the authority authorised to issue it (non-requirement
      of such certificate from such authority)
    order: HIGH
    interpretation: Is there a non-requirement of a completion certificate from such authority for the property or work concerned?
    grounding:
    - F_CCR
    handler: light
  M_CALS_A_AILS:
    statement: The competent authority is a licensed surveyor of the respective local body of the city or town or village
      or development or planning authority
    order: HIGH
    interpretation: Is the person a licensed surveyor of the respective local body of the city or town or village or of the
      development or planning authority? The source wording is ambiguous on how the list attaches and is retained as written.
    grounding:
    - F_SLS2
    handler: heavy
  M_DOCACE_A_CAIG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_DOCACE_A_AULA:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue completion certificates under a law for the time being in
      force?
    grounding:
    - F_CIT
    handler: heavy
  M_DOCACE_A_CNRFA:
    statement: In case of non-requirement of such completion certificate from such authority, the certificate is not required
      from that authority
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_DOCACE_A_CERWI:
    statement: The competent authority is a chartered engineer registered with the Institution of Engineers (India)
    order: LOW
    rule: F_CERS = 'REGISTERED_IEI'
    handler: python
  M_CAA_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CAA_A_AAUL:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue a completion certificate under any law for the time being
      in force?
    grounding:
    - F_IAUL
    handler: light
  M_CAA_A_CNRFA:
    statement: A completion certificate is not required from the Government or authority authorised under any law to issue
      it
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_CAA_A_ARWC:
    statement: The competent authority is an architect registered with the Council of Architecture constituted under the Architects
      Act, 1972
    order: LOW
    rule: F_ACR = TRUE
    handler: python
  M_CSOSD_A_CDNOM:
    statement: The context in which continuous supply of services is used in this Act does not require a meaning different
      from the one given in this definition
    order: HIGH
    interpretation: Does the wording of the provision in which the term is used require a different meaning for continuous
      supply of services than the one given in this definition?
    grounding:
    - F_SCW
    handler: heavy
  M_CSOSD_A_SIOS:
    statement: The supply is a supply of services
    order: LOW
    rule: F_SIK = 'SERVICES'
    handler: python
  M_CSOSD_A_POATBP:
    statement: The supply of services is provided, or agreed to be provided
    order: LOW
    rule: F_SES IN ['MADE', 'AGREED_TO_BE_MADE', 'BOTH']
    handler: python
  M_CSOSD_A_PCOR:
    statement: The supply of services is provided, or agreed to be provided, continuously or on recurrent basis
    order: LOW
    rule: F_SDP IN ['CONTINUOUS_OR_RECURRENT', 'CONTINUOUS_OR_RECURRENT']
    handler: python
  M_CSOSD_A_PUAC:
    statement: The supply of services is provided, or agreed to be provided, under a contract
    order: LOW
    rule: F_SIUC = TRUE
    handler: python
  M_CSOSD_A_PETM:
    statement: The supply of services is provided, or agreed to be provided, for a period exceeding three months
    order: LOW
    rule: F_SPIM > 3
    handler: python
  M_CSOSD_A_PPOE:
    statement: The supply of services is with periodic payment obligations
    order: LOW
    rule: F_POT = 'PERIODIC'
    handler: python
  M_CSOSD_A_SIGN:
    statement: The supply is of such services as the Government has specified, by notification, to be included in continuous
      supply of services
    order: HIGH
    interpretation: Does a Government notification specify the services supplied here as included in continuous supply of
      services?
    grounding:
    - F_DOS2
    - F_GND
    handler: heavy
  M_CSOSD_A_NCAS:
    statement: The conditions, if any, that the Government has specified by notification for the included services are satisfied
    order: HIGH
    interpretation: Does the supply meet each condition set out in the relevant notification?
    grounding:
    - F_GND
    - F_DOS2
    handler: light
  M_PMBR_A_PBRUA:
    statement: The matter is prescribed by rules made under this Act
    order: LOW
    rule: F_RMUA = TRUE
    handler: python
  M_PMBR_A_ROCR:
    statement: The rules are made on the recommendations of the Council
    order: LOW
    rule: F_CRSFR = 'RECOMMENDED'
    handler: python
  M_PMBR_A_COROM:
    statement: The context in which 'prescribed' is used otherwise requires a meaning different from the rules and Council
      definition
    order: HIGH
    interpretation: Does the context of this provision otherwise require 'prescribed' to have a meaning other than prescribed
      by rules made under this Act on the recommendations of the Council?
    grounding:
    - F_SCW
    handler: heavy
  M_SITIS_A_SIST:
    statement: The expression 'services' includes facilitating or arranging transactions in securities.
    order: HIGH
    interpretation: Does the activity constitute facilitating or arranging transactions in securities?
    grounding:
    - F_AOTD
    handler: heavy
    valid_from: '2019-02-01'
  M_DOS2_A_DAUCRO:
    statement: The definition of 'services' in Section 2(102) applies, as the context does not require a different meaning.
    order: HIGH
    interpretation: Does the context in which the term 'services' is used in the Act require a different meaning than the
      one given in Section 2(102)?
    grounding:
    - F_DCS
    handler: heavy
  M_DOS2_A_TSING:
    statement: The subject of the transaction is not 'goods'.
    order: HIGH
    interpretation: Based on the item's nature and the definition in Section 2(52), is the item classified as 'goods'?
    grounding:
    - F_SIK
    handler: light
  M_DOS2_A_TSINM:
    statement: The subject of the transaction is not 'money'.
    order: HIGH
    interpretation: Based on the item's nature and the definition in Section 2(75), is the item classified as 'money'?
    grounding:
    - F_IIM
    handler: light
  M_DOS2_A_TSINS:
    statement: The subject of the transaction is not 'securities'.
    order: HIGH
    interpretation: Based on the item's nature and the definition in Section 2(101), is the item classified as 'securities'?
    grounding:
    - F_IIS
    handler: light
  M_DOS2_A_ARTUOCOM:
    statement: The activity relates to the use of money or its conversion by cash or by any other mode, from one form, currency
      or denomination, to another.
    order: HIGH
    interpretation: Does the described activity relate to the use of money or its conversion (e.g., currency exchange, forex
      services, arranging loans)?
    grounding:
    - F_PAD
    handler: heavy
  M_DOS2_A_SCICFTA:
    statement: A separate consideration is charged for the activity.
    order: LOW
    rule: F_SCICFA = TRUE
    handler: python
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
