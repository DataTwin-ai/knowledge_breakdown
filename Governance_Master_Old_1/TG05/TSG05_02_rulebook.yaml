    statement: The supplier has issued an invoice for the supply of services, so a date of issue of invoice by the supplier
      exists
    order: LOW
    rule: F_DOII IS_SET
    handler: python
  M_EOIOPFS_A_IIWS31P:
    statement: The invoice is issued within the period prescribed under section 31
    order: LOW
    rule: F_IITS = 'ON_OR_BEFORE_DUE_DATE'
    handler: python
  M_EOIOPFS_A_PRDE:
    statement: Payment has been received for the supply of services, so a date of receipt of payment exists
    order: LOW
    rule: F_SPRD IS_SET
    handler: python
  M_EOIOPFS_A_IDNLTP:
    statement: The date of issue of invoice by the supplier is not later than the date of receipt of payment, so the invoice
      date is the earlier date
    order: LOW
    rule: F_IPDO = 'INVOICE_NOT_LATER'
    handler: python
  M_EOIOPFS_A_PDETI:
    statement: The date of receipt of payment is earlier than the date of issue of invoice by the supplier, so the payment
      date is the earlier date
    order: LOW
    rule: F_IPDO = 'PAYMENT_EARLIER'
    handler: python
  M_DOROPD_A_PEIB:
    statement: The payment is entered in the books of account of the supplier, giving a books entry date
    order: LOW
    rule: F_PBED IS_SET
    handler: python
  M_DOROPD_A_PCTB:
    statement: The payment is credited to the bank account of the supplier, giving a bank credit date
    order: LOW
    rule: F_PBCD IS_SET
    handler: python
  M_TOSOSPD_A_INIIP:
    statement: The invoice is not issued within the period prescribed under section 31
    order: LOW
    rule: F_IITS = 'AFTER_DUE_DATE'
    handler: python
  M_TOSOSPD_A_PRDE:
    statement: A date of receipt of payment exists for the service
    order: LOW
    rule: F_SPRD IS_SET
    handler: python
  M_TOSOSPD_A_PDNLTP:
    statement: The date of provision of service is earlier than or the same as the date of receipt of payment
    order: LOW
    rule: F_PDOS = 'PROVISION_NOT_LATER'
    handler: python
  M_RCSPD_A_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_RCSPD_A_PDEIRB:
    statement: A date of payment is entered in the books of account of the recipient
    order: LOW
    rule: F_PDIRB IS_SET
    handler: python
  M_RCSPD_A_PDIRB:
    statement: The payment is debited in the recipient's bank account on a date
    order: LOW
    rule: F_PDDIB IS_SET
    handler: python
  M_RCSPD_A_BPDIE:
    statement: The date of payment as entered in the books of account of the recipient is earlier than or the same as the
      date on which the payment is debited in the recipient's bank account
    order: LOW
    rule: F_PDO = 'BOOKS_EARLIER_OR_SAME'
    handler: python
  M_RCSPD_A_BDDIE:
    statement: The date on which the payment is debited in the recipient's bank account is earlier than the date of payment
      as entered in the books of account of the recipient
    order: LOW
    rule: F_PDO = 'BANK_EARLIER'
    handler: python
  M_RCSISD_A_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_RCSISD_A_SIIFS:
    statement: An invoice has been issued by the supplier for the supply.
    order: LOW
    rule: F_DOII IS_SET
    handler: python
  M_RCSISD_A_SILD:
    statement: Any other document, by whatever name called, in lieu of an invoice has been issued by the supplier.
    order: LOW
    rule: F_LDID IS_SET AND F_LDIS = 'SUPPLIER'
    handler: python
  M_RCSISD_A_CIDASD:
    statement: The candidate time of supply is the date immediately following sixty days from the date of issue of the invoice
      or of the document in lieu of it.
    order: LOW
    rule: F_CCCD IS_SET
    handler: python
  M_TOSOSEA_A_SOTS:
    statement: The supply is a taxable service and the person receiving the excess amount is the supplier of that taxable
      service
    order: HIGH
    interpretation: Is the supply a service (not goods only) that is taxable, and is the person who receives the amount its
      supplier?
    grounding:
    - F_SIK
    - F_DOS
    handler: heavy
  M_TOSOSEA_A_ARIEOI:
    statement: The supplier receives an amount in excess of the amount indicated in the tax invoice
    order: LOW
    rule: F_SEA > 0
    handler: python
  M_TOSOSEA_A_EAUTTR:
    statement: The amount received in excess of the amount indicated in the tax invoice is up to one thousand rupees
    order: LOW
    rule: F_SEA <= 1000
    handler: python
  M_TOSOSEA_A_SETO:
    statement: The said supplier opts, at the supplier's option, to treat the time of supply to the extent of the excess amount
      as the date of issue of invoice relating to that excess amount
    order: LOW
    rule: F_SOE = TRUE
    handler: python
  M_TOSSRBE_A_SRBER:
    statement: The date of entry of the supply in the books of account of the recipient of supply is recorded
    order: LOW
    rule: F_SRBED IS_SET
    handler: python
  M_LTPTOS_A_SIOS:
    statement: The supply on which the liability to pay tax is being considered is a supply of services
    order: HIGH
    interpretation: Does the description of the supply show that it is a supply of services?
    grounding:
    - F_DOS
    handler: light
  M_LTPTOS_A_TOSDUS:
    statement: The time of supply of the services is determined in accordance with the provisions of this section
    order: HIGH
    interpretation: Under which provision of this section is the time of supply of these services fixed, weighing the supply
      date, the invoice issue date and the payment receipt date, and has that time been established?
    grounding:
    - F_STD
    - F_DOII
    - F_SPRD
    handler: heavy
  M_TOSSIA_A_AIBWOI:
    statement: The addition in the value of supply is by way of interest.
    order: LOW
    rule: F_SAK = 'INTEREST'
    handler: python
  M_TOSSIA_A_AIBWOLF:
    statement: The addition in the value of supply is by way of late fee.
    order: LOW
    rule: F_SAK = 'LATE_FEE'
    handler: python
  M_TOSSIA_A_AIBWOP:
    statement: The addition in the value of supply is by way of penalty.
    order: LOW
    rule: F_SAK = 'PENALTY'
    handler: python
  M_TOSSIA_A_AIFDP:
    statement: The addition in the value of supply is for delayed payment of any consideration.
    order: LOW
    rule: F_SAP = 'DELAYED_PAYMENT_OF_CONSIDERATION'
    handler: python
  M_TOSAES_A_SBAE:
    statement: The supply is made by associated enterprises
    order: HIGH
    interpretation: Are the supplier and the recipient associated enterprises under the relevant legal definition?
    grounding:
    - F_PAS2
    handler: heavy
  M_TOSAES_A_SLOI:
    statement: The supplier of service is located outside India
    order: LOW
    rule: F_SL = 'OUTSIDE_INDIA'
    handler: python
  M_TOSAES_A_RBENL:
    statement: The date of entry in the books of account of the recipient of supply is not later than the date of payment
    order: LOW
    rule: F_PDO = 'BOOKS_EARLIER_OR_SAME'
    handler: python
  M_TOSAES_A_PDETB:
    statement: The date of payment is earlier than the date of entry in the books of account of the recipient of supply
    order: LOW
    rule: F_PDO = 'BANK_EARLIER'
    handler: python
  M_VSTOSRD_A_SFIOC:
    statement: The supply falls in all other cases, that is, it is not covered by a preceding case of the voucher time-of-supply
      provision, which is not stated in this MKP.
    order: LOW
    rule: F_SPCC = 'NOT_COVERED'
    handler: python
  M_TOSVI_A_SOVBS:
    statement: The supply is a supply of vouchers by a supplier.
    order: LOW
    rule: F_VSS = 'VOUCHER_BY_SUPPLIER'
    handler: python
  M_GVTOSR_A_SIVBS:
    statement: The supply is a supply of vouchers by a supplier
    order: LOW
    rule: F_VSS = 'VOUCHER_BY_SUPPLIER'
    handler: python
  M_TOSVI_A_SIAI:
    statement: The supply is identifiable at the point of issue of the voucher.
    order: HIGH
    interpretation: Does the contract, the terms and conditions or the voucher show that the supply was identifiable at the
      point the voucher was issued?
    grounding:
    - F_SIS2
    handler: light
  M_DNPFGOS_A_DGFS:
    statement: A deposit is given in respect of the supply of goods or services or both
    order: HIGH
    interpretation: Was the sum given as a deposit in respect of the supply of goods or services or both?
    grounding:
    - F_PODG
    handler: light
  M_DNPFGOS_A_SADAC:
    statement: The supplier applies such deposit as consideration for the said supply
    order: LOW
    rule: F_AODA = 'APPLIED_AS_CONSIDERATION'
    handler: python
groups:
  M_CALS_G_PAA:
    name: Primary Authority Alternatives
    logic: ANY
    members:
    - M_CALS_A_AITG
    - M_CALS_A_AIAI
    description: The Government or any authority authorised to issue completion certificate under any law for the time being
      in force.
  M_CALS_G_SRC:
    name: Surveyor Route Conditions
    logic: ALL
    members:
    - M_CALS_A_CNRFA
    - M_CALS_A_AILS
    description: Where a completion certificate is not required from such authority - the licensed surveyor listed in the
      clause.
  M_DOCACE_G_GOAIR:
    name: Government Or Authorised Issuer Route
    logic: ANY
    members:
    - M_DOCACE_A_CAIG
    - M_DOCACE_A_AULA
    description: The competent authority is the Government or an authority authorised to issue the completion certificate
  M_DOCACE_G_ERCNR:
    name: Engineer Route Certificate Not Required
    logic: ALL
    members:
    - M_DOCACE_A_CNRFA
    - M_DOCACE_A_CERWI
    description: Where the certificate is not required from such authority, a chartered engineer registered with the Institution
      of Engineers (India) is the competent authority
  M_CAA_G_GOAA:
    name: Government Or Authorised Authority
    logic: ANY
    members:
    - M_CAA_A_AITG
    - M_CAA_A_AAUL
    description: The Government or any authority authorised under any law in force to issue a completion certificate
  M_CAA_G_RAR:
    name: Registered Architect Route
    logic: ALL
    members:
    - M_CAA_A_CNRFA
    - M_CAA_A_ARWC
    description: No certificate is required from such authority and the certifier is a registered architect
  M_CSOSD_G_CDC:
    name: Core Definition Conditions
    logic: ALL
    members:
    - M_CSOSD_A_SIOS
    - M_CSOSD_A_POATBP
    - M_CSOSD_A_PCOR
    - M_CSOSD_A_PUAC
    - M_CSOSD_A_PETM
    - M_CSOSD_A_PPOE
    description: All the means-conditions are required together.
  M_CSOSD_G_NIC:
    name: Notified Inclusion Conditions
    logic: ALL
    members:
    - M_CSOSD_A_SIGN
    - M_CSOSD_A_NCAS
    description: The includes-limb needs the service to be notified and any notified conditions to be satisfied.
  M_CSOSD_G_CONR:
    name: Core Or Notified Route
    logic: ANY
    members:
    - M_CSOSD_G_CDC
    - M_CSOSD_G_NIC
    description: Either the core definition or the notified inclusion suffices.
  M_PMBR_G_PMC:
    name: Prescribed Meaning Conditions
    logic: ALL
    members:
    - M_PMBR_A_PBRUA
    - M_PMBR_A_ROCR
    description: Both the rules-made-under-this-Act basis and the Council recommendation are required for the defined meaning.
  M_DOS2_G_SC:
    name: Service Criteria
    logic: ANY
    members:
    - M_DOS2_G_BDOS
    - M_DOS2_G_IFMA
  M_DOS2_G_BDOS:
    name: Base Definition Of Service
    logic: ALL
    members:
    - M_DOS2_A_TSING
    - M_DOS2_A_TSINM
    - M_DOS2_A_TSINS
  M_DOS2_G_IFMA:
    name: Inclusion For Money-Related Activities
    logic: ALL
    members:
    - M_DOS2_A_ARTUOCOM
    - M_DOS2_A_SCICFTA
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_RCD_G_LBFRC:
    name: Legal Basis For Reverse Charge
    logic: ANY
    members:
    - M_RCD_A_LAUCAS93
    - M_RCD_A_LAUCAS94
    - M_RCD_A_LAUIAS53
    - M_RCD_A_LAUIAS54
  M_PIAOP_G_EIAOB:
    name: Entity Is AOP Or BOI
    logic: ANY
    members:
    - M_PIAOP_A_EIAAOP
    - M_PIAOP_A_EIABOI
  M_PISCOGC_G_EISCOGC:
    name: Entity Is Statutory Corp Or Govt Co
    logic: ANY
    members:
    - M_PISCOGC_A_EIASC
    - M_PISCOGC_A_EIAGC
    description: The entity is either a statutory corporation or a Government company.
  M_PIFBC_G_FBCC:
    name: Foreign Body Corporate Conditions
    logic: ALL
    members:
    - M_PIFBC_A_EIBC
    - M_PIFBC_A_BCIOI
    description: All conditions for a foreign body corporate to be included in the definition of 'person'.
  M_PICOSG_G_IAGE:
    name: Is A Government Entity
    logic: ANY
    members:
    - M_PICOSG_A_PICG
    - M_PICOSG_A_PISG
    description: Checks if the entity is either the Central Government or a State Government.
  M_DOD_G_DFA:
    name: Document Form Alternatives
    logic: ANY
    members:
    - M_DOD_A_DIWOPR
    - M_DOD_A_DIER
    - M_DOD_A_RWOM
    description: At least one form of record must be shown
  M_DOCOA_G_DMC:
    name: Defined Meaning Conditions
    logic: ALL
    members:
    - M_DOCOA_A_CDNROM
    - M_DOCOA_A_ANBG
    description: Both the context test and the notification test must hold for the defined meaning
  M_DORE_G_RFC:
    name: Return Furnishing Criteria
    logic: ALL
    members:
    - M_DORE_G_RT
    - M_DORE_G_RS
    description: A return must meet both type and source requirements.
  M_DORE_G_RT:
    name: Return Type
    logic: ANY
    members:
    - M_DORE_A_RIP
    - M_DORE_A_RIOR
    description: A return must either be prescribed or otherwise required.
  M_DORE_G_RS:
    name: Requirement Source
    logic: ANY
    members:
    - M_DORE_A_RRBA
    - M_DORE_A_RRBR
    description: The requirement to furnish the return must come from the Act or the Rules.
  M_DOCOP_G_PTA:
    name: Payment Timing Alternatives
    logic: ANY
    members:
    - M_DOCOP_A_PHBM
    - M_DOCOP_A_PITBM
    description: The payment is either already made or is to be made. Both events are not required.
  M_DOCOP_G_PRC:
    name: Payment Route Conditions
    logic: ALL
    members:
    - M_DOCOP_G_PTA
    - M_DOCOP_A_PIIMOO
    - M_DOCOP_A_PLTTS
    - M_DOCOP_A_PIROO
    description: The payment must be made or to be made, in money or otherwise, be linked to the supply, and be paid by the
      recipient or any other person.
  M_CMVOAF_G_AAVC:
    name: Act And Value Core
    logic: ALL
    members:
    - M_CMVOAF_A_CIAOF
    - M_CMVOAF_A_AHAMV
    description: There must be an act or forbearance, and its monetary value is what is included.
  M_CMVOAF_G_SLA:
    name: Supply Link Alternatives
    logic: ANY
    members:
    - M_CMVOAF_A_AIROS
    - M_CMVOAF_A_AIRTS
    - M_CMVOAF_A_AFIOS
    description: The act or forbearance must be in respect of, in response to, or for the inducement of the supply. Any one
      route is enough.
  M_DOI_G_COTID:
    name: Components Of The India Definition
    logic: ANY
    members:
    - M_DOI_A_LITPC
    - M_DOI_G_MZCOI
    - M_DOI_A_LIIAS
  M_DOI_G_MZCOI:
    name: Maritime Zone Components Of India
    logic: ANY
    members:
    - M_DOI_A_LIITW
    - M_DOI_A_LISOS
    - M_DOI_A_LIICS
    - M_DOI_A_LIIEEZ
    - M_DOI_A_LIIOMZ
  M_DOAE_G_DAG:
    name: Definition Applies Gate
    logic: ALL
    members:
    - M_DOAE_A_CDNROM
    - M_DOAE_A_TTS92AM
    description: Both the context condition and the section 92A meaning must hold for the defined meaning to apply
  M_DOVI_G_SOSII:
    name: Supply Or Supplier Is Indicated
    logic: ANY
    members:
    - M_DOVI_G_SDAI
    - M_DOVI_G_SDAI2
  M_DOVI_G_SDAI:
    name: Supply Details Are Indicated
    logic: ANY
    members:
    - M_DOVI_A_SIOTI
    - M_DOVI_A_SIIRD
  M_DOVI_G_SDAI2:
    name: Supplier Details Are Indicated
    logic: ANY
    members:
    - M_DOVI_A_SIOTI2
    - M_DOVI_A_SIIRD2
  M_SDMBIOP_G_SCBIOP:
    name: Supply Covered By Invoice Or Payment
    logic: ANY
    members:
    - M_SDMBIOP_A_ICSE
    - M_SDMBIOP_A_PCSE
    description: The supply is covered by the invoice or, as the case may be, by the payment
  M_EOIOPFS_G_TIDC:
    name: Timely Invoice Date Candidate
    logic: ALL
    members:
    - M_EOIOPFS_A_SHII
    - M_EOIOPFS_A_IIWS31P
    description: The invoice date is a candidate only if the supplier issued an invoice and it was issued within the period
      prescribed under section 31.
  M_DOROPD_A_RDITE:
    name: Any of the referred steps (M_DOROPD_A_RDITE)
    logic: ANY
    members:
    - M_EOIOPFS_PD_IDITOS
    - M_EOIOPFS_PD_PDITOS
    description: TRUE when any step of the law this check refers to is TRUE
  M_DOROPD_G_BOBDS:
    name: Books Or Bank Date Source
    logic: ANY
    members:
    - M_DOROPD_A_PEIB
    - M_DOROPD_A_PCTB
    description: At least one payment date must be recorded before the earlier-date rule can apply.
  M_RCSPD_G_BPDA:
    name: Both Payment Dates Available
    logic: ALL
    members:
    - M_RCSPD_A_PDEIRB
    - M_RCSPD_A_PDIRB
    description: Both dates must be available to compare which is earlier. A missing date gives UNKNOWN, not FALSE.
  M_RCSISD_G_IOLDI:
    name: Invoice Or Lieu Document Issued
    logic: ANY
    members:
    - M_RCSISD_A_SIIFS
    - M_RCSISD_A_SILD
    description: The date of issue is that of the supplier's invoice or of any other document, by whatever name called, issued
      in lieu of it by the supplier.
  M_TOSOSEA_G_ERTC:
    name: Excess Receipt Trigger Conditions
    logic: ALL
    members:
    - M_TOSOSEA_A_SOTS
    - M_TOSOSEA_A_ARIEOI
    - M_TOSOSEA_A_EAUTTR
    description: The supplier of taxable service receives an amount over the invoice amount and that excess is up to one thousand
      rupees.
  M_TOSSRBE_A_CCDT:
    name: Any of the referred steps (M_TOSSRBE_A_CCDT)
    logic: ANY
    members:
    - M_RCSISD_PD_SDCDE
    - M_RCSPD_PD_BDITOS
    - M_RCSPD_PD_BDITOS2
    description: TRUE when any step of the law this check refers to is TRUE
  M_TOSSRBE_G_FCG:
    name: Fallback Condition Group
    logic: ALL
    members:
    - M_TOSSRBE_A_CCDT
    - M_TOSSRBE_A_SRBER
    description: Both the not-determinable condition and the recipient books entry condition are required
  M_TOSSIA_G_AIIFP:
    name: Addition Is Interest Fee Penalty
    logic: ANY
    members:
    - M_TOSSIA_A_AIBWOI
    - M_TOSSIA_A_AIBWOLF
    - M_TOSSIA_A_AIBWOP
    description: The addition in value is by way of any one of interest, late fee or penalty (closed list of three forms).
  M_TOSAES_G_PCC:
    name: Proviso Case Condition
    logic: ALL
    members:
    - M_TOSAES_A_SBAE
    - M_TOSAES_A_SLOI
    description: Both the associated enterprise supply and the supplier located outside India, as required by the in case
      of and where wording
  M_VSTOSRD_G_VSC:
    name: Voucher Supply Case
    logic: ALL
    members:
    - M_TOSVI_A_SOVBS
    - M_VSTOSRD_A_SFIOC
    description: Both the voucher-by-supplier condition and the all-other-cases condition must hold.
  M_TOSSVI_G_VTRC:
    name: Voucher Time Rule Conditions
    logic: ALL
    members:
    - M_GVTOSR_A_SIVBS
    - M_TOSVI_A_SIAI
    description: Both the voucher supply condition and the identifiability condition must be met.
outcomes:
  M_CALS_LE_CADM:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CALS_G_PAA OR M_CALS_G_SRC
    module: M_CALS
    description: The expression competent authority is satisfied by either the primary authority route or the licensed surveyor
      route.
  M_DOCACE_LE_CADO:
    outcome: COMPETENT_AUTHORITY_DEFINED
    expr: M_DOCACE_G_GOAIR OR M_DOCACE_G_ERCNR
    module: M_DOCACE
    description: The entity is a competent authority for paragraph 5(b) under the exhaustive definition
  M_CAA_LE_CAO:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CAA_G_GOAA OR M_CAA_G_RAR
    module: M_CAA
    description: The certifying body is a competent authority if it is the Government or an authority authorised under law,
      or if no certificate is required from such authority and it is a registered architect
  M_CSOSD_LE_ICSOS:
    outcome: CONTINUOUS_SUPPLY_OF_SERVICES
    expr: M_CSOSD_A_CDNOM AND M_CSOSD_G_CONR
    module: M_CSOSD
    description: The definition applies when the context does not require otherwise and either the core means-conditions are
      all met or the service is a Government-notified inclusion with its notified conditions met.
  M_PMBR_LE_PMA:
    outcome: PRESCRIBED_DEFINITION_APPLIES
    expr: M_PMBR_G_PMC AND NOT M_PMBR_A_COROM
    module: M_PMBR
    description: The definition applies when both defining conditions hold and the context does not otherwise require a different
      meaning.
  M_SITIS_LE_SIS:
    outcome: IS_SERVICE
    expr: M_SITIS_A_SIST
    module: M_SITIS
    description: Determines if the activity is considered a service based on this clarification.
  M_DOS2_LE_TTIAS:
    outcome: IS_SERVICE
    expr: M_DOS2_A_DAUCRO AND M_DOS2_G_SC
    module: M_DOS2
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_RCD_LE_DORCIM:
    outcome: IS_REVERSE_CHARGE
    expr: M_RCD_A_CDNROM AND M_RCD_G_LBFRC
    module: M_RCD
  M_DOPI_LE_PDII:
    outcome: PERSON_INCLUDES_INDIVIDUAL
    expr: M_DOPI_A_PII AND M_DOPI_A_CDNO
    module: M_DOPI
    description: Determines if an individual is considered a 'person' under this specific inclusive definition, considering
      the context.
  M_PIHUF_LE_PIH:
    outcome: PERSON_INCLUDES_HUF
    expr: M_PIHUF_A_EIHUF
    module: M_PIHUF
    description: This clause contributes to the definition of 'person' by including a Hindu Undivided Family.
  M_PIC_LE_CIP:
    outcome: ENTITY_IS_PERSON_VIA_COMPANY
    expr: M_PIC_A_EIAC
    module: M_PIC
  M_DOPF_LE_PIF:
    outcome: IS_PERSON
    expr: M_DOPF_A_AFIIITDOP
    module: M_DOPF
  M_PILLP_LE_LIIP:
    outcome: IS_PERSON
    expr: M_PILLP_A_LLPIP AND M_PILLP_A_CAI
    module: M_PILLP
  M_PIAOP_LE_IAPUS84F:
    outcome: IS_PERSON_UNDER_S2_84_f
    expr: M_PIAOP_A_CDNRDM AND M_PIAOP_G_EIAOB
    module: M_PIAOP
  M_PISCOGC_LE_IIIPDS84G:
    outcome: IS_INCLUDED_IN_PERSON_DEFINITION_S2_84_g
    expr: M_PISCOGC_A_CDNRO AND M_PISCOGC_G_EISCOGC
    module: M_PISCOGC
    description: The entity is included in the definition of 'person' under Section 2(84)(g).
  M_PIFBC_LE_PIFBC:
    outcome: PERSON_INCLUDED
    expr: M_PIFBC_G_FBCC AND M_PIFBC_A_DAUCRO
    module: M_PIFBC
    description: Determines if an entity is considered a 'person' under this Act because it is a body corporate incorporated
      outside India, unless the context otherwise requires.
  M_PICS_LE_CSIP:
    outcome: M_PICS_PD_IPCS
    expr: M_PICS_A_CDNOR AND M_PICS_A_EIRCS
    module: M_PICS
    description: This LE determines if a co-operative society is considered a 'person' under this specific sub-clause, subject
      to contextual requirements.
  M_PILA_LE_LAIP:
    outcome: ENTITY_IS_PERSON
    expr: M_PILA_A_UTCOR AND M_PILA_A_PIALA
    module: M_PILA
    description: Determines if an entity is considered a 'person' under this specific inclusive definition.
  M_PICOSG_LE_GEIAP:
    outcome: PERSON_INCLUDED
    expr: M_PICOSG_A_CDNOR AND M_PICOSG_G_IAGE
    module: M_PICOSG
    description: Determines if a Central or State Government is included in the definition of 'person' under this clause,
      considering contextual requirements.
  M_PIS_LE_P:
    outcome: PERSON_INCLUDES_SOCIETY
    expr: M_PIS_A_EIAS AND M_PIS_A_CDNRO
    module: M_PIS
    description: Determines if a society is included in the definition of 'person' based on the Act and context.
  M_PIT_LE_PDI:
    outcome: PERSON_INCLUDED
    expr: M_PIT_A_PIT AND M_PIT_A_CDNRO
    module: M_PIT
    description: Determines if a trust is included in the definition of 'person' based on the explicit inclusion and contextual
      requirements.
  M_PIAJP_LE_P:
    outcome: PERSON_INCLUDES_AJP
    expr: M_PIAJP_A_EIAAJP AND M_PIAJP_A_ANIPC
    module: M_PIAJP
    description: Determines if an entity qualifies as an artificial juridical person under this specific clause of the definition
      of 'person', subject to contextual requirements.
  M_DOD_LE_DMA:
    outcome: DOCUMENT_MEANING_APPLIES
    expr: M_DOD_A_CDNROM AND M_DOD_G_DFA
    module: M_DOD
    description: The defined meaning of document applies where the context does not otherwise require and at least one document
      form is shown
  M_DOCOA_LE_CAD:
    outcome: DEFINED_MEANING
    expr: M_DOCOA_G_DMC
    module: M_DOCOA
    description: The defined meaning applies where the context does not require otherwise and the authority is notified by
      the Government
  M_DOCOA_LE_COD:
    outcome: CONTEXT_MEANING_APPLIES
    expr: NOT M_DOCOA_A_CDNROM
    module: M_DOCOA
    description: The definition does not govern the term where the context requires another meaning
  M_DOG_LE_GDM:
    outcome: IS_GOVERNMENT_AS_DEFINED
    expr: M_DOG_A_ITCG AND M_DOG_A_CDNROM
    module: M_DOG
    description: Determines if an entity qualifies as 'Government' according to Section 2(53).
  M_DONAN_LE_ND:
    outcome: NOTIFICATION_DEFINED
    expr: M_DONAN_A_NMPIOG AND (NOT M_DONAN_A_DAUCRO)
    module: M_DONAN
    description: Determines if a given item qualifies as a 'notification' under the Act, subject to contextual override.
  M_DONAN_LE_RTI:
    outcome: RELATED_TERMS_INTERPRETED
    expr: M_DONAN_A_NANCA AND (NOT M_DONAN_A_DAUCRO)
    module: M_DONAN
    description: Provides the rule for construing 'notify' and 'notified' based on the definition of 'notification' and contextual
      override.
  M_DORE_LE_IAR:
    outcome: IS_A_RETURN
    expr: NOT M_DORE_A_CROM AND M_DORE_G_RFC
    module: M_DORE
    description: Determines if a document qualifies as a 'return' as per Section 2(97).
  M_DOCOP_LE_CIBD:
    outcome: CONSIDERATION_INCLUDED
    expr: M_DOCOP_A_CDNRO AND M_DOCOP_A_SIGOS AND M_DOCOP_G_PRC AND NOT M_DOCOP_A_PIGS
    module: M_DOCOP
    description: The payment is consideration under this clause when the context does not require otherwise, the supply is
      of goods or services or both, the payment route tests are met, and the payment is not a Central or State Government
      subsidy.
  M_CMVOAF_LE_AVCAC:
    outcome: CONSIDERATION_INCLUDES_ACT_VALUE
    expr: NOT M_CMVOAF_A_CORDM AND M_CMVOAF_G_AAVC AND M_CMVOAF_G_SLA AND M_CMVOAF_A_ABROO AND M_CMVOAF_A_SOGOS AND NOT M_CMVOAF_A_SGBG
    module: M_CMVOAF
    description: The monetary value of an act or forbearance is included in consideration when the definition is not displaced
      by context, the act is linked to the supply by at least one of the three routes, and the item is not a Government subsidy.
  M_CMVOAF_LE_GSEFC:
    outcome: SUBSIDY_EXCLUDED_FROM_CONSIDERATION
    expr: NOT M_CMVOAF_A_CORDM AND M_CMVOAF_A_SGBG
    module: M_CMVOAF
    description: A subsidy given by the Central Government or a State Government is not included in consideration, unless
      the context otherwise requires.
  M_DOI_LE_D:
    outcome: LOCATION_IS_IN_INDIA
    expr: M_DOI_A_CDNROM AND M_DOI_G_COTID
    module: M_DOI
  M_DOAE_LE_DMA:
    outcome: ASSOCIATED_ENTERPRISES_MEANING_APPLIES
    expr: M_DOAE_G_DAG
    module: M_DOAE
    description: The section 92A meaning applies to associated enterprises only where the context does not otherwise require
      a different meaning
  M_DOVI_LE_OIV:
    outcome: IS_VOUCHER
    expr: M_DOVI_A_CDNROM AND M_DOVI_A_TIIAI AND M_DOVI_A_OTAAC AND M_DOVI_A_CIFAS AND M_DOVI_G_SOSII
    module: M_DOVI
  M_SDMBIOP_LE_SDMTE:
    outcome: DEEMED_MADE_TO_EXTENT
    expr: M_SDMBIOP_G_SCBIOP
    module: M_SDMBIOP
    description: For the purposes of clauses (a) and (b) the supply is deemed made to the extent covered by the invoice or
      the payment
  M_EOIOPFS_LE_IDITOS:
    outcome: TIME_OF_SUPPLY_IS_INVOICE_DATE
    expr: M_EOIOPFS_G_TIDC AND (NOT M_EOIOPFS_A_PRDE OR M_EOIOPFS_A_IDNLTP)
    module: M_EOIOPFS
    description: The invoice issue date is the time of supply when a timely invoice exists and either no payment date exists
      or the invoice date is not later than the payment date.
  M_EOIOPFS_LE_PDITOS:
    outcome: TIME_OF_SUPPLY_IS_PAYMENT_DATE
    expr: M_EOIOPFS_A_PRDE AND (NOT M_EOIOPFS_G_TIDC OR M_EOIOPFS_A_PDETI)
    module: M_EOIOPFS
    description: The date of receipt of payment is the time of supply when payment was received and either there is no timely
      invoice candidate or payment was received earlier than the invoice date.
  M_DOROPD_LE_DORD:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_DETERMINED
    expr: M_DOROPD_G_BOBDS AND M_DOROPD_A_RDITE
    module: M_DOROPD
    description: The receipt date is fixed for clauses (a) and (b) only when at least one payment date is recorded and the
      earlier-date rule is applied.
  M_TOSOSPD_LE_TOSIPD:
    outcome: TIME_OF_SUPPLY_IS_PROVISION_DATE
    expr: M_TOSOSPD_A_INIIP AND (NOT M_TOSOSPD_A_PRDE OR M_TOSOSPD_A_PDNLTP)
    module: M_TOSOSPD
    description: The invoice is not issued within the section 31 period and the date of provision of service is the earlier
      date (or the only date because no payment has been received).
  M_TOSOSPD_LE_TOSIPD2:
    outcome: TIME_OF_SUPPLY_IS_PAYMENT_DATE
    expr: M_TOSOSPD_A_INIIP AND M_TOSOSPD_A_PRDE AND NOT M_TOSOSPD_A_PDNLTP
    module: M_TOSOSPD
    description: The invoice is not issued within the section 31 period and the date of receipt of payment is earlier than
      the date of provision of service.
  M_RCSPD_LE_BDITOS:
    outcome: TIME_OF_SUPPLY_IS_BOOKS_PAYMENT_DATE
    expr: M_RCSPD_A_SORCB AND M_RCSPD_G_BPDA AND M_RCSPD_A_BPDIE
    module: M_RCSPD
    description: On a reverse charge supply the time of supply is the payment date entered in the recipient's books, where
      that date is earlier than or the same as the bank debit date.
  M_RCSPD_LE_BDITOS2:
    outcome: TIME_OF_SUPPLY_IS_BANK_DEBIT_DATE
    expr: M_RCSPD_A_SORCB AND M_RCSPD_G_BPDA AND M_RCSPD_A_BDDIE
    module: M_RCSPD
    description: On a reverse charge supply the time of supply is the date the payment is debited in the recipient's bank
      account, where that date is earlier than the books payment date.
  M_RCSISD_LE_SDCDE:
    outcome: SIXTY_DAY_CANDIDATE_DATE_ESTABLISHED
    expr: M_RCSISD_A_SORCB AND M_RCSISD_G_IOLDI AND M_RCSISD_A_CIDASD
    module: M_RCSISD
    description: When the supply is on reverse charge basis and the supplier issued an invoice or a document in lieu of it,
      the date immediately following sixty days from that issue date is a candidate time of supply. The actual time of supply
      is the earlier of the applicable candidates, compared outside this MKP.
  M_TOSOSEA_LE_EATRA:
    outcome: EXCESS_TOS_IS_EXCESS_INVOICE_DATE
    expr: M_TOSOSEA_G_ERTC AND M_TOSOSEA_A_SETO
    module: M_TOSOSEA
    description: The proviso fixes the time of supply for the excess amount only when the trigger conditions are met and the
      supplier exercises the option.
  M_TOSSRBE_LE_RBTO:
    outcome: TIME_OF_SUPPLY_RECIPIENT_BOOKS_ENTRY
    expr: M_TOSSRBE_G_FCG
    module: M_TOSSRBE
    description: The proviso gives the recipient books entry date as the time of supply only when the clause condition and
      the recipient entry condition both hold
  M_LTPTOS_LE_TLAATOS:
    outcome: LIABILITY_TO_PAY_TAX_ON_SERVICES_ARISES_AT_TIME_OF_SUPPLY
    expr: M_LTPTOS_A_SIOS AND M_LTPTOS_A_TOSDUS
    module: M_LTPTOS
    description: Where the supply is a supply of services and its time of supply is determined under this section, the liability
      to pay tax arises at that time of supply.
  M_TOSSIA_LE_ATIRD:
    outcome: ADDITION_TIME_OF_SUPPLY_IS_SUPPLIER_RECEIPT_DATE
    expr: M_TOSSIA_G_AIIFP AND M_TOSSIA_A_AIFDP
    module: M_TOSSIA
    description: The rule applies only to the part of value that is an addition by way of interest, late fee or penalty and
      is for delayed payment of any consideration.
  M_TOSAES_LE_TOSRBD:
    outcome: TIME_OF_SUPPLY_IS_RECIPIENT_BOOKS_DATE
    expr: M_TOSAES_G_PCC AND M_TOSAES_A_RBENL
    module: M_TOSAES
    description: Proviso condition met and recipient books entry is not later than the payment date, so the books entry date
      is the time of supply
  M_TOSAES_LE_TOSPD:
    outcome: TIME_OF_SUPPLY_IS_PAYMENT_DATE
    expr: M_TOSAES_G_PCC AND M_TOSAES_A_PDETB
    module: M_TOSAES
    description: Proviso condition met and the payment date is earlier than the recipient books entry date, so the payment
      date is the time of supply
  M_VSTOSRD_LE_VRDT:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_REDEMPTION_DATE
    expr: M_VSTOSRD_G_VSC
    module: M_VSTOSRD
    description: Where the supply is of vouchers by a supplier and falls in all other cases, the time of supply is the date
      of redemption of the voucher.
  M_TOSSVI_LE_TOSIVID:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_ISSUE_DATE
    expr: M_TOSSVI_G_VTRC
    module: M_TOSSVI
    description: The time of supply shall be the date of issue of the voucher when the supply is a supply of vouchers by a
      supplier and is identifiable at that point.
  M_DNPFGOS_LE_DNTAP:
    outcome: DEPOSIT_NOT_CONSIDERED_PAYMENT_FOR_SUPPLY
    expr: M_DNPFGOS_A_DGFS AND NOT M_DNPFGOS_A_SADAC
    module: M_DNPFGOS
    description: The deposit shall not be considered as payment made for the supply when it is not applied by the supplier
      as consideration.
  M_DNPFGOS_LE_DAAC:
    outcome: PROVISO_BAR_DOES_NOT_APPLY
    expr: M_DNPFGOS_A_DGFS AND M_DNPFGOS_A_SADAC
    module: M_DNPFGOS
    description: The bar in the proviso does not apply because the supplier applies the deposit as consideration for the said
      supply.
triggers:
