# GOVERNANCE MASTER TSG03_01 Intra / inter-State (TG03 Location & Tax Type)
# LAW ARC - 3 laws - status APPROVED
name: TSG03_01 Intra / inter-State - GOVERNANCE MASTER rulebook
version: TSG03_01
facts:
  F_SUPPLY_IS_INTRA_STATE:
    name: Supply is an intra-State supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_MAKES_INTERSTATE_OUTWARD_SUPPLIES:
    name: Supplier is engaged in making inter-State outward supplies of goods or services
    type: BOOLEAN
    tier: T0
predicates:
  A_INTRA_STATE_SUPPLY:
    statement: The supply of services is an intra-State supply
    order: LOW
    rule: F_SUPPLY_IS_INTRA_STATE = TRUE
  A_M_ECOIS_1:
    statement: The person is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_ECOIS_2:
    statement: The person is not engaged in making any inter-State outward supplies of goods or services
    order: LOW
    rule: F_SUPPLIER_MAKES_INTERSTATE_OUTWARD_SUPPLIES = FALSE
  A_M_CIFIS_4:
    statement: The registered person is not engaged in making any inter-State outward supplies of goods or services
    order: LOW
    rule: F_SUPPLIER_MAKES_INTERSTATE_OUTWARD_SUPPLIES = FALSE
groups:
  G_M_ECOIS_1:
    name: Eligibility conditions for composition levy under S10(2)(c)
    logic: ALL
    members:
    - A_M_ECOIS_1
    - A_M_ECOIS_2
outcomes:
  LE_INTRA_STATE_SUPPLY:
    outcome: INTRA_STATE_SUPPLY
    expr: A_INTRA_STATE_SUPPLY
    module: M_EOTL
    description: The supply of services is an intra-State supply (Section 9(5), part of the law)
  LE_M_ECOIS:
    outcome: ELIGIBILITY_CONDITION_MET
    expr: G_M_ECOIS_1
    module: M_ECOIS
  LE_M_CIFIS_4:
    outcome: M_CIFIS_4
    expr: A_M_CIFIS_4
    module: M_CIFIS
    description: The registered person is not engaged in making any inter-State outward supplies of goods or services (Section
      10(2A), part of the law)
products:
  PD_INTRA_STATE_SUPPLY:
    statement: The supply of services is an intra-State supply
  PD_M_ECOIS:
    statement: ELIGIBILITY_CONDITION_MET
  PD_M_CIFIS_4:
    statement: The registered person is not engaged in making any inter-State outward supplies of goods or services
compounds:
- id: C_EOTL
  question: The supply of services is an intra-State supply? (Section 9(5))
  includes:
  - LE_INTRA_STATE_SUPPLY
  produces:
  - product: PD_INTRA_STATE_SUPPLY
    from:
    - LE_INTRA_STATE_SUPPLY
- id: C_ECOIS
  question: 'Section 10(2)(c): Eligibility Condition On Inter-State Supplies?'
  includes:
  - LE_M_ECOIS
  produces:
  - product: PD_M_ECOIS
    from:
    - LE_M_ECOIS
- id: C_CIFIS
  question: The registered person is not engaged in making any inter-State outward supplies of goods or services? (Section
    10(2A))
  includes:
  - LE_M_CIFIS_4
  produces:
  - product: PD_M_CIFIS_4
    from:
    - LE_M_CIFIS_4
