# GOVERNANCE MASTER TSG03_02 Place of supply – goods (TG03 Location & Tax Type)
# LAW ARC - 2 laws - status APPROVED
name: TSG03_02 Place of supply – goods - GOVERNANCE MASTER rulebook
version: TSG03_02
facts:
  F_SUPPLY_INVOLVES_MOVEMENT_OF_GOODS:
    name: Supply involves movement of goods
    type: BOOLEAN
    tier: T0
  F_TXN_GOODS_DELIVERY_RECIPIENT:
    name: Recipient of goods delivery
    type: CODE
    options:
    - CLAIMANT
    - THIRD_PARTY_ON_CLAIMANT_DIRECTION
    - OTHER
    tier: T1
predicates:
  A_PRE_GOODS_MOVEMENT:
    statement: The supply involves movement of goods
    order: LOW
    rule: F_SUPPLY_INVOLVES_MOVEMENT_OF_GOODS = TRUE
  A_DROGB_2:
    statement: The goods are delivered by the supplier to a recipient or any other person on the direction of the registered
      person.
    order: LOW
    rule: F_TXN_GOODS_DELIVERY_RECIPIENT = 'THIRD_PARTY_ON_CLAIMANT_DIRECTION'
groups: {}
outcomes:
  LE_PRE_GOODS_MOVEMENT:
    outcome: PRE_GOODS_MOVEMENT
    expr: A_PRE_GOODS_MOVEMENT
    module: M_ITFGWM
    description: The supply involves movement of goods (Section 31(1), part of the law)
  LE_DROGB_2:
    outcome: DROGB_2
    expr: A_DROGB_2
    module: M_DROGB
    description: The goods are delivered by the supplier to a recipient or any other person on the direction of the registered
      person. (Explanation (i) to Section 16(2), part of the law)
products:
  PD_PRE_GOODS_MOVEMENT:
    statement: The supply involves movement of goods
  PD_DROGB_2:
    statement: The goods are delivered by the supplier to a recipient or any other person on the direction of the registered
      person.
compounds:
- id: C_ITFGWM
  question: The supply involves movement of goods? (Section 31(1))
  includes:
  - LE_PRE_GOODS_MOVEMENT
  produces:
  - product: PD_PRE_GOODS_MOVEMENT
    from:
    - LE_PRE_GOODS_MOVEMENT
- id: C_DROGB
  question: The goods are delivered by the supplier to a recipient or any other person on the direction of the registered
    person? (Explanation (i) to Section 16(2))
  includes:
  - LE_DROGB_2
  produces:
  - product: PD_DROGB_2
    from:
    - LE_DROGB_2
