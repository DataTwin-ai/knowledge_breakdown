# GOVERNANCE MASTER TSG03_01 Intra / inter-State (TG03 Location & Tax Type)
# LAW ARC - 4 laws - status APPROVED
name: TSG03_01 Intra / inter-State - GOVERNANCE MASTER rulebook
version: TSG03_01
facts:
  # ---- LAST: only heavy checks (free text) need these
  F_SCS:  # 1. LAST (heavy check only) | 3 law(s)
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
    origin:
      document: CONTRACT
      method: DERIVED
      uses: [CONTRACT.consideration, CONTRACT.consideration_type]
      how_to_get: Read consideration and consideration_type from the contract. If consideration is blank or nil / zero (or the type says no consideration, e.g. gift), the value is NONE. If consideration_type or the papers show it has been paid (cash, bank, advance received), the value is PAID. If an amount or benefit is promised but not yet paid, the value is AGREED.
      fallback: 'Use SALE_INVOICE.total_value: if it is above zero there is a consideration (AGREED, or PAID if payment is shown). Otherwise ask the user: ''Is anything paid or promised in return for this supply?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: AGREED
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ASIS:  # 2. LAST (heavy check only) | 1 law(s)
    name: Activity Schedule I Status
    type: CODE
    options:
    - NOT_SPECIFIED_IN_SCHEDULE_I
    - SPECIFIED_IN_SCHEDULE_I
    tier: T1
    source_kind: READ
    origin:
      document: SYSTEM
      method: ASK
      uses: [F_DOTS, SALE_INVOICE.line_description, CONTRACT.subject]
      how_to_get: Compare the description of the activity (from F_DOTS or SALE_INVOICE.line_description or CONTRACT.subject) against the list of activities specified in Schedule I of the CGST Act. If it matches any activity listed, the value is SPECIFIED_IN_SCHEDULE_I. Otherwise, it is NOT_SPECIFIED_IN_SCHEDULE_I.
      fallback: UNKNOWN
      when_missing: UNKNOWN
      as_of: Date of supply/activity
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: SPECIFIED_IN_SCHEDULE_I
      confidence: low
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOAOT:  # 3. LAST (heavy check only) | 1 law(s)
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description, CONTRACT.employment_terms]
      how_to_get: Read the contract subject, then property_description if it is about property, or employment_terms if it is about employment. Write a short plain-text description of the activity or transaction and who does it for whom.
      fallback: 'Use SALE_INVOICE.line_description. If that is also missing, ask the user: Please describe the activity or transaction.'
      when_missing: ASK
      as_of: date of the activity or transaction
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: Sale of a vacant plot of land to a buyer
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_FOS:  # 4. LAST (heavy check only) | 1 law(s)
    name: Form Of Supply
    type: CODE
    options:
    - BARTER
    - DISPOSAL
    - EXCHANGE
    - LEASE
    - LICENCE
    - OTHER
    - RENTAL
    - SALE
    - TRANSFER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.consideration_type, SALE_INVOICE.line_description]
      how_to_get: 'Read CONTRACT.subject and CONTRACT.consideration_type. Decide the form of supply: SALE for a price in money with transfer of title, BARTER if the consideration is other goods or services, EXCHANGE, LEASE, RENTAL, LICENCE, TRANSFER or DISPOSAL as the wording says. Use OTHER if none fits.'
      fallback: If there is no contract, read SALE_INVOICE.line_description and invoice_type. If that is also unclear, ask the user how the supply was made.
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: SALE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PCM:  # 5. LAST (heavy check only) | 1 law(s)
    name: Provision Context Meaning
    type: CODE
    options:
    - CONTEXT_REQUIRES_OTHER_MEANING
    - NO_OTHER_MEANING_REQUIRED
    - UNDETERMINED
    tier: T1
    unit: M_DOISOG_CT_N
    origin: {document: SYSTEM, method: READ, how_to_get: 'The engine reads the provision that uses the defined term, with its neighbouring text. It decides whether that provision shows the term must carry a different meaning. Return CONTEXT_REQUIRES_OTHER_MEANING if so, NO_OTHER_MEANING_REQUIRED if the provision is consistent with the standard definition, and UNDETERMINED if it cannot tell. Never ask the user.', fallback: Return UNDETERMINED., when_missing: UNKNOWN, as_of: not date dependent (the law text as in force on the date of the transaction), level: DOCUMENT, ai_level: HIGH, cost: HIGH, example: NO_OTHER_MEANING_REQUIRED, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_SBC:  # 6. LAST (heavy check only) | 1 law(s)
    name: Supply Business Context
    type: CODE
    options:
    - IN_BUSINESS
    - NOT_IN_BUSINESS
    - UNKNOWN
    tier: T1
    source_kind: READ
  F_TN:  # 7. LAST (heavy check only) | 1 law(s)
    name: Transaction Nature
    type: CODE
    options:
    - DOMESTIC_GOODS
    - DOMESTIC_SERVICES
    - IMPORT_GOODS
    - IMPORT_SERVICES
    - OTHER
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_DOISOG_A_MFSE:
    statement: The term intra-State supply of goods, as used in this Act, shall have the same meaning as assigned to it in
      section 8 of the Integrated Goods and Services Tax Act
    order: HIGH
    interpretation: Does this provision use the term intra-State supply of goods so that the section 8 IGST meaning is assigned
      to it
    grounding:
    - F_PCM
    handler: heavy
  M_DOISOG_A_COR:
    statement: The context of this Act otherwise requires a meaning of intra-State supply of goods other than the section
      8 IGST meaning
    order: HIGH
    interpretation: Does the provision in which the term appears show that the context requires a meaning other than section
      8 of the IGST Act
    grounding:
    - F_PCM
    handler: heavy
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a sale'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a transfer'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a barter'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is an exchange'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a licence.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a licence'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a rental'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL2:
    statement: The supply of goods or services or both is a lease.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a lease'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a disposal'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both is a form other than the specified examples.
    order: HIGH
    interpretation: Does the described activity qualify as a form of supply under Section 7(1)(a), even though it is not one
      of the listed examples (sale, transfer, etc.)?
    grounding:
    - F_FOS
    - F_DOAOT
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply is made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SAFC:
    statement: The supply is agreed to be made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is agreed to be made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SICOB:
    statement: The supply is made by a person in the course or furtherance of business.
    order: HIGH
    interpretation: Is the supply made in the course or furtherance of the person's business?
    grounding:
    - F_SBC
    - F_DOAOT
    handler: heavy
  M_IOSFC_A_TIAIOS:
    statement: The transaction is an import of services.
    order: HIGH
    interpretation: 'Decide whether: The transaction is an import of services'
    grounding:
    - F_TN
    handler: light
  M_IOSFC_A_IIFAC:
    statement: The import of services is for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The import of services is for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAWC_A_AISISI:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_ASIS
    handler: heavy
  M_SIAWC_A_AIWC:
    statement: The activity is made or agreed to be made without a consideration
    order: HIGH
    interpretation: 'Decide whether: The activity is made or agreed to be made without a consideration'
    grounding:
    - F_SCS
    handler: light
groups:
  M_SIAFOS_G_QFOS:
    name: Qualifying Forms Of Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL2
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: The supply must take one of the listed forms or another qualifying form.
  M_SIAFOS_G_SFC:
    name: Supply For Consideration
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply must be made or agreed to be made for a consideration.
  M_IOSFC_G_CFIOSTBS:
    name: Conditions For Import Of Service To Be Supply
    logic: ALL
    members:
    - M_IOSFC_A_TIAIOS
    - M_IOSFC_A_IIFAC
    description: Both conditions must be met. The business test is explicitly not a condition for this type of supply.
outcomes:
  M_DOISOG_LE_SEMO:
    outcome: SECTION8_MEANING_APPLIES
    expr: M_DOISOG_A_MFSE AND NOT M_DOISOG_A_COR
    module: M_DOISOG
    description: The term takes the section 8 IGST meaning when the definition applies and the context does not otherwise
      require a different meaning
  M_SIAFOS_LE_IISUS71A:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAFOS_G_QFOS AND M_SIAFOS_G_SFC AND M_SIAFOS_A_SICOB
    module: M_SIAFOS
    description: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_LE_IOSFCIS:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_CFIOSTBS
    module: M_IOSFC
    description: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_SIAWC_LE_IISFSIA:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_A_AISISI AND M_SIAWC_A_AIWC
    module: M_SIAWC
    description: The transaction is included in the scope of supply if it is a Schedule I activity and is without consideration.
products:
  M_DOISOG_PD_SEMO:
    statement: The term takes the section 8 IGST meaning when the definition applies and the context does not otherwise require
      a different meaning
  M_SIAFOS_PD_IISUS71A:
    statement: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_PD_IOSFCIS:
    statement: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_SIAWC_PD_IISFSIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity and is without consideration.
compounds:
- id: C_DOISOG
  question: 'Section 2(64): Definition Of Intra-State Supply Of Goods?'
  includes:
  - M_DOISOG_LE_SEMO
  produces:
  - product: M_DOISOG_PD_SEMO
    from:
    - M_DOISOG_LE_SEMO
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_IISUS71A
  - M_IOSFC_LE_IOSFCIS
  - M_SIAWC_LE_IISFSIA
  produces:
  - product: M_SIAFOS_PD_IISUS71A
    from:
    - M_SIAFOS_LE_IISUS71A
  - product: M_IOSFC_PD_IOSFCIS
    from:
    - M_IOSFC_LE_IOSFCIS
  - product: M_SIAWC_PD_IISFSIA
    from:
    - M_SIAWC_LE_IISFSIA
time:
  law_date: F_DOI
