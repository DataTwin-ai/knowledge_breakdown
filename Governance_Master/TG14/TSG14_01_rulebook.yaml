# GOVERNANCE MASTER TSG14_01 General definitions (TG14 Definitions & Effective Law)
# LAW ARC - 2 laws - status APPROVED
name: TSG14_01 General definitions - GOVERNANCE MASTER rulebook
version: TSG14_01
facts:
  # ---- LAST: only heavy checks (free text) need these
  F_PCAS:  # 1. LAST (heavy check only) | 1 law(s)
    name: Person Chartered Accountant Status
    type: CODE
    options:
    - DEFINED_BY_CA_ACT_1949
    - NOT_DEFINED_BY_CA_ACT_1949
    - UNDETERMINED
    tier: T1
    origin:
      document: PROFILE
      method: LOOKUP
      uses: [PROFILE.membership_no, PROFILE.professional_qualification]
      how_to_get: Take membership_no from the person's profile and look it up in the Institute of Chartered Accountants of India members register. If a current member is found with the same name, return DEFINED_BY_CA_ACT_1949. If the register has no such member, return NOT_DEFINED_BY_CA_ACT_1949. If there is no membership_no, return UNDETERMINED.
      fallback: 'Ask the user: ''Is the person a member of the Institute of Chartered Accountants of India? Please give the membership number.'''
      when_missing: ASK
      as_of: date of the service or act being checked
      level: TAXPAYER
      ai_level: NONE
      cost: MEDIUM
      example: DEFINED_BY_CA_ACT_1949
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PCM:  # 2. LAST (heavy check only) | 1 law(s)
    name: Provision Context Meaning
    type: CODE
    options:
    - CONTEXT_REQUIRES_OTHER_MEANING
    - NO_OTHER_MEANING_REQUIRED
    - UNDETERMINED
    tier: T1
    unit: M_DOISOG_CT_N
    origin: {document: SYSTEM, method: READ, how_to_get: 'The engine reads the provision that uses the defined term, with its neighbouring text. It decides whether that provision shows the term must carry a different meaning. Return CONTEXT_REQUIRES_OTHER_MEANING if so, NO_OTHER_MEANING_REQUIRED if the provision is consistent with the standard definition, and UNDETERMINED if it cannot tell. Never ask the user.', fallback: Return UNDETERMINED., when_missing: UNKNOWN, as_of: not date dependent (the law text as in force on the date of the transaction), level: DOCUMENT, ai_level: HIGH, cost: HIGH, example: NO_OTHER_MEANING_REQUIRED, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_PPD:  # 3. LAST (heavy check only) | 1 law(s)
    name: Person Profile Details
    type: TEXT
    tier: T0
    source_kind: DOCUMENT
    origin:
      document: PROFILE
      method: DERIVED
      uses: [PROFILE.person_type, PROFILE.designation, PROFILE.post_held, PROFILE.professional_qualification, PROFILE.body_type]
      how_to_get: 'Join the person''s profile fields into one text: person type, designation, post held, professional qualification and body type. Skip any blank field. The notification''s class description is compared with this text later.'
      fallback: 'Ask the user: ''Please describe the person: what type of person or body is it, and what is its designation or qualification?'''
      when_missing: ASK
      as_of: date of supply or date of the return
      level: TAXPAYER
      ai_level: NONE
      cost: LOW
      example: Individual; Cost Accountant; member of ICMAI
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_DOCA_A_PICAAD:
    statement: Unless the context otherwise requires, the person is a cost accountant as defined in clause (b) of sub-section
      (1) of section 2 of the Cost and Works Accountants Act, 1959
    order: HIGH
    interpretation: Does the person hold the status of a cost accountant as defined in clause (b) of sub-section (1) of section
      2 of the Cost and Works Accountants Act, 1959, with no contrary context?
    grounding:
    - F_PPD
    handler: heavy
    valid_from: '2019-02-01'
  M_DOCA_A_OCCCAD:
    statement: Unless the context otherwise requires, the person is a cost accountant as defined in clause (c) of sub-section
      (1) of section 2 of the Cost and Works Accountants Act, 1959
    order: HIGH
    interpretation: Does the person hold the status of a cost accountant as defined in clause (c) of sub-section (1) of section
      2 of the Cost and Works Accountants Act, 1959, with no contrary context? Applies to documents dated before 2019-02-01.
    grounding:
    - F_PPD
    handler: heavy
    valid_to: '2019-01-31'
  M_DOCHA_A_PICA:
    statement: The person is a chartered accountant as defined in clause (b) of sub-section (1) of section 2 of the Chartered
      Accountants Act, 1949.
    order: HIGH
    interpretation: 'Does the person''s professional status fall within the chartered accountant definition in clause (b)
      of sub-section (1) of section 2 of the Chartered Accountants Act, 1949?; rule: F_PCAS = ''DEFINED_BY_CA_ACT_1949'';
      false_if: F_PCAS = ''NOT_DEFINED_BY_CA_ACT_1949''; nl: A person who is a chartered accountant under the 1949 Act.; groups:
      [TSG14_01]; reference: [Clause (b) of sub-section (1) of section 2]'
    grounding:
    - F_PCAS
    handler: light
  M_DOCHA_A_CDNROM:
    statement: The context does not otherwise require a meaning for chartered accountant other than the meaning given by this
      definition, read with the provision in which the term appears.
    order: HIGH
    interpretation: Does the provision in which chartered accountant appears, read in the context of this Act, require a meaning
      other than the definition in this section?
    grounding:
    - F_PCM
    handler: heavy
groups:
  M_DOCA_G_PICAADIF:
    name: Person Is Cost Accountant As Defined In Force
    logic: ANY
    members:
    - M_DOCA_A_PICAAD
    - M_DOCA_A_OCCCAD
    description: M_DOCA_A_PICAAD from 2019-02-01, the old wording before
  M_DOCHA_G_DLT:
    name: Definition Limbs Together
    logic: ALL
    members:
    - M_DOCHA_A_CDNROM
    - M_DOCHA_A_PICA
    description: Both the context limb and the status limb must be satisfied for the defined meaning to apply.
outcomes:
  M_DOCA_LE_CAE:
    outcome: COST_ACCOUNTANT_STATUS
    expr: M_DOCA_G_PICAADIF
    module: M_DOCA
    description: The single definitional test decides whether the person has cost accountant status
  M_DOCHA_LE_DMA:
    outcome: CHARTERED_ACCOUNTANT_MEANING_APPLIES
    expr: M_DOCHA_G_DLT
    module: M_DOCHA
    description: The defined meaning applies only where the context does not otherwise require and the person meets the Chartered
      Accountants Act 1949 definition.
products:
  M_DOCA_PD_CAE:
    statement: The single definitional test decides whether the person has cost accountant status
  M_DOCHA_PD_DMA:
    statement: The defined meaning applies only where the context does not otherwise require and the person meets the Chartered
      Accountants Act 1949 definition.
compounds:
- id: C_DOCA
  question: 'Section 2(35): Definition Of Cost Accountant?'
  includes:
  - M_DOCA_LE_CAE
  produces:
  - product: M_DOCA_PD_CAE
    from:
    - M_DOCA_LE_CAE
- id: C_DOCHA
  question: 'Section 2(23): Definition Of Chartered Accountant?'
  includes:
  - M_DOCHA_LE_DMA
  produces:
  - product: M_DOCHA_PD_DMA
    from:
    - M_DOCHA_LE_DMA
time:
  law_date: F_DOI
