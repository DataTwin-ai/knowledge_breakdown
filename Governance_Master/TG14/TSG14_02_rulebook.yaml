# GOVERNANCE MASTER TSG14_02 Amendments & effective dates (TG14 Definitions & Effective Law)
# LAW ARC - 2 laws - status APPROVED
name: TSG14_02 Amendments & effective dates - GOVERNANCE MASTER rulebook
version: TSG14_02
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_ACBN:  # 1. 1 gate | 1 law(s)
    name: Activity Covered By Notification
    type: BOOLEAN
    tier: T1
    origin:
      document: NOTIFICATION
      method: LOOKUP
      uses: [NOTIFICATION.notified_class, NOTIFICATION.notified_items, NOTIFICATION.effective_from, SALE_INVOICE.line_description, SALE_INVOICE.hsn_sac]
      how_to_get: Take the activity description from SALE_INVOICE.line_description and SALE_INVOICE.hsn_sac. Look in our notification register (Law/) for a notification whose notified_class or notified_items matches the activity and whose effective_from is on or before the date of supply. If a match is found the value is true, otherwise false.
      fallback: 'If the activity cannot be matched with confidence, ask the user: ''Is this activity covered by a Government notification? If yes, give the notification number.'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: MEDIUM
      example: 'true'
      confidence: low
      sensitive: false
      reviewed: false
      origin_by: AI
  F_AUT:  # 2. 1 gate | 1 law(s)
    name: Activity Undertaker Type
    type: CODE
    options:
    - CENTRAL_GOVT
    - STATE_GOVT
    - LOCAL_AUTHORITY
    - OTHER
    tier: T1
    origin:
      document: GST_REGISTRATION
      method: LOOKUP
      uses: [SALE_INVOICE.supplier_gstin, GST_REGISTRATION.constitution_of_business, GST_REGISTRATION.legal_name, GST_REGISTRATION.state]
      how_to_get: 'Take SALE_INVOICE.supplier_gstin and look it up in the GST portal search taxpayer API. Read GST_REGISTRATION.constitution_of_business and map it: Central Government to CENTRAL_GOVT, State Government to STATE_GOVT, Local Authority to LOCAL_AUTHORITY, anything else to OTHER. If the constitution is only ''Government Department'', use GST_REGISTRATION.state and legal_name to choose central or state.'
      fallback: 'Ask the user: ''Is the body doing this activity the Central Government, a State Government, a local authority or another body?'''
      when_missing: ASK
      as_of: date of supply
      level: TAXPAYER
      ai_level: NONE
      cost: MEDIUM
      example: LOCAL_AUTHORITY
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_NRB:  # 3. 1 gate | 1 law(s)
    name: Notification Recommending Body
    type: CODE
    options:
    - COUNCIL
    - NONE_STATED
    - OTHER
    tier: T1
    origin:
      document: NOTIFICATION
      method: FIELD
      uses: [NOTIFICATION.recommended_by]
      how_to_get: Take NOTIFICATION.recommended_by from the notification in Law/. If it names the GST Council, the value is COUNCIL. If the field is empty or says nothing about a recommendation, the value is NONE_STATED. If it names any other body, the value is OTHER.
      fallback: Read the preamble of the notification text for the words 'on the recommendations of the Council'.
      when_missing: STOP
      as_of: notification date
      level: DOCUMENT
      ai_level: NONE
      cost: LOW
      example: COUNCIL
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  # ---- LAST: only heavy checks (free text) need these
  F_DOAOT:  # 4. LAST (heavy check only) | 1 law(s)
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description, CONTRACT.employment_terms]
      how_to_get: Read the contract subject, then property_description if it is about property, or employment_terms if it is about employment. Write a short plain-text description of the activity or transaction and who does it for whom.
      fallback: 'Use SALE_INVOICE.line_description. If that is also missing, ask the user: Please describe the activity or transaction.'
      when_missing: ASK
      as_of: date of the activity or transaction
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: Sale of a vacant plot of land to a buyer
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOTA:  # 5. LAST (heavy check only) | 1 law(s) | asked only if M_NGANGNS: F_ACBN + F_AUT + F_NRB
    name: Description Of The Activity
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.parties, CONTRACT.subject]
      how_to_get: Read parties and subject. Write what the activity consists of, and whether the Central Government, a State Government or a local authority carries it out as a public authority (sovereign function) or as a commercial service.
      fallback: 'Ask the user: What is the activity, and does the government body carry it on as a public authority?'
      when_missing: ASK
      as_of: date of the activity
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: Municipal corporation issuing a trade licence as a statutory function
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_ANGNS_A_ASISIII:
    statement: The activity or transaction is specified in Schedule III
    order: HIGH
    interpretation: Does the activity or transaction described in the document match an entry specified in Schedule III?
    grounding:
    - F_DOAOT
    handler: heavy
  M_NGANGNS_A_UBGB:
    statement: The activity or transaction is undertaken by the Central Government, a State Government or any local authority.
    order: LOW
    rule: F_AUT IN ['CENTRAL_GOVT', 'STATE_GOVT', 'LOCAL_AUTHORITY']
    handler: python
  M_NGANGNS_A_EAPA:
    statement: The Central Government, State Government or local authority is engaged in the activity or transaction as a
      public authority.
    order: HIGH
    if_false: the activity is carried on other than as a public authority
    interpretation: On the description of the activity, is the government body engaged in it as a public authority, rather
      than in an ordinary commercial or private capacity?
    grounding:
    - F_DOTA
    handler: heavy
  M_NGANGNS_A_AINBG:
    statement: The activity or transaction is one that may be notified by the Government and has been so notified.
    order: LOW
    rule: F_ACBN = TRUE
    handler: python
  M_GPTNQR_A_NOCR:
    statement: The Government's notification of the class of registered persons is made on the recommendations of the Council
    order: LOW
    rule: F_NRB = 'COUNCIL'
    handler: python
groups: {}
outcomes:
  M_ANGNS_LE_SIIINSO:
    outcome: NEITHER_GOODS_NOR_SERVICES
    expr: M_ANGNS_A_ASISIII
    module: M_ANGNS
    description: The activity or transaction is treated neither as a supply of goods nor as a supply of services when it is
      specified in Schedule III, notwithstanding sub-section (1).
  M_NGANGNS_LE_NANS:
    outcome: NEITHER_GOODS_NOR_SERVICES
    expr: M_NGANGNS_A_UBGB AND M_NGANGNS_A_EAPA AND M_NGANGNS_A_AINBG AND M_GPTNQR_A_NOCR
    module: M_NGANGNS
    description: When all four conditions hold, the activity or transaction shall be treated neither as a supply of goods
      nor a supply of services, overriding sub-section (1).
products:
  M_ANGNS_PD_SIIINSO:
    statement: The activity or transaction is treated neither as a supply of goods nor as a supply of services when it is
      specified in Schedule III, notwithstanding sub-section (1).
  M_NGANGNS_PD_NANS:
    statement: When all four conditions hold, the activity or transaction shall be treated neither as a supply of goods nor
      a supply of services, overriding sub-section (1).
compounds:
- id: C_S7_SS2
  question: 'Section 7(2): which clause applies?'
  includes:
  - M_ANGNS_LE_SIIINSO
  - M_NGANGNS_LE_NANS
  produces:
  - product: M_ANGNS_PD_SIIINSO
    from:
    - M_ANGNS_LE_SIIINSO
  - product: M_NGANGNS_PD_NANS
    from:
    - M_NGANGNS_LE_NANS
time:
  law_date: F_DOI
