# GOVERNANCE MASTER TSG14_02 Amendments & effective dates (TG14 Definitions & Effective Law)
# LAW ARC - 2 laws - status APPROVED
name: TSG14_02 Amendments & effective dates - GOVERNANCE MASTER rulebook
version: TSG14_02
facts:
  F_PETRO_LEVY_EFFECTIVE_DATE:
    name: Notified effective date for levy on specified petroleum products
    type: DATE
    tier: T1
  F_SUPPLY_DATE:
    name: Date of supply
    type: DATE
    tier: T1
  F_NOTIFICATION_EFFECTIVE_DATE_EXISTS:
    name: Notification specifies an effective date
    type: BOOLEAN
    tier: T1
predicates:
  A_M_LOCTOPP_6:
    statement: A date for the levy of central tax on the specified petroleum products has been notified by the Government
    order: LOW
    rule: F_PETRO_LEVY_EFFECTIVE_DATE IS_SET
  A_M_LOCTOPP_8:
    statement: The supply takes place on or after the notified effective date
    order: HIGH
    interpretation: Does the date of supply occur on or after the notified effective date for the levy on specified petroleum
      products?
    grounding:
    - F_SUPPLY_DATE
    - F_PETRO_LEVY_EFFECTIVE_DATE
  A_M_GPTGE_9:
    statement: The notification specifies an effective date for the exemption
    order: LOW
    rule: F_NOTIFICATION_EFFECTIVE_DATE_EXISTS = TRUE
groups: {}
outcomes:
  LE_M_LOCTOPP_6:
    outcome: M_LOCTOPP_6
    expr: A_M_LOCTOPP_6
    module: M_LOCTOPP
    description: A date for the levy of central tax on the specified petroleum products has been notified by the Government
      (Section 9(2), part of the law)
  LE_M_LOCTOPP_8:
    outcome: M_LOCTOPP_8
    expr: A_M_LOCTOPP_8
    module: M_LOCTOPP
    description: The supply takes place on or after the notified effective date (Section 9(2), part of the law)
  LE_M_GPTGE_9:
    outcome: M_GPTGE_9
    expr: A_M_GPTGE_9
    module: M_GPTGE
    description: The notification specifies an effective date for the exemption (Section 11(1), part of the law)
products:
  PD_M_LOCTOPP_6:
    statement: A date for the levy of central tax on the specified petroleum products has been notified by the Government
  PD_M_LOCTOPP_8:
    statement: The supply takes place on or after the notified effective date
  PD_M_GPTGE_9:
    statement: The notification specifies an effective date for the exemption
compounds:
- id: C_LOCTOPP
  question: A date for the levy of central tax on the specified petroleum products has been notified by the Government; The
    supply takes place on or after the notified effective date? (Section 9(2))
  includes:
  - LE_M_LOCTOPP_6
  - LE_M_LOCTOPP_8
  produces:
  - product: PD_M_LOCTOPP_6
    from:
    - LE_M_LOCTOPP_6
  - product: PD_M_LOCTOPP_8
    from:
    - LE_M_LOCTOPP_8
- id: C_GPTGE
  question: The notification specifies an effective date for the exemption? (Section 11(1))
  includes:
  - LE_M_GPTGE_9
  produces:
  - product: PD_M_GPTGE_9
    from:
    - LE_M_GPTGE_9
