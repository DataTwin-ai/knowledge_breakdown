      origin_by: AI
  F_PSS:  # 18. 2 | 1 law(s)
    name: Property Sale Subject
    type: CODE
    options:
    - BUILDING
    - LAND
    - LAND_AND_BUILDING
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.property_description, CONTRACT.subject]
      how_to_get: Read the property description in the sale deed or contract. If only land is sold, the value is LAND. If only a building is sold, the value is BUILDING. If both are sold, the value is LAND_AND_BUILDING. If it is something else, the value is OTHER.
      fallback: 'Ask the user: ''Is the property sold land, a building, or both?'''
      when_missing: ASK
      as_of: date of the sale deed
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: LAND_AND_BUILDING
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  # ---- LAST: only heavy checks (free text) need these
  F_DOAOT:  # 19. LAST (heavy check only) | 6 law(s) | asked only if M_ESTE: F_SKOT + F_PRR
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description, CONTRACT.employment_terms]
      how_to_get: Read the contract subject, then property_description if it is about property, or employment_terms if it is about employment. Write a short plain-text description of the activity or transaction and who does it for whom.
      fallback: 'Use SALE_INVOICE.line_description. If that is also missing, ask the user: Please describe the activity or transaction.'
      when_missing: ASK
      as_of: date of the activity or transaction
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: Sale of a vacant plot of land to a buyer
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOTA:  # 20. LAST (heavy check only) | 4 law(s) | asked only if M_FOEM: F_PEO | M_DBGBM: F_BEA + F_PBR + F_PDEBC
    name: Description Of The Activity
    type: TEXT
    tier: T1
    source_kind: DOCUMENT
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.parties, CONTRACT.subject]
      how_to_get: Read parties and subject. Write what the activity consists of, and whether the Central Government, a State Government or a local authority carries it out as a public authority (sovereign function) or as a commercial service.
      fallback: 'Ask the user: What is the activity, and does the government body carry it on as a public authority?'
      when_missing: ASK
      as_of: date of the activity
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: Municipal corporation issuing a trade licence as a statutory function
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PCM:  # 21. LAST (heavy check only) | 3 law(s)
    name: Provision Context Meaning
    type: CODE
    options:
    - CONTEXT_REQUIRES_OTHER_MEANING
    - NO_OTHER_MEANING_REQUIRED
    - UNDETERMINED
    tier: T1
    unit: M_DOISOG_CT_N
    origin: {document: SYSTEM, method: READ, how_to_get: 'The engine reads the provision that uses the defined term, with its neighbouring text. It decides whether that provision shows the term must carry a different meaning. Return CONTEXT_REQUIRES_OTHER_MEANING if so, NO_OTHER_MEANING_REQUIRED if the provision is consistent with the standard definition, and UNDETERMINED if it cannot tell. Never ask the user.', fallback: Return UNDETERMINED., when_missing: UNKNOWN, as_of: not date dependent (the law text as in force on the date of the transaction), level: DOCUMENT, ai_level: HIGH, cost: HIGH, example: NO_OTHER_MEANING_REQUIRED, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_SCS:  # 22. LAST (heavy check only) | 3 law(s)
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
    origin:
      document: CONTRACT
      method: DERIVED
      uses: [CONTRACT.consideration, CONTRACT.consideration_type]
      how_to_get: Read consideration and consideration_type from the contract. If consideration is blank or nil / zero (or the type says no consideration, e.g. gift), the value is NONE. If consideration_type or the papers show it has been paid (cash, bank, advance received), the value is PAID. If an amount or benefit is promised but not yet paid, the value is AGREED.
      fallback: 'Use SALE_INVOICE.total_value: if it is above zero there is a consideration (AGREED, or PAID if payment is shown). Otherwise ask the user: ''Is anything paid or promised in return for this supply?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: AGREED
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
