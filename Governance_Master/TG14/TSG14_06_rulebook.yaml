# GOVERNANCE MASTER TSG14_06 Statutory Interpretation of Definitions (TG14 Definitions & Effective Law)
# LAW ARC - 20 laws - status NEEDS_REVIEW
name: TSG14_06 Statutory Interpretation of Definitions - GOVERNANCE MASTER rulebook
version: TSG14_06
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_SKOT:  # 1. 1 gate | 3 law(s)
    name: Supply Kind Of Transaction
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
    origin:
      document: SALE_INVOICE
      method: LOOKUP
      uses: [SALE_INVOICE.hsn_sac]
      how_to_get: 'For each line take hsn_sac. Look it up in the HSN/SAC table: codes beginning with 99 are services, other codes are goods. If all lines are goods the value is GOODS, if all are services the value is SERVICES, if both appear the value is BOTH.'
      fallback: 'Read SALE_INVOICE.line_description and decide goods or services; if still unclear, read CONTRACT.subject or ask the user: ''Is this a sale of goods, a service, or both?'''
      when_missing: ASK
      as_of: invoice date
      level: INVOICE
      ai_level: NONE
      cost: MEDIUM
      example: SERVICES
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_GWS:  # 2. 1 gate | 2 law(s)
    name: Goods Warehousing Status
    type: CODE
    options:
    - NOT_WAREHOUSED
    - OTHER
    - WAREHOUSED
    tier: T0
    origin:
      document: CUSTOMS
      method: FIELD
      uses: [CUSTOMS.warehoused, CUSTOMS.be_type]
      how_to_get: Take CUSTOMS.warehoused from the bill of entry or warehouse papers. If true, the value is WAREHOUSED. If false, the value is NOT_WAREHOUSED. If the be_type shows something that is neither, the value is OTHER.
      fallback: 'If the warehoused flag is empty, treat a filled CUSTOMS.warehouse_code as WAREHOUSED. Otherwise ask the user: ''Were the goods held in a customs warehouse when supplied?'''
      when_missing: ASK
      as_of: date of supply
      level: LINE_ITEM
      ai_level: NONE
      cost: LOW
      example: WAREHOUSED
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_HCS:  # 3. 1 gate | 2 law(s)
    name: Home Clearance Status
    type: CODE
    options:
    - BEFORE_CLEARANCE
    - CLEARED_FOR_HOME_CONSUMPTION
    - OTHER
    tier: T1
    origin:
      document: CUSTOMS
      method: FIELD
      uses: [CUSTOMS.cleared_for_home_consumption, CUSTOMS.be_date]
      how_to_get: Take CUSTOMS.cleared_for_home_consumption from the bill of entry. If it is false or not yet cleared on the date of supply, the value is BEFORE_CLEARANCE. If it is true and the clearance was on or before the date of supply, the value is CLEARED_FOR_HOME_CONSUMPTION. Otherwise OTHER.
      fallback: 'Ask the user: ''Had the goods been cleared for home consumption when you supplied them?'''
      when_missing: ASK
      as_of: date of supply
      level: LINE_ITEM
      ai_level: NONE
      cost: LOW
      example: BEFORE_CLEARANCE
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PEO:  # 4. 1 gate | 2 law(s)
    name: Person Elected Office
    type: CODE
    options:
    - MP
    - STATE_LEGISLATURE_MEMBER
    - PANCHAYAT_MEMBER
    - MUNICIPAL_MEMBER
    - OTHER_LOCAL_AUTHORITY_MEMBER
    - NONE
    tier: T1
    origin:
      document: PROFILE
      method: FIELD
      uses: [PROFILE.elected_office]
      how_to_get: 'From the person''s profile, read elected_office. Map it to one code: Member of Parliament gives MP, State Legislature gives STATE_LEGISLATURE_MEMBER, Panchayat gives PANCHAYAT_MEMBER, Municipality gives MUNICIPAL_MEMBER, any other local authority gives OTHER_LOCAL_AUTHORITY_MEMBER. If the field is blank, return NONE.'
      fallback: 'Ask the user: ''Which elected office does the person hold (MP, State Legislature, Panchayat, Municipality, other local authority, or none)?'''
      when_missing: ASK
      as_of: date the functions were performed
      level: TAXPAYER
      ai_level: NONE
      cost: LOW
      example: PANCHAYAT_MEMBER
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_BEA:  # 5. 1 gate | 1 law(s)
    name: Body Establishing Authority
    type: CODE
    options:
    - CENTRAL_GOVT
    - STATE_GOVT
    - LOCAL_AUTHORITY
    - OTHER
    tier: T1
    origin:
      document: PROFILE
      method: FIELD
      uses: [PROFILE.established_by, PROFILE.establishing_law]
      how_to_get: 'Read PROFILE.established_by. Map it: Central Government to CENTRAL_GOVT, State Government to STATE_GOVT, Local Authority to LOCAL_AUTHORITY, anything else to OTHER.'
      fallback: Read PROFILE.establishing_law to see which government made the law that set up the body. If still unclear, ask the user who established the body.
      when_missing: ASK
      as_of: date of supply
      level: TAXPAYER
      ai_level: NONE
      cost: LOW
      example: STATE_GOVT
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DPT:  # 6. 1 gate | 1 law(s)
    name: Destination Place Territory
    type: CODE
    options:
    - NON_TAXABLE_TERRITORY
    - OTHER_TERRITORY
    tier: T1
    origin:
      document: SALE_INVOICE
      method: LOOKUP
      uses: [SALE_INVOICE.ship_to_state]
      how_to_get: Read ship_to_state from the invoice. Look it up in the table of Indian states and Union Territories. If it is found, the value is OTHER_TERRITORY. If it is a place outside India, the value is NON_TAXABLE_TERRITORY.
      fallback: 'Use SALE_INVOICE.place_of_supply the same way. If both are empty, ask the user: To which country or state are the goods delivered?'
      when_missing: ASK
      as_of: date of supply
      level: INVOICE
      ai_level: NONE
      cost: MEDIUM
      example: OTHER_TERRITORY
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_GDPL:  # 7. 1 gate | 1 law(s)
    name: Goods Dispatch Port Location
    type: CODE
    options:
    - INDIA_PORT
    - NOT_DISPATCHED
    - OUTSIDE_INDIA_PORT
    tier: T1
    origin:
      document: USER
      method: ASK
      uses: [CUSTOMS.be_no, CUSTOMS.port_code]
      how_to_get: 'Ask the user: ''Have the goods been dispatched yet? If so, was the port of dispatch in India or outside India?'' Answers map to NOT_DISPATCHED, INDIA_PORT or OUTSIDE_INDIA_PORT.'
      fallback: If a CUSTOMS bill of entry exists with be_no, the goods were dispatched from outside India, so use OUTSIDE_INDIA_PORT.
      when_missing: UNKNOWN
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: HIGH
      example: OUTSIDE_INDIA_PORT
      confidence: low
      sensitive: false
      reviewed: false
      origin_by: AI
  F_GEII:  # 8. 1 gate | 1 law(s)
    name: Goods Entry Into India
    type: CODE
    options:
    - ENTERS_INDIA
    - DOES_NOT_ENTER
    tier: T1
    derived_from:
    - F_SOOT
    formula: If F_SOOT = 'IMPORT', then F_GEII = 'ENTERS_INDIA'. Otherwise (if F_SOOT = 'EXPORT' or 'DOMESTIC'), F_GEII =
      'DOES_NOT_ENTER'.
    origin:
      document: CUSTOMS
      method: DERIVED
      uses: [F_SOOT, CUSTOMS.be_no]
      how_to_get: 'If a CUSTOMS bill of entry exists (CUSTOMS.be_no present), the goods entered India: ENTERS_INDIA. Otherwise use the origin and destination places from F_SOOT. If both are in the non-taxable territory and no bill of entry exists, the value is DOES_NOT_ENTER.'
      fallback: 'Ask the user: ''Did these goods enter into India?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: DOES_NOT_ENTER
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_GTM:  # 9. 1 gate | 1 law(s)
    name: Goods Transfer Mechanism
    type: CODE
    options:
    - ENDORSEMENT_OF_DOCUMENTS_OF_TITLE
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject]
      how_to_get: Read CONTRACT.subject for how the goods are passed to the buyer. If it says the documents of title (bill of lading, delivery order) are endorsed to the buyer, the value is ENDORSEMENT_OF_DOCUMENTS_OF_TITLE. Otherwise OTHER.
      fallback: 'Ask the user: ''Were the goods transferred by endorsement of documents of title, or in another way?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: ENDORSEMENT_OF_DOCUMENTS_OF_TITLE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ODR:  # 10. 1 gate | 1 law(s)
    name: Origin Destination Relation
    type: CODE
    options:
    - DIFFERENT_PLACE
    - SAME_PLACE
    tier: T1
    origin:
      document: SALE_INVOICE
      method: DERIVED
      uses: [SALE_INVOICE.supplier_state, SALE_INVOICE.ship_to_state, SALE_INVOICE.place_of_supply]
      how_to_get: Compare the origin place with the destination place on the invoice. Origin is supplier_state. Destination is ship_to_state, or place_of_supply if ship_to_state is blank. Return SAME_PLACE if they are the same, otherwise DIFFERENT_PLACE.
      fallback: 'Ask the user: ''Is the place the goods are sent to the same as the place they are sent from?'''
      when_missing: ASK
      as_of: date of supply (invoice date)
      level: TRANSACTION
      ai_level: NONE
      cost: LOW
      example: DIFFERENT_PLACE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_OPT:  # 11. 1 gate | 1 law(s)
    name: Origin Place Territory
    type: CODE
    options:
    - NON_TAXABLE_TERRITORY
    - OTHER_TERRITORY
    tier: T1
    origin:
      document: SALE_INVOICE
      method: LOOKUP
      uses: [SALE_INVOICE.supplier_state]
      how_to_get: Take supplier_state from the invoice. Look it up in the table of Indian States and Union Territories. If it is found, return OTHER_TERRITORY. If it is a place outside India's taxable territory (a foreign country or other place outside India), return NON_TAXABLE_TERRITORY.
      fallback: 'Ask the user: ''Were the goods supplied from a place outside India''s taxable territory?'''
      when_missing: ASK
      as_of: date of supply (invoice date)
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: OTHER_TERRITORY
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PBR:  # 12. 1 gate | 1 law(s)
    name: Person Body Role
    type: CODE
    options:
    - CHAIRPERSON
    - MEMBER
    - DIRECTOR
    - OTHER
    tier: T1
    origin:
      document: PROFILE
      method: FIELD
      uses: [PROFILE.post_held, PROFILE.designation]
      how_to_get: 'From the person''s profile, read post_held (or designation if post_held is blank). Python maps the text: Chairperson or Chairman to CHAIRPERSON, Member to MEMBER, Director to DIRECTOR, anything else to OTHER.'
      fallback: 'Ask the user: ''Is the person a Chairperson, a Member or a Director of the body, or something else?'''
      when_missing: ASK
      as_of: date the duties were performed
      level: TAXPAYER
      ai_level: NONE
      cost: LOW
      example: DIRECTOR
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PDEBC:  # 13. 1 gate | 1 law(s)
    name: Person Deemed Employee Before Commencement
    type: BOOLEAN
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.employment_terms, CONTRACT.start_date, CONTRACT.parties]
      how_to_get: 'Read the employment papers in the contract: employment_terms, start_date and parties. Decide whether the person was in an employer-employee relationship (or deemed to be one) with the body before the clause commenced. Return true if so, otherwise false.'
      fallback: 'Ask the user: ''Before this rule came into force, was the person treated as an employee of the body?'''
      when_missing: ASK
      as_of: date the clause commenced
      level: TAXPAYER
      ai_level: HIGH
      cost: HIGH
      example: 'false'
      confidence: low
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PRR:  # 14. 1 gate | 1 law(s)
    name: Provider Recipient Relation
    type: CODE
    options:
    - CONTRACTOR_CLIENT
    - DISTINCT_PERSONS
    - EMPLOYEE_EMPLOYER
    - OTHER
    - PRINCIPAL_AGENT
    - RELATED_PERSONS
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.relation_between_parties, CONTRACT.parties, CONTRACT.employment_terms]
      how_to_get: Read the relation between the parties in the contract. Map it to EMPLOYEE_EMPLOYER, PRINCIPAL_AGENT, CONTRACTOR_CLIENT, RELATED_PERSONS or DISTINCT_PERSONS. If there is no stated relation, use the parties and the employment terms to decide. Use OTHER if none fits.
      fallback: 'Ask the user: ''What is the relationship between the provider and the recipient: employee-employer, principal-agent, or something else?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: EMPLOYEE_EMPLOYER
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_RRIT:  # 15. 1 gate | 1 law(s)
    name: Recipient Role In Transaction
    type: CODE
    options:
    - CONSIGNEE
    - OTHER_PERSON
    tier: T0
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Is the buyer the consignee named in the bill of lading / bill of entry, or another person to whom the consignee transferred the goods by endorsing the documents of title?''. Map consignee to CONSIGNEE and any other person to OTHER_PERSON.', fallback: 'Compare the recipient on SALE_INVOICE (recipient_name) with the importer on the customs papers (CUSTOMS.importer_iec). If they are different persons, the value is OTHER_PERSON.', when_missing: ASK, as_of: date of supply, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: OTHER_PERSON, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_SRIS:  # 16. 1 gate | 1 law(s)
    name: Supplier Role In Supply
    type: CODE
    options:
    - CONSIGNEE
    - OTHER
    tier: T0
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Is the person making this supply the consignee of the goods named in the bill of lading or import papers?'' Answer yes gives CONSIGNEE, no gives OTHER.', fallback: 'If a CUSTOMS bill of entry is available, compare importer_iec with the supplier''s IEC; if it is not the same, the value is OTHER.', when_missing: UNKNOWN, as_of: date of supply, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: OTHER, confidence: low, sensitive: false, reviewed: false, origin_by: AI}
