# GOVERNANCE MASTER TSG14_01 General definitions (TG14 Definitions & Effective Law)
# LAW ARC - 8 laws - status NEEDS_REVIEW
name: TSG14_01 General definitions - GOVERNANCE MASTER rulebook
version: TSG14_01
facts:
  F_ENTITY_IS_LEGAL_PERSON:
    name: Entity is a legal person
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_TAXABLE:
    name: Person making the supply is a taxable person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_CAPACITY:
    name: Capacity in which the supply is made
    type: CODE
    options:
    - OWN_ACCOUNT
    - AGENT_FOR_PRINCIPAL
    tier: T1
  F_DETERMINATION_CONTEXT:
    name: Context of legal determination
    type: CODE
    options:
    - OTHER
    - S22_REGISTRATION_LIABILITY
    tier: T1
  F_STATE_IS_CONSTITUTIONALLY_SCS:
    name: State is specified as Special Category in Article 279A(4)(g) of the Constitution
    type: BOOLEAN
    tier: T1
  F_STATE_NAME:
    name: Name of the State
    type: TEXT
    tier: T0
  F_CONSTRUCTION_ACTIVITY_TYPE:
    name: Type of construction activity
    type: CODE
    options:
    - ADDITION
    - ALTERATION
    - REPLACEMENT
    - REMODELLING
    - OTHER
    tier: T1
  F_STRUCTURE_IS_CIVIL:
    name: Structure is a civil structure
    type: BOOLEAN
    tier: T1
  F_STRUCTURE_IS_EXISTING:
    name: Structure is an existing structure
    type: BOOLEAN
    tier: T1
  F_ACTIVITY_DESCRIPTION:
    name: Description of the supplier's business activity
    type: TEXT
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_CONSTRUCTION_APPLICATION_CONTEXT:
    name: Clause of Section 17(5) for which the expression construction is being applied
    type: CODE
    options:
    - CLAUSE_C
    - CLAUSE_D
    - OTHER
    tier: T1
  F_WORK_KIND:
    name: Kind of work done to the immovable property
    type: CODE
    options:
    - RECONSTRUCTION
    - RENOVATION
    - ADDITION
    - ALTERATION
    - REPAIR
    - OTHER
    tier: T1
  F_WORK_DESCRIPTION:
    name: Description of the work done to the immovable property
    type: TEXT
    tier: T1
  F_WORK_CAPITALISED_AMOUNT:
    name: Amount of expenditure on the work that is capitalised
    type: AMOUNT
    tier: T1
  F_WORK_ON_SAID_IMMOVABLE_PROPERTY:
    name: Work is done to the immovable property referred to in clauses (c) and (d)
    type: BOOLEAN
    tier: T1
predicates:
  A_LEGAL_PERSON_INCLUDED:
    statement: For the purposes of this Act, the term "person" also includes legal persons
    order: LOW
    rule: F_ENTITY_IS_LEGAL_PERSON = TRUE
  A_TAXABLE_PERSON_S22:
    statement: The supply is made by a taxable person
    order: LOW
    rule: F_PERSON_IS_TAXABLE = TRUE
  A_OWN_ACCOUNT_SUPPLY_S22:
    statement: The supply is made on the person's own account
    order: LOW
    rule: F_SUPPLY_CAPACITY = 'OWN_ACCOUNT'
  A_PRINCIPAL_ACCOUNT_SUPPLY_S22:
    statement: The supply is made on behalf of all the person's principals
    order: LOW
    rule: F_SUPPLY_CAPACITY = 'AGENT_FOR_PRINCIPAL'
  A_SCS_DEF_SCOPE:
    statement: The definition of 'special category States' is for the purposes of Section 22.
    order: LOW
    rule: F_DETERMINATION_CONTEXT = 'S22_REGISTRATION_LIABILITY'
  A_SCS_CONSTITUTIONAL_SPECIFICATION:
    statement: The State is specified in sub-clause (g) of clause (4) of article 279A of the Constitution.
    order: LOW
    rule: F_STATE_IS_CONSTITUTIONALLY_SCS = TRUE
  A_SCS_DEF_EXCLUSION:
    statement: The State is the State of Jammu and Kashmir, or one of the States of Arunachal Pradesh, Assam, Himachal Pradesh,
      Meghalaya, Sikkim, or Uttarakhand.
    order: LOW
    rule: F_STATE_NAME IN ['JAMMU_AND_KASHMIR', 'ARUNACHAL_PRADESH', 'ASSAM', 'HIMACHAL_PRADESH', 'MEGHALAYA', 'SIKKIM', 'UTTARAKHAND']
  A_CONSTRUCTION_ADDITION:
    statement: The expression "construction" includes additions to any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'ADDITION' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_ALTERATION:
    statement: The expression "construction" includes alterations to any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'ALTERATION' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_REPLACEMENT:
    statement: The expression "construction" includes replacements of any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'REPLACEMENT' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_REMODELLING:
    statement: The expression "construction" includes remodelling of any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'REMODELLING' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_OTHER:
    statement: The expression "construction" includes other activities of a similar nature to additions, alterations, replacements
      or remodelling of any existing civil structure.
    order: HIGH
    interpretation: Is the activity of a similar nature to additions, alterations, replacements or remodelling of an existing
      civil structure?
    grounding:
    - F_CONSTRUCTION_ACTIVITY_TYPE
    - F_STRUCTURE_IS_CIVIL
    - F_STRUCTURE_IS_EXISTING
    - F_ACTIVITY_DESCRIPTION
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_CONTEXT:
    statement: The expression 'construction' is being applied for the purposes of clauses (c) and (d) of Section 17(5)
    order: LOW
    rule: F_CONSTRUCTION_APPLICATION_CONTEXT IN ['CLAUSE_C', 'CLAUSE_D']
  A_RECON:
    statement: The work done to the said immovable property is re-construction
    order: LOW
    rule: F_WORK_KIND = 'RECONSTRUCTION'
  A_RENOV:
    statement: The work done to the said immovable property is renovation
    order: LOW
    rule: F_WORK_KIND = 'RENOVATION'
  A_ADDITION:
    statement: The work done to the said immovable property is an addition
    order: LOW
    rule: F_WORK_KIND = 'ADDITION'
  A_ALTERATION:
    statement: The work done to the said immovable property is an alteration
    order: LOW
    rule: F_WORK_KIND = 'ALTERATION'
  A_REPAIRS:
    statement: The work done to the said immovable property is repairs
    order: LOW
    rule: F_WORK_KIND = 'REPAIR'
  A_OTHER_CONS:
    statement: The work is construction in the ordinary sense or other work not listed that falls within the expression 'construction',
      since 'includes' does not limit the expression to the listed works
    order: HIGH
    interpretation: Is the work construction in its ordinary sense or of the same kind as the listed works, so that it is
      within the expression construction by virtue of the open word includes?
    grounding:
    - F_WORK_KIND
    - F_WORK_DESCRIPTION
  A_CAPITALISED:
    statement: The listed work is included in 'construction' to the extent of capitalisation
    order: LOW
    rule: F_WORK_CAPITALISED_AMOUNT > 0
  A_IMMOV:
    statement: The work is done to the said immovable property
    order: LOW
    rule: F_WORK_ON_SAID_IMMOVABLE_PROPERTY = TRUE
groups:
  G_SUPPLY_CAPACITY_S22:
    name: Supply capacity for Section 22 aggregate turnover
    logic: ANY
    members:
    - A_OWN_ACCOUNT_SUPPLY_S22
    - A_PRINCIPAL_ACCOUNT_SUPPLY_S22
    description: The supply was made either on the person's own account or on behalf of their principals.
  G_CONSTRUCTION_ACTIVITIES:
    name: Construction Activities Definition
    logic: ANY
    members:
    - A_CONSTRUCTION_ADDITION
    - A_CONSTRUCTION_ALTERATION
    - A_CONSTRUCTION_REPLACEMENT
    - A_CONSTRUCTION_REMODELLING
    - A_CONSTRUCTION_OTHER
    description: The expression 'construction' includes any of these activities.
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_LISTED_KINDS:
    name: Listed kinds of work
    logic: ANY
    members:
    - A_RECON
    - A_RENOV
    - A_ADDITION
    - A_ALTERATION
    - A_REPAIRS
    description: Re-construction, renovation, additions, alterations and repairs are alternatives
  G_LISTED_WORKS:
    name: Listed work capitalised on the said immovable property
    logic: ALL
    members:
    - G_LISTED_KINDS
    - A_CAPITALISED
    - A_IMMOV
    description: A listed kind of work, to the extent of capitalisation, to the said immovable property
  G_CONSTRUCTION:
    name: Work within construction
    logic: ANY
    members:
    - G_LISTED_WORKS
    - A_OTHER_CONS
    description: Because the word includes is open-ended, the listed works are one route and other construction remains a
      separate route
outcomes:
  LE_DOPIL:
    outcome: ENTITY_IS_PERSON_AS_LEGAL_PERSON
    expr: A_LEGAL_PERSON_INCLUDED
    module: M_DOPIL
    description: An entity that is a legal person is within the term person for the purposes of this Act.
  LE_ATDFS22:
    outcome: SUPPLY_INCLUDED_IN_AGGREGATE_TURNOVER_FOR_S22
    expr: A_TAXABLE_PERSON_S22 AND G_SUPPLY_CAPACITY_S22
    module: M_ATDFS22
    description: A supply is included in the aggregate turnover for Section 22 if it is made by a taxable person, either on
      their own account or on behalf of principals.
  LE_SCSDFS22:
    outcome: IS_SPECIAL_CATEGORY_STATE_FOR_S22
    expr: A_SCS_DEF_SCOPE AND A_SCS_CONSTITUTIONAL_SPECIFICATION AND (NOT A_SCS_DEF_EXCLUSION)
    module: M_SCSDFS22
  LE_CDI_CONSTRUCTION_DEFINITION:
    outcome: CONSTRUCTION_DEFINITION_MET
    expr: G_CONSTRUCTION_ACTIVITIES
    module: M_CDI
    description: For the purposes of this clause, the expression 'construction' is defined.
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_CIRRR:
    outcome: CONSTRUCTION_INCLUDES_WORK
    expr: A_CONTEXT AND G_CONSTRUCTION
    module: M_CIRRR
    description: The work falls within the expression construction when applied for clauses (c) and (d) and it is either a
      listed work that is capitalised and done to the said immovable property or another work that is construction. The list
      is open-ended.
products:
  PD_DOPIL:
    statement: An entity that is a legal person is within the term person for the purposes of this Act.
  PD_ATDFS22:
    statement: A supply is included in the aggregate turnover for Section 22 if it is made by a taxable person, either on
      their own account or on behalf of principals.
  PD_SCSDFS22:
    statement: IS_SPECIAL_CATEGORY_STATE_FOR_S22
  PD_CDI_CONSTRUCTION_DEFINITION:
    statement: For the purposes of this clause, the expression 'construction' is defined.
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_CIRRR:
    statement: The work falls within the expression construction when applied for clauses (c) and (d) and it is either a listed
      work that is capitalised and done to the said immovable property or another work that is construction. The list is open-ended.
compounds:
- id: C_DOPIL
  question: 'Section 15, Explanation (b): Definition Of Person Includes Legal?'
  includes:
  - LE_DOPIL
  produces:
  - product: PD_DOPIL
    from:
    - LE_DOPIL
- id: C_S22_E1
  question: 'Section 22, Explanation : which clause applies?'
  includes:
  - LE_ATDFS22
  - LE_SCSDFS22
  produces:
  - product: PD_ATDFS22
    from:
    - LE_ATDFS22
  - product: PD_SCSDFS22
    from:
    - LE_SCSDFS22
- id: C_CDI
  question: 'Schedule II, paragraph 5(b), Explanation (2): Construction Definition Includes?'
  includes:
  - LE_CDI_CONSTRUCTION_DEFINITION
  produces:
  - product: PD_CDI_CONSTRUCTION_DEFINITION
    from:
    - LE_CDI_CONSTRUCTION_DEFINITION
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_CIRRR
  question: 'Explanation to Section 17(5)(d): Construction Includes Reconstruction Renovation Repairs?'
  includes:
  - LE_CIRRR
  produces:
  - product: PD_CIRRR
    from:
    - LE_CIRRR
