  LE_M_CIFIS_2:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX
    expr: G_M_CIFIS_1 AND A_M_CIFIS_5 AND G_M_CIFIS_3 AND G_M_CIFIS_2
    module: M_CIFIS
