  PD_CSPOTAI_1:
    statement: Compliance is met if the person is not under the composition scheme, or if they are and they have complied
      with both prohibitions (not collecting tax and not claiming ITC).
  PD_M_COLOTEL_1:
    statement: The composition option lapses if the person has availed the option and their turnover exceeds the applicable
