    tier: T1
  F_REGISTRATION_EXTENSION_DAYS:
    name: Duration of the granted registration period extension
    type: AMOUNT
    tier: T1
  F_DEPOSIT_FOR_EXTENSION_IS_ADEQUATE:
    name: Additional deposit for extension is equivalent to the estimated tax liability for the extension period
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_TAXABLE:
    name: The supply is taxable under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_OIDAR_SERVICE:
    name: Supply is an OIDAR service
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_LOCATED_OUTSIDE_INDIA:
    name: Supplier of service is located outside India
    type: BOOLEAN
    tier: T1
  F_RECIPIENT_LOCATED_IN_INDIA:
    name: Recipient is located in India
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_CONSECUTIVE_RETURN_PERIODS_MISSED:
    name: Number of consecutive tax periods for which returns were not furnished
    type: AMOUNT
    tier: T0
  F_PERSON_IS_S10_TAXPAYER:
    name: Person is paying tax under section 10
    type: BOOLEAN
    tier: T0
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_MANNER:
    name: Manner in which the goods are supplied
    type: CODE
    options:
    - BY_WAY_OF_SERVICE
    - AS_PART_OF_SERVICE
    - ANY_OTHER_MANNER
    - NONE
    tier: T1
  F_GOODS_IS_FOOD:
    name: Goods supplied are food
    type: BOOLEAN
    tier: T1
  F_GOODS_IS_OTHER_ARTICLE_FOR_HUMAN_CONSUMPTION:
    name: Goods supplied are an article for human consumption other than food
    type: BOOLEAN
    tier: T1
  F_GOODS_IS_DRINK:
    name: Goods supplied are a drink
    type: BOOLEAN
    tier: T1
  F_GOODS_IS_ALCOHOLIC_LIQUOR_FOR_HUMAN_CONSUMPTION:
    name: Goods are alcoholic liquor for human consumption
    type: BOOLEAN
    tier: T1
  F_CONSIDERATION_IN_CASH:
    name: Supply or service is for cash
    type: BOOLEAN
    tier: T1
  F_CONSIDERATION_DEFERRED_PAYMENT:
    name: Supply or service is for deferred payment
    type: BOOLEAN
    tier: T1
  F_CONSIDERATION_OTHER_VALUABLE:
    name: Supply or service is for other valuable consideration
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_TAXABLE:
    name: Person making the supply is a taxable person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_CAPACITY:
    name: Capacity in which the supply is made
    type: CODE
    options:
    - OWN_ACCOUNT
    - AGENT_FOR_PRINCIPAL
    tier: T1
  F_SUPPLY_GOODS_TYPE:
    name: Type of goods supplied
    type: CODE
    options:
    - PETROLEUM_CRUDE
    - HIGH_SPEED_DIESEL
    - MOTOR_SPIRIT
    - NATURAL_GAS
    - AVIATION_TURBINE_FUEL
    - OTHER
    tier: T1
  F_PETRO_LEVY_EFFECTIVE_DATE:
    name: Notified effective date for levy on specified petroleum products
    type: DATE
    tier: T1
  F_PETRO_LEVY_NOTIFICATION_HAS_COUNCIL_RECOMMENDATION:
    name: Notification for levy on petroleum products states it is on Council's recommendation
    type: BOOLEAN
    tier: T1
  F_RECIPIENT_IS_REGISTERED:
    name: Recipient is a registered person
    type: BOOLEAN
    tier: T0
  F_RECIPIENT_IN_NOTIFIED_CLASS_S9_4:
    name: Recipient belongs to a class of persons specified in a notification under CGST Act s9(4)
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IN_NOTIFIED_CATEGORY_S9_4:
    name: Supply is of a category of goods/services specified in a notification under CGST Act s9(4)
    type: BOOLEAN
    tier: T1
  F_SERVICE_IS_NOTIFIED_ECO_LIABILITY:
    name: Service is in a category notified for Electronic Commerce Operator tax liability
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_INTRA_STATE:
    name: Supply is an intra-State supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_THROUGH_ECO:
    name: Supply is facilitated by an electronic commerce operator
    type: BOOLEAN
    tier: T1
  F_ECO_PHYSICAL_PRESENCE_IN_TERRITORY:
    name: Electronic commerce operator has a physical presence in the taxable territory
    type: BOOLEAN
    tier: T1
  F_ECO_HAS_REPRESENTATIVE_IN_TERRITORY:
    name: A person represents the electronic commerce operator in the taxable territory
    type: BOOLEAN
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_SUPPLY_ORIGIN_LOCATION:
    name: Geographical origin of the supply
    type: CODE
    options:
    - TERRITORIAL_WATERS_OF_INDIA
    - OTHER
    tier: T1
  F_DAYS_BETWEEN_APP_AND_COMMENCEMENT:
    name: Number of days between registration application submission and business commencement
    type: AMOUNT
    tier: T0
  F_PERSON_HAS_SEZ_UNIT:
    name: Person has a unit in a Special Economic Zone
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_SEZ_DEVELOPER:
    name: Person is a Special Economic Zone developer
    type: BOOLEAN
    tier: T1
predicates:
  A_TAXABLE_PERSON_S22:
    statement: The supply is made by a taxable person
    order: LOW
    rule: F_PERSON_IS_TAXABLE = TRUE
  A_OWN_ACCOUNT_SUPPLY_S22:
    statement: The supply is made on the person's own account
    order: LOW
    rule: F_SUPPLY_CAPACITY = 'OWN_ACCOUNT'
  A_PRINCIPAL_ACCOUNT_SUPPLY_S22:
    statement: The supply is made on behalf of all the person's principals
    order: LOW
    rule: F_SUPPLY_CAPACITY = 'AGENT_FOR_PRINCIPAL'
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_M_ECONS_1:
    statement: The registered person is not engaged in making any supply of goods or services which are not leviable to tax
      under this Act.
    order: HIGH
    interpretation: Based on the description of the person's business activities, is the person engaged in making any supply
      of goods or services which are not leviable to tax under the CGST Act? A 'NO' answer to this question means the condition
      is met and this atom is TRUE.
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_ECOIS_1:
    statement: The person is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_ECOIS_2:
    statement: The person is not engaged in making any inter-State outward supplies of goods or services
    order: LOW
    rule: F_SUPPLIER_MAKES_INTERSTATE_OUTWARD_SUPPLIES = FALSE
  A_ECOES_1:
    statement: The registered person is not engaged in making any supply of goods or services through an electronic commerce
      operator who is required to collect tax at source under section 52.
    order: LOW
    rule: F_SUPPLIER_MAKES_SUPPLY_VIA_TCS_ECO = FALSE
  A_M_ECFNG_1:
    statement: The registered person is not a manufacturer of such goods as may be notified by the Government on the recommendations
      of the Council.
    order: HIGH
    interpretation: Based on the supplier's activities and products, confirm that they are NOT a manufacturer of any goods
      that have been notified by the Government (on the Council's recommendation) as ineligible for the composition scheme.
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_GOODS_MANUFACTURED_BY_SUPPLIER
  A_M_ECFTT_1:
    statement: The person opting for the composition scheme is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_ECFTT_2:
    statement: The person is not a casual taxable person
    order: LOW
    rule: F_SUPPLIER_IS_CASUAL_TAXPAYER = FALSE
  A_M_ECFTT_3:
    statement: The person is not a non-resident taxable person
    order: LOW
    rule: F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER = FALSE
  A_ATFCE_1:
    statement: For the purpose of determining eligibility to pay tax under this section, the aggregate turnover shall include
      the value of supplies made by the person from the 1st day of April of a financial year up to the date when he becomes
      liable for registration under this Act.
    order: HIGH
    interpretation: Does the calculation of 'aggregate turnover' for composition eligibility include the value of supplies
      from the 1st day of April of the financial year up to the date the person becomes liable for registration?
    grounding:
    - F_FINANCIAL_YEAR_START_DATE
    - F_REGISTRATION_LIABILITY_DATE
  A_ATFCE_2:
    statement: For the purpose of determining eligibility to pay tax under this section, the aggregate turnover shall not
      include the value of an exempt supply of services provided by way of extending deposits, loans or advances where the
      consideration is represented by way of interest or discount.
    order: LOW
    rule: F_SUPPLY_IS_EXEMPT = TRUE AND F_SUPPLY_TYPE = 'SERVICES' AND F_SERVICE_NATURE IN ['DEPOSIT_EXTENSION', 'LOAN_EXTENSION',
      'ADVANCE_EXTENSION'] AND F_CONSIDERATION_FORM IN ['INTEREST', 'DISCOUNT']
  A_M_EOIIFT_1:
    statement: For the purpose of determining tax payable by a person under this section, the 'turnover in State or turnover
      in Union territory' shall not include the value of the supply.
    order: LOW
    rule: F_PERSON_IS_COMPOSITION_TAXPAYER = TRUE
  A_M_EOIIFT_6:
    statement: The consideration for the supply is represented by way of interest.
    order: LOW
    rule: F_CONSIDERATION_FORM = 'INTEREST'
  A_M_EOIIFT_7:
    statement: The consideration for the supply is represented by way of discount.
    order: LOW
    rule: F_CONSIDERATION_FORM = 'DISCOUNT'
  A_PURPOSE:
