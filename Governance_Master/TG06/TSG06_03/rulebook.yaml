      for the second proviso.
  LE_GPTICL:
    outcome: COMPOSITION_LIMIT_INCREASE_AUTHORISED
    expr: G_INCREASE
    module: M_GPTICL
    description: An increase of the fifty lakh rupees limit is authorised under this proviso only if it is made by Government
      notification, to a higher amount, not above one crore and fifty lakh rupees, and as recommended by the Council
  LE_VALIDITY:
    outcome: CERTIFICATE_VALID_ON_TEST_DATE
    expr: G_PERSON AND A_VALIDITY
    module: M_VOCRC
    description: The certificate issued to a casual or non-resident taxable person is valid on the tested date only within
      the earlier of the period specified in the application or ninety days from the effective date of registration
  LE_SUPPLY_AFTER_CERT:
