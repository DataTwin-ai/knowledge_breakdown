  F_REGISTRATION_VALIDITY_TEST_DATE:
    name: Date on which the validity of the certificate of registration is being tested
    type: DATE
    tier: T0
  F_REGISTRATION_EFFECTIVE_DATE:
    name: Effective date of registration
    type: DATE
    tier: T0
  F_REGISTRATION_APPLICATION_PERIOD_END_DATE:
    name: Last date of the period specified in the application for registration
    type: DATE
    tier: T0
  F_SUPPLY_TAXABILITY_RESULT:
    name: Recorded result of the prior taxability determination for the supply made by the person
    type: CODE
    options:
    - TAXABLE
    - NOT_TAXABLE
    tier: T0
  F_REGISTRATION_CERTIFICATE_ISSUE_DATE:
    name: Date of issuance of the certificate of registration
    type: DATE
    tier: T0
  F_APPLICATION_EXTENSION_REASON:
    name: Reason provided for seeking extension of time
    type: TEXT
    tier: T1
  F_REGISTRATION_EXTENSION_GRANTED:
    name: Proper officer has granted an extension of the registration period
