    module: M_FADSAS
    description: The composite supply shall be treated as a supply of services when it is a supply of goods in the stated
      manner and the goods are food or another article for human consumption or a drink other than alcoholic liquor and the
      supply or service is for cash or deferred payment or other valuable considera
  LE_M_LOCTOPP:
    outcome: CENTRAL_TAX_LEVIABLE
