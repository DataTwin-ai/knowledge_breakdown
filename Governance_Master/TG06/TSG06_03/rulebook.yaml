  LE_RCM:
    outcome: S9_3_S9_4_PROVISIONS_PREVAIL_OVER_OPTION
    expr: A_OPT_LIEU AND G_RCM
    module: M_CIFNS
    description: The option is subject to the provisions of sub-sections (3) and (4) of section 9. Where those provisions
      apply, they continue to apply despite the option
  LE_OPTION:
    outcome: MAY_OPT_TO_PAY_COMPOSITION_AMOUNT_IN_LIEU_OF_S9_1_TAX
    expr: G_ELIG_CIFNP
    module: M_CIFNP
    description: Notwithstanding anything to the contrary in the Act, the person may opt when every eligibility condition
      is met. This is a permission, not an obligation. The option remains subject to section 9(3) and 9(4).
  LE_AMOUNT:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX_WITHIN_STATUTORY_LIMITS
    expr: G_ELIG_CIFNP AND A_OPTED AND A_RATE_CAP_CIFNP AND A_BASE
    module: M_CIFNP
    description: Where an eligible person has opted, the amount is paid in lieu of tax under section 9(1). It is calculated
      at the prescribed rate, which must not exceed three per cent., of turnover in State or turnover in Union territory.
  LE_S9_PRIORITY:
    outcome: OPTION_OPERATES_SUBJECT_TO_S9_3_AND_S9_4
    expr: A_OPTED AND G_S9_RCM
    module: M_CIFNP
    description: Where the person has opted and section 9(3) or 9(4) is engaged, the option operates subject to those provisions
      and does not override them. The source does not state further operative detail, and none is assumed.
  LE_ELIG:
    outcome: MAY_OPT_COMPOSITION_LEVY_UNDER_THIS_CLAUSE
    expr: G_CONDITIONS
    module: M_CIFES
    description: If all conditions are met, the registered person may opt for this composition levy. The person is not required
      to opt. The permission applies notwithstanding anything to the contrary contained in this Act. It remains subject to
      sub-sections (3) and (4) of section 9 (see LE_PRIORITY).
  LE_TERMS:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX_WITHIN_CAP
    expr: G_CONDITIONS AND A_INLIEU AND A_RATE_CAP_CIFES
    module: M_CIFES
    description: If the person is eligible and has opted, the person pays an amount of tax in lieu of the tax payable by him
      under sub-section (1) of section 9. That amount is calculated at such rate as may be prescribed. The rate must not exceed
      three per cent. of the turnover in State or turnover in Union territor
  LE_PRIORITY:
    outcome: SECTION_9_3_OR_9_4_PROVISIONS_PREVAIL_OVER_OPTION
    expr: G_SUBJECT_S9
    module: M_CIFES
    description: The option operates subject to the provisions of sub-sections (3) and (4) of section 9. Where either of those
      provisions applies, it continues to govern despite the composition option. This clause preserves those provisions. It
      is not a condition of eligibility.
  LE_OPT_S10_2A:
    outcome: MAY_OPT_COMPOSITION_S10_2A
    expr: A_REG_CIFCN AND G_INELIG AND A_TURNOVER_CIFCN AND G_EXCL_CIFCN
    module: M_CIFCN
    description: Permission (may opt, not an obligation) to pay the composition amount under sub-section (2A). It operates
      notwithstanding anything to the contrary in the Act but subject to section 9(3) and 9(4). Satisfying these conditions
      does not displace any further condition that other clauses of sub-section (2
  LE_AMOUNT_S10_2A:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX
    expr: PD_S10_2A_ELIGIBLE AND A_OPTED_CIFCN AND G_AMOUNT
    module: M_CIFCN
    description: Where an eligible person has opted, the amount of tax is calculated at the prescribed rate, not exceeding
      three per cent., of the turnover in State or turnover in Union territory, and is payable in lieu of the tax payable
      by him under section 9(1)
  LE_S9_RESERVED:
    outcome: S10_2A_OPTION_SUBJECT_TO_S9_3_S9_4
    expr: A_OPTED_CIFCN AND G_S9_SUPPLY
    module: M_CIFCN
    description: For a supply covered by section 9(3) or section 9(4), the option under sub-section (2A) remains subject to
      those provisions. The precise effect of the reservation is not stated in the source and is left for review
  LE_CSPOTAI_1:
    outcome: COMPOSITION_RULES_COMPLIED
    expr: (NOT A_CSPOTAI_1) OR G_CSPOTAI_1
    module: M_CSPOTAI
    description: Compliance is met if the person is not under the composition scheme, or if they are and they have complied
      with both prohibitions (not collecting tax and not claiming ITC).
  LE_M_COLOTEL_1:
    outcome: COMPOSITION_OPTION_LAPSES
    expr: A_M_COLOTEL_1 AND A_M_COLOTEL_2
    module: M_COLOTEL
    description: The composition option lapses if the person has availed the option and their turnover exceeds the applicable
      limit.
  LE_PENALTY:
    outcome: PENALTY_LIABLE
    expr: G_TRIGGER
    module: M_PFICL
    description: Such person shall be liable to a penalty. This is mandatory (shall) and is in addition to any tax that may
      be payable by him under any other provisions of this Act. It does not replace that tax
  LE_PROCEDURE:
    outcome: S73_OR_S74_APPLY_MUTATIS_MUTANDIS
    expr: G_TRIGGER
    module: M_PFICL
    description: The provisions of section 73 or section 74 apply mutatis mutandis for determination of tax and penalty. The
      source gives no criterion for choosing between the two sections, so the choice is not asserted here
  LE_M_CFNFRC:
    outcome: OFFICER_MAY_CANCEL_REGISTRATION
    expr: A_IS_COMPOSITION_TAXPAYER AND A_RETURN_DEFAULT
    module: M_CFNFRC
    description: The power to cancel registration arises if the person is a composition taxpayer who has not furnished returns
      for three consecutive tax periods.
  LE_M_RFSFTW_1:
    outcome: REGISTRATION_REQUIRED_IN_SPECIFIED_LOCATION
    expr: A_M_RFSFTW_1
    module: M_RFSFTW
    description: If a person makes a supply from the territorial waters of India, they are obligated to obtain registration
      in the coastal State or Union territory where the nearest point of the appropriate baseline is located.
  LE_M_RFCONP:
    outcome: OBLIGATION_MET
    expr: G_PERSON_TYPE AND A_TIMING_OBLIGATION
    module: M_RFCONP
    description: The obligation to apply for registration is met if the person is a casual or non-resident taxable person
      and applies at least five days before business commencement.
  LE_M_SRFSU:
    outcome: OBLIGATION_TO_APPLY_FOR_SEPARATE_REGISTRATION
    expr: G_M_SRFSU_1
    module: M_SRFSU
    description: If the person has an SEZ unit or is an SEZ developer, they are obligated to apply for a separate registration,
      which is distinct from any business place outside the SEZ in the same State or UT.
triggers:
  CT_S9:
    question: Does sub-section (3) or (4) of section 9 apply to the supplies concerned so that it prevails over the composition
      option to that extent?
    trigger: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE OR F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
    beside: LE_OPTION_CRFSIIRS
  CT_S9_RESERVE:
    question: How do the provisions of sub-section (3) or (4) of section 9 apply to this supply, given that the person has
      opted under sub-section (2A) of section 10?
    trigger: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE OR F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
    beside: LE_OPT_S10_2A
products:
  PD_ATDFS22:
    statement: A supply is included in the aggregate turnover for Section 22 if it is made by a taxable person, either on
      their own account or on behalf of principals.
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_M_ECONS:
    statement: The condition regarding non-leviable supplies for composition scheme eligibility is met.
  PD_M_ECOIS:
    statement: ELIGIBILITY_CONDITION_MET
  PD_ECOES:
    statement: The person is eligible for the composition scheme under this clause if they do not make supplies through a
      TCS-collecting e-commerce operator.
  PD_M_ECFNG:
    statement: COMPOSITION_ELIGIBILITY_S10_2_E_MET
  PD_M_ECFTT:
    statement: ELIGIBLE_TO_OPT_S10_1
  PD_ATFCE_1:
    statement: The method for computing aggregate turnover for composition eligibility is defined by the inclusion and exclusion
      rules specified.
  PD_M_EOIIFT_1:
    statement: For the purpose of determining tax payable by a person under this section, the 'turnover in State or turnover
      in Union territory' shall not include the value of the supply.
  PD_M_EOIIFT_6:
    statement: The consideration for the supply is represented by way of interest.
  PD_M_EOIIFT_7:
    statement: The consideration for the supply is represented by way of discount.
  PD_EOPSFT:
    statement: When determining tax payable under the composition section, the value of supplies from 1 April of a financial
      year up to the date the person becomes liable for registration is not included in turnover in State or turnover in Union
      territory
  PD_EOIFTFC:
    statement: The value (to the extent of interest or discount) of an exempt supply of services provided by extending deposits,
      loans or advances shall not be taken into account for determining the value of turnover in a State or Union territory
      for the second proviso.
  PD_GPTICL:
    statement: An increase of the fifty lakh rupees limit is authorised under this proviso only if it is made by Government
      notification, to a higher amount, not above one crore and fifty lakh rupees, and as recommended by the Council
  PD_VALIDITY:
    statement: The certificate issued to a casual or non-resident taxable person is valid on the tested date only within the
      earlier of the period specified in the application or ninety days from the effective date of registration
  PD_SUPPLY_AFTER_CERT:
    statement: A taxable supply by such casual or non-resident taxable person complies with Section 27(1) only if it is made
      after the issuance of the certificate of registration
  PD_M_EORP_1:
    statement: The extension of the registration period is valid if sufficient cause was shown, the proper officer granted
      the extension, and the extension period does not exceed 90 days.
  PD_ADFE:
    statement: The law is complied with if either no extension is sought, or if an extension is sought and the required additional
      deposit has been made.
  PD_CTPR:
    statement: A casual taxable person making taxable supply shall be required to be registered under this Act, and the section
      22(1) threshold is not a condition of this clause.
  PD_NTPR_REGISTRATION:
    statement: COMPULSORY_REGISTRATION_REQUIRED
  PD_M_OISR:
    statement: A person is required to register compulsorily if they are a foreign supplier of OIDAR services to an unregistered
      person in India.
  PD_CFNFRR_IS_NOT_COMPOSITION:
    statement: The person is other than a person specified in clause (b)
  PD_FADSAS:
    statement: The composite supply shall be treated as a supply of services when it is a supply of goods in the stated manner
      and the goods are food or another article for human consumption or a drink other than alcoholic liquor and the supply
      or service is for cash or deferred payment or other valuable considera
  PD_M_LOCTOPP:
    statement: CENTRAL_TAX_LEVIABLE
  PD_M_PTNRCS:
    statement: If a supply is notified under this section, the recipient is liable to pay tax on RCM basis and is deemed the
      person liable for all Act provisions for that supply.
  PD_OPTION_CRFSIIRS:
    statement: The permissive option under this clause is available when every eligibility element holds. Because the clause
      uses may, availability does not mean that the option has been exercised.
  PD_AMOUNT_CRFSIIRS:
    statement: An eligible person who has opted pays an amount in lieu of tax under section 9(1). The amount is calculated
      at the prescribed rate. That rate must not exceed two and a half per cent. of turnover in State or turnover in Union
      territory.
  PD_M_PTNROUS:
    statement: The conditions for applying reverse charge under a notification issued per Section 9(4) are met. The recipient
      is liable to pay the tax and is deemed the person liable for all provisions of the Act in relation to this supply.
  PD_PAYMENT_EOTL:
    statement: The electronic commerce operator is liable to pay the tax on the specified intra-State supply of services.
  PD_DEEMING:
    statement: The electronic commerce operator is treated as the supplier for all provisions of the Act in relation to the
      supply.
  PD_M_EORL:
    statement: REPRESENTATIVE_LIABLE_TO_PAY_TAX
  PD_M_CRFOS:
    statement: COMPOSITION_SCHEME_OPTION_AVAILABLE
  PD_CLRM_OPT:
    statement: A registered manufacturer whose preceding-year aggregate turnover did not exceed fifty lakh rupees may opt
      for the composition amount under clause (a), subject to prescribed conditions and restrictions. This is a permission,
      not an obligation.
  PD_CLRM_RATE:
    statement: Where an eligible manufacturer has opted, the amount payable in lieu of section 9(1) tax is calculated at the
      prescribed rate, which does not exceed one per cent. of turnover in State or turnover in Union territory
  PD_CLRM_S9:
