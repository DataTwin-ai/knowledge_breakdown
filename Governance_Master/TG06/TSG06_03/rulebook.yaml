      in Union territory' shall not include the value of the supply. (Section 10(5), Explanation 2, part of the law)
  LE_M_EOIIFT_6:
    outcome: M_EOIIFT_6
    expr: A_M_EOIIFT_6
    module: M_EOIIFT
