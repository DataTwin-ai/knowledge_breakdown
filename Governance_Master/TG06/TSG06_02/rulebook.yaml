# GOVERNANCE MASTER TSG06_02 B2B / B2C / unregistered buyers (TG06 Parties & Registration)
# LAW ARC - 2 laws - status APPROVED
name: TSG06_02 B2B / B2C / unregistered buyers - GOVERNANCE MASTER rulebook
version: TSG06_02
facts:
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
predicates:
  A_RECIPIENT_UNREGISTERED:
    statement: The recipient is a person other than a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = FALSE
  A_REGISTERED_PERSON:
    statement: The person liable to pay tax under section 9 is a registered person.
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
groups: {}
outcomes:
  LE_RECIPIENT_UNREGISTERED:
    outcome: RECIPIENT_UNREGISTERED
    expr: A_RECIPIENT_UNREGISTERED
    module: M_OISR
    description: The recipient is a person other than a registered person (Section 24, part of the law)
  LE_REGISTERED_PERSON:
    outcome: REGISTERED_PERSON
    expr: A_REGISTERED_PERSON
    module: M_PVFRP
    description: The person liable to pay tax under section 9 is a registered person. (Section 31(3), part of the law)
products:
  PD_RECIPIENT_UNREGISTERED:
    statement: The recipient is a person other than a registered person
  PD_REGISTERED_PERSON:
    statement: The person liable to pay tax under section 9 is a registered person.
compounds:
- id: C_OISR
  question: The recipient is a person other than a registered person? (Section 24)
  includes:
  - LE_RECIPIENT_UNREGISTERED
  produces:
  - product: PD_RECIPIENT_UNREGISTERED
    from:
    - LE_RECIPIENT_UNREGISTERED
- id: C_PVFRP
  question: The person liable to pay tax under section 9 is a registered person? (Section 31(3))
  includes:
  - LE_REGISTERED_PERSON
  produces:
  - product: PD_REGISTERED_PERSON
    from:
    - LE_REGISTERED_PERSON
