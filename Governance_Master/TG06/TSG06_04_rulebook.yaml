# GOVERNANCE MASTER TSG06_04 Distinct & related persons (TG06 Parties & Registration)
# LAW ARC - 4 laws - status APPROVED
name: TSG06_04 Distinct & related persons - GOVERNANCE MASTER rulebook
version: TSG06_04
facts:
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_PRS:
    name: Person Relation Status
    type: CODE
    options:
    - RELATED
    - DISTINCT
    - NEITHER
    - UNKNOWN
    tier: T1
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SGOSRDP_A_SOGOS:
    statement: The transaction involves a supply of goods or services or both
    order: HIGH
    interpretation: Does the described transaction supply goods, services or both? Goods only or services only is not required
    grounding:
    - F_DOS
    handler: light
  M_SGOSRDP_A_SBRP:
    statement: The supply is made between related persons
    order: HIGH
    interpretation: Are the supplier and the recipient related persons under the GST law? Fact value RELATED supports TRUE,
      NEITHER supports FALSE, UNKNOWN if the relation cannot be established from the documents
    grounding:
    - F_PRS
    handler: heavy
  M_SGOSRDP_A_SBDP:
    statement: The supply is made between distinct persons as specified in section 25
    order: HIGH
    interpretation: Are the supplier and the recipient distinct persons as specified in section 25? Fact value DISTINCT supports
      TRUE, NEITHER supports FALSE, UNKNOWN if the relation cannot be established from the documents
    grounding:
    - F_PRS
    handler: heavy
  M_SGOSRDP_A_SICOB:
    statement: The supply is made in the course or furtherance of business
    order: HIGH
    interpretation: Is the activity of making the supply in the course or furtherance of business? Ordinary activity that
      is not business does not satisfy this atom
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SGOSRDP_G_RODP:
    name: Related Or Distinct Parties
    logic: ANY
    members:
    - M_SGOSRDP_A_SBRP
    - M_SGOSRDP_A_SBDP
    description: Source wording uses or between related persons or between distinct persons, so either relationship is sufficient
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SGOSRDP_PD_DSJE
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SGOSRDP_LE_DSJE:
    outcome: SUPPLY_DEEMED
    expr: M_SGOSRDP_A_SOGOS AND M_SGOSRDP_G_RODP AND M_SGOSRDP_A_SICOB
    module: M_SGOSRDP
    description: Joint requirements of a supply of goods or services or both, a related or distinct person alternative, and
      course or furtherance of business. Consideration is not tested by any atom because the source deems the supply even
      if made without consideration
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SGOSRDP_PD_DSJE:
    statement: Joint requirements of a supply of goods or services or both, a related or distinct person alternative, and
      course or furtherance of business. Consideration is not tested by any atom because the source deems the supply even
      if made without consideration
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
compounds:
- id: C_SGOSRDP
  question: 'Schedule I, paragraph 2: Supply Goods Or Services Related Distinct Persons?'
  includes:
  - M_SGOSRDP_LE_DSJE
  produces:
  - product: M_SGOSRDP_PD_DSJE
    from:
    - M_SGOSRDP_LE_DSJE
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_ISO
  - M_IOSFC_LE_ISIO
  - M_SIAWC_LE_SAIS
  produces:
  - product: M_SIAFOS_PD_ISO
    from:
    - M_SIAFOS_LE_ISO
  - product: M_IOSFC_PD_ISIO
    from:
    - M_IOSFC_LE_ISIO
  - product: M_SIAWC_PD_SAIS
    from:
    - M_SIAWC_LE_SAIS
time:
  law_date: F_DOI
