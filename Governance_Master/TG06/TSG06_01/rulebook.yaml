    module: M_RPTCGBL
    description: The person is a registered person (Section 32(2), part of the law)
  LE_RPTITI_01:
    outcome: RPTITI_01
    expr: A_RPTITI_01
    module: M_RPTITI
    description: The person supplying the services is a registered person (Section 31(2), part of the law)
  LE_PRE_SUPPLIER_REGISTERED:
    outcome: PRE_SUPPLIER_REGISTERED
    expr: A_PRE_SUPPLIER_REGISTERED
    module: M_ITFGWM
    description: The person supplying the goods is a registered person (Section 31(1), part of the law)
  LE_ITFGNM_01:
    outcome: ITFGNM_01
    expr: A_ITFGNM_01
    module: M_ITFGNM
    description: The person supplying the goods is a registered person (Section 31(1), part of the law)
  LE_ICPOD_CLAIMANT_IS_REGISTERED:
    outcome: ICPOD_CLAIMANT_IS_REGISTERED
    expr: A_ICPOD_CLAIMANT_IS_REGISTERED
    module: M_ICPOD
    description: The person taking the credit is a registered person (Section 16(2), part of the law)
  LE_M_IOCNFEV_6B:
    outcome: M_IOCNFEV_6B
    expr: A_M_IOCNFEV_6B
    module: M_IOCNFEV
    description: The person who supplied such goods or services or both is a registered person (Section 34(1), part of the
      law)
  LE_ISSUER_CONTEXT:
    outcome: ISSUER_CONTEXT
    expr: A_ISSUER_CONTEXT
    module: M_DOCNIR
    description: A registered person issues a credit note in relation to a supply of goods or services or both (Section 34(2),
      part of the law)
  LE_IODNFS_2:
    outcome: IODNFS_2
    expr: A_IODNFS_2
    module: M_IODNFS
    description: The person supplying such goods or services or both is a registered person. (Section 34(3), part of the law)
  LE_1:
    outcome: '1'
    expr: A_1
    module: M_RIAR
    description: The person is a registered person. (Section 31(3), part of the law)
  LE_M_NTIBTH_1:
    outcome: M_NTIBTH_1
    expr: A_M_NTIBTH_1
    module: M_NTIBTH
    description: The person making the supply is a registered person (Section 31(3), part of the law)
  LE_REGISTERED_SUPPLIER:
    outcome: REGISTERED_SUPPLIER
    expr: A_REGISTERED_SUPPLIER
    module: M_BOSFEOC
    description: The person making the supply is a registered person (Section 31(3), part of the law)
  LE_SUPPLIER_IS_REGISTERED:
    outcome: SUPPLIER_IS_REGISTERED
    expr: A_SUPPLIER_IS_REGISTERED
    module: M_RVFAP
    description: The person who received the payment is a registered person (Section 31(3), part of the law)
  LE_RVFNS:
    outcome: PERMISSION_TO_ISSUE_REFUND_VOUCHER
    expr: A_RVFNS_1 AND A_RVFNS_2 AND A_RVFNS_3 AND A_RVFNS_4 AND A_RVFNS_5
    module: M_RVFNS
  LE_NBOSBTH_1:
    outcome: NBOSBTH_1
    expr: A_NBOSBTH_1
    module: M_NBOSBTH
    description: The person is a registered person (Section 31(3)(c) Proviso, part of the law)
  LE_M_LOCTOPP:
    outcome: CENTRAL_TAX_LEVIABLE
    expr: G_M_LOCTOPP_GOODS AND G_M_LOCTOPP_CONDS
    module: M_LOCTOPP
  LE_M_PTNRCS:
    outcome: S9_3_RCM_CONSEQUENCES_APPLY
    expr: A_M_PTNRCS_1 AND A_M_PTNRCS_2
    module: M_PTNRCS
    description: If a supply is notified under this section, the recipient is liable to pay tax on RCM basis and is deemed
      the person liable for all Act provisions for that supply.
  LE_M_PTNROUS:
    outcome: RCM_S9_4_APPLICABLE
    expr: G_M_PTNROUS_1
    module: M_PTNROUS
    description: The conditions for applying reverse charge under a notification issued per Section 9(4) are met. The recipient
      is liable to pay the tax and is deemed the person liable for all provisions of the Act in relation to this supply.
  LE_PAYMENT:
    outcome: ECO_PAYS_TAX_U_S9_5
    expr: G_CONDITIONS_EOTL
    module: M_EOTL
    description: The electronic commerce operator is liable to pay the tax on the specified intra-State supply of services.
  LE_DEEMING:
    outcome: ECO_DEEMED_SUPPLIER_U_S9_5
    expr: G_CONDITIONS_EOTL
    module: M_EOTL
    description: The electronic commerce operator is treated as the supplier for all provisions of the Act in relation to
      the supply.
  LE_M_EORL:
    outcome: REPRESENTATIVE_LIABLE_TO_PAY_TAX
    expr: G_M_EORL
    module: M_EORL
  LE_IFRFUS:
    outcome: OBLIGATION_TO_ISSUE_INVOICE
    expr: G_CONDITIONS
    module: M_IFRFUS
  LE_PVFRP_DUTY_APPLIES:
    outcome: PAYMENT_VOUCHER_DUTY_APPLIES
    expr: G_RCM_RECIPIENT AND A_PAYMENT_TO_SUPPLIER
    module: M_PVFRP
    description: Notwithstanding (LK_S31_1_2), sub-sections (1) and (2) do not gate this duty, the duty applies where a registered
      person liable under section 9 makes payment to the supplier
  LE_PVFRP_OBLIGATION_MET:
    outcome: PAYMENT_VOUCHER_OBLIGATION_MET
    expr: G_RCM_RECIPIENT AND A_PAYMENT_TO_SUPPLIER AND G_VOUCHER_OBLIGATION
    module: M_PVFRP
    description: Met only when the duty applies and the voucher is issued at the time of payment, source states no consequence
      for non-compliance
