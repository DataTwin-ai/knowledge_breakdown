      in the coastal State or Union territory where the nearest point of the appropriate baseline is located.
  PD_M_RFCONP:
    statement: The obligation to apply for registration is met if the person is a casual or non-resident taxable person and
      applies at least five days before business commencement.
  PD_M_SRFSU:
    statement: If the person has an SEZ unit or is an SEZ developer, they are obligated to apply for a separate registration,
      which is distinct from any business place outside the SEZ in the same State or UT.
  PD_VATFGOR:
    statement: The process for deciding on a registration or UIN application is compliant if a decision is made on the correct
      subject, after due verification, and within the prescribed manner and period.
  PD_M_IORC:
    statement: The procedure for issuing a registration certificate requires that the form and effective date are as prescribed.
  PD_DEEMED_REGISTRATION:
    statement: Deemed grant of a registration number.
  PD_DEEMED_UIN:
    statement: Deemed grant of a Unique Identity Number.
  PD_SRIAS:
    statement: The person shall be granted a single registration in the State or Union territory.
  PD_M_SRFMBP:
    statement: SEPARATE_REGISTRATION_PERMITTED
  PD_PERMISSION:
    statement: The person is permitted to register for GST voluntarily if they are not liable for mandatory registration.
  PD_CONSEQUENCE:
    statement: All provisions of the GST Act that apply to a registered person will apply to the voluntarily registered person.
  PD_MRTADP:
    statement: The person is deemed to be a collection of distinct persons.
  PD_M_EIDSAD:
    statement: The establishments are treated as establishments of distinct persons.
  PD_PRFGR:
    statement: The person is eligible for grant of registration under this subsection if the PAN condition is met.
  PD_M_TPRE:
    statement: ELIGIBLE_FOR_REGISTRATION
  PD_M_RPAA:
    statement: The obligation is met if the registered person performs one of the required actions in the prescribed way.
  PD_1_M_AIFUA:
    statement: An obligation to offer alternate means of identification exists if an Aadhaar number is not assigned to the
      registered person.
  PD_2_M_AIFUA:
    statement: The manner for alternate identification is validly defined if it is prescribed by the Government on the recommendations
      of the Council.
  PD_REGISTRATION_STATUS:
    statement: If the person fails any of the identification requirements, their registration is deemed invalid.
  PD_ACT_APPLICATION:
    statement: If the person fails any of the identification requirements, other provisions of the Act apply as if they are
      not registered.
  PD_AAFRE:
    statement: REGISTRATION_ELIGIBILITY_CONDITION_MET
  PD_M_AIFUA:
    statement: COMPLIANT_ALTERNATE_ID_PROCESS
  PD_AAFNE:
    statement: ELIGIBILITY_FOR_REGISTRATION_MET
