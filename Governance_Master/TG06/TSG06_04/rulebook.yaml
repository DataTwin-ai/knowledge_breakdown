# GOVERNANCE MASTER TSG06_04 Distinct & related persons (TG06 Parties & Registration)
# LAW ARC - 41 laws - status NEEDS_REVIEW
name: TSG06_04 Distinct & related persons - GOVERNANCE MASTER rulebook
version: TSG06_04
facts:
  F_PERSON_HAS_MULTIPLE_REGISTRATIONS_ON_PAN:
    name: Person has multiple GST registrations on the same PAN
    type: BOOLEAN
    tier: T1
