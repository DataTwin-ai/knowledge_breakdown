predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_DOANFS_1:
    statement: For the purposes of this section, the expression "Aadhaar number" shall have the same meaning as assigned to
      it in clause (a) of section 2 of the Aadhaar (Targeted Delivery of Financial and Other Subsidies, Benefits and Services)
      Act, 2016.
    order: LOW
    rule: F_CONTEXT_IS_SECTION_25 = TRUE
  A_M_RPOOD_1:
    statement: One person is an officer or director of the other person's business.
    order: LOW
    rule: F_RELATIONSHIP_P1_ROLE_IN_P2 IN ['OFFICER', 'DIRECTOR']
  A_M_RPOOD_2:
    statement: The other person is an officer or director of the first person's business.
    order: LOW
    rule: F_RELATIONSHIP_P2_ROLE_IN_P1 IN ['OFFICER', 'DIRECTOR']
  A_RPLRP:
    statement: The persons are legally recognised partners in business.
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'PARTNERSHIP'
  A_M_RPEAE_1:
    statement: The persons are employer and employee.
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'EMPLOYER'
  A_RP25PS_OWNS:
    statement: A person directly or indirectly owns twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly OWN 25% or more of the outstanding
      voting stock or shares in BOTH of the two persons being evaluated?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RP25PS_CONTROLS:
    statement: A person directly or indirectly controls twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly CONTROL 25% or more of the
      outstanding voting stock or shares in BOTH of the two persons being evaluated? This can be through means other than
      direct ownership.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RP25PS_HOLDS:
    statement: A person directly or indirectly holds twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly HOLD 25% or more of the outstanding
      voting stock or shares in BOTH of the two persons being evaluated? This covers various forms of holding, including beneficial
      ownership.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_DIRECT_CONTROL:
    statement: One person directly controls the other person.
    order: HIGH
    interpretation: Based on the provided records, does one person directly control the other? This typically involves majority
      shareholding, voting rights, or power to appoint a majority of directors.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_INDIRECT_CONTROL:
    statement: One person indirectly controls the other person.
    order: HIGH
    interpretation: Based on the provided records, does one person indirectly control the other? This can occur through a
      chain of intermediaries or common control by a third party.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_DIRECT_CONTROL_RPCC:
    statement: Both persons are directly controlled by a third person.
    order: HIGH
    interpretation: Based on ownership and control records, are both persons directly controlled by a common third person
      (e.g., via majority shareholding or board control)?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_INDIRECT_CONTROL_RPCC:
    statement: Both persons are indirectly controlled by a third person.
    order: HIGH
    interpretation: Based on ownership and control records, are both persons indirectly controlled by a common third person
      (e.g., through a chain of intermediary entities)?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RPJC_1:
    statement: Two persons together directly control a third person
    order: HIGH
    interpretation: Based on the evidence, do the two persons being evaluated together directly control a third person?
    grounding:
    - F_JOINT_CONTROL_EVIDENCE
  A_RPJC_2:
    statement: Two persons together indirectly control a third person
    order: HIGH
    interpretation: Based on the evidence, do the two persons being evaluated together indirectly control a third person?
    grounding:
    - F_JOINT_CONTROL_EVIDENCE
  A_FAMILY_MEMBERS:
    statement: The persons are members of the same family
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'FAMILY'
  A_SOLE_AGENT:
    statement: The persons are associated in the business of one another in that one is the sole agent, howsoever described,
      of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_AGENT'
  A_SOLE_DISTRIBUTOR:
    statement: The persons are associated in the business of one another in that one is the sole distributor, howsoever described,
      of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_DISTRIBUTOR'
  A_SOLE_CONCESSIONAIRE:
    statement: The persons are associated in the business of one another in that one is the sole concessionaire, howsoever
      described, of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_CONCESSIONAIRE'
  A_ASSOC:
    statement: The supply is made by associated enterprises
    order: HIGH
    interpretation: Are the supplier and the recipient associated enterprises in respect of this supply?
    grounding:
    - F_SUPPLIER_ASSOCIATED_WITH_RECIPIENT
    - F_PERSON_RELATIONSHIP_DESCRIPTION
  A_MAKES_TAXABLE_SUPPLY:
    statement: The person makes a taxable supply of goods or services or both.
    order: LOW
    rule: F_PERSON_MAKES_TAXABLE_SUPPLY = TRUE
  A_ACTS_FOR_TAXABLE_PRINCIPAL:
    statement: The person makes the supply on behalf of one or more other taxable persons, whether as an agent or otherwise.
    order: HIGH
    interpretation: Does the person make supplies on behalf of one or more other persons (principals) who are themselves 'taxable
      persons', where the person is acting as an agent or in a similar capacity?
    grounding:
    - F_PERSON_ACTS_ON_BEHALF_OF_OTHER
    - F_PRINCIPAL_IS_TAXABLE_PERSON
  A_SERVICE_IMPORT:
    statement: The supply is an import of services by a person
    order: LOW
    rule: F_SUPPLY_IS_IMPORT_OF_SERVICES = TRUE
  A_RELATED_PERSON_SOURCE:
    statement: The imported services are from a related person of the importer
    order: LOW
    rule: F_SUPPLIER_IS_RELATED_PERSON_OF_RECIPIENT = TRUE
  A_OTHER_ESTABLISHMENT_SOURCE:
    statement: The imported services are from another establishment of the importer located outside India
    order: LOW
    rule: F_SUPPLIER_IS_OTHER_ESTABLISHMENT_OF_RECIPIENT = TRUE AND F_SUPPLIER_LOCATED_OUTSIDE_INDIA = TRUE
  A_BUSINESS_PURPOSE:
    statement: The import of services is in the course or furtherance of business
    order: HIGH
    interpretation: Is the imported service received in the course or furtherance of business
    grounding:
    - F_IMPORT_IN_COURSE_OF_BUSINESS
  A_CLRM_REG:
    statement: The person opting under Section 10(1)(a) is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_CLRM_TO:
    statement: The registered person's aggregate turnover in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_CLRM_MANUF:
    statement: The registered person is a manufacturer, which is the case to which the one per cent. ceiling in Section 10(1)(a)
      applies
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_CATEGORY = 'MANUFACTURER'
  A_CLRM_OPT:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount calculated at such rate as may be prescribed
    order: LOW
    rule: F_SUPPLIER_HAS_OPTED_COMPOSITION = TRUE
  A_CLRM_COND:
    statement: The option and the amount payable satisfy such conditions and restrictions as may be prescribed
    order: HIGH
    interpretation: Do the person's option and payment satisfy the conditions and restrictions prescribed for Section 10(1)(a)?
      Those conditions are not stated in this MKP and must not be assumed.
    grounding:
    - F_SUPPLIER_COMPLIES_WITH_COMPOSITION_CONDITIONS
  A_CLRM_RATEPRE:
    statement: The amount payable in lieu of section 9(1) tax is calculated at such rate as may be prescribed
    order: HIGH
    interpretation: Is the rate applied to compute the amount the rate prescribed for a manufacturer under Section 10(1)(a)?
      No rate value is stated in this MKP.
    grounding:
    - F_COMPOSITION_RATE_APPLIED
  A_CLRM_CAP:
    statement: The rate does not exceed one per cent. of the turnover in State or turnover in Union territory in case of a
      manufacturer
    order: LOW
    rule: F_COMPOSITION_RATE_APPLIED <= 1 AND F_COMPOSITION_RATE_BASE IN ['TURNOVER_IN_STATE', 'TURNOVER_IN_UT']
  A_CLRM_S93:
    statement: Tax on the supply is payable under the provisions of sub-section (3) of section 9, to which the Section 10(1)(a)
      option is subject
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_CLRM_S94:
    statement: Tax on the supply is payable under the provisions of sub-section (4) of section 9, to which the Section 10(1)(a)
      option is subject
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_REG:
    statement: The person who may opt to pay an amount in lieu of tax under this clause is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_TURN:
    statement: The aggregate turnover of the registered person in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_SCH2:
    statement: The person is engaged in making supplies referred to in clause (b) of paragraph 6 of Schedule II
    order: LOW
    rule: F_SERVICE_IS_SCH_II_P6B = TRUE
  A_S9:
    statement: The composition option under this clause has effect notwithstanding anything to the contrary contained in this
      Act. It operates subject to the provisions of sub-sections (3) and (4) of section 9 and is not displaced by those provisions
      for the supplies concerned
    order: HIGH
    interpretation: Applying sub-sections (3) and (4) of section 9 to the supplies concerned, do those provisions prevail
      so as to displace the composition option or amount to that extent (answer FALSE), or does the option remain operative
      (answer TRUE)?
    grounding:
    - F_SUPPLY_IS_NOTIFIED_RCM_S9_3
    - F_SUPPLY_IS_UNDER_RCM_S9_4
  A_COND:
    statement: The option to pay the composition amount under this clause is exercised subject to such conditions and restrictions
      as may be prescribed, and those prescribed conditions and restrictions are satisfied
    order: HIGH
    interpretation: Has the person satisfied every condition and restriction prescribed for the composition option? The source
      does not state those conditions, so they must come from the prescribed rules
    grounding:
    - F_COMPOSITION_PRESCRIBED_CONDITIONS_MET
  A_OPT:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount calculated under this clause
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_1_B'
  A_PRESCRIBED:
    statement: The amount in lieu of tax is calculated at such rate as may be prescribed
    order: LOW
    rule: F_COMPOSITION_RATE_MATCHES_PRESCRIBED = TRUE
  A_RATECAP:
    statement: For persons engaged in making supplies referred to in clause (b) of paragraph 6 of Schedule II, the prescribed
      rate at which the amount is calculated does not exceed two and a half per cent. of the turnover in State or turnover
      in Union territory
    order: LOW
    rule: F_COMPOSITION_RATE_EXCEEDS_CEILING = FALSE
  A_BASE_STATE:
    statement: The composition amount is calculated on the turnover in State
    order: LOW
    rule: F_COMPOSITION_TAX_BASE = 'TURNOVER_IN_STATE'
  A_BASE_UT:
    statement: The composition amount is calculated on the turnover in Union territory
    order: LOW
    rule: F_COMPOSITION_TAX_BASE = 'TURNOVER_IN_UT'
  A_M_CRFOS_2:
    statement: The person's aggregate turnover in the preceding financial year did not exceed fifty lakh rupees
    order: HIGH
    interpretation: Does the person's aggregate turnover in the preceding financial year exceed fifty lakh rupees?
    grounding:
    - F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY
  A_M_CRFOS_3:
    statement: The person is an 'other supplier' for the purposes of the composition levy
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_CATEGORY = 'OTHER'
  A_M_CRFOS_4:
    statement: The composition levy option is subject to the provisions of sub-section (3) of section 9
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = FALSE
  A_M_CRFOS_5:
    statement: The composition levy option is subject to the provisions of sub-section (4) of section 9
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = FALSE
  A_M_CRFOS_6:
    statement: The option is subject to such conditions and restrictions as may be prescribed
    order: HIGH
    interpretation: Does the supplier meet all prescribed conditions and restrictions for the composition scheme as detailed
      in the CGST Rules?
    grounding:
    - F_SUPPLIER_COMPLIES_WITH_COMPOSITION_CONDITIONS
  A_M_CRFOS_7:
    statement: The registered person opts to pay tax under the composition scheme in lieu of the tax payable under sub-section
      (1) of section 9
    order: LOW
    rule: F_SUPPLIER_HAS_OPTED_COMPOSITION = TRUE
  A_M_CRFOS_1:
    statement: The person is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_PROVISO_CTX:
    statement: The value of turnover is being determined for the purposes of the second proviso
    order: LOW
    rule: F_TURNOVER_DETERMINATION_PURPOSE = 'SECOND_PROVISO_S10_1'
  A_TERRITORY:
    statement: The value of turnover is being determined in a State or Union territory
    order: LOW
    rule: F_TURNOVER_TERRITORY_LEVEL = 'STATE' OR F_TURNOVER_TERRITORY_LEVEL = 'UT'
  A_EXEMPT_SVC:
    statement: The supply is an exempt supply of services
    order: LOW
    if_false: the supply is not exempt, or is a supply of goods
    rule: F_SUPPLY_IS_EXEMPT = TRUE AND F_SUPPLY_TYPE = 'SERVICES'
  A_DEPOSIT:
    statement: The exempt supply of services is provided by way of extending deposits
    order: LOW
    rule: F_SERVICE_NATURE = 'DEPOSIT_EXTENSION'
  A_LOAN:
    statement: The exempt supply of services is provided by way of extending loans
    order: LOW
    rule: F_SERVICE_NATURE = 'LOAN_EXTENSION'
  A_ADVANCE:
    statement: The exempt supply of services is provided by way of extending advances
    order: LOW
    rule: F_SERVICE_NATURE = 'ADVANCE_EXTENSION'
  A_INTEREST:
    statement: In so far as the consideration for the exempt supply of services is represented by way of interest
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_FORM = 'INTEREST'
  A_DISCOUNT:
    statement: In so far as the consideration for the exempt supply of services is represented by way of discount
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_FORM = 'DISCOUNT'
  A_NOTIF:
    statement: The Government increases the said limit of fifty lakh rupees by notification
    order: LOW
    rule: F_NOTIFICATION_ISSUER = 'GOVERNMENT' AND F_NOTIFICATION_LIMIT_INCREASE_ISSUED = TRUE
  A_HIGHER:
    statement: The Government increases the said limit of fifty lakh rupees to such higher amount, being an amount higher
      than fifty lakh rupees
    order: LOW
    rule: F_NOTIFIED_COMPOSITION_LIMIT_AMOUNT > 5000000
  A_CAP:
    statement: The higher amount to which the limit is increased is not exceeding one crore and fifty lakh rupees
    order: LOW
    rule: F_NOTIFIED_COMPOSITION_LIMIT_AMOUNT <= 15000000
  A_REC:
    statement: The higher amount to which the limit is increased is as may be recommended by the Council
    order: LOW
    rule: F_NOTIFIED_AMOUNT_RECOMMENDED_BY_COUNCIL = TRUE
  A_M_PSOSBCD_2:
    statement: The person supplies services
    order: LOW
    rule: F_SUPPLY_TYPE = 'SERVICES'
  A_M_PSOSBCD_3:
    statement: The services are other than those referred to in clause (b) of paragraph 6 of Schedule II
    order: LOW
    rule: F_SERVICE_IS_SCH_II_P6B = FALSE
  A_M_PSOSBCD_4:
    statement: The value of services supplied does not exceed the higher of ten per cent. of turnover in a State or Union
      territory in the preceding financial year or five lakh rupees
    order: HIGH
    interpretation: 'This condition is met if the value of services supplied (F_SERVICE_VALUE_SUPPLIED) is less than or equal
      to the maximum of two values: (1) 10% of the turnover in the State/UT in the preceding financial year (F_TURNOVER_PREV_FY_IN_STATE),
      and (2) 5,00,000 INR.'
    grounding:
    - F_SERVICE_VALUE_SUPPLIED
    - F_TURNOVER_PREV_FY_IN_STATE
  A_AROPMOI_1:
    statement: More than one registered person has the same Permanent Account Number.
    order: LOW
    rule: F_PERSON_HAS_MULTIPLE_REGISTRATIONS_ON_PAN = TRUE
  A_M_RFSFTW_1:
    statement: The person makes a supply from the territorial waters of India.
    order: LOW
    rule: F_SUPPLY_ORIGIN_LOCATION = 'TERRITORIAL_WATERS_OF_INDIA'
  A_IS_CTP:
    statement: The person is a casual taxable person
    order: LOW
    rule: F_SUPPLIER_IS_CASUAL_TAXPAYER = TRUE
  A_IS_NRTP:
    statement: The person is a non-resident taxable person
    order: LOW
    rule: F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER = TRUE
  A_TIMING_OBLIGATION:
    statement: The person shall apply for registration at least five days prior to the commencement of business
    order: LOW
    rule: F_DAYS_BETWEEN_APP_AND_COMMENCEMENT >= 5
  A_M_SRFSU_1:
    statement: A person has a unit, as defined in the Special Economic Zones Act, 2005, in a Special Economic Zone
    order: LOW
    rule: F_PERSON_HAS_SEZ_UNIT = TRUE
  A_M_SRFSU_2:
    statement: A person is a Special Economic Zone developer
    order: LOW
    rule: F_PERSON_IS_SEZ_DEVELOPER = TRUE
  A_REGISTRATION_DECISION:
    statement: A decision to grant or reject an application for registration has been made.
    order: LOW
    rule: F_REGISTRATION_GRANT_TYPE = 'REGISTRATION' AND F_APPLICATION_STATUS IN ['GRANTED', 'REJECTED']
  A_UIN_DECISION:
    statement: A decision to grant or reject an application for a Unique Identity Number has been made.
    order: LOW
    rule: F_REGISTRATION_GRANT_TYPE = 'UIN' AND F_APPLICATION_STATUS IN ['GRANTED', 'REJECTED']
  A_DUE_VERIFICATION:
    statement: The decision to grant or reject is made after due verification.
    order: HIGH
    interpretation: Does the evidence show that due verification was conducted before the decision to grant or reject the
      application?
    grounding:
    - F_APPLICATION_VERIFICATION_EVIDENCE
  A_PRESCRIBED_MANNER:
    statement: The decision to grant or reject is made in the manner as may be prescribed.
    order: HIGH
    interpretation: Is a manner for grant/rejection prescribed in the Rules, and was the procedure followed for the decision
      consistent with that prescribed manner?
    grounding:
    - F_REG_UIN_MANNER_IS_PRESCRIBED
    - F_APPLICATION_PROCESS_LOG
  A_PRESCRIBED_PERIOD:
    statement: The decision to grant or reject is made within the period as may be prescribed.
    order: LOW
    rule: F_AUTHORITY_ACTION_WITHIN_PRESCRIBED_PERIOD = TRUE
  A_M_IORC_FORM_PRESCRIBED:
    statement: A certificate of registration shall be issued in such form as may be prescribed.
    order: LOW
    rule: F_GOVT_REG_CERT_FORM_IS_PRESCRIBED = TRUE
  A_M_IORC_DATE_PRESCRIBED:
    statement: A certificate of registration shall be issued with effect from such date as may be prescribed.
    order: LOW
    rule: F_GOVT_REG_CERT_DATE_MANNER_IS_PRESCRIBED = TRUE
  A_APPLIED_FOR_REG:
    statement: The application is for a registration
    order: LOW
    rule: F_APPLICATION_TYPE = 'REGISTRATION'
  A_APPLIED_FOR_UIN:
    statement: The application is for a Unique Identity Number
    order: LOW
    rule: F_APPLICATION_TYPE = 'UIN'
  A_PERIOD_EXPIRED:
    statement: The period prescribed under sub-section (10) has expired
    order: LOW
    rule: F_PRESCRIBED_PERIOD_EXPIRED = TRUE
  A_NO_DEFICIENCY_COMMUNICATED:
    statement: No deficiency has been communicated to the applicant within the period prescribed under sub-section (10)
    order: LOW
    rule: F_DEFICIENCY_COMMUNICATED_IN_PERIOD = FALSE
  A_SINGLE_REGISTRATION_RULE:
    statement: A person seeking registration under this Act shall be granted a single registration in a State or Union territory.
    order: LOW
    rule: F_APPLICATION_TYPE = 'REGISTRATION'
  A_MULTIPLE_POB_IN_STATE:
    statement: A person has multiple places of business in a single State or Union territory.
    order: LOW
    rule: F_PERSON_POB_COUNT_IN_STATE > 1
  A_PRESCRIBED_CONDITIONS_MET:
    statement: The prescribed conditions for the grant of a separate registration for each such place of business are met.
    order: LOW
    rule: F_CONDITIONS_FOR_SEP_REG_MET = TRUE
  A_NOT_LIABLE_S22:
    statement: The person is not liable to be registered under section 22.
    order: LOW
    rule: F_PERSON_LIABLE_S22 = FALSE
  A_PROVISIONS_APPLY:
    statement: All provisions of this Act, as are applicable to a registered person, shall apply to a person who has registered
      voluntarily.
    order: LOW
    rule: F_PERSON_REGISTRATION_TYPE = 'VOLUNTARY'
  A_DEEMED_DISTINCT_PERSONS:
    statement: A person who has obtained or is required to obtain more than one registration, whether in one State or Union
      territory or more than one State or Union territory shall, in respect of each such registration, be treated as distinct
      persons for the purposes of this Act.
    order: LOW
    rule: F_PERSON_HAS_MULTIPLE_REGISTRATIONS IS_SET OR F_PERSON_REQUIRES_MULTIPLE_REGISTRATIONS IS_SET
  A_M_EIDSAD_REGISTRATION_OBTAINED:
    statement: a person has obtained registration in a State or Union territory in respect of an establishment
    order: LOW
    rule: F_PERSON_HAS_REGISTRATION_IN_STATE_UT = TRUE
  A_M_EIDSAD_REGISTRATION_REQUIRED:
    statement: a person is required to obtain registration in a State or Union territory in respect of an establishment
    order: LOW
    rule: F_PERSON_IS_REQUIRED_TO_REGISTER_IN_STATE_UT = TRUE
  A_M_EIDSAD_OTHER_ESTABLISHMENT:
    statement: the person has an establishment in another State or Union territory
    order: LOW
    rule: F_PERSON_HAS_ESTABLISHMENT_IN_DIFFERENT_STATE_UT = TRUE
  A_PAN_REQUIRED:
    statement: The person has a Permanent Account Number issued under the Income-tax Act, 1961
    order: LOW
    rule: F_PERSON_HAS_VALID_PAN = TRUE
  A_M_TPRE_1:
    statement: The person is required to deduct tax under section 51.
    order: LOW
    rule: F_PERSON_IS_TDS_DEDUCTOR_S51 = TRUE
  A_M_TPRE_2:
    statement: The person has a Tax Deduction and Collection Account Number issued under the said Act.
    order: LOW
    rule: F_PERSON_TAN IS_SET
  A_M_RPAA_1:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_M_RPAA_2:
    statement: The registered person undergoes authentication of Aadhaar number
    order: LOW
    rule: F_PERSON_AADHAAR_AUTHENTICATED = TRUE
  A_M_RPAA_3:
    statement: The registered person furnishes proof of possession of Aadhaar number
    order: LOW
    rule: F_PERSON_AADHAAR_PROOF_FURNISHED = TRUE
  A_M_RPAA_4:
    statement: The authentication or furnishing of proof is done in the form and manner as prescribed
    order: LOW
    rule: F_COMPLIANCE_FORM_MANNER_MET = TRUE
  A_M_RPAA_5:
    statement: The authentication or furnishing of proof is done within the time as prescribed
    order: LOW
    rule: F_COMPLIANCE_TIME_MET = TRUE
  A_AADHAAR_NOT_ASSIGNED:
    statement: An Aadhaar number is not assigned to the registered person.
    order: LOW
    rule: F_PERSON_AADHAAR_ASSIGNED = FALSE
  A_MANNER_PRESCRIBED:
    statement: The alternate and viable means of identification are provided in a manner prescribed by the Government.
    order: LOW
    rule: F_ID_MANNER_IS_PRESCRIBED = TRUE
  A_PRESCRIPTION_RECOMMENDED:
    statement: The Government's prescription of the manner for alternate identification is on the recommendations of the Council.
    order: LOW
    rule: F_MANNER_IS_COUNCIL_RECOMMENDED = TRUE
  A_FAIL_AADHAAR_AUTH:
    statement: A person fails to undergo authentication
    order: LOW
    rule: F_PERSON_AADHAAR_AUTHENTICATED = FALSE
  A_FAIL_AADHAAR_PROOF:
    statement: A person fails to furnish proof of possession of Aadhaar number
    order: LOW
    rule: F_PERSON_AADHAAR_PROOF_FURNISHED = FALSE
  A_FAIL_ALT_ID:
    statement: A person fails to furnish alternate and viable means of identification
    order: LOW
    rule: F_PERSON_ALTERNATE_ID_FURNISHED = FALSE
  A_EFFECTIVE_FROM_NOTIFICATION:
    statement: The requirement for Aadhaar compliance for registration eligibility applies on and from a date specified in
      a notification.
    order: LOW
    rule: F_APPLICATION_DATE_IS_ON_OR_AFTER_NOTIFIED_DATE = TRUE
  A_APPLICANT_IS_INDIVIDUAL:
    statement: The applicant for grant of registration is an individual.
    order: LOW
    rule: F_APPLICANT_CONSTITUTION = 'INDIVIDUAL'
  A_FOR_REGISTRATION_GRANT:
    statement: The purpose of the application is to be eligible for the grant of registration.
    order: LOW
    rule: F_APPLICATION_TYPE = 'REGISTRATION'
  A_AADHAAR_AUTHENTICATED:
    statement: The individual undergoes authentication of Aadhaar number to be eligible for grant of registration.
    order: LOW
    rule: F_PERSON_AADHAAR_AUTHENTICATED = TRUE
  A_AADHAAR_PROOF_FURNISHED:
    statement: The individual furnishes proof of possession of Aadhaar number to be eligible for grant of registration.
    order: LOW
    rule: F_PERSON_AADHAAR_PROOF_FURNISHED = TRUE
  A_COMPLIANCE_IN_PRESCRIBED_MANNER:
    statement: The Aadhaar authentication or furnishing of proof is done in the manner specified by the Government in the
      relevant notification, on the recommendations of the Council.
    order: LOW
    rule: F_COMPLIANCE_FORM_MANNER_MET = TRUE
  A_M_AIFUA_1:
    statement: The applicant for registration is an individual.
    order: LOW
    rule: F_APPLICANT_CONSTITUTION = 'INDIVIDUAL'
  A_M_AIFUA_2:
    statement: An Aadhaar number is not assigned to the individual.
    order: LOW
    rule: F_PERSON_AADHAAR_ASSIGNED = FALSE
  A_M_AIFUA_3:
    statement: The individual shall be offered alternate and viable means of identification.
    order: HIGH
    interpretation: Does the application process log or other evidence show that alternate and viable means of identification
      were offered to the individual?
    grounding:
    - F_APPLICATION_PROCESS_LOG
  A_M_AIFUA_4:
    statement: The manner of identification is specified by the Government in the said notification.
    order: LOW
    rule: F_ID_MANNER_IS_PRESCRIBED = TRUE
  A_M_AIFUA_5:
    statement: The manner is specified by the Government on the recommendations of the Council.
    order: LOW
    rule: F_MANNER_IS_COUNCIL_RECOMMENDED = TRUE
  A_EFFECTIVE_DATE:
    statement: The requirement applies on and from the date of a notification issued by the Government.
    order: LOW
    rule: F_APPLICATION_DATE_IS_ON_OR_AFTER_NOTIFIED_DATE = TRUE
  A_NON_INDIVIDUAL:
    statement: The person seeking registration is a person other than an individual.
    order: LOW
    rule: F_APPLICANT_CONSTITUTION != 'INDIVIDUAL'
  A_AADHAAR_AUTHENTICATION:
    statement: The applicant undergoes authentication of the Aadhaar number for its Karta, Managing Director, whole time Director,
      specified partners, Members of Managing Committee of Association, Board of Trustees, authorised representative, authorised
      signatory, or other specified class of persons.
    order: HIGH
    interpretation: Have the specified key personnel of the non-individual entity undergone Aadhaar authentication as per
      the notification?
    grounding:
    - F_KEY_PERSONNEL_AADHAAR_AUTHENTICATED
  A_AADHAAR_PROOF:
    statement: The applicant furnishes proof of possession of the Aadhaar number for its Karta, Managing Director, whole time
      Director, specified partners, Members of Managing Committee of Association, Board of Trustees, authorised representative,
      authorised signatory, or other specified class of persons.
    order: HIGH
    interpretation: Has proof of Aadhaar possession for the specified key personnel of the non-individual entity been furnished
      as per the notification?
    grounding:
    - F_KEY_PERSONNEL_AADHAAR_PROOF_FURNISHED
  A_PRESCRIBED_MANNER_AAFNE:
    statement: The Aadhaar authentication or furnishing of proof is done in the manner specified by the Government in the
      relevant notification.
    order: LOW
    rule: F_COMPLIANCE_FORM_MANNER_MET = TRUE
  A_COUNCIL_RECOMMENDATION:
    statement: The notification specifying the manner of compliance is issued on the recommendations of the Council.
    order: LOW
    rule: F_MANNER_IS_COUNCIL_RECOMMENDED = TRUE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_M_RPOOD_1:
    name: Reciprocal Officer/Director Roles
    logic: ALL
    members:
    - A_M_RPOOD_1
    - A_M_RPOOD_2
  G_RP25PS:
    name: Holding Condition
    logic: ANY
    members:
    - A_RP25PS_OWNS
    - A_RP25PS_CONTROLS
    - A_RP25PS_HOLDS
    description: The condition is met if any of the holding types (owns, controls, or holds) by a third party are satisfied.
  G_CONTROL:
    name: Test for Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL
    - A_INDIRECT_CONTROL
    description: A test to determine if one person controls another, either directly or indirectly.
  G_M_RPCC:
    name: Common Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL_RPCC
    - A_INDIRECT_CONTROL_RPCC
    description: The condition is met if there is either direct or indirect control by a common third person.
  G_RPJC_1:
    name: Joint control of a third person
    logic: ANY
    members:
    - A_RPJC_1
    - A_RPJC_2
  G_SOLE_ROLE:
    name: Sole agent or sole distributor or sole concessionaire
    logic: ANY
    members:
    - A_SOLE_AGENT
    - A_SOLE_DISTRIBUTOR
    - A_SOLE_CONCESSIONAIRE
    description: Any one of the three sole-role relationships is enough
  G_AGENT_CONDITIONS:
    name: Agent Conditions
    logic: ALL
    members:
    - A_MAKES_TAXABLE_SUPPLY
    - A_ACTS_FOR_TAXABLE_PRINCIPAL
    description: persons who make taxable supply of goods or services or both on behalf of other taxable persons whether as
      an agent or otherwise.
  G_SOURCE:
    name: Source relationship
    logic: ANY
    members:
    - A_RELATED_PERSON_SOURCE
    - A_OTHER_ESTABLISHMENT_SOURCE
    description: Supplier is either a related person of the importer or another establishment of the importer located outside
      India.
  G_CLRM_ELIG:
    name: Registered person turnover eligibility
    logic: ALL
    members:
    - A_CLRM_REG
    - A_CLRM_TO
    description: The person is registered and the preceding-year aggregate turnover did not exceed fifty lakh rupees
  G_CLRM_RATE:
    name: Prescribed rate within manufacturer ceiling
    logic: ALL
    members:
    - A_CLRM_RATEPRE
    - A_CLRM_CAP
    description: The amount is computed at the prescribed rate, and that rate does not exceed one per cent. of turnover in
      State or Union territory
  G_CLRM_S9:
    name: Section 9(3) or 9(4) supply
    logic: ANY
    members:
    - A_CLRM_S93
    - A_CLRM_S94
    description: Tax on the supply is payable under section 9(3) or under section 9(4)
  G_ELIG:
    name: Clause (b) composition eligibility
    logic: ALL
    members:
    - A_REG
    - A_TURN
    - A_SCH2
    - A_S9
    - A_COND
    description: All of the following hold. The person is registered. The preceding-year aggregate turnover limit is met.
      The person is engaged in Schedule II para 6(b) supplies. The option operates within the subjection to section 9(3) and
      9(4). The prescribed conditions and restrictions are satisfied.
  G_AMOUNT:
    name: Composition amount computation
    logic: ALL
    members:
    - A_PRESCRIBED
    - A_RATECAP
    - G_BASE
    description: The amount is calculated at the prescribed rate. That rate does not exceed two and a half per cent. and is
      applied to turnover in State or turnover in Union territory.
  G_BASE:
    name: Turnover base alternatives
    logic: ANY
    members:
    - A_BASE_STATE
    - A_BASE_UT
    description: The base is turnover in State or, alternatively, turnover in Union territory.
  G_M_CRFOS_ELIGIBILITY:
    name: Eligibility Criteria
    logic: ALL
    members:
    - A_M_CRFOS_1
    - A_M_CRFOS_2
    - A_M_CRFOS_3
    - G_M_CRFOS_NO_RCM
    - A_M_CRFOS_6
  G_M_CRFOS_NO_RCM:
    name: RCM Inapplicability
    logic: ALL
    members:
    - A_M_CRFOS_4
    - A_M_CRFOS_5
  G_FORM:
    name: Form of exempt financial service
    logic: ANY
    members:
    - A_DEPOSIT
    - A_LOAN
    - A_ADVANCE
    description: The services are provided by way of extending deposits, loans or advances. These are alternatives.
  G_CONSIDERATION:
    name: Form of consideration
    logic: ANY
    members:
    - A_INTEREST
    - A_DISCOUNT
    description: The consideration is represented by way of interest or discount. These are alternatives.
  G_INCREASE:
    name: Conditions of a valid limit increase
    logic: ALL
    members:
    - A_NOTIF
    - A_HIGHER
    - A_CAP
    - A_REC
    description: All four conditions must hold together
  A_M_PSOSBCD_1A:
    name: Any of the referred steps (A_M_PSOSBCD_1A)
    logic: ANY
    members:
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    description: TRUE when any step of the law this check refers to is TRUE
  A_M_PSOSBCD_1B:
    name: Any of the referred steps (A_M_PSOSBCD_1B)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_M_PSOSBCD_1:
    name: Person has opted for composition levy under specified clauses
    logic: ANY
    members:
    - A_M_PSOSBCD_1A
    - A_M_PSOSBCD_1B
    - PD_M_CRFOS
  A_AROPMOI_2:
    name: Any of the referred steps (A_AROPMOI_2)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_PERSON_TYPE:
    name: Person Type
    logic: ANY
    members:
    - A_IS_CTP
    - A_IS_NRTP
    description: The person is either a casual taxable person or a non-resident taxable person.
  G_M_SRFSU_1:
    name: Person is an SEZ unit holder or developer
    logic: ANY
    members:
    - A_M_SRFSU_1
    - A_M_SRFSU_2
  G_DECISION_SUBJECT:
    name: Decision Subject
    logic: ANY
    members:
    - A_REGISTRATION_DECISION
    - A_UIN_DECISION
    description: A decision must be made for either a registration application or a Unique Identity Number application.
  G_DEEMING_CONDITIONS:
    name: Conditions for deemed grant
    logic: ALL
    members:
    - A_PERIOD_EXPIRED
    - A_NO_DEFICIENCY_COMMUNICATED
    description: The conditions that must be met for a registration or UIN to be deemed granted.
  G_ELIGIBILITY_CONDITION:
    name: Eligibility Condition
    logic: ALL
    members:
    - A_NOT_LIABLE_S22
    - PD_M_ROAMTS
    description: The person must not be liable for registration under either Section 22 or Section 24.
  G_M_EIDSAD_CONDITIONS:
    name: Conditions for deeming establishments as distinct persons
    logic: ALL
    members:
    - G_M_EIDSAD_REG_STATUS
    - A_M_EIDSAD_OTHER_ESTABLISHMENT
  G_M_EIDSAD_REG_STATUS:
    name: Registration status in a State or UT
    logic: ANY
    members:
    - A_M_EIDSAD_REGISTRATION_OBTAINED
    - A_M_EIDSAD_REGISTRATION_REQUIRED
  G_M_RPAA_1:
    name: Aadhaar Action
    logic: ANY
    members:
    - A_M_RPAA_2
    - A_M_RPAA_3
    description: The person must either undergo authentication OR furnish proof.
  G_M_RPAA_2:
    name: Prescribed Procedure
    logic: ALL
    members:
    - A_M_RPAA_4
    - A_M_RPAA_5
    description: The action must comply with both the prescribed form/manner AND the prescribed time.
  G_MANNER_VALID:
    name: Manner Validity
    logic: ALL
    members:
    - A_MANNER_PRESCRIBED
    - A_PRESCRIPTION_RECOMMENDED
    description: The manner for alternate identification must be both prescribed by the Government and based on Council recommendations.
  G_FAILURE_CONDITIONS:
    name: Failure of identification requirements
    logic: ANY
    members:
    - A_FAIL_AADHAAR_AUTH
    - A_FAIL_AADHAAR_PROOF
    - A_FAIL_ALT_ID
    description: A person fails to undergo Aadhaar authentication, or furnish proof of Aadhaar, or furnish alternate identification.
  G_AADHAAR_ACTION:
    name: Aadhaar compliance action
    logic: ANY
    members:
    - A_AADHAAR_AUTHENTICATED
    - A_AADHAAR_PROOF_FURNISHED
  G_M_AIFUA_TRIGGER:
    name: Trigger for alternate identification
    logic: ALL
    members:
    - A_M_AIFUA_1
    - A_M_AIFUA_2
  G_M_AIFUA_CONSEQUENCE:
    name: Obligation for alternate identification
    logic: ALL
    members:
    - A_M_AIFUA_3
    - A_M_AIFUA_4
    - A_M_AIFUA_5
  G_AADHAAR_COMPLIANCE:
    name: Aadhaar compliance by authentication or proof
    logic: ANY
    members:
    - A_AADHAAR_AUTHENTICATION
    - A_AADHAAR_PROOF
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_DOANFS_1:
    outcome: AADHAAR_NUMBER_MEANING_DEFINED
    expr: A_DOANFS_1
    module: M_DOANFS
    description: The meaning of 'Aadhaar number' is established for the purposes of Section 25.
  LE_M_RPOOD:
    outcome: DEEMED_RELATED_PERSONS
    expr: G_M_RPOOD_1
    module: M_RPOOD
    description: Persons are deemed to be related if they are officers or directors of one another's businesses.
  LE_RPLRP:
    outcome: PD_RPLRP
    expr: A_RPLRP
    module: M_RPLRP
  LE_M_RPEAE:
    outcome: PERSONS_DEEMED_RELATED
    expr: A_M_RPEAE_1
    module: M_RPEAE
    description: If the condition is met, the persons are deemed to be related persons for the purposes of the Act.
  LE_RP25PS:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RP25PS
    module: M_RP25PS
    description: The legal outcome is that the persons are deemed to be related if the condition is met.
  LE_RPDIC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_CONTROL
    module: M_RPDIC
    description: The legal outcome is that the persons are deemed to be 'related persons' for the purposes of the Act.
  LE_M_RPCC:
    outcome: RELATED_PERSONS_DEEMED
    expr: G_M_RPCC
    module: M_RPCC
    description: The persons are deemed to be related persons if the condition of common control is met.
  LE_RPJC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RPJC_1
    module: M_RPJC
  LE_RPSFM:
    outcome: PERSONS_DEEMED_RELATED_PERSONS
    expr: A_FAMILY_MEMBERS
    module: M_RPSFM
    description: Persons are deemed to be related persons for the purposes of this Act if they are members of the same family
  LE_RPSAD:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_SOLE_ROLE
    module: M_RPSAD
    description: Where the persons are associated in the business of one another in that one is the sole agent or sole distributor
      or sole concessionaire of the other howsoever described then they shall be deemed to be related for the purposes of
      this Act
  LE_ASSOC:
    outcome: ASSOC
    expr: A_ASSOC
    module: M_RTOSFAE
    description: The supply is made by associated enterprises (Second Proviso to Section 13(3), part of the law)
  LE_M_ROAMTS:
    outcome: COMPULSORY_REGISTRATION_REQUIRED
    expr: G_AGENT_CONDITIONS
    module: M_ROAMTS
    description: the following categories of persons shall be required to be registered under this Act,
  LE_IOSFRP:
    outcome: DEEMED_SUPPLY_IMPORT_SERVICES
    expr: A_SERVICE_IMPORT AND G_SOURCE AND A_BUSINESS_PURPOSE
    module: M_IOSFRP
    description: Import of services by a person from a related person or from any of his other establishments outside India
      in the course or furtherance of business is treated as a supply under Schedule I paragraph 4.
  LE_CLRM_OPT:
    outcome: S10_1_A_MANUFACTURER_MAY_OPT_COMPOSITION
    expr: G_CLRM_ELIG AND A_CLRM_MANUF AND A_CLRM_COND
    module: M_CLRM
    description: A registered manufacturer whose preceding-year aggregate turnover did not exceed fifty lakh rupees may opt
      for the composition amount under clause (a), subject to prescribed conditions and restrictions. This is a permission,
      not an obligation.
  LE_CLRM_RATE:
    outcome: S10_1_A_AMOUNT_AT_PRESCRIBED_RATE_NOT_EXCEEDING_ONE_PERCENT
    expr: G_CLRM_ELIG AND A_CLRM_MANUF AND A_CLRM_COND AND A_CLRM_OPT AND G_CLRM_RATE
    module: M_CLRM
    description: Where an eligible manufacturer has opted, the amount payable in lieu of section 9(1) tax is calculated at
      the prescribed rate, which does not exceed one per cent. of turnover in State or turnover in Union territory
  LE_CLRM_S9:
    outcome: S10_1_A_OPTION_SUBJECT_TO_S9_3_AND_S9_4
    expr: A_CLRM_OPT AND G_CLRM_S9
    module: M_CLRM
    description: The composition option and the in-lieu amount operate subject to the provisions of section 9(3) and 9(4).
      Where tax on a supply is payable under either sub-section, those provisions prevail over this clause. The option does
      not displace them, and the subjection is not a bar to opting.
  LE_OPTION:
    outcome: COMPOSITION_OPTION_UNDER_S10_1_B_AVAILABLE
    expr: G_ELIG
    module: M_CRFSIIRS
    description: The permissive option under this clause is available when every eligibility element holds. Because the clause
      uses may, availability does not mean that the option has been exercised.
  LE_AMOUNT:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX_AT_S10_1_B_RATE
    expr: G_ELIG AND A_OPT AND G_AMOUNT
    module: M_CRFSIIRS
    description: An eligible person who has opted pays an amount in lieu of tax under section 9(1). The amount is calculated
      at the prescribed rate. That rate must not exceed two and a half per cent. of turnover in State or turnover in Union
      territory.
  LE_M_CRFOS:
    outcome: COMPOSITION_SCHEME_OPTION_AVAILABLE
    expr: G_M_CRFOS_ELIGIBILITY AND A_M_CRFOS_7
    module: M_CRFOS
  LE_EOIFTFC:
    outcome: VALUE_NOT_TAKEN_INTO_ACCOUNT_IN_TURNOVER
    expr: A_PROVISO_CTX AND A_TERRITORY AND A_EXEMPT_SVC AND G_FORM AND G_CONSIDERATION
    module: M_EOIFTFC
    description: The value (to the extent of interest or discount) of an exempt supply of services provided by extending deposits,
      loans or advances shall not be taken into account for determining the value of turnover in a State or Union territory
      for the second proviso.
  LE_GPTICL:
    outcome: COMPOSITION_LIMIT_INCREASE_AUTHORISED
    expr: G_INCREASE
    module: M_GPTICL
    description: An increase of the fifty lakh rupees limit is authorised under this proviso only if it is made by Government
      notification, to a higher amount, not above one crore and fifty lakh rupees, and as recommended by the Council
  LE_M_PSOSBCD:
    outcome: SERVICE_SUPPLY_PERMITTED_BY_PROVISO
    expr: G_M_PSOSBCD_1 AND A_M_PSOSBCD_2 AND A_M_PSOSBCD_3 AND A_M_PSOSBCD_4
    module: M_PSOSBCD
  LE_AROPMOI:
    outcome: NOT_ELIGIBLE_FOR_COMPOSITION_S10_1
    expr: A_AROPMOI_1 AND A_AROPMOI_2
    module: M_AROPMOI
    description: The registered person is not eligible for the composition scheme under Section 10(1).
  LE_M_RFSFTW_1:
    outcome: REGISTRATION_REQUIRED_IN_SPECIFIED_LOCATION
    expr: A_M_RFSFTW_1
    module: M_RFSFTW
    description: If a person makes a supply from the territorial waters of India, they are obligated to obtain registration
      in the coastal State or Union territory where the nearest point of the appropriate baseline is located.
  LE_M_RFCONP:
    outcome: OBLIGATION_MET
    expr: G_PERSON_TYPE AND A_TIMING_OBLIGATION
    module: M_RFCONP
    description: The obligation to apply for registration is met if the person is a casual or non-resident taxable person
      and applies at least five days before business commencement.
  LE_M_SRFSU:
    outcome: OBLIGATION_TO_APPLY_FOR_SEPARATE_REGISTRATION
    expr: G_M_SRFSU_1
    module: M_SRFSU
    description: If the person has an SEZ unit or is an SEZ developer, they are obligated to apply for a separate registration,
      which is distinct from any business place outside the SEZ in the same State or UT.
  LE_VATFGOR:
    outcome: REGISTRATION_PROCESS_COMPLIANT
    expr: G_DECISION_SUBJECT AND A_DUE_VERIFICATION AND A_PRESCRIBED_MANNER AND A_PRESCRIBED_PERIOD
    module: M_VATFGOR
    description: The process for deciding on a registration or UIN application is compliant if a decision is made on the correct
      subject, after due verification, and within the prescribed manner and period.
  LE_M_IORC:
    outcome: PROCEDURE_DEFINED
    expr: A_M_IORC_FORM_PRESCRIBED AND A_M_IORC_DATE_PRESCRIBED
    module: M_IORC
    description: The procedure for issuing a registration certificate requires that the form and effective date are as prescribed.
  LE_DEEMED_REGISTRATION:
    outcome: REGISTRATION_DEEMED_GRANTED
    expr: A_APPLIED_FOR_REG AND G_DEEMING_CONDITIONS
    module: M_DGOROU
    description: Deemed grant of a registration number.
  LE_DEEMED_UIN:
    outcome: UIN_DEEMED_GRANTED
    expr: A_APPLIED_FOR_UIN AND G_DEEMING_CONDITIONS
    module: M_DGOROU
    description: Deemed grant of a Unique Identity Number.
  LE_SRIAS:
    outcome: SINGLE_REGISTRATION_MANDATED
    expr: A_SINGLE_REGISTRATION_RULE
    module: M_SRIAS
    description: The person shall be granted a single registration in the State or Union territory.
  LE_M_SRFMBP:
    outcome: SEPARATE_REGISTRATION_PERMITTED
    expr: A_MULTIPLE_POB_IN_STATE AND A_PRESCRIBED_CONDITIONS_MET
    module: M_SRFMBP
  LE_PERMISSION:
    outcome: VOLUNTARY_REGISTRATION_PERMITTED
    expr: G_ELIGIBILITY_CONDITION
    module: M_VRAIC
    description: The person is permitted to register for GST voluntarily if they are not liable for mandatory registration.
  LE_CONSEQUENCE:
    outcome: ALL_PROVISIONS_APPLY
    expr: A_PROVISIONS_APPLY
    module: M_VRAIC
    description: All provisions of the GST Act that apply to a registered person will apply to the voluntarily registered
      person.
  LE_MRTADP:
    outcome: ARE_DISTINCT_PERSONS
    expr: A_DEEMED_DISTINCT_PERSONS
    module: M_MRTADP
    description: The person is deemed to be a collection of distinct persons.
  LE_M_EIDSAD:
    outcome: ESTABLISHMENTS_DEEMED_DISTINCT
    expr: G_M_EIDSAD_CONDITIONS
    module: M_EIDSAD
    description: The establishments are treated as establishments of distinct persons.
  LE_PRFGR:
    outcome: ELIGIBLE_FOR_REGISTRATION
    expr: A_PAN_REQUIRED
    module: M_PRFGR
    description: The person is eligible for grant of registration under this subsection if the PAN condition is met.
  LE_M_TPRE:
    outcome: ELIGIBLE_FOR_REGISTRATION
    expr: A_M_TPRE_1 AND A_M_TPRE_2
    module: M_TPRE
  LE_M_RPAA:
    outcome: OBLIGATION_MET
    expr: A_M_RPAA_1 AND G_M_RPAA_1 AND G_M_RPAA_2
    module: M_RPAA
    description: The obligation is met if the registered person performs one of the required actions in the prescribed way.
  LE_1_M_AIFUA:
    outcome: OBLIGATION_TO_OFFER_ALT_ID_EXISTS
    expr: A_AADHAAR_NOT_ASSIGNED
    module: M_AIFUA
    description: An obligation to offer alternate means of identification exists if an Aadhaar number is not assigned to the
      registered person.
  LE_2_M_AIFUA:
    outcome: ALT_ID_MANNER_IS_VALIDLY_DEFINED
    expr: G_MANNER_VALID
    module: M_AIFUA
    description: The manner for alternate identification is validly defined if it is prescribed by the Government on the recommendations
      of the Council.
  LE_REGISTRATION_STATUS:
    outcome: REGISTRATION_DEEMED_INVALID
    expr: G_FAILURE_CONDITIONS
    module: M_FOAAC
    description: If the person fails any of the identification requirements, their registration is deemed invalid.
  LE_ACT_APPLICATION:
    outcome: PERSON_TREATED_AS_UNREGISTERED
    expr: G_FAILURE_CONDITIONS
    module: M_FOAAC
    description: If the person fails any of the identification requirements, other provisions of the Act apply as if they
      are not registered.
  LE_AAFRE:
    outcome: REGISTRATION_ELIGIBILITY_CONDITION_MET
    expr: A_EFFECTIVE_FROM_NOTIFICATION AND A_APPLICANT_IS_INDIVIDUAL AND A_FOR_REGISTRATION_GRANT AND G_AADHAAR_ACTION AND
      A_COMPLIANCE_IN_PRESCRIBED_MANNER
    module: M_AAFRE
  LE_M_AIFUA:
    outcome: COMPLIANT_ALTERNATE_ID_PROCESS
    expr: (NOT G_M_AIFUA_TRIGGER) OR G_M_AIFUA_CONSEQUENCE
    module: M_AIFUA
  LE_AAFNE:
    outcome: ELIGIBILITY_FOR_REGISTRATION_MET
    expr: A_EFFECTIVE_DATE AND A_NON_INDIVIDUAL AND G_AADHAAR_COMPLIANCE AND A_PRESCRIBED_MANNER_AAFNE AND A_COUNCIL_RECOMMENDATION
    module: M_AAFNE
triggers:
  CT_S9:
    question: Does sub-section (3) or (4) of section 9 apply to the supplies concerned so that it prevails over the composition
      option to that extent?
    trigger: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE OR F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
    beside: LE_OPTION
