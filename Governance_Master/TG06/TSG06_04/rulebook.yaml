    tier: T0
  F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER:
    name: Supplier is a non-resident taxable person
    type: BOOLEAN
    tier: T0
  F_DAYS_BETWEEN_APP_AND_COMMENCEMENT:
    name: Number of days between registration application submission and business commencement
    type: AMOUNT
    tier: T0
  F_PERSON_HAS_SEZ_UNIT:
    name: Person has a unit in a Special Economic Zone
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_SEZ_DEVELOPER:
    name: Person is a Special Economic Zone developer
    type: BOOLEAN
    tier: T1
  F_REGISTRATION_GRANT_TYPE:
    name: 'Kind of grant made: registration or Unique Identity Number'
    type: CODE
    options:
    - NONE
    - REGISTRATION
    - UIN
    tier: T0
  F_APPLICATION_STATUS:
    name: Status of the application for registration or Unique Identity Number
    type: CODE
    options:
    - GRANTED
    - OTHER
    - PENDING
    - REJECTED
    tier: T1
  F_APPLICATION_VERIFICATION_EVIDENCE:
    name: Evidence of due verification for the application
    type: TEXT
    tier: T1
  F_REG_UIN_MANNER_IS_PRESCRIBED:
    name: A manner for grant or rejection of registration/UIN is prescribed
    type: BOOLEAN
    tier: T1
  F_APPLICATION_PROCESS_LOG:
    name: Log of the process followed for the application
    type: TEXT
    tier: T1
  F_AUTHORITY_ACTION_WITHIN_PRESCRIBED_PERIOD:
    name: Officer's action is within the prescribed period
    type: BOOLEAN
    tier: T1
  F_GOVT_REG_CERT_FORM_IS_PRESCRIBED:
    name: A form for the certificate of registration is prescribed
    type: BOOLEAN
    tier: T1
  F_GOVT_REG_CERT_DATE_MANNER_IS_PRESCRIBED:
    name: The manner of determining the effective date of registration is prescribed
    type: BOOLEAN
    tier: T1
  F_APPLICATION_TYPE:
    name: 'Kind of application made: registration or Unique Identity Number'
    type: CODE
    options:
    - OTHER
    - REGISTRATION
    - UIN
    tier: T1
  F_PRESCRIBED_PERIOD_EXPIRED:
    name: The prescribed period for action on the application has expired
    type: BOOLEAN
    tier: T1
  F_DEFICIENCY_COMMUNICATED_IN_PERIOD:
    name: Deficiency was communicated to applicant within the prescribed period
    type: BOOLEAN
    tier: T1
  F_PERSON_POB_COUNT_IN_STATE:
    name: Number of person's places of business in a single State or UT
    type: AMOUNT
    tier: T1
  F_CONDITIONS_FOR_SEP_REG_MET:
    name: The prescribed conditions for the grant of a separate registration are met
    type: BOOLEAN
    tier: T1
  F_PERSON_LIABLE_S22:
    name: Person is liable to be registered under section 22
    type: BOOLEAN
    tier: T1
  F_PERSON_REGISTRATION_TYPE:
    name: Type of registration obtained by the person
    type: CODE
    options:
    - VOLUNTARY
    - COMPULSORY
    - OTHER
    tier: T0
  F_PERSON_HAS_MULTIPLE_REGISTRATIONS:
    name: Person has obtained more than one registration
    type: BOOLEAN
    tier: T0
  F_PERSON_REQUIRES_MULTIPLE_REGISTRATIONS:
    name: Person is required to obtain more than one registration
    type: BOOLEAN
    tier: T1
  F_PERSON_HAS_REGISTRATION_IN_STATE_UT:
    name: Person has obtained registration in a State or UT
    type: BOOLEAN
    tier: T0
  F_PERSON_IS_REQUIRED_TO_REGISTER_IN_STATE_UT:
    name: Person is required to obtain registration in a State or UT
    type: BOOLEAN
    tier: T1
  F_PERSON_HAS_ESTABLISHMENT_IN_DIFFERENT_STATE_UT:
    name: Person has an establishment in a different State or UT
    type: BOOLEAN
    tier: T0
  F_PERSON_HAS_VALID_PAN:
    name: Person has a valid Permanent Account Number
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_TDS_DEDUCTOR_S51:
    name: Person is required to deduct tax under section 51
    type: BOOLEAN
    tier: T1
  F_PERSON_TAN:
    name: Tax Deduction and Collection Account Number of the person
    type: TEXT
    tier: T1
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_PERSON_AADHAAR_AUTHENTICATED:
    name: Person has undergone Aadhaar authentication
    type: BOOLEAN
    tier: T1
  F_PERSON_AADHAAR_PROOF_FURNISHED:
    name: Person has furnished proof of Aadhaar possession
    type: BOOLEAN
    tier: T1
  F_COMPLIANCE_FORM_MANNER_MET:
    name: Aadhaar compliance was done in the prescribed form and manner
    type: BOOLEAN
    tier: T1
  F_COMPLIANCE_TIME_MET:
    name: Aadhaar compliance was done within the prescribed time
    type: BOOLEAN
    tier: T1
  F_PERSON_AADHAAR_ASSIGNED:
    name: Aadhaar number is assigned to the registered person
    type: BOOLEAN
    tier: T1
  F_ID_MANNER_IS_PRESCRIBED:
    name: A manner for alternate identification is prescribed by the Government
    type: BOOLEAN
    tier: T1
  F_MANNER_IS_COUNCIL_RECOMMENDED:
    name: The manner for alternate identification is based on the recommendations of the Council
    type: BOOLEAN
    tier: T1
  F_PERSON_ALTERNATE_ID_FURNISHED:
    name: Person has furnished alternate and viable means of identification
    type: BOOLEAN
    tier: T1
  F_APPLICATION_DATE_IS_ON_OR_AFTER_NOTIFIED_DATE:
    name: Application date is on or after the notification effective date
    type: BOOLEAN
    tier: T1
  F_APPLICANT_CONSTITUTION:
    name: Legal constitution of the applicant
    type: CODE
    options:
    - AOP
    - BOI
    - COMPANY
    - HUF
    - INDIVIDUAL
    - OTHER
    - PARTNERSHIP
    tier: T0
  F_KEY_PERSONNEL_AADHAAR_AUTHENTICATED:
