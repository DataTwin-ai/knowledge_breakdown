  A_NOT_NRTP:
    statement: The registered person is not a non-resident taxable person
    order: LOW
    rule: F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER = FALSE
  A_OPTED_CIFCN:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount of tax under sub-section (2A) of section 10
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_2A'
  A_RATE_PRESCRIBED_CIFCN:
    statement: The amount of tax is calculated at such rate as may be prescribed
    order: LOW
    rule: F_TAX_COMPOSITION_RATE_IS_PRESCRIBED = TRUE
  A_RATE_CAP_CIFCN:
    statement: The rate at which the amount of tax is calculated does not exceed three per cent. of the turnover in State
      or turnover in Union territory
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_RATE_PERCENT <= 3
  A_BASE_CIFCN:
    statement: The amount of tax is calculated on the turnover in State or turnover in Union territory
    order: LOW
    rule: F_TAX_COMPOSITION_BASE IN ['TURNOVER_IN_STATE', 'TURNOVER_IN_UT']
  A_S9_3_SUPPLY:
    statement: The supply in question is one to which the provisions of sub-section (3) of section 9 apply, and the option
      under sub-section (2A) of section 10 remains subject to those provisions
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_S9_4_SUPPLY:
    statement: The supply in question is one to which the provisions of sub-section (4) of section 9 apply, and the option
      under sub-section (2A) of section 10 remains subject to those provisions
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_M_COLOTEL_2:
    statement: The person's aggregate turnover during a financial year exceeds the limit specified under the availed sub-section.
    order: HIGH
    interpretation: Does the supplier's aggregate turnover in the current financial year exceed the applicable limit? The
      limit depends on the composition option availed (s10(1) or s10(2A)) and, for s10(1), the supplier's state. The limit
      for s10(2A) is Rs 50 lakh. The limit for s10(1) is Rs 1.5 crore or Rs 75 lakh for specified states.
    grounding:
    - F_SUPPLIER_AGGREGATE_TURNOVER_CFY
    - F_PERSON_COMPOSITION_OPTION
    - F_SUPPLIER_STATE
  A_CSPOTAI_2:
    statement: The person shall not collect any tax from the recipient on supplies made by him
    order: LOW
    rule: F_SUPPLY_TAX_WAS_COLLECTED = FALSE
  A_CSPOTAI_3:
    statement: The person shall not be entitled to any credit of input tax
    order: LOW
    rule: F_PERSON_ITC_WAS_CLAIMED = FALSE
  A_INELIGIBLE:
    statement: The taxable person was not eligible to pay tax under the sub-section ((1) or (2A), as the case may be) under
      which the tax was paid
    order: HIGH
    if_false: the person met all eligibility requirements of the sub-section under which tax was paid
    interpretation: Did the person fail to meet the eligibility requirements of the sub-section (sub-section (1) or sub-section
      (2A)) under which tax was paid? Eligibility requirements are read from that sub-section and are not stated in this MKP
    grounding:
    - F_SUPPLIER_COMPLIES_WITH_COMPOSITION_CONDITIONS
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY
  A_ATFCE_1:
    statement: For the purpose of determining eligibility to pay tax under this section, the aggregate turnover shall include
      the value of supplies made by the person from the 1st day of April of a financial year up to the date when he becomes
      liable for registration under this Act.
    order: HIGH
    interpretation: Does the calculation of 'aggregate turnover' for composition eligibility include the value of supplies
      from the 1st day of April of the financial year up to the date the person becomes liable for registration?
    grounding:
    - F_FINANCIAL_YEAR_START_DATE
    - F_REGISTRATION_LIABILITY_DATE
  A_ATFCE_2:
    statement: For the purpose of determining eligibility to pay tax under this section, the aggregate turnover shall not
      include the value of an exempt supply of services provided by way of extending deposits, loans or advances where the
      consideration is represented by way of interest or discount.
    order: LOW
    rule: F_SUPPLY_IS_EXEMPT = TRUE AND F_SUPPLY_TYPE = 'SERVICES' AND F_SERVICE_NATURE IN ['DEPOSIT_EXTENSION', 'LOAN_EXTENSION',
      'ADVANCE_EXTENSION'] AND F_CONSIDERATION_FORM IN ['INTEREST', 'DISCOUNT']
  A_PURPOSE:
    statement: The turnover is being considered for the purposes of determining the tax payable by a person under this section
    order: LOW
    rule: F_PERSON_IS_COMPOSITION_TAXPAYER = TRUE
  A_PERIOD:
    statement: The supply is made from the first day of April of a financial year up to the date when such person becomes
      liable for registration under this Act
    order: LOW
    rule: F_SUPPLY_ON_OR_AFTER_FY_START = TRUE AND F_SUPPLY_ON_OR_BEFORE_REG_LIABILITY_DATE = TRUE
  A_M_EOIIFT_1:
    statement: For the purpose of determining tax payable by a person under this section, the 'turnover in State or turnover
      in Union territory' shall not include the value of the supply.
    order: LOW
    rule: F_PERSON_IS_COMPOSITION_TAXPAYER = TRUE
  A_M_EOIIFT_2:
    statement: The supply is an exempt supply of services.
    order: LOW
    rule: F_SUPPLY_IS_EXEMPT = TRUE AND F_SUPPLY_TYPE = 'SERVICES'
  A_M_EOIIFT_3:
    statement: The service is provided by way of extending deposits.
    order: LOW
    rule: F_SERVICE_NATURE = 'DEPOSIT_EXTENSION'
  A_M_EOIIFT_4:
    statement: The service is provided by way of extending loans.
    order: LOW
    rule: F_SERVICE_NATURE = 'LOAN_EXTENSION'
  A_M_EOIIFT_5:
    statement: The service is provided by way of extending advances.
    order: LOW
    rule: F_SERVICE_NATURE = 'ADVANCE_EXTENSION'
  A_M_EOIIFT_6:
    statement: The consideration for the supply is represented by way of interest.
    order: LOW
    rule: F_CONSIDERATION_FORM = 'INTEREST'
  A_M_EOIIFT_7:
    statement: The consideration for the supply is represented by way of discount.
    order: LOW
    rule: F_CONSIDERATION_FORM = 'DISCOUNT'
  A_SUPPLYING_EXEMPTED:
    statement: The registered person is supplying exempted goods or services or both.
    order: LOW
    rule: F_SUPPLY_IS_EXEMPT = TRUE
  A_BOS_ISSUED_INSTEAD_OF_TI:
    statement: A bill of supply is issued for the supply, instead of a tax invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'BILL_OF_SUPPLY' AND F_TAX_INVOICE_IS_ISSUED = FALSE
  A_BOS_HAS_PRESCRIBED_PARTICULARS:
    statement: The bill of supply contains such particulars as may be prescribed.
    order: LOW
    rule: F_BOS_HAS_PRESCRIBED_PARTICULARS = TRUE
  A_BOS_ISSUED_IN_PRESCRIBED_MANNER:
    statement: The bill of supply is issued in such manner as may be prescribed.
    order: LOW
    rule: F_BOS_ISSUED_IN_PRESCRIBED_MANNER = TRUE
  A_REGISTERED_SUPPLIER:
    statement: The person making the supply is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_TIIRI_1:
    statement: The document is a revised invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'REVISED_INVOICE'
  A_TIIRI_2:
    statement: The revised invoice was issued by the supplier.
    order: LOW
    rule: F_DOCUMENT_ISSUER_ROLE = 'SUPPLIER'
  A_TIIRI_3:
    statement: The revised invoice is in respect of a supply made earlier.
    order: HIGH
    interpretation: Does the date of issue of the revised invoice (F_TAX_INVOICE_ISSUE_DATE) occur after the date of the supply
      it pertains to (F_ORIGINAL_SUPPLY_DATE)?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_ORIGINAL_SUPPLY_DATE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_CLRM_ELIG:
    name: Registered person turnover eligibility
    logic: ALL
    members:
    - A_CLRM_REG
    - A_CLRM_TO
    description: The person is registered and the preceding-year aggregate turnover did not exceed fifty lakh rupees
  G_CLRM_RATE:
    name: Prescribed rate within manufacturer ceiling
    logic: ALL
    members:
    - A_CLRM_RATEPRE
    - A_CLRM_CAP
    description: The amount is computed at the prescribed rate, and that rate does not exceed one per cent. of turnover in
      State or Union territory
  G_CLRM_S9:
    name: Section 9(3) or 9(4) supply
    logic: ANY
    members:
    - A_CLRM_S93
    - A_CLRM_S94
    description: Tax on the supply is payable under section 9(3) or under section 9(4)
  G_ELIG:
    name: Clause (b) composition eligibility
    logic: ALL
    members:
    - A_REG
    - A_TURN
    - A_SCH2
    - A_S9
    - A_COND
    description: All of the following hold. The person is registered. The preceding-year aggregate turnover limit is met.
      The person is engaged in Schedule II para 6(b) supplies. The option operates within the subjection to section 9(3) and
      9(4). The prescribed conditions and restrictions are satisfied.
  G_AMOUNT:
    name: Composition amount computation
    logic: ALL
    members:
    - A_PRESCRIBED
    - A_RATECAP
    - G_BASE
    description: The amount is calculated at the prescribed rate. That rate does not exceed two and a half per cent. and is
      applied to turnover in State or turnover in Union territory.
  G_BASE:
    name: Turnover base alternatives
    logic: ANY
    members:
    - A_BASE_STATE
    - A_BASE_UT
    description: The base is turnover in State or, alternatively, turnover in Union territory.
  G_M_CRFOS_ELIGIBILITY:
    name: Eligibility Criteria
    logic: ALL
    members:
    - A_M_CRFOS_1
    - A_M_CRFOS_2
    - A_M_CRFOS_3
    - G_M_CRFOS_NO_RCM
    - A_M_CRFOS_6
  G_M_CRFOS_NO_RCM:
    name: RCM Inapplicability
    logic: ALL
    members:
    - A_M_CRFOS_4
    - A_M_CRFOS_5
  G_FORM:
    name: Form of exempt financial service
    logic: ANY
    members:
    - A_DEPOSIT
    - A_LOAN
    - A_ADVANCE
    description: The services are provided by way of extending deposits, loans or advances. These are alternatives.
  G_CONSIDERATION:
    name: Form of consideration
    logic: ANY
    members:
    - A_INTEREST
    - A_DISCOUNT
    description: The consideration is represented by way of interest or discount. These are alternatives.
  G_INCREASE:
    name: Conditions of a valid limit increase
    logic: ALL
    members:
    - A_NOTIF
    - A_HIGHER
    - A_CAP
    - A_REC
    description: All four conditions must hold together
  A_M_PSOSBCD_1A:
    name: Any of the referred steps (A_M_PSOSBCD_1A)
    logic: ANY
    members:
