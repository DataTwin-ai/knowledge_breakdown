    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_GOODS_MANUFACTURED_BY_SUPPLIER
  A_S9_3:
    statement: The supply falls within sub-section (3) of section 9, to which the option under Section 10(2A) remains subject
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_S9_4:
    statement: The supply falls within sub-section (4) of section 9, to which the option under Section 10(2A) remains subject
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_OPTED:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
