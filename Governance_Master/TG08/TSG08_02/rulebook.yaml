outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_M_NBOSBTH:
    outcome: MAY_NOT_ISSUE_BILL_OF_SUPPLY
    expr: A_NBOSBTH_1 AND A_NBOSBTH_2 AND A_NBOSBTH_3
    module: M_NBOSBTH
  LE_CLRM_OPT:
    outcome: S10_1_A_MANUFACTURER_MAY_OPT_COMPOSITION
    expr: G_CLRM_ELIG AND A_CLRM_MANUF AND A_CLRM_COND
    module: M_CLRM
    description: A registered manufacturer whose preceding-year aggregate turnover did not exceed fifty lakh rupees may opt
      for the composition amount under clause (a), subject to prescribed conditions and restrictions. This is a permission,
      not an obligation.
  LE_CLRM_RATE:
    outcome: S10_1_A_AMOUNT_AT_PRESCRIBED_RATE_NOT_EXCEEDING_ONE_PERCENT
    expr: G_CLRM_ELIG AND A_CLRM_MANUF AND A_CLRM_COND AND A_CLRM_OPT AND G_CLRM_RATE
    module: M_CLRM
    description: Where an eligible manufacturer has opted, the amount payable in lieu of section 9(1) tax is calculated at
      the prescribed rate, which does not exceed one per cent. of turnover in State or turnover in Union territory
  LE_CLRM_S9:
    outcome: S10_1_A_OPTION_SUBJECT_TO_S9_3_AND_S9_4
    expr: A_CLRM_OPT AND G_CLRM_S9
    module: M_CLRM
    description: The composition option and the in-lieu amount operate subject to the provisions of section 9(3) and 9(4).
      Where tax on a supply is payable under either sub-section, those provisions prevail over this clause. The option does
      not displace them, and the subjection is not a bar to opting.
  LE_OPTION:
    outcome: COMPOSITION_OPTION_UNDER_S10_1_B_AVAILABLE
    expr: G_ELIG
    module: M_CRFSIIRS
    description: The permissive option under this clause is available when every eligibility element holds. Because the clause
      uses may, availability does not mean that the option has been exercised.
  LE_AMOUNT:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX_AT_S10_1_B_RATE
    expr: G_ELIG AND A_OPT AND G_AMOUNT
    module: M_CRFSIIRS
    description: An eligible person who has opted pays an amount in lieu of tax under section 9(1). The amount is calculated
      at the prescribed rate. That rate must not exceed two and a half per cent. of turnover in State or turnover in Union
      territory.
  LE_M_CRFOS:
    outcome: COMPOSITION_SCHEME_OPTION_AVAILABLE
    expr: G_M_CRFOS_ELIGIBILITY AND A_M_CRFOS_7
    module: M_CRFOS
  LE_EOIFTFC:
    outcome: VALUE_NOT_TAKEN_INTO_ACCOUNT_IN_TURNOVER
    expr: A_PROVISO_CTX AND A_TERRITORY AND A_EXEMPT_SVC AND G_FORM AND G_CONSIDERATION
    module: M_EOIFTFC
    description: The value (to the extent of interest or discount) of an exempt supply of services provided by extending deposits,
      loans or advances shall not be taken into account for determining the value of turnover in a State or Union territory
      for the second proviso.
  LE_GPTICL:
    outcome: COMPOSITION_LIMIT_INCREASE_AUTHORISED
    expr: G_INCREASE
    module: M_GPTICL
    description: An increase of the fifty lakh rupees limit is authorised under this proviso only if it is made by Government
      notification, to a higher amount, not above one crore and fifty lakh rupees, and as recommended by the Council
  LE_M_PSOSBCD:
    outcome: SERVICE_SUPPLY_PERMITTED_BY_PROVISO
    expr: G_M_PSOSBCD_1 AND A_M_PSOSBCD_2 AND A_M_PSOSBCD_3 AND A_M_PSOSBCD_4
    module: M_PSOSBCD
  LE_ECOSOS:
    outcome: ELIGIBLE_FOR_COMPOSITION_S10
    expr: A_ECOSOS_1 AND G_ECOSOS_1
    module: M_ECOSOS
    description: The registered person is eligible for the composition scheme if they are a registered person and they either
      do not supply services or supply only services permitted under sub-section (1).
  LE_M_ECONS:
    outcome: COMPOSITION_ELIGIBILITY_S10_2_B
    expr: A_M_ECONS_1
    module: M_ECONS
    description: The condition regarding non-leviable supplies for composition scheme eligibility is met.
  LE_M_ECOIS:
    outcome: ELIGIBILITY_CONDITION_MET
    expr: G_M_ECOIS_1
    module: M_ECOIS
  LE_ECOES:
    outcome: ELIGIBLE_UNDER_S10_2_D
    expr: A_ECOES_1
    module: M_ECOES
    description: The person is eligible for the composition scheme under this clause if they do not make supplies through
      a TCS-collecting e-commerce operator.
  LE_M_ECFNG:
    outcome: COMPOSITION_ELIGIBILITY_S10_2_E_MET
    expr: A_M_ECFNG_1
    module: M_ECFNG
  LE_M_ECFTT:
    outcome: ELIGIBLE_TO_OPT_S10_1
    expr: G_M_ECFTT_1
    module: M_ECFTT
  LE_AROPMOI:
    outcome: NOT_ELIGIBLE_FOR_COMPOSITION_S10_1
    expr: A_AROPMOI_1 AND A_AROPMOI_2
    module: M_AROPMOI
    description: The registered person is not eligible for the composition scheme under Section 10(1).
  LE_OPT:
    outcome: MAY_OPT_COMPOSITION_S10_2A
    expr: G_ELIG_CIFNS
    module: M_CIFNS
    description: The person may opt to pay the composition amount when all of this clause's eligibility conditions are met.
      This is a permission, not an obligation, and it applies notwithstanding contrary provisions of the Act
  LE_PAYMENT:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX
    expr: G_ELIG_CIFNS AND A_OPT_LIEU AND A_RATE_PRESCRIBED AND A_RATE_CAP
    module: M_CIFNS
    description: An eligible person who has opted pays, in lieu of tax under sub-section (1) of section 9, an amount calculated
      at the prescribed rate, and that rate does not exceed three per cent. of turnover in State or turnover in Union territory
  LE_RCM:
    outcome: S9_3_S9_4_PROVISIONS_PREVAIL_OVER_OPTION
    expr: A_OPT_LIEU AND G_RCM
    module: M_CIFNS
    description: The option is subject to the provisions of sub-sections (3) and (4) of section 9. Where those provisions
      apply, they continue to apply despite the option
  LE_M_CIFIS_1:
    outcome: COMPOSITION_OPTION_AVAILABLE_S10_2A
    expr: G_M_CIFIS_1
    module: M_CIFIS
    description: The option to pay tax under Section 10(2A) is available only when all four eligibility conditions are met.
      The provision permits the option and does not oblige the person to take it.
  LE_M_CIFIS_2:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX
    expr: G_M_CIFIS_1 AND A_M_CIFIS_5 AND G_M_CIFIS_3 AND G_M_CIFIS_2
    module: M_CIFIS
    description: An eligible registered person who has opted pays an amount of tax at the prescribed rate, not exceeding three
      per cent., of the turnover in State or turnover in Union territory. This amount replaces the tax payable under sub-section
      (1) of section 9.
  LE_M_CIFIS_3:
    outcome: S9_3_AND_S9_4_PROVISIONS_PREVAIL_OVER_S10_2A_OPTION
    expr: G_M_CIFIS_1 AND A_M_CIFIS_5 AND G_M_CIFIS_4
    module: M_CIFIS
    description: The option is subject to sub-sections (3) and (4) of section 9. Where a supply falls within either of those
      provisions, those provisions continue to apply despite the option.
  LE_ELIG:
    outcome: MAY_OPT_COMPOSITION_LEVY_UNDER_THIS_CLAUSE
    expr: G_CONDITIONS
    module: M_CIFES
    description: If all conditions are met, the registered person may opt for this composition levy. The person is not required
      to opt. The permission applies notwithstanding anything to the contrary contained in this Act. It remains subject to
      sub-sections (3) and (4) of section 9 (see LE_PRIORITY).
  LE_TERMS:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX_WITHIN_CAP
    expr: G_CONDITIONS AND A_INLIEU AND A_RATE_CAP_CIFES
    module: M_CIFES
    description: If the person is eligible and has opted, the person pays an amount of tax in lieu of the tax payable by him
      under sub-section (1) of section 9. That amount is calculated at such rate as may be prescribed. The rate must not exceed
      three per cent. of the turnover in State or turnover in Union territor
  LE_PRIORITY:
    outcome: SECTION_9_3_OR_9_4_PROVISIONS_PREVAIL_OVER_OPTION
    expr: G_SUBJECT_S9
    module: M_CIFES
    description: The option operates subject to the provisions of sub-sections (3) and (4) of section 9. Where either of those
      provisions applies, it continues to govern despite the composition option. This clause preserves those provisions. It
      is not a condition of eligibility.
  LE_OPTION_CIFNP:
    outcome: MAY_OPT_TO_PAY_COMPOSITION_AMOUNT_IN_LIEU_OF_S9_1_TAX
    expr: G_ELIG_CIFNP
    module: M_CIFNP
    description: Notwithstanding anything to the contrary in the Act, the person may opt when every eligibility condition
      is met. This is a permission, not an obligation. The option remains subject to section 9(3) and 9(4).
  LE_AMOUNT_CIFNP:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX_WITHIN_STATUTORY_LIMITS
    expr: G_ELIG_CIFNP AND A_OPTED AND A_RATE_CAP_CIFNP AND A_BASE
    module: M_CIFNP
    description: Where an eligible person has opted, the amount is paid in lieu of tax under section 9(1). It is calculated
      at the prescribed rate, which must not exceed three per cent., of turnover in State or turnover in Union territory.
  LE_S9_PRIORITY:
    outcome: OPTION_OPERATES_SUBJECT_TO_S9_3_AND_S9_4
    expr: A_OPTED AND G_S9_RCM
    module: M_CIFNP
    description: Where the person has opted and section 9(3) or 9(4) is engaged, the option operates subject to those provisions
      and does not override them. The source does not state further operative detail, and none is assumed.
  LE_OPT_S10_2A:
    outcome: MAY_OPT_COMPOSITION_S10_2A
    expr: A_REG_CIFCN AND G_INELIG AND A_TURNOVER_CIFCN AND G_EXCL
    module: M_CIFCN
    description: Permission (may opt, not an obligation) to pay the composition amount under sub-section (2A). It operates
      notwithstanding anything to the contrary in the Act but subject to section 9(3) and 9(4). Satisfying these conditions
      does not displace any further condition that other clauses of sub-section (2
  LE_AMOUNT_S10_2A:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX
    expr: PD_S10_2A_ELIGIBLE AND A_OPTED_CIFCN AND G_AMOUNT_CIFCN
    module: M_CIFCN
    description: Where an eligible person has opted, the amount of tax is calculated at the prescribed rate, not exceeding
      three per cent., of the turnover in State or turnover in Union territory, and is payable in lieu of the tax payable
      by him under section 9(1)
  LE_S9_RESERVED:
    outcome: S10_2A_OPTION_SUBJECT_TO_S9_3_S9_4
    expr: A_OPTED_CIFCN AND G_S9_SUPPLY
    module: M_CIFCN
    description: For a supply covered by section 9(3) or section 9(4), the option under sub-section (2A) remains subject to
      those provisions. The precise effect of the reservation is not stated in the source and is left for review
  LE_M_COLOTEL_1:
    outcome: COMPOSITION_OPTION_LAPSES
    expr: A_M_COLOTEL_1 AND A_M_COLOTEL_2
    module: M_COLOTEL
    description: The composition option lapses if the person has availed the option and their turnover exceeds the applicable
      limit.
  LE_CSPOTAI_1:
    outcome: COMPOSITION_RULES_COMPLIED
    expr: (NOT A_CSPOTAI_1) OR G_CSPOTAI_1
    module: M_CSPOTAI
    description: Compliance is met if the person is not under the composition scheme, or if they are and they have complied
      with both prohibitions (not collecting tax and not claiming ITC).
  LE_PENALTY:
    outcome: PENALTY_LIABLE
    expr: G_TRIGGER
    module: M_PFICL
    description: Such person shall be liable to a penalty. This is mandatory (shall) and is in addition to any tax that may
      be payable by him under any other provisions of this Act. It does not replace that tax
  LE_PROCEDURE:
    outcome: S73_OR_S74_APPLY_MUTATIS_MUTANDIS
    expr: G_TRIGGER
    module: M_PFICL
    description: The provisions of section 73 or section 74 apply mutatis mutandis for determination of tax and penalty. The
      source gives no criterion for choosing between the two sections, so the choice is not asserted here
  LE_ATFCE_1:
    outcome: AGGREGATE_TURNOVER_FOR_COMPOSITION_ELIGIBILITY_DEFINED
    expr: G_ATFCE_1
    module: M_ATFCE
    description: The method for computing aggregate turnover for composition eligibility is defined by the inclusion and exclusion
      rules specified.
  LE_EOPSFT:
    outcome: VALUE_OF_SUPPLY_EXCLUDED_FROM_TURNOVER_IN_STATE_OR_UT
    expr: G_EXCL_EOPSFT
    module: M_EOPSFT
    description: When determining tax payable under the composition section, the value of supplies from 1 April of a financial
      year up to the date the person becomes liable for registration is not included in turnover in State or turnover in Union
      territory
  LE_M_EOIIFT:
    outcome: IS_EXCLUDED_FROM_TURNOVER
    expr: G_M_EOIIFT_ALL
    module: M_EOIIFT
  LE_M_BOSFEOC:
    outcome: PROVISION_COMPLIED_WITH
    expr: (NOT G_APPLICABILITY_CONDITIONS) OR (G_APPLICABILITY_CONDITIONS AND G_OBLIGATION_FULFILLED)
    module: M_BOSFEOC
    description: The obligation to issue a bill of supply is complied with if the conditions do not apply, or if they do apply
      and a compliant bill of supply is issued.
  LE_TIIRI:
    outcome: TAX_INVOICE_INCLUDES_REVISED_INVOICE
    expr: G_TIIRI_CONDITIONS
    module: M_TIIRI
    description: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised
      invoice issued by the supplier for a supply made earlier.
triggers:
  CT_S9:
    question: Does sub-section (3) or (4) of section 9 apply to the supplies concerned so that it prevails over the composition
      option to that extent?
    trigger: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE OR F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
    beside: LE_OPTION
  CT_S9_RESERVE:
    question: How do the provisions of sub-section (3) or (4) of section 9 apply to this supply, given that the person has
      opted under sub-section (2A) of section 10?
    trigger: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE OR F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
    beside: LE_OPT_S10_2A
