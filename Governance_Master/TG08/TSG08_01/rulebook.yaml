# GOVERNANCE MASTER TSG08_01 Tax invoice (TG08 Documents)
# LAW ARC - 25 laws - status NEEDS_REVIEW
name: TSG08_01 Tax invoice - GOVERNANCE MASTER rulebook
version: TSG08_01
facts:
  F_GOODS_APPROVAL_STATUS:
    name: Goods are sent or taken on approval for sale or return
    type: BOOLEAN
    tier: T1
  F_GOODS_REMOVED_BEFORE_SUPPLY_OCCURS:
    name: Goods were removed before supply takes place
    type: BOOLEAN
    tier: T0
  F_INVOICE_ISSUED_BY_APPROVAL_DEADLINE:
    name: Invoice was issued by the deadline for approval sales
    type: BOOLEAN
    tier: T0
  F_DOCUMENT_TYPE:
    name: Type of document
    type: CODE
    options:
    - ASSESSMENT_DOCUMENT
    - BILL_OF_SUPPLY
    - CREDIT_NOTE
    - DEBIT_NOTE
    - DELIVERY_CHALLAN
    - OTHER
    - OTHER_LIKE_DOCUMENT
    - PAYMENT_VOUCHER
    - RECEIPT_VOUCHER
    - REFUND_VOUCHER
    - REVISED_INVOICE
    - SELF_INVOICE
    - SUPPLEMENTARY_INVOICE
    - TAX_INVOICE
    tier: T1
  F_DOCUMENT_ISSUER_ROLE:
    name: Role of the entity that issued the document
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - AGENT
    - OTHER
    tier: T1
  F_TAX_INVOICE_ISSUE_DATE:
    name: Date of issue of the tax invoice relating to the supply
    type: DATE
    tier: T1
  F_ORIGINAL_SUPPLY_DATE:
    name: Date of the earlier supply
    type: DATE
    tier: T1
  F_SUPPLY_NATURE:
    name: Nature of the supply as goods, services or both
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SUPPLY_IS_CONTRACTUAL:
    name: The supply is made under a contract
    type: BOOLEAN
    tier: T1
  F_SUPPLY_CEASED_PRE_COMPLETION:
    name: The supply of services ceased before its completion
    type: BOOLEAN
    tier: T1
  F_INVOICE_ISSUE_DATE:
    name: Date of issue of invoice
    type: DATE
    tier: T0
  F_SUPPLY_CESSATION_DATE:
    name: Date when the supply of services ceases
    type: DATE
    tier: T1
  F_SUPPLY_COVERED_BY_INVOICE:
    name: Extent of supply covered by invoice
    type: AMOUNT
    tier: T1
  F_SUPPLY_VALUE_PRE_CESSATION:
    name: Value of the supply made before cessation
    type: AMOUNT
    tier: T1
  F_SUPPLY_IS_CONTINUOUS_GOODS:
    name: Supply is a continuous supply of goods
    type: BOOLEAN
    tier: T1
  F_SUPPLY_HAS_SUCCESSIVE_STATEMENTS:
    name: Supply involves successive statements of accounts
    type: BOOLEAN
    tier: T1
  F_SUPPLY_HAS_SUCCESSIVE_PAYMENTS:
    name: Supply involves successive payments
    type: BOOLEAN
    tier: T1
  F_STATEMENT_OF_ACCOUNT_ISSUE_DATE:
    name: Date of issue of the successive statement of accounts
    type: DATE
    tier: T1
  F_PAYMENT_DATE:
    name: Date of payment for the supply
    type: DATE
    tier: T0
  F_S31A_SS1_TEXT_AVAILABLE:
    name: The text of Section 31A(1) of the CGST Act is available for interpretation
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_CONTINUOUS_SERVICE:
    name: Supply is a continuous supply of services
    type: BOOLEAN
    tier: T1
  F_PAYMENT_DUE_DATE_ASCERTAINABLE:
    name: Due date of payment is ascertainable from the contract
    type: BOOLEAN
    tier: T1
  F_INVOICE_ISSUED_BY_DUE_DATE:
    name: Invoice was issued on or before the due date of payment
    type: BOOLEAN
    tier: T1
  F_INVOICE_ISSUED_BY_PAYMENT_DATE:
    name: Invoice was issued on or before the date of payment
    type: BOOLEAN
    tier: T1
  F_PAYMENT_LINKED_TO_EVENT_COMPLETION:
    name: Payment for the supply is linked to the completion of an event
    type: BOOLEAN
    tier: T1
  F_INVOICE_ISSUED_BY_EVENT_DEADLINE:
    name: Invoice was issued on or before the date of completion of the event
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_EXEMPTION_STATUS:
    name: Exemption status of the goods or services or both supplied by the person
    type: CODE
    options:
    - NOT_EXEMPT
    - PARTLY_EXEMPT
    - WHOLLY_EXEMPT
    tier: T1
  F_TAX_INVOICE_IS_ISSUED:
    name: A tax invoice was issued for the supply
    type: BOOLEAN
    tier: T0
  F_INVOICE_ISSUED_WITHIN_PRESCRIBED_PERIOD_S31_2:
    name: Invoice for services was issued within the period prescribed under Section 31(2)
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_SERVICE_DESCRIPTION:
    name: Invoice contains description of services
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_SERVICE_VALUE:
    name: Invoice contains value of services
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_TAX_CHARGED:
    name: Invoice contains tax charged
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_PRESCRIBED_PARTICULARS:
    name: Invoice contains all other prescribed particulars
    type: BOOLEAN
    tier: T0
  F_JURISDICTION_PROVISION_IS_S31_2_PROVISO:
    name: The provision under consideration is the Proviso to Section 31(2)(a) of the CGST Act
    type: BOOLEAN
    tier: T1
  F_SERVICE_CATEGORY:
    name: Category of service supplied
    type: TEXT
    tier: T1
  F_TRANSACTION_DETAILS:
    name: Details of the transaction and related documents
    type: TEXT
    tier: T1
  F_SERVICE_IS_IN_NOTIFIED_CATEGORY_FOR_INVOICE_EXCEPTION:
    name: The service is of a category specified in a notification where a tax invoice is not required, and all conditions
      in the notification are met
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_PERSON_SUPPLIES_TAXABLE_GOODS:
    name: Person is engaged in the supply of taxable goods
    type: BOOLEAN
    tier: T0
  F_SUPPLY_INVOLVES_MOVEMENT_OF_GOODS:
    name: Supply involves movement of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_TIMING_VS_REMOVAL:
    name: Timing of invoice issue relative to goods removal
    type: CODE
    options:
    - BEFORE
    - AT
    - AFTER
    tier: T0
  F_INVOICE_CONTAINS_GOODS_DESCRIPTION:
    name: Invoice contains description of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_GOODS_QUANTITY:
    name: Invoice contains quantity of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_GOODS_VALUE:
    name: Invoice contains value of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_TIMING_VS_DELIVERY:
    name: Timing of invoice issue relative to goods delivery
    type: CODE
    options:
    - BEFORE
    - AT
    - AFTER
    tier: T0
  F_INVOICE_TIMING_VS_AVAILABILITY:
    name: Timing of invoice issue relative to goods being made available
    type: CODE
    options:
    - BEFORE
    - AT
    - AFTER
    tier: T0
  F_JURISDICTION_LAW_IS_IN_FORCE:
    name: The relevant legal provision is in force
    type: BOOLEAN
    tier: T1
  F_ITC_DOCUMENT_TYPE:
    name: Type of document possessed for ITC claim
    type: CODE
    options:
    - DEBIT_NOTE
    - NONE
    - PRESCRIBED_DOCUMENT
    - TAX_INVOICE
    tier: T0
  F_REVISED_INVOICE_ISSUE_DATE:
    name: Issue date of the revised invoice
    type: DATE
    tier: T0
  F_REGISTRATION_CERTIFICATE_ISSUE_DATE:
    name: Date of issuance of the certificate of registration
    type: DATE
    tier: T0
  F_REVISED_INVOICE_MANNER_PRESCRIBED_FOLLOWED:
    name: The manner prescribed for issuing a revised invoice was followed
    type: BOOLEAN
    tier: T0
  F_ORIGINAL_INVOICE_ISSUE_DATE:
    name: Issue date of the original invoice being revised
    type: DATE
    tier: T0
  F_REGISTRATION_EFFECTIVE_DATE:
    name: Effective date of registration
    type: DATE
    tier: T0
  F_SUPPLY_VALUE:
    name: Value of the supply of goods or services or both
    type: AMOUNT
    tier: T1
  F_LOW_VALUE_INVOICE_RULES_FOLLOWED:
    name: Prescribed conditions and manner for not issuing a tax invoice for a low-value supply are followed
    type: BOOLEAN
    tier: T0
  F_SUPPLY_HAS_CONSIDERATION:
    name: Supply is made for a consideration
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_TAX_AMOUNT_IS_PROMINENT:
    name: Tax amount is prominently indicated in the document
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_PRICE_INCLUDES_TAX:
    name: Indicated tax amount forms part of the supply price shown on the document
    type: BOOLEAN
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_PAYMENT_IS_ADVANCE:
    name: Payment is an advance payment
    type: BOOLEAN
    tier: T1
  F_PAYMENT_RELATES_TO_SUPPLY:
    name: Payment relates to a supply
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_HAS_PRESCRIBED_PARTICULARS:
    name: Document contains prescribed particulars
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_EVIDENCES_PAYMENT:
    name: Document evidences receipt of payment
    type: BOOLEAN
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_APPROVAL_SALE:
    statement: The goods are sent or taken on approval for sale or return
    order: LOW
    rule: F_GOODS_APPROVAL_STATUS = TRUE
  A_REMOVAL_BEFORE_SUPPLY:
    statement: The goods are removed before the supply takes place
    order: LOW
    rule: F_GOODS_REMOVED_BEFORE_SUPPLY_OCCURS = TRUE
  A_INVOICE_TIMELY:
    statement: The invoice is issued on or before the earlier of the time of supply or six months from the date of removal
    order: LOW
    rule: F_INVOICE_ISSUED_BY_APPROVAL_DEADLINE = TRUE
  A_TIIRI_1:
    statement: The document is a revised invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'REVISED_INVOICE'
  A_TIIRI_2:
    statement: The revised invoice was issued by the supplier.
    order: LOW
    rule: F_DOCUMENT_ISSUER_ROLE = 'SUPPLIER'
  A_TIIRI_3:
    statement: The revised invoice is in respect of a supply made earlier.
    order: HIGH
    interpretation: Does the date of issue of the revised invoice (F_TAX_INVOICE_ISSUE_DATE) occur after the date of the supply
      it pertains to (F_ORIGINAL_SUPPLY_DATE)?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_ORIGINAL_SUPPLY_DATE
  A_IFCOSS_IS_SERVICE:
    statement: The supply is a supply of services.
    order: LOW
    rule: F_SUPPLY_NATURE = 'SERVICES'
  A_IFCOSS_IS_CONTRACTUAL:
    statement: The supply of services is made under a contract.
    order: LOW
    rule: F_SUPPLY_IS_CONTRACTUAL = TRUE
  A_IFCOSS_CEASED_EARLY:
    statement: The supply of services ceases before its completion.
    order: LOW
    rule: F_SUPPLY_CEASED_PRE_COMPLETION = TRUE
  A_IFCOSS_TIMING_OBLIGATION:
    statement: The invoice shall be issued at the time when the supply ceases.
    order: HIGH
    interpretation: Is the invoice issue date the same as the date the supply of services ceased?
    grounding:
    - F_INVOICE_ISSUE_DATE
    - F_SUPPLY_CESSATION_DATE
  A_IFCOSS_EXTENT_OBLIGATION:
    statement: The invoice shall be issued to the extent of the supply made before such cessation.
    order: HIGH
    interpretation: Does the invoice cover the extent of the supply made before the cessation?
    grounding:
    - F_SUPPLY_COVERED_BY_INVOICE
    - F_SUPPLY_VALUE_PRE_CESSATION
  A_S31_4_IS_CSG:
    statement: The supply is a continuous supply of goods
    order: LOW
    rule: F_SUPPLY_IS_CONTINUOUS_GOODS = TRUE
  A_S31_4_HAS_STATEMENTS:
    statement: The supply involves successive statements of accounts
    order: LOW
    rule: F_SUPPLY_HAS_SUCCESSIVE_STATEMENTS = TRUE
  A_S31_4_HAS_PAYMENTS:
    statement: The supply involves successive payments
    order: LOW
    rule: F_SUPPLY_HAS_SUCCESSIVE_PAYMENTS = TRUE
  A_S31_4_MEETS_STATEMENT_DEADLINE:
    statement: The invoice is issued before or at the time each such statement is issued
    order: HIGH
    interpretation: For each successive statement of accounts involved, was a corresponding invoice issued on or before the
      date that statement was issued?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_STATEMENT_OF_ACCOUNT_ISSUE_DATE
  A_S31_4_MEETS_PAYMENT_DEADLINE:
    statement: The invoice is issued before or at the time each such payment is received
    order: HIGH
    interpretation: For each successive payment involved, was a corresponding invoice issued on or before the date that payment
      was received?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_PAYMENT_DATE
  A_PTPDPF_01:
    statement: The Government may, on the recommendations of the Council, prescribe a class of registered persons.
    order: HIGH
    interpretation: Does the text of Section 31A(1) empower the Government, upon Council recommendation, to designate a specific
      class of registered persons for this obligation?
    grounding:
    - F_S31A_SS1_TEXT_AVAILABLE
  A_PTPDPF_02:
    statement: The power includes creating an obligation for the prescribed class to provide prescribed modes of electronic
      payment to the recipient of their supply of goods or services or both.
    order: HIGH
    interpretation: Does the text of Section 31A(1) allow the Government to mandate that these persons must provide specific
      electronic payment modes?
    grounding:
    - F_S31A_SS1_TEXT_AVAILABLE
  A_PTPDPF_03:
    statement: The power includes creating an obligation for the prescribed class to give the recipient an option to make
      payment using the prescribed modes.
    order: HIGH
    interpretation: Does the text of Section 31A(1) allow the Government to mandate that the recipient must be given a choice
      to pay electronically?
    grounding:
    - F_S31A_SS1_TEXT_AVAILABLE
  A_PTPDPF_04:
    statement: The power includes prescribing the manner, conditions, and restrictions for the obligation.
    order: HIGH
    interpretation: Does the text of Section 31A(1) allow the Government to specify the manner, conditions, and restrictions
      of this obligation?
    grounding:
    - F_S31A_SS1_TEXT_AVAILABLE
  A_RPTITI_01:
    statement: The person supplying the services is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_RPTITI_02:
    statement: The supply consists of taxable services
    order: LOW
    rule: F_SUPPLY_NATURE = 'SERVICES' AND F_SUPPLY_EXEMPTION_STATUS != 'WHOLLY_EXEMPT'
  A_RPTITI_03:
    statement: A tax invoice is issued for the supply of services
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = TRUE
  A_RPTITI_04:
    statement: The tax invoice is issued before or after the provision of service but within a prescribed period
    order: HIGH
    interpretation: Was the tax invoice for the services issued within the period prescribed by the CGST Rules (e.g., Rule
      47)?
    grounding:
    - F_INVOICE_ISSUED_WITHIN_PRESCRIBED_PERIOD_S31_2
  A_RPTITI_05:
    statement: The tax invoice shows the description of the services
    order: LOW
    rule: F_INVOICE_CONTAINS_SERVICE_DESCRIPTION = TRUE
  A_RPTITI_06:
    statement: The tax invoice shows the value of the services
    order: LOW
    rule: F_INVOICE_CONTAINS_SERVICE_VALUE = TRUE
  A_RPTITI_07:
    statement: The tax invoice shows the tax charged thereon
    order: LOW
    rule: F_INVOICE_CONTAINS_TAX_CHARGED = TRUE
  A_RPTITI_08:
    statement: The tax invoice shows such other particulars as may be prescribed
    order: HIGH
    interpretation: Does the tax invoice contain all other particulars prescribed by the CGST Rules (e.g., Rule 46)?
    grounding:
    - F_INVOICE_CONTAINS_PRESCRIBED_PARTICULARS
  A_GOVT_POWER_TO_SPECIFY:
    statement: The Government may specify the categories of services or supplies in respect of which a tax invoice shall be
      issued.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_CONDITION_COUNCIL_RECOMMENDATION:
    statement: The Government's power is to be exercised on the recommendations of the Council.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_CONDITION_BY_NOTIFICATION:
    statement: The Government's power is to be exercised by notification.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_POWER_TO_PRESCRIBE_TIME:
    statement: For specified categories, the time within which a tax invoice shall be issued may be prescribed.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_POWER_TO_PRESCRIBE_MANNER:
    statement: For specified categories, the manner in which a tax invoice shall be issued may be prescribed.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_M_ODDTI_1:
    statement: The supply is of a category of services specified in a notification issued under the proviso to Section 31(2).
    order: HIGH
    interpretation: Given the service category of the supply, is it a category specified in any notification issued by the
      Government under the proviso to Section 31(2)?
    grounding:
    - F_SERVICE_CATEGORY
  A_M_ODDTI_2:
    statement: A document, other than a standard tax invoice, has been issued in relation to the supply.
    order: LOW
    rule: F_DOCUMENT_TYPE != 'TAX_INVOICE'
  A_M_ODDTI_3:
    statement: The transaction and the issued document meet all conditions mentioned in the relevant notification.
    order: HIGH
    interpretation: Do the transaction and the issued document satisfy all conditions stipulated in the relevant notification
      that allows the document to be deemed a tax invoice?
    grounding:
    - F_TRANSACTION_DETAILS
  A_M_TIMNBI_1:
    statement: The supply is of a category of services specified by the Government by notification, for which a tax invoice
      may not be issued, and any conditions mentioned in that notification are met.
    order: HIGH
    interpretation: Is the service one for which a notification under the proviso to S.31(2) allows for non-issuance of a
      tax invoice, and are all conditions in that notification met?
    grounding:
    - F_SERVICE_IS_IN_NOTIFIED_CATEGORY_FOR_INVOICE_EXCEPTION
  A_PRE_SUPPLIER_REGISTERED:
    statement: The person supplying the goods is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_PRE_TAXABLE_GOODS:
    statement: The supply is of taxable goods
    order: LOW
    rule: F_PERSON_SUPPLIES_TAXABLE_GOODS = TRUE
  A_PRE_GOODS_MOVEMENT:
    statement: The supply involves movement of goods
    order: LOW
    rule: F_SUPPLY_INVOLVES_MOVEMENT_OF_GOODS = TRUE
  A_CMP_INVOICE_ISSUED:
    statement: A tax invoice is issued for the supply
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = TRUE
  A_CMP_INVOICE_TIMING:
    statement: The tax invoice is issued before or at the time of removal of goods for supply to the recipient
    order: LOW
    rule: F_INVOICE_TIMING_VS_REMOVAL IN ['BEFORE', 'AT']
  A_CNT_DESCRIPTION:
    statement: The tax invoice shows the description of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_DESCRIPTION = TRUE
  A_CNT_QUANTITY:
    statement: The tax invoice shows the quantity of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_QUANTITY = TRUE
  A_CNT_VALUE:
    statement: The tax invoice shows the value of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_VALUE = TRUE
  A_CNT_TAX:
    statement: The tax invoice shows the tax charged thereon
    order: LOW
    rule: F_INVOICE_CONTAINS_TAX_CHARGED = TRUE
  A_CNT_PRESCRIBED_PARTICULARS:
    statement: The tax invoice shows such other particulars as may be prescribed
    order: HIGH
    interpretation: Does the invoice contain all other particulars prescribed in the relevant Rules (e.g., CGST Rule 46)?
    grounding:
    - F_INVOICE_CONTAINS_PRESCRIBED_PARTICULARS
  A_ITFGNM_03:
    statement: The supply is a case other than one involving movement of goods
    order: LOW
    rule: F_SUPPLY_INVOLVES_MOVEMENT_OF_GOODS = FALSE
  A_ITFGNM_05:
    statement: The tax invoice is issued before or at the time of delivery of goods to the recipient
    order: LOW
    rule: F_INVOICE_TIMING_VS_DELIVERY IN ['BEFORE', 'AT']
  A_ITFGNM_06:
    statement: The tax invoice is issued before or at the time of making the goods available to the recipient
    order: LOW
    rule: F_INVOICE_TIMING_VS_AVAILABILITY IN ['BEFORE', 'AT']
  A_ITFGNM_01:
    statement: The person supplying the goods is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_ITFGNM_02:
    statement: The supply is of taxable goods
    order: LOW
    rule: F_PERSON_SUPPLIES_TAXABLE_GOODS = TRUE
  A_ITFGNM_04:
    statement: A tax invoice is issued for the supply
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = TRUE
  A_ITFGNM_07:
    statement: The tax invoice shows the description of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_DESCRIPTION = TRUE
  A_ITFGNM_08:
    statement: The tax invoice shows the quantity of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_QUANTITY = TRUE
  A_ITFGNM_09:
    statement: The tax invoice shows the value of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_VALUE = TRUE
  A_ITFGNM_10:
    statement: The tax invoice shows the tax charged thereon
    order: LOW
    rule: F_INVOICE_CONTAINS_TAX_CHARGED = TRUE
  A_ITFGNM_11:
    statement: The tax invoice shows such other particulars as may be prescribed
    order: HIGH
    interpretation: Does the invoice contain all other particulars prescribed in the relevant Rules (e.g., CGST Rule 46)?
    grounding:
    - F_INVOICE_CONTAINS_PRESCRIBED_PARTICULARS
  A_M_GPTSTIC_01:
    statement: The Government may specify the categories of goods or supplies for which a tax invoice shall be issued, and
      the time and manner for such issuance as may be prescribed.
    order: LOW
    rule: F_JURISDICTION_LAW_IS_IN_FORCE = TRUE
  A_M_GPTSTIC_02:
    statement: The Government's power to specify is exercised on the recommendations of the Council.
    order: LOW
    rule: F_JURISDICTION_LAW_IS_IN_FORCE = TRUE
  A_M_GPTSTIC_03:
    statement: The Government's power to specify is exercised by notification.
    order: LOW
    rule: F_JURISDICTION_LAW_IS_IN_FORCE = TRUE
  A_ICPOD_POSSESS_TAX_INVOICE:
    statement: The person is in possession of a tax invoice issued by a supplier registered under this Act.
    order: LOW
    rule: F_ITC_DOCUMENT_TYPE = 'TAX_INVOICE' AND F_SUPPLIER_IS_REGISTERED = TRUE
  A_1:
    statement: The person is a registered person.
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_2:
    statement: The revised invoice is issued within one month from the date of issuance of the certificate of registration.
    order: HIGH
    interpretation: Was the revised invoice issued within one month from the date the registration certificate was issued?
    grounding:
    - F_REVISED_INVOICE_ISSUE_DATE
    - F_REGISTRATION_CERTIFICATE_ISSUE_DATE
  A_3:
    statement: The revised invoice is issued in the manner prescribed.
    order: HIGH
    interpretation: Was the revised invoice issued in the manner prescribed by the relevant Rules (e.g., CGST Rule 53)?
    grounding:
    - F_REVISED_INVOICE_MANNER_PRESCRIBED_FOLLOWED
  A_4:
    statement: The revised invoice is issued against an invoice already issued during the period beginning with the effective
      date of registration and ending with the date of issuance of the certificate of registration.
    order: HIGH
    interpretation: Was the original invoice issued in the period from the effective registration date up to the certificate
      issue date?
    grounding:
    - F_ORIGINAL_INVOICE_ISSUE_DATE
    - F_REGISTRATION_EFFECTIVE_DATE
    - F_REGISTRATION_CERTIFICATE_ISSUE_DATE
  A_M_NTIBTH_1:
    statement: The person making the supply is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_NTIBTH_2:
    statement: The value of the goods or services or both supplied is less than two hundred rupees
    order: LOW
    rule: F_SUPPLY_VALUE < 200
  A_M_NTIBTH_3:
    statement: The option to not issue a tax invoice is exercised subject to such conditions and in such manner as may be
      prescribed
    order: HIGH
    interpretation: Are the conditions and manner prescribed in the Rules for not issuing a tax invoice for a low-value supply
      followed?
    grounding:
    - F_LOW_VALUE_INVOICE_RULES_FOLLOWED
  A_BOS_ISSUED_INSTEAD_OF_TI:
    statement: A bill of supply is issued for the supply, instead of a tax invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'BILL_OF_SUPPLY' AND F_TAX_INVOICE_IS_ISSUED = FALSE
  A_REGISTERED_SUPPLIER:
    statement: The person making the supply is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_RVFNS_5:
    statement: No tax invoice was issued in pursuance of the intended supply.
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = FALSE
  A_SUPPLIER_IS_REGISTERED:
    statement: The person who received the payment is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_ADVANCE_PAYMENT_RECEIVED:
    statement: An advance payment is received
    order: LOW
    rule: F_PAYMENT_IS_ADVANCE = TRUE
  A_PAYMENT_FOR_SUPPLY:
    statement: The advance payment is with respect to any supply of goods or services or both
    order: LOW
    rule: F_PAYMENT_RELATES_TO_SUPPLY = TRUE
  A_RECEIPT_VOUCHER_ISSUED:
    statement: A receipt voucher is issued
    order: LOW
    rule: F_DOCUMENT_TYPE = 'RECEIPT_VOUCHER'
  A_OTHER_DOCUMENT_ISSUED:
    statement: Any other document evidencing receipt of payment is issued
    order: LOW
    rule: F_DOCUMENT_TYPE = 'OTHER_LIKE_DOCUMENT'
  A_DOCUMENT_HAS_PARTICULARS:
    statement: The issued document contains such particulars as may be prescribed
    order: HIGH
    interpretation: Does the issued document (receipt voucher or other) contain all particulars prescribed in the relevant
      CGST Rules for such a document?
    grounding:
    - F_DOCUMENT_HAS_PRESCRIBED_PARTICULARS
    - F_TRANSACTION_DETAILS
  A_DOCUMENT_EVIDENCES_PAYMENT:
    statement: The issued document evidences receipt of the payment
    order: LOW
    rule: F_DOCUMENT_EVIDENCES_PAYMENT = TRUE
  A_M_IFCSDDA_CONTINUOUS_SERVICE:
    statement: The supply is a case of continuous supply of services
    order: HIGH
    interpretation: Does the supply qualify as a 'continuous supply of services' as defined in the GST Act?
    grounding:
    - F_SUPPLY_IS_CONTINUOUS_SERVICE
  A_M_IFCSDDA_ASCERTAINABLE_DUE_DATE:
    statement: The due date of payment is ascertainable from the contract
    order: LOW
    rule: F_PAYMENT_DUE_DATE_ASCERTAINABLE = TRUE
  A_M_IFCSDDA_TIMELINE_MET:
    statement: The invoice is issued on or before the due date of payment
    order: LOW
    rule: F_INVOICE_ISSUED_BY_DUE_DATE = TRUE
  A_DUE_DATE_NOT_ASCERTAINABLE:
    statement: The due date of payment is not ascertainable from the contract.
    order: LOW
    rule: F_PAYMENT_DUE_DATE_ASCERTAINABLE = FALSE
  A_COMPLIANCE:
    statement: The invoice is issued before or at the time when the supplier of service receives the payment.
    order: LOW
    rule: F_INVOICE_ISSUED_BY_PAYMENT_DATE = TRUE
  A_IS_CSS:
    statement: The supply is a case of continuous supply of services
    order: HIGH
    interpretation: Does the supply qualify as a 'continuous supply of services' as defined in the GST Act?
    grounding:
    - F_SUPPLY_IS_CONTINUOUS_SERVICE
  A_PAYMENT_LINKED_EVENT:
    statement: The payment for the supply is linked to the completion of an event.
    order: LOW
    rule: F_PAYMENT_LINKED_TO_EVENT_COMPLETION = TRUE
  A_DEADLINE_MET:
    statement: The invoice is issued on or before the date of completion of the event.
    order: LOW
    rule: F_INVOICE_ISSUED_BY_EVENT_DEADLINE = TRUE
  A_CONTINUOUS_SERVICE:
    statement: The supply is a case of continuous supply of services
    order: HIGH
    interpretation: Does the supply qualify as a 'continuous supply of services' as defined in the GST Act?
    grounding:
    - F_SUPPLY_IS_CONTINUOUS_SERVICE
  A_CONSIDERATION_SUPPLY:
    statement: The supply is made for a consideration.
    order: LOW
    rule: F_SUPPLY_HAS_CONSIDERATION = TRUE
  A_LIABLE_PERSON:
    statement: The person is liable to pay tax for such supply.
    order: HIGH
    interpretation: On the transaction details, is the person being tested (supplier, or recipient where tax is payable on
      reverse charge) the person liable to pay tax for this supply under the GST law?
    grounding:
    - F_TRANSACTION_DETAILS
  A_DOCUMENT_SCOPE:
    statement: The document is one of the documents relating to assessment, a tax invoice, or other like documents.
    order: HIGH
    interpretation: Is this document a document relating to assessment, a tax invoice, or another document like them?
    grounding:
    - F_DOCUMENT_TYPE
  A_PROMINENT_INDICATION:
    statement: Notwithstanding anything contained in this Act or any other law for the time being in force, the person shall
      prominently indicate the amount of tax in the document.
    order: LOW
    rule: F_DOCUMENT_TAX_AMOUNT_IS_PROMINENT = TRUE
  A_PRICE_TAX_PART:
    statement: The amount of tax indicated shall form part of the price at which such supply is made.
    order: LOW
    rule: F_DOCUMENT_PRICE_INCLUDES_TAX = TRUE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_APPLICABILITY:
    name: Applicability Conditions
    logic: ALL
    members:
    - A_APPROVAL_SALE
    - A_REMOVAL_BEFORE_SUPPLY
  G_TIIRI_CONDITIONS:
    name: Conditions for a revised invoice to be treated as a tax invoice
    logic: ALL
    members:
    - A_TIIRI_1
    - A_TIIRI_2
    - A_TIIRI_3
  G_IFCOSS_CONDITIONS:
    name: Applicability Conditions for S31(6)
    logic: ALL
    members:
    - A_IFCOSS_IS_SERVICE
    - A_IFCOSS_IS_CONTRACTUAL
    - A_IFCOSS_CEASED_EARLY
    description: The rule applies if a supply of services under a contract ceases before completion.
  G_IFCOSS_OBLIGATIONS:
    name: Invoicing Obligations under S31(6)
    logic: ALL
    members:
    - A_IFCOSS_TIMING_OBLIGATION
    - A_IFCOSS_EXTENT_OBLIGATION
    description: The invoice must be issued at the time of cessation and for the value of the supply made before cessation.
  G_S31_4_APPLICABLE:
    name: Applicability Condition
    logic: ALL
    members:
    - A_S31_4_IS_CSG
    - G_S31_4_HAS_SUCCESSIVE_EVENTS
    description: The rule applies if the transaction is a continuous supply of goods and involves either successive statements
      of accounts or successive payments.
  G_S31_4_HAS_SUCCESSIVE_EVENTS:
    name: Successive Events
    logic: ANY
    members:
    - A_S31_4_HAS_STATEMENTS
    - A_S31_4_HAS_PAYMENTS
    description: The supply involves successive statements of accounts or successive payments.
  G_PTPDPF:
    name: Scope of Power under S31A(1)
    logic: ALL
    members:
    - A_PTPDPF_01
    - A_PTPDPF_02
    - A_PTPDPF_03
    - A_PTPDPF_04
    description: All components together define the power granted to the Government.
  G_RPTITI_PRE:
    name: Preconditions
    logic: ALL
    members:
    - A_RPTITI_01
    - A_RPTITI_02
  G_RPTITI_FUL:
    name: Fulfillment
    logic: ALL
    members:
    - A_RPTITI_03
    - A_RPTITI_04
    - G_RPTITI_CON
  G_RPTITI_CON:
    name: Invoice Content
    logic: ALL
    members:
    - A_RPTITI_05
    - A_RPTITI_06
    - A_RPTITI_07
    - A_RPTITI_08
  G_M_GMSSCFI:
    name: Components of the Government's power to specify invoice rules
    logic: ALL
    members:
    - A_GOVT_POWER_TO_SPECIFY
    - A_CONDITION_COUNCIL_RECOMMENDATION
    - A_CONDITION_BY_NOTIFICATION
    - A_POWER_TO_PRESCRIBE_TIME
    - A_POWER_TO_PRESCRIBE_MANNER
    description: The power comprises the ability to specify categories and rules, subject to procedural conditions.
  G_PRECONDITIONS:
    name: Preconditions
    logic: ALL
    members:
    - A_PRE_SUPPLIER_REGISTERED
    - A_PRE_TAXABLE_GOODS
    - A_PRE_GOODS_MOVEMENT
    description: The conditions that trigger the obligation to issue a tax invoice under this rule.
  G_COMPLIANCE:
    name: Compliance Requirements
    logic: ALL
    members:
    - A_CMP_INVOICE_ISSUED
    - A_CMP_INVOICE_TIMING
    - G_INVOICE_CONTENTS
    description: The requirements for fulfilling the obligation, including issuance, timing, and content of the invoice.
  G_INVOICE_CONTENTS:
    name: Invoice Contents
    logic: ALL
    members:
    - A_CNT_DESCRIPTION
    - A_CNT_QUANTITY
    - A_CNT_VALUE
    - A_CNT_TAX
    - A_CNT_PRESCRIBED_PARTICULARS
    description: The details that must be shown on the tax invoice.
  G_ITFGNM_APPLICABILITY:
    name: Applicability Conditions
    logic: ALL
    members:
    - A_ITFGNM_01
    - A_ITFGNM_02
    - A_ITFGNM_03
    description: The obligation applies to a registered person supplying taxable goods in a case not involving movement of
      goods.
  G_ITFGNM_OBLIGATION:
    name: Obligation Requirements
    logic: ALL
    members:
    - A_ITFGNM_04
    - G_ITFGNM_TIMING
    - G_ITFGNM_CONTENT
    description: The obligation requires issuing a compliant invoice within the specified time.
  G_ITFGNM_TIMING:
    name: Invoice Timing
    logic: ANY
    members:
    - A_ITFGNM_05
    - A_ITFGNM_06
    description: The invoice must be issued before or at the time of delivery OR making the goods available.
  G_ITFGNM_CONTENT:
    name: Invoice Content
    logic: ALL
    members:
    - A_ITFGNM_07
    - A_ITFGNM_08
    - A_ITFGNM_09
    - A_ITFGNM_10
    - A_ITFGNM_11
    description: The invoice must show all prescribed particulars.
  G_M_GPTSTIC_01:
    name: Conditions for Government's power to specify invoice rules
    logic: ALL
    members:
    - A_M_GPTSTIC_01
    - A_M_GPTSTIC_02
    - A_M_GPTSTIC_03
    description: The power is defined by its scope and the conditions for its exercise.
  G_1:
    name: Conditions for issuing a revised invoice
    logic: ALL
    members:
    - A_1
    - A_2
    - A_3
    - A_4
  G_M_NTIBTH:
    name: Conditions for not issuing a tax invoice for low-value supply
    logic: ALL
    members:
    - A_M_NTIBTH_1
    - A_M_NTIBTH_2
    - A_M_NTIBTH_3
  G_CONDITIONS:
    name: Trigger Conditions
    logic: ALL
    members:
    - A_SUPPLIER_IS_REGISTERED
    - A_ADVANCE_PAYMENT_RECEIVED
    - A_PAYMENT_FOR_SUPPLY
    description: These are the conditions that trigger the obligation to issue a receipt voucher.
  G_FULFILLMENT:
    name: Fulfillment Actions
    logic: ALL
    members:
    - G_DOCUMENT_ISSUED
    - A_DOCUMENT_HAS_PARTICULARS
    - A_DOCUMENT_EVIDENCES_PAYMENT
    description: These are the actions required to fulfill the obligation once triggered.
  G_DOCUMENT_ISSUED:
    name: Document Issued
    logic: ANY
    members:
    - A_RECEIPT_VOUCHER_ISSUED
    - A_OTHER_DOCUMENT_ISSUED
    description: A receipt voucher or another equivalent document must be issued.
  G_M_IFCSDDA_CONDITIONS:
    name: Preconditions for applying Section 31(5)(a)
    logic: ALL
    members:
    - PD_RVFAP
    - A_M_IFCSDDA_CONTINUOUS_SERVICE
    - A_M_IFCSDDA_ASCERTAINABLE_DUE_DATE
    description: All conditions must be met for this specific invoice timing rule to apply.
  G_APPLICABILITY_IFCSDDNA:
    name: Applicability Conditions
    logic: ALL
    members:
    - A_IS_CSS
    - A_DUE_DATE_NOT_ASCERTAINABLE
    - PD_RVFAP
  G_APPLICABILITY_IFCSPLTE:
    name: Applicability Conditions
    logic: ALL
    members:
    - A_CONTINUOUS_SERVICE
    - A_PAYMENT_LINKED_EVENT
    - PD_RVFAP
    description: The conditions for this specific invoicing rule to apply.
  G_APPLIES:
    name: Obligation applies to the person and document
    logic: ALL
    members:
    - A_CONSIDERATION_SUPPLY
    - A_LIABLE_PERSON
    - A_DOCUMENT_SCOPE
    description: Supply for consideration AND person liable to pay tax for the supply AND document within the stated scope
  G_INDICATION:
    name: Tax indicated prominently as part of price
    logic: ALL
    members:
    - A_PROMINENT_INDICATION
    - A_PRICE_TAX_PART
    description: The tax amount is prominently indicated AND forms part of the price at which the supply is made
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_M_IFGOA:
    outcome: INVOICE_TIMELY_S31_7
    expr: G_APPLICABILITY AND A_INVOICE_TIMELY
    module: M_IFGOA
  LE_TIIRI:
    outcome: TAX_INVOICE_INCLUDES_REVISED_INVOICE
    expr: G_TIIRI_CONDITIONS
    module: M_TIIRI
    description: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised
      invoice issued by the supplier for a supply made earlier.
  LE_IFCOSS:
    outcome: COMPLIANT_WITH_S31_6
    expr: (NOT G_IFCOSS_CONDITIONS) OR G_IFCOSS_OBLIGATIONS
    module: M_IFCOSS
    description: Compliance with Section 31(6) is achieved if the applicability conditions are not met, or if the conditions
      are met and the invoicing obligations are fulfilled.
  LE_S31_4_COMPLIANT:
    outcome: INVOICE_TIMELINE_COMPLIANT
    expr: NOT G_S31_4_APPLICABLE OR ((NOT A_S31_4_HAS_STATEMENTS OR A_S31_4_MEETS_STATEMENT_DEADLINE) AND (NOT A_S31_4_HAS_PAYMENTS
      OR A_S31_4_MEETS_PAYMENT_DEADLINE))
    module: M_IFCSOG
    description: The invoice is issued in compliance with the timelines specified in Section 31(4).
  LE_PTPDPF:
    outcome: POWER_DEFINED
    expr: G_PTPDPF
    module: M_PTPDPF
    description: Describes the scope of the Government's power to mandate electronic payment facilities.
  LE_RPTITI:
    outcome: OBLIGATION_FULFILLED
    expr: G_RPTITI_PRE AND G_RPTITI_FUL
    module: M_RPTITI
  LE_M_GMSSCFI:
    outcome: POWER_EXISTS
    expr: G_M_GMSSCFI
    module: M_GMSSCFI
    description: The Government has the power to specify categories of services or supplies for which special invoicing rules
      apply.
  LE_M_ODDTI:
    outcome: DOCUMENT_DEEMED_TAX_INVOICE
    expr: A_M_ODDTI_1 AND A_M_ODDTI_2 AND A_M_ODDTI_3
    module: M_ODDTI
    description: If all conditions are met, the document is deemed to be a tax invoice.
  LE_M_TIMNBI:
    outcome: PERMISSION_TO_NOT_ISSUE_INVOICE_APPLIES
    expr: A_M_TIMNBI_1
    module: M_TIMNBI
    description: The permission to not issue a tax invoice applies if the service is covered by a specific government notification.
  LE_OBLIGATION_MET:
    outcome: OBLIGATION_MET
    expr: (NOT G_PRECONDITIONS) OR G_COMPLIANCE
    module: M_ITFGWM
    description: The obligation to issue a tax invoice under this provision is met if the preconditions do not apply, or if
      they do, the compliance requirements are fulfilled.
  LE_ITFGNM:
    outcome: OBLIGATION_MET
    expr: G_ITFGNM_APPLICABILITY AND G_ITFGNM_OBLIGATION
    module: M_ITFGNM
    description: The obligation to issue a tax invoice is met if the applicability conditions and the obligation requirements
      are both fulfilled.
  LE_M_GPTSTIC:
    outcome: POWER_DEFINED
    expr: G_M_GPTSTIC_01
    module: M_GPTSTIC
    description: This provision defines the Government's power to specify tax invoice requirements for certain supplies.
  LE_ICPOD_POSSESS_TAX_INVOICE:
    outcome: ICPOD_POSSESS_TAX_INVOICE
    expr: A_ICPOD_POSSESS_TAX_INVOICE
    module: M_ICPOD
    description: The person is in possession of a tax invoice issued by a supplier registered under this Act. (Section 16(2),
      part of the law)
  LE_1:
    outcome: REVISED_INVOICE_MAY_BE_ISSUED
    expr: G_1
    module: M_RIAR
  LE_M_NTIBTH:
    outcome: TAX_INVOICE_NOT_MANDATORY
    expr: G_M_NTIBTH
    module: M_NTIBTH
    description: The option to not issue a tax invoice is available if all conditions are met.
  LE_BOS_ISSUED_INSTEAD_OF_TI:
    outcome: BOS_ISSUED_INSTEAD_OF_TI
    expr: A_BOS_ISSUED_INSTEAD_OF_TI
    module: M_BOSFEOC
    description: A bill of supply is issued for the supply, instead of a tax invoice. (Section 31(3), part of the law)
  LE_REGISTERED_SUPPLIER:
    outcome: REGISTERED_SUPPLIER
    expr: A_REGISTERED_SUPPLIER
    module: M_BOSFEOC
    description: The person making the supply is a registered person (Section 31(3), part of the law)
  LE_RVFNS_5:
    outcome: RVFNS_5
    expr: A_RVFNS_5
    module: M_RVFNS
    description: No tax invoice was issued in pursuance of the intended supply. (Section 31(3), part of the law)
  LE_RVFAP:
    outcome: COMPLIANCE_WITH_S31_3_D
    expr: (NOT G_CONDITIONS) OR G_FULFILLMENT
    module: M_RVFAP
    description: Compliance is met if the conditions for the obligation are not triggered, or if they are triggered and the
      obligation is fulfilled.
  LE_M_IFCSDDA_TIMELY:
    outcome: INVOICE_TIMELY_S31_5_a
    expr: G_M_IFCSDDA_CONDITIONS AND A_M_IFCSDDA_TIMELINE_MET
    module: M_IFCSDDA
    description: The invoice is considered timely under this provision if all preconditions are met and the invoice is issued
      by the due date of payment.
  LE_IFCSDDNA:
    outcome: INVOICE_TIMING_COMPLIANT
    expr: (NOT G_APPLICABILITY_IFCSDDNA) OR A_COMPLIANCE
    module: M_IFCSDDNA
  LE_IFCSPLTE:
    outcome: INVOICE_TIMELINE_COMPLIANT
    expr: (NOT G_APPLICABILITY_IFCSPLTE) OR A_DEADLINE_MET
    module: M_IFCSPLTE
    description: The invoice is compliant with this timeline rule if the rule does not apply, or if the rule applies and the
      deadline was met.
  LE_OBLIGATION_APPLIES:
    outcome: TAX_INDICATION_OBLIGATION_APPLIES
    expr: G_APPLIES
    module: M_TAIID
    description: The section 33 obligation applies to a document when the supply is made for a consideration, the person is
      liable to pay tax for that supply and the document is an assessment, tax invoice or other like document
  LE_OBLIGATION_MET_TAIID:
    outcome: TAX_INDICATION_OBLIGATION_MET
    expr: G_APPLIES AND G_INDICATION
    module: M_TAIID
    description: The obligation applies and the tax amount is prominently indicated in the document as part of the price of
      the supply
