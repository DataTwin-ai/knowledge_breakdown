# GOVERNANCE MASTER TSG09_06 Time limit (TG09 Input Tax Credit)
# LAW ARC - 14 laws - status NEEDS_REVIEW
name: TSG09_06 Time limit - GOVERNANCE MASTER rulebook
version: TSG09_06
facts:
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_NATURE:
    name: Nature of the supply as goods, services or both
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SUPPLY_RECIPIENT_IS_CREDIT_TAKER:
    name: Supply was made to the person taking the credit
    type: BOOLEAN
    tier: T1
  F_ITC_TAKEN_AFTER_ONE_YEAR_FROM_INVOICE:
    name: Input tax credit is taken after the expiry of one year from the date of issue of the tax invoice
    type: BOOLEAN
    tier: T1
  F_ITC_TAKING_DATE:
    name: Date on which the input tax credit is taken
    type: DATE
    tier: T0
  F_RETURN_S39_DUE_DATE_SEP18:
    name: Due date of S39 return for Sep 2018
    type: DATE
    tier: T1
  F_RETURN_S39_DUE_DATE_MAR19:
    name: Due date of S39 return for Mar 2019
    type: DATE
    tier: T1
  F_DOCUMENT_NATURE:
    name: Nature of document for ITC claim
    type: CODE
    options:
    - INVOICE
    - INVOICE_RELATING_TO_DEBIT_NOTE
    - OTHER
    tier: T0
  F_SUPPLY_DATE:
    name: Date of supply
    type: DATE
    tier: T1
  F_SUPPLIER_UPLOADED_S37_1:
    name: Supplier uploaded document details under S37(1)
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_UPLOAD_DATE_S37_1:
    name: Supplier upload date for S37(1) details
    type: DATE
    tier: T1
  F_RETURN_S37_1_DUE_DATE_MAR19:
    name: Due date of S37(1) details for Mar 2019
    type: DATE
    tier: T1
  F_ITC_DOCUMENT_TYPE:
    name: Type of document possessed for ITC claim
    type: CODE
    options:
    - DEBIT_NOTE
    - NONE
    - PRESCRIBED_DOCUMENT
    - TAX_INVOICE
    tier: T0
  F_ITC_AFTER_SEP_DUE_DATE:
    name: ITC taking date is later than the section 39 September return due date
    type: BOOLEAN
    tier: T0
  F_ITC_AFTER_ANNUAL_RETURN:
    name: ITC taking date is later than the furnishing date of the relevant annual return
    type: BOOLEAN
    tier: T0
  F_PRESCRIBED_CONDITIONS_MET_S18_1A:
    name: Conditions and restrictions prescribed for section 18(1)(a) are met
    type: BOOLEAN
    tier: T1
  F_PERSON_REGISTRATION_TIMELINESS_DAYS:
    name: Days between liability to register and application for registration
    type: AMOUNT
    tier: T1
  F_PERSON_REGISTRATION_GRANTED:
    name: Registration has been granted to the person
    type: BOOLEAN
    tier: T1
  F_ITC_ON_INPUTS_IN_STOCK:
    name: Credit of input tax in respect of inputs held in stock
    type: AMOUNT
    tier: T0
  F_ITC_ON_INPUTS_IN_SFG:
    name: Credit of input tax in respect of inputs contained in semi-finished goods held in stock
    type: AMOUNT
    tier: T1
  F_ITC_ON_INPUTS_IN_FG:
    name: Credit of input tax in respect of inputs contained in finished goods held in stock
    type: AMOUNT
    tier: T1
  F_STOCK_DATE_IS_PREVIOUS_DAY:
    name: Stock reckoning date is the day immediately preceding the date of liability to pay tax
    type: BOOLEAN
    tier: T1
  F_ITC_S18_PRESCRIBED_CONDITIONS_MET:
    name: Conditions and restrictions prescribed for taking credit under Section 18 are met
    type: BOOLEAN
    tier: T1
  F_PERSON_REGISTRATION_BASIS:
    name: Basis for the person's GST registration
    type: CODE
    options:
    - VOLUNTARY_S25_3
    - OTHER
    tier: T1
  F_STOCK_HELD_PRE_REG_DATE:
    name: Stock was held on the day immediately preceding the date of grant of registration
    type: BOOLEAN
    tier: T0
  F_PERSON_CEASES_S10_PAYMENT:
    name: Person ceases to pay tax under the composition scheme (section 10)
    type: BOOLEAN
    tier: T1
  F_PERSON_BECOMES_LIABLE_S9:
    name: Person becomes liable to pay tax under the regular scheme (section 9)
    type: BOOLEAN
    tier: T0
  F_ITC_STOCK_VALUATION_DATE:
    name: Date on which the stock and capital goods are held for the purpose of the ITC claim under Section 18(1)(c)
    type: DATE
    tier: T1
  F_LIABILITY_START_DATE_S9:
    name: Date from which the person becomes liable to pay tax under section 9
    type: DATE
    tier: T0
  F_PRESCRIBED_CONDITIONS_S18_1_C_MET:
    name: Prescribed conditions and restrictions for claiming credit under Section 18(1)(c) are met
    type: BOOLEAN
    tier: T1
  F_ITC_CLAIMED_ON_INPUTS_STOCK:
    name: Is credit being claimed on inputs held in stock?
    type: BOOLEAN
    tier: T1
  F_ITC_CLAIMED_ON_INPUTS_WIP_FG:
    name: Is credit being claimed on inputs in semi-finished or finished goods?
    type: BOOLEAN
    tier: T1
  F_ITC_CLAIMED_ON_CAPITAL_GOODS:
    name: Is credit being claimed on capital goods?
    type: BOOLEAN
    tier: T1
  F_ITC_ON_CAPITAL_GOODS:
    name: Input tax credit is on capital goods
    type: BOOLEAN
    tier: T0
  F_CAPITAL_GOODS_CREDIT_REDUCTION_POINTS_PRESCRIBED:
    name: Percentage points of reduction prescribed for credit on capital goods
    type: AMOUNT
    tier: T1
  F_SUPPLY_STATUS_CHANGED_EXEMPT_TO_TAXABLE:
    name: An exempt supply by the registered person became a taxable supply
    type: BOOLEAN
    tier: T0
  F_ITC_PRESCRIBED_CONDITIONS_MET_S18_1_D:
    name: Conditions and restrictions prescribed for Section 18(1)(d) are met
    type: BOOLEAN
    tier: T1
  F_ITC_INPUTS_IN_STOCK_HELD:
    name: Person has inputs held in stock relatable to the exempt supply on the day preceding the change to taxable
    type: BOOLEAN
    tier: T0
  F_ITC_INPUTS_IN_WIP_FG_HELD:
    name: Person has inputs in semi-finished or finished goods relatable to the exempt supply on the day preceding the change
      to taxable
    type: BOOLEAN
    tier: T0
  F_ITC_CAPITAL_GOODS_HELD:
    name: Person has capital goods used exclusively for the exempt supply on the day preceding the change to taxable
    type: BOOLEAN
    tier: T0
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_DOCUMENT_TYPE:
    name: Type of document
    type: CODE
    options:
    - ASSESSMENT_DOCUMENT
    - BILL_OF_SUPPLY
    - CREDIT_NOTE
    - DEBIT_NOTE
    - DELIVERY_CHALLAN
    - OTHER
    - OTHER_LIKE_DOCUMENT
    - PAYMENT_VOUCHER
    - RECEIPT_VOUCHER
    - REFUND_VOUCHER
    - REVISED_INVOICE
    - SELF_INVOICE
    - SUPPLEMENTARY_INVOICE
    - TAX_INVOICE
    tier: T1
  F_DOCUMENT_ISSUER_ROLE:
    name: Role of the entity that issued the document
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - AGENT
    - OTHER
    tier: T1
  F_TAX_INVOICE_ISSUE_DATE:
    name: Date of issue of the tax invoice relating to the supply
    type: DATE
    tier: T1
  F_ORIGINAL_SUPPLY_DATE:
    name: Date of the earlier supply
    type: DATE
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_1:
    statement: The person taking the credit is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_2:
    statement: The input tax credit is taken after the due date of furnishing of the return under section 39 for the month
      of September, 2018
    order: HIGH
    interpretation: The date in F_ITC_TAKING_DATE must be after the date in F_RETURN_S39_DUE_DATE_SEP18.
    grounding:
    - F_ITC_TAKING_DATE
    - F_RETURN_S39_DUE_DATE_SEP18
  A_3:
    statement: The input tax credit is taken on or before the due date of furnishing of the return under section 39 for the
      month of March, 2019
    order: HIGH
    interpretation: The date in F_ITC_TAKING_DATE must be on or before the date in F_RETURN_S39_DUE_DATE_MAR19.
    grounding:
    - F_ITC_TAKING_DATE
    - F_RETURN_S39_DUE_DATE_MAR19
  A_4:
    statement: The input tax credit is in respect of an invoice
    order: LOW
    rule: F_DOCUMENT_NATURE = 'INVOICE'
  A_5:
    statement: The input tax credit is in respect of an invoice relating to a debit note
    order: LOW
    rule: F_DOCUMENT_NATURE = 'INVOICE_RELATING_TO_DEBIT_NOTE'
  A_6:
    statement: The supply of goods or services or both was made during the financial year 2017-18
    order: LOW
    rule: F_SUPPLY_DATE >= '2017-07-01' AND F_SUPPLY_DATE <= '2018-03-31'
  A_7:
    statement: The details of the document have been uploaded by the supplier under sub-section (1) of section 37
    order: LOW
    rule: F_SUPPLIER_UPLOADED_S37_1 = TRUE
  A_8:
    statement: The details were uploaded by the supplier on or before the due date for furnishing the details under sub-section
      (1) of section 37 for the month of March, 2019
    order: HIGH
    interpretation: The date in F_SUPPLIER_UPLOAD_DATE_S37_1 must be on or before the date in F_RETURN_S37_1_DUE_DATE_MAR19.
    grounding:
    - F_SUPPLIER_UPLOAD_DATE_S37_1
    - F_RETURN_S37_1_DUE_DATE_MAR19
  A_REGISTERED_PERSON_TLFAI:
    statement: The person taking the input tax credit is a registered person to whom the prohibition (shall not be entitled
      to take input tax credit) is addressed
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_INVOICE_CREDIT:
    statement: The input tax credit is taken in respect of an invoice for supply of goods or services or both
    order: LOW
    rule: F_ITC_DOCUMENT_TYPE = 'TAX_INVOICE'
  A_DEBIT_NOTE_CREDIT:
    statement: The input tax credit is taken in respect of a debit note for supply of goods or services or both
    order: LOW
    rule: F_ITC_DOCUMENT_TYPE = 'DEBIT_NOTE'
  A_AFTER_SEP_RETURN_DUE_DATE:
    statement: The input tax credit is taken after the due date of furnishing of the return under section 39 for the month
      of September following the end of the financial year to which the invoice or debit note pertains, a point after which
      the registered person shall not be entitled to take input tax credit
    order: LOW
    rule: F_ITC_AFTER_SEP_DUE_DATE = TRUE
  A_AFTER_ANNUAL_RETURN_FURNISHED:
    statement: The input tax credit is taken after the furnishing of the relevant annual return, a point after which the registered
      person shall not be entitled to take input tax credit
    order: LOW
    rule: F_ITC_AFTER_ANNUAL_RETURN = TRUE
  A_CFNRP_01:
    statement: The entitlement to credit is subject to such conditions and restrictions as may be prescribed.
    order: HIGH
    interpretation: Are the conditions and restrictions prescribed in the rules for availing credit under Section 18(1)(a)
      satisfied?
    grounding:
    - F_PRESCRIBED_CONDITIONS_MET_S18_1A
  A_CFNRP_02:
    statement: The person applied for registration under the Act within thirty days from the date on which they became liable
      to registration.
    order: LOW
    rule: F_PERSON_REGISTRATION_TIMELINESS_DAYS <= 30
  A_CFNRP_03:
    statement: The person has been granted such registration.
    order: LOW
    rule: F_PERSON_REGISTRATION_GRANTED = TRUE
  A_CFNRP_04:
    statement: The person is taking credit of input tax in respect of inputs held in stock.
    order: LOW
    rule: F_ITC_ON_INPUTS_IN_STOCK > 0
  A_CFNRP_05:
    statement: The person is taking credit of input tax in respect of inputs contained in semi-finished goods held in stock.
    order: LOW
    rule: F_ITC_ON_INPUTS_IN_SFG > 0
  A_CFNRP_06:
    statement: The person is taking credit of input tax in respect of inputs contained in finished goods held in stock.
    order: LOW
    rule: F_ITC_ON_INPUTS_IN_FG > 0
  A_CFNRP_07:
    statement: The stock is held on the day immediately preceding the date from which the person becomes liable to pay tax
      under the Act.
    order: LOW
    rule: F_STOCK_DATE_IS_PREVIOUS_DAY = TRUE
  A_PRESCRIBED_CONDITIONS:
    statement: The entitlement to take credit is subject to such conditions and restrictions as may be prescribed
    order: HIGH
    interpretation: Are the conditions and restrictions prescribed in the Rules for claiming credit under Section 18(1)(b)
      satisfied?
    grounding:
    - F_ITC_S18_PRESCRIBED_CONDITIONS_MET
  A_PERSON_REG_S25_3:
    statement: A person takes registration under sub-section (3) of section 25
    order: LOW
    rule: F_PERSON_REGISTRATION_BASIS = 'VOLUNTARY_S25_3'
  A_STOCK_HELD_PRE_REGISTRATION:
    statement: The stock is held on the day immediately preceding the date of grant of registration
    order: LOW
    rule: F_STOCK_HELD_PRE_REG_DATE = TRUE
  A_INPUTS_IN_STOCK:
    statement: The credit of input tax is taken in respect of inputs held in stock
    order: LOW
    rule: F_ITC_ON_INPUTS_IN_STOCK > 0
  A_INPUTS_IN_SFG:
    statement: The credit of input tax is taken in respect of inputs contained in semi-finished goods held in stock
    order: LOW
    rule: F_ITC_ON_INPUTS_IN_SFG > 0
  A_INPUTS_IN_FG:
    statement: The credit of input tax is taken in respect of inputs contained in finished goods held in stock
    order: LOW
    rule: F_ITC_ON_INPUTS_IN_FG > 0
  A_REGISTERED_PERSON_COEFCL:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_CEASES_COMPOSITION:
    statement: The registered person ceases to pay tax under section 10
    order: LOW
    rule: F_PERSON_CEASES_S10_PAYMENT = TRUE
  A_BECOMES_LIABLE_S9:
    statement: The person becomes liable to pay tax under section 9
    order: LOW
    rule: F_PERSON_BECOMES_LIABLE_S9 = TRUE
  A_TIMING_CONDITION:
    statement: The credit is in respect of items held on the day immediately preceding the date from which the person becomes
      liable to pay tax under section 9
    order: HIGH
    interpretation: Is the stock valuation date for the ITC claim the day immediately preceding the date from which the person
      becomes liable to pay tax under section 9?
    grounding:
    - F_ITC_STOCK_VALUATION_DATE
    - F_LIABILITY_START_DATE_S9
  A_PRESCRIBED_CONDITIONS_COEFCL:
    statement: The entitlement to credit is subject to such conditions and restrictions as may be prescribed
    order: HIGH
    interpretation: Have the conditions and restrictions prescribed in the rules for claiming credit under Section 18(1)(c)
      been met?
    grounding:
    - F_PRESCRIBED_CONDITIONS_S18_1_C_MET
  A_CREDIT_ON_INPUTS_STOCK:
    statement: Credit of input tax is taken in respect of inputs held in stock
    order: LOW
    rule: F_ITC_CLAIMED_ON_INPUTS_STOCK = TRUE
  A_CREDIT_ON_INPUTS_WIP_FG:
    statement: Credit of input tax is taken in respect of inputs contained in semi-finished or finished goods held in stock
    order: LOW
    rule: F_ITC_CLAIMED_ON_INPUTS_WIP_FG = TRUE
  A_CREDIT_ON_CAPITAL_GOODS:
    statement: Credit of input tax is taken on capital goods
    order: LOW
    rule: F_ITC_CLAIMED_ON_CAPITAL_GOODS = TRUE
  A_CWESBT_01:
    statement: An exempt supply of goods or services or both by a registered person becomes a taxable supply
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE AND F_SUPPLY_STATUS_CHANGED_EXEMPT_TO_TAXABLE = TRUE
  A_CWESBT_02:
    statement: The entitlement to take credit is subject to such conditions and restrictions as may be prescribed
    order: HIGH
    interpretation: Are the conditions and restrictions prescribed in the rules for availing credit under Section 18(1)(d)
      satisfied?
    grounding:
    - F_ITC_PRESCRIBED_CONDITIONS_MET_S18_1_D
  A_CWESBT_03:
    statement: The person is entitled to credit on input tax for inputs held in stock relatable to the exempt supply, as on
      the day preceding the date the supply becomes taxable
    order: LOW
    rule: F_ITC_INPUTS_IN_STOCK_HELD = TRUE
  A_CWESBT_04:
    statement: The person is entitled to credit on input tax for inputs in semi-finished or finished goods held in stock relatable
      to the exempt supply, as on the day preceding the date the supply becomes taxable
    order: LOW
    rule: F_ITC_INPUTS_IN_WIP_FG_HELD = TRUE
  A_CWESBT_05:
    statement: The person is entitled to credit on input tax for capital goods exclusively used for the exempt supply, as
      on the day preceding the date the supply becomes taxable
    order: LOW
    rule: F_ITC_CAPITAL_GOODS_HELD = TRUE
  A_CGCROE_CAPITAL:
    statement: The credit is credit on capital goods.
    order: LOW
    rule: F_ITC_ON_CAPITAL_GOODS = TRUE
  A_CGCROE_PRESCRIBED:
    statement: Percentage points by which the credit on capital goods shall be reduced have been prescribed.
    order: LOW
    rule: F_CAPITAL_GOODS_CREDIT_REDUCTION_POINTS_PRESCRIBED IS_SET
  A_M_CGCRBP_1:
    statement: The credit is on capital goods.
    order: LOW
    rule: F_ITC_ON_CAPITAL_GOODS = TRUE
  A_M_CGCRBP_2:
    statement: The percentage points for reduction are prescribed.
    order: LOW
    rule: F_CAPITAL_GOODS_CREDIT_REDUCTION_POINTS_PRESCRIBED IS_SET
  A_REGISTERED_PERSON:
    statement: The person who takes the input tax credit is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_SUPPLY_TO_HIM:
    statement: The credit is in respect of any supply of goods or services or both to the registered person
    order: LOW
    rule: F_SUPPLY_NATURE IN ['GOODS','SERVICES','BOTH'] AND F_SUPPLY_RECIPIENT_IS_CREDIT_TAKER = TRUE
  A_AFTER_ONE_YEAR:
    statement: The input tax credit is taken after the expiry of one year from the date of issue of the tax invoice relating
      to such supply
    order: LOW
    rule: F_ITC_TAKEN_AFTER_ONE_YEAR_FROM_INVOICE = TRUE
  A_TIIRI_1:
    statement: The document is a revised invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'REVISED_INVOICE'
  A_TIIRI_2:
    statement: The revised invoice was issued by the supplier.
    order: LOW
    rule: F_DOCUMENT_ISSUER_ROLE = 'SUPPLIER'
  A_TIIRI_3:
    statement: The revised invoice is in respect of a supply made earlier.
    order: HIGH
    interpretation: Does the date of issue of the revised invoice (F_TAX_INVOICE_ISSUE_DATE) occur after the date of the supply
      it pertains to (F_ORIGINAL_SUPPLY_DATE)?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_ORIGINAL_SUPPLY_DATE
  A_M_DNISI_1:
    statement: The document is a supplementary invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'SUPPLEMENTARY_INVOICE'
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_1:
    name: Document Basis for ITC
    logic: ANY
    members:
    - A_4
    - A_5
  G_DOCUMENT_FORM:
    name: Invoice or debit note
    logic: ANY
    members:
    - A_INVOICE_CREDIT
    - A_DEBIT_NOTE_CREDIT
    description: The ITC is in respect of an invoice or a debit note; either alternative is enough
  G_AFTER_EARLIER_DEADLINE:
    name: After the earlier of the two deadlines
    logic: ANY
    members:
    - A_AFTER_SEP_RETURN_DUE_DATE
    - A_AFTER_ANNUAL_RETURN_FURNISHED
    description: Because the earlier deadline governs, the claim is out of time if it is after the September return due date
      or after the annual return is furnished
  G_CFNRP_PERSON:
    name: Person Conditions
    logic: ALL
    members:
    - A_CFNRP_02
    - A_CFNRP_03
  G_CFNRP_STOCK:
    name: Stock Conditions
    logic: ALL
    members:
    - A_CFNRP_07
    - G_CFNRP_STOCK_TYPE
  G_CFNRP_STOCK_TYPE:
    name: Eligible Stock Type
    logic: ANY
    members:
    - A_CFNRP_04
    - A_CFNRP_05
    - A_CFNRP_06
  G_STOCK_TYPE:
    name: Eligible types of stock for which ITC can be taken
    logic: ANY
    members:
    - A_INPUTS_IN_STOCK
    - A_INPUTS_IN_SFG
    - A_INPUTS_IN_FG
  G_CONDITIONS:
    name: Mandatory conditions for ITC entitlement
    logic: ALL
    members:
    - A_REGISTERED_PERSON_COEFCL
    - A_CEASES_COMPOSITION
    - A_BECOMES_LIABLE_S9
    - A_TIMING_CONDITION
    - A_PRESCRIBED_CONDITIONS_COEFCL
    description: All prerequisite conditions related to the person's status, timing, and procedural compliance must be met.
  G_ELIGIBLE_ITEMS:
    name: Eligible items for which credit can be taken
    logic: ANY
    members:
    - A_CREDIT_ON_INPUTS_STOCK
    - A_CREDIT_ON_INPUTS_WIP_FG
    - A_CREDIT_ON_CAPITAL_GOODS
    description: Credit must be claimed for at least one of the eligible categories of stock or capital goods.
  G_CWESBT_01:
    name: Eligible Credit Items
    logic: ANY
    members:
    - A_CWESBT_03
    - A_CWESBT_04
    - A_CWESBT_05
  A_CREDIT_UNDER_S18_1:
    name: Any of the referred steps (A_CREDIT_UNDER_S18_1)
    logic: ANY
    members:
    - PD_CFNRP
    - PD_CGCROE_REDUCED
    - PD_CWESBT
    - PD_M_CFRUS25
    - PD_M_CGCRBP
    - PD_M_COEFCL
    description: TRUE when any step of the law this check refers to is TRUE
  G_OYLFC_CONDITIONS:
    name: Conditions of the one-year bar
    logic: ALL
    members:
    - A_REGISTERED_PERSON
    - A_CREDIT_UNDER_S18_1
    - A_SUPPLY_TO_HIM
    - A_AFTER_ONE_YEAR
    description: All four conditions are required together.
  G_TIIRI_CONDITIONS:
    name: Conditions for a revised invoice to be treated as a tax invoice
    logic: ALL
    members:
    - A_TIIRI_1
    - A_TIIRI_2
    - A_TIIRI_3
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_1:
    outcome: ITC_ENTITLEMENT_EXTENDED_FY1718
    expr: A_1 AND A_2 AND A_3 AND G_1 AND A_6 AND A_7 AND A_8
    module: M_ILFF1718
  LE_ITC_TIME_BAR:
    outcome: ITC_NOT_ENTITLED_BY_S16_4_TIME_LIMIT
    expr: A_REGISTERED_PERSON_TLFAI AND G_DOCUMENT_FORM AND G_AFTER_EARLIER_DEADLINE
    module: M_TLFAI
    description: The bar applies when a registered person takes ITC on an invoice or debit note after the earlier deadline.
      Because the earlier deadline governs, being after either deadline is enough.
  LE_CFNRP:
    outcome: ITC_ENTITLED_S18_1_A
    expr: A_CFNRP_01 AND G_CFNRP_PERSON AND G_CFNRP_STOCK
    module: M_CFNRP
  LE_M_CFRUS25:
    outcome: ITC_ENTITLED
    expr: A_PRESCRIBED_CONDITIONS AND A_PERSON_REG_S25_3 AND A_STOCK_HELD_PRE_REGISTRATION AND G_STOCK_TYPE
    module: M_CFRUS25
  LE_M_COEFCL:
    outcome: ITC_ENTITLEMENT_AVAILABLE
    expr: G_CONDITIONS AND G_ELIGIBLE_ITEMS
    module: M_COEFCL
    description: The person is entitled to take credit if all conditions are met and credit is claimed on at least one eligible
      item category.
  LE_CWESBT:
    outcome: ITC_ENTITLED_S18_1_d
    expr: A_CWESBT_01 AND A_CWESBT_02 AND G_CWESBT_01
    module: M_CWESBT
  LE_CGCROE_REDUCED:
    outcome: CAPITAL_GOODS_CREDIT_REDUCED_BY_PRESCRIBED_POINTS
    expr: A_CGCROE_CAPITAL AND A_CGCROE_PRESCRIBED
    module: M_CGCROE
    description: Where the credit is on capital goods and percentage points have been prescribed, the credit shall be reduced
      by those prescribed percentage points.
  LE_M_CGCRBP:
    outcome: REDUCTION_APPLIES
    expr: A_M_CGCRBP_1 AND A_M_CGCRBP_2
    module: M_CGCRBP
    description: The credit on capital goods is reduced by the prescribed percentage points.
  LE_OYLFC_BAR:
    outcome: NOT_ENTITLED_TO_TAKE_ITC_UNDER_S18_1
    expr: G_OYLFC_CONDITIONS
    module: M_OYLFC
    description: The registered person is not entitled to take input tax credit under sub-section (1) when all four conditions
      are met together.
  LE_TIIRI:
    outcome: TAX_INVOICE_INCLUDES_REVISED_INVOICE
    expr: G_TIIRI_CONDITIONS
    module: M_TIIRI
    description: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised
      invoice issued by the supplier for a supply made earlier.
  LE_M_DNISI:
    outcome: DOCUMENT_IS_TREATED_AS_DEBIT_NOTE
    expr: A_M_DNISI_1
    module: M_DNISI
    description: A document is treated as a debit note for the purposes of the Act if it is a supplementary invoice.
products:
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_1:
    statement: ITC_ENTITLEMENT_EXTENDED_FY1718
  PD_ITC_TIME_BAR:
    statement: The bar applies when a registered person takes ITC on an invoice or debit note after the earlier deadline.
      Because the earlier deadline governs, being after either deadline is enough.
  PD_CFNRP:
    statement: ITC_ENTITLED_S18_1_A
  PD_M_CFRUS25:
    statement: ITC_ENTITLED
  PD_M_COEFCL:
    statement: The person is entitled to take credit if all conditions are met and credit is claimed on at least one eligible
      item category.
  PD_CWESBT:
    statement: ITC_ENTITLED_S18_1_d
  PD_CGCROE_REDUCED:
    statement: Where the credit is on capital goods and percentage points have been prescribed, the credit shall be reduced
      by those prescribed percentage points.
  PD_M_CGCRBP:
    statement: The credit on capital goods is reduced by the prescribed percentage points.
  PD_OYLFC_BAR:
    statement: The registered person is not entitled to take input tax credit under sub-section (1) when all four conditions
      are met together.
  PD_TIIRI:
    statement: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised invoice
      issued by the supplier for a supply made earlier.
  PD_M_DNISI:
    statement: A document is treated as a debit note for the purposes of the Act if it is a supplementary invoice.
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_ILFF1718
  question: 'Proviso to Section 16(4): ITC Limit For FY 17-18?'
  includes:
  - LE_1
  produces:
  - product: PD_1
    from:
    - LE_1
- id: C_TLFAI
  question: 'Section 16(4): Time Limit For Availing ITC?'
  includes:
  - LE_ITC_TIME_BAR
  produces:
  - product: PD_ITC_TIME_BAR
    from:
    - LE_ITC_TIME_BAR
- id: C_S18_SS1
  question: 'Section 18(1): which clause applies?'
  includes:
  - LE_CFNRP
  - LE_M_CFRUS25
  - LE_M_COEFCL
  - LE_CWESBT
  produces:
  - product: PD_CFNRP
    from:
    - LE_CFNRP
  - product: PD_M_CFRUS25
    from:
    - LE_M_CFRUS25
  - product: PD_M_COEFCL
    from:
    - LE_M_COEFCL
  - product: PD_CWESBT
    from:
    - LE_CWESBT
- id: C_CGCROE
  question: 'Proviso to Section 18(1)(c): Capital Goods Credit Reduction On Exit?'
  includes:
  - LE_CGCROE_REDUCED
  produces:
  - product: PD_CGCROE_REDUCED
    from:
    - LE_CGCROE_REDUCED
- id: C_CGCRBP
  question: 'Proviso to Section 18(1): Capital Goods Credit Reduced By Percentage?'
  includes:
  - LE_M_CGCRBP
  produces:
  - product: PD_M_CGCRBP
    from:
    - LE_M_CGCRBP
- id: C_OYLFC
  question: 'Section 18(2): One Year Limit For Credit?'
  includes:
  - LE_OYLFC_BAR
  produces:
  - product: PD_OYLFC_BAR
    from:
    - LE_OYLFC_BAR
- id: C_TIIRI
  question: 'Section 31, Explanation 1: Tax Invoice Includes Revised Invoice?'
  includes:
  - LE_TIIRI
  produces:
  - product: PD_TIIRI
    from:
    - LE_TIIRI
- id: C_DNISI
  question: 'Section 34, Explanation: Debit Note Includes Supplementary Invoice?'
  includes:
  - LE_M_DNISI
  produces:
  - product: PD_M_DNISI
    from:
    - LE_M_DNISI
