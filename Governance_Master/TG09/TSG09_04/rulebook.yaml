    statement: The value of the supply shall not include the discount when it is given before or at the time of the supply
      AND it has been duly recorded in the invoice issued in respect of that supply.
  PD_M_VCBDPM:
    statement: The value shall be determined using the prescribed valuation rules.
  PD_M_NSVD:
    statement: If a supply is notified by the government (on council recommendation) and a valuation manner is prescribed,
      then that prescribed manner applies, overriding general valuation rules.
  PD_S18_6_PAYMENT:
    statement: The registered person shall pay the calculated amount under section 18(6) when the trigger conditions are met
      and the amount is correctly determined.
  PD_M_POCGOC:
    statement: The obligation to pay the required amount on capital goods or plant and machinery at the time of cancellation
      is met.
  PD_M_COAPOC:
    statement: CALCULATION_MANNER_PRESCRIBED
