compounds:
- id: C_S20_E1_CA
  question: 'Section 20, Explanation (a): which clause applies?'
  includes:
  - LE_RPLAQ
  - LE_RPPFY
  produces:
  - product: PD_RPLAQ
    from:
    - LE_RPLAQ
  - product: PD_RPPFY
    from:
    - LE_RPPFY
- id: C_S20_E1
  question: 'Section 20, Explanation : which clause applies?'
  includes:
  - LE_MOROC
  - LE_TURNOVER_MEANING
  produces:
  - product: PD_MOROC
    from:
    - LE_MOROC
  - product: PD_TURNOVER_MEANING
    from:
    - LE_TURNOVER_MEANING
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_ATDFS22
  question: 'Section 22, Explanation (i): Aggregate Turnover Definition For Section 22?'
  includes:
  - LE_ATDFS22
  produces:
  - product: PD_ATDFS22
    from:
    - LE_ATDFS22
- id: C_ISDDC
  question: 'Section 20(1): Input Service Distributor Distributes Credit?'
  includes:
  - LE_ISDDC
  produces:
  - product: PD_ISDDC
    from:
    - LE_ISDDC
- id: C_S20_SS2
  question: 'Section 20(2): which clause applies?'
  includes:
  - LE_CDAPD
  - LE_M_DNEAC
  - LE_CATOR_1
  - LE_CATMR
  - LE_CATAR
  produces:
  - product: PD_CDAPD
    from:
    - LE_CDAPD
  - product: PD_M_DNEAC
    from:
    - LE_M_DNEAC
  - product: PD_CATOR_1
    from:
    - LE_CATOR_1
  - product: PD_CATMR
    from:
    - LE_CATMR
  - product: PD_CATAR
    from:
    - LE_CATAR
- id: C_ROEDC
  question: An Input Service Distributor distributes the credit; The contravention results in excess distribution of credit
    to one or more recipients of credit? (Section 21)
  includes:
  - LE_ISD_CREDIT_DISTRIBUTION
  - LE_EXCESS_DISTRIBUTION
  produces:
  - product: PD_ISD_CREDIT_DISTRIBUTION
    from:
    - LE_ISD_CREDIT_DISTRIBUTION
  - product: PD_EXCESS_DISTRIBUTION
    from:
    - LE_EXCESS_DISTRIBUTION
- id: C_ATFCE
  question: 'Section 10(5), Explanation 1: Aggregate Turnover For Composition Eligibility?'
  includes:
  - LE_ATFCE_1
  produces:
