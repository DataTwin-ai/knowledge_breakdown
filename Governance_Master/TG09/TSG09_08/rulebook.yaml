# GOVERNANCE MASTER TSG09_08 ISD (TG09 Input Tax Credit)
# LAW ARC - 22 laws - status NEEDS_REVIEW
name: TSG09_08 ISD - GOVERNANCE MASTER rulebook
version: TSG09_08
facts:
  F_RELEVANT_PERIOD_PURPOSE:
    name: Provision for which the expression relevant period is being applied
    type: CODE
    options:
    - OTHER
    - SECTION_20
    tier: T1
  F_RECIPIENT_PREV_FY_TURNOVER_EXISTS:
    name: Recipients of credit have turnover in their States or Union territories in the financial year preceding the year
      of distribution
    type: BOOLEAN
    tier: T1
  F_PERIOD_RECIPIENTS_TURNOVER_DETAILS_AVAILABLE:
    name: Details of turnover of all the recipients are available for the quarter
    type: BOOLEAN
    tier: T1
  F_PERIOD_BEFORE_DISTRIBUTION_MONTH:
    name: The quarter being tested ends before the month during which the credit is to be distributed begins
    type: BOOLEAN
    tier: T1
  F_PERIOD_LATER_QUALIFYING_QUARTER_EXISTS:
    name: A later quarter before the distribution month exists for which turnover details of all the recipients are available
    type: BOOLEAN
    tier: T1
  F_PERSON_SUPPLY_TYPE:
    name: Kind of supply made by the person
    type: CODE
    options:
    - GOODS
    - SERVICES
    - BOTH
    - NONE
    tier: T0
  F_SUPPLIER_PAN_COMPARISON:
    name: Whether the supplier's PAN is the same as the PAN of the Input Service Distributor
    type: CODE
    options:
    - SAME
    - DIFFERENT
    tier: T0
  F_TURNOVER_DETERMINATION_PURPOSE:
    name: Provision for which the value of turnover is being determined
    type: CODE
    options:
    - ISD_CREDIT_DISTRIBUTION
    - OTHER
    - SECOND_PROVISO_S10_1
    tier: T0
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_PERSON_SUPPLIES_TAXABLE_GOODS:
    name: Person is engaged in the supply of taxable goods
    type: BOOLEAN
    tier: T0
  F_PERSON_SUPPLIES_NON_TAXABLE_GOODS:
    name: Person is engaged in the supply of goods not taxable under this Act
    type: BOOLEAN
    tier: T0
  F_PERSON_TURNOVER_VALUE:
    name: Value of turnover of the registered person
    type: AMOUNT
    tier: T0
  F_TAX_LIST_I_ENTRIES_84_92A_AMOUNT:
    name: Amount of any duty or tax levied under entries 84 and 92A of List I of the Seventh Schedule to the Constitution
    type: AMOUNT
    tier: T0
  F_TAX_LIST_II_ENTRIES_51_54_AMOUNT:
    name: Amount of any duty or tax levied under entries 51 and 54 of List II of the Seventh Schedule to the Constitution
    type: AMOUNT
    tier: T0
  F_PERSON_IS_ISD:
    name: Person distributing the credit is an Input Service Distributor
    type: BOOLEAN
    tier: T0
  F_ITC_SOURCE_TAX_HEAD:
    name: Tax head of the credit that is distributed
    type: CODE
    options:
    - CENTRAL_TAX
    - INTEGRATED_TAX
    - OTHER
    tier: T0
  F_ITC_DISTRIBUTED_TAX_HEAD:
    name: Tax head as which the credit is distributed
    type: CODE
    options:
    - CENTRAL_TAX
    - INTEGRATED_TAX
    - OTHER
    tier: T1
  F_ITC_DISTRIBUTION_DOCUMENT_ISSUED:
    name: A document is issued for distributing the credit
    type: BOOLEAN
    tier: T1
  F_ITC_DISTRIBUTION_DOCUMENT_STATES_AMOUNT:
    name: The distribution document contains the amount of input tax credit being distributed
    type: BOOLEAN
    tier: T1
  F_ITC_DISTRIBUTION_MANNER_COMPLIED:
    name: Credit is distributed in the manner prescribed
    type: BOOLEAN
    tier: T1
  F_ITC_DISTRIBUTEE_IS_RECIPIENT_OF_CREDIT:
    name: Persons to whom the credit is distributed are recipients of credit
    type: BOOLEAN
    tier: T0
  F_ITC_DISTRIBUTION_DOCUMENT_CONTAINS_PRESCRIBED_DETAILS:
    name: The distribution document contains such details as may be prescribed
    type: BOOLEAN
    tier: T1
  F_ISD_DISTRIBUTION_WITHIN_LIMIT:
    name: Distributed credit does not exceed available credit
    type: BOOLEAN
    tier: T1
  F_ITC_ATTRIBUTABLE_RECIPIENT:
    name: The specific recipient to whom the input service credit is attributable
    type: TEXT
    tier: T1
  F_ITC_DISTRIBUTION_RECIPIENTS:
    name: The list of recipients to whom the credit was distributed
    type: TEXT
    tier: T1
  F_ITC_ATTRIBUTABLE_RECIPIENT_COUNT:
    name: Number of recipients to whom the input service credit is attributable
    type: AMOUNT
    tier: T1
  F_ITC_ATTRIBUTABLE_RECIPIENTS:
    name: List of recipients to whom the input service credit is attributable
    type: TEXT
    tier: T1
  F_DISTRIBUTED_CREDIT_PER_RECIPIENT:
    name: Amount of credit distributed to a specific recipient
    type: AMOUNT
    tier: T1
  F_TOTAL_DISTRIBUTABLE_CREDIT:
    name: Total credit on an input service to be distributed
    type: AMOUNT
    tier: T0
  F_RECIPIENT_TURNOVER_RELEVANT_PERIOD:
    name: Turnover of a recipient in a State or Union territory during the relevant period
    type: AMOUNT
    tier: T0
  F_AGGREGATE_TURNOVER_OPERATIONAL_RECIPIENTS:
    name: Aggregate turnover of all attributable and operational recipients during the relevant period
    type: AMOUNT
    tier: T0
  F_RECIPIENT_IS_OPERATIONAL:
    name: Recipient is operational in the current year
    type: BOOLEAN
    tier: T1
  F_RELEVANT_PERIOD:
    name: The relevant period for ISD distribution turnover calculation
    type: TEXT
    tier: T1
  F_ITC_ATTRIBUTION_SCOPE:
    name: Scope of input service credit attribution
    type: CODE
    options:
    - ALL_RECIPIENTS
    - SPECIFIC_RECIPIENTS
    tier: T1
  F_ALL_AGGREGATE_RECIPIENTS_OPERATIONAL:
    name: All recipients included in the aggregate turnover calculation are operational in the current year
    type: BOOLEAN
    tier: T1
  F_ISD_DISTRIBUTED_CREDIT_AMOUNT:
    name: Amount of credit distributed by the Input Service Distributor
    type: AMOUNT
    tier: T1
  F_ISD_EXCESS_CREDIT_DISTRIBUTED_AMOUNT:
    name: Amount of credit distributed in excess by ISD
    type: AMOUNT
    tier: T1
  F_ISD_EXCESS_CREDIT_RECIPIENTS:
    name: Recipients who received the excess distributed credit
    type: TEXT
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_FINANCIAL_YEAR_START_DATE:
    name: Start date of the relevant financial year
    type: DATE
    tier: T1
  F_REGISTRATION_LIABILITY_DATE:
    name: Date person becomes liable for registration
    type: DATE
    tier: T1
  F_SUPPLY_IS_EXEMPT:
    name: Supply is an exempt supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_TYPE:
    name: Type of supply
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SERVICE_NATURE:
    name: Nature of service provided
    type: CODE
    options:
    - ADVANCE_EXTENSION
    - DEPOSIT_EXTENSION
    - LOAN_EXTENSION
    - OTHER
    tier: T1
  F_CONSIDERATION_FORM:
    name: Form of consideration for the supply
    type: CODE
    options:
    - DISCOUNT
    - INTEREST
    - OTHER
    tier: T1
  F_PERSON_IS_TAXABLE:
    name: Person making the supply is a taxable person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_CAPACITY:
    name: Capacity in which the supply is made
    type: CODE
    options:
    - OWN_ACCOUNT
    - AGENT_FOR_PRINCIPAL
    tier: T1
  F_SUPPLIER_LOCATION_STATE_CATEGORY:
    name: Category of state(s) from which supplies are made
    type: CODE
    options:
    - OTHER
    - SPECIAL_CATEGORY_STATE
    tier: T0
    ask: Is the state from which the person makes supplies classified as a Special Category State for GST purposes?
  F_SUPPLIER_AGGREGATE_TURNOVER_FY:
    name: Supplier's aggregate turnover in the financial year
    type: AMOUNT
    tier: T0
    ask: What is the aggregate turnover of the supplier during the financial year?
  F_PERSON_MAKES_TAXABLE_SUPPLIES:
    name: Person makes taxable supplies
    type: BOOLEAN
    tier: T0
    ask: Does the person's business involve making any supplies that are subject to GST?
  F_SUPPLY_NATURE:
    name: Nature of the supply as goods, services or both
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SUPPLY_EXEMPTION_STATUS:
    name: Exemption status of the goods or services or both supplied by the person
    type: CODE
    options:
    - NOT_EXEMPT
    - PARTLY_EXEMPT
    - WHOLLY_EXEMPT
    tier: T1
  F_SERVICE_TYPE_FINANCIAL:
    name: Type of financial service provided
    type: CODE
    options:
    - DEPOSIT
    - LOAN
    - ADVANCE
    - OTHER
    tier: T1
  F_SERVICE_CONSIDERATION_FORM:
    name: Form of consideration for the financial service
    type: CODE
    options:
    - INTEREST
    - DISCOUNT
    - OTHER
    tier: T1
  F_NOTIFICATION_SCS_REQUEST:
    name: Notification for SCS threshold enhancement was preceded by a state request
    type: BOOLEAN
    tier: T1
  F_NOTIFICATION_COUNCIL_RECOMMENDATION:
    name: Specification of the exempted category is made on the recommendations of the Council
    type: BOOLEAN
    tier: T1
  F_NOTIFICATION_IS_ISSUED:
    name: An exemption notification has been issued
    type: BOOLEAN
    tier: T1
  F_NOTIFICATION_ISSUER:
    name: Authority issuing the notification that changes the composition limit
    type: CODE
    options:
    - GOVERNMENT
    - OTHER
    tier: T1
  F_NOTIFIED_SCS_THRESHOLD_AMOUNT:
    name: Notified enhanced aggregate turnover threshold for a special category state
    type: AMOUNT
    tier: T1
  F_SUPPLIER_ENGAGED_EXCLUSIVELY_IN_GOODS:
    name: Supplier is engaged exclusively in the supply of goods
    type: BOOLEAN
    tier: T1
  F_NOTIFIED_ENHANCED_THRESHOLD_AMOUNT:
    name: Notified enhanced aggregate turnover threshold amount
    type: AMOUNT
    tier: T1
predicates:
  A_PURPOSE:
    statement: The expression relevant period is being applied for the purposes of this section
    order: LOW
    rule: F_RELEVANT_PERIOD_PURPOSE = 'SECTION_20'
  A_NOTURN:
    statement: Some or all recipients of the credit do not have any turnover in their States or Union territories in the financial
      year preceding the year during which the credit is to be distributed
    order: LOW
    rule: F_RECIPIENT_PREV_FY_TURNOVER_EXISTS = FALSE
  A_QTR_AVAIL:
    statement: The quarter is one for which details of such turnover of all the recipients are available
    order: LOW
    rule: F_PERIOD_RECIPIENTS_TURNOVER_DETAILS_AVAILABLE = TRUE
  A_QTR_PREV:
    statement: The quarter is previous to the month during which credit is to be distributed
    order: LOW
    rule: F_PERIOD_BEFORE_DISTRIBUTION_MONTH = TRUE
  A_QTR_LAST:
    statement: The quarter is the last quarter (no later quarter previous to the month during which credit is to be distributed
      has details of such turnover of all the recipients available)
    order: LOW
    rule: F_PERIOD_LATER_QUALIFYING_QUARTER_EXISTS = FALSE
  A_RPPFY_SCOPE:
    statement: The expression 'relevant period' is being applied for the purposes of this section
    order: LOW
    rule: F_RELEVANT_PERIOD_PURPOSE = 'SECTION_20'
  A_RPPFY_TURNOVER:
    statement: The recipients of credit have turnover in their States or Union territories in the financial year preceding
      the year during which credit is to be distributed
    order: LOW
    rule: F_RECIPIENT_PREV_FY_TURNOVER_EXISTS = TRUE
  A_SUPPLIER_STATUS:
    statement: The person is a supplier of goods or services or both
    order: LOW
    rule: F_PERSON_SUPPLY_TYPE IN ['GOODS','SERVICES','BOTH']
  A_SAME_PAN:
    statement: The supplier of goods or services or both has the same Permanent Account Number as that of the Input Service
      Distributor
    order: LOW
    rule: F_SUPPLIER_PAN_COMPARISON = 'SAME'
  A_SECTION_PURPOSE:
    statement: The term "turnover" is being applied for the purposes of this section
    order: LOW
    rule: F_TURNOVER_DETERMINATION_PURPOSE = 'ISD_CREDIT_DISTRIBUTION'
  A_REGISTERED_PERSON:
    statement: The term "turnover" is applied in relation to any registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_TAXABLE_GOODS_SUPPLY:
    statement: The registered person is engaged in the supply of taxable goods
    order: LOW
    rule: F_PERSON_SUPPLIES_TAXABLE_GOODS = TRUE
  A_NON_TAXABLE_GOODS_SUPPLY:
    statement: The registered person is engaged, as well as in the supply of taxable goods, in the supply of goods not taxable
      under this Act
    order: HIGH
    interpretation: Are any goods supplied by the person goods not taxable under this Act? The source does not say whether
      exempt or nil-rated goods are included in that expression, so keep the question open and do not resolve it from outside
      law
    grounding:
    - F_PERSON_SUPPLIES_NON_TAXABLE_GOODS
  A_TURNOVER_BASE:
    statement: For the purposes of this section, the term "turnover" in relation to such registered person means the value
      of turnover
    order: LOW
    rule: F_PERSON_TURNOVER_VALUE IS_SET
  A_LIST_I_REDUCTION:
    statement: The value of turnover is reduced by the amount of any duty or tax levied under entries 84 and 92A of List I
      of the Seventh Schedule to the Constitution
    order: LOW
    rule: F_TAX_LIST_I_ENTRIES_84_92A_AMOUNT >= 0
  A_LIST_II_REDUCTION:
    statement: The value of turnover is reduced by the amount of any duty or tax levied under entries 51 and 54 of List II
      of the said Schedule, being the Seventh Schedule to the Constitution
    order: LOW
    rule: F_TAX_LIST_II_ENTRIES_51_54_AMOUNT >= 0
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_TAXABLE_PERSON_S22:
    statement: The supply is made by a taxable person
    order: LOW
    rule: F_PERSON_IS_TAXABLE = TRUE
  A_OWN_ACCOUNT_SUPPLY_S22:
    statement: The supply is made on the person's own account
    order: LOW
    rule: F_SUPPLY_CAPACITY = 'OWN_ACCOUNT'
  A_PRINCIPAL_ACCOUNT_SUPPLY_S22:
    statement: The supply is made on behalf of all the person's principals
    order: LOW
    rule: F_SUPPLY_CAPACITY = 'AGENT_FOR_PRINCIPAL'
  A_ISD:
    statement: The person who distributes the credit is an Input Service Distributor
    order: LOW
    rule: F_PERSON_IS_ISD = TRUE
  A_CT_AS_CT:
    statement: The Input Service Distributor shall distribute the credit of central tax as central tax
    order: LOW
    rule: F_ITC_SOURCE_TAX_HEAD = 'CENTRAL_TAX' AND F_ITC_DISTRIBUTED_TAX_HEAD = 'CENTRAL_TAX'
  A_CT_AS_IT:
    statement: The Input Service Distributor shall distribute the credit of central tax as integrated tax
    order: LOW
    rule: F_ITC_SOURCE_TAX_HEAD = 'CENTRAL_TAX' AND F_ITC_DISTRIBUTED_TAX_HEAD = 'INTEGRATED_TAX'
  A_IT_AS_IT:
    statement: The Input Service Distributor shall distribute the credit of integrated tax as integrated tax
    order: LOW
    rule: F_ITC_SOURCE_TAX_HEAD = 'INTEGRATED_TAX' AND F_ITC_DISTRIBUTED_TAX_HEAD = 'INTEGRATED_TAX'
  A_IT_AS_CT:
    statement: The Input Service Distributor shall distribute the credit of integrated tax as central tax
    order: LOW
    rule: F_ITC_SOURCE_TAX_HEAD = 'INTEGRATED_TAX' AND F_ITC_DISTRIBUTED_TAX_HEAD = 'CENTRAL_TAX'
  A_DOC_ISSUED:
    statement: The Input Service Distributor distributes the credit by way of issue of a document
    order: LOW
    rule: F_ITC_DISTRIBUTION_DOCUMENT_ISSUED = TRUE
  A_DOC_AMOUNT:
    statement: The document issued for the distribution contains the amount of input tax credit being distributed
    order: LOW
    rule: F_ITC_DISTRIBUTION_DOCUMENT_STATES_AMOUNT = TRUE
  A_MANNER:
    statement: The distribution of credit by way of the document is made in such manner as may be prescribed
    order: HIGH
    if_false: the prescribed manner is shown not to have been followed
    interpretation: Whether the distribution and its document follow the manner prescribed under the Act or rules for ISD
      distribution. The manner is not stated in this provision and must be taken from the prescribing instrument
    grounding:
    - F_ITC_DISTRIBUTION_MANNER_COMPLIED
  A_ISD_CDAPD:
    statement: The person distributing the credit is an Input Service Distributor
    order: LOW
    rule: F_PERSON_IS_ISD = TRUE
  A_RECIPIENTS:
    statement: The credit can be distributed to the recipients of credit
    order: HIGH
    interpretation: Are the persons to whom the credit is distributed recipients of credit within the meaning of the Input
      Service Distributor provisions?
    grounding:
    - F_ITC_DISTRIBUTEE_IS_RECIPIENT_OF_CREDIT
  A_DOC_ISSUED_CDAPD:
    statement: The credit can be distributed against a document
    order: LOW
    rule: F_ITC_DISTRIBUTION_DOCUMENT_ISSUED = TRUE
  A_DOC_DETAILS:
    statement: The document against which the credit is distributed contains such details as may be prescribed
    order: HIGH
    interpretation: Does the distribution document contain every detail prescribed for it? The prescribed details are not
      stated in this provision and must be taken from the prescribing rules.
    grounding:
    - F_ITC_DISTRIBUTION_DOCUMENT_CONTAINS_PRESCRIBED_DETAILS
  A_M_DNEAC_01:
    statement: the amount of the credit distributed shall not exceed the amount of credit available for distribution.
    order: LOW
    rule: F_ISD_DISTRIBUTION_WITHIN_LIMIT = TRUE
  A_CATOR_1:
    statement: the credit of tax paid on input services attributable to a recipient of credit shall be distributed only to
      that recipient
    order: HIGH
    interpretation: The atom is TRUE if the list of recipients in F_ITC_DISTRIBUTION_RECIPIENTS is identical to a list containing
      only the single recipient from F_ITC_ATTRIBUTABLE_RECIPIENT. The atom is FALSE if the lists do not match. The atom is
      NOT_APPLICABLE if F_ITC_ATTRIBUTABLE_RECIPIENT is null or empty, as this rule only applies to credit attributable to
      a single recipient.
    grounding:
    - F_ITC_ATTRIBUTABLE_RECIPIENT
    - F_ITC_DISTRIBUTION_RECIPIENTS
  A_CATMR_1:
    statement: The credit of tax paid on input services is attributable to more than one recipient of credit.
    order: LOW
    rule: F_ITC_ATTRIBUTABLE_RECIPIENT_COUNT > 1
  A_CATMR_2:
    statement: The credit shall be distributed amongst such recipients to whom the input service is attributable.
    order: HIGH
    interpretation: Is the set of recipients to whom the credit was distributed identical to the set of recipients to whom
      the input service is attributable?
    grounding:
    - F_ITC_DISTRIBUTION_RECIPIENTS
    - F_ITC_ATTRIBUTABLE_RECIPIENTS
  A_CATMR_3:
    statement: The distribution shall be pro rata on the basis of the turnover in a State or Union territory of such recipient,
      during the relevant period, to the aggregate of the turnover of all such recipients to whom such input service is attributable
      and which are operational in the current year, during the said relevant period.
    order: HIGH
    interpretation: Is the credit distribution to each recipient pro-rata, based on the ratio of their turnover in the relevant
      period to the aggregate turnover of all attributable and operational recipients for the same period?
    grounding:
    - F_DISTRIBUTED_CREDIT_PER_RECIPIENT
    - F_TOTAL_DISTRIBUTABLE_CREDIT
    - F_RECIPIENT_TURNOVER_RELEVANT_PERIOD
    - F_AGGREGATE_TURNOVER_OPERATIONAL_RECIPIENTS
    - F_RECIPIENT_IS_OPERATIONAL
    - F_RELEVANT_PERIOD
  A_CATAR_01:
    statement: The credit of tax paid on input services is attributable to all recipients of credit.
    order: LOW
    rule: F_ITC_ATTRIBUTION_SCOPE = 'ALL_RECIPIENTS'
  A_CATAR_03:
    statement: All recipients included in the aggregate turnover calculation are operational in the current year.
    order: LOW
    rule: F_ALL_AGGREGATE_RECIPIENTS_OPERATIONAL = TRUE
  A_CATAR_02:
    statement: The credit shall be distributed amongst such recipients to whom the input service is attributable.
    order: HIGH
    interpretation: Is the set of recipients to whom the credit was distributed identical to the set of recipients to whom
      the input service is attributable?
    grounding:
    - F_ITC_DISTRIBUTION_RECIPIENTS
    - F_ITC_ATTRIBUTABLE_RECIPIENTS
  A_CATAR_04:
    statement: The distribution shall be pro rata on the basis of the turnover in a State or Union territory of such recipient,
      during the relevant period, to the aggregate of the turnover of all such recipients to whom such input service is attributable
      and which are operational in the current year, during the said relevant period.
    order: HIGH
    interpretation: Is the credit distribution to each recipient pro-rata, based on the ratio of their turnover in the relevant
      period to the aggregate turnover of all attributable and operational recipients for the same period?
    grounding:
    - F_DISTRIBUTED_CREDIT_PER_RECIPIENT
    - F_TOTAL_DISTRIBUTABLE_CREDIT
    - F_RECIPIENT_TURNOVER_RELEVANT_PERIOD
    - F_AGGREGATE_TURNOVER_OPERATIONAL_RECIPIENTS
    - F_RECIPIENT_IS_OPERATIONAL
    - F_RELEVANT_PERIOD
  A_ISD_CREDIT_DISTRIBUTION:
    statement: An Input Service Distributor distributes the credit.
    order: LOW
    rule: F_PERSON_IS_ISD = TRUE AND F_ISD_DISTRIBUTED_CREDIT_AMOUNT > 0
  A_EXCESS_DISTRIBUTION:
    statement: The contravention results in excess distribution of credit to one or more recipients of credit.
    order: LOW
    rule: F_ISD_EXCESS_CREDIT_DISTRIBUTED_AMOUNT > 0 AND F_ISD_EXCESS_CREDIT_RECIPIENTS IS_SET
  A_ATFCE_1:
    statement: For the purpose of determining eligibility to pay tax under this section, the aggregate turnover shall include
      the value of supplies made by the person from the 1st day of April of a financial year up to the date when he becomes
      liable for registration under this Act.
    order: HIGH
    interpretation: Does the calculation of 'aggregate turnover' for composition eligibility include the value of supplies
      from the 1st day of April of the financial year up to the date the person becomes liable for registration?
    grounding:
    - F_FINANCIAL_YEAR_START_DATE
    - F_REGISTRATION_LIABILITY_DATE
  A_ATFCE_2:
    statement: For the purpose of determining eligibility to pay tax under this section, the aggregate turnover shall not
      include the value of an exempt supply of services provided by way of extending deposits, loans or advances where the
      consideration is represented by way of interest or discount.
    order: LOW
    rule: F_SUPPLY_IS_EXEMPT = TRUE AND F_SUPPLY_TYPE = 'SERVICES' AND F_SERVICE_NATURE IN ['DEPOSIT_EXTENSION', 'LOAN_EXTENSION',
      'ADVANCE_EXTENSION'] AND F_CONSIDERATION_FORM IN ['INTEREST', 'DISCOUNT']
  A_M_LFRA20L_IS_SUPPLIER:
    statement: The person is a supplier.
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_M_LFRA20L_LOCATION:
    statement: The supplier makes a supply from a State or Union territory, other than a special category State.
    order: LOW
    rule: F_SUPPLIER_LOCATION_STATE_CATEGORY = 'OTHER'
  A_M_LFRA20L_TURNOVER:
    statement: The supplier's aggregate turnover in a financial year exceeds twenty lakh rupees.
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_FY > 2000000
  A_M_LFRA20L_TAXABLE_SUPPLY:
    statement: A person makes taxable supplies of goods or services or both
    order: LOW
    rule: F_PERSON_MAKES_TAXABLE_SUPPLIES = TRUE
  A_M_ESOGE_0:
    statement: A person is engaged in the supply of taxable goods
    order: LOW
    rule: F_PERSON_SUPPLIES_TAXABLE_GOODS = TRUE
  A_M_ESOGE_1:
    statement: The person is engaged in an exempt supply of services provided by way of extending deposits, loans or advances
    order: LOW
    rule: F_SUPPLY_NATURE = 'SERVICES' AND F_SUPPLY_EXEMPTION_STATUS = 'WHOLLY_EXEMPT' AND F_SERVICE_TYPE_FINANCIAL IN ['DEPOSIT',
      'LOAN', 'ADVANCE']
  A_M_ESOGE_2:
    statement: The consideration for the exempt service is represented by way of interest or discount
    order: LOW
    rule: F_SERVICE_CONSIDERATION_FORM IN ['INTEREST', 'DISCOUNT']
  A_M_RTFSCS_1:
    statement: A person makes taxable supplies of goods or services or both
    order: LOW
    rule: F_PERSON_MAKES_TAXABLE_SUPPLIES = TRUE
  A_M_RTFSCS_2:
    statement: The person makes supplies from any of the special category States
    order: LOW
    rule: F_SUPPLIER_LOCATION_STATE_CATEGORY = 'SPECIAL_CATEGORY_STATE'
  A_M_RTFSCS_3:
    statement: The person's aggregate turnover in a financial year exceeds ten lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_FY > 1000000
  A_M_PTETFS_1:
    statement: The power to enhance the threshold is exercised at the request of a special category State.
    order: LOW
    rule: F_NOTIFICATION_SCS_REQUEST = TRUE
  A_M_PTETFS_2:
    statement: The power to enhance the threshold is exercised on the recommendations of the Council.
    order: LOW
    rule: F_NOTIFICATION_COUNCIL_RECOMMENDATION = TRUE
  A_M_PTETFS_3:
    statement: The Government gives effect to the enhancement, and any associated conditions and limitations, by a notification.
    order: LOW
    rule: F_NOTIFICATION_IS_ISSUED = TRUE AND F_NOTIFICATION_ISSUER = 'GOVERNMENT'
  A_M_PTETFS_4:
    statement: The enhanced aggregate turnover is an amount greater than ten lakh rupees.
    order: LOW
    rule: F_NOTIFIED_SCS_THRESHOLD_AMOUNT > 1000000
  A_M_PTETFS_5:
    statement: The enhanced aggregate turnover does not exceed twenty lakh rupees.
    order: LOW
    rule: F_NOTIFIED_SCS_THRESHOLD_AMOUNT <= 2000000
  A_STATE_REQUEST:
    statement: The Government may enhance the threshold at the request of a State.
    order: LOW
    rule: F_NOTIFICATION_SCS_REQUEST = TRUE
  A_COUNCIL_RECOMMENDATION:
    statement: The Government may enhance the threshold on the recommendations of the Council.
    order: LOW
    rule: F_NOTIFICATION_COUNCIL_RECOMMENDATION = TRUE
  A_SUPPLIER_SCOPE:
    statement: The enhanced threshold applies to a supplier who is engaged exclusively in the supply of goods.
    order: LOW
    rule: F_SUPPLIER_ENGAGED_EXCLUSIVELY_IN_GOODS = TRUE
  A_ENHANCEMENT_RANGE:
    statement: The aggregate turnover may be enhanced from twenty lakh rupees to an amount not exceeding forty lakh rupees.
    order: LOW
    rule: F_NOTIFIED_ENHANCED_THRESHOLD_AMOUNT > 2000000 AND F_NOTIFIED_ENHANCED_THRESHOLD_AMOUNT <= 4000000
  A_NOTIFICATION_REQUIREMENT:
    statement: The enhancement and any attendant conditions and limitations are to be notified.
    order: LOW
    rule: F_NOTIFICATION_IS_ISSUED = TRUE
groups:
  G_QTR:
    name: Quarter qualifies as the relevant period
    logic: ALL
    members:
    - A_QTR_AVAIL
    - A_QTR_PREV
    - A_QTR_LAST
    description: The quarter must have turnover details of all recipients available AND be previous to the distribution month
      AND be the last such quarter.
  G_RPPFY_COND:
    name: Section scope and recipient turnover condition
    logic: ALL
    members:
    - A_RPPFY_SCOPE
    - A_RPPFY_TURNOVER
    description: Both the section-purpose scope and the recipient turnover condition must hold
  G_GOODS_MIX:
    name: Taxable and non-taxable goods supplied
    logic: ALL
    members:
    - A_TAXABLE_GOODS_SUPPLY
    - A_NON_TAXABLE_GOODS_SUPPLY
    description: The words as well as require the person to be engaged in both kinds of goods supply.
  G_TURNOVER_SCOPE:
    name: Scope of turnover meaning for this section
    logic: ALL
    members:
    - A_SECTION_PURPOSE
    - A_REGISTERED_PERSON
    - G_GOODS_MIX
    description: The meaning applies for this section in relation to a registered person who supplies taxable goods as well
      as goods not taxable under this Act.
  G_TURNOVER_COMPUTATION:
    name: Computation of turnover for this section
    logic: ALL
    members:
    - A_TURNOVER_BASE
    - A_LIST_I_REDUCTION
    - A_LIST_II_REDUCTION
    description: Start with the value of turnover. Reduce it by the List I levies and by the List II levies.
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_SUPPLY_CAPACITY_S22:
    name: Supply capacity for Section 22 aggregate turnover
    logic: ANY
    members:
    - A_OWN_ACCOUNT_SUPPLY_S22
    - A_PRINCIPAL_ACCOUNT_SUPPLY_S22
    description: The supply was made either on the person's own account or on behalf of their principals.
  G_HEADS:
    name: Permitted head routes for distributed credit
    logic: ANY
    members:
    - A_CT_AS_CT
    - A_CT_AS_IT
    - A_IT_AS_IT
    - A_IT_AS_CT
    description: Central tax credit may be distributed as central tax or integrated tax and integrated tax credit as integrated
      tax or central tax, so any one permitted route satisfies the head condition
  G_CONDITIONS:
    name: Conditions on distribution of credit
    logic: ALL
    members:
    - A_RECIPIENTS
    - A_DOC_ISSUED_CDAPD
    - A_DOC_DETAILS
    description: The credit must be distributable to the recipients of credit and against a document, and that document must
      contain the prescribed details.
  G_CATMR_1:
    name: Distribution Conditions
    logic: ALL
    members:
    - A_CATMR_2
    - A_CATMR_3
    description: If credit is attributable to multiple recipients, it must be distributed to the correct recipients and on
      a pro-rata basis.
  G_CATAR_CONDITIONS:
    name: Conditions for pro-rata distribution of credit attributable to all recipients
    logic: ALL
    members:
    - A_CATAR_01
    - A_CATAR_02
    - A_CATAR_03
    - A_CATAR_04
  A_S20_CONTRAVENTION:
    g:
      results: ''
      element: A_S20_CONTRAVENTION
    logic: ANY
    members:
    - PD_CATAR
    - PD_CATMR
    - PD_CATOR_1
    - PD_CDAPD
    - PD_ISDDC
    - PD_MOROC
    - PD_M_DNEAC
    - PD_RPLAQ
    - PD_RPPFY
    - PD_TURNOVER_MEANING
    wired: true
  G_ATFCE_1:
    name: Rules for computing aggregate turnover for composition eligibility
    logic: ALL
    members:
    - A_ATFCE_1
    - A_ATFCE_2
  G_M_LFRA20L_CONDITIONS:
    name: Conditions for registration liability under S22(1)
    logic: ALL
    members:
    - A_M_LFRA20L_IS_SUPPLIER
    - A_M_LFRA20L_LOCATION
    - A_M_LFRA20L_TAXABLE_SUPPLY
    - A_M_LFRA20L_TURNOVER
  G_M_ESOGE_1:
    name: Conditions for exempt financial services
    logic: ALL
    members:
    - A_M_ESOGE_1
    - A_M_ESOGE_2
    description: The person must be engaged in a qualifying exempt financial service for which the consideration is in a qualifying
      form.
  G_M_RTFSCS_CONDITIONS:
    name: Conditions for registration liability under SCS proviso
    logic: ALL
    members:
    - A_M_RTFSCS_1
    - A_M_RTFSCS_2
    - A_M_RTFSCS_3
    description: All three conditions must be met to trigger the liability to register under this proviso.
  G_POWER_CONDITIONS:
    name: Conditions for Government power to enhance registration threshold
    logic: ALL
    members:
    - A_STATE_REQUEST
    - A_COUNCIL_RECOMMENDATION
    - A_SUPPLIER_SCOPE
    - A_ENHANCEMENT_RANGE
    - A_NOTIFICATION_REQUIREMENT
  A_M_ISDR_1:
    name: Any of the referred steps (A_M_ISDR_1)
    logic: ANY
    members:
    - PD_M_ESOGE
    - PD_M_LFRA20L
    - PD_M_PTETFS
    - PD_M_RTFSCS
    - PD_PTETFG
    description: TRUE when any step of the law this check refers to is TRUE
outcomes:
  LE_RPLAQ:
    outcome: RELEVANT_PERIOD_IS_LAST_QUARTER_WITH_RECIPIENT_TURNOVER_DETAILS
    expr: A_PURPOSE AND A_NOTURN AND G_QTR
    module: M_RPLAQ
    description: The relevant period is the quarter tested when the section 20 purpose applies, some or all recipients lack
      preceding-year turnover, and the quarter satisfies all three quarter conditions.
  LE_RPPFY:
    outcome: RELEVANT_PERIOD_IS_PRECEDING_FINANCIAL_YEAR
    expr: G_RPPFY_COND
    module: M_RPPFY
    description: For the purposes of this section the relevant period is the said financial year, i.e. the financial year
      preceding the year during which credit is to be distributed
  LE_MOROC:
    outcome: RECIPIENT_OF_CREDIT
    expr: A_SUPPLIER_STATUS AND A_SAME_PAN
    module: M_MOROC
    description: For section 20 a person is a recipient of credit when the person is a supplier of goods or services or both
      AND has the same PAN as the Input Service Distributor
  LE_TURNOVER_MEANING:
    outcome: SECTION_TURNOVER_MEANING_APPLIES
    expr: G_TURNOVER_SCOPE AND G_TURNOVER_COMPUTATION
    module: M_MOTFD
    description: When the scope conditions are met, turnover for this section equals F_PERSON_TURNOVER_VALUE minus F_TAX_LIST_I_ENTRIES_84_92A_AMOUNT
      minus F_TAX_LIST_II_ENTRIES_51_54_AMOUNT. A reduction amount of zero is valid and does not defeat the meaning.
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_ATDFS22:
    outcome: SUPPLY_INCLUDED_IN_AGGREGATE_TURNOVER_FOR_S22
    expr: A_TAXABLE_PERSON_S22 AND G_SUPPLY_CAPACITY_S22
    module: M_ATDFS22
    description: A supply is included in the aggregate turnover for Section 22 if it is made by a taxable person, either on
      their own account or on behalf of principals.
  LE_ISDDC:
    outcome: ISD_DISTRIBUTION_COMPLIANT
    expr: A_ISD AND G_HEADS AND A_DOC_ISSUED AND A_DOC_AMOUNT AND A_MANNER
    module: M_ISDDC
    description: The distribution complies with Section 20(1) when it is made by an Input Service Distributor, follows one
      of the four permitted head routes, is made by a document stating the credit amount, and follows the prescribed manner
  LE_CDAPD:
    outcome: S20_2A_DISTRIBUTION_CONDITION_SATISFIED
    expr: A_ISD_CDAPD AND G_CONDITIONS
    module: M_CDAPD
    description: The condition under Section 20(2)(a) is satisfied when the distributor is an Input Service Distributor and
      the credit is distributed to the recipients of credit against a document containing the prescribed details.
  LE_M_DNEAC:
    outcome: ISD_DISTRIBUTION_CONDITION_MET
    expr: A_M_DNEAC_01
    module: M_DNEAC
    description: The condition that the distributed credit does not exceed the available credit is met.
  LE_CATOR_1:
    outcome: ISD_CREDIT_DISTRIBUTION_CONDITION_C_MET
    expr: A_CATOR_1
    module: M_CATOR
  LE_CATMR:
    outcome: ISD_DISTRIBUTION_CONDITION_D_MET
    expr: (NOT A_CATMR_1) OR G_CATMR_1
    module: M_CATMR
    description: The conditions for distributing credit attributable to multiple recipients are met if either the credit is
      not attributable to multiple recipients, or if it is, all distribution conditions are satisfied.
  LE_CATAR:
    outcome: ISD_DISTRIBUTION_COMPLIANT
    expr: G_CATAR_CONDITIONS
    module: M_CATAR
  LE_ISD_CREDIT_DISTRIBUTION:
    outcome: ISD_CREDIT_DISTRIBUTION
    expr: A_ISD_CREDIT_DISTRIBUTION
    module: M_ROEDC
    description: An Input Service Distributor distributes the credit. (Section 21, part of the law)
  LE_EXCESS_DISTRIBUTION:
    outcome: EXCESS_DISTRIBUTION
    expr: A_EXCESS_DISTRIBUTION
    module: M_ROEDC
    description: The contravention results in excess distribution of credit to one or more recipients of credit. (Section
      21, part of the law)
  LE_ATFCE_1:
    outcome: AGGREGATE_TURNOVER_FOR_COMPOSITION_ELIGIBILITY_DEFINED
    expr: G_ATFCE_1
    module: M_ATFCE
    description: The method for computing aggregate turnover for composition eligibility is defined by the inclusion and exclusion
      rules specified.
  LE_M_LFRA20L:
    outcome: LIABLE_FOR_REGISTRATION
    expr: G_M_LFRA20L_CONDITIONS
    module: M_LFRA20L
    description: A supplier is liable for registration if all conditions are met.
  LE_M_ESOGE:
    outcome: PERSON_DEEMED_EXCLUSIVELY_GOODS_SUPPLIER
    expr: A_M_ESOGE_0 AND G_M_ESOGE_1
    module: M_ESOGE
    description: The person is deemed to be engaged exclusively in the supply of goods for the purposes of Section 22(1).
  LE_M_RTFSCS:
    outcome: PERSON_LIABLE_TO_REGISTER
    expr: G_M_RTFSCS_CONDITIONS
    module: M_RTFSCS
    description: The person is liable to be registered under this proviso.
  LE_M_PTETFS:
    outcome: POWER_VALIDLY_EXERCISED
    expr: A_M_PTETFS_1 AND A_M_PTETFS_2 AND A_M_PTETFS_3 AND A_M_PTETFS_4 AND A_M_PTETFS_5
    module: M_PTETFS
    description: The power to enhance the threshold is considered validly exercised if all the specified preconditions and
      limitations are met.
  LE_PTETFG:
    outcome: POWER_TO_ENHANCE_THRESHOLD_EXISTS
    expr: G_POWER_CONDITIONS
    module: M_PTETFG
  LE_M_ISDR:
    outcome: REGISTRATION_REQUIRED
    expr: A_M_ISDR_1
    module: M_ISDR
