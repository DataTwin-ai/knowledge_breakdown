    statement: The amount required under section 18(4) is paid by way of debit in the electronic cash ledger
    order: LOW
    rule: F_PAYMENT_LEDGER_USED IN ['ELECTRONIC_CASH_LEDGER', 'BOTH']
  A_CREDIT_STOCK:
    statement: The amount payable is equivalent to a base that includes the credit of input tax in respect of inputs held
      in stock
    order: LOW
    rule: F_ITC_STOCK_INPUT_CREDIT IS_SET
  A_CREDIT_CONTAINED:
    statement: The amount payable is equivalent to a base that includes the credit of input tax in respect of inputs contained
      in semi-finished or finished goods held in stock
    order: LOW
    rule: F_ITC_CONTAINED_INPUT_CREDIT IS_SET
  A_CREDIT_CAPITAL:
    statement: The amount payable is equivalent to a base that includes the credit of input tax on capital goods
    order: LOW
    rule: F_ITC_CAPITAL_GOODS_CREDIT IS_SET
  A_REDUCTION:
    statement: The credit is reduced by such percentage points as may be prescribed
    order: HIGH
    interpretation: The source sentence is ambiguous on scope. Does the reduction by such percentage points as may be prescribed
      attach only to the credit on capital goods or to the whole equivalent amount? What percentage points are prescribed
      for the relevant date? This MKP states neither, and no value or scope is asserted here.
    grounding:
    - F_ITC_S18_4_REDUCTION_POINTS
    - F_ITC_CAPITAL_GOODS_CREDIT
    - F_ITC_PAYABLE_AMOUNT
  A_AMOUNT_EQUIV:
    statement: The registered person shall pay an amount equivalent to the credit of input tax in respect of inputs held in
      stock and inputs contained in semi-finished or finished goods held in stock and on capital goods, reduced by such percentage
      points as may be prescribed
    order: LOW
    rule: F_PAYMENT_S18_4_DIFFERENCE = 0
  A_TIME_EXEMPT:
    statement: In the wholly exempt case the section 18(4) amount is tied to the day immediately preceding the date of such
      exemption
    order: HIGH
    if_false: the relevant date under the adopted reading is not the day immediately preceding F_SUPPLY_EXEMPTION_DATE
    interpretation: The source does not settle whether the day immediately preceding the date of such exemption fixes the
      day on which stock and credit are reckoned, the day of payment, or both. Under the reading adopted, does the relevant
      date equal F_SUPPLY_EXEMPTION_DATE minus one day?
    grounding:
    - F_SUPPLY_EXEMPTION_DATE
    - F_STOCK_RECKONING_DATE
    - F_PAYMENT_DATE
  A_PAID:
    statement: Payment of such amount, being the amount payable under Section 18(4), has been made
    order: LOW
    rule: F_PAYMENT_S18_4_DIFFERENCE <= 0
  A_BALANCE:
    statement: After payment of such amount, a balance of input tax credit, if any, lies in his electronic credit ledger
    order: LOW
    rule: F_ITC_UNUTILISED_LEDGER_AMOUNT > 0
  A_TIIRI_1:
    statement: The document is a revised invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'REVISED_INVOICE'
  A_TIIRI_2:
    statement: The revised invoice was issued by the supplier.
    order: LOW
    rule: F_DOCUMENT_ISSUER_ROLE = 'SUPPLIER'
  A_TIIRI_3:
    statement: The revised invoice is in respect of a supply made earlier.
    order: HIGH
    interpretation: Does the date of issue of the revised invoice (F_TAX_INVOICE_ISSUE_DATE) occur after the date of the supply
      it pertains to (F_ORIGINAL_SUPPLY_DATE)?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_ORIGINAL_SUPPLY_DATE
  A_M_DNISI_1:
    statement: The document is a supplementary invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'SUPPLEMENTARY_INVOICE'
