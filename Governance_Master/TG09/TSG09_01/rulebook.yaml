    statement: The option is subject to sub-sections (3) and (4) of section 9. Where a supply falls within either of those
      provisions, those provisions continue to apply despite the option.
  PD_ELIG:
    statement: If all conditions are met, the registered person may opt for this composition levy. The person is not required
      to opt. The permission applies notwithstanding anything to the contrary contained in this Act. It remains subject to
      sub-sections (3) and (4) of section 9 (see LE_PRIORITY).
  PD_TERMS:
    statement: If the person is eligible and has opted, the person pays an amount of tax in lieu of the tax payable by him
      under sub-section (1) of section 9. That amount is calculated at such rate as may be prescribed. The rate must not exceed
      three per cent. of the turnover in State or turnover in Union territor
  PD_PRIORITY:
    statement: The option operates subject to the provisions of sub-sections (3) and (4) of section 9. Where either of those
      provisions applies, it continues to govern despite the composition option. This clause preserves those provisions. It
      is not a condition of eligibility.
  PD_OPTION_CIFNP:
    statement: Notwithstanding anything to the contrary in the Act, the person may opt when every eligibility condition is
      met. This is a permission, not an obligation. The option remains subject to section 9(3) and 9(4).
  PD_AMOUNT_CIFNP:
    statement: Where an eligible person has opted, the amount is paid in lieu of tax under section 9(1). It is calculated
      at the prescribed rate, which must not exceed three per cent., of turnover in State or turnover in Union territory.
  PD_S9_PRIORITY:
    statement: Where the person has opted and section 9(3) or 9(4) is engaged, the option operates subject to those provisions
      and does not override them. The source does not state further operative detail, and none is assumed.
  PD_S10_2A_ELIGIBLE:
    statement: Permission (may opt, not an obligation) to pay the composition amount under sub-section (2A). It operates notwithstanding
      anything to the contrary in the Act but subject to section 9(3) and 9(4). Satisfying these conditions does not displace
      any further condition that other clauses of sub-section (2
  PD_AMOUNT_S10_2A:
    statement: Where an eligible person has opted, the amount of tax is calculated at the prescribed rate, not exceeding three
      per cent., of the turnover in State or turnover in Union territory, and is payable in lieu of the tax payable by him
      under section 9(1)
  PD_S9_RESERVED:
    statement: For a supply covered by section 9(3) or section 9(4), the option under sub-section (2A) remains subject to
      those provisions. The precise effect of the reservation is not stated in the source and is left for review
  PD_M_COLOTEL_1:
    statement: The composition option lapses if the person has availed the option and their turnover exceeds the applicable
      limit.
  PD_PENALTY:
    statement: Such person shall be liable to a penalty. This is mandatory (shall) and is in addition to any tax that may
      be payable by him under any other provisions of this Act. It does not replace that tax
  PD_PROCEDURE:
    statement: The provisions of section 73 or section 74 apply mutatis mutandis for determination of tax and penalty. The
      source gives no criterion for choosing between the two sections, so the choice is not asserted here
  PD_M_COEFCL:
    statement: The person is entitled to take credit if all conditions are met and credit is claimed on at least one eligible
      item category.
  PD_LIABILITY:
    statement: A registered person who has availed of input tax credit and who either opts to pay tax under section 10 or
      whose supplies become wholly exempt shall pay the section 18(4) amount.
  PD_PAYMENT_POOCOE:
    statement: The obligation is met when the equivalent amount is paid by debit in the electronic credit ledger or the electronic
      cash ledger. That amount is the specified credit reduced by the prescribed percentage points, reckoned on the day immediately
      preceding the option date or the exemption date as the cas
  PD_BCLAP:
    statement: After payment of such amount, the balance of input tax credit, if any, lying in the person's electronic credit
      ledger shall lapse. The consequence is mandatory.
  PD_CREDIT_CALC:
    statement: The amount of credit under section 18(1) has been calculated in the prescribed manner.
  PD_PAYABLE_CALC:
    statement: The amount payable under section 18(4) has been calculated in the prescribed manner.
  PD_TIIRI:
    statement: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised invoice
      issued by the supplier for a supply made earlier.
  PD_M_DNISI:
    statement: A document is treated as a debit note for the purposes of the Act if it is a supplementary invoice.
