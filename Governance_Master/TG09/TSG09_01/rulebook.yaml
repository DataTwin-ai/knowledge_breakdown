    description: Once the person is entitled, the said amount shall be credited to the electronic credit ledger of that person.
      This is a mandatory consequence of the entitlement, not a precondition of it.
  LE_ITC_TAKEN:
    outcome: ITC_TAKEN
    expr: A_ITC_TAKEN
    module: M_DSOUCG
    description: Input tax credit has been taken on such capital goods. (Section 19(6), part of the law)
  LE_CFNRP:
