      rules specified.
  LE_EOPSFT:
    outcome: VALUE_OF_SUPPLY_EXCLUDED_FROM_TURNOVER_IN_STATE_OR_UT
    expr: G_EXCL_EOPSFT
    module: M_EOPSFT
    description: When determining tax payable under the composition section, the value of supplies from 1 April of a financial
      year up to the date the person becomes liable for registration is not included in turnover in State or turnover in Union
      territory
  LE_M_EOIIFT:
    outcome: IS_EXCLUDED_FROM_TURNOVER
    expr: G_M_EOIIFT_ALL
    module: M_EOIIFT
  LE_M_LOCTOPP:
    outcome: CENTRAL_TAX_LEVIABLE
