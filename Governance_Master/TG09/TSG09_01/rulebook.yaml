    expr: PD_S10_2A_ELIGIBLE AND A_OPTED_CIFCN AND G_AMOUNT_CIFCN
    module: M_CIFCN
    description: Where an eligible person has opted, the amount of tax is calculated at the prescribed rate, not exceeding
      three per cent., of the turnover in State or turnover in Union territory, and is payable in lieu of the tax payable
      by him under section 9(1)
