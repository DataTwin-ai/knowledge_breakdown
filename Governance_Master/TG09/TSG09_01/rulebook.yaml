    expr: A_REGPERSON AND G_CHANGE_EVENT AND A_LIABPROV AND A_UNUTIL AND A_TARGET AND A_MANNER
    module: M_TOUCOR
    description: The registered person is allowed (permission, not obligation) to transfer the unutilised ledger credit when
      all conditions hold
  LE_ENTITLEMENT:
    outcome: ITC_ENTITLEMENT_UNDER_S16_1
    expr: G_ENTITLEMENT
    module: M_EFITC
    description: The registered person is entitled to take the input tax credit when all entitlement conditions hold. The
      entitlement is a permission, not a duty.
  LE_LEDGER_CREDIT:
    outcome: ITC_CREDITED_TO_ELECTRONIC_CREDIT_LEDGER
    expr: G_ENTITLEMENT AND A_LEDGER
