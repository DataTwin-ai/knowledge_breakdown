# GOVERNANCE MASTER TSG09_03 Apportionment (TG09 Input Tax Credit)
# LAW ARC - 11 laws - status NEEDS_REVIEW
name: TSG09_03 Apportionment - GOVERNANCE MASTER rulebook
version: TSG09_03
facts:
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_INPUT_USED_FOR_BUSINESS:
    name: Goods or services or both are used partly for the purpose of any business
    type: BOOLEAN
    tier: T0
  F_INPUT_USED_FOR_OTHER_PURPOSES:
    name: Goods or services or both are used partly for purposes other than business
    type: BOOLEAN
    tier: T0
  F_ITC_ATTRIBUTABLE_TO_BUSINESS_AMOUNT:
    name: Input tax attributable to the purposes of the registered person's business
    type: AMOUNT
    tier: T0
  F_ITC_EXCESS_OVER_BUSINESS_PORTION:
    name: Credit availed in excess of the input tax attributable to business (availed amount minus business-attributable amount)
    type: AMOUNT
    tier: T1
  F_INPUT_USED_FOR_TAXABLE_SUPPLIES:
    name: The goods or services or both are used partly for effecting taxable supplies under the CGST Act or the IGST Act
    type: BOOLEAN
    tier: T0
  F_INPUT_USED_FOR_ZERO_RATED_SUPPLIES:
    name: The goods or services or both are used partly for effecting zero-rated supplies under the CGST Act or the IGST Act
    type: BOOLEAN
    tier: T0
  F_INPUT_USED_FOR_EXEMPT_SUPPLIES:
    name: The goods or services or both are used partly for effecting exempt supplies under the CGST Act or the IGST Act
    type: BOOLEAN
    tier: T0
  F_ITC_CREDIT_AMOUNT_TAKEN:
    name: Amount of input tax credit taken on the goods or services or both
    type: AMOUNT
    tier: T0
  F_ITC_INPUT_TAX_ATTRIBUTABLE_TO_TAXABLE:
    name: Input tax attributable to taxable supplies including zero-rated supplies
    type: AMOUNT
    tier: T0
  F_INPUT_USE_DESCRIPTION:
    name: Description of how the goods or services or both are used across taxable, zero-rated and exempt supplies
    type: TEXT
    tier: T0
  F_TRANSACTION_IS_BUILDING_SALE:
    name: Transaction is a sale of building
    type: BOOLEAN
    tier: T0
  F_TRANSACTION_DESCRIPTION:
    name: Description of the building sale transaction relevant to clause (b) of paragraph 5 of Schedule II
    type: TEXT
    tier: T1
  F_EXEMPT_SUPPLY_VALUE_PURPOSE:
    name: Provision for which the expression value of exempt supply is being applied
    type: CODE
    options:
    - OTHER
    - SECTION_17_3
    tier: T0
  F_ACTIVITY_IN_SCHEDULE_III:
    name: Activity or transaction is specified in Schedule III
    type: BOOLEAN
    tier: T1
  F_ACTIVITY_IN_SCHEDULE_III_PARA5:
    name: Activity or transaction is specified in paragraph 5 of Schedule III
    type: BOOLEAN
    tier: T1
  F_PERSON_ENTITY_TYPE:
    name: Type of entity the person is
    type: CODE
    options:
    - BANKING_COMPANY
    - FINANCIAL_INSTITUTION
    - NON_BANKING_FINANCIAL_COMPANY
    - OTHER
    tier: T0
  F_PERSON_SUPPLIES_DEPOSIT_SERVICES:
    name: Person supplies services by way of accepting deposits
    type: CODE
    options:
    - 'YES'
    - 'NO'
    tier: T0
  F_PERSON_SUPPLIES_LOAN_SERVICES:
    name: Person supplies services by way of extending loans
    type: CODE
    options:
    - 'YES'
    - 'NO'
    tier: T0
  F_PERSON_SUPPLIES_ADVANCE_SERVICES:
    name: Person supplies services by way of extending advances
    type: CODE
    options:
    - 'YES'
    - 'NO'
    tier: T0
  F_ITC_AVAILED_PERCENT_OF_ELIGIBLE:
    name: Credit availed in the month as a percentage of the eligible input tax credit of that month
    type: AMOUNT
    tier: T0
  F_ITC_ELIGIBLE_MONTH_AMOUNT:
    name: Eligible input tax credit on inputs, capital goods and input services in the month
    type: AMOUNT
    tier: T0
  F_PERSON_OPTION_S17_4_EXERCISED:
    name: Person has exercised the option under Section 17(4)
    type: BOOLEAN
    tier: T0
  F_PERSON_OPTION_WITHDRAWN_IN_REMAINING_FY:
    name: Exercised option is withdrawn after its exercise and within the remaining part of the financial year in which it
      was exercised
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TAX_PAID:
    name: Tax has been paid on the supply
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_RECIPIENT_IS_REGISTERED:
    name: Recipient is a registered person
    type: BOOLEAN
    tier: T0
  F_PARTIES_SAME_PAN:
    name: Supplier and recipient have the same Permanent Account Number
    type: BOOLEAN
    tier: T0
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_REG_USER:
    statement: The goods or services or both are used by a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_MIXED_USE:
    statement: The goods or services or both are used by the registered person partly for the purpose of any business and
      partly for other purposes
    order: HIGH
    interpretation: Are the goods or services or both used partly for the purpose of any business and partly for other purposes
      - both uses must exist together and the business is not limited to a particular business?
    grounding:
    - F_INPUT_USED_FOR_BUSINESS
    - F_INPUT_USED_FOR_OTHER_PURPOSES
  A_ATTRIBUTION:
    statement: So much of the input tax as is attributable to the purposes of his business is the amount to which the credit
      is restricted
    order: HIGH
    interpretation: How much of the input tax is attributable to the purposes of the registered person's business?
    grounding:
    - F_ITC_ATTRIBUTABLE_TO_BUSINESS_AMOUNT
  A_CREDIT_CAP:
    statement: The amount of credit shall be restricted to so much of the input tax as is attributable to the purposes of
      his business
    order: LOW
    rule: F_ITC_EXCESS_OVER_BUSINESS_PORTION <= 0
  A_REGISTERED_USER:
    statement: The goods or services or both are used by the registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_TAXABLE_USE:
    statement: The goods or services or both are used by the registered person partly for effecting taxable supplies under
      this Act or under the Integrated Goods and Services Tax Act
    order: LOW
    rule: F_INPUT_USED_FOR_TAXABLE_SUPPLIES = TRUE
  A_ZERO_RATED_USE:
    statement: The goods or services or both are used by the registered person partly for effecting zero-rated supplies, which
      are included in taxable supplies, under this Act or under the Integrated Goods and Services Tax Act
    order: LOW
    rule: F_INPUT_USED_FOR_ZERO_RATED_SUPPLIES = TRUE
  A_EXEMPT_USE:
    statement: The goods or services or both are used by the registered person partly for effecting exempt supplies under
      the said Acts, namely this Act or the Integrated Goods and Services Tax Act
    order: LOW
    rule: F_INPUT_USED_FOR_EXEMPT_SUPPLIES = TRUE
  A_CREDIT_WITHIN_ATTRIBUTABLE:
    statement: The amount of credit shall be restricted to so much of the input tax as is attributable to the said taxable
      supplies including zero-rated supplies
    order: HIGH
    interpretation: How much of the input tax on the goods or services or both is attributable to the taxable supplies including
      zero-rated supplies, and does the credit taken stay within that amount without including any part attributable to exempt
      supplies? FALSE where the credit taken exceeds the determined attributable input tax.
    grounding:
    - F_ITC_CREDIT_AMOUNT_TAKEN
    - F_ITC_INPUT_TAX_ATTRIBUTABLE_TO_TAXABLE
    - F_INPUT_USE_DESCRIPTION
  A_P5B_LIMIT:
    statement: Clause (b) of paragraph 5 of Schedule II, to which the inclusion of sale of building is subject, limits or
      displaces that inclusion for this sale of building
    order: HIGH
    interpretation: Does clause (b) of paragraph 5 of Schedule II apply to this sale of building so as to limit or displace
      its inclusion in the value of exempt supply? The content of that clause is not supplied in this MKP and must not be
      assumed.
    grounding:
    - F_TRANSACTION_IS_BUILDING_SALE
    - F_TRANSACTION_DESCRIPTION
  A_PURPOSE_ESVESIII:
    statement: The expression "value of exempt supply" is being applied for the purposes of this sub-section (sub-section
      (3) of Section 17)
    order: LOW
    rule: F_EXEMPT_SUPPLY_VALUE_PURPOSE = 'SECTION_17_3'
  A_SCH3:
    statement: The value in question is the value of an activity or transaction specified in Schedule III, which the expression
      "value of exempt supply" shall not include
    order: LOW
    rule: F_ACTIVITY_IN_SCHEDULE_III = TRUE
  A_PARA5:
    statement: The activity or transaction is one of those specified in paragraph 5 of the said Schedule (Schedule III), to
      which the exclusion does not apply
    order: LOW
    rule: F_ACTIVITY_IN_SCHEDULE_III_PARA5 = TRUE
  A_BANKCO:
    statement: The person is a banking company
    order: LOW
    if_false: F_PERSON_ENTITY_TYPE is known and is not BANKING_COMPANY
    rule: F_PERSON_ENTITY_TYPE = 'BANKING_COMPANY'
  A_FININST:
    statement: The person is a financial institution, including a non-banking financial company
    order: LOW
    if_false: F_PERSON_ENTITY_TYPE is known and is neither FINANCIAL_INSTITUTION nor NON_BANKING_FINANCIAL_COMPANY
    rule: F_PERSON_ENTITY_TYPE IN ['FINANCIAL_INSTITUTION','NON_BANKING_FINANCIAL_COMPANY']
  A_DEPOSITS:
    statement: The banking company or financial institution is engaged in supplying services by way of accepting deposits
    order: LOW
    rule: F_PERSON_SUPPLIES_DEPOSIT_SERVICES = 'YES'
  A_LOANS:
    statement: The banking company or financial institution is engaged in supplying services by way of extending loans
    order: LOW
    rule: F_PERSON_SUPPLIES_LOAN_SERVICES = 'YES'
  A_ADVANCES:
    statement: The banking company or financial institution is engaged in supplying services by way of extending advances
    order: LOW
    rule: F_PERSON_SUPPLIES_ADVANCE_SERVICES = 'YES'
  A_FIFTY_AMOUNT:
    statement: The amount availed every month is equal to fifty per cent. of the eligible input tax credit on inputs, capital
      goods and input services in that month
    order: LOW
    if_false: F_ITC_AVAILED_PERCENT_OF_ELIGIBLE is known and is not 50
    rule: F_ITC_AVAILED_PERCENT_OF_ELIGIBLE = 50
  A_LAPSE:
    statement: Where the fifty per cent. option is taken, the rest of the eligible input tax credit on inputs, capital goods
      and input services in that month shall lapse
    order: LOW
    if_false: F_ITC_ELIGIBLE_MONTH_AMOUNT is known and is 0
    rule: F_ITC_ELIGIBLE_MONTH_AMOUNT > 0
  A_OPTION_EXERCISED:
    statement: The option under the parent sub-section (Section 17(4)) has been exercised
    order: LOW
    rule: F_PERSON_OPTION_S17_4_EXERCISED = TRUE
  A_WITHDRAWAL_IN_REMAINING_FY:
    statement: The exercised option is withdrawn on a date after its exercise and falling within the remaining part of the
      financial year
    order: LOW
    if_false: withdrawal is on or before the exercise date or after the end of the financial year of exercise
    rule: F_PERSON_OPTION_WITHDRAWN_IN_REMAINING_FY = TRUE
  A_TAX_PAID_ON_SUPPLY:
    statement: The restriction of fifty per cent. shall not apply to the tax paid on the supply in respect of which the restriction
      is in question
    order: LOW
    rule: F_SUPPLY_TAX_PAID = TRUE
  A_SUPPLIER_REGISTERED:
    statement: The supply is made by one registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_RECIPIENT_REGISTERED:
    statement: The supply is made to another registered person
    order: LOW
    rule: F_RECIPIENT_IS_REGISTERED = TRUE
  A_SAME_PAN:
    statement: The registered person making the supply and the other registered person receiving it have the same Permanent
      Account Number
    order: LOW
    rule: F_PARTIES_SAME_PAN = TRUE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_MIXED_USE:
    name: Registered person uses goods or services partly for business and partly for other purposes
    logic: ALL
    members:
    - A_REG_USER
    - A_MIXED_USE
    description: Both the registered-person use and the partly-business partly-other use must hold.
  A_MOAC_CREDIT:
    name: Any of the referred steps (A_MOAC_CREDIT)
    logic: ANY
    members:
    - PD_CREDIT_LIMITED
    - PD_RESTRICTION_APPLIES
    description: TRUE when any step of the law this check refers to is TRUE
  A_MOAC_PRESCRIBE:
    name: Any of the referred steps (A_MOAC_PRESCRIBE)
    logic: ANY
    members:
    - PD_CREDIT_LIMITED
    - PD_RESTRICTION_APPLIES
    description: TRUE when any step of the law this check refers to is TRUE
  G_MOAC_ALL:
    name: Prescribed manner for referred credit
    logic: ALL
    members:
    - A_MOAC_CREDIT
    - A_MOAC_PRESCRIBE
    description: Both the credit scope and the prescription of the manner must hold.
  G_TAXABLE_USE:
    name: Taxable use including zero-rated
    logic: ANY
    members:
    - A_TAXABLE_USE
    - A_ZERO_RATED_USE
    description: Use for taxable supplies is satisfied by use for taxable supplies, which include zero-rated supplies. The
      inclusion does not close the class of taxable supplies.
  G_PART_USE:
    name: Part taxable and part exempt use
    logic: ALL
    members:
    - A_REGISTERED_USER
    - G_TAXABLE_USE
    - A_EXEMPT_USE
    description: The goods or services or both are used by the registered person both partly for taxable (including zero-rated)
      supplies and partly for exempt supplies.
  A_PURPOSE:
    name: Any of the referred steps (A_PURPOSE)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  A_PRESCRIBED:
    name: Any of the referred steps (A_PRESCRIBED)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  A_RCM:
    name: Any of the referred steps (A_RCM)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  A_SECURITIES:
    name: Any of the referred steps (A_SECURITIES)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  A_LAND:
    name: Any of the referred steps (A_LAND)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  A_BUILDING:
    name: Any of the referred steps (A_BUILDING)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  G_LISTED:
    name: Unqualified listed inclusions
    logic: ANY
    members:
    - A_RCM
    - A_SECURITIES
    - A_LAND
    description: 'Any one of these routes brings the item into the value of exempt supply: a reverse charge supply, a transaction
      in securities or a sale of land.'
  A_CHOOSE_SS2:
    name: Any of the referred steps (A_CHOOSE_SS2)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  A_ELECT_50:
    name: Any of the referred steps (A_ELECT_50)
    logic: ANY
    members:
    - PD_RESTRICTION_APPLIES_CRTTS
    - PD_RESTRICTION_COMPLIED
    description: TRUE when any step of the law this check refers to is TRUE
  G_ENTITY:
    name: Eligible entity
    logic: ANY
    members:
    - A_BANKCO
    - A_FININST
    description: The person is a banking company or a financial institution including a non-banking financial company.
  G_ACTIVITY:
    name: Specified service activity
    logic: ANY
    members:
    - A_DEPOSITS
    - A_LOANS
    - A_ADVANCES
    description: The person is engaged in supplying services by way of accepting deposits, extending loans or extending advances.
  G_ELIGIBLE:
    name: Eligibility for Section 17(4) option
    logic: ALL
    members:
    - G_ENTITY
    - G_ACTIVITY
    description: Both the entity requirement and the service activity requirement must be met.
  G_CONDITIONS:
    name: Conditions for disapplication of the restriction
    logic: ALL
    members:
    - A_TAX_PAID_ON_SUPPLY
    - A_SUPPLIER_REGISTERED
    - A_RECIPIENT_REGISTERED
    - A_SAME_PAN
    description: 'All of the following must hold: the tax is paid on the supply, the supplier is a registered person, the
      recipient is another registered person, and both have the same PAN.'
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_RESTRICTION_APPLIES:
    outcome: CREDIT_RESTRICTION_APPLIES
    expr: G_MIXED_USE
    module: M_CRFBP
    description: The Section 17(1) restriction is triggered when a registered person uses the goods or services or both partly
      for business and partly for other purposes.
  LE_CREDIT_LIMITED:
    outcome: CREDIT_LIMITED_TO_BUSINESS_ATTRIBUTABLE_INPUT_TAX
    expr: G_MIXED_USE AND A_ATTRIBUTION AND A_CREDIT_CAP
    module: M_CRFBP
    description: Where the restriction is triggered the credit must not exceed the input tax attributable to the purposes
      of the business.
  LE_MOAC_1:
    outcome: ATTRIBUTION_MANNER_PRESCRIBED_FOR_SS1_SS2_CREDIT
    expr: G_MOAC_ALL
    module: M_MOAC
    description: The outcome holds when the credit is the credit referred to in sub-sections (1) and (2) and the Government
      has prescribed the manner of attributing it.
  LE_RESTRICTION_APPLIES_CRTTS:
    outcome: CREDIT_RESTRICTED_TO_INPUT_TAX_ATTRIBUTABLE_TO_TAXABLE_SUPPLIES
    expr: G_PART_USE
    module: M_CRTTS
    description: Where the part-use condition is met, the mandatory restriction under Section 17(2) applies. The credit shall
      be restricted to the input tax attributable to taxable supplies including zero-rated supplies.
  LE_RESTRICTION_COMPLIED:
    outcome: CREDIT_TAKEN_WITHIN_SECTION_17_2_RESTRICTION
    expr: G_PART_USE AND A_CREDIT_WITHIN_ATTRIBUTABLE
    module: M_CRTTS
    description: Where the restriction applies, the credit taken is compliant only if it does not exceed the input tax attributable
      to the taxable supplies including zero-rated supplies.
  LE_PRESCRIBED:
    outcome: EXEMPT_SUPPLY_VALUE_AS_PRESCRIBED
    expr: A_PURPOSE AND A_PRESCRIBED
    module: M_VOESP
    description: When the value of exempt supply is determined under sub-section (2), it shall be such as may be prescribed.
  LE_INCLUDED:
    outcome: ITEM_INCLUDED_IN_VALUE_OF_EXEMPT_SUPPLY
    expr: A_PURPOSE AND (G_LISTED OR (A_BUILDING AND NOT A_P5B_LIMIT))
    module: M_VOESP
    description: Under sub-section (2), the value of exempt supply shall include a supply on which the recipient is liable
      to pay tax on reverse charge basis, a transaction in securities or a sale of land. It shall also include a sale of building,
      subject to clause (b) of paragraph 5 of Schedule II.
  LE_EXCL_SCH3:
    outcome: VALUE_EXCLUDED_FROM_VALUE_OF_EXEMPT_SUPPLY
    expr: A_PURPOSE_ESVESIII AND A_SCH3 AND NOT A_PARA5
    module: M_ESVESIII
    description: For the purposes of Section 17(3), the value of a Schedule III activity or transaction is excluded from the
      value of exempt supply, unless the activity or transaction is specified in paragraph 5 of Schedule III.
  LE_OPTION:
    outcome: OPTION_AVAILABLE_UNDER_S17_4
    expr: G_ELIGIBLE
    module: M_BCCO
    description: An eligible entity engaged in the specified services shall have the option under Section 17(4).
  LE_COMPLY:
    outcome: SUBSECTION_2_ROUTE_APPLIES
    expr: G_ELIGIBLE AND A_CHOOSE_SS2
    module: M_BCCO
    description: The eligible person who opts to comply with the provisions of sub-section (2) follows sub-section (2).
  LE_FIFTY:
    outcome: FIFTY_PERCENT_MONTHLY_ROUTE_APPLIES
    expr: G_ELIGIBLE AND A_ELECT_50
    module: M_BCCO
    description: The eligible person who opts for the alternative avails, every month, an amount equal to fifty per cent.
      of the eligible input tax credit on inputs, capital goods and input services in that month.
  LE_FIFTY_AVAILMENT:
    outcome: MONTHLY_AVAILMENT_EQUALS_FIFTY_PERCENT
    expr: G_ELIGIBLE AND A_ELECT_50 AND A_FIFTY_AMOUNT
    module: M_BCCO
    description: Under the fifty per cent. route, the amount availed in the month is equal to fifty per cent. of that month's
      eligible input tax credit on inputs, capital goods and input services.
  LE_LAPSE:
    outcome: REST_OF_ELIGIBLE_ITC_LAPSES
    expr: G_ELIGIBLE AND A_ELECT_50 AND A_LAPSE
    module: M_BCCO
    description: Under the fifty per cent. route, the rest of that month's eligible input tax credit shall lapse by operation
      of the provision, whatever amount was actually availed.
  LE_ONWDFY:
    outcome: OPTION_WITHDRAWAL_PROHIBITED
    expr: A_OPTION_EXERCISED AND A_WITHDRAWAL_IN_REMAINING_FY
    module: M_ONWDFY
    description: Where the option has been exercised, it shall not be withdrawn during the remaining part of the financial
      year.
  LE_RNASPAN:
    outcome: FIFTY_PERCENT_RESTRICTION_NOT_APPLICABLE
    expr: G_CONDITIONS
    module: M_RNASPAN
    description: The restriction of fifty per cent. shall not apply when tax is paid on a supply made by one registered person
      to another registered person having the same PAN.
products:
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_RESTRICTION_APPLIES:
    statement: The Section 17(1) restriction is triggered when a registered person uses the goods or services or both partly
      for business and partly for other purposes.
  PD_CREDIT_LIMITED:
    statement: Where the restriction is triggered the credit must not exceed the input tax attributable to the purposes of
      the business.
  PD_MOAC_1:
    statement: The outcome holds when the credit is the credit referred to in sub-sections (1) and (2) and the Government
      has prescribed the manner of attributing it.
  PD_RESTRICTION_APPLIES_CRTTS:
    statement: Where the part-use condition is met, the mandatory restriction under Section 17(2) applies. The credit shall
      be restricted to the input tax attributable to taxable supplies including zero-rated supplies.
  PD_RESTRICTION_COMPLIED:
    statement: Where the restriction applies, the credit taken is compliant only if it does not exceed the input tax attributable
      to the taxable supplies including zero-rated supplies.
  PD_PRESCRIBED:
    statement: When the value of exempt supply is determined under sub-section (2), it shall be such as may be prescribed.
  PD_INCLUDED:
    statement: Under sub-section (2), the value of exempt supply shall include a supply on which the recipient is liable to
      pay tax on reverse charge basis, a transaction in securities or a sale of land. It shall also include a sale of building,
      subject to clause (b) of paragraph 5 of Schedule II.
  PD_EXCL_SCH3:
    statement: For the purposes of Section 17(3), the value of a Schedule III activity or transaction is excluded from the
      value of exempt supply, unless the activity or transaction is specified in paragraph 5 of Schedule III.
  PD_OPTION:
    statement: An eligible entity engaged in the specified services shall have the option under Section 17(4).
  PD_COMPLY:
    statement: The eligible person who opts to comply with the provisions of sub-section (2) follows sub-section (2).
  PD_FIFTY:
    statement: The eligible person who opts for the alternative avails, every month, an amount equal to fifty per cent. of
      the eligible input tax credit on inputs, capital goods and input services in that month.
  PD_FIFTY_AVAILMENT:
    statement: Under the fifty per cent. route, the amount availed in the month is equal to fifty per cent. of that month's
      eligible input tax credit on inputs, capital goods and input services.
  PD_LAPSE:
    statement: Under the fifty per cent. route, the rest of that month's eligible input tax credit shall lapse by operation
      of the provision, whatever amount was actually availed.
  PD_ONWDFY:
    statement: Where the option has been exercised, it shall not be withdrawn during the remaining part of the financial year.
  PD_RNASPAN:
    statement: The restriction of fifty per cent. shall not apply when tax is paid on a supply made by one registered person
      to another registered person having the same PAN.
