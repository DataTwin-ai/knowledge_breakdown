    order: HIGH
    interpretation: Which conditions and restrictions have been prescribed for this credit, and are they satisfied on the
      recorded facts? This MKP does not state their content, and it must not be invented.
    grounding:
    - F_ITC_PRESCRIBED_CONDITIONS_RECORD
  A_MANNER:
    statement: The credit of input tax is taken in the manner specified in section 49
    order: HIGH
    interpretation: Was the credit taken in the manner specified in section 49? Section 49 is not loaded here, and its content
      must not be assumed.
    grounding:
    - F_ITC_S49_MANNER_RECORD
  A_LEDGER:
    statement: The said amount of input tax credit shall be credited to the electronic credit ledger of such person
    order: LOW
    rule: F_ITC_CREDITED_TO_ELECTRONIC_LEDGER = TRUE
  A_WCS:
    statement: The input tax credit is in respect of works contract services
    order: HIGH
    if_false: The service on which credit is claimed is not a works contract service
    interpretation: On the description of the service and the contract under which it is supplied, is the service on which
      credit is claimed a works contract service?
    grounding:
    - F_INPUT_DESCRIPTION
    - F_SERVICE_CONTRACT_DESCRIPTION
  A_CONSTR:
    statement: The works contract services are supplied for construction of an immovable property
    order: HIGH
    if_false: The works contract services are not supplied for construction of an immovable property
    interpretation: Are the works contract services supplied for construction of an immovable property?
    grounding:
    - F_SERVICE_CONTRACT_DESCRIPTION
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
  A_NOTPM:
    statement: The immovable property for whose construction the works contract services are supplied is other than plant
      and machinery
    order: HIGH
    if_false: The immovable property under construction is plant and machinery
    interpretation: Is the immovable property under construction other than plant and machinery?
    grounding:
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
  A_FURTHER:
    statement: The works contract service is an input service for further supply of works contract service
    order: LOW
    rule: F_INPUT_FURTHER_SUPPLY_TYPE = 'WORKS_CONTRACT_SERVICE'
  A_RECON:
    statement: The work done to the said immovable property is re-construction
    order: LOW
    rule: F_WORK_KIND = 'RECONSTRUCTION'
  A_RENOV:
    statement: The work done to the said immovable property is renovation
    order: LOW
    rule: F_WORK_KIND = 'RENOVATION'
  A_ADDITION:
    statement: The work done to the said immovable property is an addition
    order: LOW
    rule: F_WORK_KIND = 'ADDITION'
  A_ALTERATION:
    statement: The work done to the said immovable property is an alteration
    order: LOW
    rule: F_WORK_KIND = 'ALTERATION'
  A_REPAIRS:
    statement: The work done to the said immovable property is repairs
    order: LOW
    rule: F_WORK_KIND = 'REPAIR'
  A_OTHER_CONS:
    statement: The work is construction in the ordinary sense or other work not listed that falls within the expression 'construction',
      since 'includes' does not limit the expression to the listed works
    order: HIGH
    interpretation: Is the work construction in its ordinary sense or of the same kind as the listed works, so that it is
      within the expression construction by virtue of the open word includes?
    grounding:
    - F_WORK_KIND
    - F_WORK_DESCRIPTION
  A_CAPITALISED:
    statement: The listed work is included in 'construction' to the extent of capitalisation
    order: LOW
    rule: F_WORK_CAPITALISED_AMOUNT > 0
  A_IMMOV:
    statement: The work is done to the said immovable property
    order: LOW
    rule: F_WORK_ON_SAID_IMMOVABLE_PROPERTY = TRUE
  A_VACFS_FURTHER_SUPPLY_USE:
    statement: The vessels or aircraft are used for making further supply of such vessels or aircraft
    order: LOW
    rule: F_GOODS_USED_FOR_FURTHER_SUPPLY = TRUE
  A_VACFS_FURTHER_SUPPLY_TAXABLE:
    statement: The further supply of such vessels or aircraft, for the making of which they are used, is a taxable supply
    order: LOW
    rule: F_FURTHER_SUPPLY_IS_TAXABLE = TRUE
  A_PASS_TRANSPORT:
    statement: The vessels or aircraft are used for making the supply of transportation of passengers, as required by the
      exception except when they are used for making the following taxable supplies, namely transportation of passengers.
    order: LOW
    rule: F_GOODS_USE_SUPPLY_TYPE = 'PASSENGER_TRANSPORT'
  A_TAXABLE_SUPPLY:
    statement: The supply of transportation of passengers for which the vessels or aircraft are used is a taxable supply,
      as required by the exception except when they are used for making the following taxable supplies, namely transportation
      of passengers.
    order: LOW
    rule: F_SUPPLY_TAXABILITY = 'TAXABLE'
  A_VACNT_TRAIN:
    statement: 'Except when they are used for making the following taxable supplies, input tax credit shall not be available:
      the vessels or aircraft are used for making the supply of imparting training on navigating such vessels'
    order: LOW
    rule: F_GOODS_USED_FOR_NAVIGATION_TRAINING = TRUE
  A_VACNT_TAXABLE:
    statement: 'Except when they are used for making the following taxable supplies, input tax credit shall not be available:
      the supply of imparting training on navigating such vessels, for which the vessels or aircraft are used, is a taxable
      supply'
    order: LOW
    rule: F_SUPPLY_IS_TAXABLE = TRUE
  A_USE_AIRCRAFT_FLYING_TRAINING:
    statement: The aircraft is used for imparting training on flying such aircraft.
    order: LOW
    rule: F_AIRCRAFT_USE_PURPOSE = 'FLYING_TRAINING'
  A_SUPPLY_TRAINING_TAXABLE:
    statement: The supply of imparting training on flying aircraft is a taxable supply.
    order: HIGH
    interpretation: Based on the supply details, is the supply of imparting training on flying the aircraft a taxable supply
      under GST law?
    grounding:
    - F_SUPPLY_DESCRIPTION
  A_INS:
    statement: The service in respect of which input tax credit is considered is a service of general insurance
    order: LOW
    if_false: F_SERVICE_TYPE is another known value
    rule: F_SERVICE_TYPE = 'GENERAL_INSURANCE'
  A_SERVICING:
    statement: The service in respect of which input tax credit is considered is a service of servicing
    order: LOW
    if_false: F_SERVICE_TYPE is another known value
    rule: F_SERVICE_TYPE = 'SERVICING'
  A_REPAIR:
    statement: The service in respect of which input tax credit is considered is a service of repair
    order: LOW
    if_false: F_SERVICE_TYPE is another known value
    rule: F_SERVICE_TYPE = 'REPAIR'
  A_MAINT:
    statement: The service in respect of which input tax credit is considered is a service of maintenance
    order: LOW
    if_false: F_SERVICE_TYPE is another known value
    rule: F_SERVICE_TYPE = 'MAINTENANCE'
  A_MV:
    statement: The service relates to a motor vehicle, and the credit is barred only in so far as the service relates to that
      motor vehicle
    order: LOW
    if_false: F_SERVICE_CONVEYANCE_TYPE is another known value
    rule: F_SERVICE_CONVEYANCE_TYPE = 'MOTOR_VEHICLE'
  A_VESSEL:
    statement: The service relates to a vessel, and the credit is barred only in so far as the service relates to that vessel
    order: LOW
    if_false: F_SERVICE_CONVEYANCE_TYPE is another known value
    rule: F_SERVICE_CONVEYANCE_TYPE = 'VESSEL'
  A_AIRCRAFT:
    statement: The service relates to an aircraft, and the credit is barred only in so far as the service relates to that
      aircraft
    order: LOW
    if_false: F_SERVICE_CONVEYANCE_TYPE is another known value
    rule: F_SERVICE_CONVEYANCE_TYPE = 'AIRCRAFT'
  A_SUCH_SERVICES:
    statement: The input tax credit is in respect of such services, being the services to which the parent clause (ab) applies
    order: HIGH
    interpretation: Is the service on which credit is considered one of the services referred to in the parent clause (ab)
      that this proviso qualifies? The proviso does not restate the list, so it is taken from the parent clause.
    grounding:
    - F_SERVICE_TYPE
    - F_SERVICE_CONVEYANCE_TYPE
  A_FOOD:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of food
      and beverages
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not FOOD_AND_BEVERAGES
    rule: F_INPUT_SUPPLY_CATEGORY = 'FOOD_AND_BEVERAGES'
  A_CATER:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of outdoor
      catering
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not OUTDOOR_CATERING
    rule: F_INPUT_SUPPLY_CATEGORY = 'OUTDOOR_CATERING'
  A_BEAUTY:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of beauty
      treatment
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not BEAUTY_TREATMENT
    rule: F_INPUT_SUPPLY_CATEGORY = 'BEAUTY_TREATMENT'
  A_HEALTH:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of health
      services
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not HEALTH_SERVICES
    rule: F_INPUT_SUPPLY_CATEGORY = 'HEALTH_SERVICES'
  A_COSMETIC:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of cosmetic
      and plastic surgery
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not COSMETIC_AND_PLASTIC_SURGERY
    rule: F_INPUT_SUPPLY_CATEGORY = 'COSMETIC_AND_PLASTIC_SURGERY'
  A_CONV_LEASE:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of leasing
      of motor vehicles, vessels or aircraft
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not CONVEYANCE_LEASING, or F_SERVICE_CONVEYANCE_TYPE is OTHER or NONE
    rule: F_INPUT_SUPPLY_CATEGORY = 'CONVEYANCE_LEASING' AND F_SERVICE_CONVEYANCE_TYPE IN ['MOTOR_VEHICLE', 'VESSEL', 'AIRCRAFT']
  A_CONV_RENT:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of renting
      of motor vehicles, vessels or aircraft
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not CONVEYANCE_RENTING, or F_SERVICE_CONVEYANCE_TYPE is OTHER or NONE
    rule: F_INPUT_SUPPLY_CATEGORY = 'CONVEYANCE_RENTING' AND F_SERVICE_CONVEYANCE_TYPE IN ['MOTOR_VEHICLE', 'VESSEL', 'AIRCRAFT']
  A_CONV_HIRE:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of hiring
      of motor vehicles, vessels or aircraft
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not CONVEYANCE_HIRING, or F_SERVICE_CONVEYANCE_TYPE is OTHER or NONE
    rule: F_INPUT_SUPPLY_CATEGORY = 'CONVEYANCE_HIRING' AND F_SERVICE_CONVEYANCE_TYPE IN ['MOTOR_VEHICLE', 'VESSEL', 'AIRCRAFT']
  A_LIFE:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of life
      insurance
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not LIFE_INSURANCE
    rule: F_INPUT_SUPPLY_CATEGORY = 'LIFE_INSURANCE'
  A_HINS:
    statement: Input tax credit shall not be available in respect of a supply of goods or services or both consisting of health
      insurance
    order: LOW
    if_false: F_INPUT_SUPPLY_CATEGORY is known and is not HEALTH_INSURANCE
    rule: F_INPUT_SUPPLY_CATEGORY = 'HEALTH_INSURANCE'
groups:
  G_KIND:
    name: Apparatus equipment or machinery
    logic: ANY
    members:
    - A_APPARATUS
    - A_EQUIPMENT
    - A_MACHINERY
    description: The item is apparatus, equipment or machinery
  G_FIXING:
    name: Fixed to earth by foundation or structural support
    logic: ANY
    members:
    - A_FIXED_FOUNDATION
    - A_FIXED_STRUCTURAL
    description: The item is fixed to earth by foundation or by structural support
  G_CORE:
    name: Core meaning of plant and machinery
    logic: ALL
    members:
    - G_KIND
    - G_FIXING
    - A_USED
    description: Apparatus, equipment or machinery fixed to earth by foundation or structural support and used for making
      outward supply of goods or services or both
  G_INCLUDED:
    name: Included foundation and structural supports
    logic: ANY
    members:
    - A_INCL_FOUNDATION
    - A_INCL_STRUCTURAL
    description: The item is such foundation or such structural support
  G_EXCLUDED:
    name: Excluded land building or other civil structures
    logic: ANY
    members:
    - A_EXCL_LAND
    - A_EXCL_BUILDING
    - A_EXCL_CIVIL
    description: The item is land, building or any other civil structure
  G_CORE_PAMET:
    name: Main or included limb
    logic: ANY
    members:
    - G_MAIN
    - G_INCLUDED_PAMET
    description: The item qualifies through the main means limb or through the includes limb for such foundation and structural
      supports.
  G_MAIN:
    name: Main means limb
    logic: ALL
    members:
    - G_KIND_PAMET
    - G_FIXING_PAMET
    - A_OUTWARD_USE
    description: The item is apparatus, equipment or machinery, is fixed to earth by foundation or structural support, and
      is used for making outward supply of goods or services or both.
  G_KIND_PAMET:
    name: Apparatus equipment or machinery
    logic: ANY
    members:
    - A_APPARATUS_PAMET
    - A_EQUIPMENT_PAMET
    - A_MACHINERY_PAMET
    description: 'The item falls in any one of the listed kinds: apparatus, equipment or machinery.'
  G_FIXING_PAMET:
    name: Fixed by foundation or structural support
    logic: ANY
    members:
    - A_FIXED_FOUNDATION_PAMET
    - A_FIXED_STRUCTURAL_PAMET
    description: The item is fixed to earth by foundation or by structural support, either being sufficient.
  G_INCLUDED_PAMET:
    name: Such foundation and structural supports
    logic: ANY
    members:
    - A_INCL_FOUNDATION_PAMET
    - A_INCL_STRUCTURAL_PAMET
    description: The item is the foundation or a structural support of apparatus, equipment or machinery that itself qualifies
      under the definition.
  G_CORE_PAMEP:
    name: Core plant and machinery limb
    logic: ALL
    members:
    - G_KIND_PAMEP
    - G_FIXING_PAMEP
    - A_USED_OUTWARD
    description: The item is apparatus, equipment or machinery. It is fixed to earth by foundation or structural support.
      It is used for making outward supply of goods or services or both.
  G_KIND_PAMEP:
    name: Kind of item
    logic: ANY
    members:
    - A_APPARATUS_PAMEP
    - A_EQUIPMENT_PAMEP
    - A_MACHINERY_PAMEP
    description: Apparatus, equipment and machinery are the listed kinds. An item qualifies under any one of them.
  G_FIXING_PAMEP:
    name: Fixing to earth
    logic: ANY
    members:
    - A_FIX_FOUNDATION
    - A_FIX_STRUCTURAL
    description: The item is fixed to earth by foundation or by structural support. These are alternatives.
  G_INCLUDED_PAMEP:
    name: Included foundation and structural supports
    logic: ANY
    members:
    - A_FOUNDATION_INCL
    - A_STRUCT_SUPPORT_INCL
    description: Plant and machinery includes such foundation and structural supports of qualifying apparatus, equipment or
      machinery.
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_CONDITIONS:
    name: Conditions for Blocking
    logic: ANY
    members:
    - A_GOODS_LOST
    - A_GOODS_STOLEN
    - A_GOODS_DESTROYED
    - A_GOODS_WRITTEN_OFF
    - A_GOODS_GIFT
    - A_GOODS_FREE_SAMPLES
    description: ITC is blocked if the goods are lost, stolen, destroyed, written off, or disposed of as a gift or free sample.
  G_BCCIP:
    name: Conditions for blocking ITC on construction of immovable property
    logic: ALL
    members:
    - A_BCCIP_1
    - A_BCCIP_2
    - A_BCCIP_3
    - A_BCCIP_4
  G_BCTPUS_1:
    name: Tax Payment Conditions
    logic: ANY
    members:
    - A_BCTPUS_1
    - A_BCTPUS_2
    - A_BCTPUS_3
    description: The prohibition applies if tax was paid under any of Sections 74, 129, or 130.
  G_ENGAGED_IN:
    name: Recipient engaged in limb (I) or limb (II)
    logic: ANY
    members:
    - A_MANUFACTURER
    - A_GENERAL_INSURER
    description: The taxable person receiving the services is engaged in the manufacture of such conveyances or in the supply
      of general insurance services for such conveyances insured by him. Either limb is sufficient. Failure of one limb does
      not defeat the proviso if the other limb is met
  G_BLOCKED_VEHICLE:
    name: Blocked passenger motor vehicle
    logic: ALL
    members:
    - A_ITC_MV
    - A_MV_PERSONS
    - A_MV_SEAT
    description: The input tax credit is in respect of a motor vehicle for transportation of persons having approved seating
      capacity of not more than thirteen persons (including the driver)
  G_FURTHER_SUPPLY_EXCEPTION:
    name: Except when used for taxable further supply
    logic: ALL
    members:
    - A_FURTHER_SUPPLY
    - A_FS_TAXABLE
    description: 'Except when the motor vehicles are used for making the following taxable supplies, namely: further supply
      of such motor vehicles. The exception requires both the use for further supply and the taxability of that further supply'
  G_VEHICLE:
    name: Blocked passenger motor vehicle
    logic: ALL
    members:
    - A_MV_PERSONS_BCMVPT
    - A_SEAT_LIMIT
    description: The credit is in respect of a motor vehicle for transportation of persons and that vehicle has approved seating
      capacity of not more than thirteen persons including the driver
  G_VEHICLE_BCMVDT:
    name: Blocked passenger motor vehicle
    logic: ALL
    members:
    - A_MVPERS
    - A_SEAT
    description: The item is a motor vehicle for transportation of persons and its approved seating capacity is not more than
      thirteen persons including the driver
  G_EXCEPT:
    name: Driving training exception
    logic: ALL
    members:
    - A_TRAIN_USE
    - A_TAXABLE
    description: The vehicle is used for making supplies of imparting training on driving such motor vehicles and those supplies
      are taxable supplies
  G_1:
    name: Input is a vessel or aircraft
    logic: ANY
    members:
    - A_0
    - A_1
  G_PROVISO_CONDITIONS:
    name: Proviso conditions
    logic: ALL
    members:
    - A_SUCH_INPUT
    - A_OBLIGATORY
    description: Both the subject-goods scope and the statutory employer obligation must hold
  G_M_BCETB:
    name: Employee Vacation Benefits
    logic: ANY
    members:
    - A_M_BCETB_1
    - A_M_BCETB_2
    - A_M_BCETB_3
    description: The supply is one of the specified or similar types of employee vacation travel benefits.
  G_M_BCCMHC:
    name: List of blocked memberships
    logic: ANY
    members:
    - A_M_BCCMHC_1
    - A_M_BCCMHC_2
    description: The supply is a membership of a club OR a health and fitness centre.
  G_USE_PURPOSE_CAFSCS:
    name: Qualifying use of inward supply
    logic: ANY
    members:
    - A_OUTWARD_SAME_CATEGORY
    - A_COMPOSITE_ELEMENT
    description: The inward supply is used for making an outward taxable supply of the same category of goods or services
      or both, or as an element of a taxable composite or mixed supply
  G_CLRM_ELIG:
    name: Registered person turnover eligibility
    logic: ALL
    members:
    - A_CLRM_REG
    - A_CLRM_TO
    description: The person is registered and the preceding-year aggregate turnover did not exceed fifty lakh rupees
  G_CLRM_RATE:
    name: Prescribed rate within manufacturer ceiling
    logic: ALL
    members:
    - A_CLRM_RATEPRE
    - A_CLRM_CAP
    description: The amount is computed at the prescribed rate, and that rate does not exceed one per cent. of turnover in
      State or Union territory
  G_CLRM_S9:
    name: Section 9(3) or 9(4) supply
    logic: ANY
    members:
    - A_CLRM_S93
    - A_CLRM_S94
    description: Tax on the supply is payable under section 9(3) or under section 9(4)
  G_ELIG:
    name: Clause (b) composition eligibility
    logic: ALL
    members:
    - A_REG
    - A_TURN
    - A_SCH2
    - A_S9
    - A_COND
    description: All of the following hold. The person is registered. The preceding-year aggregate turnover limit is met.
      The person is engaged in Schedule II para 6(b) supplies. The option operates within the subjection to section 9(3) and
      9(4). The prescribed conditions and restrictions are satisfied.
  G_AMOUNT:
    name: Composition amount computation
    logic: ALL
    members:
    - A_PRESCRIBED
    - A_RATECAP
    - G_BASE
    description: The amount is calculated at the prescribed rate. That rate does not exceed two and a half per cent. and is
      applied to turnover in State or turnover in Union territory.
  G_BASE:
    name: Turnover base alternatives
    logic: ANY
    members:
    - A_BASE_STATE
    - A_BASE_UT
    description: The base is turnover in State or, alternatively, turnover in Union territory.
  G_M_CRFOS_ELIGIBILITY:
    name: Eligibility Criteria
    logic: ALL
    members:
    - A_M_CRFOS_1
    - A_M_CRFOS_2
    - A_M_CRFOS_3
    - G_M_CRFOS_NO_RCM
    - A_M_CRFOS_6
  G_M_CRFOS_NO_RCM:
    name: RCM Inapplicability
    logic: ALL
    members:
    - A_M_CRFOS_4
    - A_M_CRFOS_5
  G_FORM:
    name: Form of exempt financial service
    logic: ANY
    members:
    - A_DEPOSIT
    - A_LOAN
    - A_ADVANCE
    description: The services are provided by way of extending deposits, loans or advances. These are alternatives.
  G_CONSIDERATION:
    name: Form of consideration
    logic: ANY
    members:
    - A_INTEREST
    - A_DISCOUNT
    description: The consideration is represented by way of interest or discount. These are alternatives.
  G_INCREASE:
    name: Conditions of a valid limit increase
    logic: ALL
    members:
    - A_NOTIF
    - A_HIGHER
    - A_CAP
    - A_REC
    description: All four conditions must hold together
  A_M_PSOSBCD_1A:
    name: Any of the referred steps (A_M_PSOSBCD_1A)
    logic: ANY
    members:
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    description: TRUE when any step of the law this check refers to is TRUE
  A_M_PSOSBCD_1B:
    name: Any of the referred steps (A_M_PSOSBCD_1B)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_M_PSOSBCD_1:
    name: Person has opted for composition levy under specified clauses
    logic: ANY
    members:
    - A_M_PSOSBCD_1A
    - A_M_PSOSBCD_1B
    - PD_M_CRFOS
  A_ECOSOS_3:
    name: Any of the referred steps (A_ECOSOS_3)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_ECOSOS_1:
    name: Service Supply Condition
    logic: ANY
    members:
    - A_ECOSOS_2
    - A_ECOSOS_3
    description: The person either is not engaged in the supply of services, or is engaged in a supply of services permitted
      by sub-section (1).
  G_M_ECOIS_1:
    name: Eligibility conditions for composition levy under S10(2)(c)
    logic: ALL
    members:
    - A_M_ECOIS_1
    - A_M_ECOIS_2
  G_M_ECFTT_1:
    name: Eligibility conditions for composition levy
    logic: ALL
    members:
    - A_M_ECFTT_1
    - A_M_ECFTT_2
    - A_M_ECFTT_3
  A_AROPMOI_2:
    name: Any of the referred steps (A_AROPMOI_2)
    logic: ANY
