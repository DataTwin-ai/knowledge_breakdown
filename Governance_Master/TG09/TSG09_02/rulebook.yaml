products:
  PD_PAMEL:
    statement: Within this Chapter or Chapter VI, an item is plant and machinery when it is qualifying fixed apparatus, equipment
      or machinery used for making outward supply, or when it is such foundation or structural support. In either case it
      must not be land, building or any other civil structure. Whether such
  PD_PAMET:
    statement: Within this Chapter or Chapter VI, an item is plant and machinery if it meets the main limb or the included
      foundation or structural support limb, and it is not a telecommunication tower.
  PD_PAMEP_PM:
    statement: Where the definition applies, an item is plant and machinery if it meets the core limb or is an included foundation
      or structural support. It must also not be a pipeline laid outside the factory premises.
  PD_PAMEP_NOT_PM:
    statement: Where the definition applies, an item is not plant and machinery if it meets neither the core limb nor the
      inclusion. An item is also not plant and machinery if it is a pipeline laid outside the factory premises. The pipeline
      exclusion overrides an otherwise qualifying item.
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_BCPC:
    statement: Where the goods or services or both are used for personal consumption, input tax credit is not available. This
      applies notwithstanding sub-section (1) of section 16 and sub-section (1) of section 18.
  PD_BCNTP:
    statement: Input tax credit is blocked if the supply is received by a non-resident taxable person and the exception for
      imported goods does not apply.
  PD_BCFLSG:
    statement: Input tax credit is not available if any of the specified conditions regarding the disposition of goods are
      met.
  PD_BCCIP:
    statement: ITC_BLOCKED
  PD_BCTPUS:
    statement: Input tax credit is blocked if it is in respect of tax paid under sections 74, 129, or 130. This prohibition
      overrides the general ITC eligibility rules in Section 16(1) and 18(1).
  PD_CATMOI:
    statement: Credit on such services shall be available when the services are such services, are received by a taxable person,
      and that person is engaged in at least one of limb (I) or limb (II)
  PD_BCMVFS:
