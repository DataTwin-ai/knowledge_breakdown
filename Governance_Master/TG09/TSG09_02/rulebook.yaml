triggers:
  CT_BCNTP_1:
    question: The receipt is for 'both' goods and services. Does the exception for imported goods apply to a portion of the
      credit?
    trigger: F_INPUT_SUBJECT_KIND = 'BOTH'
    beside: LE_BCNTP
  CT_S9:
    question: Does sub-section (3) or (4) of section 9 apply to the supplies concerned so that it prevails over the composition
      option to that extent?
