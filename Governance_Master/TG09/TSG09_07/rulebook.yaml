  A_PSDAC_AGREEMENT:
    statement: Such discount is established in terms of an agreement entered into at or before the time of such supply
    order: LOW
    rule: F_DISCOUNT_AGREEMENT_TIMING IN ['BEFORE_SUPPLY', 'AT_SUPPLY']
  A_PSDAC_LINKED:
    statement: Such discount is specifically linked to relevant invoices
    order: LOW
    rule: F_DISCOUNT_LINKED_TO_INVOICES = TRUE
  A_ITC_ATTRIB:
    statement: Input tax credit is attributable to the discount on the basis of a document issued by the supplier
    order: LOW
    rule: F_ITC_ATTRIBUTABLE_TO_DISCOUNT = TRUE AND F_DISCOUNT_DOCUMENT_ISSUED_BY_SUPPLIER = TRUE
  A_ITC_REV:
    statement: The input tax credit attributable to the discount has been reversed by the recipient of the supply
    order: LOW
    rule: F_ITC_REVERSED_BY_RECIPIENT = TRUE
  A_DISC_AFTER:
    statement: The discount is given after the supply has been effected
    order: LOW
    rule: F_SUPPLY_DISCOUNT_TIMING = 'AFTER_SUPPLY'
  A_M_NSVD_1:
    statement: The supply is of a type notified by the Government.
    order: LOW
    rule: F_M_NSVD_1 = TRUE
  A_M_NSVD_2:
    statement: The notification by the Government was made on the recommendations of the Council.
    order: LOW
    rule: F_M_NSVD_2 = TRUE
  A_M_NSVD_3:
    statement: A manner for determining the value of such supplies has been prescribed.
    order: LOW
    rule: F_M_NSVD_3 = TRUE
  A_REGISTERED:
    statement: The person supplying the capital goods or plant and machinery is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED_PERSON = TRUE
  A_ITC_TAKEN_POSOCG:
    statement: Input tax credit has been taken on the said capital goods or plant and machinery that are supplied
    order: LOW
    rule: F_ITC_TAKEN_ON_SUPPLIED_GOODS = TRUE
  A_CAPGOODS:
    statement: The supply is of capital goods
    order: LOW
    rule: F_SUPPLY_IS_CAPITAL_GOODS = TRUE
  A_PLANT:
    statement: The supply is of plant and machinery
    order: LOW
    rule: F_SUPPLY_IS_PLANT_AND_MACHINERY = TRUE
  A_REDUCED_ITC:
    statement: The first amount for comparison is the input tax credit taken on the supplied goods, reduced by such percentage
      points as may be prescribed
    order: LOW
    rule: F_ITC_TAKEN_AMOUNT_ON_SUPPLIED_GOODS IS_SET AND F_CAPITAL_GOODS_CREDIT_REDUCTION_POINTS_PRESCRIBED IS_SET AND F_ITC_REDUCED_CREDIT_AMOUNT
      IS_SET
  A_HIGHER:
    statement: The amount payable shall be the higher of the reduced input tax credit amount or the tax on the transaction
      value
    order: LOW
    rule: F_PAYMENT_S18_6_HIGHER_BASIS IN ['REDUCED_CREDIT', 'TRANSACTION_VALUE_TAX', 'EQUAL'] AND F_PAYMENT_S18_6_AMOUNT_PAYABLE
      IS_SET
  A_SCOPE_CG_PM:
    statement: The case involves capital goods or plant and machinery.
    order: LOW
    rule: F_ASSET_IS_CG_PM = 'TRUE'
groups:
  G_VOSITV_CONDITIONS:
    name: Conditions for accepting transaction value
    logic: ALL
    members:
    - A_VOSITV_01
    - A_VOSITV_02
    description: 'Both conditions must be met: the parties are not related AND the price is the sole consideration for the
      supply.'
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_KIND:
    name: Apparatus equipment or machinery
    logic: ANY
    members:
    - A_APPARATUS
    - A_EQUIPMENT
    - A_MACHINERY
    description: The item is apparatus, equipment or machinery
  G_FIXING:
    name: Fixed to earth by foundation or structural support
    logic: ANY
    members:
    - A_FIXED_FOUNDATION
    - A_FIXED_STRUCTURAL
    description: The item is fixed to earth by foundation or by structural support
  G_CORE:
    name: Core meaning of plant and machinery
    logic: ALL
    members:
    - G_KIND
    - G_FIXING
    - A_USED
    description: Apparatus, equipment or machinery fixed to earth by foundation or structural support and used for making
      outward supply of goods or services or both
  G_INCLUDED:
    name: Included foundation and structural supports
    logic: ANY
    members:
    - A_INCL_FOUNDATION
    - A_INCL_STRUCTURAL
    description: The item is such foundation or such structural support
  G_EXCLUDED:
    name: Excluded land building or other civil structures
    logic: ANY
    members:
    - A_EXCL_LAND
    - A_EXCL_BUILDING
    - A_EXCL_CIVIL
    description: The item is land, building or any other civil structure
  G_CORE_PAMET:
    name: Main or included limb
    logic: ANY
    members:
    - G_MAIN
    - G_INCLUDED_PAMET
    description: The item qualifies through the main means limb or through the includes limb for such foundation and structural
      supports.
  G_MAIN:
    name: Main means limb
    logic: ALL
    members:
    - G_KIND_PAMET
    - G_FIXING_PAMET
    - A_OUTWARD_USE
    description: The item is apparatus, equipment or machinery, is fixed to earth by foundation or structural support, and
      is used for making outward supply of goods or services or both.
  G_KIND_PAMET:
    name: Apparatus equipment or machinery
    logic: ANY
    members:
    - A_APPARATUS_PAMET
    - A_EQUIPMENT_PAMET
    - A_MACHINERY_PAMET
    description: 'The item falls in any one of the listed kinds: apparatus, equipment or machinery.'
  G_FIXING_PAMET:
    name: Fixed by foundation or structural support
    logic: ANY
    members:
    - A_FIXED_FOUNDATION_PAMET
    - A_FIXED_STRUCTURAL_PAMET
    description: The item is fixed to earth by foundation or by structural support, either being sufficient.
  G_INCLUDED_PAMET:
    name: Such foundation and structural supports
    logic: ANY
    members:
    - A_INCL_FOUNDATION_PAMET
    - A_INCL_STRUCTURAL_PAMET
    description: The item is the foundation or a structural support of apparatus, equipment or machinery that itself qualifies
      under the definition.
  G_CORE_PAMEP:
    name: Core plant and machinery limb
    logic: ALL
    members:
    - G_KIND_PAMEP
    - G_FIXING_PAMEP
    - A_USED_OUTWARD
    description: The item is apparatus, equipment or machinery. It is fixed to earth by foundation or structural support.
      It is used for making outward supply of goods or services or both.
  G_KIND_PAMEP:
    name: Kind of item
    logic: ANY
    members:
    - A_APPARATUS_PAMEP
    - A_EQUIPMENT_PAMEP
    - A_MACHINERY_PAMEP
    description: Apparatus, equipment and machinery are the listed kinds. An item qualifies under any one of them.
  G_FIXING_PAMEP:
    name: Fixing to earth
    logic: ANY
    members:
    - A_FIX_FOUNDATION
    - A_FIX_STRUCTURAL
    description: The item is fixed to earth by foundation or by structural support. These are alternatives.
  G_INCLUDED_PAMEP:
    name: Included foundation and structural supports
    logic: ANY
    members:
    - A_FOUNDATION_INCL
    - A_STRUCT_SUPPORT_INCL
    description: Plant and machinery includes such foundation and structural supports of qualifying apparatus, equipment or
      machinery.
  G_JW_INPUTS:
    name: Inputs sent for job work
    logic: ALL
    members:
    - A_INPUTS
    - A_SENT_JW
    description: The goods are inputs and those inputs are sent to a job worker for job work
  G_ENTITLEMENT:
    name: Principal credit on inputs sent for job work
    logic: ALL
    members:
    - A_PRINCIPAL_CDISD
    - A_INPUTS_CDISD
    - A_JOB_WORK
    description: The claimant is the principal, the credit is on inputs, and the inputs are sent to a job worker for job work.
  G_DIRECT_CASE:
    name: Direct dispatch override case
    logic: ALL
    members:
    - A_PRINCIPAL_CDISD
    - A_INPUTS_CDISD
    - A_JOB_WORK
    - A_DIRECT
    description: All entitlement elements are met. In addition, the inputs were directly sent to the job worker without first
      being brought to the principal's place of business.
  G_NEITHER_RETURNED_NOR_SUPPLIED:
    name: Inputs neither returned nor supplied within one year
    logic: ALL
    members:
    - A_NOT_RECEIVED_BACK
    - A_NOT_SUPPLIED_FROM_JOB_WORKER
    description: The source joins the two negative limbs with or (not received back ... or are not supplied). The limbs are
      read as a joint failure. Receipt back by the principal and supply from the job worker's place of business under section
      143(1)(a) or (b) are alternative permitted dispositions. Either dispositi
  G_PROVISO:
    name: Proviso applies and period start fixed
    logic: ALL
    members:
    - A_DIRECT_ISDPC
    - A_JW_RECEIPT
    description: Both the direct-sending condition and the job worker receipt-date counting rule operate together
  G_ELIGIBILITY:
    name: Eligibility for credit on capital goods sent for job work
    logic: ALL
    members:
    - A_PRINCIPAL_ROLE
    - A_CAPITAL_GOODS_CREDIT
    - A_SENT_JOB_WORK
    - A_PRESCRIBED_CONDITIONS
    description: All four cumulative conditions must hold.
  G_CDCGSD_ALL:
    name: Direct dispatch capital goods credit conditions
    logic: ALL
    members:
    - A_PRINCIPAL_CDCGSD
    - A_CG_CREDIT
    - A_CG_SENT_JW
    - A_CG_DIRECT
    description: 'All four source-backed elements must hold for the Section 19(5) entitlement to operate: principal status,
      credit on capital goods, sending of the capital goods to a job worker for job work, and direct dispatch without first
      bringing the goods to the principal''s place of business.'
  G_M_TEFDS_01:
    name: List of excluded item types
    logic: ANY
    members:
    - A_M_TEFDS_02
    - A_M_TEFDS_03
    - A_M_TEFDS_04
  G_DSOUCG_CONDITIONS:
    name: Deemed Supply Conditions
    logic: ALL
    members:
    - G_CONTEXT
    - A_NOT_RETURNED_3Y
    description: All conditions for the deemed supply of unreturned capital goods must be met.
  G_CONTEXT:
    name: Job Work Context
    logic: ALL
    members:
    - A_CAPITAL_GOODS_SENT
    - A_SENDER_IS_PRINCIPAL
    - A_ITC_TAKEN
    description: The context is that a principal has sent capital goods, on which ITC was taken, for job work.
  G_STOTVO_CONDITIONS:
    name: Conditions for scrap tax option
    logic: ALL
    members:
    - A_STOTVO_GOODS_TYPE
    - A_STOTVO_SUPPLIED_AS_SCRAP
  G_CONDITIONS:
    name: Conditions for job work supply treatment
    logic: ALL
    members:
    - A_SCOPE_S22
    - A_SUPPLY_OF_GOODS
    - A_POST_JOB_WORK
    - A_BY_REGISTERED_JW
  G_M_RPOOD_1:
    name: Reciprocal Officer/Director Roles
    logic: ALL
    members:
    - A_M_RPOOD_1
    - A_M_RPOOD_2
  G_RP25PS:
    name: Holding Condition
    logic: ANY
    members:
    - A_RP25PS_OWNS
    - A_RP25PS_CONTROLS
    - A_RP25PS_HOLDS
    description: The condition is met if any of the holding types (owns, controls, or holds) by a third party are satisfied.
  G_CONTROL:
    name: Test for Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL
    - A_INDIRECT_CONTROL
    description: A test to determine if one person controls another, either directly or indirectly.
  G_M_RPCC:
    name: Common Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL_RPCC
    - A_INDIRECT_CONTROL_RPCC
    description: The condition is met if there is either direct or indirect control by a common third person.
  G_RPJC_1:
    name: Joint control of a third person
    logic: ANY
    members:
    - A_RPJC_1
    - A_RPJC_2
  G_SOLE_ROLE:
    name: Sole agent or sole distributor or sole concessionaire
    logic: ANY
    members:
    - A_SOLE_AGENT
    - A_SOLE_DISTRIBUTOR
    - A_SOLE_CONCESSIONAIRE
    description: Any one of the three sole-role relationships is enough
  G_LEVY_KIND:
    name: Kind of levy
    logic: ANY
    members:
    - A_TAX
    - A_DUTY
    - A_CESS
    - A_FEE
    - A_CHARGE
    description: The amount is any one of a tax, duty, cess, fee or charge. The list taxes, duties, cesses, fees and charges
      covers every kind, so a single amount needs to be only one of them.
  G_M_IOIFDP_1:
    name: Delayed Payment Charges
    logic: ANY
    members:
    - A_M_IOIFDP_1
    - A_M_IOIFDP_2
    - A_M_IOIFDP_3
  G_GOVT_SUBSIDY:
    name: Government provided subsidy
    logic: ANY
    members:
    - A_SUBSIDY_FROM_CG
    - A_SUBSIDY_FROM_SG
    description: The subsidy is provided by the Central Government or by a State Government. Either one triggers the exclusion
  G_SAIIVE_CONDITIONS:
    name: Subsidy inclusion conditions
    logic: ALL
    members:
    - A_SAIIVE_SCOPE
    - A_SAIIVE_RECEIVER
    description: Both the sub-section scope and the receipt of the subsidy by the supplier must hold
  G_DISC_TIMING:
    name: Discount given before or at the time of supply
    logic: ANY
    members:
    - A_DISC_BEFORE
    - A_DISC_AT
    description: The discount is given before the time of the supply OR at the time of the supply.
  G_PSDAC_CONDITIONS:
    name: Post-supply discount exclusion conditions
    logic: ALL
    members:
    - A_PSDAC_NOT_INCLUDE
    - A_PSDAC_AFTER
    - A_PSDAC_AGREEMENT
    - A_PSDAC_LINKED
    description: The amount is a discount that the value shall not include AND it is given after the supply AND it is established
      by an agreement at or before the supply AND it is specifically linked to relevant invoices
  G_PSDIR_COND:
    name: Post-supply discount with recipient ITC reversal
    logic: ALL
    members:
    - A_DISC_AFTER
    - A_ITC_ATTRIB
    - A_ITC_REV
    description: 'All three conditions must hold together: the discount is given after the supply, ITC is attributable to
      it on a supplier document, and that ITC has been reversed by the recipient.'
  G_M_NSVD_1:
    name: Conditions for Prescribed Valuation
    logic: ALL
    members:
    - A_M_NSVD_1
    - A_M_NSVD_2
    - A_M_NSVD_3
    description: All conditions must be met for the special valuation method to apply.
  A_TV_TAX:
    name: Any of the referred steps (A_TV_TAX)
    logic: ANY
    members:
    - PD_DBOAS
    - PD_DOPIL
    - PD_IOOTIV
    - PD_M_IOIEIV
    - PD_M_IOIFDP
    - PD_M_NSVD
    - PD_M_RISLI
    - PD_M_RPCC
    - PD_M_RPEAE
    - PD_M_RPOOD
    - PD_M_VCBDPM
    - PD_PSDAC
    - PD_PSDIR
    - PD_RP25PS
    - PD_RPDIC
    - PD_RPJC
    - PD_RPLRP
    - PD_RPSAD
    - PD_RPSFM
    - PD_SAIIVE
    - PD_VISLTP
    - PD_VOSITV
    description: TRUE when any step of the law this check refers to is TRUE
  G_TRIGGER:
    name: Section 18(6) trigger conditions
    logic: ALL
    members:
    - A_REGISTERED
    - A_ITC_TAKEN_POSOCG
    - G_ITEM
    description: All conditions that bring the section 18(6) payment obligation into operation.
  G_ITEM:
    name: Supply of capital goods or plant and machinery
    logic: ANY
    members:
    - A_CAPGOODS
    - A_PLANT
    description: The goods supplied are capital goods or plant and machinery.
  G_AMOUNT:
    name: Amount payable computation
    logic: ALL
    members:
    - A_REDUCED_ITC
    - A_TV_TAX
    - A_HIGHER
    description: The amount payable is determined by calculating two amounts and selecting the higher one.
  A_PAYMENT_OBLIGATION:
    name: Any of the referred steps (A_PAYMENT_OBLIGATION)
    logic: ANY
    members:
    - PD_DBOAS
    - PD_DOPIL
    - PD_IOOTIV
    - PD_M_IOIEIV
    - PD_M_IOIFDP
    - PD_M_NSVD
    - PD_M_RISLI
    - PD_M_RPCC
    - PD_M_RPEAE
    - PD_M_RPOOD
    - PD_M_VCBDPM
    - PD_PSDAC
    - PD_PSDIR
    - PD_RP25PS
    - PD_RPDIC
    - PD_RPJC
    - PD_RPLRP
    - PD_RPSAD
    - PD_RPSFM
    - PD_SAIIVE
    - PD_VISLTP
    - PD_VOSITV
    description: TRUE when any step of the law this check refers to is TRUE
  G_M_POCGOC:
    name: Payment obligation on capital goods for cancellation
    logic: ALL
    members:
    - A_SCOPE_CG_PM
    - A_PAYMENT_OBLIGATION
    description: The rule applies to capital goods or plant and machinery, and the required payment must be made.
outcomes:
  LE_MOPIS:
    outcome: PRINCIPAL_MEANING_APPLIES
    expr: A_SEC19_PURPOSE AND A_SEC143_PERSON
    module: M_MOPIS
    description: The person is the principal for Section 19 only if the term is being applied for the purpose of Section 19
      and the person is the person referred to in section 143.
  LE_DOPIL:
    outcome: ENTITY_IS_PERSON_AS_LEGAL_PERSON
    expr: A_LEGAL_PERSON_INCLUDED
    module: M_DOPIL
    description: An entity that is a legal person is within the term person for the purposes of this Act.
  LE_VOSITV:
    outcome: VALUE_IS_TRANSACTION_VALUE
    expr: G_VOSITV_CONDITIONS
    module: M_VOSITV
    description: The value of the supply is determined to be the transaction value, defined as the price actually paid or
      payable, if the conditions are met.
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_PAMEL:
    outcome: PLANT_AND_MACHINERY
    expr: A_SCOPE AND (G_CORE OR G_INCLUDED) AND NOT G_EXCLUDED
    module: M_PAMEL
    description: Within this Chapter or Chapter VI, an item is plant and machinery when it is qualifying fixed apparatus,
      equipment or machinery used for making outward supply, or when it is such foundation or structural support. In either
      case it must not be land, building or any other civil structure. Whether such
  LE_PAMET:
    outcome: PLANT_AND_MACHINERY_AS_DEFINED
    expr: A_CHAPTER_SCOPE AND G_CORE_PAMET AND NOT A_TELECOM_TOWER
    module: M_PAMET
    description: Within this Chapter or Chapter VI, an item is plant and machinery if it meets the main limb or the included
      foundation or structural support limb, and it is not a telecommunication tower.
  LE_PAMEP_PM:
    outcome: PLANT_AND_MACHINERY
    expr: A_SCOPE_PAMEP AND (G_CORE_PAMEP OR G_INCLUDED_PAMEP) AND NOT A_PIPELINE_OUT
    module: M_PAMEP
    description: Where the definition applies, an item is plant and machinery if it meets the core limb or is an included
      foundation or structural support. It must also not be a pipeline laid outside the factory premises.
  LE_PAMEP_NOT_PM:
    outcome: NOT_PLANT_AND_MACHINERY
    expr: A_SCOPE_PAMEP AND (NOT (G_CORE_PAMEP OR G_INCLUDED_PAMEP) OR A_PIPELINE_OUT)
    module: M_PAMEP
    description: Where the definition applies, an item is not plant and machinery if it meets neither the core limb nor the
      inclusion. An item is also not plant and machinery if it is a pipeline laid outside the factory premises. The pipeline
      exclusion overrides an otherwise qualifying item.
  LE_ITC_JW:
    outcome: ITC_ALLOWED_ON_INPUTS_SENT_FOR_JOB_WORK
    expr: A_PRINCIPAL AND G_JW_INPUTS AND A_CONDITIONS
    module: M_COISFJW
    description: Input tax credit is allowed to the principal on inputs sent to a job worker for job work when the prescribed
      conditions and restrictions are met
  LE_CREDIT:
    outcome: PRINCIPAL_ENTITLED_TO_TAKE_CREDIT_OF_INPUT_TAX_ON_INPUTS
    expr: G_ENTITLEMENT
    module: M_CDISD
    description: The principal is entitled to take credit of input tax on inputs sent to a job worker for job work. This holds
      whether or not the inputs were directly sent. The override reaches only clause (b) of sub-section (2) of section 16,
      so other credit conditions are not displaced.
  LE_OVERRIDE:
    outcome: ENTITLEMENT_APPLIES_NOTWITHSTANDING_S16_2_B_FOR_DIRECT_DISPATCH
    expr: G_DIRECT_CASE
    module: M_CDISD
    description: Where the principal's inputs are sent directly to a job worker for job work without first being brought to
      his place of business, clause (b) of sub-section (2) of section 16 does not defeat the principal's entitlement to take
      the credit.
  LE_DEEMED_SUPPLY:
    outcome: DEEMED_SUPPLY_BY_PRINCIPAL_TO_JOB_WORKER_ON_SENT_OUT_DAY
    expr: A_INPUTS_SENT_FOR_JOB_WORK AND A_SENT_BY_PRINCIPAL AND G_NEITHER_RETURNED_NOR_SUPPLIED
    module: M_DSOUI
    description: It shall be deemed that such inputs had been supplied by the principal to the job worker on the day when
      the said inputs were sent out. The deemed supply is dated to the sending-out day. It is not dated to the expiry of the
      one-year period
  LE_ISDPC:
    outcome: ONE_YEAR_PERIOD_COUNTED_FROM_JOB_WORKER_RECEIPT
    expr: G_PROVISO
    module: M_ISDPC
    description: The one-year period is counted from the date of receipt of the inputs by the job worker when the inputs are
      sent directly to the job worker
  LE_COCGJW:
    outcome: ITC_ALLOWED_ON_CAPITAL_GOODS_SENT_FOR_JOB_WORK
    expr: G_ELIGIBILITY
    module: M_COCGJW
    description: Input tax credit on capital goods sent for job work is allowed to the principal under this sub-section when
      the claimant is the principal, the credit is on capital goods, those goods are sent to a job worker for job work, and
      the prescribed conditions and restrictions are complied with.
  LE_CDCGSD:
    outcome: PRINCIPAL_ENTITLED_TO_CREDIT_ON_CAPITAL_GOODS_SENT_DIRECTLY_S19_5
    expr: G_CDCGSD_ALL
    module: M_CDCGSD
    description: Where the principal takes input tax credit on capital goods that are directly sent to a job worker for job
      work without being first brought to the principal's place of business, Section 19(5) entitles the principal to take
      that credit notwithstanding anything contained in clause (b) of sub-section (
  LE_M_TEFDS:
    outcome: EXCEPTION_APPLIES
    expr: A_M_TEFDS_01 AND G_M_TEFDS_01
    module: M_TEFDS
    description: The deemed supply provisions of Section 19(3) and Section 19(6) do not apply to the specified items.
  LE_DSOUCG:
    outcome: DEEMED_SUPPLY_S19_6
    expr: G_DSOUCG_CONDITIONS
    module: M_DSOUCG
    description: If the conditions are met, it is deemed that the capital goods had been supplied by the principal to the
      job worker on the day when the said capital goods were sent out.
  LE_CREDIT_ON_CAPITAL_GOODS:
    outcome: CREDIT_ON_CAPITAL_GOODS
    expr: A_CREDIT_ON_CAPITAL_GOODS
    module: M_COEFCL
    description: Credit of input tax is taken on capital goods (Section 18(1), part of the law)
  LE_CWESBT_05:
    outcome: CWESBT_05
    expr: A_CWESBT_05
    module: M_CWESBT
    description: The person is entitled to credit on input tax for capital goods exclusively used for the exempt supply, as
      on the day preceding the date the supply becomes taxable (Section 18(1), part of the law)
  LE_CGCROE_REDUCED:
    outcome: CAPITAL_GOODS_CREDIT_REDUCED_BY_PRESCRIBED_POINTS
    expr: A_CGCROE_CAPITAL AND A_CGCROE_PRESCRIBED
    module: M_CGCROE
    description: Where the credit is on capital goods and percentage points have been prescribed, the credit shall be reduced
      by those prescribed percentage points.
  LE_M_CGCRBP:
    outcome: REDUCTION_APPLIES
    expr: A_M_CGCRBP_1 AND A_M_CGCRBP_2
    module: M_CGCRBP
    description: The credit on capital goods is reduced by the prescribed percentage points.
  LE_CREDIT_CAPITAL:
    outcome: CREDIT_CAPITAL
    expr: A_CREDIT_CAPITAL
    module: M_POOCOE
    description: The amount payable is equivalent to a base that includes the credit of input tax on capital goods (Section
      18(4), part of the law)
  LE_REDUCTION:
    outcome: REDUCTION
    expr: A_REDUCTION
    module: M_POOCOE
    description: The credit is reduced by such percentage points as may be prescribed (Section 18(4), part of the law)
  LE_STOTVO_OPTION:
    outcome: SCRAP_TAX_OPTION_AVAILABLE
    expr: G_STOTVO_CONDITIONS
    module: M_STOTVO
    description: The taxable person may pay tax on the transaction value of such goods determined under section 15.
  LE_DEEMED_SUPPLY_JWSTFT:
    outcome: SUPPLY_DEEMED_BY_PRINCIPAL
    expr: G_CONDITIONS
    module: M_JWSTFT
    description: The supply of goods by the job worker is deemed to be a supply by the principal referred to in section 143.
  LE_TURNOVER_EXCLUSION:
    outcome: VALUE_EXCLUDED_FROM_JW_TURNOVER
    expr: G_CONDITIONS
    module: M_JWSTFT
    description: The value of the goods is excluded from the job worker's aggregate turnover for the purposes of Section 22.
  LE_M_NIOCGWD:
    outcome: ITC_NOT_ALLOWED
    expr: A_M_NIOCGWD_1
    module: M_NIOCGWD
    description: Input tax credit on the said tax component shall not be allowed if the condition is met.
  LE_M_RPOOD:
    outcome: DEEMED_RELATED_PERSONS
    expr: G_M_RPOOD_1
    module: M_RPOOD
    description: Persons are deemed to be related if they are officers or directors of one another's businesses.
  LE_RPLRP:
    outcome: PD_RPLRP
    expr: A_RPLRP
    module: M_RPLRP
  LE_M_RPEAE:
    outcome: PERSONS_DEEMED_RELATED
    expr: A_M_RPEAE_1
    module: M_RPEAE
    description: If the condition is met, the persons are deemed to be related persons for the purposes of the Act.
  LE_RP25PS:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RP25PS
    module: M_RP25PS
    description: The legal outcome is that the persons are deemed to be related if the condition is met.
  LE_RPDIC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_CONTROL
    module: M_RPDIC
    description: The legal outcome is that the persons are deemed to be 'related persons' for the purposes of the Act.
  LE_M_RPCC:
    outcome: RELATED_PERSONS_DEEMED
    expr: G_M_RPCC
    module: M_RPCC
    description: The persons are deemed to be related persons if the condition of common control is met.
  LE_RPJC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RPJC_1
    module: M_RPJC
  LE_RPSFM:
    outcome: PERSONS_DEEMED_RELATED_PERSONS
    expr: A_FAMILY_MEMBERS
    module: M_RPSFM
    description: Persons are deemed to be related persons for the purposes of this Act if they are members of the same family
  LE_RPSAD:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_SOLE_ROLE
    module: M_RPSAD
    description: Where the persons are associated in the business of one another in that one is the sole agent or sole distributor
      or sole concessionaire of the other howsoever described then they shall be deemed to be related for the purposes of
      this Act
  LE_IOOTIV:
    outcome: VALUE_OF_SUPPLY_INCLUDES_LEVY
    expr: G_LEVY_KIND AND A_LAW_OTHER AND A_SEPARATE
    module: M_IOOTIV
    description: The amount is a tax, duty, cess, fee or charge. It is levied under a law in force other than the four GST
      laws. It is charged separately by the supplier. The value of supply shall then include it.
  LE_M_RISLI:
    outcome: VALUE_INCLUDES_RECIPIENT_INCURRED_AMOUNT
    expr: A_M_RISLI_1 AND A_M_RISLI_2 AND A_M_RISLI_3
    module: M_RISLI
    description: The amount is included in the value of supply if all three conditions are met.
  LE_M_IOIEIV:
    outcome: VALUE_INCLUDES_CHARGES
    expr: A_M_IOIEIV_1 OR A_M_IOIEIV_2
    module: M_IOIEIV
    description: The value of supply includes incidental expenses or other ancillary charges incurred at or before the time
      of supply.
  LE_M_IOIFDP:
    outcome: VALUE_INCLUDES_DELAY_CHARGE
    expr: G_M_IOIFDP_1
    module: M_IOIFDP
  LE_VISLTP:
    outcome: SUBSIDY_INCLUDED_IN_VALUE
    expr: A_SUBSIDY_PRICE_LINKED AND NOT G_GOVT_SUBSIDY
    module: M_VISLTP
    description: The value of supply shall include a subsidy directly linked to the price unless that subsidy is provided
      by the Central Government or a State Government
  LE_SAIIVE:
    outcome: SUBSIDY_AMOUNT_INCLUDED_IN_SUPPLIER_VALUE
    expr: G_SAIIVE_CONDITIONS
    module: M_SAIIVE
    description: Where the subsidy is being considered for the purposes of Section 15(2) and the supplier receives it, the
      amount of subsidy shall be included in that supplier's value of supply
  LE_DBOAS:
    outcome: DISCOUNT_EXCLUDED_FROM_VALUE
    expr: G_DISC_TIMING AND A_DISC_RECORDED
    module: M_DBOAS
    description: The value of the supply shall not include the discount when it is given before or at the time of the supply
      AND it has been duly recorded in the invoice issued in respect of that supply.
  LE_PSDAC:
    outcome: VALUE_SHALL_NOT_INCLUDE_DISCOUNT
    expr: G_PSDAC_CONDITIONS
    module: M_PSDAC
    description: The value of the supply shall not include the discount when the amount is a discount AND it is given after
      the supply AND it is established by an agreement at or before the supply AND it is specifically linked to relevant invoices
  LE_PSDIR:
    outcome: DISCOUNT_EXCLUDED_FROM_VALUE
    expr: G_PSDIR_COND
    module: M_PSDIR
    description: The value of the supply shall not include the discount when it was given after the supply and the attributable
      input tax credit on the supplier's document has been reversed by the recipient.
  LE_M_VCBDPM:
    outcome: USE_PRESCRIBED_VALUATION_RULES
    expr: PD_VOSITV
    module: M_VCBDPM
    description: The value shall be determined using the prescribed valuation rules.
  LE_M_NSVD:
    outcome: PRESCRIBED_VALUATION_APPLIES
    expr: G_M_NSVD_1
    module: M_NSVD
    description: If a supply is notified by the government (on council recommendation) and a valuation manner is prescribed,
      then that prescribed manner applies, overriding general valuation rules.
  LE_S18_6_PAYMENT:
    outcome: PAYMENT_OBLIGATION_S18_6_ARISES
    expr: G_TRIGGER AND G_AMOUNT
    module: M_POSOCG
    description: The registered person shall pay the calculated amount under section 18(6) when the trigger conditions are
      met and the amount is correctly determined.
  LE_M_POCGOC:
    outcome: OBLIGATION_MET
    expr: G_M_POCGOC
    module: M_POCGOC
    description: The obligation to pay the required amount on capital goods or plant and machinery at the time of cancellation
      is met.
triggers:
  CT_IOOTIV_1:
    question: Is an amount labelled other than tax, duty, cess, fee or charge in substance a charge levied under a law in
      force?
    trigger: F_SUPPLY_LEVY_NATURE = 'OTHER'
    beside: LE_IOOTIV
products:
  PD_MOPIS:
    statement: The person is the principal for Section 19 only if the term is being applied for the purpose of Section 19
      and the person is the person referred to in section 143.
  PD_DOPIL:
    statement: An entity that is a legal person is within the term person for the purposes of this Act.
  PD_VOSITV:
    statement: The value of the supply is determined to be the transaction value, defined as the price actually paid or payable,
      if the conditions are met.
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_PAMEL:
    statement: Within this Chapter or Chapter VI, an item is plant and machinery when it is qualifying fixed apparatus, equipment
      or machinery used for making outward supply, or when it is such foundation or structural support. In either case it
      must not be land, building or any other civil structure. Whether such
  PD_PAMET:
    statement: Within this Chapter or Chapter VI, an item is plant and machinery if it meets the main limb or the included
      foundation or structural support limb, and it is not a telecommunication tower.
  PD_PAMEP_PM:
    statement: Where the definition applies, an item is plant and machinery if it meets the core limb or is an included foundation
      or structural support. It must also not be a pipeline laid outside the factory premises.
  PD_PAMEP_NOT_PM:
    statement: Where the definition applies, an item is not plant and machinery if it meets neither the core limb nor the
      inclusion. An item is also not plant and machinery if it is a pipeline laid outside the factory premises. The pipeline
      exclusion overrides an otherwise qualifying item.
  PD_ITC_JW:
    statement: Input tax credit is allowed to the principal on inputs sent to a job worker for job work when the prescribed
      conditions and restrictions are met
  PD_CREDIT:
    statement: The principal is entitled to take credit of input tax on inputs sent to a job worker for job work. This holds
      whether or not the inputs were directly sent. The override reaches only clause (b) of sub-section (2) of section 16,
      so other credit conditions are not displaced.
  PD_OVERRIDE:
    statement: Where the principal's inputs are sent directly to a job worker for job work without first being brought to
      his place of business, clause (b) of sub-section (2) of section 16 does not defeat the principal's entitlement to take
      the credit.
  PD_DEEMED_SUPPLY:
