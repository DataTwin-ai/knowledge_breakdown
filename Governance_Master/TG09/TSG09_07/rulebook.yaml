  F_INPUTS_ONE_YEAR_ELAPSED:
    name: One year has elapsed from the date the inputs were sent out
    type: BOOLEAN
    tier: T0
  F_INPUTS_RECEIVED_BACK_WITHIN_ONE_YEAR:
