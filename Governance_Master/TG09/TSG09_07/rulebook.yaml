  F_ITC_ON_CAPITAL_GOODS:
    name: Input tax credit is on capital goods
    type: BOOLEAN
    tier: T0
  F_CONDITION_CAPITAL_GOODS_PRESCRIBED_MET:
    name: Prescribed conditions and restrictions for credit on capital goods sent for job work are complied with
