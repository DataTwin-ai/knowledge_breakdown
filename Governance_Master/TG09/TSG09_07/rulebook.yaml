      the claimant is the principal, the credit is on capital goods, those goods are sent to a job worker for job work, and
      the prescribed conditions and restrictions are complied with.
  PD_CDCGSD:
    statement: Where the principal takes input tax credit on capital goods that are directly sent to a job worker for job
      work without being first brought to the principal's place of business, Section 19(5) entitles the principal to take
      that credit notwithstanding anything contained in clause (b) of sub-section (
  PD_M_TEFDS:
