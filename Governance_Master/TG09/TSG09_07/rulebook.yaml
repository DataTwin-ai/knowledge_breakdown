# GOVERNANCE MASTER TSG09_07 Capital goods & job work (TG09 Input Tax Credit)
# LAW ARC - 47 laws - status NEEDS_REVIEW
name: TSG09_07 Capital goods & job work - GOVERNANCE MASTER rulebook
version: TSG09_07
facts:
  F_PROVISION_BEING_APPLIED:
    name: Provision in which the term principal is being applied
    type: CODE
    options:
    - SECTION_19
    - OTHER
    tier: T1
  F_PERSON_ROLE_DESCRIPTION_S143:
    name: Description of the person's role in the arrangement referred to in section 143
    type: TEXT
    tier: T1
  F_PERSON_IS_PRINCIPAL:
    name: Person claiming credit is the principal for the job work
    type: BOOLEAN
    tier: T1
  F_GOODS_DESCRIPTION:
    name: Description of the goods sent for job work and their use
    type: TEXT
    tier: T1
  F_GOODS_SENT_FOR_JOB_WORK:
    name: Goods are sent to a job worker for job work
    type: BOOLEAN
    tier: T1
  F_JOB_WORK_PRESCRIBED_CONDITIONS_MET:
    name: Prescribed conditions and restrictions for credit on inputs sent for job work are complied with
    type: BOOLEAN
    tier: T1
  F_GOODS_FIRST_BROUGHT_TO_PRINCIPAL_PLACE:
    name: Goods were first brought to the principal's place of business before being sent to the job worker
