    - OTHER
    tier: T0
  F_INPUTS_SUPPLIED_FROM_JOB_WORKER_WITHIN_ONE_YEAR:
    name: The inputs were supplied from the place of business of the job worker on or before the one-year end date
    type: BOOLEAN
    tier: T0
  F_INPUTS_SENT_DIRECTLY_TO_JOB_WORKER:
    name: The inputs are sent directly to the job worker
    type: BOOLEAN
    tier: T1
  F_INPUTS_RECEIVED_BY_JOB_WORKER_DATE:
    name: Date on which the inputs were received by the job worker
