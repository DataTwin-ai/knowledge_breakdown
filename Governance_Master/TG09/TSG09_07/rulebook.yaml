    tier: T0
  F_GOODS_CATEGORY_JOB_WORK:
    name: Category of goods sent for job work
    type: CODE
    options:
    - MOULDS_AND_DIES
    - JIGS_AND_FIXTURES
    - TOOLS
    - OTHER
    tier: T1
  F_CAPITAL_GOODS_RETURNED_WITHIN_3Y:
    name: Capital goods were received back by the principal within three years from the date they were sent out
    type: BOOLEAN
    tier: T0
  F_ITC_CLAIMED_ON_CAPITAL_GOODS:
    name: Is credit being claimed on capital goods?
    type: BOOLEAN
    tier: T1
  F_CAPITAL_GOODS_CREDIT_REDUCTION_POINTS_PRESCRIBED:
    name: Percentage points of reduction prescribed for credit on capital goods
    type: AMOUNT
    tier: T1
  F_ITC_CAPITAL_GOODS_HELD:
    name: Person has capital goods used exclusively for the exempt supply on the day preceding the change to taxable
    type: BOOLEAN
    tier: T0
  F_ITC_CAPITAL_GOODS_CREDIT:
    name: Credit of input tax on capital goods
    type: AMOUNT
    tier: T1
  F_ITC_PAYABLE_AMOUNT:
    name: Amount payable under section 18(4) after the prescribed reduction
    type: AMOUNT
    tier: T0
  F_ITC_S18_4_REDUCTION_POINTS:
    name: Percentage points of reduction prescribed for the section 18(4) amount
    type: AMOUNT
    tier: T1
  F_SUPPLIER_IS_REGISTERED_PERSON:
    name: F_SUPPLIER_IS_REGISTERED_PERSON
    type: BOOLEAN
    tier: T0
  F_ITC_TAKEN_ON_SUPPLIED_GOODS:
    name: F_ITC_TAKEN_ON_SUPPLIED_GOODS
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_CAPITAL_GOODS:
    name: F_SUPPLY_IS_CAPITAL_GOODS
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_PLANT_AND_MACHINERY:
    name: F_SUPPLY_IS_PLANT_AND_MACHINERY
    type: BOOLEAN
    tier: T0
  F_ITC_TAKEN_AMOUNT_ON_SUPPLIED_GOODS:
    name: F_ITC_TAKEN_AMOUNT_ON_SUPPLIED_GOODS
    type: AMOUNT
    tier: T0
  F_ITC_REDUCED_CREDIT_AMOUNT:
    name: F_ITC_REDUCED_CREDIT_AMOUNT
    type: AMOUNT
    tier: T0
  F_PAYMENT_S18_6_HIGHER_BASIS:
    name: F_PAYMENT_S18_6_HIGHER_BASIS
    type: CODE
    options:
    - REDUCED_CREDIT
    - TRANSACTION_VALUE_TAX
    - EQUAL
    tier: T1
  F_PAYMENT_S18_6_AMOUNT_PAYABLE:
    name: F_PAYMENT_S18_6_AMOUNT_PAYABLE
    type: AMOUNT
    tier: T1
  F_SUPPLY_GOODS_CATEGORY_S18_6:
    name: Category of goods supplied under s18(6) proviso
    type: CODE
    options:
    - REFRACTORY_BRICKS
    - MOULDS_AND_DIES
    - JIGS_AND_FIXTURES
    - OTHER
    tier: T0
  F_SUPPLY_IS_SCRAP:
    name: Supply is of scrap
    type: BOOLEAN
    tier: T1
  F_DETERMINATION_CONTEXT:
    name: Context of legal determination
    type: CODE
    options:
    - OTHER
    - S22_REGISTRATION_LIABILITY
    tier: T1
  F_SUPPLY_NATURE:
    name: Nature of the supply as goods, services or both
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_JOB_WORK_IS_COMPLETED:
    name: The job work on the goods is completed
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_IS_JOB_WORKER:
    name: The supplier is a job worker
    type: BOOLEAN
    tier: T1
  F_ASSET_DEPRECIATION_ON_TAX_CLAIMED:
    name: Depreciation claimed on the tax component of the cost of capital goods or plant and machinery under the Income-tax
      Act, 1961
    type: BOOLEAN
    tier: T0
  F_ASSET_IS_CG_PM:
    name: Asset is capital goods or plant and machinery
    type: CODE
    options:
    - 'TRUE'
    - 'FALSE'
    tier: T0
  F_RELATIONSHIP_P1_ROLE_IN_P2:
    name: Role of person 1 in person 2's business
    type: CODE
    options:
    - OFFICER
    - DIRECTOR
    - OTHER
    - NONE
    tier: T1
  F_RELATIONSHIP_P2_ROLE_IN_P1:
    name: Role of person 2 in person 1's business
    type: CODE
    options:
    - OFFICER
    - DIRECTOR
    - OTHER
    - NONE
    tier: T1
  F_RELATIONSHIP_LEGAL_FORM:
    name: Legal form of relationship between persons
    type: CODE
    options:
    - DIRECTOR
    - EMPLOYER
    - FAMILY
    - NONE
    - PARTNERSHIP
    tier: T1
  F_PERSONS_OWNERSHIP_CONTROL_RECORDS:
    name: Ownership and control records for the two persons
    type: TEXT
    tier: T1
  F_JOINT_CONTROL_EVIDENCE:
    name: Evidence of joint control by two persons over a third person
    type: TEXT
    tier: T1
  F_ENTITY_IS_LEGAL_PERSON:
    name: Entity is a legal person
    type: BOOLEAN
    tier: T1
  F_RELATIONSHIP_SOLE_ROLE:
    name: Sole role of one person in the business of the other
    type: CODE
    options:
    - SOLE_AGENT
    - SOLE_DISTRIBUTOR
    - SOLE_CONCESSIONAIRE
    - NONE
    tier: T1
  F_TRANSACTION_PARTIES_RELATED:
    name: Supplier and recipient are related parties
    type: BOOLEAN
    tier: T1
  F_SUPPLY_PRICE_IS_SOLE_CONSIDERATION:
    name: Price is the sole consideration for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_LEVY_NATURE:
    name: Nature of the levy amount
    type: CODE
    options:
    - TAX
    - DUTY
    - CESS
    - FEE
    - CHARGE
    - OTHER
    tier: T1
  F_SUPPLY_LEVY_DESCRIPTION:
    name: Description of the levy or charge
    type: TEXT
    tier: T1
  F_SUPPLY_LEVY_GOVERNING_LAW:
    name: Law under which the levy is imposed
    type: CODE
    options:
    - CGST_ACT
    - SGST_ACT
    - UTGST_ACT
    - COMPENSATION_ACT
    - OTHER_LAW_IN_FORCE
    - NO_LAW
    tier: T1
  F_SUPPLY_LEVY_CHARGED_SEPARATELY:
    name: Levy is charged separately by the supplier
    type: BOOLEAN
    tier: T1
  F_SUPPLY_RECIPIENT_INCURRED_AMOUNT:
    name: Amount incurred by the recipient on supplier's behalf
    type: AMOUNT
    tier: T0
  F_SUPPLY_IS_SUPPLIER_LIABILITY:
    name: The amount incurred by the recipient is a liability of the supplier
    type: BOOLEAN
    tier: T1
  F_SUPPLY_AMOUNT_INCLUDED_IN_PRICE:
    name: The amount incurred by the recipient is included in the price paid or payable
    type: BOOLEAN
    tier: T1
  F_SUPPLY_INCIDENTAL_EXPENSES_AMOUNT:
    name: Amount of incidental expenses (e.g., commission, packing) charged by the supplier to the recipient
    type: AMOUNT
    tier: T1
  F_SUPPLY_ANCILLARY_CHARGE_AMOUNT:
    name: Amount charged by the supplier for an activity done in respect of the supply
    type: AMOUNT
    tier: T1
  F_SUPPLY_ANCILLARY_ACTIVITY_TIMING:
    name: Timing of the ancillary activity performed by the supplier
    type: CODE
    options:
    - AT_DELIVERY
    - BEFORE_DELIVERY
    - AFTER_DELIVERY
    tier: T1
  F_ADDITION_TYPE:
    name: Type of addition to value for delayed payment
    type: CODE
    options:
    - INTEREST
    - LATE_FEE
    - OTHER
    - PENALTY
    tier: T1
  F_SUBSIDY_DIRECTLY_LINKED_TO_PRICE:
    name: Subsidy is directly linked to the price of the supply
    type: BOOLEAN
    tier: T1
  F_SUBSIDY_DESCRIPTION:
    name: Description of the subsidy and how it relates to the price
    type: TEXT
    tier: T1
  F_SUBSIDY_AMOUNT:
    name: Amount of the subsidy received in respect of the supply
    type: AMOUNT
    tier: T0
  F_SUBSIDY_PROVIDER:
    name: Provider of the subsidy
    type: CODE
    options:
    - CENTRAL_GOVERNMENT
    - STATE_GOVERNMENT
    - OTHER
    tier: T1
  F_SUBSIDY_RECEIVER_ROLE:
    name: Role of the person who receives the subsidy in relation to the supply
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - OTHER
    tier: T1
  F_SUPPLY_DISCOUNT_TIMING:
    name: Time at which the discount is given relative to the supply
    type: CODE
    options:
    - AFTER_SUPPLY
    - AT_SUPPLY
    - BEFORE_SUPPLY
    tier: T1
  F_SUPPLY_DISCOUNT_RECORDED_IN_INVOICE:
    name: Discount is duly recorded in the invoice issued in respect of the supply
    type: BOOLEAN
    tier: T0
  F_SUPPLY_CONSIDERATION_FORM:
    name: Form in which the consideration for the supply is represented
    type: CODE
    options:
    - DISCOUNT
    - INTEREST
    - OTHER
    tier: T1
  F_DISCOUNT_AGREEMENT_TIMING:
    name: Time at which the agreement establishing the discount was entered into relative to the supply
    type: CODE
    options:
    - BEFORE_SUPPLY
    - AT_SUPPLY
    - AFTER_SUPPLY
    - NO_AGREEMENT
    tier: T1
  F_DISCOUNT_LINKED_TO_INVOICES:
    name: Discount is specifically linked to relevant invoices
    type: BOOLEAN
    tier: T1
  F_ITC_ATTRIBUTABLE_TO_DISCOUNT:
    name: Input tax credit is attributable to the discount
    type: BOOLEAN
    tier: T1
  F_DISCOUNT_DOCUMENT_ISSUED_BY_SUPPLIER:
    name: Document on the basis of which the credit attributable to the discount is determined was issued by the supplier
    type: BOOLEAN
    tier: T1
  F_ITC_REVERSED_BY_RECIPIENT:
    name: Input tax credit attributable to the discount has been reversed by the recipient
    type: BOOLEAN
    tier: T1
  F_M_NSVD_1:
    name: Supply is of a type notified by the Government for special valuation
    type: BOOLEAN
    tier: T1
  F_M_NSVD_2:
    name: The notification for special valuation was issued on the recommendation of the GST Council
    type: BOOLEAN
    tier: T1
  F_M_NSVD_3:
    name: A manner for determining the value of the notified supply is prescribed
    type: BOOLEAN
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_PROVISION_CHAPTER_CONTEXT:
    name: Chapter of the Act for the purposes of which the expression plant and machinery is being applied
    type: CODE
    options:
    - CHAPTER_VI
    - OTHER
    - THIS_CHAPTER
    tier: T1
  F_ASSET_KIND:
    name: Kind of item as apparatus, equipment or machinery
    type: CODE
    options:
    - APPARATUS
    - EQUIPMENT
    - MACHINERY
    - OTHER
    tier: T0
  F_ASSET_FIXING_MODE:
    name: Means by which the item is fixed to earth
    type: CODE
    options:
    - BOTH
    - FOUNDATION
    - NONE
    - STRUCTURAL_SUPPORT
    tier: T1
  F_ASSET_USED_FOR_OUTWARD_SUPPLY:
    name: Item is used for making outward supply of goods or services or both
    type: BOOLEAN
    tier: T1
  F_ASSET_USE_DESCRIPTION:
    name: Description of the item, its construction and its use
    type: TEXT
    tier: T1
  F_ASSET_COMPONENT_ROLE:
    name: Role of the item as foundation or structural support of qualifying apparatus, equipment or machinery
    type: CODE
    options:
    - FOUNDATION_OF_QUALIFYING_ASSET
    - NONE
    - STRUCTURAL_SUPPORT_OF_QUALIFYING_ASSET
    tier: T1
  F_ASSET_NATURE:
    name: Nature of the item as land, building or other civil structure
    type: CODE
    options:
    - LAND
    - BUILDING
    - OTHER_CIVIL_STRUCTURE
    - NONE_OF_THESE
    tier: T1
  F_ASSET_IS_TELECOM_TOWER:
    name: Item is a telecommunication tower
    type: BOOLEAN
    tier: T1
  F_ASSET_IS_PIPELINE:
    name: Item is a pipeline
    type: BOOLEAN
    tier: T1
  F_ASSET_LAID_OUTSIDE_FACTORY_PREMISES:
    name: Item is laid outside the factory premises
    type: BOOLEAN
    tier: T1
predicates:
  A_SEC19_PURPOSE:
    statement: The term principal is being applied for the purpose of this section (Section 19).
    order: LOW
    rule: F_PROVISION_BEING_APPLIED = 'SECTION_19'
  A_SEC143_PERSON:
    statement: For the purpose of this section, principal means the person referred to in section 143.
    order: HIGH
    interpretation: Is the person the person referred to in section 143, judged from the description of the person's role
      in the arrangement? The content of section 143 is not supplied in this MKP and must be read from that provision.
    grounding:
    - F_PERSON_ROLE_DESCRIPTION_S143
  A_LEGAL_PERSON_INCLUDED:
    statement: For the purposes of this Act, the term "person" also includes legal persons
    order: LOW
    rule: F_ENTITY_IS_LEGAL_PERSON = TRUE
  A_VOSITV_01:
    statement: the supplier and the recipient of the supply are not related
    order: LOW
    rule: F_TRANSACTION_PARTIES_RELATED = FALSE
  A_VOSITV_02:
    statement: the price is the sole consideration for the supply
    order: LOW
    rule: F_SUPPLY_PRICE_IS_SOLE_CONSIDERATION = TRUE
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_SCOPE:
    statement: The expression "plant and machinery" is being applied for the purposes of this Chapter or Chapter VI
    order: LOW
    rule: F_PROVISION_CHAPTER_CONTEXT IN ['THIS_CHAPTER','CHAPTER_VI']
  A_APPARATUS:
    statement: The item is apparatus within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'APPARATUS'
  A_EQUIPMENT:
    statement: The item is equipment within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'EQUIPMENT'
  A_MACHINERY:
    statement: The item is machinery within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'MACHINERY'
  A_FIXED_FOUNDATION:
    statement: The apparatus, equipment or machinery is fixed to earth by foundation
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['FOUNDATION','BOTH']
  A_FIXED_STRUCTURAL:
    statement: The apparatus, equipment or machinery is fixed to earth by structural support
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['STRUCTURAL_SUPPORT','BOTH']
  A_USED:
    statement: The apparatus, equipment or machinery fixed to earth is used for making outward supply of goods or services
      or both
    order: HIGH
    interpretation: On the recorded use of the item, is it used for making outward supply of goods or services or both? Goods-only
      or services-only use both qualify. Missing use evidence gives UNKNOWN
    grounding:
    - F_ASSET_USED_FOR_OUTWARD_SUPPLY
    - F_ASSET_USE_DESCRIPTION
  A_INCL_FOUNDATION:
    statement: The item is such foundation, being the foundation by which apparatus, equipment or machinery used for making
      outward supply of goods or services or both is fixed to earth
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'FOUNDATION_OF_QUALIFYING_ASSET'
  A_INCL_STRUCTURAL:
    statement: The item is such structural support, being the structural support by which apparatus, equipment or machinery
      used for making outward supply of goods or services or both is fixed to earth
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'STRUCTURAL_SUPPORT_OF_QUALIFYING_ASSET'
  A_EXCL_LAND:
    statement: The item is land, which plant and machinery excludes
    order: LOW
    rule: F_ASSET_NATURE = 'LAND'
  A_EXCL_BUILDING:
    statement: The item is a building, which plant and machinery excludes
    order: LOW
    rule: F_ASSET_NATURE = 'BUILDING'
  A_EXCL_CIVIL:
    statement: The item is any other civil structure, which plant and machinery excludes
    order: HIGH
    interpretation: Is the item a civil structure other than land or building? Is such foundation or structural support of
      qualifying plant within this exclusion, despite the express inclusion? The source does not resolve this.
    grounding:
    - F_ASSET_NATURE
    - F_ASSET_USE_DESCRIPTION
    - F_ASSET_COMPONENT_ROLE
  A_CHAPTER_SCOPE:
    statement: The expression plant and machinery is being applied for the purposes of this Chapter or Chapter VI
    order: LOW
    rule: F_PROVISION_CHAPTER_CONTEXT IN ['THIS_CHAPTER','CHAPTER_VI']
  A_APPARATUS_PAMET:
    statement: The item is apparatus within the expression plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'APPARATUS'
  A_EQUIPMENT_PAMET:
    statement: The item is equipment within the expression plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'EQUIPMENT'
