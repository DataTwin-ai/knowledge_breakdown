      said inputs were sent out. The deemed supply is dated to the sending-out day. It is not dated to the expiry of the one-year
      period
  PD_ISDPC:
    statement: The one-year period is counted from the date of receipt of the inputs by the job worker when the inputs are
      sent directly to the job worker
  PD_COCGJW:
