# GOVERNANCE MASTER TSG11_02 GSTR-3B (TG11 Returns & Reconciliation)
# LAW ARC - 2 laws - status APPROVED
name: TSG11_02 GSTR-3B - GOVERNANCE MASTER rulebook
version: TSG11_02
facts:
  F_PERSON_RETURN_S39_STATUS:
    name: Status of furnishing return under Section 39
    type: CODE
    options:
    - FURNISHED
    - NOT_FURNISHED
    tier: T1
  F_CONSECUTIVE_RETURN_PERIODS_MISSED:
    name: Number of consecutive tax periods for which returns were not furnished
    type: AMOUNT
    tier: T0
predicates:
  A_M_ICFOR_1:
    statement: The registered person has furnished the return under section 39.
    order: LOW
    rule: F_PERSON_RETURN_S39_STATUS = 'FURNISHED'
  A_CFNFRR_NON_FILING:
    statement: The person has not furnished returns for a continuous period of six months
    order: LOW
    rule: F_CONSECUTIVE_RETURN_PERIODS_MISSED >= 6
groups: {}
outcomes:
  LE_M_ICFOR_1:
    outcome: ITC_S16_2D_MET
    expr: A_M_ICFOR_1
    module: M_ICFOR
    description: The condition that the return under section 39 has been furnished is met.
  LE_CFNFRR_NON_FILING:
    outcome: CFNFRR_NON_FILING
    expr: A_CFNFRR_NON_FILING
    module: M_CFNFRR
    description: The person has not furnished returns for a continuous period of six months (Section 29(2), part of the law)
products:
  PD_M_ICFOR_1:
    statement: The condition that the return under section 39 has been furnished is met.
  PD_CFNFRR_NON_FILING:
    statement: The person has not furnished returns for a continuous period of six months
compounds:
- id: C_ICFOR
  question: 'Section 16(2)(d): ITC Condition Furnishing Of Return?'
  includes:
  - LE_M_ICFOR_1
  produces:
  - product: PD_M_ICFOR_1
    from:
    - LE_M_ICFOR_1
- id: C_CFNFRR
  question: The person has not furnished returns for a continuous period of six months? (Section 29(2))
  includes:
  - LE_CFNFRR_NON_FILING
  produces:
  - product: PD_CFNFRR_NON_FILING
    from:
    - LE_CFNFRR_NON_FILING
