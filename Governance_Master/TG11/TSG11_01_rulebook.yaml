# GOVERNANCE MASTER TSG11_01 GSTR-1 / IFF (TG11 Returns & Reconciliation)
# LAW ARC - 5 laws - status APPROVED
name: TSG11_01 GSTR-1 / IFF - GOVERNANCE MASTER rulebook
version: TSG11_01
facts:
  F_RPS:
    name: Registered Person Status
    type: CODE
    options:
    - NOT_REGISTERED
    - REGISTERED
    - UNKNOWN
    tier: T0
  F_ODFD:
    name: Outward Details Furnishing Date
    type: DATE
    tier: T1
  F_FDOM:
    name: Furnishing Day Of Month
    type: AMOUNT
    tier: T1
  F_MFAP:
    name: Months Furnished After Period
    type: AMOUNT
    tier: T1
  F_NA:
    name: Notifying Authority
    type: CODE
    options:
    - COMMISSIONER
    - OTHER
    - STATE_COMMISSIONER
    - UNKNOWN
    - UT_COMMISSIONER
    tier: T1
  F_WRR:
    name: Written Reasons Recorded
    type: BOOLEAN
    tier: T1
  F_EIK:
    name: Extension Instrument Kind
    type: CODE
    options:
    - CIRCULAR
    - NOTIFICATION
    - ORDER
    - OTHER
    tier: T1
  F_RTLS:
    name: Return Time Limit Subject
    type: CODE
    options:
    - OTHER
    - OUTWARD_SUPPLY_DETAILS
    tier: T1
  F_NCD2:
    name: Notified Class Description
    type: TEXT
    tier: T1
  F_PPD:
    name: Person Profile Data
    type: TEXT
    tier: T1
  F_ROSR:
    name: Return Outward Supplies Reported
    type: BOOLEAN
    tier: T0
  F_RFM:
    name: Return Filing Mode
    type: CODE
    options:
    - ELECTRONIC
    - NON_ELECTRONIC
    - UNKNOWN
    tier: T1
  F_TPOR:
    name: Tax Period Of Return
    type: AMOUNT
    tier: T0
  F_RCS:
    name: Recipient Communication Status
    type: CODE
    options:
    - COMMUNICATED
    - NOT_COMMUNICATED
    - UNKNOWN
    tier: T1
  F_DDSTR:
    name: Date Details Sent To Recipient
    type: DATE
    tier: T1
  F_PTC:
    name: Person Tax Category
    type: CODE
    options:
    - COMPOSITION_S10
    - ISD
    - NON_RESIDENT
    - REGULAR
    - TCS_S52
    - TDS_S51
    - UNKNOWN
    tier: T0
  F_RFAM:
    name: Return Form And Manner
    type: TEXT
    tier: T0
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_ROFOSD_A_PIRP:
    statement: The person furnishing the details of outward supplies is a registered person.
    order: LOW
    rule: F_RPS = 'REGISTERED'
    handler: python
  M_ROFOSD_A_ODAF:
    statement: The registered person furnishes the details of outward supplies.
    order: LOW
    rule: F_ODFD IS_SET
    handler: python
  M_ROFOSD_A_FWRW:
    statement: The details of outward supplies are furnished during the period from the eleventh day to the fifteenth day
      of the month succeeding the tax period.
    order: LOW
    rule: F_MFAP = 1 AND F_FDOM >= 11 AND F_FDOM <= 15
    handler: python
  M_CEOFTL_A_CEEP:
    statement: The Commissioner exercises the discretionary power to extend the time limit for furnishing such details
    order: LOW
    rule: F_NA = 'COMMISSIONER'
    handler: python
  M_CEOFTL_A_RRIW:
    statement: The reasons for the extension are recorded in writing as a condition of the extension
    order: LOW
    rule: F_WRR = TRUE
    handler: python
  M_CEOFTL_A_EMBN:
    statement: The extension of the time limit is made by notification
    order: LOW
    rule: F_EIK = 'NOTIFICATION'
    handler: python
  M_CEOFTL_A_ECOD:
    statement: The time limit extended is the time limit for furnishing such details, which are the details of outward supplies
      that the parent provision refers to
    order: LOW
    rule: F_RTLS = 'OUTWARD_SUPPLY_DETAILS'
    handler: python
  M_GPTNQR_A_PFWNC:
    statement: The person falls within the certain class of registered persons notified by the Government
    order: HIGH
    interpretation: Does the person, as shown by the profile data, fall within the class description given in the notification?
      Only the notified class is covered, not all registered persons.
    grounding:
    - F_NCD2
    - F_PPD
    handler: light
  M_FORBRP_A_RROS:
    statement: The return reports outward supplies of goods or services or both
    order: LOW
    rule: F_ROSR = TRUE
    handler: python
  M_FOSD_A_DSBFE:
    statement: The registered person shall furnish the details electronically
    order: LOW
    rule: F_RFM = 'ELECTRONIC'
    handler: python
  M_FOSD_A_SEDTP:
    statement: The outward supplies were effected during a tax period and the details relate to that tax period
    order: HIGH
    interpretation: Were the outward supplies furnished effected during the tax period to which the furnished details relate?
    grounding:
    - F_TPOR
    handler: light
  M_FOSD_A_FBTDS:
    statement: The details are furnished on or before the tenth day of the month succeeding the said tax period
    order: LOW
    rule: F_MFAP < 1 OR (F_MFAP = 1 AND F_FDOM <= 10)
    handler: python
  M_FOSD_A_DCTR:
    statement: Such details shall be communicated to the recipient of the said supplies
    order: LOW
    rule: F_RCS = 'COMMUNICATED'
    handler: python
  M_FOSD_A_CWPTM:
    statement: The details are communicated to the recipient within such time and in such manner as may be prescribed
    order: HIGH
    interpretation: Was the communication to the recipient made within the time and in the manner prescribed under the Rules?
    grounding:
    - F_DDSTR
    handler: light
  M_FORBRP_A_PIISD:
    statement: 'The person is an Input Service Distributor (an excluded category: the duty applies to a registered person
      other than an Input Service Distributor)'
    order: LOW
    rule: F_PTC = 'ISD'
    handler: python
  M_FORBRP_A_PINTP:
    statement: The person is a non-resident taxable person (an excluded category)
    order: LOW
    rule: F_PTC = 'NON_RESIDENT'
    handler: python
  M_FORBRP_A_PPTUS10:
    statement: The person is paying tax under the provisions of section 10 (an excluded category)
    order: LOW
    rule: F_PTC = 'COMPOSITION_S10'
    handler: python
  M_FORBRP_A_PPTUS51:
    statement: The person is paying tax under the provisions of section 51 (an excluded category)
    order: LOW
    rule: F_PTC = 'TDS_S51'
    handler: python
  M_FORBRP_A_PPTUS52:
    statement: The person is paying tax under the provisions of section 52 (an excluded category)
    order: LOW
    rule: F_PTC = 'TCS_S52'
    handler: python
  M_FORBRP_A_RIPFM:
    statement: The return is furnished in such form and manner as may be prescribed
    order: HIGH
    interpretation: Does the return description show it was furnished in the form and manner prescribed?
    grounding:
    - F_RFAM
    handler: light
groups:
  M_CEOFTL_G_ECA:
    name: Extension Conditions All
    logic: ALL
    members:
    - M_CEOFTL_A_CEEP
    - M_CEOFTL_A_RRIW
    - M_CEOFTL_A_EMBN
    - M_GPTNQR_A_PFWNC
    - M_CEOFTL_A_ECOD
    description: All five conditions of the second proviso must hold together
  M_FOSD_G_EPC:
    name: Excluded Person Categories
    logic: ANY
    members:
    - M_FORBRP_A_PIISD
    - M_FORBRP_A_PINTP
    - M_FORBRP_A_PPTUS10
    - M_FORBRP_A_PPTUS51
    - M_FORBRP_A_PPTUS52
    description: The person falls in any one of the categories the section excludes.
  M_FOSD_G_FC:
    name: Furnishing Conditions
    logic: ALL
    members:
    - M_FOSD_A_DSBFE
    - M_FORBRP_A_RIPFM
    - M_FORBRP_A_RROS
    - M_FOSD_A_SEDTP
    - M_FOSD_A_FBTDS
    description: All furnishing requirements must be met together.
  M_FOSD_G_CC:
    name: Communication Conditions
    logic: ALL
    members:
    - M_FOSD_A_DCTR
    - M_FOSD_A_CWPTM
    description: The details are communicated to the recipient and within the prescribed time and manner.
outcomes:
  M_ROFOSD_LE_FNA:
    outcome: FURNISHING_NOT_ALLOWED
    expr: M_ROFOSD_A_PIRP AND M_ROFOSD_A_ODAF AND M_ROFOSD_A_FWRW
    module: M_ROFOSD
    description: All three conditions together produce the prohibited furnishing outcome for this proviso.
  M_ROFOSD_LE_PIRP:
    outcome: PERSON_IS_REGISTERED_PERSON
    expr: M_ROFOSD_A_PIRP
    module: M_GPTNQR
    description: The person furnishing the details of outward supplies is a registered person. (Section 39(1), proviso, part
      of the law)
  M_CEOFTL_LE_EVG:
    outcome: TIME_LIMIT_EXTENDED_UNDER_PROVISO
    expr: M_CEOFTL_G_ECA
    module: M_CEOFTL
    description: The time limit is extended under this proviso only when all five conditions hold together
  M_FORBRP_LE_RROS:
    outcome: RETURN_REPORTS_OUTWARD_SUPPLIES
    expr: M_FORBRP_A_RROS
    module: M_FORBRP
    description: The return reports outward supplies of goods or services or both (Section 39(1), part of the law)
  M_ROFOSD_LE_PIRP_FORBRP:
    outcome: PERSON_IS_A_REGISTERED_PERSON
    expr: M_ROFOSD_A_PIRP
    module: M_FORBRP
    description: The person furnishing the details of outward supplies is a registered person. (Section 39(1), part of the
      law)
  M_FOSD_LE_FOS:
    outcome: FURNISHING_OBLIGATION_SATISFIED
    expr: M_ROFOSD_A_PIRP AND NOT M_FOSD_G_EPC AND M_FOSD_G_FC
    module: M_FOSD
    description: A registered person outside the excluded categories has furnished the outward supply details as required.
  M_FOSD_LE_COS:
    outcome: COMMUNICATION_OBLIGATION_SATISFIED
    expr: M_ROFOSD_A_PIRP AND NOT M_FOSD_G_EPC AND M_FORBRP_A_RROS AND M_FOSD_A_SEDTP AND M_FOSD_G_CC
    module: M_FOSD
    description: A registered person outside the excluded categories has communicated such details to the recipient within
      the prescribed time and manner.
products:
  M_ROFOSD_PD_FNA:
    statement: All three conditions together produce the prohibited furnishing outcome for this proviso.
  M_ROFOSD_PD_PIRP:
    statement: The person is a registered person
  M_CEOFTL_PD_EVG:
    statement: The time limit is extended under this proviso only when all five conditions hold together
  M_FORBRP_PD_RROS:
    statement: The return reports outward supplies of goods or services or both
  M_ROFOSD_PD_PIRP_FORBRP:
    statement: The person is a registered person
  M_FOSD_PD_FOS:
    statement: A registered person outside the excluded categories has furnished the outward supply details as required.
  M_FOSD_PD_COS:
    statement: A registered person outside the excluded categories has communicated such details to the recipient within the
      prescribed time and manner.
compounds:
- id: C_ROFOSD
  question: 'Section 37(1), Proviso 1: Restriction On Furnishing Outward Supply Details?'
  includes:
  - M_ROFOSD_LE_FNA
  produces:
  - product: M_ROFOSD_PD_FNA
    from:
    - M_ROFOSD_LE_FNA
- id: C_GPTNQR
  question: The person furnishing the details of outward supplies is a registered person? (Section 39(1), proviso)
  includes:
  - M_ROFOSD_LE_PIRP
  produces:
  - product: M_ROFOSD_PD_PIRP
    from:
    - M_ROFOSD_LE_PIRP
- id: C_CEOFTL
  question: 'Section 37(1), second proviso: Commissioner Extension Of Filing Time Limit?'
  includes:
  - M_CEOFTL_LE_EVG
  produces:
  - product: M_CEOFTL_PD_EVG
    from:
    - M_CEOFTL_LE_EVG
- id: C_FORBRP
  question: The return reports outward supplies of goods or services or both; The person furnishing the details of outward
    supplies is a registered person? (Section 39(1))
  includes:
  - M_FORBRP_LE_RROS
  - M_ROFOSD_LE_PIRP_FORBRP
  produces:
  - product: M_FORBRP_PD_RROS
    from:
    - M_FORBRP_LE_RROS
  - product: M_ROFOSD_PD_PIRP_FORBRP
    from:
    - M_ROFOSD_LE_PIRP_FORBRP
- id: C_FOSD
  question: 'Section 37(1): Furnishing Outward Supply Details?'
  includes:
  - M_FOSD_LE_FOS
  - M_FOSD_LE_COS
  produces:
  - product: M_FOSD_PD_FOS
    from:
    - M_FOSD_LE_FOS
  - product: M_FOSD_PD_COS
    from:
    - M_FOSD_LE_COS
time:
  law_date: F_DOI
