# GOVERNANCE MASTER TSG11_01 GSTR-1 / IFF (TG11 Returns & Reconciliation)
# LAW ARC - 6 laws - status NEEDS_REVIEW
name: TSG11_01 GSTR-1 / IFF - GOVERNANCE MASTER rulebook
version: TSG11_01
facts:
  F_LIABILITY_ACCRUAL_DATE:
    name: Date on which the liability or obligation accrued
    type: DATE
    tier: T1
  F_REGISTRATION_CANCELLATION_DATE:
    name: Date of cancellation of registration
    type: DATE
    tier: T1
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_DOCUMENT_TYPE:
    name: Type of document
    type: CODE
    options:
    - ASSESSMENT_DOCUMENT
    - BILL_OF_SUPPLY
    - CREDIT_NOTE
    - DEBIT_NOTE
    - DELIVERY_CHALLAN
    - OTHER
    - OTHER_LIKE_DOCUMENT
    - PAYMENT_VOUCHER
    - RECEIPT_VOUCHER
    - REFUND_VOUCHER
    - REVISED_INVOICE
    - SELF_INVOICE
    - SUPPLEMENTARY_INVOICE
    - TAX_INVOICE
    tier: T1
  F_CREDIT_NOTE_RELATES_TO_SUPPLY:
    name: Credit note relates to a supply
    type: BOOLEAN
    tier: T0
  F_CN_DECLARED_IN_ISSUE_MONTH_RETURN:
    name: Credit note declared in the return for the month of issue
    type: BOOLEAN
    tier: T1
  F_CN_DECLARED_BY_STATUTORY_DEADLINE:
    name: Credit note declared by the statutory deadline (whichever is earlier)
    type: BOOLEAN
    tier: T0
  F_TAX_ADJUSTMENT_MANNER_IS_PRESCRIBED:
    name: Tax liability adjustment follows the prescribed manner
    type: BOOLEAN
    tier: T0
  F_DEBIT_NOTE_DECLARED_IN_ISSUE_MONTH_RETURN:
    name: Debit note declared in the return for the month of issue
    type: BOOLEAN
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_M_LCARC_1:
    statement: The cancellation of registration shall not affect the liability of the person to pay tax and other dues under
      this Act for any period prior to the date of cancellation, whether or not such tax and other dues are determined before
      or after the date of cancellation.
    order: HIGH
    interpretation: This provision establishes that a person's liability to pay tax and other dues that arose during a period
      before their registration was cancelled continues to exist even after the cancellation. The timing of the determination
      or assessment of these dues (whether before or after the cancellation date) does not extinguish the liability.
    grounding:
    - F_LIABILITY_ACCRUAL_DATE
    - F_REGISTRATION_CANCELLATION_DATE
  A_M_LCARC_2:
    statement: The cancellation of registration shall not affect the liability of the person to discharge any obligation under
      this Act or the rules made thereunder for any period prior to the date of cancellation.
    order: HIGH
    interpretation: This provision establishes that a person's liability to discharge any non-monetary obligation under the
      GST Act or its rules (such as filing final returns or preserving records) that arose during a period before their registration
      was cancelled continues to exist even after the cancellation.
    grounding:
    - F_LIABILITY_ACCRUAL_DATE
    - F_REGISTRATION_CANCELLATION_DATE
  A_ISSUER_CONTEXT:
    statement: A registered person issues a credit note in relation to a supply of goods or services or both
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE AND F_DOCUMENT_TYPE = 'CREDIT_NOTE' AND F_CREDIT_NOTE_RELATES_TO_SUPPLY = TRUE
  A_DECLARATION_TIMING:
    statement: The credit note is declared in the return for the month during which it was issued
    order: LOW
    rule: F_CN_DECLARED_IN_ISSUE_MONTH_RETURN = TRUE
  A_DECLARATION_DEADLINE:
    statement: 'The credit note is declared not later than the earlier of: September following the end of the financial year
      of supply, or the date of furnishing the relevant annual return'
    order: LOW
    rule: F_CN_DECLARED_BY_STATUTORY_DEADLINE = TRUE
  A_ADJUSTMENT_MANNER:
    statement: The tax liability is adjusted in the manner prescribed
    order: HIGH
    interpretation: Is the tax liability adjusted in the manner prescribed by the relevant Rules?
    grounding:
    - F_TAX_ADJUSTMENT_MANNER_IS_PRESCRIBED
  A_DECLARE_DN_IN_ISSUE_MONTH_RETURN:
    statement: The registered person shall declare the details of the debit note in the return for the month during which
      the debit note has been issued
    order: LOW
    rule: F_DEBIT_NOTE_DECLARED_IN_ISSUE_MONTH_RETURN = TRUE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_M_LCARC_1:
    outcome: TAX_LIABILITY_UNAFFECTED
    expr: A_M_LCARC_1
    module: M_LCARC
    description: The legal consequence that a pre-existing liability to pay tax and other dues is not affected by the cancellation
      of registration.
  LE_M_LCARC_2:
    outcome: OBLIGATION_UNAFFECTED
    expr: A_M_LCARC_2
    module: M_LCARC
    description: The legal consequence that a pre-existing liability to discharge other obligations is not affected by the
      cancellation of registration.
  LE_M_DOCNIR:
    outcome: CREDIT_NOTE_ADJUSTMENT_VALID
    expr: A_ISSUER_CONTEXT AND A_DECLARATION_TIMING AND A_DECLARATION_DEADLINE AND A_ADJUSTMENT_MANNER
    module: M_DOCNIR
    description: The tax adjustment for a credit note is valid if the issuer is a registered person, the declaration is made
      in the month of issue and before the final deadline, and the adjustment follows the prescribed manner.
  LE_DECLARE_DN_IN_ISSUE_MONTH_RETURN:
    outcome: DECLARE_DN_IN_ISSUE_MONTH_RETURN
    expr: A_DECLARE_DN_IN_ISSUE_MONTH_RETURN
    module: M_DODNIR
    description: The registered person shall declare the details of the debit note in the return for the month during which
      the debit note has been issued (Section 34(4), part of the law)
products:
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_M_LCARC_1:
    statement: The legal consequence that a pre-existing liability to pay tax and other dues is not affected by the cancellation
      of registration.
  PD_M_LCARC_2:
    statement: The legal consequence that a pre-existing liability to discharge other obligations is not affected by the cancellation
      of registration.
  PD_M_DOCNIR:
    statement: The tax adjustment for a credit note is valid if the issuer is a registered person, the declaration is made
      in the month of issue and before the final deadline, and the adjustment follows the prescribed manner.
  PD_DECLARE_DN_IN_ISSUE_MONTH_RETURN:
    statement: The registered person shall declare the details of the debit note in the return for the month during which
      the debit note has been issued
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_LCARC
  question: 'Section 29(3): Liability Continues After Registration Cancellation?'
  includes:
  - LE_M_LCARC_1
  - LE_M_LCARC_2
  produces:
  - product: PD_M_LCARC_1
    from:
    - LE_M_LCARC_1
  - product: PD_M_LCARC_2
    from:
    - LE_M_LCARC_2
- id: C_DOCNIR
  question: 'Section 34(2): Declaration Of Credit Note In Return?'
  includes:
  - LE_M_DOCNIR
  produces:
  - product: PD_M_DOCNIR
    from:
    - LE_M_DOCNIR
- id: C_DODNIR
  question: The registered person shall declare the details of the debit note in the return for the month during which the
    debit note has been issued? (Section 34(4))
  includes:
  - LE_DECLARE_DN_IN_ISSUE_MONTH_RETURN
  produces:
  - product: PD_DECLARE_DN_IN_ISSUE_MONTH_RETURN
    from:
    - LE_DECLARE_DN_IN_ISSUE_MONTH_RETURN
