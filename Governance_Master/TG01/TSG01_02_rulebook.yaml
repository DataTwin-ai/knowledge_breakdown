  M_TOBASOG_PD_GFBA_COTPRE:
    statement: Any goods form part of the assets of any business carried on by him
  M_GTENS_PD_GPE:
    statement: The proviso displaces the parent supply provision only where that provision would otherwise apply and every
      gift condition is met
  M_SOGPTA_PD_AGSD:
    statement: All conditions of paragraph 3(a) hold, so the supply is treated as a supply even if made without consideration
  M_SOGATP_PD_AGDS:
    statement: The deeming applies only when all three joint conditions of paragraph 3(b) hold
  M_IOSFRP_PD_DSO:
    statement: All three conditions must hold for the import of services to be treated as a supply under paragraph 4, and
      consideration is not tested
  M_TOTISOG_PD_GDO:
    statement: The transaction is a supply of goods when a transfer of the title in goods has taken place.
  M_TOBASOG_PD_BAGS:
    statement: Where all transfer conditions are met, the transfer or disposal is a deemed supply of goods by the person.
  M_TOBASOG_PD_GFBA_PUOBGIS:
    statement: The goods are held or used for the purposes of the business
  M_ANGNS_PD_SIIINSO:
    statement: The activity or transaction is treated neither as a supply of goods nor as a supply of services when it is
      specified in Schedule III, notwithstanding sub-section (1).
  M_NGANGNS_PD_NANS:
    statement: When all four conditions hold, the activity or transaction shall be treated neither as a supply of goods nor
      a supply of services, overriding sub-section (1).
  M_SIAWC_PD_SIO:
    statement: The supply is included under this limb only when the Schedule I activity group is met.
  M_SIAFOS_PD_SIBC:
    statement: The transaction is included in supply under Section 7(1)(a) when it is in a qualifying form, is of goods or
      services or both, is made or agreed to be made for a consideration, and is by a person in the course or furtherance
      of business.
