# GOVERNANCE MASTER TSG01_02 Supply without consideration (Schedule I) (TG01 Supply & Taxability)
# LAW ARC - 6 laws - status APPROVED
name: TSG01_02 Supply without consideration (Schedule I) - GOVERNANCE MASTER rulebook
version: TSG01_02
facts:
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_PRS:
    name: Person Relation Status
    type: CODE
    options:
    - RELATED
    - DISTINCT
    - NEITHER
    - UNKNOWN
    tier: T1
  F_AITCS:
    name: Asset Input Tax Credit Status
    type: CODE
    options:
    - AVAILED
    - NOT_AVAILED
    - UNKNOWN
    tier: T0
  F_PAR:
    name: Principal Agent Role
    type: CODE
    options:
    - PRINCIPAL_TO_AGENT
    - OTHER
    - UNKNOWN
    tier: T1
  F_ASU:
    name: Agent Supply Undertaking
    type: CODE
    options:
    - UNDERTAKEN
    - NOT_UNDERTAKEN
    - UNKNOWN
    tier: T1
  F_SAR:
    name: Supply Agency Role
    type: CODE
    options:
    - AGENT_TO_PRINCIPAL
    - PRINCIPAL_TO_AGENT
    - OTHER
    - UNKNOWN
    tier: T1
  F_SIK:
    name: Supply Item Kind
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    - UNKNOWN
    tier: T1
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SGOSRDP_A_SOGOS:
    statement: The transaction involves a supply of goods or services or both
    order: HIGH
    interpretation: Does the described transaction supply goods, services or both? Goods only or services only is not required
    grounding:
    - F_DOS
    handler: light
  M_SGOSRDP_A_SBRP:
    statement: The supply is made between related persons
    order: HIGH
    interpretation: Are the supplier and the recipient related persons under the GST law? Fact value RELATED supports TRUE,
      NEITHER supports FALSE, UNKNOWN if the relation cannot be established from the documents
    grounding:
    - F_PRS
    handler: heavy
  M_SGOSRDP_A_SBDP:
    statement: The supply is made between distinct persons as specified in section 25
    order: HIGH
    interpretation: Are the supplier and the recipient distinct persons as specified in section 25? Fact value DISTINCT supports
      TRUE, NEITHER supports FALSE, UNKNOWN if the relation cannot be established from the documents
    grounding:
    - F_PRS
    handler: heavy
  M_SGOSRDP_A_SICOB:
    statement: The supply is made in the course or furtherance of business
    order: HIGH
    interpretation: Is the activity of making the supply in the course or furtherance of business? Ordinary activity that
      is not business does not satisfy this atom
    grounding:
    - F_AOTD
    handler: heavy
  M_PTODOBA_A_PTOBA:
    statement: The activity is a permanent transfer of business assets.
    order: HIGH
    interpretation: Does the described activity constitute a permanent transfer of business assets, as opposed to a temporary
      transfer?
    grounding:
    - F_AOTD
    handler: heavy
  M_PTODOBA_A_PDOBA:
    statement: The activity is a permanent disposal of business assets.
    order: HIGH
    interpretation: Does the described activity constitute a permanent disposal of business assets?
    grounding:
    - F_AOTD
    handler: heavy
  M_PTODOBA_A_ITCAOSA:
    statement: Input tax credit has been availed on such assets.
    order: LOW
    rule: F_AITCS = 'AVAILED'
    handler: python
  M_PTASOG_A_SBPTA:
    statement: The activity is by a principal to his agent
    order: HIGH
    interpretation: Is the supplying party the principal and the recipient his agent in this transaction
    grounding:
    - F_PAR
    handler: light
  M_PTASOG_A_AUSFP:
    statement: The agent undertakes to supply such goods on behalf of the principal
    order: HIGH
    interpretation: Does the agent undertake to supply the goods referred to as such goods in the source paragraph, and is
      that undertaking made on behalf of the principal
    grounding:
    - F_ASU
    - F_DOS
    handler: heavy
  M_SOGBATP_A_SBATP:
    statement: The supply is made by an agent to his principal
    order: HIGH
    interpretation: Does the record show that the supplier acts as agent for the principal in this supply and that the recipient
      is that principal?
    grounding:
    - F_SAR
    handler: heavy
  M_SOGBATP_A_SIOG:
    statement: The supply is of such goods, meaning goods of the paragraph heading Supply of goods
    order: LOW
    rule: F_SIK = 'GOODS'
    handler: python
  M_SOGBATP_A_AUTRG:
    statement: The agent undertakes to receive such goods on behalf of the principal
    order: HIGH
    interpretation: Does the contract or record show that the agent undertook to receive these goods on behalf of the principal?
    grounding:
    - F_DOS
    handler: heavy
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SGOSRDP_G_RODP:
    name: Related Or Distinct Parties
    logic: ANY
    members:
    - M_SGOSRDP_A_SBRP
    - M_SGOSRDP_A_SBDP
    description: Source wording uses or between related persons or between distinct persons, so either relationship is sufficient
  M_PTODOBA_G_ATOD:
    name: Asset Transfer Or Disposal
    logic: ANY
    members:
    - M_PTODOBA_A_PTOBA
    - M_PTODOBA_A_PDOBA
    description: 'Alternative forms of the activity: a permanent transfer or a permanent disposal of business assets.'
  M_SOGBATP_G_AGE:
    name: Agent Goods Elements
    logic: ALL
    members:
    - M_SOGBATP_A_SBATP
    - M_SOGBATP_A_SIOG
    - M_SOGBATP_A_AUTRG
    description: All three elements of paragraph 3(b) must hold
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SGOSRDP_LE_DSJE:
    outcome: SUPPLY_DEEMED
    expr: M_SGOSRDP_A_SOGOS AND M_SGOSRDP_G_RODP AND M_SGOSRDP_A_SICOB
    module: M_SGOSRDP
    description: Joint requirements of a supply of goods or services or both, a related or distinct person alternative, and
      course or furtherance of business. Consideration is not tested by any atom because the source deems the supply even
      if made without consideration
  M_PTODOBA_LE_DSOBA:
    outcome: SUPPLY_DEEMED
    expr: M_PTODOBA_G_ATOD AND M_PTODOBA_A_ITCAOSA
    module: M_PTODOBA
    description: Where the activity is a permanent transfer or disposal of business assets and input tax credit has been availed
      on such assets, the activity is treated as a supply under Schedule I paragraph 1.
  M_PTASOG_LE_PADS:
    outcome: DEEMED_SUPPLY_OF_GOODS
    expr: M_PTASOG_A_SBPTA AND M_PTASOG_A_AUSFP
    module: M_PTASOG
    description: Both conditions must hold
  M_SOGBATP_LE_AGDS:
    outcome: SUPPLY_DEEMED_PARA_3B
    expr: M_SOGBATP_G_AGE
    module: M_SOGBATP
    description: The deeming outcome follows when all three elements of paragraph 3(b) hold
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SGOSRDP_PD_DSJE:
    statement: Joint requirements of a supply of goods or services or both, a related or distinct person alternative, and
      course or furtherance of business. Consideration is not tested by any atom because the source deems the supply even
      if made without consideration
  M_PTODOBA_PD_DSOBA:
    statement: Where the activity is a permanent transfer or disposal of business assets and input tax credit has been availed
      on such assets, the activity is treated as a supply under Schedule I paragraph 1.
  M_PTASOG_PD_PADS:
    statement: Both conditions must hold
  M_SOGBATP_PD_AGDS:
    statement: The deeming outcome follows when all three elements of paragraph 3(b) hold
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_ISO
  - M_IOSFC_LE_ISIO
  produces:
  - product: M_SIAFOS_PD_ISO
    from:
    - M_SIAFOS_LE_ISO
  - product: M_IOSFC_PD_ISIO
    from:
    - M_IOSFC_LE_ISIO
- id: C_SGOSRDP
  question: 'Schedule I, paragraph 2: Supply Goods Or Services Related Distinct Persons?'
  includes:
  - M_SGOSRDP_LE_DSJE
  produces:
  - product: M_SGOSRDP_PD_DSJE
    from:
    - M_SGOSRDP_LE_DSJE
- id: C_PTODOBA
  question: 'Schedule I, paragraph 1: Permanent Transfer Or Disposal Of Business Assets?'
  includes:
  - M_PTODOBA_LE_DSOBA
  produces:
  - product: M_PTODOBA_PD_DSOBA
    from:
    - M_PTODOBA_LE_DSOBA
- id: C_SCHI_EN3
  question: 'Schedule I, paragraph 3: which clause applies?'
  includes:
  - M_PTASOG_LE_PADS
  - M_SOGBATP_LE_AGDS
  produces:
  - product: M_PTASOG_PD_PADS
    from:
    - M_PTASOG_LE_PADS
  - product: M_SOGBATP_PD_AGDS
    from:
    - M_SOGBATP_LE_AGDS
time:
  law_date: F_DOI
