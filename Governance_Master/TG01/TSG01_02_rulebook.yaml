products:
  M_SIAFOS_PD_IISUS71A:
    statement: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_PD_IOSFCIS:
    statement: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_PTOBAWI_PD_DSOBA:
    statement: All three conditions must be met on the same assets, and consideration is not tested
  M_TOBASOG_PD_GFBA:
    statement: Any goods form part of the assets of any business carried on by him
  M_TOBASOG_PD_GFBA_COTPRE:
    statement: Any goods form part of the assets of any business carried on by him
  M_GTENS_PD_GPE:
    statement: The proviso displaces the parent supply provision only where that provision would otherwise apply and every
      gift condition is met
  M_SOGPTA_PD_AGSD:
    statement: All conditions of paragraph 3(a) hold, so the supply is treated as a supply even if made without consideration
  M_SOGATP_PD_AGDS:
    statement: The deeming applies only when all three joint conditions of paragraph 3(b) hold
  M_TOTISOG_PD_GDO:
    statement: The transaction is a supply of goods when a transfer of the title in goods has taken place.
  M_TOBASOG_PD_BAGS:
    statement: Where all transfer conditions are met, the transfer or disposal is a deemed supply of goods by the person.
  M_TOBASOG_PD_GFBA_PUOBGIS:
    statement: The goods are held or used for the purposes of the business
