# GOVERNANCE MASTER TSG01_02 Supply without consideration (Schedule I) (TG01 Supply & Taxability)
# LAW ARC - 11 laws - status NEEDS_REVIEW
name: TSG01_02 Supply without consideration (Schedule I) - GOVERNANCE MASTER rulebook
version: TSG01_02
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_BAS:  # 1. 1 gate | 4 law(s)
    name: Business Asset Status
    type: CODE
    options:
    - PART_OF_BUSINESS_ASSETS
    - NOT_PART_OF_BUSINESS_ASSETS
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Were these goods part of the assets of your business before they were transferred or disposed of?'' Yes gives PART_OF_BUSINESS_ASSETS, no gives NOT_PART_OF_BUSINESS_ASSETS.', fallback: 'Check CONTRACT.property_description for the goods being listed as business assets. If still unclear, stop and ask again.', when_missing: ASK, as_of: just before the transfer or disposal, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: PART_OF_BUSINESS_ASSETS, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_PRR:  # 2. 1 gate | 3 law(s)
    name: Provider Recipient Relation
    type: CODE
    options:
    - CONTRACTOR_CLIENT
    - DISTINCT_PERSONS
    - EMPLOYEE_EMPLOYER
    - OTHER
    - PRINCIPAL_AGENT
    - RELATED_PERSONS
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.relation_between_parties, CONTRACT.parties, CONTRACT.employment_terms]
      how_to_get: Read the relation between the parties in the contract. Map it to EMPLOYEE_EMPLOYER, PRINCIPAL_AGENT, CONTRACTOR_CLIENT, RELATED_PERSONS or DISTINCT_PERSONS. If there is no stated relation, use the parties and the employment terms to decide. Use OTHER if none fits.
      fallback: 'Ask the user: ''What is the relationship between the provider and the recipient: employee-employer, principal-agent, or something else?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: EMPLOYEE_EMPLOYER
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SKOT:  # 3. 1 gate | 3 law(s)
    name: Supply Kind Of Transaction
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
    origin:
      document: SALE_INVOICE
      method: LOOKUP
      uses: [SALE_INVOICE.hsn_sac]
      how_to_get: 'For each line take hsn_sac. Look it up in the HSN/SAC table: codes beginning with 99 are services, other codes are goods. If all lines are goods the value is GOODS, if all are services the value is SERVICES, if both appear the value is BOTH.'
      fallback: 'Read SALE_INVOICE.line_description and decide goods or services; if still unclear, read CONTRACT.subject or ask the user: ''Is this a sale of goods, a service, or both?'''
      when_missing: ASK
      as_of: invoice date
      level: INVOICE
      ai_level: NONE
      cost: MEDIUM
      example: SERVICES
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ADT:  # 4. 1 gate | 2 law(s)
    name: Asset Disposition Type
    type: CODE
    options:
    - OTHER
    - PERMANENT_DISPOSAL
    - PERMANENT_TRANSFER
    tier: T0
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.consideration]
      how_to_get: Read CONTRACT.subject and CONTRACT.consideration in the transfer or disposal agreement or deed. If the assets are handed over for good (sold, gifted, given away, written off to another person), the value is PERMANENT_TRANSFER or PERMANENT_DISPOSAL as the text says. Any other arrangement (for example a temporary transfer, loan or lease) gives OTHER.
      fallback: 'Ask the user: ''Was the asset permanently transferred, permanently disposed of, or something else?'''
      when_missing: ASK
      as_of: date of transfer or disposal
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: PERMANENT_TRANSFER
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_AGVIFY:  # 5. 1 gate | 1 law(s)
    name: Aggregate Gift Value In Financial Year
    type: AMOUNT
    tier: T0
    unit: INR
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user for the total value of all gifts given by the employer to this employee in the financial year, adding up every gift record. The answer is an amount in rupees.', fallback: 'If the user does not know the total, ask for each gift and its value separately and add them up.', when_missing: ASK, as_of: end of the financial year, level: PERIOD, ai_level: NONE, cost: HIGH, example: '42000', confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_ICAA:  # 6. 1 gate | 1 law(s)
    name: Input Credit Availed Asset
    type: BOOLEAN
    tier: T0
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Did you take input tax credit (ITC) on this asset when you bought it?'' Answer yes or no.', fallback: 'If the user is unsure, check the purchase invoice of the asset and the ITC claimed in the GSTR-3B for the period of purchase.', when_missing: UNKNOWN, as_of: date of transfer or disposal of the asset, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: 'TRUE', confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_PTAS:  # 7. 1 gate | 1 law(s)
    name: Post Transfer Asset Status
    type: CODE
    options:
    - NO_LONGER_PART_OF_ASSETS
    - STILL_PART_OF_ASSETS
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''After this transfer or disposal, do the goods still remain part of the business assets?'' If no, the value is NO_LONGER_PART_OF_ASSETS. If yes, the value is STILL_PART_OF_ASSETS.', fallback: 'Read CONTRACT.subject for a transfer of the goods out of the business. If it is still unclear, mark UNKNOWN.', when_missing: UNKNOWN, as_of: date of transfer or disposal, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: NO_LONGER_PART_OF_ASSETS, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_TIR:  # 8. 1 gate | 1 law(s)
    name: Transfer Initiator Role
    type: CODE
    options:
    - BY_BUSINESS_PERSON
    - UNDER_BUSINESS_PERSON_DIRECTION
    - OTHER
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Was the transfer or disposal of the business asset done by the business owner himself, on the owner''s direction, or by someone else?'' Answer: by owner gives BY_BUSINESS_PERSON, on the owner''s instructions gives UNDER_BUSINESS_PERSON_DIRECTION, otherwise OTHER.', fallback: Read CONTRACT.parties and CONTRACT.subject if a transfer paper exists., when_missing: UNKNOWN, as_of: date of transfer, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: BY_BUSINESS_PERSON, confidence: low, sensitive: false, reviewed: false, origin_by: AI}
  # ---- LAST: only heavy checks (free text) need these
  F_DOAOT:  # 9. LAST (heavy check only) | 3 law(s) | asked only if M_GTENS: F_PRR + F_AGVIFY | M_TOTISOG: F_SKOT
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description, CONTRACT.employment_terms]
      how_to_get: Read the contract subject, then property_description if it is about property, or employment_terms if it is about employment. Write a short plain-text description of the activity or transaction and who does it for whom.
      fallback: 'Use SALE_INVOICE.line_description. If that is also missing, ask the user: Please describe the activity or transaction.'
      when_missing: ASK
      as_of: date of the activity or transaction
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: Sale of a vacant plot of land to a buyer
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SCS:  # 10. LAST (heavy check only) | 3 law(s) | asked only if M_GTENS: F_PRR + F_AGVIFY
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
    origin:
      document: CONTRACT
      method: DERIVED
      uses: [CONTRACT.consideration, CONTRACT.consideration_type]
      how_to_get: Read consideration and consideration_type from the contract. If consideration is blank or nil / zero (or the type says no consideration, e.g. gift), the value is NONE. If consideration_type or the papers show it has been paid (cash, bank, advance received), the value is PAID. If an amount or benefit is promised but not yet paid, the value is AGREED.
      fallback: 'Use SALE_INVOICE.total_value: if it is above zero there is a consideration (AGREED, or PAID if payment is shown). Otherwise ask the user: ''Is anything paid or promised in return for this supply?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: AGREED
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_FOS:  # 11. LAST (heavy check only) | 2 law(s) | asked only if M_TOTISOG: F_SKOT
    name: Form Of Supply
    type: CODE
    options:
    - BARTER
    - DISPOSAL
    - EXCHANGE
    - LEASE
    - LICENCE
    - OTHER
    - RENTAL
    - SALE
    - TRANSFER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.consideration_type, SALE_INVOICE.line_description]
      how_to_get: 'Read CONTRACT.subject and CONTRACT.consideration_type. Decide the form of supply: SALE for a price in money with transfer of title, BARTER if the consideration is other goods or services, EXCHANGE, LEASE, RENTAL, LICENCE, TRANSFER or DISPOSAL as the wording says. Use OTHER if none fits.'
      fallback: If there is no contract, read SALE_INVOICE.line_description and invoice_type. If that is also unclear, ask the user how the supply was made.
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: SALE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ARU:  # 12. LAST (heavy check only) | 1 law(s) | asked only if M_SOGATP: F_PRR + F_SKOT
    name: Agent Receipt Undertaking
    type: BOOLEAN
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.parties, CONTRACT.relation_between_parties]
      how_to_get: Read CONTRACT.subject and CONTRACT.parties in the agency agreement or work order. If it says the agent undertakes to receive the goods on behalf of the principal, the value is true. Otherwise it is false.
      fallback: 'Ask the user: ''Has the agent agreed to receive these goods on behalf of the principal?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: 'true'
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_AUC:  # 13. LAST (heavy check only) | 1 law(s) | asked only if M_PTOBAWI: F_ADT + F_ICAA
    name: Asset Use Context
    type: CODE
    options:
    - BUSINESS_USE
    - PERSONAL_USE
    - MIXED_USE
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Was this asset mainly used for business, for personal use, or for both?'' Map the answer to BUSINESS_USE, PERSONAL_USE or MIXED_USE.', fallback: 'If the user cannot say, record UNKNOWN.', when_missing: UNKNOWN, as_of: date of transfer or disposal, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: BUSINESS_USE, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_DOTA:  # 14. LAST (heavy check only) | 1 law(s) | asked only if M_SOGPTA: F_PRR + F_SKOT
    name: Description Of The Activity
    type: TEXT
    tier: T1
    source_kind: DOCUMENT
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.parties, CONTRACT.subject]
      how_to_get: Read parties and subject. Write what the activity consists of, and whether the Central Government, a State Government or a local authority carries it out as a public authority (sovereign function) or as a commercial service.
      fallback: 'Ask the user: What is the activity, and does the government body carry it on as a public authority?'
      when_missing: ASK
      as_of: date of the activity
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: Municipal corporation issuing a trade licence as a statutory function
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SBC:  # 15. LAST (heavy check only) | 1 law(s)
    name: Supply Business Context
    type: CODE
    options:
    - IN_BUSINESS
    - NOT_IN_BUSINESS
    - UNKNOWN
    tier: T1
    source_kind: READ
  F_TN:  # 16. LAST (heavy check only) | 1 law(s)
    name: Transaction Nature
    type: CODE
    options:
    - DOMESTIC_GOODS
    - DOMESTIC_SERVICES
    - IMPORT_GOODS
    - IMPORT_SERVICES
    - OTHER
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a sale'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a transfer'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a barter'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is an exchange'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a licence.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a licence'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a rental'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL2:
    statement: The supply of goods or services or both is a lease.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a lease'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a disposal'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both is a form other than the specified examples.
    order: HIGH
    interpretation: Does the described activity qualify as a form of supply under Section 7(1)(a), even though it is not one
      of the listed examples (sale, transfer, etc.)?
    grounding:
    - F_FOS
    - F_DOAOT
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply is made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SAFC:
    statement: The supply is agreed to be made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is agreed to be made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SICOB:
    statement: The supply is made by a person in the course or furtherance of business.
    order: HIGH
    interpretation: Is the supply made in the course or furtherance of the person's business?
    grounding:
    - F_SBC
    - F_DOAOT
    handler: heavy
  M_IOSFC_A_TIAIOS:
    statement: The transaction is an import of services.
    order: HIGH
    interpretation: 'Decide whether: The transaction is an import of services'
    grounding:
    - F_TN
    handler: light
  M_IOSFC_A_IIFAC:
    statement: The import of services is for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The import of services is for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_PTOBAWI_A_PTOD:
    statement: The transfer or disposal of the assets is permanent, being either a permanent transfer or a permanent disposal
    order: LOW
    rule: F_ADT IN ['PERMANENT_TRANSFER', 'PERMANENT_DISPOSAL']
    handler: python
  M_PTOBAWI_A_AABA:
    statement: The assets transferred or disposed of are business assets
    order: HIGH
    interpretation: Were the assets held and used for the purposes of the business rather than for personal use, judged from
      the use context of the assets?
    grounding:
    - F_AUC
    handler: heavy
  M_PTOBAWI_A_ITCAOA:
    statement: Input tax credit has actually been availed on the same assets that were transferred or disposed of
    order: LOW
    rule: F_ICAA = TRUE
    handler: python
  M_TOBASOG_A_GFBA:
    statement: Goods forming part of the assets of a business
    order: LOW
    rule: F_BAS = 'PART_OF_BUSINESS_ASSETS'
    handler: python
  M_GTENS_A_PSUSP:
    statement: Apart from this proviso, the parent supply provision of Schedule I would treat the transaction as a supply
      even if made without consideration
    order: HIGH
    interpretation: Would the parent supply provision of Schedule I, apart from this proviso, treat this transaction as a
      supply even though no consideration is paid?
    grounding:
    - F_DOAOT
    handler: heavy
  M_GTENS_A_TIAG:
    statement: The transaction is a gift, meaning a transfer made without any consideration, as the word gifts is used in
      the proviso
    order: HIGH
    interpretation: Is the transaction legally a gift, meaning a transfer made without any consideration, as the word gifts
      is used in the proviso?
    grounding:
    - F_SCS
    - F_DOAOT
    handler: heavy
  M_GTENS_A_GBETE:
    statement: The gift is made by an employer to an employee
    order: LOW
    rule: F_PRR = 'EMPLOYEE_EMPLOYER'
    handler: python
  M_GTENS_A_AGVNEL:
    statement: The gifts in a financial year are not exceeding fifty thousand rupees in value
    order: LOW
    rule: F_AGVIFY <= 50000
    handler: python
  M_SOGPTA_A_SBPTA:
    statement: The supply is made by a principal to his agent
    order: LOW
    if_false: F_PRR holds any other party relation value
    rule: F_PRR = 'PRINCIPAL_AGENT'
    handler: python
  M_SOGPTA_A_AUTSG:
    statement: The agent undertakes to supply such goods on behalf of the principal
    order: HIGH
    interpretation: Does the description of the activity show that the agent undertakes to supply such goods on behalf of
      the principal?
    grounding:
    - F_DOTA
    handler: light
  M_SOGPTA_A_SOSG:
    statement: The supply the agent undertakes on behalf of the principal is a supply of goods
    order: LOW
    rule: F_SKOT IN ['GOODS', 'BOTH']
    handler: python
  M_SOGATP_A_SIATP:
    statement: The supply is made by an agent to his principal
    order: LOW
    rule: F_PRR = 'PRINCIPAL_AGENT'
    handler: python
  M_SOGATP_A_AUROG:
    statement: The agent undertakes to receive such goods on behalf of the principal
    order: HIGH
    interpretation: Does the agency agreement or contract show that the agent undertook to receive these goods on behalf of
      the principal?
    grounding:
    - F_ARU
    handler: light
  M_TOTISOG_A_GTT:
    statement: The transaction involves a transfer of the title in goods, meaning title in the goods passes from one person
      to another
    order: HIGH
    if_false: the transaction gives only possession or use without passing title
    interpretation: Does the transaction, as shown by its form and description, pass ownership of the goods (title) from one
      person to another rather than only possession or a right to use them?
    grounding:
    - F_FOS
    - F_DOAOT
    handler: heavy
  M_TOBASOG_A_TBBP:
    statement: The transfer or disposal is by or under the directions of the person carrying on the business
    order: LOW
    rule: F_TIR IN ['BY_BUSINESS_PERSON', 'UNDER_BUSINESS_PERSON_DIRECTION']
    handler: python
  M_TOBASOG_A_NLBA:
    statement: The goods are transferred or disposed of so as no longer to form part of those assets
    order: LOW
    rule: F_PTAS = 'NO_LONGER_PART_OF_ASSETS'
    handler: python
groups:
  M_SIAFOS_G_QFOS:
    name: Qualifying Forms Of Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL2
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: The supply must take one of the listed forms or another qualifying form.
  M_SIAFOS_G_SFC:
    name: Supply For Consideration
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply must be made or agreed to be made for a consideration.
  M_IOSFC_G_CFIOSTBS:
    name: Conditions For Import Of Service To Be Supply
    logic: ALL
    members:
    - M_IOSFC_A_TIAIOS
    - M_IOSFC_A_IIFAC
    description: Both conditions must be met. The business test is explicitly not a condition for this type of supply.
  M_GTENS_G_GEC:
    name: Gift Exception Conditions
    logic: ALL
    members:
    - M_GTENS_A_TIAG
    - M_GTENS_A_AGVNEL
    - M_GTENS_A_GBETE
    description: All three gift conditions must be TRUE
  M_SOGPTA_G_ASA:
    name: Agency Supply Arrangement
    logic: ALL
    members:
    - M_SOGPTA_A_SBPTA
    - M_SOGPTA_A_AUTSG
    - M_SOGPTA_A_SOSG
    description: All three conditions of paragraph 3(a) must hold
  M_SOGATP_G_AGC:
    name: Agent Goods Conditions
    logic: ALL
    members:
    - M_SOGATP_A_SIATP
    - M_SOGATP_A_AUROG
    - M_SOGPTA_A_SOSG
    description: 'Joint conditions of paragraph 3(b): agent to principal, undertaking to receive, and goods'
  M_TOBASOG_G_TCAM:
    name: Transfer Conditions All Met
    logic: ALL
    members:
    - M_TOBASOG_A_GFBA
    - M_PTOBAWI_A_PTOD
    - M_TOBASOG_A_TBBP
    - M_TOBASOG_A_NLBA
    description: All four operative conditions of paragraph 4(a) must be met together.
outcomes:
  M_SIAFOS_LE_IISUS71A:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAFOS_G_QFOS AND M_SIAFOS_G_SFC AND M_SIAFOS_A_SICOB
    module: M_SIAFOS
    description: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_LE_IOSFCIS:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_CFIOSTBS
    module: M_IOSFC
    description: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_PTOBAWI_LE_DSOBA:
    outcome: DEEMED_SUPPLY_WITHOUT_CONSIDERATION
    expr: M_PTOBAWI_A_PTOD AND M_PTOBAWI_A_AABA AND M_PTOBAWI_A_ITCAOA
    module: M_PTOBAWI
    description: All three conditions must be met on the same assets, and consideration is not tested
  M_TOBASOG_LE_GFBA:
    outcome: GOODS_FORM_BUSINESS_ASSETS
    expr: M_TOBASOG_A_GFBA
    module: M_COTPBTE
    description: Goods forming part of the assets of a business (Schedule II, paragraph 4(c), part of the law)
  M_TOBASOG_LE_GFBA_COTPRE:
    outcome: GOODS_ARE_BUSINESS_ASSETS
    expr: M_TOBASOG_A_GFBA
    module: M_COTPRE
    description: Goods forming part of the assets of a business (Schedule II, paragraph 4(c), part of the law)
  M_GTENS_LE_GPE:
    outcome: NOT_SUPPLY_UNDER_PROVISO
    expr: M_GTENS_A_PSUSP AND M_GTENS_G_GEC
    module: M_GTENS
    description: The proviso displaces the parent supply provision only where that provision would otherwise apply and every
      gift condition is met
  M_SOGPTA_LE_AGSD:
    outcome: SUPPLY_WITHOUT_CONSIDERATION
    expr: M_SOGPTA_G_ASA
    module: M_SOGPTA
    description: All conditions of paragraph 3(a) hold, so the supply is treated as a supply even if made without consideration
  M_SOGATP_LE_AGDS:
    outcome: DEEMED_SUPPLY
    expr: M_SOGATP_G_AGC
    module: M_SOGATP
    description: The deeming applies only when all three joint conditions of paragraph 3(b) hold
  M_TOTISOG_LE_GDO:
    outcome: SUPPLY_OF_GOODS
    expr: M_TOTISOG_A_GTT AND M_SOGPTA_A_SOSG
    module: M_TOTISOG
    description: The transaction is a supply of goods when a transfer of the title in goods has taken place.
  M_TOBASOG_LE_BAGS:
    outcome: SUPPLY_OF_GOODS
    expr: M_TOBASOG_G_TCAM
    module: M_TOBASOG
    description: Where all transfer conditions are met, the transfer or disposal is a deemed supply of goods by the person.
  M_TOBASOG_LE_GFBA_PUOBGIS:
    outcome: GOODS_HELD_OR_USED_FOR_BUSINESS
    expr: M_TOBASOG_A_GFBA
