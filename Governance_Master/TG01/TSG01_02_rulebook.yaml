# GOVERNANCE MASTER TSG01_02 Supply without consideration (Schedule I) (TG01 Supply & Taxability)
# LAW ARC - 1 laws - status APPROVED
name: TSG01_02 Supply without consideration (Schedule I) - GOVERNANCE MASTER rulebook
version: TSG01_02
facts:
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
groups:
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
outcomes:
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
products:
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
compounds:
- id: C_SIAWC
  question: 'Section 7(1)(c): Schedule I Activities Without Consideration?'
  includes:
  - M_SIAWC_LE_SAIS
  produces:
  - product: M_SIAWC_PD_SAIS
    from:
    - M_SIAWC_LE_SAIS
time:
  law_date: F_DOI
