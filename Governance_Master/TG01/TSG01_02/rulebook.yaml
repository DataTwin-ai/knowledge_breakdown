    tier: T0
  F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER:
    name: Supplier is a non-resident taxable person
    type: BOOLEAN
    tier: T0
  F_DAYS_BETWEEN_APP_AND_COMMENCEMENT:
    name: Number of days between registration application submission and business commencement
    type: AMOUNT
    tier: T0
  F_PERSON_HAS_SEZ_UNIT:
    name: Person has a unit in a Special Economic Zone
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_SEZ_DEVELOPER:
    name: Person is a Special Economic Zone developer
    type: BOOLEAN
    tier: T1
  F_REGISTRATION_GRANT_TYPE:
    name: 'Kind of grant made: registration or Unique Identity Number'
    type: CODE
    options:
    - NONE
    - REGISTRATION
    - UIN
    tier: T0
  F_APPLICATION_STATUS:
    name: Status of the application for registration or Unique Identity Number
    type: CODE
    options:
    - GRANTED
    - OTHER
    - PENDING
    - REJECTED
    tier: T1
  F_APPLICATION_VERIFICATION_EVIDENCE:
    name: Evidence of due verification for the application
    type: TEXT
    tier: T1
  F_REG_UIN_MANNER_IS_PRESCRIBED:
    name: A manner for grant or rejection of registration/UIN is prescribed
    type: BOOLEAN
    tier: T1
  F_APPLICATION_PROCESS_LOG:
    name: Log of the process followed for the application
    type: TEXT
    tier: T1
  F_AUTHORITY_ACTION_WITHIN_PRESCRIBED_PERIOD:
    name: Officer's action is within the prescribed period
    type: BOOLEAN
    tier: T1
  F_GOVT_REG_CERT_FORM_IS_PRESCRIBED:
    name: A form for the certificate of registration is prescribed
    type: BOOLEAN
    tier: T1
  F_GOVT_REG_CERT_DATE_MANNER_IS_PRESCRIBED:
    name: The manner of determining the effective date of registration is prescribed
    type: BOOLEAN
    tier: T1
  F_APPLICATION_TYPE:
    name: 'Kind of application made: registration or Unique Identity Number'
    type: CODE
    options:
    - OTHER
    - REGISTRATION
    - UIN
    tier: T1
  F_PRESCRIBED_PERIOD_EXPIRED:
    name: The prescribed period for action on the application has expired
    type: BOOLEAN
    tier: T1
  F_DEFICIENCY_COMMUNICATED_IN_PERIOD:
    name: Deficiency was communicated to applicant within the prescribed period
    type: BOOLEAN
    tier: T1
  F_PERSON_POB_COUNT_IN_STATE:
    name: Number of person's places of business in a single State or UT
    type: AMOUNT
    tier: T1
  F_CONDITIONS_FOR_SEP_REG_MET:
    name: The prescribed conditions for the grant of a separate registration are met
    type: BOOLEAN
    tier: T1
  F_PERSON_LIABLE_S22:
    name: Person is liable to be registered under section 22
    type: BOOLEAN
    tier: T1
  F_PERSON_LIABLE_S24:
    name: Person is liable to be registered under section 24
    type: BOOLEAN
    tier: T1
  F_PERSON_REGISTRATION_TYPE:
    name: Type of registration obtained by the person
    type: CODE
    options:
    - VOLUNTARY
    - COMPULSORY
    - OTHER
    tier: T0
  F_PERSON_HAS_MULTIPLE_REGISTRATIONS:
    name: Person has obtained more than one registration
    type: BOOLEAN
    tier: T0
  F_PERSON_REQUIRES_MULTIPLE_REGISTRATIONS:
    name: Person is required to obtain more than one registration
    type: BOOLEAN
    tier: T1
  F_PERSON_HAS_REGISTRATION_IN_STATE_UT:
    name: Person has obtained registration in a State or UT
    type: BOOLEAN
    tier: T0
  F_PERSON_IS_REQUIRED_TO_REGISTER_IN_STATE_UT:
    name: Person is required to obtain registration in a State or UT
    type: BOOLEAN
    tier: T1
  F_PERSON_HAS_ESTABLISHMENT_IN_DIFFERENT_STATE_UT:
    name: Person has an establishment in a different State or UT
    type: BOOLEAN
    tier: T0
  F_PERSON_HAS_VALID_PAN:
    name: Person has a valid Permanent Account Number
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_TDS_DEDUCTOR_S51:
    name: Person is required to deduct tax under section 51
    type: BOOLEAN
    tier: T1
  F_PERSON_TAN:
    name: Tax Deduction and Collection Account Number of the person
    type: TEXT
    tier: T1
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_PERSON_AADHAAR_AUTHENTICATED:
    name: Person has undergone Aadhaar authentication
    type: BOOLEAN
    tier: T1
  F_PERSON_AADHAAR_PROOF_FURNISHED:
    name: Person has furnished proof of Aadhaar possession
    type: BOOLEAN
    tier: T1
  F_COMPLIANCE_FORM_MANNER_MET:
    name: Aadhaar compliance was done in the prescribed form and manner
    type: BOOLEAN
    tier: T1
  F_COMPLIANCE_TIME_MET:
    name: Aadhaar compliance was done within the prescribed time
    type: BOOLEAN
    tier: T1
  F_PERSON_AADHAAR_ASSIGNED:
    name: Aadhaar number is assigned to the registered person
    type: BOOLEAN
    tier: T1
  F_ID_MANNER_IS_PRESCRIBED:
    name: A manner for alternate identification is prescribed by the Government
    type: BOOLEAN
    tier: T1
  F_MANNER_IS_COUNCIL_RECOMMENDED:
    name: The manner for alternate identification is based on the recommendations of the Council
    type: BOOLEAN
    tier: T1
  F_PERSON_ALTERNATE_ID_FURNISHED:
    name: Person has furnished alternate and viable means of identification
    type: BOOLEAN
    tier: T1
  F_APPLICATION_DATE_IS_ON_OR_AFTER_NOTIFIED_DATE:
    name: Application date is on or after the notification effective date
    type: BOOLEAN
    tier: T1
  F_APPLICANT_CONSTITUTION:
    name: Legal constitution of the applicant
    type: CODE
    options:
    - AOP
    - BOI
    - COMPANY
    - HUF
    - INDIVIDUAL
    - OTHER
    - PARTNERSHIP
    tier: T0
  F_KEY_PERSONNEL_AADHAAR_AUTHENTICATED:
    name: Aadhaar authentication for key personnel
    type: BOOLEAN
    tier: T1
  F_KEY_PERSONNEL_AADHAAR_PROOF_FURNISHED:
    name: Proof of Aadhaar possession for key personnel
    type: BOOLEAN
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE_SIAFOS:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SIAFOS:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_DOANFS_1:
    statement: For the purposes of this section, the expression "Aadhaar number" shall have the same meaning as assigned to
      it in clause (a) of section 2 of the Aadhaar (Targeted Delivery of Financial and Other Subsidies, Benefits and Services)
      Act, 2016.
    order: LOW
    rule: F_CONTEXT_IS_SECTION_25 = TRUE
  A_NOT_RETURNED_3Y:
    statement: The capital goods are not received back by the principal within a period of three years of being sent out.
    order: LOW
    rule: F_CAPITAL_GOODS_RETURNED_WITHIN_3Y = FALSE
  A_EMP_GIFT:
    statement: The goods or services or both are given as a gift by an employer to an employee
    order: LOW
    rule: F_GIFT_EMPLOYER_TO_EMPLOYEE = TRUE
  A_GIFT_VALUE_LIMIT:
    statement: The gifts by the employer to the employee in a financial year do not exceed fifty thousand rupees in value
    order: LOW
    rule: F_GIFT_VALUE_FY <= 50000
  A_PRINCIPAL_TO_AGENT:
    statement: The supply is made by a principal to his agent
    order: LOW
    rule: F_SUPPLIER_IS_PRINCIPAL = TRUE AND F_SUPPLY_RECIPIENT_IS_AGENT = TRUE
  A_AGENT_GOODS_UNDERTAKING:
    statement: The agent undertakes to supply such goods on behalf of the principal
    order: LOW
    rule: F_PERSON_ACTS_ON_BEHALF_OF_OTHER = TRUE AND F_SUPPLY_NATURE = 'GOODS'
  A_PERMANENT_DISPOSAL:
    statement: The business asset is permanently transferred or disposed of
    order: LOW
    rule: F_ASSET_TRANSFER_TYPE = 'PERMANENT'
  A_BUSINESS_ASSET:
    statement: The asset permanently transferred or disposed of is a business asset
    order: LOW
    rule: F_ASSET_IS_BUSINESS_ASSET = TRUE
  A_ITC_AVAILED_ON_ASSET:
    statement: Input tax credit has been availed on such assets
    order: LOW
    rule: F_ASSET_ITC_AVAILED = TRUE
  A_SERVICE_IMPORT:
    statement: The supply is an import of services by a person
    order: LOW
    rule: F_SUPPLY_IS_IMPORT_OF_SERVICES = TRUE
  A_RELATED_PERSON_SOURCE:
    statement: The imported services are from a related person of the importer
    order: LOW
    rule: F_SUPPLIER_IS_RELATED_PERSON_OF_RECIPIENT = TRUE
  A_OTHER_ESTABLISHMENT_SOURCE:
    statement: The imported services are from another establishment of the importer located outside India
    order: LOW
    rule: F_SUPPLIER_IS_OTHER_ESTABLISHMENT_OF_RECIPIENT = TRUE AND F_SUPPLIER_LOCATED_OUTSIDE_INDIA = TRUE
  A_BUSINESS_PURPOSE:
    statement: The import of services is in the course or furtherance of business
    order: HIGH
    interpretation: Is the imported service received in the course or furtherance of business
    grounding:
    - F_IMPORT_IN_COURSE_OF_BUSINESS
  A_BUSINESS_ASSET_GOODS:
    statement: Goods forming part of the assets of a business
    order: HIGH
    interpretation: Are the goods forming part of the assets of a business on the facts?
    grounding:
    - F_GOODS_IS_BUSINESS_ASSET
  A_TRANSFERRED:
    statement: The business asset goods are transferred
    order: LOW
    rule: F_GOODS_TRANSFERRED = TRUE
  A_DISPOSED:
    statement: The business asset goods are disposed of
    order: LOW
    rule: F_GOODS_DISPOSED_OF = TRUE
  A_BY_BUSINESS_PERSON:
    statement: The transfer or disposal is made by or under the directions of the person carrying on the business
    order: LOW
    rule: F_EVENT_DIRECTED_BY_BUSINESS_PERSON = TRUE
  A_NO_LONGER_ASSET:
    statement: The transfer or disposal is such that the goods no longer form part of those assets
    order: HIGH
    interpretation: Does the transfer or disposal take the goods out of the business assets so that they no longer form part
      of those assets?
    grounding:
    - F_GOODS_NO_LONGER_BUSINESS_ASSET
  A_PUOBG_PERSON:
    statement: The putting to private use, use, or making available of the goods is by or under the direction of a person
      carrying on a business
    order: HIGH
    interpretation: Is the usage or making available done by a person carrying on a business, or under the direction of such
      a person?
    grounding:
    - F_PERSON_CARRIES_ON_BUSINESS
    - F_GOODS_USE_DIRECTED_BY_BUSINESS_PERSON
  A_PUOBG_GOODS:
    statement: The goods are held or used for the purposes of the business
    order: LOW
    rule: F_GOODS_HELD_OR_USED_FOR_BUSINESS = TRUE
  A_PUOBG_PRIVATE_USE:
    statement: The goods held or used for the purposes of the business are put to any private use
    order: LOW
    rule: F_GOODS_PUT_TO_PRIVATE_USE = TRUE
  A_PUOBG_NON_BUSINESS_USE:
    statement: The goods held or used for the purposes of the business are used for any purpose other than a purpose of the
      business
    order: HIGH
    interpretation: Is the purpose for which the goods are used a purpose other than a purpose of the business?
    grounding:
    - F_GOODS_USED_FOR_NON_BUSINESS_PURPOSE
  A_PUOBG_MADE_AVAILABLE:
    statement: The goods held or used for the purposes of the business are made available to any person for use for any purpose
      other than a purpose of the business
    order: HIGH
    interpretation: Are the goods made available to any person for use for a purpose other than a purpose of the business?
    grounding:
    - F_GOODS_MADE_AVAILABLE_FOR_NON_BUSINESS_USE
  A_TAXABLE_PERSON_CEASES:
    statement: Any person ceases to be a taxable person
    order: LOW
    rule: F_PERSON_CEASES_TAXABLE_STATUS = TRUE
  A_GOODS_BUSINESS_ASSET:
    statement: Any goods form part of the assets of any business carried on by that person
    order: LOW
    rule: F_GOODS_FORM_BUSINESS_ASSET = TRUE
  A_GOING_CONCERN_TRANSFER:
    statement: The business is transferred as a going concern to another person
    order: HIGH
    interpretation: Is the business transferred as a going concern to another person so that the unless exception applies?
    grounding:
    - F_BUSINESS_TRANSFERRED_AS_GOING_CONCERN
  A_BCOBPR_PR_CARRIES_ON:
    statement: The business is carried on by a personal representative
    order: LOW
    rule: F_BUSINESS_CARRIED_ON_BY_PERSONAL_REPRESENTATIVE = TRUE
  A_BCOBPR_PR_DEEMED_TAXABLE:
    statement: The personal representative who carries on the business is deemed to be a taxable person
    order: LOW
    rule: F_PERSONAL_REPRESENTATIVE_DEEMED_TAXABLE = TRUE
  A_BCOBPR_CESSATION:
    statement: Any person ceases to be a taxable person
    order: LOW
    rule: F_PERSON_CEASES_TAXABLE_STATUS = TRUE
  A_BCOBPR_ASSET_GOODS:
    statement: Any goods form part of the assets of any business carried on by that person
    order: LOW
    rule: F_GOODS_FORM_BUSINESS_ASSET = TRUE
  A_M_RFSFTW_1:
    statement: The person makes a supply from the territorial waters of India.
    order: LOW
    rule: F_SUPPLY_ORIGIN_LOCATION = 'TERRITORIAL_WATERS_OF_INDIA'
  A_IS_CTP:
    statement: The person is a casual taxable person
    order: LOW
    rule: F_SUPPLIER_IS_CASUAL_TAXPAYER = TRUE
  A_IS_NRTP:
    statement: The person is a non-resident taxable person
    order: LOW
    rule: F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER = TRUE
  A_TIMING_OBLIGATION:
    statement: The person shall apply for registration at least five days prior to the commencement of business
    order: LOW
    rule: F_DAYS_BETWEEN_APP_AND_COMMENCEMENT >= 5
  A_M_SRFSU_1:
    statement: A person has a unit, as defined in the Special Economic Zones Act, 2005, in a Special Economic Zone
    order: LOW
    rule: F_PERSON_HAS_SEZ_UNIT = TRUE
  A_M_SRFSU_2:
    statement: A person is a Special Economic Zone developer
    order: LOW
    rule: F_PERSON_IS_SEZ_DEVELOPER = TRUE
  A_REGISTRATION_DECISION:
    statement: A decision to grant or reject an application for registration has been made.
    order: LOW
    rule: F_REGISTRATION_GRANT_TYPE = 'REGISTRATION' AND F_APPLICATION_STATUS IN ['GRANTED', 'REJECTED']
  A_UIN_DECISION:
    statement: A decision to grant or reject an application for a Unique Identity Number has been made.
    order: LOW
    rule: F_REGISTRATION_GRANT_TYPE = 'UIN' AND F_APPLICATION_STATUS IN ['GRANTED', 'REJECTED']
  A_DUE_VERIFICATION:
    statement: The decision to grant or reject is made after due verification.
    order: HIGH
    interpretation: Does the evidence show that due verification was conducted before the decision to grant or reject the
      application?
    grounding:
    - F_APPLICATION_VERIFICATION_EVIDENCE
  A_PRESCRIBED_MANNER:
    statement: The decision to grant or reject is made in the manner as may be prescribed.
    order: HIGH
    interpretation: Is a manner for grant/rejection prescribed in the Rules, and was the procedure followed for the decision
      consistent with that prescribed manner?
    grounding:
    - F_REG_UIN_MANNER_IS_PRESCRIBED
    - F_APPLICATION_PROCESS_LOG
  A_PRESCRIBED_PERIOD:
    statement: The decision to grant or reject is made within the period as may be prescribed.
    order: LOW
    rule: F_AUTHORITY_ACTION_WITHIN_PRESCRIBED_PERIOD = TRUE
  A_M_IORC_FORM_PRESCRIBED:
    statement: A certificate of registration shall be issued in such form as may be prescribed.
    order: LOW
    rule: F_GOVT_REG_CERT_FORM_IS_PRESCRIBED = TRUE
  A_M_IORC_DATE_PRESCRIBED:
    statement: A certificate of registration shall be issued with effect from such date as may be prescribed.
    order: LOW
    rule: F_GOVT_REG_CERT_DATE_MANNER_IS_PRESCRIBED = TRUE
  A_APPLIED_FOR_REG:
    statement: The application is for a registration
    order: LOW
    rule: F_APPLICATION_TYPE = 'REGISTRATION'
  A_APPLIED_FOR_UIN:
    statement: The application is for a Unique Identity Number
    order: LOW
    rule: F_APPLICATION_TYPE = 'UIN'
  A_PERIOD_EXPIRED:
    statement: The period prescribed under sub-section (10) has expired
    order: LOW
    rule: F_PRESCRIBED_PERIOD_EXPIRED = TRUE
  A_NO_DEFICIENCY_COMMUNICATED:
    statement: No deficiency has been communicated to the applicant within the period prescribed under sub-section (10)
    order: LOW
    rule: F_DEFICIENCY_COMMUNICATED_IN_PERIOD = FALSE
  A_SINGLE_REGISTRATION_RULE:
    statement: A person seeking registration under this Act shall be granted a single registration in a State or Union territory.
    order: LOW
    rule: F_APPLICATION_TYPE = 'REGISTRATION'
  A_MULTIPLE_POB_IN_STATE:
    statement: A person has multiple places of business in a single State or Union territory.
    order: LOW
    rule: F_PERSON_POB_COUNT_IN_STATE > 1
  A_PRESCRIBED_CONDITIONS_MET:
    statement: The prescribed conditions for the grant of a separate registration for each such place of business are met.
    order: LOW
    rule: F_CONDITIONS_FOR_SEP_REG_MET = TRUE
  A_NOT_LIABLE_S22:
    statement: The person is not liable to be registered under section 22.
    order: LOW
    rule: F_PERSON_LIABLE_S22 = FALSE
  A_NOT_LIABLE_S24:
    statement: The person is not liable to be registered under section 24.
    order: LOW
    rule: F_PERSON_LIABLE_S24 = FALSE
  A_PROVISIONS_APPLY:
    statement: All provisions of this Act, as are applicable to a registered person, shall apply to a person who has registered
      voluntarily.
    order: LOW
    rule: F_PERSON_REGISTRATION_TYPE = 'VOLUNTARY'
  A_DEEMED_DISTINCT_PERSONS:
    statement: A person who has obtained or is required to obtain more than one registration, whether in one State or Union
      territory or more than one State or Union territory shall, in respect of each such registration, be treated as distinct
      persons for the purposes of this Act.
    order: LOW
    rule: F_PERSON_HAS_MULTIPLE_REGISTRATIONS IS_SET OR F_PERSON_REQUIRES_MULTIPLE_REGISTRATIONS IS_SET
  A_M_EIDSAD_REGISTRATION_OBTAINED:
    statement: a person has obtained registration in a State or Union territory in respect of an establishment
    order: LOW
    rule: F_PERSON_HAS_REGISTRATION_IN_STATE_UT = TRUE
  A_M_EIDSAD_REGISTRATION_REQUIRED:
    statement: a person is required to obtain registration in a State or Union territory in respect of an establishment
    order: LOW
    rule: F_PERSON_IS_REQUIRED_TO_REGISTER_IN_STATE_UT = TRUE
  A_M_EIDSAD_OTHER_ESTABLISHMENT:
    statement: the person has an establishment in another State or Union territory
    order: LOW
    rule: F_PERSON_HAS_ESTABLISHMENT_IN_DIFFERENT_STATE_UT = TRUE
  A_PAN_REQUIRED:
    statement: The person has a Permanent Account Number issued under the Income-tax Act, 1961
    order: LOW
    rule: F_PERSON_HAS_VALID_PAN = TRUE
  A_M_TPRE_1:
    statement: The person is required to deduct tax under section 51.
    order: LOW
    rule: F_PERSON_IS_TDS_DEDUCTOR_S51 = TRUE
  A_M_TPRE_2:
    statement: The person has a Tax Deduction and Collection Account Number issued under the said Act.
    order: LOW
    rule: F_PERSON_TAN IS_SET
  A_M_RPAA_1:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_M_RPAA_2:
    statement: The registered person undergoes authentication of Aadhaar number
    order: LOW
    rule: F_PERSON_AADHAAR_AUTHENTICATED = TRUE
  A_M_RPAA_3:
    statement: The registered person furnishes proof of possession of Aadhaar number
    order: LOW
    rule: F_PERSON_AADHAAR_PROOF_FURNISHED = TRUE
  A_M_RPAA_4:
    statement: The authentication or furnishing of proof is done in the form and manner as prescribed
    order: LOW
    rule: F_COMPLIANCE_FORM_MANNER_MET = TRUE
  A_M_RPAA_5:
    statement: The authentication or furnishing of proof is done within the time as prescribed
    order: LOW
    rule: F_COMPLIANCE_TIME_MET = TRUE
  A_AADHAAR_NOT_ASSIGNED:
    statement: An Aadhaar number is not assigned to the registered person.
    order: LOW
    rule: F_PERSON_AADHAAR_ASSIGNED = FALSE
  A_MANNER_PRESCRIBED:
    statement: The alternate and viable means of identification are provided in a manner prescribed by the Government.
    order: LOW
    rule: F_ID_MANNER_IS_PRESCRIBED = TRUE
  A_PRESCRIPTION_RECOMMENDED:
    statement: The Government's prescription of the manner for alternate identification is on the recommendations of the Council.
    order: LOW
    rule: F_MANNER_IS_COUNCIL_RECOMMENDED = TRUE
  A_FAIL_AADHAAR_AUTH:
    statement: A person fails to undergo authentication
    order: LOW
    rule: F_PERSON_AADHAAR_AUTHENTICATED = FALSE
  A_FAIL_AADHAAR_PROOF:
    statement: A person fails to furnish proof of possession of Aadhaar number
    order: LOW
    rule: F_PERSON_AADHAAR_PROOF_FURNISHED = FALSE
  A_FAIL_ALT_ID:
    statement: A person fails to furnish alternate and viable means of identification
    order: LOW
    rule: F_PERSON_ALTERNATE_ID_FURNISHED = FALSE
  A_EFFECTIVE_FROM_NOTIFICATION:
    statement: The requirement for Aadhaar compliance for registration eligibility applies on and from a date specified in
      a notification.
    order: LOW
    rule: F_APPLICATION_DATE_IS_ON_OR_AFTER_NOTIFIED_DATE = TRUE
  A_APPLICANT_IS_INDIVIDUAL:
    statement: The applicant for grant of registration is an individual.
    order: LOW
    rule: F_APPLICANT_CONSTITUTION = 'INDIVIDUAL'
  A_FOR_REGISTRATION_GRANT:
    statement: The purpose of the application is to be eligible for the grant of registration.
    order: LOW
    rule: F_APPLICATION_TYPE = 'REGISTRATION'
  A_AADHAAR_AUTHENTICATED:
    statement: The individual undergoes authentication of Aadhaar number to be eligible for grant of registration.
    order: LOW
    rule: F_PERSON_AADHAAR_AUTHENTICATED = TRUE
  A_AADHAAR_PROOF_FURNISHED:
    statement: The individual furnishes proof of possession of Aadhaar number to be eligible for grant of registration.
    order: LOW
    rule: F_PERSON_AADHAAR_PROOF_FURNISHED = TRUE
  A_COMPLIANCE_IN_PRESCRIBED_MANNER:
    statement: The Aadhaar authentication or furnishing of proof is done in the manner specified by the Government in the
      relevant notification, on the recommendations of the Council.
    order: LOW
    rule: F_COMPLIANCE_FORM_MANNER_MET = TRUE
  A_M_AIFUA_1:
    statement: The applicant for registration is an individual.
    order: LOW
    rule: F_APPLICANT_CONSTITUTION = 'INDIVIDUAL'
  A_M_AIFUA_2:
    statement: An Aadhaar number is not assigned to the individual.
    order: LOW
    rule: F_PERSON_AADHAAR_ASSIGNED = FALSE
  A_M_AIFUA_3:
    statement: The individual shall be offered alternate and viable means of identification.
    order: HIGH
    interpretation: Does the application process log or other evidence show that alternate and viable means of identification
      were offered to the individual?
    grounding:
    - F_APPLICATION_PROCESS_LOG
  A_M_AIFUA_4:
    statement: The manner of identification is specified by the Government in the said notification.
    order: LOW
    rule: F_ID_MANNER_IS_PRESCRIBED = TRUE
  A_M_AIFUA_5:
    statement: The manner is specified by the Government on the recommendations of the Council.
    order: LOW
    rule: F_MANNER_IS_COUNCIL_RECOMMENDED = TRUE
  A_EFFECTIVE_DATE:
    statement: The requirement applies on and from the date of a notification issued by the Government.
    order: LOW
    rule: F_APPLICATION_DATE_IS_ON_OR_AFTER_NOTIFIED_DATE = TRUE
  A_NON_INDIVIDUAL:
    statement: The person seeking registration is a person other than an individual.
    order: LOW
    rule: F_APPLICANT_CONSTITUTION != 'INDIVIDUAL'
  A_AADHAAR_AUTHENTICATION:
    statement: The applicant undergoes authentication of the Aadhaar number for its Karta, Managing Director, whole time Director,
      specified partners, Members of Managing Committee of Association, Board of Trustees, authorised representative, authorised
      signatory, or other specified class of persons.
    order: HIGH
    interpretation: Have the specified key personnel of the non-individual entity undergone Aadhaar authentication as per
      the notification?
    grounding:
    - F_KEY_PERSONNEL_AADHAAR_AUTHENTICATED
  A_AADHAAR_PROOF:
    statement: The applicant furnishes proof of possession of the Aadhaar number for its Karta, Managing Director, whole time
      Director, specified partners, Members of Managing Committee of Association, Board of Trustees, authorised representative,
      authorised signatory, or other specified class of persons.
    order: HIGH
    interpretation: Has proof of Aadhaar possession for the specified key personnel of the non-individual entity been furnished
      as per the notification?
    grounding:
    - F_KEY_PERSONNEL_AADHAAR_PROOF_FURNISHED
  A_PRESCRIBED_MANNER_AAFNE:
    statement: The Aadhaar authentication or furnishing of proof is done in the manner specified by the Government in the
      relevant notification.
    order: LOW
    rule: F_COMPLIANCE_FORM_MANNER_MET = TRUE
  A_COUNCIL_RECOMMENDATION:
    statement: The notification specifying the manner of compliance is issued on the recommendations of the Council.
    order: LOW
    rule: F_MANNER_IS_COUNCIL_RECOMMENDED = TRUE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE_SIAFOS
    - A_AGREED_SIAFOS
    description: The supply must be either made or agreed to be made.
  G_EMP_GIFT_CONDITIONS:
    name: Employer employee gift conditions
    logic: ALL
    members:
    - A_EMP_GIFT
    - A_GIFT_VALUE_LIMIT
    description: Both the employer to employee gift condition and the value limit must hold
  G_PRINCIPAL_AGENT_GOODS:
    name: Principal agent goods
    logic: ALL
    members:
    - A_PRINCIPAL_TO_AGENT
    - A_AGENT_GOODS_UNDERTAKING
    description: Both the principal-to-agent supply and the agent goods undertaking must hold, joined by where.
  G_PTOBA:
    name: Permanent asset deeming test
    logic: ALL
    members:
    - A_PERMANENT_DISPOSAL
    - A_BUSINESS_ASSET
    - A_ITC_AVAILED_ON_ASSET
    description: All three conditions of entry 1 must hold
  G_SOURCE:
    name: Source relationship
    logic: ANY
    members:
    - A_RELATED_PERSON_SOURCE
    - A_OTHER_ESTABLISHMENT_SOURCE
    description: Supplier is either a related person of the importer or another establishment of the importer located outside
      India.
  G_TRANSFER_OR_DISPOSAL:
    name: Transfer or disposal alternatives
    logic: ANY
    members:
    - A_TRANSFERRED
    - A_DISPOSED
    description: Either a transfer or a disposal of the goods satisfies this group.
  G_PUOBG_USE:
    name: Private or non-business use
    logic: ANY
    members:
    - A_PUOBG_PRIVATE_USE
    - A_PUOBG_NON_BUSINESS_USE
    - A_PUOBG_MADE_AVAILABLE
    description: At least one of the three alternative forms of private or non-business use applies.
  G_DEEMING_CONDITIONS:
    name: Cessation and business asset goods
    logic: ALL
    members:
    - A_TAXABLE_PERSON_CEASES
    - A_GOODS_BUSINESS_ASSET
    description: Both the cessation of taxable person status and goods forming part of business assets are required before
      the deeming applies
  G_BCOBPR_PR_EXCEPTION:
    name: Personal representative exception
    logic: ALL
    members:
    - A_BCOBPR_PR_CARRIES_ON
    - A_BCOBPR_PR_DEEMED_TAXABLE
    description: The exception applies only when the business is carried on by a personal representative AND that personal
      representative is deemed to be a taxable person
  G_PERSON_TYPE:
    name: Person Type
    logic: ANY
    members:
    - A_IS_CTP
    - A_IS_NRTP
    description: The person is either a casual taxable person or a non-resident taxable person.
  G_M_SRFSU_1:
    name: Person is an SEZ unit holder or developer
    logic: ANY
    members:
    - A_M_SRFSU_1
    - A_M_SRFSU_2
  G_DECISION_SUBJECT:
    name: Decision Subject
    logic: ANY
    members:
    - A_REGISTRATION_DECISION
    - A_UIN_DECISION
    description: A decision must be made for either a registration application or a Unique Identity Number application.
  G_DEEMING_CONDITIONS_DGOROU:
    name: Conditions for deemed grant
    logic: ALL
    members:
    - A_PERIOD_EXPIRED
    - A_NO_DEFICIENCY_COMMUNICATED
    description: The conditions that must be met for a registration or UIN to be deemed granted.
  G_ELIGIBILITY_CONDITION:
    name: Eligibility Condition
    logic: ALL
    members:
    - A_NOT_LIABLE_S22
    - A_NOT_LIABLE_S24
    description: The person must not be liable for registration under either Section 22 or Section 24.
  G_M_EIDSAD_CONDITIONS:
    name: Conditions for deeming establishments as distinct persons
    logic: ALL
    members:
    - G_M_EIDSAD_REG_STATUS
    - A_M_EIDSAD_OTHER_ESTABLISHMENT
  G_M_EIDSAD_REG_STATUS:
    name: Registration status in a State or UT
    logic: ANY
    members:
    - A_M_EIDSAD_REGISTRATION_OBTAINED
    - A_M_EIDSAD_REGISTRATION_REQUIRED
  G_M_RPAA_1:
    name: Aadhaar Action
    logic: ANY
    members:
    - A_M_RPAA_2
    - A_M_RPAA_3
    description: The person must either undergo authentication OR furnish proof.
  G_M_RPAA_2:
    name: Prescribed Procedure
    logic: ALL
    members:
    - A_M_RPAA_4
    - A_M_RPAA_5
    description: The action must comply with both the prescribed form/manner AND the prescribed time.
  G_MANNER_VALID:
    name: Manner Validity
    logic: ALL
    members:
    - A_MANNER_PRESCRIBED
    - A_PRESCRIPTION_RECOMMENDED
    description: The manner for alternate identification must be both prescribed by the Government and based on Council recommendations.
  G_FAILURE_CONDITIONS:
    name: Failure of identification requirements
    logic: ANY
    members:
    - A_FAIL_AADHAAR_AUTH
    - A_FAIL_AADHAAR_PROOF
    - A_FAIL_ALT_ID
    description: A person fails to undergo Aadhaar authentication, or furnish proof of Aadhaar, or furnish alternate identification.
  G_AADHAAR_ACTION:
    name: Aadhaar compliance action
    logic: ANY
    members:
    - A_AADHAAR_AUTHENTICATED
    - A_AADHAAR_PROOF_FURNISHED
  G_M_AIFUA_TRIGGER:
    name: Trigger for alternate identification
    logic: ALL
    members:
    - A_M_AIFUA_1
    - A_M_AIFUA_2
  G_M_AIFUA_CONSEQUENCE:
    name: Obligation for alternate identification
    logic: ALL
    members:
    - A_M_AIFUA_3
    - A_M_AIFUA_4
    - A_M_AIFUA_5
  G_AADHAAR_COMPLIANCE:
    name: Aadhaar compliance by authentication or proof
    logic: ANY
    members:
    - A_AADHAAR_AUTHENTICATION
    - A_AADHAAR_PROOF
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_DOANFS_1:
    outcome: AADHAAR_NUMBER_MEANING_DEFINED
    expr: A_DOANFS_1
    module: M_DOANFS
    description: The meaning of 'Aadhaar number' is established for the purposes of Section 25.
  LE_NOT_RETURNED_3Y:
    outcome: NOT_RETURNED_3Y
    expr: A_NOT_RETURNED_3Y
    module: M_DSOUCG
    description: The capital goods are not received back by the principal within a period of three years of being sent out.
      (Section 19(6), part of the law)
  LE_EGNTAS:
    outcome: NOT_TREATED_AS_SUPPLY
    expr: G_EMP_GIFT_CONDITIONS
    module: M_EGNTAS
    description: The gift is not treated as supply of goods or services or both when both proviso conditions hold
  LE_SOGBPTA:
    outcome: DEEMED_SUPPLY_WITHOUT_CONSIDERATION
    expr: G_PRINCIPAL_AGENT_GOODS
    module: M_SOGBPTA
    description: The activity is treated as a supply even if made without consideration when the principal-to-agent goods
      group is met.
  LE_PTOBA:
    outcome: DEEMED_SUPPLY_UNDER_SCHEDULE_I
    expr: G_PTOBA
    module: M_PTOBA
    description: Permanent transfer or disposal of business assets where input tax credit has been availed on such assets
      is treated as a supply, even if made without consideration
  LE_IOSFRP:
    outcome: DEEMED_SUPPLY_IMPORT_SERVICES
    expr: A_SERVICE_IMPORT AND G_SOURCE AND A_BUSINESS_PURPOSE
    module: M_IOSFRP
    description: Import of services by a person from a related person or from any of his other establishments outside India
      in the course or furtherance of business is treated as a supply under Schedule I paragraph 4.
  LE_TOBAIGS:
    outcome: DEEMED_GOODS_SUPPLY_BY_PERSON
    expr: A_BUSINESS_ASSET_GOODS AND G_TRANSFER_OR_DISPOSAL AND A_BY_BUSINESS_PERSON AND A_NO_LONGER_ASSET
    module: M_TOBAIGS
    description: All four conditions must be TRUE for the deeming outcome.
  LE_PUOBG_DEEMED_SERVICE:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: A_PUOBG_PERSON AND A_PUOBG_GOODS AND G_PUOBG_USE
    module: M_PUOBG
    description: The usage or making available of the goods is deemed a supply of services when the goods are business goods,
      the act is by or under the direction of a business person, and at least one of the private or non-business use limbs
      applies.
  LE_BTAGC_DEEMED:
    outcome: DEEMED_SUPPLY_OF_GOODS_BY_PERSON_IN_COURSE_OR_FURTHERANCE_OF_BUSINESS_IMMEDIATELY_BEFORE_CESSATION
    expr: G_DEEMING_CONDITIONS AND NOT A_GOING_CONCERN_TRANSFER
    module: M_BTAGC
    description: The goods are deemed supplied by the person in the course or furtherance of his business immediately before
      he ceases to be a taxable person when he ceases to be a taxable person and the goods form part of the assets of his
      business and the business is not transferred as a going concern to another p
  LE_BCOBPR_DEEMED:
    outcome: DEEMED_SUPPLY_OF_BUSINESS_ASSET_GOODS_BY_PERSON_IN_COURSE_OR_FURTHERANCE_OF_BUSINESS_IMMEDIATELY_BEFORE_CESSATION
    expr: A_BCOBPR_CESSATION AND A_BCOBPR_ASSET_GOODS AND NOT G_BCOBPR_PR_EXCEPTION
    module: M_BCOBPR
    description: Deemed supply arises when the person ceases to be a taxable person and the goods form part of the business
      assets, unless the personal representative exception applies
  LE_M_RFSFTW_1:
    outcome: REGISTRATION_REQUIRED_IN_SPECIFIED_LOCATION
    expr: A_M_RFSFTW_1
    module: M_RFSFTW
    description: If a person makes a supply from the territorial waters of India, they are obligated to obtain registration
      in the coastal State or Union territory where the nearest point of the appropriate baseline is located.
  LE_M_RFCONP:
    outcome: OBLIGATION_MET
    expr: G_PERSON_TYPE AND A_TIMING_OBLIGATION
    module: M_RFCONP
    description: The obligation to apply for registration is met if the person is a casual or non-resident taxable person
      and applies at least five days before business commencement.
  LE_M_SRFSU:
    outcome: OBLIGATION_TO_APPLY_FOR_SEPARATE_REGISTRATION
    expr: G_M_SRFSU_1
    module: M_SRFSU
    description: If the person has an SEZ unit or is an SEZ developer, they are obligated to apply for a separate registration,
      which is distinct from any business place outside the SEZ in the same State or UT.
  LE_VATFGOR:
    outcome: REGISTRATION_PROCESS_COMPLIANT
    expr: G_DECISION_SUBJECT AND A_DUE_VERIFICATION AND A_PRESCRIBED_MANNER AND A_PRESCRIBED_PERIOD
    module: M_VATFGOR
    description: The process for deciding on a registration or UIN application is compliant if a decision is made on the correct
      subject, after due verification, and within the prescribed manner and period.
  LE_M_IORC:
    outcome: PROCEDURE_DEFINED
    expr: A_M_IORC_FORM_PRESCRIBED AND A_M_IORC_DATE_PRESCRIBED
    module: M_IORC
    description: The procedure for issuing a registration certificate requires that the form and effective date are as prescribed.
  LE_DEEMED_REGISTRATION:
    outcome: REGISTRATION_DEEMED_GRANTED
    expr: A_APPLIED_FOR_REG AND G_DEEMING_CONDITIONS_DGOROU
    module: M_DGOROU
    description: Deemed grant of a registration number.
  LE_DEEMED_UIN:
    outcome: UIN_DEEMED_GRANTED
    expr: A_APPLIED_FOR_UIN AND G_DEEMING_CONDITIONS_DGOROU
    module: M_DGOROU
    description: Deemed grant of a Unique Identity Number.
  LE_SRIAS:
    outcome: SINGLE_REGISTRATION_MANDATED
    expr: A_SINGLE_REGISTRATION_RULE
    module: M_SRIAS
    description: The person shall be granted a single registration in the State or Union territory.
  LE_M_SRFMBP:
    outcome: SEPARATE_REGISTRATION_PERMITTED
    expr: A_MULTIPLE_POB_IN_STATE AND A_PRESCRIBED_CONDITIONS_MET
    module: M_SRFMBP
  LE_PERMISSION:
    outcome: VOLUNTARY_REGISTRATION_PERMITTED
    expr: G_ELIGIBILITY_CONDITION
    module: M_VRAIC
    description: The person is permitted to register for GST voluntarily if they are not liable for mandatory registration.
  LE_CONSEQUENCE:
    outcome: ALL_PROVISIONS_APPLY
    expr: A_PROVISIONS_APPLY
    module: M_VRAIC
    description: All provisions of the GST Act that apply to a registered person will apply to the voluntarily registered
      person.
  LE_MRTADP:
    outcome: ARE_DISTINCT_PERSONS
    expr: A_DEEMED_DISTINCT_PERSONS
    module: M_MRTADP
    description: The person is deemed to be a collection of distinct persons.
  LE_M_EIDSAD:
    outcome: ESTABLISHMENTS_DEEMED_DISTINCT
    expr: G_M_EIDSAD_CONDITIONS
    module: M_EIDSAD
    description: The establishments are treated as establishments of distinct persons.
  LE_PRFGR:
    outcome: ELIGIBLE_FOR_REGISTRATION
    expr: A_PAN_REQUIRED
    module: M_PRFGR
    description: The person is eligible for grant of registration under this subsection if the PAN condition is met.
  LE_M_TPRE:
    outcome: ELIGIBLE_FOR_REGISTRATION
    expr: A_M_TPRE_1 AND A_M_TPRE_2
    module: M_TPRE
  LE_M_RPAA:
    outcome: OBLIGATION_MET
    expr: A_M_RPAA_1 AND G_M_RPAA_1 AND G_M_RPAA_2
    module: M_RPAA
    description: The obligation is met if the registered person performs one of the required actions in the prescribed way.
  LE_1_M_AIFUA:
    outcome: OBLIGATION_TO_OFFER_ALT_ID_EXISTS
    expr: A_AADHAAR_NOT_ASSIGNED
    module: M_AIFUA
    description: An obligation to offer alternate means of identification exists if an Aadhaar number is not assigned to the
      registered person.
  LE_2_M_AIFUA:
    outcome: ALT_ID_MANNER_IS_VALIDLY_DEFINED
    expr: G_MANNER_VALID
    module: M_AIFUA
    description: The manner for alternate identification is validly defined if it is prescribed by the Government on the recommendations
      of the Council.
  LE_REGISTRATION_STATUS:
    outcome: REGISTRATION_DEEMED_INVALID
    expr: G_FAILURE_CONDITIONS
    module: M_FOAAC
    description: If the person fails any of the identification requirements, their registration is deemed invalid.
  LE_ACT_APPLICATION:
    outcome: PERSON_TREATED_AS_UNREGISTERED
    expr: G_FAILURE_CONDITIONS
    module: M_FOAAC
    description: If the person fails any of the identification requirements, other provisions of the Act apply as if they
      are not registered.
  LE_AAFRE:
    outcome: REGISTRATION_ELIGIBILITY_CONDITION_MET
    expr: A_EFFECTIVE_FROM_NOTIFICATION AND A_APPLICANT_IS_INDIVIDUAL AND A_FOR_REGISTRATION_GRANT AND G_AADHAAR_ACTION AND
      A_COMPLIANCE_IN_PRESCRIBED_MANNER
    module: M_AAFRE
  LE_M_AIFUA:
    outcome: COMPLIANT_ALTERNATE_ID_PROCESS
    expr: (NOT G_M_AIFUA_TRIGGER) OR G_M_AIFUA_CONSEQUENCE
    module: M_AIFUA
  LE_AAFNE:
    outcome: ELIGIBILITY_FOR_REGISTRATION_MET
    expr: A_EFFECTIVE_DATE AND A_NON_INDIVIDUAL AND G_AADHAAR_COMPLIANCE AND A_PRESCRIBED_MANNER_AAFNE AND A_COUNCIL_RECOMMENDATION
    module: M_AAFNE
products:
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_DOANFS_1:
    statement: The meaning of 'Aadhaar number' is established for the purposes of Section 25.
  PD_NOT_RETURNED_3Y:
    statement: The capital goods are not received back by the principal within a period of three years of being sent out.
  PD_EGNTAS:
    statement: The gift is not treated as supply of goods or services or both when both proviso conditions hold
  PD_SOGBPTA:
    statement: The activity is treated as a supply even if made without consideration when the principal-to-agent goods group
      is met.
  PD_PTOBA:
    statement: Permanent transfer or disposal of business assets where input tax credit has been availed on such assets is
      treated as a supply, even if made without consideration
  PD_IOSFRP:
    statement: Import of services by a person from a related person or from any of his other establishments outside India
      in the course or furtherance of business is treated as a supply under Schedule I paragraph 4.
  PD_TOBAIGS:
    statement: All four conditions must be TRUE for the deeming outcome.
  PD_PUOBG_DEEMED_SERVICE:
    statement: The usage or making available of the goods is deemed a supply of services when the goods are business goods,
      the act is by or under the direction of a business person, and at least one of the private or non-business use limbs
      applies.
  PD_BTAGC_DEEMED:
    statement: The goods are deemed supplied by the person in the course or furtherance of his business immediately before
      he ceases to be a taxable person when he ceases to be a taxable person and the goods form part of the assets of his
      business and the business is not transferred as a going concern to another p
  PD_BCOBPR_DEEMED:
    statement: Deemed supply arises when the person ceases to be a taxable person and the goods form part of the business
      assets, unless the personal representative exception applies
  PD_M_RFSFTW_1:
    statement: If a person makes a supply from the territorial waters of India, they are obligated to obtain registration
      in the coastal State or Union territory where the nearest point of the appropriate baseline is located.
  PD_M_RFCONP:
    statement: The obligation to apply for registration is met if the person is a casual or non-resident taxable person and
      applies at least five days before business commencement.
  PD_M_SRFSU:
    statement: If the person has an SEZ unit or is an SEZ developer, they are obligated to apply for a separate registration,
      which is distinct from any business place outside the SEZ in the same State or UT.
  PD_VATFGOR:
    statement: The process for deciding on a registration or UIN application is compliant if a decision is made on the correct
      subject, after due verification, and within the prescribed manner and period.
  PD_M_IORC:
    statement: The procedure for issuing a registration certificate requires that the form and effective date are as prescribed.
  PD_DEEMED_REGISTRATION:
    statement: Deemed grant of a registration number.
  PD_DEEMED_UIN:
    statement: Deemed grant of a Unique Identity Number.
  PD_SRIAS:
    statement: The person shall be granted a single registration in the State or Union territory.
  PD_M_SRFMBP:
    statement: SEPARATE_REGISTRATION_PERMITTED
  PD_PERMISSION:
    statement: The person is permitted to register for GST voluntarily if they are not liable for mandatory registration.
  PD_CONSEQUENCE:
    statement: All provisions of the GST Act that apply to a registered person will apply to the voluntarily registered person.
  PD_MRTADP:
    statement: The person is deemed to be a collection of distinct persons.
  PD_M_EIDSAD:
    statement: The establishments are treated as establishments of distinct persons.
  PD_PRFGR:
    statement: The person is eligible for grant of registration under this subsection if the PAN condition is met.
  PD_M_TPRE:
    statement: ELIGIBLE_FOR_REGISTRATION
  PD_M_RPAA:
    statement: The obligation is met if the registered person performs one of the required actions in the prescribed way.
  PD_1_M_AIFUA:
    statement: An obligation to offer alternate means of identification exists if an Aadhaar number is not assigned to the
      registered person.
  PD_2_M_AIFUA:
    statement: The manner for alternate identification is validly defined if it is prescribed by the Government on the recommendations
      of the Council.
  PD_REGISTRATION_STATUS:
    statement: If the person fails any of the identification requirements, their registration is deemed invalid.
  PD_ACT_APPLICATION:
    statement: If the person fails any of the identification requirements, other provisions of the Act apply as if they are
      not registered.
  PD_AAFRE:
    statement: REGISTRATION_ELIGIBILITY_CONDITION_MET
  PD_M_AIFUA:
    statement: COMPLIANT_ALTERNATE_ID_PROCESS
  PD_AAFNE:
    statement: ELIGIBILITY_FOR_REGISTRATION_MET
