  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_CONTEXT_IS_SECTION_25:
    name: The interpretation context is Section 25
    type: BOOLEAN
    tier: T0
  F_SUPPLY_ORIGIN_LOCATION:
    name: Geographical origin of the supply
    type: CODE
    options:
    - TERRITORIAL_WATERS_OF_INDIA
