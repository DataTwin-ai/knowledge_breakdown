# GOVERNANCE MASTER TSG01_06 Business test (TG01 Supply & Taxability)
# LAW ARC - 1 laws - status APPROVED
name: TSG01_06 Business test - GOVERNANCE MASTER rulebook
version: TSG01_06
facts:
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
groups: {}
outcomes:
  M_SIAFOS_LE_SBPIB:
    outcome: SUPPLY_BY_PERSON_IN_BUSINESS
    expr: M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The supply is made or agreed to be made by a person in the course or furtherance of business (Section 7(1),
      part of the law)
products:
  M_SIAFOS_PD_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
compounds:
- id: C_SIAFOS
  question: The supply is made or agreed to be made by a person in the course or furtherance of business? (Section 7(1))
  includes:
  - M_SIAFOS_LE_SBPIB
  produces:
  - product: M_SIAFOS_PD_SBPIB
    from:
    - M_SIAFOS_LE_SBPIB
time:
  law_date: F_DOI
