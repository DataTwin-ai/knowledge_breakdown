# GOVERNANCE MASTER TSG01_06 Business test (TG01 Supply & Taxability)
# LAW ARC - 3 laws - status APPROVED
name: TSG01_06 Business test - GOVERNANCE MASTER rulebook
version: TSG01_06
facts:
  # ---- LAST: only heavy checks (free text) need these
  F_DOAOT:  # 1. LAST (heavy check only) | 1 law(s)
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description, CONTRACT.employment_terms]
      how_to_get: Read the contract subject, then property_description if it is about property, or employment_terms if it is about employment. Write a short plain-text description of the activity or transaction and who does it for whom.
      fallback: 'Use SALE_INVOICE.line_description. If that is also missing, ask the user: Please describe the activity or transaction.'
      when_missing: ASK
      as_of: date of the activity or transaction
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: Sale of a vacant plot of land to a buyer
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PBAD:  # 2. LAST (heavy check only) | 1 law(s)
    name: Person Business Activity Description
    type: TEXT
    tier: T1
    origin:
      document: GST_REGISTRATION
      method: FIELD
      uses: [GST_REGISTRATION.nature_of_business]
      how_to_get: Search the registration by the person's gstin. Copy nature_of_business as the description of what business the person carries on. If the registration is found and the field is filled, that is the value.
      fallback: 'Ask the user: ''Does this person carry on a business? If yes, what business?'''
      when_missing: ASK
      as_of: date the goods were put to private use or made available
      level: TAXPAYER
      ai_level: NONE
      cost: LOW
      example: Wholesale trading of electronic goods
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PLP:  # 3. LAST (heavy check only) | 1 law(s)
    name: Property Letting Purpose
    type: CODE
    options:
    - BUSINESS_OR_COMMERCE_WHOLLY
    - BUSINESS_OR_COMMERCE_PARTLY
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description]
      how_to_get: Read the contract subject and property description for the stated use of the let or leased property. If it is used wholly for business, trade or commerce, the value is BUSINESS_OR_COMMERCE_WHOLLY. If it is used partly for business and partly for something else, such as residence, the value is BUSINESS_OR_COMMERCE_PARTLY. If it is used only for non-business purposes, the value is OTHER.
      fallback: 'Ask the user: ''Is the property used wholly or partly for business or commerce, or for something else?'''
      when_missing: ASK
      as_of: date of the agreement
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: BUSINESS_OR_COMMERCE_WHOLLY
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SBC:  # 4. LAST (heavy check only) | 1 law(s)
    name: Supply Business Context
    type: CODE
    options:
    - IN_BUSINESS
    - NOT_IN_BUSINESS
    - UNKNOWN
    tier: T1
    source_kind: READ
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SICOB:
    statement: The supply is made by a person in the course or furtherance of business.
    order: HIGH
    interpretation: Is the supply made in the course or furtherance of the person's business?
    grounding:
    - F_SBC
    - F_DOAOT
    handler: heavy
  M_PUOBGIS_A_PCOAB:
    statement: The person by whom or under whose direction the goods are used or made available is a person carrying on a
      business
    order: HIGH
    interpretation: Does the described activity of the person amount to carrying on a business?
    grounding:
    - F_PBAD
    handler: heavy
  M_BLSOS_A_LIFBOC:
    statement: The lease or letting out of the building is for business or commerce, either wholly or partly
    order: HIGH
    interpretation: Is the building leased or let out for business or commerce, either wholly or partly, judged from the stated
      or actual use? Use wholly or partly for business or commerce satisfies the test.
    grounding:
    - F_PLP
    handler: light
groups: {}
outcomes:
  M_SIAFOS_LE_SICOB:
    outcome: SUPPLY_IN_COURSE_OF_BUSINESS
    expr: M_SIAFOS_A_SICOB
    module: M_SIAFOS
    description: The supply is made by a person in the course or furtherance of business. (Section 7(1), part of the law)
  M_PUOBGIS_LE_PCOAB:
    outcome: PERSON_CARRIES_ON_A_BUSINESS
    expr: M_PUOBGIS_A_PCOAB
    module: M_PUOBGIS
    description: The person by whom or under whose direction the goods are used or made available is a person carrying on
      a business (Schedule II, paragraph 4, part of the law)
  M_BLSOS_LE_LIFBOC:
    outcome: LETTING_IS_FOR_BUSINESS_OR_COMMERCE
    expr: M_BLSOS_A_LIFBOC
    module: M_BLSOS
    description: The lease or letting out of the building is for business or commerce, either wholly or partly (Schedule II,
      paragraph 2, part of the law)
products:
  M_SIAFOS_PD_SICOB:
    statement: The supply is made by a person in the course or furtherance of business.
  M_PUOBGIS_PD_PCOAB:
    statement: The person by whom or under whose direction the goods are used or made available is a person carrying on a
      business
  M_BLSOS_PD_LIFBOC:
    statement: The lease or letting out of the building is for business or commerce, either wholly or partly
compounds:
- id: C_SIAFOS
  question: The supply is made by a person in the course or furtherance of business? (Section 7(1))
  includes:
  - M_SIAFOS_LE_SICOB
  produces:
  - product: M_SIAFOS_PD_SICOB
    from:
    - M_SIAFOS_LE_SICOB
- id: C_PUOBGIS
  question: The person by whom or under whose direction the goods are used or made available is a person carrying on a business?
    (Schedule II, paragraph 4)
  includes:
  - M_PUOBGIS_LE_PCOAB
  produces:
  - product: M_PUOBGIS_PD_PCOAB
    from:
    - M_PUOBGIS_LE_PCOAB
- id: C_BLSOS
  question: The lease or letting out of the building is for business or commerce, either wholly or partly? (Schedule II, paragraph
    2)
  includes:
  - M_BLSOS_LE_LIFBOC
  produces:
  - product: M_BLSOS_PD_LIFBOC
    from:
    - M_BLSOS_LE_LIFBOC
time:
  law_date: F_DOI
