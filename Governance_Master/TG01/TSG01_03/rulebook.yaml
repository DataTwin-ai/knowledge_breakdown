# GOVERNANCE MASTER TSG01_03 Neither supply (Schedule III) (TG01 Supply & Taxability)
# LAW ARC - 15 laws - status NEEDS_REVIEW
name: TSG01_03 Neither supply (Schedule III) - GOVERNANCE MASTER rulebook
version: TSG01_03
facts:
  F_SUPPLIER_ENTITY_TYPE:
    name: Entity type of the supplier
    type: CODE
    options:
    - CENTRAL_GOVERNMENT
    - STATE_GOVERNMENT
    - LOCAL_AUTHORITY
    - OTHER
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_ACTIVITY_IS_NOTIFIED_S7_2_B:
    name: Activity is notified under Section 7(2)(b)
    type: BOOLEAN
    tier: T1
  F_SERVICE_TYPE_DECEASED:
    name: Type of service related to deceased persons
    type: CODE
    options:
    - FUNERAL
    - BURIAL
    - CREMATORIUM
    - MORTUARY
    - TRANSPORT_DECEASED
    - OTHER
    tier: T1
  F_TRANSACTION_IS_ACTIONABLE_CLAIM:
    name: Transaction is an actionable claim
    type: BOOLEAN
    tier: T1
  F_ACTIONABLE_CLAIM_TYPE:
    name: Type of actionable claim
    type: CODE
    options:
    - LOTTERY
    - BETTING
    - GAMBLING
    - OTHER
    tier: T1
  F_SERVICE_PROVIDER_ENTITY_TYPE:
    name: Type of entity providing the service
    type: CODE
    options:
    - COURT
    - TRIBUNAL
    - OTHER
    tier: T1
  F_SERVICE_PROVIDER_LEGALLY_ESTABLISHED:
    name: The service provider (court or tribunal) is established under a law in force
    type: BOOLEAN
    tier: T1
  F_SUPPLY_NATURE:
    name: Nature of the supply as goods, services or both
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SUPPLY_ORIGIN_LOCATION_TYPE:
    name: Type of location where goods originate
    type: CODE
    options:
    - NON_TAXABLE_TERRITORY
    - TAXABLE_TERRITORY
    tier: T1
  F_SUPPLY_DESTINATION_LOCATION_TYPE:
    name: Type of location where goods are destined
    type: CODE
    options:
    - TAXABLE_TERRITORY
    - NON_TAXABLE_TERRITORY
    tier: T1
  F_GOODS_ENTERED_INDIA:
    name: Goods entered India
    type: BOOLEAN
    tier: T1
  F_PROVIDER_RECIPIENT_RELATIONSHIP:
    name: Relationship between service provider and recipient
    type: CODE
    options:
    - EMPLOYER_EMPLOYEE
    - RELATED_PERSON
    - DISTINCT_PERSON
    - UNRELATED
    - OTHER
    tier: T1
  F_EMPLOYMENT_CONTRACT:
    name: Employment contract or agreement
    type: TEXT
    tier: T1
  F_SERVICE_CONTRACT_DESCRIPTION:
    name: Description of the scope and terms of the contract under which the service is supplied
    type: TEXT
    tier: T1
  F_ACTIVITY_DESCRIPTION:
    name: Description of the supplier's business activity
    type: TEXT
    tier: T1
  F_PERSON_ROLE:
    name: Role of the person performing the activity
    type: CODE
    options:
    - MEMBER_OF_PARLIAMENT
    - MEMBER_OF_STATE_LEGISLATURE
    - MEMBER_OF_PANCHAYAT
    - MEMBER_OF_MUNICIPALITY
    - MEMBER_OF_OTHER_LOCAL_AUTHORITY
    - OTHER
    tier: T1
  F_POST_LEGAL_BASIS:
    name: Legal basis of the post held by the person
    type: CODE
    options:
    - CONSTITUTIONAL
    - STATUTORY
    - OTHER
    tier: T1
  F_DUTIES_PERFORMED_IN_POST_CAPACITY:
    name: Duties performed in the capacity of the post held
    type: BOOLEAN
    tier: T1
  F_PERSON_POST_HELD:
    name: Post held by the person in the body
    type: CODE
    options:
    - CHAIRPERSON
    - MEMBER
    - DIRECTOR
    - OTHER
    tier: T1
  F_BODY_ESTABLISHING_AUTHORITY:
    name: Authority that established the body
    type: CODE
    options:
    - CENTRAL_GOVERNMENT
    - STATE_GOVERNMENT
    - LOCAL_AUTHORITY
    - OTHER
    tier: T1
  F_PERSON_DEEMED_EMPLOYEE_PRE_COMMENCEMENT:
    name: Person deemed as an employee before commencement of this clause
    type: BOOLEAN
    tier: T1
  F_GOODS_ARE_WAREHOUSED:
    name: Goods are warehoused goods
    type: BOOLEAN
    tier: T1
  F_SUPPLY_TIMING_VS_CLEARANCE:
    name: Timing of supply relative to clearance for home consumption
    type: CODE
    options:
    - AFTER
    - BEFORE
    tier: T1
  F_SUPPLIER_ROLE:
    name: Role of the supplier in the transaction
    type: CODE
    options:
    - CONSIGNEE
    - CONSIGNOR
    - AGENT
    - PRINCIPAL
    - OTHER
    tier: T1
  F_SUPPLY_METHOD:
    name: Method by which the supply is made
    type: CODE
    options:
    - ENDORSEMENT_OF_DOCUMENTS_OF_TITLE
    - PHYSICAL_DELIVERY
    - OTHER
    tier: T1
  F_GOODS_DISPATCHED_FROM_ORIGIN:
    name: Goods have been dispatched from the port of origin
    type: BOOLEAN
    tier: T1
  F_PROVISION_CONTEXT:
    name: Provision for which a definition is being applied
    type: CODE
    options:
    - OTHER
    - SCH_III_P2
    - SCH_III_P8
    tier: T1
  F_TERM_BEING_DEFINED:
    name: Term being defined
    type: CODE
    options:
    - WAREHOUSED_GOODS
    - OTHER_TERM
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
predicates:
  A_WAREHOUSED_GOODS_DEFINITION:
    statement: For the purposes of paragraph 8, the expression "warehoused goods" shall have the same meaning as assigned
      to it in the Customs Act, 1962.
    order: LOW
    rule: F_PROVISION_CONTEXT = 'SCH_III_P8' AND F_TERM_BEING_DEFINED = 'WAREHOUSED_GOODS'
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_NPAANS_1:
    statement: The activity or transaction is undertaken by the Central Government, a State Government or any local authority.
    order: LOW
    rule: F_SUPPLIER_ENTITY_TYPE IN ['CENTRAL_GOVERNMENT', 'STATE_GOVERNMENT', 'LOCAL_AUTHORITY']
  A_NPAANS_2:
    statement: The government entity is engaged as a public authority in the activity or transaction.
    order: HIGH
    interpretation: Based on the description of the activity, is the government entity acting in its capacity as a public
      authority?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_NPAANS_3:
    statement: The activity or transaction is notified by the Government on the recommendations of the Council.
    order: LOW
    rule: F_ACTIVITY_IS_NOTIFIED_S7_2_B = TRUE
  A_FUNERAL_SERVICE:
    statement: The service is a funeral service.
    order: LOW
    rule: F_SERVICE_TYPE_DECEASED = 'FUNERAL'
  A_BURIAL_SERVICE:
    statement: The service is a burial service.
    order: LOW
    rule: F_SERVICE_TYPE_DECEASED = 'BURIAL'
  A_CREMATORIUM_SERVICE:
    statement: The service is a crematorium service.
    order: LOW
    rule: F_SERVICE_TYPE_DECEASED = 'CREMATORIUM'
  A_MORTUARY_SERVICE:
    statement: The service is a mortuary service.
    order: LOW
    rule: F_SERVICE_TYPE_DECEASED = 'MORTUARY'
  A_TRANSPORT_DECEASED:
    statement: The service is transportation of the deceased.
    order: LOW
    rule: F_SERVICE_TYPE_DECEASED = 'TRANSPORT_DECEASED'
  A_ACTIONABLE_CLAIM:
    statement: The transaction involves an actionable claim
    order: LOW
    rule: F_TRANSACTION_IS_ACTIONABLE_CLAIM = TRUE
  A_LOTTERY:
    statement: The actionable claim is lottery
    order: LOW
    rule: F_ACTIONABLE_CLAIM_TYPE = 'LOTTERY'
  A_BETTING:
    statement: The actionable claim is betting
    order: LOW
    rule: F_ACTIONABLE_CLAIM_TYPE = 'BETTING'
  A_GAMBLING:
    statement: The actionable claim is gambling
    order: LOW
    rule: F_ACTIONABLE_CLAIM_TYPE = 'GAMBLING'
  A_SERVICE_BY_COURT_OR_TRIBUNAL:
    statement: The services are provided by a court or a Tribunal.
    order: LOW
    rule: F_SERVICE_PROVIDER_ENTITY_TYPE = 'COURT' OR F_SERVICE_PROVIDER_ENTITY_TYPE = 'TRIBUNAL'
  A_ENTITY_LEGALLY_ESTABLISHED:
    statement: The court or Tribunal providing the services is established under any law for the time being in force.
    order: LOW
    rule: F_SERVICE_PROVIDER_LEGALLY_ESTABLISHED = TRUE
  A_GOODS_IS_SUBJECT:
    statement: The transaction involves the supply of goods.
    order: LOW
    rule: F_SUPPLY_NATURE = 'GOODS'
  A_ORIGIN_NON_TAXABLE_TERRITORY:
    statement: The goods originate from a place in the non-taxable territory.
    order: LOW
    rule: F_SUPPLY_ORIGIN_LOCATION_TYPE = 'NON_TAXABLE_TERRITORY'
  A_DESTINATION_NON_TAXABLE_TERRITORY:
    statement: The goods are destined for another place in the non-taxable territory.
    order: LOW
    rule: F_SUPPLY_DESTINATION_LOCATION_TYPE = 'NON_TAXABLE_TERRITORY'
  A_GOODS_NOT_ENTER_INDIA:
    statement: The goods do not enter into India.
    order: LOW
    rule: F_GOODS_ENTERED_INDIA = FALSE
  A_EMPLOYEE_TO_EMPLOYER_RELATIONSHIP:
    statement: Services are provided by an employee to the employer.
    order: LOW
    rule: F_PROVIDER_RECIPIENT_RELATIONSHIP = 'EMPLOYER_EMPLOYEE' AND F_SUPPLY_NATURE = 'SERVICES'
  A_IN_COURSE_EMPLOYMENT:
    statement: The services are provided in the course of his employment.
    order: HIGH
    interpretation: Are the services, as described, part of the employee's duties or responsibilities as defined by the employment
      contract?
    grounding:
    - F_EMPLOYMENT_CONTRACT
    - F_SERVICE_CONTRACT_DESCRIPTION
  A_IN_RELATION_EMPLOYMENT:
    statement: The services are provided in relation to his employment.
    order: HIGH
    interpretation: Are the services, as described, connected to or arising from the employee's employment, even if not explicitly
      part of their core duties?
    grounding:
    - F_EMPLOYMENT_CONTRACT
    - F_SERVICE_CONTRACT_DESCRIPTION
  A_ACTIVITY_IS_FUNCTIONS:
    statement: The activity is the performance of functions.
    order: HIGH
    interpretation: Is the described activity considered 'performance of functions' in the context of an elected member's
      duties?
    grounding:
    - F_ACTIVITY_DESCRIPTION
  A_IS_MP:
    statement: The person performing the functions is a Member of Parliament.
    order: LOW
    rule: F_PERSON_ROLE = 'MEMBER_OF_PARLIAMENT'
  A_IS_MLA:
    statement: The person performing the functions is a Member of State Legislature.
    order: LOW
    rule: F_PERSON_ROLE = 'MEMBER_OF_STATE_LEGISLATURE'
  A_IS_PANCHAYAT_MEMBER:
    statement: The person performing the functions is a Member of Panchayats.
    order: LOW
    rule: F_PERSON_ROLE = 'MEMBER_OF_PANCHAYAT'
  A_IS_MUNICIPALITY_MEMBER:
    statement: The person performing the functions is a Member of Municipalities.
    order: LOW
    rule: F_PERSON_ROLE = 'MEMBER_OF_MUNICIPALITY'
  A_IS_OTHER_LOCAL_AUTHORITY_MEMBER:
    statement: The person performing the functions is a Member of other local authorities.
    order: LOW
    rule: F_PERSON_ROLE = 'MEMBER_OF_OTHER_LOCAL_AUTHORITY'
  A_DUTIES_PERFORMED:
    statement: Duties are performed by any person.
    order: LOW
    rule: F_ACTIVITY_DESCRIPTION IS_SET
  A_PERSON_HOLDS_POST:
    statement: The person holds any post.
    order: LOW
    rule: F_PERSON_ROLE IS_SET
  A_POST_CONSTITUTIONAL_BASIS:
    statement: The post is held in pursuance of the provisions of the Constitution.
    order: LOW
    rule: F_POST_LEGAL_BASIS = 'CONSTITUTIONAL'
  A_DUTIES_IN_CAPACITY:
    statement: The duties are performed in that capacity.
    order: LOW
    rule: F_DUTIES_PERFORMED_IN_POST_CAPACITY = TRUE
  A_DUTIES_PERFORMED_DIGB:
    statement: The activity involves duties performed by a person.
    order: LOW
    rule: F_DUTIES_PERFORMED_IN_POST_CAPACITY = TRUE
  A_IS_CHAIRPERSON:
    statement: The person performs duties as a Chairperson.
    order: LOW
    rule: F_PERSON_POST_HELD = 'CHAIRPERSON'
  A_IS_MEMBER:
    statement: The person performs duties as a Member.
    order: LOW
    rule: F_PERSON_POST_HELD = 'MEMBER'
  A_IS_DIRECTOR:
    statement: The person performs duties as a Director.
    order: LOW
    rule: F_PERSON_POST_HELD = 'DIRECTOR'
  A_BODY_BY_CG:
    statement: The body is established by the Central Government.
    order: LOW
    rule: F_BODY_ESTABLISHING_AUTHORITY = 'CENTRAL_GOVERNMENT'
  A_BODY_BY_SG:
    statement: The body is established by a State Government.
    order: LOW
    rule: F_BODY_ESTABLISHING_AUTHORITY = 'STATE_GOVERNMENT'
  A_BODY_BY_LA:
    statement: The body is established by a local authority.
    order: LOW
    rule: F_BODY_ESTABLISHING_AUTHORITY = 'LOCAL_AUTHORITY'
  A_NOT_DEEMED_EMPLOYEE:
    statement: The person is not deemed as an employee before the commencement of this clause.
    order: LOW
    rule: F_PERSON_DEEMED_EMPLOYEE_PRE_COMMENCEMENT = FALSE
  A_SOWGBC_01:
    statement: Supply of warehoused goods to any person before clearance for home consumption.
    order: LOW
    rule: F_SUPPLY_NATURE = 'GOODS' AND F_GOODS_ARE_WAREHOUSED = TRUE AND F_SUPPLY_TIMING_VS_CLEARANCE = 'BEFORE'
  A_IS_GOODS_SUPPLY:
    statement: The transaction is a supply of goods
    order: LOW
    rule: F_SUPPLY_NATURE = 'GOODS'
  A_SUPPLIER_IS_CONSIGNEE:
    statement: The supply is made by the consignee to any other person
    order: LOW
    rule: F_SUPPLIER_ROLE = 'CONSIGNEE'
  A_METHOD_ENDORSEMENT:
    statement: The supply is made by endorsement of documents of title to the goods
    order: LOW
    rule: F_SUPPLY_METHOD = 'ENDORSEMENT_OF_DOCUMENTS_OF_TITLE'
  A_GOODS_DISPATCHED:
    statement: The goods have been dispatched from the port of origin
    order: LOW
    rule: F_GOODS_DISPATCHED_FROM_ORIGIN = TRUE
  A_ORIGIN_OUTSIDE_INDIA:
    statement: The port of origin is located outside India
    order: LOW
    rule: F_SUPPLY_ORIGIN_LOCATION_TYPE = 'NON_TAXABLE_TERRITORY'
  A_BEFORE_HOME_CLEARANCE:
    statement: The supply is made before clearance for home consumption
    order: LOW
    rule: F_SUPPLY_TIMING_VS_CLEARANCE = 'BEFORE'
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_NPAANS:
    name: Conditions for activity to be treated as not a supply
    logic: ALL
    members:
    - A_NPAANS_1
    - A_NPAANS_2
    - A_NPAANS_3
  G_DECEASED_SERVICES:
    name: Services related to deceased persons
    logic: ANY
    members:
    - A_FUNERAL_SERVICE
    - A_BURIAL_SERVICE
    - A_CREMATORIUM_SERVICE
    - A_MORTUARY_SERVICE
    - A_TRANSPORT_DECEASED
    description: Any of these services related to deceased persons qualifies for exclusion from supply.
  G_SPECIFIED_ACTIONABLE_CLAIM:
    name: Specified Actionable Claims
    logic: ANY
    members:
    - A_LOTTERY
    - A_BETTING
    - A_GAMBLING
  G_EXCLUDED_SERVICES:
    name: Conditions for Services by Court or Tribunal to be neither supply
    logic: ALL
    members:
    - A_SERVICE_BY_COURT_OR_TRIBUNAL
    - A_ENTITY_LEGALLY_ESTABLISHED
    description: Both conditions must be met for the services to be treated as neither a supply of goods nor services.
  G_SFNT_CONDITIONS:
    name: Conditions for Neither Supply
    logic: ALL
    members:
    - A_GOODS_IS_SUBJECT
    - A_ORIGIN_NON_TAXABLE_TERRITORY
    - A_DESTINATION_NON_TAXABLE_TERRITORY
    - A_GOODS_NOT_ENTER_INDIA
    description: All conditions must be met for the transaction to be neither a supply of goods nor services.
  G_EMPLOYEE_SERVICE_CONDITIONS:
    name: Employee Service Conditions
    logic: ALL
    members:
    - A_EMPLOYEE_TO_EMPLOYER_RELATIONSHIP
    - G_EMPLOYMENT_CONTEXT
    description: All conditions must be met for the activity to be considered neither a supply of goods nor services.
  G_EMPLOYMENT_CONTEXT:
    name: Employment Context
    logic: ANY
    members:
    - A_IN_COURSE_EMPLOYMENT
    - A_IN_RELATION_EMPLOYMENT
    description: The services must be either in the course of employment or in relation to employment.
  G_ELECTED_MEMBER_TYPE:
    name: Elected Member Type
    logic: ANY
    members:
    - A_IS_MP
    - A_IS_MLA
    - A_IS_PANCHAYAT_MEMBER
    - A_IS_MUNICIPALITY_MEMBER
    - A_IS_OTHER_LOCAL_AUTHORITY_MEMBER
  G_CONSTITUTIONAL_POST_CONDITIONS:
    name: Conditions for Constitutional Post Exception
    logic: ALL
    members:
    - A_DUTIES_PERFORMED
    - A_PERSON_HOLDS_POST
    - A_POST_CONSTITUTIONAL_BASIS
    - A_DUTIES_IN_CAPACITY
  G_PERSON_ROLE:
    name: Person's Role in Body
    logic: ANY
    members:
    - A_IS_CHAIRPERSON
    - A_IS_MEMBER
    - A_IS_DIRECTOR
    description: The person must hold one of these roles.
  G_BODY_ESTABLISHMENT:
    name: Body's Establishing Authority
    logic: ANY
    members:
    - A_BODY_BY_CG
    - A_BODY_BY_SG
    - A_BODY_BY_LA
    description: The body must be established by one of these authorities.
  G_ALL_CONDITIONS:
    name: Conditions for neither supply
    logic: ALL
    members:
    - A_IS_GOODS_SUPPLY
    - A_SUPPLIER_IS_CONSIGNEE
    - A_METHOD_ENDORSEMENT
    - A_GOODS_DISPATCHED
    - A_ORIGIN_OUTSIDE_INDIA
    - A_BEFORE_HOME_CLEARANCE
    description: All conditions must be true for the activity to be treated as neither a supply of goods nor services.
outcomes:
  LE_WAREHOUSED_GOODS_DEFINITION:
    outcome: WAREHOUSED_GOODS_DEFINED
    expr: A_WAREHOUSED_GOODS_DEFINITION
    module: M_MOWG
    description: The legal outcome is that 'warehoused goods' are defined as per the Customs Act, 1962, for the context of
      paragraph 8.
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_NPAANS:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: G_NPAANS
    module: M_NPAANS
    description: The activity shall be treated neither as a supply of goods nor a supply of services.
  LE_SOFBCM:
    outcome: NEITHER_SUPPLY
    expr: G_DECEASED_SERVICES
    module: M_SOFBCM
    description: If any of the specified services related to deceased persons are provided, they are treated as neither a
      supply of goods nor a supply of services.
  LE_ACOTS:
    outcome: NEITHER_GOODS_NOR_SERVICES_SUPPLY
    expr: A_ACTIONABLE_CLAIM AND NOT G_SPECIFIED_ACTIONABLE_CLAIM
    module: M_ACOTS
  LE_NEITHER_SUPPLY:
    outcome: NEITHER_SUPPLY
    expr: G_EXCLUDED_SERVICES
    module: M_SBCOT
    description: The outcome is that the activity is neither a supply of goods nor a supply of services if the conditions
      are met.
  LE_SFNT:
    outcome: NEITHER_SUPPLY
    expr: G_SFNT_CONDITIONS
    module: M_SFNT
    description: This activity is treated as neither a supply of goods nor a supply of services.
  LE_SBETE:
    outcome: NEITHER_SUPPLY
    expr: G_EMPLOYEE_SERVICE_CONDITIONS
    module: M_SBETE
    description: If the conditions in G_EMPLOYEE_SERVICE_CONDITIONS are met, the activity is neither a supply of goods nor
      a supply of services.
  LE_FOEM:
    outcome: NEITHER_SUPPLY
    expr: A_ACTIVITY_IS_FUNCTIONS AND G_ELECTED_MEMBER_TYPE
    module: M_FOEM
  LE_DUCP:
    outcome: NEITHER_SUPPLY
    expr: G_CONSTITUTIONAL_POST_CONDITIONS
    module: M_DUCP
  LE_DIGB:
    outcome: NEITHER_SUPPLY
    expr: A_DUTIES_PERFORMED_DIGB AND G_PERSON_ROLE AND G_BODY_ESTABLISHMENT AND A_NOT_DEEMED_EMPLOYEE
    module: M_DIGB
    description: If all conditions are met, the activity is treated as neither a supply of goods nor services.
  LE_SOWGBC_01:
    outcome: NEITHER_SUPPLY
    expr: A_SOWGBC_01
    module: M_SOWGBC
    description: This activity is treated as neither a supply of goods nor a supply of services.
  LE_SBCBHC:
    outcome: NEITHER_SUPPLY
    expr: G_ALL_CONDITIONS
    module: M_SBCBHC
    description: This activity is treated neither as a supply of goods nor a supply of services if all conditions are met.
