    rule: F_ASK = 'GOODS'
    handler: python
  M_TOPOGIS_A_GBTAP:
    statement: The goods to which the treatment or process is applied belong to another person
    order: LOW
    rule: F_GOR = 'OWNED_BY_ANOTHER_PERSON'
    handler: python
  M_PUOBGIS_A_PCOAB:
    statement: The person by whom or under whose direction the goods are used or made available is a person carrying on a
      business
    order: HIGH
    interpretation: Does the described activity of the person amount to carrying on a business?
    grounding:
    - F_PBAD
    handler: heavy
  M_PUOBGIS_A_UIBOUD:
    statement: The usage or making available of the goods is by, or under the direction of, the person carrying on the business
    order: HIGH
    interpretation: Is the goods use carried out by the business person, or by another person under that person's direction?
    grounding:
    - F_DOGU
    handler: light
  M_PUOBGIS_A_GPTAPU:
    statement: The goods are put to any private use
    order: LOW
    rule: F_FOGU = 'PRIVATE_USE'
    handler: python
  M_PUOBGIS_A_GUFNBP:
    statement: The goods are used for any purpose other than a purpose of the business
    order: LOW
    rule: F_FOGU = 'USED_BY_PERSON' AND F_POGU = 'NON_BUSINESS'
    handler: python
  M_PUOBGIS_A_GMAFNBU:
    statement: The goods are made available to any person for use, for any purpose other than a purpose of the business
    order: LOW
    rule: F_FOGU = 'MADE_AVAILABLE_TO_ANY_PERSON' AND F_POGU = 'NON_BUSINESS'
    handler: python
  M_TOBASOG_A_GFBA:
    statement: Goods forming part of the assets of a business
    order: LOW
    rule: F_BAS = 'PART_OF_BUSINESS_ASSETS'
    handler: python
  M_TOBASOG_A_TBBP:
    statement: The transfer or disposal is by or under the directions of the person carrying on the business
    order: LOW
    rule: F_TIR IN ['BY_BUSINESS_PERSON', 'UNDER_BUSINESS_PERSON_DIRECTION']
    handler: python
  M_TOBASOG_A_NLBA:
    statement: The goods are transferred or disposed of so as no longer to form part of those assets
    order: LOW
    rule: F_PTAS = 'NO_LONGER_PART_OF_ASSETS'
    handler: python
  M_PTOBAWI_A_PTOD:
    statement: The transfer or disposal of the assets is permanent, being either a permanent transfer or a permanent disposal
    order: LOW
    rule: F_ADT IN ['PERMANENT_TRANSFER', 'PERMANENT_DISPOSAL']
    handler: python
  M_FTTISOG_A_ASFP:
    statement: The transfer is under an agreement which stipulates that property in goods shall pass at a future date
    order: HIGH
    interpretation: Does the agreement under which the title transfer takes place stipulate that property in the goods shall
      pass at a future date? If the agreement is silent or unclear the answer is UNKNOWN, not FALSE
    grounding:
    - F_PPT
    handler: light
  M_FTTISOG_A_FACP:
    statement: Full consideration as agreed has been paid for the transfer
    order: LOW
    rule: F_CPE = 'FULL_AS_AGREED'
    handler: python
  M_TOTISOG_A_GTT:
    statement: The transaction involves a transfer of the title in goods, meaning title in the goods passes from one person
      to another
    order: HIGH
    if_false: the transaction gives only possession or use without passing title
    interpretation: Does the transaction, as shown by its form and description, pass ownership of the goods (title) from one
      person to another rather than only possession or a right to use them?
    grounding:
    - F_FOS
    - F_DOAOT
    handler: heavy
  M_SOGPTA_A_SOSG:
    statement: The supply the agent undertakes on behalf of the principal is a supply of goods
    order: LOW
    rule: F_SKOT IN ['GOODS', 'BOTH']
    handler: python
  M_TORISOS_A_TOROSIG:
    statement: The transaction is a transfer of a right in goods or of an undivided share in goods
    order: HIGH
    interpretation: Does the transaction transfer a right in goods or an undivided share in goods, as distinct from other
      subject matter?
    grounding:
    - F_GTS
    handler: light
  M_TORISOS_A_TWTOG:
    statement: The transfer of the right or share in goods is made without the transfer of title in those goods
    order: LOW
    rule: F_GTT = FALSE
    handler: python
  M_SOLAB_A_TISOL:
    statement: The transaction is a sale of land.
    order: LOW
    rule: F_PSS = 'LAND' OR F_PSS = 'LAND_AND_BUILDING'
    handler: python
  M_SOLAB_A_TISOB:
    statement: The transaction is a sale of building.
    order: LOW
    rule: F_PSS = 'BUILDING' OR F_PSS = 'LAND_AND_BUILDING'
    handler: python
  M_ISDMR_A_TPRAI:
    statement: The taxable person is registered as an Input Service Distributor
    order: LOW
    rule: F_PTC = 'ISD'
    handler: python
  M_ISDMR_A_RIPFAM:
    statement: The return is furnished in such form and manner as may be prescribed
    order: HIGH
    interpretation: Is the form used, and the manner of furnishing, what the prescribed requirements specify for an Input
      Service Distributor return, which this text does not state?
    grounding:
    - F_RFUFF
    - F_RMC
    handler: heavy
  M_ISDMR_A_RFWTD:
    statement: The return is furnished within thirteen days after the end of such month
    order: LOW
    rule: F_RFT = 'ON_OR_BEFORE_DUE_DATE'
    handler: python
  M_RPFMR_A_RCCMOP:
    statement: The return is furnished for every calendar month or part thereof
    order: HIGH
    interpretation: Does the tax period of the return cover a calendar month or a part of a calendar month?
    grounding:
    - F_TPOR
    handler: light
  M_NTPRF_A_RHBF:
    statement: The registered non-resident taxable person has furnished a return
    order: LOW
    rule: F_DOF IS_SET
    handler: python
  M_NTPRF_A_RFE:
    statement: The return is furnished electronically
    order: LOW
    rule: F_MOFD = 'ELECTRONIC'
    handler: python
  M_RFNAIPU_A_RFTPF:
    statement: The person is furnishing a return for a tax period
    order: LOW
    if_false: F_RTP NOT SET
    rule: F_RTP IS_SET
    handler: python
  M_RFNAIPU_A_EPRU:
    statement: The return for any of the previous tax periods has not been furnished by the person
    order: LOW
    rule: F_AERU = TRUE
    handler: python
    compute:
      F_RHBF: F_RHBF = (F_RFT == 'AFTER_DUE_DATE' or F_RFT == 'ON_OR_BEFORE_DUE_DATE')
      F_AERU: TRUE if at least one F_RHBF for an earlier tax period of the same person is FALSE
  M_FODRP_A_FIRP:
    statement: The person furnishing the details is a registered person
    order: LOW
    rule: F_PRS = 'REGISTERED'
    handler: python
  M_RPFMR_A_RSIOS:
    statement: The return contains details of inward and outward supplies of goods or services or both
    order: LOW
    rule: F_RISD IS_SET AND F_ROSD IS_SET
    handler: python
  M_RPFMR_A_RSITCA:
    statement: The return contains details of input tax credit availed
    order: LOW
    rule: F_RICD IS_SET
    handler: python
  M_RPFMR_A_RSTP:
    statement: The return contains details of tax payable
    order: LOW
    rule: F_RTPD IS_SET
    handler: python
  M_RPFMR_A_RSTP2:
    statement: The return contains details of tax paid
    order: LOW
    rule: F_RTPD2 IS_SET
    handler: python
  M_RPFMR_A_RHOPP:
    statement: The return contains such other particulars as may be prescribed
    order: HIGH
    interpretation: Does the return include the other particulars that the prescribed rules require? The rules are not part
      of this provision.
    grounding:
    - F_ROP
    handler: light
  M_RPFMR_A_RFWPT:
    statement: The return is furnished within such time as may be prescribed
    order: HIGH
    interpretation: Is the date of furnishing within the time prescribed for this return period?
    grounding:
    - F_DOF
    - F_TPOR
    handler: light
  M_RPOSD_A_PIISD:
    statement: The person is an Input Service Distributor
    order: LOW
    rule: F_PTC = 'ISD'
    handler: python
  M_RPOSD_A_PINTP:
    statement: The person is a non-resident taxable person
    order: LOW
    rule: F_PTC = 'NON_RESIDENT'
    handler: python
  M_RPOSD_A_PPTUS10:
    statement: The person is a person paying tax under the provisions of section 10
    order: LOW
    rule: F_PTC = 'COMPOSITION_S10'
    handler: python
  M_RPOSD_A_PPTUS51:
    statement: The person is a person paying tax under the provisions of section 51
    order: LOW
    rule: F_PTC = 'TDS_S51'
    handler: python
  M_RPOSD_A_PPTUS52:
    statement: The person is a person paying tax under the provisions of section 52
    order: LOW
    rule: F_PTC = 'TCS_S52'
    handler: python
  M_RPOSD_A_DAFE:
    statement: The person shall furnish the details electronically
    order: LOW
    rule: F_MOFD = 'ELECTRONIC'
    handler: python
  M_RPOSD_A_FIPFAM:
    statement: The person shall furnish the details in such form and manner as may be prescribed
    order: HIGH
    interpretation: Was the furnishing done in the form and manner prescribed for outward supply details? The prescribed form
      and manner are not stated in this provision and must be read from the rules.
    grounding:
    - F_RFUFF
    handler: light
  M_GPTNQR_A_NOCR:
    statement: The Government's notification of the class of registered persons is made on the recommendations of the Council
    order: LOW
    rule: F_NRB = 'COUNCIL'
    handler: python
  M_GPTNQR_A_PINC:
    statement: The person belongs to a certain class of registered persons notified by the Government
    order: HIGH
    interpretation: Does the description of the class in the notification cover this person, given the person's registration
      and return profile details?
    grounding:
    - F_NCD
    - F_PPD
    handler: heavy
  M_GPTNQR_A_NREQ:
    statement: The notified persons shall furnish a return for every quarter or part thereof
    order: LOW
    rule: F_NRFF = 'QUARTERLY'
    handler: python
  M_GPTNQR_A_NNCS:
    statement: The notification specifies no condition or restriction on the quarterly return obligation
    order: LOW
    rule: F_NSAC = FALSE
    handler: python
  M_GPTNQR_A_NCSBP:
    statement: The quarterly return obligation is subject to such conditions and restrictions as may be specified in the notification,
      and the person satisfies each condition and restriction so specified
    order: HIGH
    interpretation: Weighing the conditions and restrictions as written in the notification against the person's records,
      is each specified condition and restriction satisfied by this person?
    grounding:
    - F_CTIN
    - F_PCR
    handler: heavy
  M_CTFAR_A_RFFYOP:
    statement: The return is for each financial year or part thereof
    order: LOW
    rule: F_RPC IN ['FULL_FINANCIAL_YEAR', 'PART_FINANCIAL_YEAR']
    handler: python
  M_CTFAR_A_RPFR:
    statement: The registered person furnishes a return as required by the shall obligation
    order: LOW
    rule: F_DOF IS_SET
    handler: python
  M_CTFAR_A_RCST:
    statement: The return contains turnover in the State or Union territory
    order: LOW
    rule: F_RTD IS_SET
    handler: python
  M_CTFAR_A_RCIS:
    statement: The return contains inward supplies of goods or services or both
    order: LOW
    rule: F_RISD IS_SET
    handler: python
  M_MRFBRP_A_RFFTP:
    statement: The registered person shall furnish a return for every tax period whether or not any supplies of goods or services
      or both have been made during such tax period
    order: LOW
    rule: F_DOF IS_SET
    handler: python
  M_COTPBTE_A_PCTBT:
    statement: Where any person ceases to be a taxable person
    order: LOW
    rule: F_PCS = 'CEASED_TAXABLE_PERSON'
    handler: python
  M_COTPBTE_A_BTAGC:
    statement: The business is transferred as a going concern to another person, the exception stated by unless
    order: HIGH
    interpretation: Does the transfer pass the business to another person as a going concern, so that the deeming does not
      apply?
    grounding:
    - F_BTM
    handler: heavy
  M_COTPRE_A_BCBDR:
    statement: The business is carried on by a personal representative who is deemed to be a taxable person
    order: HIGH
    interpretation: Is the business carried on by a personal representative who is deemed to be a taxable person?
    grounding:
    - F_BCR
    handler: heavy
  M_TAGOS_A_TIASUS1:
    statement: The activity or transaction constitutes a supply in accordance with the provisions of sub-section (1).
    order: HIGH
    interpretation: Does the activity or transaction constitute a supply in accordance with the provisions of Section 7(1)?
    grounding:
    - F_TISUS1
    handler: heavy
groups:
  M_AACA_G_CAR:
    name: Competent Authority Routes
    logic: ANY
    members:
    - M_AACA_A_CAIG
    - M_AACA_A_AATIC
    - M_AACA_G_ARC
    description: Any one of the three routes makes the person or body a competent authority
  M_AACA_G_ARC:
    name: Architect Route Conditions
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_AACA_A_ARWC
    description: Architect route - no completion certificate is required from the authority and the person is a registered
      architect
  M_LSACA_G_SRC:
    name: Surveyor Route Conditions
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_LSACA_A_LSOLB
    description: The surveyor route applies only when no completion certificate is required from the authority and the person
      is a licensed surveyor of the respective local body or planning authority
  M_IOSFC_G_CFIOSTBS:
    name: Conditions For Import Of Service To Be Supply
    logic: ALL
    members:
    - M_IOSFC_A_TIAIOS
    - M_IOSFC_A_IIFAC
    description: Both conditions must be met. The business test is explicitly not a condition for this type of supply.
  M_SIAFOS_G_QFOS:
    name: Qualifying Forms Of Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL2
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: The supply must take one of the listed forms or another qualifying form.
  M_SIAFOS_G_SFC:
    name: Supply For Consideration
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply must be made or agreed to be made for a consideration.
  M_CIAAA_G_LWF:
    name: Listed Work Forms
    logic: ANY
    members:
    - M_CIAAA_A_WCOA
    - M_CIAAA_A_AFOW
    - M_CIAAA_A_ROP
    - M_CIAAA_A_ROS
    description: Any one of the four listed forms of work, joined by or
  M_LISOS_G_LIKG:
    name: Land Interest Kinds Group
    logic: ANY
    members:
    - M_LISOS_A_IILL
    - M_LISOS_A_IILT
    - M_LISOS_A_IILE
    - M_LISOS_A_IILL2
    description: Any one listed kind satisfies the interest test. The source does not state the list as open or closed, so
      an unlisted kind goes to CT review and is not decided here.
  M_WCAS_G_CWCT:
    name: Composite Works Contract Test
    logic: ALL
    members:
    - M_WCAS_A_SIACS
    - M_DOWC_PD_GPTI
    description: both the composite supply and the works contract conditions must hold
  M_TORTUGS_G_RUFC:
    name: Right Use For Consideration
    logic: ALL
    members:
    - M_TORTUGS_A_TORTUG
    - M_UASOG_A_SFVC
    description: Both the right-to-use transfer and the consideration must be present for the deeming
  M_TTOIPS_G_TTOU:
    name: Temporary Transfer Or Use
    logic: ANY
    members:
    - M_TTOIPS_A_AITT
    - M_TTOIPS_A_APIU
    description: the temporary transfer alternative or the permitting use or enjoyment alternative
  M_ROIPIS_G_ROIP:
    name: Renting Of Immovable Property
    logic: ALL
    members:
    - M_ROIPIS_A_TIR
    - M_ROIPIS_A_RPII
    description: Both the renting and the immovable property character are required
  M_ISDIS_G_LSAP:
    name: Listed Software Activity Performed
    logic: ANY
    members:
    - M_ISDIS_A_SDAP
    - M_ISDIS_A_SDAP2
    - M_ISDIS_A_SPAP
    - M_ISDIS_A_SCAP
    - M_ISDIS_A_SAAP
    - M_ISDIS_A_SUAP
    - M_ISDIS_A_SEAP
    - M_ISDIS_A_SIAP
    description: One of the eight namely activities is performed on the software
  M_ATROTAS_G_OKA:
    name: Obligation Kind Alternatives
    logic: ANY
    members:
    - M_ATROTAS_A_ATRFA
    - M_ATROTAS_A_ATTAOS
    - M_ATROTAS_A_ATDAA
    description: The agreed obligation is one of the three listed kinds, each a separate route
  M_TOPOGIS_G_TOAG:
    name: Treatment On Another Goods
    logic: ALL
    members:
    - M_TOPOGIS_A_AITOP
    - M_TOPOGIS_A_AATG
    - M_TOPOGIS_A_GBTAP
    description: All three conditions must be satisfied together
  M_PUOBGIS_G_BPAGC:
    name: Business Person And Goods Context
    logic: ALL
    members:
    - M_PUOBGIS_A_PCOAB
    - M_PUOBGIS_A_UIBOUD
    - M_TOBASOG_A_GFBA
    description: A person carrying on a business, by or under whose direction the use occurs, and goods held or used for that
      business.
  M_PUOBGIS_G_PONBUR:
    name: Private Or Non Business Use Routes
    logic: ANY
    members:
    - M_PUOBGIS_A_GPTAPU
    - M_PUOBGIS_A_GUFNBP
    - M_PUOBGIS_A_GMAFNBU
    description: 'Any one of: private use, use for a non-business purpose, or making available to any person for use for a
      non-business purpose.'
  M_TOBASOG_G_TCAM:
    name: Transfer Conditions All Met
    logic: ALL
    members:
    - M_TOBASOG_A_GFBA
    - M_PTOBAWI_A_PTOD
    - M_TOBASOG_A_TBBP
    - M_TOBASOG_A_NLBA
    description: All four operative conditions of paragraph 4(a) must be met together.
  M_FTTISOG_G_FPDT:
    name: Future Passing Deeming Test
    logic: ALL
    members:
    - M_TOTISOG_A_GTT
    - M_FTTISOG_A_ASFP
    - M_FTTISOG_A_FACP
    description: All three conditions are required together, and the upon link means passing depends on payment of full consideration
      as agreed
  M_ISDMR_G_RSC:
    name: Return Scope Conditions
    logic: ALL
    members:
    - M_ISDMR_A_TPRAI
    - M_RPFMR_A_RCCMOP
    description: The person is an Input Service Distributor and the return covers the calendar month or part
  M_ISDMR_G_RFC:
    name: Return Filing Conditions
    logic: ALL
    members:
    - M_NTPRF_A_RHBF
    - M_ISDMR_A_RIPFAM
    - M_NTPRF_A_RFE
    - M_ISDMR_A_RFWTD
    description: The return is furnished in prescribed form and manner, electronically and within thirteen days after month
      end
  M_RFNAIPU_G_AFBC:
    name: All Furnishing Block Conditions
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_RFNAIPU_A_RFTPF
    - M_RFNAIPU_A_EPRU
    description: The if clause of the source as an AND of three conditions
  M_RPFMR_G_EPC:
    name: Excluded Person Categories
    logic: ANY
    members:
    - M_RPOSD_A_PIISD
    - M_RPOSD_A_PINTP
    - M_RPOSD_A_PPTUS10
    - M_RPOSD_A_PPTUS51
    - M_RPOSD_A_PPTUS52
    description: Person is an Input Service Distributor or a non-resident taxable person or pays tax under section 10 or 51
      or 52. Any one takes the person outside the duty (other than).
  M_RPFMR_G_RCPP:
    name: Return Core Particulars Present
    logic: ALL
    members:
    - M_RPFMR_A_RSIOS
    - M_RPFMR_A_RSITCA
    - M_RPFMR_A_RSTP
    - M_RPFMR_A_RSTP2
    - M_RPFMR_A_RHOPP
    description: The return carries the listed particulars and such other particulars as may be prescribed.
  M_RPFMR_G_RFC:
    name: Return Furnishing Conditions
    logic: ALL
    members:
    - M_RPFMR_A_RCCMOP
    - M_RPOSD_A_DAFE
    - M_RPFMR_G_RCPP
    - M_RPOSD_A_FIPFAM
    - M_RPFMR_A_RFWPT
    description: 'All stated requirements on the return: period, electronic mode, particulars, prescribed form and manner,
      and prescribed time.'
  M_GPTNQR_G_RPINC:
    name: Registered Person In Notified Class
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_GPTNQR_A_PINC
    description: The person must be a registered person and must belong to the class notified by the Government.
  M_GPTNQR_G_NCSOA:
    name: Notified Conditions Satisfied Or Absent
    logic: ANY
    members:
    - M_GPTNQR_A_NNCS
    - M_GPTNQR_A_NCSBP
    description: Either the notification specifies no condition or restriction, or the person satisfies the conditions and
      restrictions the notification specifies.
  M_CTFAR_G_RCTG:
    name: Registered Composition Taxpayer Group
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_RPOSD_A_PPTUS10
    description: A registered person who pays tax under section 10
  M_CTFAR_G_MRCG:
    name: Mandatory Return Content Group
    logic: ALL
    members:
    - M_CTFAR_A_RCST
    - M_CTFAR_A_RCIS
    - M_RPFMR_A_RSTP
    - M_RPFMR_A_RSTP2
    - M_RPFMR_A_RHOPP
    description: All listed particulars must be in the return
  M_CTFAR_G_RFMG:
    name: Return Furnishing Manner Group
    logic: ALL
    members:
    - M_RPOSD_A_DAFE
    - M_RPOSD_A_FIPFAM
    description: Electronic furnishing and the prescribed form and manner
  M_MRFBRP_A_RRFUS39:
    name: Any of the referred steps (M_MRFBRP_A_RRFUS39)
    logic: ANY
    members:
    - M_CTFAR_PD_ARDA
    - M_CTFAR_PD_ARDM
    - M_GPTNQR_PD_QRR
    - M_RPFMR_PD_RMSR
    - M_RPFMR_PD_ROATP
    description: TRUE when any step of the law this check refers to is TRUE
  M_MRFBRP_G_RRFT:
    name: Registered Return Filer Test
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_MRFBRP_A_RRFUS39
    description: Every registered person who is required to furnish a return under sub-section (1) or sub-section (2) is the
      group to which the duty applies.
  M_COTPBTE_G_DCG:
    name: Deeming Conditions Group
    logic: ALL
    members:
    - M_COTPBTE_A_PCTBT
    - M_TOBASOG_A_GFBA
    description: The person has ceased to be a taxable person and the goods form part of the assets of a business carried
      on by him.
  M_COTPRE_G_CAAG:
    name: Cessation And Assets Group
    logic: ALL
    members:
    - M_COTPBTE_A_PCTBT
    - M_TOBASOG_A_GFBA
    description: The person has ceased to be a taxable person and the goods are part of the assets of a business carried on
      by him.
  M_TAGOS_A_SITAPSII:
    name: Any of the referred steps (M_TAGOS_A_SITAPSII)
    logic: ANY
    members:
    - M_ATROTAS_PD_ADSOS
    - M_BLSOS_PD_BILOLO
    - M_COBTAS_PD_CTAS
    - M_COTPBTE_PD_DSOC
    - M_COTPRE_PD_DSOC
    - M_FTTISOG_PD_DSOG
    - M_ISDIS_PD_SSD
    - M_LISOS_PD_LIDO
    - M_PUOBGIS_PD_BGPUDS
    - M_ROIPIS_PD_DSOS
    - M_TOBASOG_PD_BAGS
    - M_TOPOGIS_PD_TOAGIS
    - M_TORISOS_PD_TDSS
    - M_TORTUGS_PD_T
    - M_TOTISOG_PD_GDO
    - M_TTOIPS_PD_DSR
    - M_UASOG_PD_SFVC
    - M_UASOG_PD_SFVC_UASOG
    - M_WCAS_PD_WCDS
    description: TRUE when any step of the law this check refers to is TRUE
outcomes:
  M_CEACA_LE_CERWI:
    outcome: CHARTERED_ENGINEER_REGISTERED_WITH_IEI
    expr: M_CEACA_A_CERWI
    module: M_CEACA
    description: The competent authority is a chartered engineer registered with the Institution of Engineers (India) (Schedule
      II, paragraph 5(b), Explanation, item (1), part of the law)
  M_AACA_LE_CAD:
    outcome: COMPETENT_AUTHORITY
    expr: M_AACA_G_CAR
    module: M_AACA
    description: A person or body is a competent authority if it is the Government, or an authority authorised to issue completion
      certificates, or - where no certificate is required - a registered architect
  M_LSACA_LE_CAIE:
    outcome: COMPETENT_AUTHORITY_UNDER_THIS_ITEM
    expr: M_LSACA_A_GOCIA OR M_LSACA_G_SRC
    module: M_LSACA
    description: The authority is the Government or an authorised completion certificate issuer, or else a licensed surveyor
      where no certificate is required from that authority
  M_DOWC_LE_GPTI:
    outcome: GOODS_PROPERTY_TRANSFER_INVOLVED
    expr: M_DOWC_A_GPTI
    module: M_DOWC
    description: Transfer of property in goods, whether as goods or in some other form, is involved in the execution of such
      contract. (Section 2(119), part of the law)
  M_IOSFC_LE_IOSFCIS:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_CFIOSTBS
    module: M_IOSFC
    description: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_SIAFOS_LE_IISUS71A:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAFOS_G_QFOS AND M_SIAFOS_G_SFC AND M_SIAFOS_A_SICOB
    module: M_SIAFOS
    description: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_CIAAA_LE_CFO:
    outcome: IS_CONSTRUCTION_FOR_CLAUSE_5B
    expr: M_CIAAA_G_LWF AND M_CIAAA_A_WOES
    module: M_CIAAA
    description: A listed form of work on an existing civil structure counts as construction for this clause
  M_BLSOS_LE_BILOLO:
    outcome: BUILDING_IS_LEASED_OR_LET_OUT
    expr: M_BLSOS_A_BILOLO
    module: M_BLSOS
    description: The transaction is a lease or letting out of the building (Schedule II, paragraph 2, part of the law)
  M_LISOS_LE_LIDO:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_LISOS_G_LIKG AND M_LISOS_A_ICL
    module: M_LISOS
    description: The listed interest in land is deemed a supply of services, with no consideration or value test.
  M_UASOG_LE_SFVC:
    outcome: SUPPLY_IS_FOR_CONSIDERATION
    expr: M_UASOG_A_SFVC
    module: M_FADCSAS
    description: The supply is made for cash, deferred payment or other valuable consideration (Schedule II, paragraph 6,
      part of the law)
  M_WCAS_LE_WCDS:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: M_WCAS_G_CWCT
    module: M_WCAS
    description: a composite supply that is a works contract is treated as a supply of services
  M_TORTUGS_LE_T:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_TORTUGS_G_RUFC
    module: M_TORTUGS
    description: The right-to-use transfer for consideration is deemed a supply of services under paragraph 5(f)
  M_TTOIPS_LE_DSR:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TTOIPS_G_TTOU AND M_TTOIPS_A_SIAIR
    module: M_TTOIPS
    description: the activity shall be treated as supply of services when it is a temporary transfer or permitting use or
      enjoyment and the right concerned is an intellectual property right
  M_COBTAS_LE_CTAS:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: M_COBTAS_A_AIBC AND NOT M_COBTAS_A_CRAM
    module: M_COBTAS
    description: Deemed supply of services applies when the activity is construction as described and the entire consideration
      was not received after the earlier completion or occupation milestone.
  M_ROIPIS_LE_DSOS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_ROIPIS_G_ROIP
    module: M_ROIPIS
    description: The renting of immovable property is treated as a supply of services
  M_ISDIS_LE_SSD:
    outcome: SUPPLY_OF_SERVICES_DEEMED
    expr: M_ISDIS_G_LSAP AND M_ISDIS_A_SIIT
    module: M_ISDIS
    description: A listed activity is performed on information technology software, so the activity is deemed a supply of
      services
  M_ATROTAS_LE_ADSOS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_ATROTAS_G_OKA
    module: M_ATROTAS
    description: An agreement to one of the three listed obligation kinds is treated as a supply of services
  M_UASOG_LE_SFVC_UASOG:
    outcome: SUPPLY_FOR_VALUABLE_CONSIDERATION
    expr: M_UASOG_A_SFVC
    module: M_UASOG
    description: The supply is made for cash, deferred payment or other valuable consideration (Schedule II, paragraph 7,
      part of the law)
  M_TOPOGIS_LE_TOAGIS:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TOPOGIS_G_TOAG
    module: M_TOPOGIS
    description: The deemed supply of services follows when the whole treatment group is satisfied
  M_PUOBGIS_LE_BGPUDS:
    outcome: USAGE_OR_MAKING_AVAILABLE_DEEMED_SUPPLY_OF_SERVICES
    expr: M_PUOBGIS_G_BPAGC AND M_PUOBGIS_G_PONBUR
    module: M_PUOBGIS
    description: The deeming applies when the business context is met and at least one of the three use routes is met.
  M_TOBASOG_LE_BAGS:
    outcome: SUPPLY_OF_GOODS
    expr: M_TOBASOG_G_TCAM
    module: M_TOBASOG
    description: Where all transfer conditions are met, the transfer or disposal is a deemed supply of goods by the person.
  M_FTTISOG_LE_DSOG:
    outcome: SUPPLY_OF_GOODS
    expr: M_FTTISOG_G_FPDT
    module: M_FTTISOG
    description: A transfer of title under a future-passing agreement paid in full as agreed is a supply of goods under paragraph
      1(c)
  M_TOTISOG_LE_GDO:
    outcome: SUPPLY_OF_GOODS
    expr: M_TOTISOG_A_GTT AND M_SOGPTA_A_SOSG
    module: M_TOTISOG
    description: The transaction is a supply of goods when a transfer of the title in goods has taken place.
  M_TORISOS_LE_TDSS:
    outcome: SUPPLY_OF_SERVICES_DEEMED
    expr: M_TORISOS_A_TOROSIG AND M_TORISOS_A_TWTOG
    module: M_TORISOS
    description: A transfer of a right or of an undivided share in goods, made without the transfer of title, is deemed a
      supply of services.
  M_SOLAB_LE_LOBSO:
    outcome: NEITHER_SUPPLY
    expr: M_SOLAB_A_TISOL OR (M_SOLAB_A_TISOB AND NOT M_COBTAS_PD_CTAS)
    module: M_SOLAB
    description: The transaction is treated as neither supply of goods nor supply of services if it includes a sale of land,
      or a sale of building that is not subject to clause (b) of paragraph 5 of Schedule II
  M_ISDMR_LE_IMRC:
    outcome: ISD_RETURN_COMPLIANT
    expr: M_ISDMR_G_RSC AND M_ISDMR_G_RFC
    module: M_ISDMR
    description: The ISD monthly return obligation is met only when the person is an Input Service Distributor, the return
      covers the calendar month and every filing condition holds
  M_RFNAIPU_LE_FNAO:
    outcome: FURNISHING_NOT_ALLOWED
    expr: M_RFNAIPU_G_AFBC
    module: M_RFNAIPU
    description: Prohibition outcome applies only when all three block conditions hold
  M_RPFMR_LE_ROATP:
    outcome: RETURN_OBLIGATION_APPLIES
    expr: M_FODRP_A_FIRP AND NOT M_RPFMR_G_EPC
    module: M_RPFMR
    description: The duty to furnish the return applies to a registered person who is not in any excluded category.
  M_RPFMR_LE_RMSR:
    outcome: RETURN_MEETS_SECTION_39_1_REQUIREMENTS
    expr: M_RPFMR_G_RFC
    module: M_RPFMR
    description: The return is for the calendar month or part month, is furnished electronically, carries the stated particulars
      and is in the prescribed form and time. It is only meaningful for a person covered by M_RPFMR_LE_ROATP.
  M_GPTNQR_LE_QRR:
    outcome: QUARTERLY_RETURN_REQUIRED
    expr: M_GPTNQR_A_NOCR AND M_GPTNQR_G_RPINC AND M_GPTNQR_A_NREQ AND M_GPTNQR_G_NCSOA
    module: M_GPTNQR
    description: A registered person in a class notified on Council recommendation must furnish a return for every quarter
      or part thereof, subject to the notified conditions and restrictions.
  M_CTFAR_LE_ARDA:
    outcome: ANNUAL_RETURN_DUTY_APPLIES
    expr: M_CTFAR_G_RCTG AND M_CTFAR_A_RFFYOP
    module: M_CTFAR
    description: The shall duty arises for a registered person paying tax under section 10 for each financial year or part
      thereof
  M_CTFAR_LE_ARDM:
    outcome: RETURN_OBLIGATION_MET
    expr: M_CTFAR_G_RCTG AND M_CTFAR_A_RFFYOP AND M_CTFAR_A_RPFR AND M_CTFAR_G_MRCG AND M_CTFAR_G_RFMG AND M_RPFMR_A_RFWPT
    module: M_CTFAR
    description: The duty is met when the return is furnished with the required content in the prescribed form, manner and
      time
  M_MRFBRP_LE_RDM:
    outcome: DUTY_MET_FOR_PERIOD
    expr: M_MRFBRP_G_RRFT AND M_MRFBRP_A_RFFTP
    module: M_MRFBRP
    description: The registered filer has furnished a return for the tax period.
  M_MRFBRP_LE_RDNM:
    outcome: DUTY_NOT_MET_FOR_PERIOD
    expr: M_MRFBRP_G_RRFT AND NOT M_MRFBRP_A_RFFTP
    module: M_MRFBRP
    description: The registered filer has not furnished a return for the tax period, and no supply in the period does not
      excuse it.
  M_MRFBRP_LE_S398NA:
    outcome: NO_SECTION_39_8_DUTY
    expr: NOT M_MRFBRP_G_RRFT
    module: M_MRFBRP
    description: The person is not a registered person required to furnish a return under sub-section (1) or sub-section (2),
      so this MKP gives no return-duty finding.
  M_COTPBTE_LE_DSOC:
    outcome: Goods forming part of the business assets are deemed to be supplied by the person in the course or furtherance
      of his business immediately before he ceases to be a taxable person
    expr: M_COTPBTE_G_DCG AND NOT M_COTPBTE_A_BTAGC
    module: M_COTPBTE
    description: The deeming applies when the person has ceased to be a taxable person and the goods are business assets,
      and the business is not transferred as a going concern to another person.
  M_COTPRE_LE_DSOC:
    outcome: DEEMED_SUPPLY_OF_GOODS_IN_COURSE_OR_FURTHERANCE_OF_BUSINESS_IMMEDIATELY_BEFORE_CESSATION
    expr: M_COTPRE_G_CAAG AND NOT M_COTPRE_A_BCBDR
    module: M_COTPRE
    description: Where the person ceases to be a taxable person and the goods are business assets, the goods are deemed supplied
      by him in the course or furtherance of his business immediately before cessation, unless the business is carried on
      by a personal representative who is deemed to be a taxable person.
  M_TAGOS_LE_CDBSII:
    outcome: CLASSIFICATION_BY_SCHEDULE_II
    expr: M_TAGOS_A_TIASUS1 AND M_TAGOS_A_SITAPSII
    module: M_TAGOS
    description: If a transaction is a supply under s7(1), its classification as goods or services is determined by Schedule
      II.
triggers:
  M_LISOS_CT_LWBR:
    question: Does the interest cover land together with a building, so that it is unclear whether it concerns land?
    trigger: F_PSS = 'LAND_AND_BUILDING'
    beside: M_LISOS_LE_LIDO
  M_LISOS_CT_ULIR:
    question: Is the interest in land of a kind not listed, such as another right over land, and does it fall within the same
      deeming?
    trigger: F_LIF = 'OTHER'
    beside: M_LISOS_LE_LIDO
