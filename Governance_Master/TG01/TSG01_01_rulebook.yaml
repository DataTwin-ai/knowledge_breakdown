# GOVERNANCE MASTER TSG01_01 Supply with consideration (TG01 Supply & Taxability)
# LAW ARC - 34 laws - status NEEDS_REVIEW
name: TSG01_01 Supply with consideration - GOVERNANCE MASTER rulebook
version: TSG01_01
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_SCS:  # 1. 1 gate | 6 law(s)
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
    origin:
      document: CONTRACT
      method: DERIVED
      uses: [CONTRACT.consideration, CONTRACT.consideration_type]
      how_to_get: Read consideration and consideration_type from the contract. If consideration is blank or nil / zero (or the type says no consideration, e.g. gift), the value is NONE. If consideration_type or the papers show it has been paid (cash, bank, advance received), the value is PAID. If an amount or benefit is promised but not yet paid, the value is AGREED.
      fallback: 'Use SALE_INVOICE.total_value: if it is above zero there is a consideration (AGREED, or PAID if payment is shown). Otherwise ask the user: ''Is anything paid or promised in return for this supply?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: AGREED
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_BAS:  # 2. 1 gate | 5 law(s)
    name: Business Asset Status
    type: CODE
    options:
    - PART_OF_BUSINESS_ASSETS
    - NOT_PART_OF_BUSINESS_ASSETS
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Were these goods part of the assets of your business before they were transferred or disposed of?'' Yes gives PART_OF_BUSINESS_ASSETS, no gives NOT_PART_OF_BUSINESS_ASSETS.', fallback: 'Check CONTRACT.property_description for the goods being listed as business assets. If still unclear, stop and ask again.', when_missing: ASK, as_of: just before the transfer or disposal, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: PART_OF_BUSINESS_ASSETS, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_PRS:  # 3. 1 gate | 5 law(s)
    name: Person Registration Status
    type: CODE
    options:
    - CANCELLED
    - REGISTERED
    - SUSPENDED
    - UNREGISTERED
    tier: T0
    origin:
      document: GST_REGISTRATION
      method: LOOKUP
      uses: [GST_RETURN.gstin, SALE_INVOICE.supplier_gstin, GST_REGISTRATION.registration_status, GST_REGISTRATION.cancellation_date]
      how_to_get: Take the GSTIN of the person from GST_RETURN.gstin or SALE_INVOICE.supplier_gstin. Look it up in the GST portal or GSP search taxpayer API and take registration_status. Active gives REGISTERED, Cancelled gives CANCELLED, and Suspended gives SUSPENDED. If the GSTIN is not found, the value is UNREGISTERED. If the status is Cancelled, check that cancellation_date is on or before the as-of date. If cancellation_date is later, the value is REGISTERED.
      fallback: 'Read the registration certificate (REG-06) if the user has one. Otherwise ask: ''Is the person registered under GST? What is the GSTIN?'''
      when_missing: ASK
      as_of: end of the tax period or date of the return
      level: TAXPAYER
      ai_level: NONE
      cost: MEDIUM
      example: REGISTERED
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOF:  # 4. 1 gate | 4 law(s)
    name: Date Of Furnishing
    type: DATE
    tier: T1
    origin:
      document: GST_RETURN
      method: FIELD
      uses: [GST_RETURN.arn_date]
      how_to_get: Take the filing acknowledgement of the return in question and read arn_date.
      fallback: 'Ask the user: On what date did you file this return?'
      when_missing: ASK
      as_of: date of filing
      level: RETURN
      ai_level: NONE
      cost: LOW
      example: '2024-05-18'
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_MOFD:  # 5. 1 gate | 4 law(s)
    name: Mode Of Furnishing Details
    type: CODE
    options:
    - ELECTRONIC
    - OTHER
    tier: T0
    origin:
      document: GST_RETURN
      method: FIELD
      uses: [GST_RETURN.filing_mode]
      how_to_get: Take GST_RETURN.filing_mode. If it shows online filing on the GST portal, through a GSP, or with digital or EVC signature, the value is ELECTRONIC. If it shows paper or any other way, the value is OTHER.
      fallback: 'If filing_mode is empty, treat a valid ARN in GST_RETURN.arn as ELECTRONIC. Otherwise ask the user: ''Did you file the return online on the GST portal?'''
      when_missing: ASK
      as_of: date of filing (ARN date)
      level: RETURN
      ai_level: NONE
      cost: LOW
      example: ELECTRONIC
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PTC:  # 6. 1 gate | 4 law(s)
    name: Person Tax Category
    type: CODE
    options:
    - COMPOSITION_S10
    - ISD
    - NON_RESIDENT
    - REGULAR
    - TCS_S52
    - TDS_S51
    tier: T0
    origin:
      document: GST_REGISTRATION
      method: LOOKUP
      uses: [GST_RETURN.gstin, GST_REGISTRATION.taxpayer_type, GST_REGISTRATION.composition]
      how_to_get: 'Take the GSTIN of the person who furnishes the return (GST_RETURN.gstin, or the supplier GSTIN on the invoice). Look it up in the GST portal / GSP search taxpayer API or the REG-06 certificate. Read taxpayer_type and composition. Map: composition = yes or ''Composition'' gives COMPOSITION_S10; ''Input Service Distributor'' gives ISD; ''Non-Resident Taxable Person'' gives NON_RESIDENT; ''Tax Collector (e-commerce)'' gives TCS_S52; ''Tax Deductor'' gives TDS_S51; ''Regular'' gives REGULAR. A person with several roles gets the role that applies to the return being checked.'
      fallback: 'Ask the user: ''Is this person a regular taxpayer, a composition dealer, an Input Service Distributor, a non-resident taxable person, a TDS deductor or an e-commerce TCS collector?'''
      when_missing: ASK
      as_of: end of the tax period
      level: TAXPAYER
      ai_level: NONE
      cost: MEDIUM
      example: REGULAR
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_CRT:  # 7. 1 gate | 3 law(s)
    name: Consideration Receipt Timing
    type: CODE
    options:
    - AFTER_EARLIER_MILESTONE
    - ON_OR_BEFORE_EARLIER_MILESTONE
    - NOT_RECEIVED_IN_FULL
    tier: T1
    derived_from:
    - F_ECRD
    - F_CCS
    - F_CCID
    - F_PFOD
    formula: NOT_RECEIVED_IN_FULL if the entire consideration has not been received; otherwise the reference date is the first
      occupation date when the certificate is NOT_REQUIRED, the earlier of the certificate date and the first occupation date
      when the certificate is ISSUED, and UNKNOWN when the certificate is REQUIRED_NOT_ISSUED; the value is AFTER_EARLIER_MILESTONE
      when the receipt date is later than the reference date, else ON_OR_BEFORE_EARLIER_MILESTONE
    origin:
      document: SYSTEM
      method: DERIVED
      uses: [F_ECRD, F_CCS, F_CCID, F_PFOD]
      how_to_get: If F_ECRD is not set, the value is NOT_RECEIVED_IN_FULL. Otherwise find the earlier milestone. If F_CCS is ISSUED, it is the earlier of F_CCID and F_PFOD. If F_CCS is NOT_REQUIRED or REQUIRED_NOT_ISSUED, it is F_PFOD alone. If F_ECRD is after the milestone date, the value is AFTER_EARLIER_MILESTONE. If F_ECRD is on or before it, or no milestone has happened yet, the value is ON_OR_BEFORE_EARLIER_MILESTONE.
      fallback: If a date is missing, ask the user for that date.
      when_missing: ASK
      as_of: date of supply of the construction service
      level: TRANSACTION
      ai_level: NONE
      cost: LOW
      example: AFTER_EARLIER_MILESTONE
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PCS:  # 8. 1 gate | 3 law(s)
    name: Person Cessation Status
    type: CODE
    options:
    - CEASED_TAXABLE_PERSON
    - CONTINUING_TAXABLE_PERSON
    tier: T0
    origin:
      document: GST_REGISTRATION
      method: DERIVED
      uses: [GST_REGISTRATION.registration_status, GST_REGISTRATION.cancellation_date]
      how_to_get: Search the registration by gstin. If registration_status is Cancelled (or surrendered) and cancellation_date is on or before the as-of date, return CEASED_TAXABLE_PERSON. If the status is Active, or the cancellation_date is after the as-of date, return CONTINUING_TAXABLE_PERSON.
      fallback: 'Ask the user: ''Has the person stopped being a taxable person (for example the registration was cancelled)? From what date?'''
      when_missing: ASK
      as_of: date immediately before the person ceases to be a taxable person
      level: TAXPAYER
      ai_level: NONE
      cost: MEDIUM
      example: CEASED_TAXABLE_PERSON
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_RISD:  # 9. 1 gate | 3 law(s)
    name: Return Inward Supply Details
    type: TEXT
    tier: T0
    origin:
      document: GST_RETURN
      method: FIELD
      uses: [GST_RETURN.inward_supplies_rcm]
      how_to_get: Read inward_supplies_rcm (inward supplies shown in the return, e.g. reverse-charge inward supplies and ITC-related inward details). If the return has no such details, leave the fact unset.
      fallback: Ask the user whether the return shows inward supply details and what they are.
      when_missing: UNKNOWN
      as_of: end of the tax period
      level: RETURN
      ai_level: NONE
      cost: LOW
      example: 'Inward supplies liable to reverse charge: 50,000'
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_RTPD:  # 10. 1 gate | 3 law(s)
    name: Return Tax Payable Details
    type: TEXT
    tier: T0
    origin:
      document: GST_RETURN
      method: FIELD
      uses: [GST_RETURN.tax_payable]
      how_to_get: Read tax_payable from the return (the tax liability for the period, by head). Use it as shown.
      fallback: Ask the user for the tax payable shown in the return.
      when_missing: UNKNOWN
      as_of: end of the tax period
      level: RETURN
      ai_level: NONE
      cost: LOW
      example: IGST 20,000; CGST 10,000; SGST 10,000
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_RTPD2:  # 11. 1 gate | 3 law(s)
    name: Return Tax Paid Details
    type: TEXT
    tier: T0
    origin:
      document: GST_RETURN
      method: FIELD
      uses: [GST_RETURN.tax_paid]
      how_to_get: Read tax_paid from the return or its acknowledgement (tax paid through cash and credit ledgers, by head). Use it as shown. Do not mix in interest_paid or late_fee_paid.
      fallback: Ask the user for the tax paid shown in the return.
      when_missing: UNKNOWN
      as_of: date of filing (ARN date)
      level: RETURN
      ai_level: NONE
      cost: LOW
      example: IGST 20,000; CGST 10,000; SGST 10,000
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ADT:  # 12. 1 gate | 2 law(s)
    name: Asset Disposition Type
    type: CODE
    options:
    - OTHER
    - PERMANENT_DISPOSAL
    - PERMANENT_TRANSFER
    tier: T0
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.consideration]
      how_to_get: Read CONTRACT.subject and CONTRACT.consideration in the transfer or disposal agreement or deed. If the assets are handed over for good (sold, gifted, given away, written off to another person), the value is PERMANENT_TRANSFER or PERMANENT_DISPOSAL as the text says. Any other arrangement (for example a temporary transfer, loan or lease) gives OTHER.
      fallback: 'Ask the user: ''Was the asset permanently transferred, permanently disposed of, or something else?'''
      when_missing: ASK
      as_of: date of transfer or disposal
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: PERMANENT_TRANSFER
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ASK:  # 13. 1 gate | 2 law(s)
    name: Activity Subject Kind
    type: CODE
    options:
    - GOODS
    - SERVICES
    - OTHER
    tier: T1
    origin:
      document: SALE_INVOICE
      method: READ
      uses: [SALE_INVOICE.line_description, SALE_INVOICE.hsn_sac]
      how_to_get: Read SALE_INVOICE.line_description, with SALE_INVOICE.hsn_sac as a hint. Decide whether the treatment or process is applied to goods (GOODS), to a service (SERVICES) or to something else (OTHER). A job-work or processing description for another person's material gives GOODS.
      fallback: 'Read CONTRACT.subject and CONTRACT.property_description. If still unclear, ask the user: ''On what is the treatment or process performed: goods, services or something else?'''
      when_missing: ASK
      as_of: date of supply
      level: LINE_ITEM
      ai_level: LOW
      cost: HIGH
      example: GOODS
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_CPE:  # 14. 1 gate | 2 law(s)
    name: Consideration Payment Extent
    type: CODE
    options:
    - FULL_AS_AGREED
    - PART_PAYMENT
    - NO_PAYMENT
    tier: T0
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: Of the consideration agreed in the contract, has it been paid in full, only in part, or not at all? Map the answer to FULL_AS_AGREED, PART_PAYMENT or NO_PAYMENT.', fallback: 'Read CONTRACT.consideration to see the agreed amount, then ask the user how much has been paid.', when_missing: ASK, as_of: date of the transfer of title, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: PART_PAYMENT, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_GOR:  # 15. 1 gate | 2 law(s)
    name: Goods Owner Relation
    type: CODE
    options:
    - OWNED_BY_ANOTHER_PERSON
    - OWNED_BY_PERFORMER
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.parties]
      how_to_get: Read CONTRACT.subject and CONTRACT.parties for a job-work or processing agreement. If the goods being treated belong to the customer or principal, the value is OWNED_BY_ANOTHER_PERSON. If the performer owns them, OWNED_BY_PERFORMER. Otherwise OTHER.
      fallback: Read SALE_INVOICE.line_description for words like 'job work' or 'goods supplied by customer'. If still unclear, ask the user who owns the goods being processed.
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: OWNED_BY_ANOTHER_PERSON
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_GTT:  # 16. 1 gate | 2 law(s)
    name: Goods Title Transferred
    type: BOOLEAN
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description]
      how_to_get: Read the agreement or work order (subject and consideration terms). Decide whether ownership of the goods passes to the other party. TRUE if the document says title or ownership passes, or it is a sale or transfer of ownership. FALSE if it says the goods stay with the transferor, or only the right to use or possess them is given. If the document does not say, the value is unknown.
      fallback: 'Ask the user: ''Did ownership (title) of the goods pass to the other party in this transfer?'''
      when_missing: ASK
      as_of: date of transfer (contract start date)
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: 'FALSE'
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_LIF:  # 17. 1 gate | 2 law(s)
    name: Land Interest Form
    type: CODE
    options:
    - LEASE
    - TENANCY
    - EASEMENT
    - LICENCE_TO_OCCUPY
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description]
      how_to_get: 'Read the agreement (subject, property_description). Decide the one kind of interest in land it grants: LEASE, TENANCY, EASEMENT, LICENCE_TO_OCCUPY. Use OTHER if it is none of these, for example an outright sale.'
      fallback: 'Ask the user: ''What kind of interest in the land is given: lease, tenancy, easement, licence to occupy, or something else?'''
      when_missing: ASK
      as_of: date the interest is granted (contract start date)
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: LEASE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_NRB:  # 18. 1 gate | 2 law(s)
    name: Notification Recommending Body
    type: CODE
    options:
    - COUNCIL
    - NONE_STATED
    - OTHER
    tier: T1
    source_kind: DOCUMENT
    origin:
      document: NOTIFICATION
      method: FIELD
      uses: [NOTIFICATION.recommended_by]
      how_to_get: Take NOTIFICATION.recommended_by from the notification in Law/. If it names the GST Council, the value is COUNCIL. If the field is empty or says nothing about a recommendation, the value is NONE_STATED. If it names any other body, the value is OTHER.
      fallback: Read the preamble of the notification text for the words 'on the recommendations of the Council'.
      when_missing: STOP
      as_of: notification date
      level: DOCUMENT
      ai_level: NONE
      cost: LOW
      example: COUNCIL
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_NRFF:  # 19. 1 gate | 2 law(s)
    name: Notified Return Filing Frequency
    type: CODE
    options:
    - QUARTERLY
    - MONTHLY
    - OTHER
    tier: T1
    source_kind: DOCUMENT
    origin:
      document: NOTIFICATION
      method: LOOKUP
      uses: [NOTIFICATION.notification_no, NOTIFICATION.notified_class]
      how_to_get: Find the notification that applies to the taxpayer's class in our Law/ notification table, using notification_no and notified_class. Take the return filing frequency recorded for that notification. Return QUARTERLY if it requires quarterly returns, MONTHLY if monthly, otherwise OTHER. If no notification covers the class, return OTHER. Never ask the user.
      fallback: Read NOTIFICATION.conditions and NOTIFICATION.notified_class text on our side to find the frequency named there.
      when_missing: UNKNOWN
      as_of: start of the tax period for which the return is due (the notification must be in force then)
      level: TAXPAYER
      ai_level: NONE
      cost: MEDIUM
      example: QUARTERLY
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PLF:  # 20. 1 gate | 2 law(s)
    name: Property Letting Form
    type: CODE
    options:
    - LEASE
    - LETTING_OUT
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description]
      how_to_get: Read the contract subject and property description. If the agreement grants a lease, tenancy, rent or licence to occupy a building, the value is LEASE. If it is letting out for rent without a lease, the value is LETTING_OUT. In every other case the value is OTHER.
      fallback: 'Ask the user: ''Is the property given on lease or let out on rent?'''
      when_missing: ASK
      as_of: date of the agreement
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: LEASE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PTAS:  # 21. 1 gate | 2 law(s)
    name: Post Transfer Asset Status
    type: CODE
    options:
    - NO_LONGER_PART_OF_ASSETS
    - STILL_PART_OF_ASSETS
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''After this transfer or disposal, do the goods still remain part of the business assets?'' If no, the value is NO_LONGER_PART_OF_ASSETS. If yes, the value is STILL_PART_OF_ASSETS.', fallback: 'Read CONTRACT.subject for a transfer of the goods out of the business. If it is still unclear, mark UNKNOWN.', when_missing: UNKNOWN, as_of: date of transfer or disposal, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: NO_LONGER_PART_OF_ASSETS, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_RICD:  # 22. 1 gate | 2 law(s)
    name: Return Input Credit Details
    type: TEXT
    tier: T0
    origin:
      document: GST_RETURN
      method: FIELD
      uses: [GST_RETURN.itc_claimed]
      how_to_get: Read itc_claimed from the return (the ITC availed table, e.g. GSTR-3B table 4). Use the text or amounts as shown. If the return shows no ITC, leave the value empty.
      fallback: Ask the user for the ITC availed shown in the return.
      when_missing: UNKNOWN
      as_of: end of the tax period
      level: RETURN
      ai_level: NONE
      cost: LOW
      example: IGST 12,000; CGST 6,000; SGST 6,000
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ROSD:  # 23. 1 gate | 2 law(s)
    name: Return Outward Supply Details
    type: TEXT
    tier: T0
    origin:
      document: GST_RETURN
      method: FIELD
      uses: [GST_RETURN.outward_supplies]
      how_to_get: Read outward_supplies from the return (e.g. GSTR-1 outward supply tables or GSTR-3B table 3.1). If the return shows no outward supplies, leave the fact unset.
      fallback: Ask the user whether the return shows outward supply details and what they are.
      when_missing: UNKNOWN
      as_of: end of the tax period
      level: RETURN
      ai_level: NONE
      cost: LOW
      example: 'Taxable outward supplies: 5,00,000'
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_RPC:  # 24. 1 gate | 2 law(s)
    name: Return Period Coverage
    type: CODE
    options:
    - FULL_FINANCIAL_YEAR
    - PART_FINANCIAL_YEAR
    - OTHER
    tier: T1
  F_RTD:  # 25. 1 gate | 2 law(s)
    name: Return Turnover Details
    type: TEXT
    tier: T1
  F_SAT:  # 26. 1 gate | 2 law(s)
    name: Software Activity Type
    type: CODE
    options:
    - DEVELOPMENT
    - DESIGN
    - PROGRAMMING
    - CUSTOMISATION
    - ADAPTATION
    - UPGRADATION
    - ENHANCEMENT
    - IMPLEMENTATION
    - OTHER
    tier: T1
    source_kind: DOCUMENT
    origin:
      document: SALE_INVOICE
      method: READ
      uses: [SALE_INVOICE.line_description, SALE_INVOICE.hsn_sac]
      how_to_get: 'Read line_description of the invoice line (and hsn_sac, e.g. 9983 IT services, as a hint). Decide which activity is described: DEVELOPMENT, DESIGN, PROGRAMMING, CUSTOMISATION, ADAPTATION, UPGRADATION, ENHANCEMENT or IMPLEMENTATION of software. If the activity is none of these, the value is OTHER.'
      fallback: 'Read CONTRACT.subject for the work described. If still unclear, ask the user: ''What software activity is being done: development, design, programming, customisation, adaptation, upgradation, enhancement, implementation, or something else?'''
      when_missing: ASK
      as_of: invoice date (date of supply)
      level: LINE_ITEM
      ai_level: LOW
      cost: HIGH
      example: CUSTOMISATION
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SKOT:  # 27. 1 gate | 2 law(s)
    name: Supply Kind Of Transaction
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
    origin:
      document: SALE_INVOICE
      method: LOOKUP
      uses: [SALE_INVOICE.hsn_sac]
      how_to_get: 'For each line take hsn_sac. Look it up in the HSN/SAC table: codes beginning with 99 are services, other codes are goods. If all lines are goods the value is GOODS, if all are services the value is SERVICES, if both appear the value is BOTH.'
      fallback: 'Read SALE_INVOICE.line_description and decide goods or services; if still unclear, read CONTRACT.subject or ask the user: ''Is this a sale of goods, a service, or both?'''
      when_missing: ASK
      as_of: invoice date
      level: INVOICE
      ai_level: NONE
      cost: MEDIUM
      example: SERVICES
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_TIR:  # 28. 1 gate | 2 law(s)
    name: Transfer Initiator Role
    type: CODE
    options:
    - BY_BUSINESS_PERSON
    - UNDER_BUSINESS_PERSON_DIRECTION
    - OTHER
    tier: T1
