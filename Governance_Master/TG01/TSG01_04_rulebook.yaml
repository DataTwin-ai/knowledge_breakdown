# GOVERNANCE MASTER TSG01_04 Composite & mixed supply (TG01 Supply & Taxability)
# LAW ARC - 6 laws - status APPROVED
name: TSG01_04 Composite & mixed supply - GOVERNANCE MASTER rulebook
version: TSG01_04
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_SMOG:  # 1. 1 gate | 1 law(s)
    name: Supply Manner Of Goods
    type: CODE
    options:
    - BY_WAY_OF_SERVICE
    - AS_PART_OF_SERVICE
    - OTHER_MANNER
    - NO_GOODS_SUPPLIED
    tier: T1
    origin:
      document: SALE_INVOICE
      method: READ
      uses: [SALE_INVOICE.line_description, CONTRACT.subject]
      how_to_get: Read line_description of the invoice lines (and CONTRACT.subject if available). Decide if goods are given by way of a service (BY_WAY_OF_SERVICE, e.g. food served to the customer), as part of a service (AS_PART_OF_SERVICE), in some other manner (OTHER_MANNER, e.g. a plain sale), or if no goods are supplied (NO_GOODS_SUPPLIED, a pure service).
      fallback: 'Ask the user: ''Are goods (such as food or drink) given along with or as part of a service, or only sold alone?'''
      when_missing: ASK
      as_of: date of supply
      level: INVOICE
      ai_level: HIGH
      cost: HIGH
      example: AS_PART_OF_SERVICE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  # ---- level 2: asked only when that law's gates pass
  F_WCAK:  # 2. 2 | 2 law(s)
    name: Works Contract Activity Kind
    type: CODE
    options:
    - ALTERATION
    - BUILDING
    - COMMISSIONING
    - COMPLETION
    - CONSTRUCTION
    - ERECTION
    - FABRICATION
    - FITTING_OUT
    - IMPROVEMENT
    - INSTALLATION
    - MAINTENANCE
    - MODIFICATION
    - OTHER
    - RENOVATION
    - REPAIR
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject]
      how_to_get: 'Open the contract or work order. Read the subject with an AI and match the work named there to one of the listed activities: building, construction, fabrication, completion, erection, installation, fitting out, improvement, modification, repair, maintenance, renovation, alteration, commissioning. Give that activity as the value. If several are named, give the main one. If the work named is none of these, the value is OTHER.'
      fallback: 'Read SALE_INVOICE.line_description for the work done. If still unclear, ask the user: ''What work is being done (for example construction, repair, installation, renovation)?'''
      when_missing: ASK
      as_of: date of the contract
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: CONSTRUCTION
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_WF:  # 3. 2 | 2 law(s)
    name: Work Form
    type: CODE
    options:
    - ADDITION
    - ALTERATION
    - REPLACEMENT
    - REMODELLING
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description]
      how_to_get: Open the work order or agreement. Read the subject and property_description fields, which describe the work. For each separate work, decide which kind it is. ADDITION means new area or structure added to an existing structure. ALTERATION means changing the existing structure without adding to it. REPLACEMENT means substituting a part of the structure with a new one. REMODELLING means reshaping or redesigning the existing structure. Use OTHER if none of these fits. Give one value per work.
      fallback: 'Read SALE_INVOICE.line_description for the work. If the form is still unclear, ask the user: ''What was done to the existing structure: addition, alteration, replacement, remodelling or something else?'''
      when_missing: ASK
      as_of: date of supply
      level: LINE_ITEM
      ai_level: HIGH
      cost: HIGH
      example: ADDITION
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  # ---- LAST: only heavy checks (free text) need these
  F_DOAOT:  # 4. LAST (heavy check only) | 3 law(s)
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description, CONTRACT.employment_terms]
      how_to_get: Read the contract subject, then property_description if it is about property, or employment_terms if it is about employment. Write a short plain-text description of the activity or transaction and who does it for whom.
      fallback: 'Use SALE_INVOICE.line_description. If that is also missing, ask the user: Please describe the activity or transaction.'
      when_missing: ASK
      as_of: date of the activity or transaction
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: Sale of a vacant plot of land to a buyer
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SCS:  # 5. LAST (heavy check only) | 3 law(s)
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
    origin:
      document: CONTRACT
      method: DERIVED
      uses: [CONTRACT.consideration, CONTRACT.consideration_type]
      how_to_get: Read consideration and consideration_type from the contract. If consideration is blank or nil / zero (or the type says no consideration, e.g. gift), the value is NONE. If consideration_type or the papers show it has been paid (cash, bank, advance received), the value is PAID. If an amount or benefit is promised but not yet paid, the value is AGREED.
      fallback: 'Use SALE_INVOICE.total_value: if it is above zero there is a consideration (AGREED, or PAID if payment is shown). Otherwise ask the user: ''Is anything paid or promised in return for this supply?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: AGREED
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_CNOT:  # 6. LAST (heavy check only) | 2 law(s)
    name: Contract Nature Of Transaction
    type: CODE
    options:
    - CONTRACT
    - NOT_CONTRACT
    - UNDETERMINED
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.parties, CONTRACT.consideration]
      how_to_get: Open the contract / work order / agreement. Read the subject and the terms with an AI. Decide if the arrangement is a contract (an agreement for work or supply with a consideration between the parties). Value is CONTRACT if there is a written or clear agreement for work or supply with consideration; NOT_CONTRACT if the paper is not an agreement (for example a plain gift or an employment letter); UNDETERMINED if the text is unclear or too short to decide.
      fallback: 'Read SALE_INVOICE.line_description as a second source. If still unclear, ask the user: ''Is the work done under a written contract or work order with the other party?'''
      when_missing: ASK
      as_of: date of the contract (start date)
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: CONTRACT
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_GPTF:  # 7. LAST (heavy check only) | 2 law(s)
    name: Goods Property Transfer Form
    type: CODE
    options:
    - AS_GOODS
    - IN_OTHER_FORM
    - NONE
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.consideration, CONTRACT.property_description]
      how_to_get: Open the contract or work order. Read the subject and the terms (materials, supply of goods, payment and transfer clauses) with an AI. If the contract says that goods (materials such as cement, steel, fittings) are used and ownership passes to the customer as those goods during the work, the value is AS_GOODS. If property in goods passes in another form (for example as part of the finished building or installed structure, not as separate goods), the value is IN_OTHER_FORM. If no goods are used or transferred, the value is NONE.
      fallback: 'Read SALE_INVOICE.line_description and SALE_INVOICE.hsn_sac to see whether goods are supplied along with the service. If still unclear, ask the user: ''In this work, does ownership of materials or goods pass to the customer, and do they pass as separate goods or as part of the finished work?'''
      when_missing: ASK
      as_of: date of execution of the contract
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: IN_OTHER_FORM
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PCM:  # 8. LAST (heavy check only) | 2 law(s)
    name: Provision Context Meaning
    type: CODE
    options:
    - CONTEXT_REQUIRES_OTHER_MEANING
    - NO_OTHER_MEANING_REQUIRED
    - UNDETERMINED
    tier: T1
    unit: M_DOISOG_CT_N
    origin: {document: SYSTEM, method: READ, how_to_get: 'The engine reads the provision that uses the defined term, with its neighbouring text. It decides whether that provision shows the term must carry a different meaning. Return CONTEXT_REQUIRES_OTHER_MEANING if so, NO_OTHER_MEANING_REQUIRED if the provision is consistent with the standard definition, and UNDETERMINED if it cannot tell. Never ask the user.', fallback: Return UNDETERMINED., when_missing: UNKNOWN, as_of: not date dependent (the law text as in force on the date of the transaction), level: DOCUMENT, ai_level: HIGH, cost: HIGH, example: NO_OTHER_MEANING_REQUIRED, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_PIS:  # 9. LAST (heavy check only) | 2 law(s)
    name: Property Immovability Status
    type: CODE
    options:
    - IMMOVABLE
    - MOVABLE
    - NOT_STATED
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.property_description, CONTRACT.subject]
      how_to_get: Open the contract, sale deed or work order. Read property_description and subject with an AI. If the property worked on is land, a building, a road, a bridge, a structure fixed to the earth or something attached to it permanently, the value is IMMOVABLE. If it is a machine, vehicle or other thing that can be moved, the value is MOVABLE. If the document does not say what the property is, the value is NOT_STATED.
      fallback: 'Read SALE_INVOICE.line_description and hsn_sac for the nature of the work. If still not clear, ask the user: ''Is the property being worked on immovable (land, building, structure fixed to the ground) or movable?'''
      when_missing: ASK
      as_of: date of the contract
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: IMMOVABLE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ASIS:  # 10. LAST (heavy check only) | 1 law(s)
    name: Activity Schedule I Status
    type: CODE
    options:
    - NOT_SPECIFIED_IN_SCHEDULE_I
    - SPECIFIED_IN_SCHEDULE_I
    tier: T1
    source_kind: READ
    origin:
      document: SYSTEM
      method: ASK
      uses: [F_DOTS, SALE_INVOICE.line_description, CONTRACT.subject]
      how_to_get: Compare the description of the activity (from F_DOTS or SALE_INVOICE.line_description or CONTRACT.subject) against the list of activities specified in Schedule I of the CGST Act. If it matches any activity listed, the value is SPECIFIED_IN_SCHEDULE_I. Otherwise, it is NOT_SPECIFIED_IN_SCHEDULE_I.
      fallback: UNKNOWN
      when_missing: UNKNOWN
      as_of: Date of supply/activity
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: SPECIFIED_IN_SCHEDULE_I
      confidence: low
      sensitive: false
      reviewed: false
      origin_by: AI
  F_FOS:  # 11. LAST (heavy check only) | 1 law(s)
    name: Form Of Supply
    type: CODE
    options:
    - BARTER
    - DISPOSAL
    - EXCHANGE
    - LEASE
    - LICENCE
    - OTHER
    - RENTAL
    - SALE
    - TRANSFER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.consideration_type, SALE_INVOICE.line_description]
      how_to_get: 'Read CONTRACT.subject and CONTRACT.consideration_type. Decide the form of supply: SALE for a price in money with transfer of title, BARTER if the consideration is other goods or services, EXCHANGE, LEASE, RENTAL, LICENCE, TRANSFER or DISPOSAL as the wording says. Use OTHER if none fits.'
      fallback: If there is no contract, read SALE_INVOICE.line_description and invoice_type. If that is also unclear, ask the user how the supply was made.
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: SALE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SBC:  # 12. LAST (heavy check only) | 1 law(s)
    name: Supply Business Context
    type: CODE
    options:
    - IN_BUSINESS
    - NOT_IN_BUSINESS
    - UNKNOWN
    tier: T1
    source_kind: READ
  F_TN:  # 13. LAST (heavy check only) | 1 law(s)
    name: Transaction Nature
    type: CODE
    options:
    - DOMESTIC_GOODS
    - DOMESTIC_SERVICES
    - IMPORT_GOODS
    - IMPORT_SERVICES
    - OTHER
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_DOWC_A_CDNROM:
    statement: The context does not otherwise require a meaning of works contract other than this definition.
    order: HIGH
    interpretation: Does the text of the provision in which works contract appears require a meaning other than this definition?
    grounding:
    - F_PCM
    handler: heavy
  M_DOWC_A_AIAC:
    statement: The arrangement under which the works are executed is a contract.
    order: HIGH
    interpretation: Is the arrangement, as shown by the document, a contract rather than another kind of arrangement?
    grounding:
    - F_CNOT
    handler: light
  M_DOWC_A_CFB:
    statement: The contract is for building.
    order: LOW
    rule: F_WCAK = 'BUILDING'
    handler: python
  M_DOWC_A_CFC:
    statement: The contract is for construction.
    order: LOW
    rule: F_WCAK = 'CONSTRUCTION'
    handler: python
  M_DOWC_A_CFF:
    statement: The contract is for fabrication.
    order: LOW
    rule: F_WCAK = 'FABRICATION'
    handler: python
  M_DOWC_A_CFC2:
    statement: The contract is for completion.
    order: LOW
    rule: F_WCAK = 'COMPLETION'
    handler: python
  M_DOWC_A_CFE:
    statement: The contract is for erection.
    order: LOW
    rule: F_WCAK = 'ERECTION'
    handler: python
  M_DOWC_A_CFI:
    statement: The contract is for installation.
    order: LOW
    rule: F_WCAK = 'INSTALLATION'
    handler: python
  M_DOWC_A_CFFO:
    statement: The contract is for fitting out.
    order: LOW
    rule: F_WCAK = 'FITTING_OUT'
    handler: python
  M_DOWC_A_CFI2:
    statement: The contract is for improvement.
    order: LOW
    rule: F_WCAK = 'IMPROVEMENT'
    handler: python
  M_DOWC_A_CFM:
    statement: The contract is for modification.
    order: LOW
    rule: F_WCAK = 'MODIFICATION'
    handler: python
  M_DOWC_A_CFR:
    statement: The contract is for repair.
    order: LOW
    rule: F_WCAK = 'REPAIR'
    handler: python
  M_DOWC_A_CFM2:
    statement: The contract is for maintenance.
    order: LOW
    rule: F_WCAK = 'MAINTENANCE'
    handler: python
  M_DOWC_A_CFR2:
    statement: The contract is for renovation.
    order: LOW
    rule: F_WCAK = 'RENOVATION'
    handler: python
  M_DOWC_A_CFC3:
    statement: The contract is for commissioning.
    order: LOW
    rule: F_WCAK = 'COMMISSIONING'
    handler: python
  M_DOWC_A_WOIP:
    statement: The contract is for work on any immovable property.
    order: HIGH
    interpretation: Is the property on which the contract work is done immovable property?
    grounding:
    - F_PIS
    handler: light
  M_DOWC_A_GPTI:
    statement: Transfer of property in goods, whether as goods or in some other form, is involved in the execution of such
      contract.
    order: HIGH
    interpretation: Does executing the contract transfer property in goods, either as goods or in some other form, weighing
      the contract documents and the work performed?
    grounding:
    - F_GPTF
    handler: heavy
  M_CIAAA_A_AFOW:
    statement: The work consists of alterations to a civil structure
    order: LOW
    if_false: F_WF is not ALTERATION
    rule: F_WF = 'ALTERATION'
    handler: python
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a sale'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a transfer'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a barter'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is an exchange'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a licence.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a licence'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a rental'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL2:
    statement: The supply of goods or services or both is a lease.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a lease'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a disposal'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both is a form other than the specified examples.
    order: HIGH
    interpretation: Does the described activity qualify as a form of supply under Section 7(1)(a), even though it is not one
      of the listed examples (sale, transfer, etc.)?
    grounding:
    - F_FOS
    - F_DOAOT
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply is made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SAFC:
    statement: The supply is agreed to be made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is agreed to be made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SICOB:
    statement: The supply is made by a person in the course or furtherance of business.
    order: HIGH
    interpretation: Is the supply made in the course or furtherance of the person's business?
    grounding:
    - F_SBC
    - F_DOAOT
    handler: heavy
  M_IOSFC_A_TIAIOS:
    statement: The transaction is an import of services.
    order: HIGH
    interpretation: 'Decide whether: The transaction is an import of services'
    grounding:
    - F_TN
    handler: light
  M_IOSFC_A_IIFAC:
    statement: The import of services is for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The import of services is for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAWC_A_AISISI:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_ASIS
    handler: heavy
  M_SIAWC_A_AIWC:
    statement: The activity is made or agreed to be made without a consideration
    order: HIGH
    interpretation: 'Decide whether: The activity is made or agreed to be made without a consideration'
    grounding:
    - F_SCS
    handler: light
  M_FADCSAS_A_GSIAM:
    statement: Goods are supplied by way of or as part of any service or in any other manner whatsoever.
    order: LOW
    rule: F_SMOG IN ['BY_WAY_OF_SERVICE','AS_PART_OF_SERVICE','OTHER_MANNER']
    handler: python
  M_WCAS_A_SIACS:
    statement: The supply is a composite supply
    order: HIGH
    interpretation: Does the described transaction consist of a composite supply as the term is used in this paragraph?
    grounding:
    - F_DOAOT
    handler: heavy
groups:
  M_DOWC_G_LWAA:
    name: Listed Works Activity Any
    logic: ANY
    members:
    - M_DOWC_A_CFB
    - M_DOWC_A_CFC
    - M_DOWC_A_CFF
    - M_DOWC_A_CFC2
    - M_DOWC_A_CFE
    - M_DOWC_A_CFI
    - M_DOWC_A_CFFO
    - M_DOWC_A_CFI2
    - M_DOWC_A_CFM
    - M_DOWC_A_CFR
    - M_DOWC_A_CFM2
    - M_DOWC_A_CFR2
    - M_CIAAA_A_AFOW
    - M_DOWC_A_CFC3
    description: At least one listed works activity must be the contract activity.
  M_SIAFOS_G_QFOS:
    name: Qualifying Forms Of Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL2
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: The supply must take one of the listed forms or another qualifying form.
  M_SIAFOS_G_SFC:
    name: Supply For Consideration
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply must be made or agreed to be made for a consideration.
  M_IOSFC_G_CFIOSTBS:
    name: Conditions For Import Of Service To Be Supply
    logic: ALL
    members:
    - M_IOSFC_A_TIAIOS
    - M_IOSFC_A_IIFAC
    description: Both conditions must be met. The business test is explicitly not a condition for this type of supply.
  M_WCAS_G_CWCT:
    name: Composite Works Contract Test
    logic: ALL
    members:
    - M_WCAS_A_SIACS
    - M_DOWC_PD_WCOE
    description: both the composite supply and the works contract conditions must hold
outcomes:
  M_DOWC_LE_WCOE:
    outcome: WORKS_CONTRACT
    expr: M_DOWC_A_CDNROM AND M_DOWC_A_AIAC AND M_DOWC_G_LWAA AND M_DOWC_A_WOIP AND M_DOWC_A_GPTI
    module: M_DOWC
    description: The works contract outcome holds only when the context does not require another meaning and every definition
      condition holds.
  M_SIAFOS_LE_IISUS71A:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAFOS_G_QFOS AND M_SIAFOS_G_SFC AND M_SIAFOS_A_SICOB
    module: M_SIAFOS
    description: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_LE_IOSFCIS:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_CFIOSTBS
    module: M_IOSFC
    description: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_SIAWC_LE_IISFSIA:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_A_AISISI AND M_SIAWC_A_AIWC
    module: M_SIAWC
    description: The transaction is included in the scope of supply if it is a Schedule I activity and is without consideration.
  M_FADCSAS_LE_GSIAM:
    outcome: GOODS_SUPPLIED_IN_ANY_MANNER
    expr: M_FADCSAS_A_GSIAM
    module: M_FADCSAS
    description: Goods are supplied by way of or as part of any service or in any other manner whatsoever. (Schedule II, paragraph
      6, part of the law)
  M_WCAS_LE_SIACS:
    outcome: SUPPLY_IS_COMPOSITE_SUPPLY
    expr: M_WCAS_A_SIACS
    module: M_FADCSAS
