# GOVERNANCE MASTER TSG01_04 Composite & mixed supply (TG01 Supply & Taxability)
# LAW ARC - 1 laws - status APPROVED
name: TSG01_04 Composite & mixed supply - GOVERNANCE MASTER rulebook
version: TSG01_04
facts:
  F_SIK:
    name: Supply Item Kind
    type: CODE
    options:
    - GOODS
    - SERVICES
    - BOTH
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_LOCGAST_A_SIGSOB:
    statement: The supply is a supply of goods or services or both
    order: LOW
    rule: F_SIK IN ['GOODS', 'SERVICES', 'BOTH']
    handler: python
groups: {}
outcomes:
  M_LOCGAST_LE_SIGSOB:
    outcome: SUPPLY_IS_GOODS_SERVICES_OR_BOTH
    expr: M_LOCGAST_A_SIGSOB
    module: M_LOCGAST
    description: The supply is a supply of goods or services or both (Section 9(1), part of the law)
products:
  M_LOCGAST_PD_SIGSOB:
    statement: The supply is a supply of goods or services or both
compounds:
- id: C_LOCGAST
  question: The supply is a supply of goods or services or both? (Section 9(1))
  includes:
  - M_LOCGAST_LE_SIGSOB
  produces:
  - product: M_LOCGAST_PD_SIGSOB
    from:
    - M_LOCGAST_LE_SIGSOB
time:
  law_date: F_DOI
