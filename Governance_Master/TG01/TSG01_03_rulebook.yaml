  F_PRR:  # 24. 1 gate | 2 law(s)
    name: Provider Recipient Relation
    type: CODE
    options:
    - CONTRACTOR_CLIENT
    - DISTINCT_PERSONS
    - EMPLOYEE_EMPLOYER
    - OTHER
    - PRINCIPAL_AGENT
    - RELATED_PERSONS
