    interpretation: Are the services performed in the course of, or in relation to, the employee's employment with the employer,
      as shown by the description of the activity?
    grounding:
    - F_SEC
    - F_DOAOT
    handler: heavy
  M_DBGBM_A_DPAOH:
    statement: The duties are performed by a person as a Chairperson, a Member or a Director
    order: LOW
    rule: F_PBR IN ['CHAIRPERSON', 'MEMBER', 'DIRECTOR']
    handler: python
  M_DBGBM_A_BEBG:
    statement: The body in which the duties are performed is established by the Central Government, a State Government or
      a local authority
    order: LOW
    rule: F_BEA IN ['CENTRAL_GOVT', 'STATE_GOVT', 'LOCAL_AUTHORITY']
    handler: python
  M_DBGBM_A_NDEBC:
    statement: The person is not deemed as an employee before the commencement of this clause
    order: LOW
    rule: F_PDEBC = FALSE
    handler: python
  M_FOEM_A_AIMF:
    statement: The activity is a function performed by the person as a Member of the listed body, in that capacity.
    order: HIGH
    interpretation: Is the described activity a function performed by the person as the elected Member of that body, rather
      than a private or commercial activity?
    grounding:
    - F_DOTA
    - F_PEO
    handler: heavy
  M_FOEM_A_PHEO:
    statement: The person is a Member of Parliament, Member of a State Legislature, Member of a Panchayat, Member of a Municipality
      or Member of another local authority.
    order: LOW
    rule: F_PEO IN ['MP', 'STATE_LEGISLATURE_MEMBER', 'PANCHAYAT_MEMBER', 'MUNICIPAL_MEMBER', 'OTHER_LOCAL_AUTHORITY_MEMBER']
    handler: python
  M_DBCPH_A_HOCP:
    statement: The person performing the duties holds a post in pursuance of the provisions of the Constitution
    order: HIGH
    interpretation: Is the post held by this person one established in pursuance of the provisions of the Constitution, rather
      than another post or no post?
    grounding:
    - F_PPH
    handler: light
  M_DBCPH_A_DPIC:
    statement: The duties were performed by that person in that capacity, meaning as the holder of the constitutional post
      and not in another personal or business role
    order: HIGH
    interpretation: Were the described duties performed by the holder in the capacity of the constitutional post, rather than
      in a private or other capacity?
    grounding:
    - F_DOAOT
    - F_PPH
    handler: heavy
  M_SBCOT_A_AIAS:
    statement: The activity is a service rendered by a court or Tribunal
    order: HIGH
    if_false: the described activity is not a service
    interpretation: Does the described activity consist of a service, as distinct from goods, rendered by the court or Tribunal?
    grounding:
    - F_DOTA
    handler: light
  M_SBCOT_A_PICOT:
    statement: The services are provided by any court or Tribunal
    order: HIGH
    if_false: F_PBT is OTHER
    interpretation: Is the body providing the service a court or a Tribunal, as opposed to any other body?
    grounding:
    - F_PBT
    handler: light
  M_SBCOT_A_CEUL:
    statement: The court or Tribunal is established under any law for the time being in force
    order: HIGH
    if_false: the establishing law is not in force at the relevant time
    interpretation: Is the court or Tribunal established under a law that is in force at the relevant time, so that the statement
      is met? Missing establishing law gives UNKNOWN, not FALSE
    grounding:
    - F_EL
    handler: heavy
  M_ACOTLBG_A_AIAC:
    statement: The activity or transaction is an actionable claim.
    order: HIGH
    interpretation: Does the described activity or transaction constitute an actionable claim as used in Schedule III paragraph
      6?
    grounding:
    - F_DOAOT
    handler: heavy
  M_ACOTLBG_A_COTLBG:
    statement: The actionable claim is other than lottery, betting and gambling.
    order: HIGH
    if_false: the actionable claim is in substance a lottery, betting or gambling claim
    interpretation: Is the actionable claim in substance a lottery, betting or gambling claim, which would place it outside
      the neither-supply treatment?
    grounding:
    - F_DOAOT
    handler: heavy
  M_SOGFNT_A_TISOG:
    statement: The transaction is a supply of goods.
    order: LOW
    rule: F_SKOT = 'GOODS'
    handler: python
  M_SOGFNT_A_SOINT:
    statement: The supply originates from a place in the non-taxable territory.
    order: LOW
    rule: F_OPT = 'NON_TAXABLE_TERRITORY'
    handler: python
  M_SOGFNT_A_SDFNT:
    statement: The supply is made to another place in the non-taxable territory.
    order: LOW
    rule: F_DPT = 'NON_TAXABLE_TERRITORY'
    handler: python
  M_SOGFNT_A_DIAP:
    statement: The place to which the goods are supplied is another place than the place from which they are supplied.
    order: LOW
    rule: F_ODR = 'DIFFERENT_PLACE'
    handler: python
  M_SOGFNT_A_GDNEI:
    statement: The goods are supplied without such goods entering into India.
    order: LOW
    rule: F_GEII = 'DOES_NOT_ENTER'
    handler: python
    compute:
      F_GEII: If F_SOOT = 'IMPORT', then F_GEII = 'ENTERS_INDIA'. Otherwise (if F_SOOT = 'EXPORT' or 'DOMESTIC'), F_GEII =
        'DOES_NOT_ENTER'.
  M_PUOBGIS_A_PCOAB:
    statement: The person by whom or under whose direction the goods are used or made available is a person carrying on a
      business
    order: HIGH
    interpretation: Does the described activity of the person amount to carrying on a business?
    grounding:
    - F_PBAD
    handler: heavy
  M_PUOBGIS_A_UIBOUD:
    statement: The usage or making available of the goods is by, or under the direction of, the person carrying on the business
    order: HIGH
    interpretation: Is the goods use carried out by the business person, or by another person under that person's direction?
    grounding:
    - F_DOGU
    handler: light
  M_PUOBGIS_A_GPTAPU:
    statement: The goods are put to any private use
    order: LOW
    rule: F_FOGU = 'PRIVATE_USE'
    handler: python
  M_PUOBGIS_A_GUFNBP:
    statement: The goods are used for any purpose other than a purpose of the business
    order: LOW
    rule: F_FOGU = 'USED_BY_PERSON' AND F_POGU = 'NON_BUSINESS'
    handler: python
  M_PUOBGIS_A_GMAFNBU:
    statement: The goods are made available to any person for use, for any purpose other than a purpose of the business
    order: LOW
    rule: F_FOGU = 'MADE_AVAILABLE_TO_ANY_PERSON' AND F_POGU = 'NON_BUSINESS'
    handler: python
  M_TOBASOG_A_GFBA:
    statement: Goods forming part of the assets of a business
    order: LOW
    rule: F_BAS = 'PART_OF_BUSINESS_ASSETS'
    handler: python
  M_TOPOGIS_A_AITOP:
    statement: The activity performed is any treatment or process
    order: HIGH
    interpretation: Does the described activity qualify as a treatment or process in its ordinary sense, the word any being
      unrestricted
    grounding:
    - F_DOAOT
    handler: heavy
  M_TOPOGIS_A_AATG:
    statement: The treatment or process is applied to goods
    order: LOW
    rule: F_ASK = 'GOODS'
    handler: python
  M_TOPOGIS_A_GBTAP:
    statement: The goods to which the treatment or process is applied belong to another person
    order: LOW
    rule: F_GOR = 'OWNED_BY_ANOTHER_PERSON'
    handler: python
  M_ISDMR_A_TPRAI:
    statement: The taxable person is registered as an Input Service Distributor
    order: LOW
    rule: F_PTC = 'ISD'
    handler: python
  M_ISDMR_A_RIPFAM:
    statement: The return is furnished in such form and manner as may be prescribed
    order: HIGH
    interpretation: Is the form used, and the manner of furnishing, what the prescribed requirements specify for an Input
      Service Distributor return, which this text does not state?
    grounding:
    - F_RFUFF
    - F_RMC
    handler: heavy
  M_ISDMR_A_RFWTD:
    statement: The return is furnished within thirteen days after the end of such month
    order: LOW
    rule: F_RFT = 'ON_OR_BEFORE_DUE_DATE'
    handler: python
  M_RPFMR_A_RCCMOP:
    statement: The return is furnished for every calendar month or part thereof
    order: HIGH
    interpretation: Does the tax period of the return cover a calendar month or a part of a calendar month?
    grounding:
    - F_TPOR
    handler: light
  M_NTPRF_A_RHBF:
    statement: The registered non-resident taxable person has furnished a return
    order: LOW
    rule: F_DOF IS_SET
    handler: python
  M_NTPRF_A_RFE:
    statement: The return is furnished electronically
    order: LOW
    rule: F_MOFD = 'ELECTRONIC'
    handler: python
  M_RFNAIPU_A_RFTPF:
    statement: The person is furnishing a return for a tax period
    order: LOW
    if_false: F_RTP NOT SET
    rule: F_RTP IS_SET
    handler: python
  M_RFNAIPU_A_EPRU:
    statement: The return for any of the previous tax periods has not been furnished by the person
    order: LOW
    rule: F_AERU = TRUE
    handler: python
    compute:
      F_RHBF: F_RHBF = (F_RFT == 'AFTER_DUE_DATE' or F_RFT == 'ON_OR_BEFORE_DUE_DATE')
      F_AERU: TRUE if at least one F_RHBF for an earlier tax period of the same person is FALSE
  M_FODRP_A_FIRP:
    statement: The person furnishing the details is a registered person
    order: LOW
    rule: F_PRS = 'REGISTERED'
    handler: python
  M_COBTAS_A_AIBC:
    statement: The activity is construction of a complex, building, civil structure or a part thereof, including a complex
      or building intended for sale to a buyer, wholly or partly
    order: HIGH
    interpretation: Does the described activity amount to construction of a complex, building, civil structure or a part thereof,
      including a complex or building intended for sale to a buyer wholly or partly? The sale-intent wording is inclusive
      and does not narrow the construction subject.
    grounding:
    - F_DOTA
    handler: light
  M_COBTAS_A_CRAM:
    statement: The entire consideration has been received after issuance of completion certificate, where required, by the
      competent authority or after its first occupation, whichever is earlier
    order: LOW
    rule: F_CRT = 'AFTER_EARLIER_MILESTONE'
    handler: python
    compute:
      F_CRT: NOT_RECEIVED_IN_FULL if the entire consideration has not been received; otherwise the reference date is the first
        occupation date when the certificate is NOT_REQUIRED, the earlier of the certificate date and the first occupation
        date when the certificate is ISSUED, and UNKNOWN when the certificate is REQUIRED_NOT_ISSUED; the value is AFTER_EARLIER_MILESTONE
        when the receipt date is later than the reference date, else ON_OR_BEFORE_EARLIER_MILESTONE
  M_SOLAB_A_TISOL:
    statement: The transaction is a sale of land.
    order: LOW
    rule: F_PSS = 'LAND' OR F_PSS = 'LAND_AND_BUILDING'
    handler: python
  M_SOLAB_A_TISOB:
    statement: The transaction is a sale of building.
    order: LOW
    rule: F_PSS = 'BUILDING' OR F_PSS = 'LAND_AND_BUILDING'
    handler: python
  M_RPFMR_A_RSIOS:
    statement: The return contains details of inward and outward supplies of goods or services or both
    order: LOW
    rule: F_RISD IS_SET AND F_ROSD IS_SET
    handler: python
  M_RPFMR_A_RSITCA:
    statement: The return contains details of input tax credit availed
    order: LOW
    rule: F_RICD IS_SET
    handler: python
  M_RPFMR_A_RSTP:
    statement: The return contains details of tax payable
    order: LOW
    rule: F_RTPD IS_SET
    handler: python
  M_RPFMR_A_RSTP2:
    statement: The return contains details of tax paid
    order: LOW
    rule: F_RTPD2 IS_SET
    handler: python
  M_RPFMR_A_RHOPP:
    statement: The return contains such other particulars as may be prescribed
    order: HIGH
    interpretation: Does the return include the other particulars that the prescribed rules require? The rules are not part
      of this provision.
    grounding:
    - F_ROP
    handler: light
  M_RPFMR_A_RFWPT:
    statement: The return is furnished within such time as may be prescribed
    order: HIGH
    interpretation: Is the date of furnishing within the time prescribed for this return period?
    grounding:
    - F_DOF
    - F_TPOR
    handler: light
  M_RPOSD_A_PIISD:
    statement: The person is an Input Service Distributor
    order: LOW
    rule: F_PTC = 'ISD'
    handler: python
  M_RPOSD_A_PINTP:
    statement: The person is a non-resident taxable person
    order: LOW
    rule: F_PTC = 'NON_RESIDENT'
    handler: python
  M_RPOSD_A_PPTUS10:
    statement: The person is a person paying tax under the provisions of section 10
    order: LOW
    rule: F_PTC = 'COMPOSITION_S10'
    handler: python
  M_RPOSD_A_PPTUS51:
    statement: The person is a person paying tax under the provisions of section 51
    order: LOW
    rule: F_PTC = 'TDS_S51'
    handler: python
  M_RPOSD_A_PPTUS52:
    statement: The person is a person paying tax under the provisions of section 52
    order: LOW
    rule: F_PTC = 'TCS_S52'
    handler: python
  M_RPOSD_A_DAFE:
    statement: The person shall furnish the details electronically
    order: LOW
    rule: F_MOFD = 'ELECTRONIC'
    handler: python
  M_RPOSD_A_FIPFAM:
    statement: The person shall furnish the details in such form and manner as may be prescribed
    order: HIGH
    interpretation: Was the furnishing done in the form and manner prescribed for outward supply details? The prescribed form
      and manner are not stated in this provision and must be read from the rules.
    grounding:
    - F_RFUFF
    handler: light
  M_GPTNQR_A_NOCR:
    statement: The Government's notification of the class of registered persons is made on the recommendations of the Council
    order: LOW
    rule: F_NRB = 'COUNCIL'
    handler: python
  M_GPTNQR_A_PINC:
    statement: The person belongs to a certain class of registered persons notified by the Government
    order: HIGH
    interpretation: Does the description of the class in the notification cover this person, given the person's registration
      and return profile details?
    grounding:
    - F_NCD
    - F_PPD
    handler: heavy
  M_GPTNQR_A_NREQ:
    statement: The notified persons shall furnish a return for every quarter or part thereof
    order: LOW
    rule: F_NRFF = 'QUARTERLY'
    handler: python
  M_GPTNQR_A_NNCS:
    statement: The notification specifies no condition or restriction on the quarterly return obligation
    order: LOW
    rule: F_NSAC = FALSE
    handler: python
  M_GPTNQR_A_NCSBP:
    statement: The quarterly return obligation is subject to such conditions and restrictions as may be specified in the notification,
      and the person satisfies each condition and restriction so specified
    order: HIGH
    interpretation: Weighing the conditions and restrictions as written in the notification against the person's records,
      is each specified condition and restriction satisfied by this person?
    grounding:
    - F_CTIN
    - F_PCR
    handler: heavy
  M_CTFAR_A_RFFYOP:
    statement: The return is for each financial year or part thereof
    order: LOW
    rule: F_RPC IN ['FULL_FINANCIAL_YEAR', 'PART_FINANCIAL_YEAR']
    handler: python
  M_CTFAR_A_RPFR:
    statement: The registered person furnishes a return as required by the shall obligation
    order: LOW
    rule: F_DOF IS_SET
    handler: python
  M_CTFAR_A_RCST:
    statement: The return contains turnover in the State or Union territory
    order: LOW
    rule: F_RTD IS_SET
    handler: python
  M_CTFAR_A_RCIS:
    statement: The return contains inward supplies of goods or services or both
    order: LOW
    rule: F_RISD IS_SET
    handler: python
  M_MRFBRP_A_RFFTP:
    statement: The registered person shall furnish a return for every tax period whether or not any supplies of goods or services
      or both have been made during such tax period
    order: LOW
    rule: F_DOF IS_SET
    handler: python
groups:
  M_SIAFOS_G_QFOS:
    name: Qualifying Forms Of Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL2
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: The supply must take one of the listed forms or another qualifying form.
  M_SIAFOS_G_SFC:
    name: Supply For Consideration
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply must be made or agreed to be made for a consideration.
  M_IOSFC_G_CFIOSTBS:
    name: Conditions For Import Of Service To Be Supply
    logic: ALL
    members:
    - M_IOSFC_A_TIAIOS
    - M_IOSFC_A_IIFAC
    description: Both conditions must be met. The business test is explicitly not a condition for this type of supply.
  M_MOWG_G_SACM:
    name: Scope And Customs Meaning
    logic: ALL
    members:
    - M_MOWG_A_TUFPE
    - M_MOWG_A_GMCM
    description: Both the paragraph 8 scope and the Customs meaning test must hold for the imported meaning to apply
  M_DOCFP2_G_CTI:
    name: Court Term Inclusion
    logic: ANY
    members:
    - M_DOCFP2_A_BINC
    - M_DOCFP2_A_BIUC
    description: The term court is met by a named court or by an open court inclusion
  M_AACA_G_CAR:
    name: Competent Authority Routes
    logic: ANY
    members:
    - M_AACA_A_CAIG
    - M_AACA_A_AATIC
    - M_AACA_G_ARC
    description: Any one of the three routes makes the person or body a competent authority
  M_AACA_G_ARC:
    name: Architect Route Conditions
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_AACA_A_ARWC
    description: Architect route - no completion certificate is required from the authority and the person is a registered
      architect
  M_CEACA_G_GOAI:
    name: Government Or Authorised Issuer
    logic: ANY
    members:
    - M_AACA_A_CAIG
    - M_AACA_A_AATIC
    description: Either the Government or an authority authorised to issue a completion certificate under any law in force
  M_CEACA_G_NCACE:
    name: No Certificate And Chartered Engineer
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_CEACA_A_CERWI
    description: The chartered engineer route applies only where no completion certificate is required from such authority
      and the person is a registered chartered engineer
  M_LSACA_G_SRC:
    name: Surveyor Route Conditions
    logic: ALL
    members:
    - M_AACA_A_CCNR
    - M_LSACA_A_LSOLB
    description: The surveyor route applies only when no completion certificate is required from the authority and the person
      is a licensed surveyor of the respective local body or planning authority
  M_CIAAA_G_LWF:
    name: Listed Work Forms
    logic: ANY
    members:
    - M_CIAAA_A_WCOA
    - M_CIAAA_A_AFOW
    - M_CIAAA_A_ROP
    - M_CIAAA_A_ROS
    description: Any one of the four listed forms of work, joined by or
  M_SOGBCBC_G_APEC:
    name: All Paragraph Eight Conditions
    logic: ALL
    members:
    - M_LTPTOG_A_SIOG
    - M_SOGBCBC_A_SITC
    - M_SOGBCBC_A_SMTOP
    - M_SOGBCBC_A_SBDE
    - M_SOGBCBC_A_DFFP
    - M_SOGBCBC_A_BCFHC
    description: The four supply conditions and the two timing conditions must all hold together, joined by the source wording.
  M_SOWGBC_G_WPCC:
    name: Warehoused Pre Clearance Conditions
    logic: ALL
    members:
    - M_SOWGBC_A_GAWG
    - M_SOWGBC_A_SBHC
    description: Both conditions must be met together; the recipient qualifier is not a condition.
  M_FBCMS_G_FBKA:
    name: Funeral Burial Kind Alternatives
    logic: ANY
    members:
    - M_FBCMS_A_AIFS
    - M_FBCMS_A_AIBS
    - M_FBCMS_A_AICS
    - M_FBCMS_A_AIMS
    description: Any one of the listed kinds of funeral, burial, crematorium or mortuary service
  M_ESTE_G_ESC:
    name: Employee Service Conditions
    logic: ALL
    members:
    - M_ESTE_A_SBETE
    - M_ESTE_A_AIAS
    - M_ESTE_A_SIEC
    description: 'All three conditions of the entry must hold: an employee-to-employer relationship, a services activity and
      a link to employment.'
  M_DBGBM_G_ODP:
    name: Office Duty Pair
    logic: ALL
    members:
    - M_DBGBM_A_DPAOH
    - M_FOEM_A_AIMF
    description: The person holds the listed office role and the activity is the duty performed in that capacity
  M_DBCPH_G_CDT:
    name: Constitutional Duty Test
    logic: ALL
    members:
    - M_DBCPH_A_HOCP
    - M_DBCPH_A_DPIC
    description: Both the constitutional post and the capacity of performance must be satisfied
  M_SBCOT_G_CSC:
    name: Court Service Conditions
    logic: ALL
    members:
    - M_SBCOT_A_AIAS
    - M_SBCOT_A_PICOT
    - M_SBCOT_A_CEUL
    description: 'All conditions of the entry must be met together: service, provider is a court or Tribunal, and established
      under law in force'
  M_SOGFNT_G_ESCA:
    name: Entry Seven Conditions All
    logic: ALL
    members:
    - M_SOGFNT_A_TISOG
    - M_SOGFNT_A_SOINT
    - M_SOGFNT_A_SDFNT
    - M_SOGFNT_A_DIAP
    - M_SOGFNT_A_GDNEI
    description: All five conditions must hold together.
  M_PUOBGIS_G_BPAGC:
    name: Business Person And Goods Context
    logic: ALL
    members:
    - M_PUOBGIS_A_PCOAB
    - M_PUOBGIS_A_UIBOUD
    - M_TOBASOG_A_GFBA
    description: A person carrying on a business, by or under whose direction the use occurs, and goods held or used for that
      business.
  M_PUOBGIS_G_PONBUR:
    name: Private Or Non Business Use Routes
    logic: ANY
    members:
    - M_PUOBGIS_A_GPTAPU
    - M_PUOBGIS_A_GUFNBP
    - M_PUOBGIS_A_GMAFNBU
    description: 'Any one of: private use, use for a non-business purpose, or making available to any person for use for a
      non-business purpose.'
  M_TOPOGIS_G_TOAG:
    name: Treatment On Another Goods
    logic: ALL
    members:
    - M_TOPOGIS_A_AITOP
    - M_TOPOGIS_A_AATG
    - M_TOPOGIS_A_GBTAP
    description: All three conditions must be satisfied together
  M_ISDMR_G_RSC:
    name: Return Scope Conditions
    logic: ALL
    members:
    - M_ISDMR_A_TPRAI
    - M_RPFMR_A_RCCMOP
    description: The person is an Input Service Distributor and the return covers the calendar month or part
  M_ISDMR_G_RFC:
    name: Return Filing Conditions
    logic: ALL
    members:
    - M_NTPRF_A_RHBF
    - M_ISDMR_A_RIPFAM
    - M_NTPRF_A_RFE
    - M_ISDMR_A_RFWTD
    description: The return is furnished in prescribed form and manner, electronically and within thirteen days after month
      end
  M_RFNAIPU_G_AFBC:
    name: All Furnishing Block Conditions
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_RFNAIPU_A_RFTPF
    - M_RFNAIPU_A_EPRU
    description: The if clause of the source as an AND of three conditions
  M_ANGNS_A_AOTISISIII:
    name: Any of the referred steps (M_ANGNS_A_AOTISISIII)
    logic: ANY
    members:
    - M_ACOTLBG_PD_ACNS
    - M_DBCPH_PD_NSO
    - M_DBGBM_PD_NSOD
    - M_ESTE_PD_ESNS
    - M_FBCMS_PD_NSO
    - M_FOEM_PD_MFNS
    - M_SBCOT_PD_NSCS
    - M_SOGBCBC_PD_NSO
    - M_SOGFNT_PD_NSO
    - M_SOLAB_PD_LOBSO
    - M_SOWGBC_PD_WGNS
    description: TRUE when any step of the law this check refers to is TRUE
  M_RPFMR_G_EPC:
    name: Excluded Person Categories
    logic: ANY
    members:
    - M_RPOSD_A_PIISD
    - M_RPOSD_A_PINTP
    - M_RPOSD_A_PPTUS10
    - M_RPOSD_A_PPTUS51
    - M_RPOSD_A_PPTUS52
    description: Person is an Input Service Distributor or a non-resident taxable person or pays tax under section 10 or 51
      or 52. Any one takes the person outside the duty (other than).
  M_RPFMR_G_RCPP:
    name: Return Core Particulars Present
    logic: ALL
    members:
    - M_RPFMR_A_RSIOS
    - M_RPFMR_A_RSITCA
    - M_RPFMR_A_RSTP
    - M_RPFMR_A_RSTP2
    - M_RPFMR_A_RHOPP
    description: The return carries the listed particulars and such other particulars as may be prescribed.
  M_RPFMR_G_RFC:
    name: Return Furnishing Conditions
    logic: ALL
    members:
    - M_RPFMR_A_RCCMOP
    - M_RPOSD_A_DAFE
    - M_RPFMR_G_RCPP
    - M_RPOSD_A_FIPFAM
    - M_RPFMR_A_RFWPT
    description: 'All stated requirements on the return: period, electronic mode, particulars, prescribed form and manner,
      and prescribed time.'
  M_GPTNQR_G_RPINC:
    name: Registered Person In Notified Class
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_GPTNQR_A_PINC
    description: The person must be a registered person and must belong to the class notified by the Government.
  M_GPTNQR_G_NCSOA:
    name: Notified Conditions Satisfied Or Absent
    logic: ANY
    members:
    - M_GPTNQR_A_NNCS
    - M_GPTNQR_A_NCSBP
    description: Either the notification specifies no condition or restriction, or the person satisfies the conditions and
      restrictions the notification specifies.
  M_CTFAR_G_RCTG:
    name: Registered Composition Taxpayer Group
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_RPOSD_A_PPTUS10
    description: A registered person who pays tax under section 10
  M_CTFAR_G_MRCG:
    name: Mandatory Return Content Group
    logic: ALL
    members:
    - M_CTFAR_A_RCST
    - M_CTFAR_A_RCIS
    - M_RPFMR_A_RSTP
    - M_RPFMR_A_RSTP2
    - M_RPFMR_A_RHOPP
    description: All listed particulars must be in the return
  M_CTFAR_G_RFMG:
    name: Return Furnishing Manner Group
    logic: ALL
    members:
    - M_RPOSD_A_DAFE
    - M_RPOSD_A_FIPFAM
    description: Electronic furnishing and the prescribed form and manner
  M_MRFBRP_A_RRFUS39:
    name: Any of the referred steps (M_MRFBRP_A_RRFUS39)
    logic: ANY
    members:
    - M_CTFAR_PD_ARDA
    - M_CTFAR_PD_ARDM
    - M_GPTNQR_PD_QRR
    - M_RPFMR_PD_RMSR
    - M_RPFMR_PD_ROATP
    description: TRUE when any step of the law this check refers to is TRUE
  M_MRFBRP_G_RRFT:
    name: Registered Return Filer Test
    logic: ALL
    members:
    - M_FODRP_A_FIRP
    - M_MRFBRP_A_RRFUS39
    description: Every registered person who is required to furnish a return under sub-section (1) or sub-section (2) is the
      group to which the duty applies.
outcomes:
  M_SIAFOS_LE_IISUS71A:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAFOS_G_QFOS AND M_SIAFOS_G_SFC AND M_SIAFOS_A_SICOB
    module: M_SIAFOS
    description: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_LE_IOSFCIS:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_CFIOSTBS
    module: M_IOSFC
    description: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_SIAWC_LE_IISFSIA:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_A_AISISI AND M_SIAWC_A_AIWC
    module: M_SIAWC
    description: The transaction is included in the scope of supply if it is a Schedule I activity and is without consideration.
  M_MOWG_LE_WGMA:
    outcome: MEANING_ESTABLISHED
    expr: M_MOWG_G_SACM
    module: M_MOWG
    description: The Customs meaning of warehoused goods applies for paragraph 8 when the scope test and the goods test are
      both met
  M_DOCFP2_LE_BCO:
    outcome: BODY_IS_COURT_FOR_PARA2
    expr: M_DOCFP2_G_CTI
    module: M_DOCFP2
    description: The body is a court for the purposes of paragraph 2 when the court term is met
  M_AACA_LE_CAD:
    outcome: COMPETENT_AUTHORITY
    expr: M_AACA_G_CAR
    module: M_AACA
    description: A person or body is a competent authority if it is the Government, or an authority authorised to issue completion
      certificates, or - where no certificate is required - a registered architect
  M_CEACA_LE_CADO:
    outcome: COMPETENT_AUTHORITY_FOR_CLAUSE_5B
    expr: M_CEACA_G_GOAI OR M_CEACA_G_NCACE
    module: M_CEACA
    description: A competent authority for clause 5(b) is reached only through the Government or authorised certificate-issuing
      authority route, or through the registered chartered engineer route where no completion certificate is required.
  M_LSACA_LE_CAIE:
    outcome: COMPETENT_AUTHORITY_UNDER_THIS_ITEM
    expr: M_LSACA_A_GOCIA OR M_LSACA_G_SRC
    module: M_LSACA
    description: The authority is the Government or an authorised completion certificate issuer, or else a licensed surveyor
      where no certificate is required from that authority
  M_CIAAA_LE_CFO:
    outcome: IS_CONSTRUCTION_FOR_CLAUSE_5B
    expr: M_CIAAA_G_LWF AND M_CIAAA_A_WOES
    module: M_CIAAA
    description: A listed form of work on an existing civil structure counts as construction for this clause
  M_SOGBCBC_LE_NSO:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: M_SOGBCBC_G_APEC
    module: M_SOGBCBC
    description: Neither supply treatment applies only when every supply and timing condition holds.
  M_SOWGBC_LE_WGNS:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: M_SOWGBC_G_WPCC
    module: M_SOWGBC
    description: Outcome applies only when both atoms in the group are TRUE; the qualifier to any person adds no recipient
      test.
  M_FBCMS_LE_NSO:
    outcome: NEITHER_SUPPLY_SCHIII_4
    expr: M_FBCMS_G_FBKA
    module: M_FBCMS
    description: The activity is treated neither as a supply of goods nor a supply of services when it is one of the listed
      funeral, burial, crematorium or mortuary services
  M_ESTE_LE_ESNS:
    outcome: NEITHER_SUPPLY
    expr: M_ESTE_G_ESC
    module: M_ESTE
    description: The activity is treated as neither a supply of goods nor a supply of services when all employee service conditions
      are met.
  M_DBGBM_LE_NSOD:
    outcome: NEITHER_SUPPLY
    expr: M_DBGBM_G_ODP AND M_DBGBM_A_BEBG AND M_DBGBM_A_NDEBC
    module: M_DBGBM
    description: Office duties in a government-established body by a person not deemed an employee are treated neither as
      a supply of goods nor services
  M_FOEM_LE_MFNS:
    outcome: NEITHER_SUPPLY
    expr: M_FOEM_A_PHEO AND M_FOEM_A_AIMF
    module: M_FOEM
    description: The activity is treated neither as a supply of goods nor a supply of services when the person holds a listed
      elected office and the activity is a function performed by that Member.
  M_DBCPH_LE_NSO:
    outcome: NEITHER_SUPPLY
    expr: M_DBCPH_G_CDT
    module: M_DBCPH
    description: The duties are treated neither as a supply of goods nor as a supply of services
  M_SBCOT_LE_NSCS:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: M_SBCOT_G_CSC
    module: M_SBCOT
    description: Service by a court or Tribunal established under law is treated neither as a supply of goods nor a supply
      of services
  M_ACOTLBG_LE_ACNS:
    outcome: NEITHER_SUPPLY
    expr: M_ACOTLBG_A_AIAC AND M_ACOTLBG_A_COTLBG
    module: M_ACOTLBG
    description: Both conditions true gives neither supply of goods nor supply of services under Schedule III paragraph 6
  M_SOGFNT_LE_NSO:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: M_SOGFNT_G_ESCA
    module: M_SOGFNT
    description: The activity is neither a supply of goods nor a supply of services when all entry 7 conditions hold.
  M_PUOBGIS_LE_BGPUDS:
    outcome: USAGE_OR_MAKING_AVAILABLE_DEEMED_SUPPLY_OF_SERVICES
    expr: M_PUOBGIS_G_BPAGC AND M_PUOBGIS_G_PONBUR
    module: M_PUOBGIS
    description: The deeming applies when the business context is met and at least one of the three use routes is met.
  M_TOPOGIS_LE_TOAGIS:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TOPOGIS_G_TOAG
    module: M_TOPOGIS
    description: The deemed supply of services follows when the whole treatment group is satisfied
  M_ISDMR_LE_IMRC:
    outcome: ISD_RETURN_COMPLIANT
    expr: M_ISDMR_G_RSC AND M_ISDMR_G_RFC
    module: M_ISDMR
    description: The ISD monthly return obligation is met only when the person is an Input Service Distributor, the return
      covers the calendar month and every filing condition holds
  M_RFNAIPU_LE_FNAO:
    outcome: FURNISHING_NOT_ALLOWED
    expr: M_RFNAIPU_G_AFBC
    module: M_RFNAIPU
    description: Prohibition outcome applies only when all three block conditions hold
  M_COBTAS_LE_CTAS:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: M_COBTAS_A_AIBC AND NOT M_COBTAS_A_CRAM
    module: M_COBTAS
    description: Deemed supply of services applies when the activity is construction as described and the entire consideration
      was not received after the earlier completion or occupation milestone.
  M_SOLAB_LE_LOBSO:
    outcome: NEITHER_SUPPLY
    expr: M_SOLAB_A_TISOL OR (M_SOLAB_A_TISOB AND NOT M_COBTAS_PD_CTAS)
    module: M_SOLAB
    description: The transaction is treated as neither supply of goods nor supply of services if it includes a sale of land,
      or a sale of building that is not subject to clause (b) of paragraph 5 of Schedule II
  M_ANGNS_LE_TANSOGNS:
    outcome: NOT_A_SUPPLY
    expr: M_ANGNS_A_AOTISISIII
    module: M_ANGNS
    description: The legal outcome is that the activity or transaction is treated as neither a supply of goods nor a supply
      of services.
  M_RPFMR_LE_ROATP:
    outcome: RETURN_OBLIGATION_APPLIES
    expr: M_FODRP_A_FIRP AND NOT M_RPFMR_G_EPC
    module: M_RPFMR
    description: The duty to furnish the return applies to a registered person who is not in any excluded category.
  M_RPFMR_LE_RMSR:
    outcome: RETURN_MEETS_SECTION_39_1_REQUIREMENTS
    expr: M_RPFMR_G_RFC
    module: M_RPFMR
    description: The return is for the calendar month or part month, is furnished electronically, carries the stated particulars
      and is in the prescribed form and time. It is only meaningful for a person covered by M_RPFMR_LE_ROATP.
  M_GPTNQR_LE_QRR:
    outcome: QUARTERLY_RETURN_REQUIRED
    expr: M_GPTNQR_A_NOCR AND M_GPTNQR_G_RPINC AND M_GPTNQR_A_NREQ AND M_GPTNQR_G_NCSOA
    module: M_GPTNQR
    description: A registered person in a class notified on Council recommendation must furnish a return for every quarter
      or part thereof, subject to the notified conditions and restrictions.
  M_CTFAR_LE_ARDA:
    outcome: ANNUAL_RETURN_DUTY_APPLIES
    expr: M_CTFAR_G_RCTG AND M_CTFAR_A_RFFYOP
    module: M_CTFAR
    description: The shall duty arises for a registered person paying tax under section 10 for each financial year or part
      thereof
  M_CTFAR_LE_ARDM:
    outcome: RETURN_OBLIGATION_MET
    expr: M_CTFAR_G_RCTG AND M_CTFAR_A_RFFYOP AND M_CTFAR_A_RPFR AND M_CTFAR_G_MRCG AND M_CTFAR_G_RFMG AND M_RPFMR_A_RFWPT
    module: M_CTFAR
    description: The duty is met when the return is furnished with the required content in the prescribed form, manner and
      time
  M_MRFBRP_LE_RDM:
    outcome: DUTY_MET_FOR_PERIOD
    expr: M_MRFBRP_G_RRFT AND M_MRFBRP_A_RFFTP
    module: M_MRFBRP
    description: The registered filer has furnished a return for the tax period.
  M_MRFBRP_LE_RDNM:
    outcome: DUTY_NOT_MET_FOR_PERIOD
    expr: M_MRFBRP_G_RRFT AND NOT M_MRFBRP_A_RFFTP
    module: M_MRFBRP
    description: The registered filer has not furnished a return for the tax period, and no supply in the period does not
      excuse it.
  M_MRFBRP_LE_S398NA:
    outcome: NO_SECTION_39_8_DUTY
    expr: NOT M_MRFBRP_G_RRFT
    module: M_MRFBRP
    description: The person is not a registered person required to furnish a return under sub-section (1) or sub-section (2),
      so this MKP gives no return-duty finding.
