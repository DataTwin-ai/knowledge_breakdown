  F_GEII:  # 16. 1 gate | 2 law(s)
    name: Goods Entry Into India
    type: CODE
    options:
    - ENTERS_INDIA
    - DOES_NOT_ENTER
    tier: T1
    derived_from:
    - F_SOOT
    formula: If F_SOOT = 'IMPORT', then F_GEII = 'ENTERS_INDIA'. Otherwise (if F_SOOT = 'EXPORT' or 'DOMESTIC'), F_GEII =
      'DOES_NOT_ENTER'.
    origin:
      document: CUSTOMS
      method: DERIVED
      uses: [F_SOOT, CUSTOMS.be_no]
      how_to_get: 'If a CUSTOMS bill of entry exists (CUSTOMS.be_no present), the goods entered India: ENTERS_INDIA. Otherwise use the origin and destination places from F_SOOT. If both are in the non-taxable territory and no bill of entry exists, the value is DOES_NOT_ENTER.'
      fallback: 'Ask the user: ''Did these goods enter into India?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: DOES_NOT_ENTER
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_GTM:  # 17. 1 gate | 2 law(s)
    name: Goods Transfer Mechanism
    type: CODE
    options:
    - ENDORSEMENT_OF_DOCUMENTS_OF_TITLE
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject]
      how_to_get: Read CONTRACT.subject for how the goods are passed to the buyer. If it says the documents of title (bill of lading, delivery order) are endorsed to the buyer, the value is ENDORSEMENT_OF_DOCUMENTS_OF_TITLE. Otherwise OTHER.
      fallback: 'Ask the user: ''Were the goods transferred by endorsement of documents of title, or in another way?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: ENDORSEMENT_OF_DOCUMENTS_OF_TITLE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_NRB:  # 18. 1 gate | 2 law(s)
    name: Notification Recommending Body
    type: CODE
    options:
    - COUNCIL
    - NONE_STATED
    - OTHER
    tier: T1
    source_kind: DOCUMENT
    origin:
      document: NOTIFICATION
      method: FIELD
      uses: [NOTIFICATION.recommended_by]
      how_to_get: Take NOTIFICATION.recommended_by from the notification in Law/. If it names the GST Council, the value is COUNCIL. If the field is empty or says nothing about a recommendation, the value is NONE_STATED. If it names any other body, the value is OTHER.
      fallback: Read the preamble of the notification text for the words 'on the recommendations of the Council'.
      when_missing: STOP
      as_of: notification date
      level: DOCUMENT
      ai_level: NONE
      cost: LOW
      example: COUNCIL
      confidence: high
      sensitive: false
      reviewed: false
      origin_by: AI
  F_NRFF:  # 19. 1 gate | 2 law(s)
    name: Notified Return Filing Frequency
    type: CODE
    options:
    - QUARTERLY
    - MONTHLY
    - OTHER
    tier: T1
    source_kind: DOCUMENT
    origin:
      document: NOTIFICATION
      method: LOOKUP
      uses: [NOTIFICATION.notification_no, NOTIFICATION.notified_class]
      how_to_get: Find the notification that applies to the taxpayer's class in our Law/ notification table, using notification_no and notified_class. Take the return filing frequency recorded for that notification. Return QUARTERLY if it requires quarterly returns, MONTHLY if monthly, otherwise OTHER. If no notification covers the class, return OTHER. Never ask the user.
      fallback: Read NOTIFICATION.conditions and NOTIFICATION.notified_class text on our side to find the frequency named there.
      when_missing: UNKNOWN
      as_of: start of the tax period for which the return is due (the notification must be in force then)
      level: TAXPAYER
      ai_level: NONE
      cost: MEDIUM
      example: QUARTERLY
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ODR:  # 20. 1 gate | 2 law(s)
    name: Origin Destination Relation
    type: CODE
    options:
    - DIFFERENT_PLACE
    - SAME_PLACE
    tier: T1
    origin:
      document: SALE_INVOICE
      method: DERIVED
      uses: [SALE_INVOICE.supplier_state, SALE_INVOICE.ship_to_state, SALE_INVOICE.place_of_supply]
      how_to_get: Compare the origin place with the destination place on the invoice. Origin is supplier_state. Destination is ship_to_state, or place_of_supply if ship_to_state is blank. Return SAME_PLACE if they are the same, otherwise DIFFERENT_PLACE.
      fallback: 'Ask the user: ''Is the place the goods are sent to the same as the place they are sent from?'''
      when_missing: ASK
      as_of: date of supply (invoice date)
      level: TRANSACTION
      ai_level: NONE
      cost: LOW
      example: DIFFERENT_PLACE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_OPT:  # 21. 1 gate | 2 law(s)
    name: Origin Place Territory
    type: CODE
    options:
    - NON_TAXABLE_TERRITORY
    - OTHER_TERRITORY
    tier: T1
    origin:
      document: SALE_INVOICE
