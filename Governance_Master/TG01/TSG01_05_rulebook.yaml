# GOVERNANCE MASTER TSG01_05 Exempt, nil-rated & non-GST (TG01 Supply & Taxability)
# LAW ARC - 5 laws - status APPROVED
name: TSG01_05 Exempt, nil-rated & non-GST - GOVERNANCE MASTER rulebook
version: TSG01_05
facts:
  F_PPT:
    name: Petroleum Product Type
    type: CODE
    options:
    - PETROLEUM_CRUDE
    - HIGH_SPEED_DIESEL
    - MOTOR_SPIRIT
    - NATURAL_GAS
    - AVIATION_TURBINE_FUEL
    - OTHER
    tier: T1
  F_NOCR:
    name: Notification On Council Recommendation
    type: BOOLEAN
    tier: T1
  F_NLED:
    name: Notified Levy Effective Date
    type: DATE
    tier: T1
  F_SLTS:
    name: Supply Levy Timing Status
    type: CODE
    options:
    - ON_OR_AFTER_LEVY_DATE
    - BEFORE_LEVY_DATE
    - UNKNOWN
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_TCM:
    name: Tax Collection Method
    type: TEXT
    tier: T0
  F_TPS:
    name: Tax Payer Status
    type: CODE
    options:
    - TAXABLE_PERSON
    - OTHER_PERSON
    - UNKNOWN
    tier: T0
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_LOCTOPP_A_SOLPP:
    statement: The supply is of petroleum crude, high speed diesel, motor spirit (commonly known as petrol), natural gas or
      aviation turbine fuel
    order: LOW
    rule: F_PPT IN ['PETROLEUM_CRUDE','HIGH_SPEED_DIESEL','MOTOR_SPIRIT','NATURAL_GAS','AVIATION_TURBINE_FUEL']
    handler: python
  M_LOCTOPP_A_NOCR:
    statement: The levy date is notified by the Government on the recommendations of the Council
    order: LOW
    rule: F_NOCR = TRUE
    handler: python
  M_LOCTOPP_A_LDNBG:
    statement: A date has been notified by the Government from which central tax is levied on these petroleum products
    order: LOW
    rule: F_NLED IS_SET
    handler: python
  M_LOCTOPP_A_SOOALD:
    statement: The supply is made on or after the notified date with effect from which the central tax is levied
    order: LOW
    rule: F_SLTS = 'ON_OR_AFTER_LEVY_DATE'
    handler: python
  M_LOCGAST_A_SIALFHC:
    statement: The supply is a supply of alcoholic liquor for human consumption
    order: HIGH
    interpretation: From the description of the supply, is the item supplied alcoholic liquor for human consumption?
    grounding:
    - F_DOS
    handler: light
  M_LOCGAST_A_TCAP:
    statement: The tax is collected in such manner as may be prescribed
    order: HIGH
    interpretation: Is the tax collected in the manner laid down by the rules prescribed for its collection?
    grounding:
    - F_TCM
    handler: light
  M_LOCGAST_A_TPPT:
    statement: The tax is paid by the taxable person
    order: HIGH
    interpretation: Is the person who pays the tax the taxable person liable to pay it?
    grounding:
    - F_TPS
    handler: light
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_LOCTOPP_G_NLD:
    name: Notified Levy Date
    logic: ALL
    members:
    - M_LOCTOPP_A_LDNBG
    - M_LOCTOPP_A_NOCR
    description: The levy date must be notified by the Government on the recommendations of the Council
  M_LOCTOPP_G_LCM:
    name: Levy Conditions Met
    logic: ALL
    members:
    - M_LOCTOPP_A_SOLPP
    - M_LOCTOPP_G_NLD
    - M_LOCTOPP_A_SOOALD
    description: The listed product, the notified levy date and the supply timing are all required
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_LOCTOPP_LE_CTL:
    outcome: CENTRAL_TAX_LEVIED
    expr: M_LOCTOPP_G_LCM
    module: M_LOCTOPP
    description: All levy conditions are met, so central tax is levied under this provision
  M_LOCTOPP_LE_LNAH:
    outcome: NOT_LEVIED_UNDER_THIS_PROVISION
    expr: NOT M_LOCTOPP_G_LCM
    module: M_LOCTOPP
    description: A levy condition is not met, so this provision does not levy central tax
  M_LOCGAST_LE_SIALFHC:
    outcome: SUPPLY_IS_ALCOHOLIC_LIQUOR_FOR_HUMAN_CONSUMPTION
    expr: M_LOCGAST_A_SIALFHC
    module: M_LOCGAST
    description: The supply is a supply of alcoholic liquor for human consumption (Section 9(1), part of the law)
  M_LOCGAST_LE_TCAP:
    outcome: TAX_COLLECTED_AS_PRESCRIBED
    expr: M_LOCGAST_A_TCAP
    module: M_LOCGAST
    description: The tax is collected in such manner as may be prescribed (Section 9(1), part of the law)
  M_LOCGAST_LE_TPPT:
    outcome: TAXABLE_PERSON_PAYS_TAX
    expr: M_LOCGAST_A_TPPT
    module: M_LOCGAST
    description: The tax is paid by the taxable person (Section 9(1), part of the law)
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_LOCTOPP_PD_CTL:
    statement: All levy conditions are met, so central tax is levied under this provision
  M_LOCTOPP_PD_LNAH:
    statement: A levy condition is not met, so this provision does not levy central tax
  M_LOCGAST_PD_SIALFHC:
    statement: The supply is a supply of alcoholic liquor for human consumption
  M_LOCGAST_PD_TCAP:
    statement: The tax is collected in such manner as may be prescribed
  M_LOCGAST_PD_TPPT:
    statement: The tax is paid by the taxable person
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_ISO
  - M_IOSFC_LE_ISIO
  - M_SIAWC_LE_SAIS
  produces:
  - product: M_SIAFOS_PD_ISO
    from:
    - M_SIAFOS_LE_ISO
  - product: M_IOSFC_PD_ISIO
    from:
    - M_IOSFC_LE_ISIO
  - product: M_SIAWC_PD_SAIS
    from:
    - M_SIAWC_LE_SAIS
- id: C_LOCTOPP
  question: 'Section 9(2): Levy Of Central Tax On Petroleum Products?'
  includes:
  - M_LOCTOPP_LE_CTL
  - M_LOCTOPP_LE_LNAH
  produces:
  - product: M_LOCTOPP_PD_CTL
    from:
    - M_LOCTOPP_LE_CTL
  - product: M_LOCTOPP_PD_LNAH
    from:
    - M_LOCTOPP_LE_LNAH
  exclusive:
  - M_LOCTOPP_LE_CTL
  - M_LOCTOPP_LE_LNAH
- id: C_LOCGAST
  question: The supply is a supply of alcoholic liquor for human consumption; The tax is collected in such manner as may be
    prescribed; The tax is paid by the taxable person? (Section 9(1))
  includes:
  - M_LOCGAST_LE_SIALFHC
  - M_LOCGAST_LE_TCAP
  - M_LOCGAST_LE_TPPT
  produces:
  - product: M_LOCGAST_PD_SIALFHC
    from:
    - M_LOCGAST_LE_SIALFHC
  - product: M_LOCGAST_PD_TCAP
    from:
    - M_LOCGAST_LE_TCAP
  - product: M_LOCGAST_PD_TPPT
    from:
    - M_LOCGAST_LE_TPPT
time:
  law_date: F_DOI
