# GOVERNANCE MASTER TSG01_01 Supply with consideration (TG01 Supply & Taxability)
# LAW ARC - 36 laws - status NEEDS_REVIEW
name: TSG01_01 Supply with consideration - GOVERNANCE MASTER rulebook
version: TSG01_01
facts:
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_TRANSACTION_IS_NOTIFIED_S7_3_B:
    name: Transaction is notified under Section 7(3)(b) as a supply of services
    type: BOOLEAN
    tier: T1
  F_M_NTTAG_1:
    name: Transaction is specified in a notification under Section 7(3)(a) to be treated as a supply of goods
    type: BOOLEAN
    tier: T1
  F_PERSON_MAKES_TAXABLE_SUPPLY:
    name: Person makes a taxable supply of goods or services or both
    type: BOOLEAN
    tier: T1
  F_PERSON_ACTS_ON_BEHALF_OF_OTHER:
    name: Person makes the supply on behalf of another person (the principal)
    type: BOOLEAN
    tier: T1
  F_PRINCIPAL_IS_TAXABLE_PERSON:
    name: The principal on whose behalf the supply is made is a taxable person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_NATURE:
    name: Nature of the supply as goods, services or both
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SUPPLY_EXEMPTION_STATUS:
    name: Exemption status of the goods or services or both supplied by the person
    type: CODE
    options:
    - NOT_EXEMPT
    - PARTLY_EXEMPT
    - WHOLLY_EXEMPT
    tier: T1
  F_PERSON_SUPPLIES_TAXABLE_GOODS:
    name: Person is engaged in the supply of taxable goods
    type: BOOLEAN
    tier: T0
  F_SUPPLY_AGREED_OBLIGATION_TYPE:
    name: Type of agreed obligation
    type: CODE
    options:
    - REFRAIN_FROM_ACT
    - TOLERATE_ACT_OR_SITUATION
    - DO_ACT
    - NONE
    tier: T1
  F_IP_TEMPORARY_TRANSFER:
    name: Activity is a temporary transfer of an intellectual property right
    type: BOOLEAN
    tier: T1
  F_IP_USE_OR_ENJOYMENT_PERMITTED:
    name: Activity permits use or enjoyment of an intellectual property right
    type: BOOLEAN
    tier: T1
  F_IP_RIGHT_IS_INTELLECTUAL_PROPERTY:
    name: Right involved is an intellectual property right
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_SERVICE:
    name: The supply is a supply of services
    type: BOOLEAN
    tier: T1
  F_LAND_INTEREST_TYPE:
    name: Type of interest granted over land
    type: CODE
    options:
    - EASEMENT
    - LEASE
    - LICENCE_TO_OCCUPY
    - OTHER
    - TENANCY
    tier: T1
  F_TRANSACTION_IS_LAND_SALE:
    name: Transaction is a sale of land
    type: BOOLEAN
    tier: T0
  F_PROPERTY_BUILDING_TYPE:
    name: Type of building leased or let out
    type: CODE
    options:
    - COMMERCIAL_COMPLEX
    - INDUSTRIAL_COMPLEX
    - RESIDENTIAL_COMPLEX
    - OTHER_BUILDING
    - NOT_BUILDING
    tier: T1
  F_PROPERTY_BUSINESS_USE_EXTENT:
    name: Extent of business or commerce use of the leased or let building
    type: CODE
    options:
    - WHOLLY
    - PARTLY
    - NONE
    tier: T1
  F_SOFTWARE_ACTIVITY_TYPE:
    name: Type of software activity supplied
    type: CODE
    options:
    - DEVELOPMENT
    - DESIGN
    - PROGRAMMING
    - CUSTOMISATION
    - ADAPTATION
    - UPGRADATION
    - ENHANCEMENT
    - IMPLEMENTATION
    - OTHER
    tier: T1
  F_SUPPLY_PERTAINS_TO_IT_SOFTWARE:
    name: Supply pertains to information technology software
    type: BOOLEAN
    tier: T1
  F_GOODS_TITLE_TRANSFERRED:
    name: Title in the goods has been transferred
    type: BOOLEAN
    tier: T1
  F_GOODS_INTEREST_TRANSFER_TYPE:
    name: Type of interest transferred in goods
    type: CODE
    options:
    - RIGHT_IN_GOODS
    - UNDIVIDED_SHARE_IN_GOODS
    - NONE
    tier: T1
  F_AGREEMENT_PROPERTY_PASSES_FUTURE:
    name: Agreement stipulates property in goods shall pass at a future date
    type: BOOLEAN
    tier: T1
  F_FULL_CONSIDERATION_PAID_AS_AGREED:
    name: Full consideration has been paid as agreed
    type: BOOLEAN
    tier: T1
  F_GOODS_RIGHT_TO_USE_TRANSFERRED:
    name: Right to use goods is transferred
    type: BOOLEAN
    tier: T1
  F_SUPPLY_CONSIDERATION_TYPE:
    name: Form of consideration for the transfer
    type: CODE
    options:
    - CASH
    - DEFERRED_PAYMENT
    - NONE
    - OTHER_VALUABLE
    - OTHER_VALUABLE_CONSIDERATION
    tier: T1
  F_SUPPLIER_LEGAL_FORM:
    name: Legal form of the supplier as unincorporated association or body of persons
    type: CODE
    options:
    - UNINCORPORATED_ASSOCIATION
    - BODY_OF_PERSONS
    - OTHER
    tier: T0
  F_RECIPIENT_IS_MEMBER_OF_SUPPLIER:
    name: Recipient is a member of the supplying association or body
    type: BOOLEAN
    tier: T1
  F_CONSIDERATION_IN_CASH:
    name: Supply or service is for cash
    type: BOOLEAN
    tier: T1
  F_CONSIDERATION_DEFERRED_PAYMENT:
    name: Supply or service is for deferred payment
    type: BOOLEAN
    tier: T1
  F_CONSIDERATION_OTHER_VALUABLE:
    name: Supply or service is for other valuable consideration
    type: BOOLEAN
    tier: T1
  F_PROPERTY_CONSTRUCTED_DESCRIPTION:
    name: Description of the property or work for which the service is supplied
    type: TEXT
    tier: T1
  F_PROPERTY_INTENDED_FOR_SALE:
    name: Whether the complex or building is intended for sale to a buyer
    type: CODE
    options:
    - WHOLLY
    - PARTLY
    - NONE
    tier: T1
  F_COMPLETION_CERTIFICATE_REQUIRED:
    name: Whether a completion certificate is required by the competent authority
    type: BOOLEAN
    tier: T1
  F_CONSIDERATION_RECEIVED_AFTER_CC:
    name: Entire consideration was received after the date of issuance of the completion certificate
    type: BOOLEAN
    tier: T0
  F_CONSIDERATION_RECEIVED_AFTER_OCCUPATION:
    name: Entire consideration was received after the date of first occupation
    type: BOOLEAN
    tier: T0
  F_AUTHORITY_IS_GOVERNMENT:
    name: Authority is the Government
    type: BOOLEAN
    tier: T1
  F_AUTHORITY_CC_AUTHORISED:
    name: Authority is authorised under a law in force to issue completion certificate
    type: BOOLEAN
    tier: T1
  F_ARCHITECT_REGISTERED_COA:
    name: Person is an architect registered with the Council of Architecture
    type: BOOLEAN
    tier: T0
  F_PERSON_IS_CHARTERED_ENGINEER_IEI:
    name: Person is a chartered engineer registered with the Institution of Engineers (India)
    type: BOOLEAN
    tier: T0
  F_SURVEYOR_LICENSED_LOCAL_BODY:
    name: Person is a licensed surveyor of the respective local body of the city or town or village or development or planning
      authority
    type: BOOLEAN
    tier: T1
  F_CONSTRUCTION_ACTIVITY_TYPE:
    name: Type of construction activity
    type: CODE
    options:
    - ADDITION
    - ALTERATION
    - REPLACEMENT
    - REMODELLING
    - OTHER
    tier: T1
  F_STRUCTURE_IS_CIVIL:
    name: Structure is a civil structure
    type: BOOLEAN
    tier: T1
  F_STRUCTURE_IS_EXISTING:
    name: Structure is an existing structure
    type: BOOLEAN
    tier: T1
  F_ACTIVITY_DESCRIPTION:
    name: Description of the supplier's business activity
    type: TEXT
    tier: T1
  F_PAYMENT_RELATES_TO_SUPPLY:
    name: Payment relates to a supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_HAS_CONSIDERATION:
    name: Supply is made for a consideration
    type: BOOLEAN
    tier: T1
  F_GOODS_IS_BUSINESS_ASSET:
    name: Goods form part of the assets of a business
    type: BOOLEAN
    tier: T0
  F_GOODS_TRANSFERRED:
    name: Business asset goods were transferred
    type: BOOLEAN
    tier: T0
  F_GOODS_DISPOSED_OF:
    name: Business asset goods were disposed of
    type: BOOLEAN
    tier: T0
  F_EVENT_DIRECTED_BY_BUSINESS_PERSON:
    name: Transfer or disposal was made by or under the directions of the person carrying on the business
    type: BOOLEAN
    tier: T1
  F_GOODS_NO_LONGER_BUSINESS_ASSET:
    name: Goods no longer form part of the business assets after the event
    type: BOOLEAN
    tier: T0
  F_PERSON_CARRIES_ON_BUSINESS:
    name: Person carries on a business
    type: BOOLEAN
    tier: T0
  F_GOODS_USE_DIRECTED_BY_BUSINESS_PERSON:
    name: Usage or making available is by or under the direction of the business person
    type: BOOLEAN
    tier: T1
  F_GOODS_HELD_OR_USED_FOR_BUSINESS:
    name: Goods are held or used for the purposes of the business
    type: BOOLEAN
    tier: T0
  F_GOODS_PUT_TO_PRIVATE_USE:
    name: Goods are put to any private use
    type: BOOLEAN
    tier: T1
  F_GOODS_USED_FOR_NON_BUSINESS_PURPOSE:
    name: Goods are used for a purpose other than a purpose of the business
    type: BOOLEAN
    tier: T1
  F_GOODS_MADE_AVAILABLE_FOR_NON_BUSINESS_USE:
    name: Goods are made available to any person for use for a purpose other than a purpose of the business
    type: BOOLEAN
    tier: T1
  F_PERSON_CEASES_TAXABLE_STATUS:
    name: Person has ceased to be a taxable person
    type: BOOLEAN
    tier: T0
  F_GOODS_FORM_BUSINESS_ASSET:
    name: Goods form part of the assets of a business carried on by the person
    type: BOOLEAN
    tier: T0
  F_BUSINESS_TRANSFERRED_AS_GOING_CONCERN:
    name: Business transferred as a going concern to another person
    type: BOOLEAN
    tier: T1
  F_BUSINESS_CARRIED_ON_BY_PERSONAL_REPRESENTATIVE:
    name: Business is carried on by a personal representative
    type: BOOLEAN
    tier: T1
  F_PERSONAL_REPRESENTATIVE_DEEMED_TAXABLE:
    name: Personal representative carrying on the business is deemed to be a taxable person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_COMPOSITE:
    name: Supply is a composite supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_WORKS_CONTRACT:
    name: Composite supply is a works contract as defined in clause (119) of section 2
    type: BOOLEAN
    tier: T1
  F_CONSTRUCTION_APPLICATION_CONTEXT:
    name: Clause of Section 17(5) for which the expression construction is being applied
    type: CODE
    options:
    - CLAUSE_C
    - CLAUSE_D
    - OTHER
    tier: T1
  F_WORK_KIND:
    name: Kind of work done to the immovable property
    type: CODE
    options:
    - RECONSTRUCTION
    - RENOVATION
    - ADDITION
    - ALTERATION
    - REPAIR
    - OTHER
    tier: T1
  F_WORK_DESCRIPTION:
    name: Description of the work done to the immovable property
    type: TEXT
    tier: T1
  F_WORK_CAPITALISED_AMOUNT:
    name: Amount of expenditure on the work that is capitalised
    type: AMOUNT
    tier: T1
  F_WORK_ON_SAID_IMMOVABLE_PROPERTY:
    name: Work is done to the immovable property referred to in clauses (c) and (d)
    type: BOOLEAN
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_GOVERNMENT_AUTHORITY:
    statement: The competent authority is the Government
    order: LOW
    rule: F_AUTHORITY_IS_GOVERNMENT = TRUE
  A_AUTHORISED_AUTHORITY:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the authority authorised under a law for the time being in force to issue the completion certificate?
    grounding:
    - F_AUTHORITY_CC_AUTHORISED
  A_CC_NOT_REQUIRED:
    statement: A completion certificate is not required from such authority
    order: LOW
    rule: F_COMPLETION_CERTIFICATE_REQUIRED = FALSE
  A_REGISTERED_ARCHITECT:
    statement: The competent authority is an architect registered with the Council of Architecture constituted under the Architects
      Act, 1972
    order: LOW
    rule: F_ARCHITECT_REGISTERED_COA = TRUE
  A_CA_IS_GOVERNMENT:
    statement: The Government is the competent authority
    order: LOW
    rule: F_AUTHORITY_IS_GOVERNMENT = TRUE
  A_CA_IS_AUTH_CC:
    statement: Any authority authorised to issue completion certificate under any law for the time being in force is the competent
      authority
    order: LOW
    rule: F_AUTHORITY_CC_AUTHORISED = TRUE
  A_CA_CC_NOT_REQUIRED:
    statement: In case of non-requirement of such certificate from such authority, the completion certificate is not required
      from such authority
    order: LOW
    rule: F_COMPLETION_CERTIFICATE_REQUIRED = FALSE
  A_CA_IS_CHARTERED_ENGINEER:
    statement: Under the closed list namely the competent authority is a chartered engineer registered with the Institution
      of Engineers (India)
    order: LOW
    rule: F_PERSON_IS_CHARTERED_ENGINEER_IEI = TRUE
  A_GOVERNMENT:
    statement: For the purposes of this clause, the expression competent authority means the Government
    order: LOW
    rule: F_AUTHORITY_IS_GOVERNMENT = TRUE
  A_CC_AUTHORITY:
    statement: For the purposes of this clause, the expression competent authority means any authority authorised to issue
      completion certificate under any law for the time being in force
    order: LOW
    rule: F_AUTHORITY_CC_AUTHORISED = TRUE
  A_CC_NOT_REQUIRED_CASD:
    statement: In case of non-requirement of such certificate from such authority (the Government or authority authorised
      to issue completion certificate)
    order: LOW
    rule: F_COMPLETION_CERTIFICATE_REQUIRED = FALSE
  A_LICENSED_SURVEYOR:
    statement: For the purposes of this clause, the expression competent authority means, from any of the following, namely,
      a licensed surveyor of the respective local body of the city or town or village or development or planning authority
    order: LOW
    rule: F_SURVEYOR_LICENSED_LOCAL_BODY = TRUE
  A_CONSTRUCTION_ADDITION:
    statement: The expression "construction" includes additions to any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'ADDITION' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_ALTERATION:
    statement: The expression "construction" includes alterations to any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'ALTERATION' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_REPLACEMENT:
    statement: The expression "construction" includes replacements of any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'REPLACEMENT' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_REMODELLING:
    statement: The expression "construction" includes remodelling of any existing civil structure.
    order: LOW
    rule: F_CONSTRUCTION_ACTIVITY_TYPE = 'REMODELLING' AND F_STRUCTURE_IS_CIVIL = TRUE AND F_STRUCTURE_IS_EXISTING = TRUE
  A_CONSTRUCTION_OTHER:
    statement: The expression "construction" includes other activities of a similar nature to additions, alterations, replacements
      or remodelling of any existing civil structure.
    order: HIGH
    interpretation: Is the activity of a similar nature to additions, alterations, replacements or remodelling of an existing
      civil structure?
    grounding:
    - F_CONSTRUCTION_ACTIVITY_TYPE
    - F_STRUCTURE_IS_CIVIL
    - F_STRUCTURE_IS_EXISTING
    - F_ACTIVITY_DESCRIPTION
  A_CONTEXT:
    statement: The expression 'construction' is being applied for the purposes of clauses (c) and (d) of Section 17(5)
    order: LOW
    rule: F_CONSTRUCTION_APPLICATION_CONTEXT IN ['CLAUSE_C', 'CLAUSE_D']
  A_RECON:
    statement: The work done to the said immovable property is re-construction
    order: LOW
    rule: F_WORK_KIND = 'RECONSTRUCTION'
  A_RENOV:
    statement: The work done to the said immovable property is renovation
    order: LOW
    rule: F_WORK_KIND = 'RENOVATION'
  A_ADDITION:
    statement: The work done to the said immovable property is an addition
    order: LOW
    rule: F_WORK_KIND = 'ADDITION'
  A_ALTERATION:
    statement: The work done to the said immovable property is an alteration
    order: LOW
    rule: F_WORK_KIND = 'ALTERATION'
  A_REPAIRS:
    statement: The work done to the said immovable property is repairs
    order: LOW
    rule: F_WORK_KIND = 'REPAIR'
  A_OTHER_CONS:
    statement: The work is construction in the ordinary sense or other work not listed that falls within the expression 'construction',
      since 'includes' does not limit the expression to the listed works
    order: HIGH
    interpretation: Is the work construction in its ordinary sense or of the same kind as the listed works, so that it is
      within the expression construction by virtue of the open word includes?
    grounding:
    - F_WORK_KIND
    - F_WORK_DESCRIPTION
  A_CAPITALISED:
    statement: The listed work is included in 'construction' to the extent of capitalisation
    order: LOW
    rule: F_WORK_CAPITALISED_AMOUNT > 0
  A_IMMOV:
    statement: The work is done to the said immovable property
    order: LOW
    rule: F_WORK_ON_SAID_IMMOVABLE_PROPERTY = TRUE
  A_M_NTTAS_01:
    statement: The transaction is specified in a notification issued by the Government to be treated as a supply of services
      and not as a supply of goods.
    order: LOW
    rule: F_TRANSACTION_IS_NOTIFIED_S7_3_B = TRUE
  A_M_NTTAG_1:
    statement: A transaction is specified by notification, issued by the Government on the recommendation of the Council,
      to be treated as a supply of goods and not as a supply of services.
    order: LOW
    rule: F_M_NTTAG_1 = TRUE
  A_SUPPLY_TRAINING_TAXABLE:
    statement: The supply of imparting training on flying aircraft is a taxable supply.
    order: HIGH
    interpretation: Based on the supply details, is the supply of imparting training on flying the aircraft a taxable supply
      under GST law?
    grounding:
    - F_SUPPLY_DESCRIPTION
  A_MAKES_TAXABLE_SUPPLY:
    statement: The person makes a taxable supply of goods or services or both.
    order: LOW
    rule: F_PERSON_MAKES_TAXABLE_SUPPLY = TRUE
  A_ACTS_FOR_TAXABLE_PRINCIPAL:
    statement: The person makes the supply on behalf of one or more other taxable persons, whether as an agent or otherwise.
    order: HIGH
    interpretation: Does the person make supplies on behalf of one or more other persons (principals) who are themselves 'taxable
      persons', where the person is acting as an agent or in a similar capacity?
    grounding:
    - F_PERSON_ACTS_ON_BEHALF_OF_OTHER
    - F_PRINCIPAL_IS_TAXABLE_PERSON
  A_RPTITI_02:
    statement: The supply consists of taxable services
    order: LOW
    rule: F_SUPPLY_NATURE = 'SERVICES' AND F_SUPPLY_EXEMPTION_STATUS != 'WHOLLY_EXEMPT'
  A_PRE_TAXABLE_GOODS:
    statement: The supply is of taxable goods
    order: LOW
    rule: F_PERSON_SUPPLIES_TAXABLE_GOODS = TRUE
  A_ITFGNM_02:
    statement: The supply is of taxable goods
    order: LOW
    rule: F_PERSON_SUPPLIES_TAXABLE_GOODS = TRUE
  A_BUSINESS_SUPPLY:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_REFRAIN_OBLIGATION:
    statement: The activity is agreeing to the obligation to refrain from an act.
    order: LOW
    if_false: F_SUPPLY_AGREED_OBLIGATION_TYPE is NONE or another listed type
    rule: F_SUPPLY_AGREED_OBLIGATION_TYPE = 'REFRAIN_FROM_ACT'
  A_TOLERATE_OBLIGATION:
    statement: The activity is agreeing to the obligation to tolerate an act or a situation.
    order: LOW
    if_false: F_SUPPLY_AGREED_OBLIGATION_TYPE is NONE or another listed type
    rule: F_SUPPLY_AGREED_OBLIGATION_TYPE = 'TOLERATE_ACT_OR_SITUATION'
  A_ACT_OBLIGATION:
    statement: The activity is agreeing to the obligation to do an act.
    order: LOW
    if_false: F_SUPPLY_AGREED_OBLIGATION_TYPE is NONE or another listed type
    rule: F_SUPPLY_AGREED_OBLIGATION_TYPE = 'DO_ACT'
  A_IP_TEMP_TRANSFER:
    statement: The activity is a temporary transfer of an intellectual property right
    order: LOW
    rule: F_IP_TEMPORARY_TRANSFER = TRUE
  A_IP_USE_PERMISSION:
    statement: The activity permits the use or enjoyment of an intellectual property right
    order: LOW
    rule: F_IP_USE_OR_ENJOYMENT_PERMITTED = TRUE
  A_IP_RIGHT_SCOPE:
    statement: The right involved is any intellectual property right and is not limited to a named category
    order: LOW
    rule: F_IP_RIGHT_IS_INTELLECTUAL_PROPERTY = TRUE
  A_DEEMED_SERVICE_TREATMENT:
    statement: The qualifying IP activity is treated as a supply of services under this paragraph
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_SW_DEVELOPMENT:
    statement: The activity is development of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'DEVELOPMENT' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_SW_DESIGN:
    statement: The activity is design of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'DESIGN' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_SW_PROGRAMMING:
    statement: The activity is programming of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'PROGRAMMING' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_SW_CUSTOMISATION:
    statement: The activity is customisation of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'CUSTOMISATION' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_SW_ADAPTATION:
    statement: The activity is adaptation of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'ADAPTATION' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_SW_UPGRADATION:
    statement: The activity is upgradation of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'UPGRADATION' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_SW_ENHANCEMENT:
    statement: The activity is enhancement of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'ENHANCEMENT' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_SW_IMPLEMENTATION:
    statement: The activity is implementation of information technology software.
    order: LOW
    rule: F_SOFTWARE_ACTIVITY_TYPE = 'IMPLEMENTATION' AND F_SUPPLY_PERTAINS_TO_IT_SOFTWARE = TRUE
  A_RIGHT_USE_TRANSFER:
    statement: There is a transfer of the right to use any goods for any purpose, whether or not for a specified period
    order: LOW
    rule: F_GOODS_RIGHT_TO_USE_TRANSFERRED = TRUE
  A_RIGHT_USE_CONSIDERATION:
    statement: The transfer of the right to use goods is made for cash, deferred payment or other valuable consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_TYPE IN ['CASH','DEFERRED_PAYMENT','OTHER_VALUABLE']
  A_CONSTRUCTION_COMPLEX:
    statement: The activity is the construction of a complex
    order: HIGH
    interpretation: Does the described work amount to construction of a complex?
    grounding:
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
  A_CONSTRUCTION_BUILDING:
    statement: The activity is the construction of a building
    order: HIGH
    interpretation: Does the described work amount to construction of a building?
    grounding:
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
  A_CONSTRUCTION_CIVIL_STRUCTURE:
    statement: The activity is the construction of a civil structure
    order: HIGH
    interpretation: Does the described work amount to construction of a civil structure?
    grounding:
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
  A_CONSTRUCTION_PART:
    statement: The activity is the construction of a part of a complex, building or civil structure
    order: HIGH
    interpretation: Does the described work amount to construction of a part of a complex, building or civil structure?
    grounding:
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
  A_CONSTRUCTION_SALE_INTENDED:
    statement: The activity is the construction of a complex or building that is intended for sale to a buyer, wholly or partly
    order: HIGH
    interpretation: Is the work construction of a complex or building which is intended for sale to a buyer, wholly or partly
      (F_PROPERTY_INTENDED_FOR_SALE is WHOLLY or PARTLY)?
    grounding:
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
    - F_PROPERTY_INTENDED_FOR_SALE
  A_RECEIPT_AFTER_CC:
    statement: Where a completion certificate is required by the competent authority, the entire consideration has been received
      after issuance of that completion certificate
    order: LOW
    rule: F_COMPLETION_CERTIFICATE_REQUIRED = TRUE AND F_CONSIDERATION_RECEIVED_AFTER_CC = TRUE
  A_RECEIPT_AFTER_OCCUPATION:
    statement: The entire consideration has been received after the first occupation of the complex, building, civil structure
      or part thereof
    order: LOW
    rule: F_CONSIDERATION_RECEIVED_AFTER_OCCUPATION = TRUE
  A_LEASE_INTEREST:
    statement: The transaction is a lease of land
    order: LOW
    rule: F_LAND_INTEREST_TYPE = 'LEASE'
  A_TENANCY_INTEREST:
    statement: The transaction is a tenancy of land
    order: LOW
    rule: F_LAND_INTEREST_TYPE = 'TENANCY'
  A_EASEMENT_INTEREST:
    statement: The transaction is an easement of land
    order: LOW
    rule: F_LAND_INTEREST_TYPE = 'EASEMENT'
  A_LICENCE_TO_OCCUPY:
    statement: The transaction is a licence to occupy land
    order: LOW
    rule: F_LAND_INTEREST_TYPE = 'LICENCE_TO_OCCUPY'
  A_BLOLS_LEASE:
    statement: The transaction is a lease of the building
    order: LOW
    rule: F_LAND_INTEREST_TYPE = 'LEASE'
  A_BLOLS_LETTING:
    statement: The transaction is a letting out of the building
    order: HIGH
    interpretation: Does the arrangement amount to a letting out of the building, for example a tenancy or a licence to occupy,
      as opposed to a lease, easement or other interest? The source does not define letting out
    grounding:
    - F_LAND_INTEREST_TYPE
  A_BLOLS_BUILDING:
    statement: The property leased or let out is the building, including a commercial, industrial or residential complex
    order: LOW
    rule: F_PROPERTY_BUILDING_TYPE IN ['COMMERCIAL_COMPLEX', 'INDUSTRIAL_COMPLEX', 'RESIDENTIAL_COMPLEX', 'OTHER_BUILDING']
  A_BLOLS_BUSINESS_USE:
    statement: The lease or letting out of the building is for business or commerce, either wholly or partly
    order: LOW
    rule: F_PROPERTY_BUSINESS_USE_EXTENT IN ['WHOLLY', 'PARTLY']
  A_TITLE_TRANSFER:
    statement: Any transfer of the title in goods occurred
    order: LOW
    rule: F_GOODS_TITLE_TRANSFERRED = TRUE
  A_RIGHT_IN_GOODS:
    statement: There is a transfer of right in goods.
    order: LOW
    rule: F_GOODS_INTEREST_TRANSFER_TYPE = 'RIGHT_IN_GOODS'
  A_UNDIVIDED_SHARE:
    statement: There is a transfer of undivided share in goods.
    order: LOW
    rule: F_GOODS_INTEREST_TRANSFER_TYPE = 'UNDIVIDED_SHARE_IN_GOODS'
  A_NO_TITLE_TRANSFER:
    statement: The transfer of right or undivided share in goods is made without the transfer of title thereof.
    order: LOW
    rule: F_GOODS_TITLE_TRANSFERRED = FALSE
  A_TITLE_TRANSFER_TOTUFPA:
    statement: There is a transfer of title in goods.
    order: LOW
    rule: F_GOODS_TITLE_TRANSFERRED = TRUE
  A_FUTURE_PASSING_AGREEMENT:
    statement: The transfer of title is made under an agreement which stipulates that property in goods shall pass at a future
      date.
    order: LOW
    rule: F_AGREEMENT_PROPERTY_PASSES_FUTURE = TRUE
  A_FULL_PAYMENT_CONDITION:
    statement: The agreed passing of property in goods is upon payment of full consideration as agreed.
    order: LOW
    rule: F_FULL_CONSIDERATION_PAID_AS_AGREED = TRUE
  A_SUPPLIER_UNINCORPORATED:
    statement: The supplier is an unincorporated association or a body of persons.
    order: LOW
    rule: F_SUPPLIER_LEGAL_FORM IN ['UNINCORPORATED_ASSOCIATION','BODY_OF_PERSONS']
  A_SUPPLY_IS_GOODS:
    statement: The supply made by the association or body of persons is a supply of goods.
    order: LOW
    rule: F_SUPPLY_NATURE = 'GOODS'
  A_RECIPIENT_MEMBER:
    statement: The supply is made to a member thereof, meaning a member of the same unincorporated association or body of
      persons that supplies the goods.
    order: LOW
    rule: F_RECIPIENT_IS_MEMBER_OF_SUPPLIER = TRUE
  A_CONSIDERATION_CASH:
    statement: The supply is made for cash consideration.
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_TYPE = 'CASH'
  A_CONSIDERATION_DEFERRED:
    statement: The supply is made for deferred payment consideration.
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_TYPE = 'DEFERRED_PAYMENT'
  A_CONSIDERATION_OTHER_VALUABLE:
    statement: The supply is made for other valuable consideration, other than cash or deferred payment.
    order: HIGH
    interpretation: Is the benefit given for the supply other valuable consideration in the sense of this paragraph? The source
      gives no further definition. Do not decide by analogy. If unclear, return UNKNOWN.
    grounding:
    - F_SUPPLY_CONSIDERATION_TYPE
  A_CONSIDERATION_CASH_FADSAS:
    statement: Such supply or service is for cash
    order: LOW
    rule: F_CONSIDERATION_IN_CASH = TRUE
  A_CONSIDERATION_DEFERRED_FADSAS:
    statement: Such supply or service is for deferred payment
    order: LOW
    rule: F_CONSIDERATION_DEFERRED_PAYMENT = TRUE
  A_CONSIDERATION_OTHER_VALUABLE_FADSAS:
    statement: Such supply or service is for other valuable consideration
    order: LOW
    rule: F_CONSIDERATION_OTHER_VALUABLE = TRUE
  A_COMPOSITE_SUPPLY:
    statement: The supply is a composite supply of the kind listed in this paragraph
    order: LOW
    rule: F_SUPPLY_IS_COMPOSITE = TRUE
  A_WORKS_CONTRACT:
    statement: The composite supply is a works contract as defined in clause (119) of section 2
    order: HIGH
    interpretation: Does the composite supply meet the definition of works contract in clause (119) of section 2, which is
      not reproduced in this paragraph
    grounding:
    - F_SUPPLY_IS_WORKS_CONTRACT
    - F_PROPERTY_CONSTRUCTED_DESCRIPTION
  A_PAYMENT_FOR_SUPPLY:
    statement: The advance payment is with respect to any supply of goods or services or both
    order: LOW
    rule: F_PAYMENT_RELATES_TO_SUPPLY = TRUE
  A_CONSIDERATION_SUPPLY:
    statement: The supply is made for a consideration.
    order: LOW
    rule: F_SUPPLY_HAS_CONSIDERATION = TRUE
  A_BUSINESS_ASSET_GOODS:
    statement: Goods forming part of the assets of a business
    order: HIGH
    interpretation: Are the goods forming part of the assets of a business on the facts?
    grounding:
    - F_GOODS_IS_BUSINESS_ASSET
  A_TRANSFERRED:
    statement: The business asset goods are transferred
    order: LOW
    rule: F_GOODS_TRANSFERRED = TRUE
  A_DISPOSED:
    statement: The business asset goods are disposed of
    order: LOW
    rule: F_GOODS_DISPOSED_OF = TRUE
  A_BY_BUSINESS_PERSON:
    statement: The transfer or disposal is made by or under the directions of the person carrying on the business
    order: LOW
    rule: F_EVENT_DIRECTED_BY_BUSINESS_PERSON = TRUE
  A_NO_LONGER_ASSET:
    statement: The transfer or disposal is such that the goods no longer form part of those assets
    order: HIGH
    interpretation: Does the transfer or disposal take the goods out of the business assets so that they no longer form part
      of those assets?
    grounding:
    - F_GOODS_NO_LONGER_BUSINESS_ASSET
  A_PUOBG_PERSON:
    statement: The putting to private use, use, or making available of the goods is by or under the direction of a person
      carrying on a business
    order: HIGH
    interpretation: Is the usage or making available done by a person carrying on a business, or under the direction of such
      a person?
    grounding:
    - F_PERSON_CARRIES_ON_BUSINESS
    - F_GOODS_USE_DIRECTED_BY_BUSINESS_PERSON
  A_PUOBG_GOODS:
    statement: The goods are held or used for the purposes of the business
    order: LOW
    rule: F_GOODS_HELD_OR_USED_FOR_BUSINESS = TRUE
  A_PUOBG_PRIVATE_USE:
    statement: The goods held or used for the purposes of the business are put to any private use
    order: LOW
    rule: F_GOODS_PUT_TO_PRIVATE_USE = TRUE
  A_PUOBG_NON_BUSINESS_USE:
    statement: The goods held or used for the purposes of the business are used for any purpose other than a purpose of the
      business
    order: HIGH
    interpretation: Is the purpose for which the goods are used a purpose other than a purpose of the business?
    grounding:
    - F_GOODS_USED_FOR_NON_BUSINESS_PURPOSE
  A_PUOBG_MADE_AVAILABLE:
    statement: The goods held or used for the purposes of the business are made available to any person for use for any purpose
      other than a purpose of the business
    order: HIGH
    interpretation: Are the goods made available to any person for use for a purpose other than a purpose of the business?
    grounding:
    - F_GOODS_MADE_AVAILABLE_FOR_NON_BUSINESS_USE
  A_TAXABLE_PERSON_CEASES:
    statement: Any person ceases to be a taxable person
    order: LOW
    rule: F_PERSON_CEASES_TAXABLE_STATUS = TRUE
  A_GOODS_BUSINESS_ASSET:
    statement: Any goods form part of the assets of any business carried on by that person
    order: LOW
    rule: F_GOODS_FORM_BUSINESS_ASSET = TRUE
  A_GOING_CONCERN_TRANSFER:
    statement: The business is transferred as a going concern to another person
    order: HIGH
    interpretation: Is the business transferred as a going concern to another person so that the unless exception applies?
    grounding:
    - F_BUSINESS_TRANSFERRED_AS_GOING_CONCERN
  A_BCOBPR_PR_CARRIES_ON:
    statement: The business is carried on by a personal representative
    order: LOW
    rule: F_BUSINESS_CARRIED_ON_BY_PERSONAL_REPRESENTATIVE = TRUE
  A_BCOBPR_PR_DEEMED_TAXABLE:
    statement: The personal representative who carries on the business is deemed to be a taxable person
    order: LOW
    rule: F_PERSONAL_REPRESENTATIVE_DEEMED_TAXABLE = TRUE
  A_BCOBPR_CESSATION:
    statement: Any person ceases to be a taxable person
    order: LOW
    rule: F_PERSON_CEASES_TAXABLE_STATUS = TRUE
  A_BCOBPR_ASSET_GOODS:
    statement: Any goods form part of the assets of any business carried on by that person
    order: LOW
    rule: F_GOODS_FORM_BUSINESS_ASSET = TRUE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_CA_ISSUER:
    name: Government or authorised authority
    logic: ANY
    members:
    - A_GOVERNMENT_AUTHORITY
    - A_AUTHORISED_AUTHORITY
    description: Either alternative of the first route is enough.
  G_ARCHITECT_ROUTE:
    name: Architect where no certificate required
    logic: ALL
    members:
    - A_CC_NOT_REQUIRED
    - A_REGISTERED_ARCHITECT
    description: Architect route applies only where a completion certificate is not required from such authority and the person
      is a registered architect.
  G_CA_DEFINITION_OPTIONS:
    name: Competent authority alternative routes
    logic: ANY
    members:
    - A_CA_IS_GOVERNMENT
    - A_CA_IS_AUTH_CC
    - G_CA_ENGINEER_CONDITION
    description: The word or joins the Government route, the authorised authority route and the engineer route
  G_CA_ENGINEER_CONDITION:
    name: Engineer fallback condition
    logic: ALL
    members:
    - A_CA_CC_NOT_REQUIRED
    - A_CA_IS_CHARTERED_ENGINEER
    description: The engineer route requires both non-requirement of the certificate from such authority and a chartered engineer
      from the listed category
  G_AUTHORITY_ROUTE:
    name: Government or authorised authority route
    logic: ANY
    members:
    - A_GOVERNMENT
    - A_CC_AUTHORITY
    description: Either the Government or any authority authorised under a law in force to issue completion certificate.
  G_SURVEYOR_ROUTE:
    name: Licensed surveyor route where certificate not required
    logic: ALL
    members:
    - A_CC_NOT_REQUIRED_CASD
    - A_LICENSED_SURVEYOR
    description: A licensed surveyor qualifies only where the completion certificate is not required from such authority.
  G_CONSTRUCTION_ACTIVITIES:
    name: Construction Activities Definition
    logic: ANY
    members:
    - A_CONSTRUCTION_ADDITION
    - A_CONSTRUCTION_ALTERATION
    - A_CONSTRUCTION_REPLACEMENT
    - A_CONSTRUCTION_REMODELLING
    - A_CONSTRUCTION_OTHER
    description: The expression 'construction' includes any of these activities.
  G_LISTED_KINDS:
    name: Listed kinds of work
    logic: ANY
    members:
    - A_RECON
    - A_RENOV
    - A_ADDITION
    - A_ALTERATION
    - A_REPAIRS
    description: Re-construction, renovation, additions, alterations and repairs are alternatives
  G_LISTED_WORKS:
    name: Listed work capitalised on the said immovable property
    logic: ALL
    members:
    - G_LISTED_KINDS
    - A_CAPITALISED
    - A_IMMOV
    description: A listed kind of work, to the extent of capitalisation, to the said immovable property
  G_CONSTRUCTION_CIRRR:
    name: Work within construction
    logic: ANY
    members:
    - G_LISTED_WORKS
    - A_OTHER_CONS
    description: Because the word includes is open-ended, the listed works are one route and other construction remains a
      separate route
  G_AGENT_CONDITIONS:
    name: Agent Conditions
    logic: ALL
    members:
    - A_MAKES_TAXABLE_SUPPLY
    - A_ACTS_FOR_TAXABLE_PRINCIPAL
    description: persons who make taxable supply of goods or services or both on behalf of other taxable persons whether as
      an agent or otherwise.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_AGREED_OBLIGATION_FORM:
    name: Agreed obligation form
    logic: ANY
    members:
    - A_REFRAIN_OBLIGATION
    - A_TOLERATE_OBLIGATION
    - A_ACT_OBLIGATION
    description: Any one listed form of agreed obligation suffices
  G_DEEMED_IP_SERVICE:
    name: Deemed IP service outcome
    logic: ALL
    members:
    - G_IP_ACTIVITY
    - A_DEEMED_SERVICE_TREATMENT
    description: The deeming outcome applies only when the qualifying IP activity is present
  G_IP_ACTIVITY:
    name: Qualifying IP activity
    logic: ALL
    members:
    - G_IP_FORMS
    - A_IP_RIGHT_SCOPE
    description: A named activity form and an intellectual property right scope are both required
  G_IP_FORMS:
    name: Named IP activity forms
    logic: ANY
    members:
    - A_IP_TEMP_TRANSFER
    - A_IP_USE_PERMISSION
    description: Closed list of the two named forms introduced by namely, either form suffices
  G_IT_SOFTWARE_ACTIVITY:
    name: IT software activities
    logic: ANY
    members:
    - A_SW_DEVELOPMENT
    - A_SW_DESIGN
    - A_SW_PROGRAMMING
    - A_SW_CUSTOMISATION
    - A_SW_ADAPTATION
    - A_SW_UPGRADATION
    - A_SW_ENHANCEMENT
    - A_SW_IMPLEMENTATION
    description: At least one listed activity applies to information technology software
  G_RIGHT_USE_TEST:
    name: Right use test
    logic: ALL
    members:
    - A_RIGHT_USE_TRANSFER
    - A_RIGHT_USE_CONSIDERATION
    description: The right-use transfer and the consideration must both hold
  G_CONSTRUCTION:
    name: Construction scope
    logic: ANY
    members:
    - A_CONSTRUCTION_COMPLEX
    - A_CONSTRUCTION_BUILDING
    - A_CONSTRUCTION_CIVIL_STRUCTURE
    - A_CONSTRUCTION_PART
    - A_CONSTRUCTION_SALE_INTENDED
    description: Construction of a complex, building, civil structure or a part thereof are alternative forms. The including
      clause is an inclusive illustration within the construction scope and not a restriction
  G_CONSIDERATION_EXCEPTION:
    name: Entire consideration received after earlier event
    logic: ANY
    members:
    - A_RECEIPT_AFTER_CC
    - A_RECEIPT_AFTER_OCCUPATION
    description: The entire consideration is received after the earlier of the completion certificate (where required) and
      first occupation, which is true if it is received after either event
  G_LAND_INTEREST_FORMS:
    name: Land interest forms covered by paragraph 2(a)
    logic: ANY
    members:
    - A_LEASE_INTEREST
    - A_TENANCY_INTEREST
    - A_EASEMENT_INTEREST
    - A_LICENCE_TO_OCCUPY
    description: Any one listed land interest satisfies the group
  G_BLOLS_FORM:
    name: Lease or letting out form
    logic: ANY
    members:
    - A_BLOLS_LEASE
    - A_BLOLS_LETTING
    description: Either a lease or a letting out of the building is sufficient
  G_TRANSFER_INTEREST:
    name: Transfer of goods interest
    logic: ANY
    members:
    - A_RIGHT_IN_GOODS
    - A_UNDIVIDED_SHARE
    description: Any transfer of a right in goods or of an undivided share in goods.
  G_TRANSFER_CONDITIONS:
    name: Transfer conditions
    logic: ALL
    members:
    - A_TITLE_TRANSFER_TOTUFPA
    - A_FUTURE_PASSING_AGREEMENT
    - A_FULL_PAYMENT_CONDITION
    description: Deeming applies only if title transfer, future passing agreement and full-payment passing all hold.
  G_ASTMTAG_CORE:
    name: Core deeming conditions
    logic: ALL
    members:
    - A_SUPPLIER_UNINCORPORATED
    - A_SUPPLY_IS_GOODS
    - A_RECIPIENT_MEMBER
    - G_ASTMTAG_CONSIDERATION
    description: Every operative condition of the deeming clause must be met.
  G_ASTMTAG_CONSIDERATION:
    name: Consideration form alternatives
    logic: ANY
    members:
    - A_CONSIDERATION_CASH
    - A_CONSIDERATION_DEFERRED
    - A_CONSIDERATION_OTHER_VALUABLE
    description: Any one of cash, deferred payment or other valuable consideration suffices.
  G_TRANSFER_OR_DISPOSAL:
    name: Transfer or disposal alternatives
    logic: ANY
    members:
    - A_TRANSFERRED
    - A_DISPOSED
    description: Either a transfer or a disposal of the goods satisfies this group.
  G_PUOBG_USE:
    name: Private or non-business use
    logic: ANY
    members:
    - A_PUOBG_PRIVATE_USE
    - A_PUOBG_NON_BUSINESS_USE
    - A_PUOBG_MADE_AVAILABLE
    description: At least one of the three alternative forms of private or non-business use applies.
  G_DEEMING_CONDITIONS:
    name: Cessation and business asset goods
    logic: ALL
    members:
    - A_TAXABLE_PERSON_CEASES
    - A_GOODS_BUSINESS_ASSET
    description: Both the cessation of taxable person status and goods forming part of business assets are required before
      the deeming applies
  G_BCOBPR_PR_EXCEPTION:
    name: Personal representative exception
    logic: ALL
    members:
    - A_BCOBPR_PR_CARRIES_ON
    - A_BCOBPR_PR_DEEMED_TAXABLE
    description: The exception applies only when the business is carried on by a personal representative AND that personal
      representative is deemed to be a taxable person
  A_RENTING_IMMOVABLE_PROPERTY:
    name: Any of the referred steps (A_RENTING_IMMOVABLE_PROPERTY)
    logic: ANY
    members:
    - PD_ASTMTAG
    - PD_BCOBPR_DEEMED
    - PD_BLOLS
    - PD_BTAGC_DEEMED
    - PD_CAED_IS_COMPETENT_AUTHORITY
    - PD_CASD
    - PD_CA_DEFINED
    - PD_CDI_CONSTRUCTION_DEFINITION
    - PD_CONSIDERATION_CASH
    - PD_CONSIDERATION_DEFERRED
    - PD_CONSIDERATION_OTHER_VALUABLE
    - PD_LITAS
    - PD_PUOBG_DEEMED_SERVICE
    - PD_TOBAIGS
    - PD_TOTISOG
    - PD_TOTUFPA
    - PD_TOUSIS
    - PD_WCAS_SERVICE
    description: TRUE when any step of the law this check refers to is TRUE
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_CA_DEFINED:
    outcome: COMPETENT_AUTHORITY_ESTABLISHED
    expr: G_CA_ISSUER OR G_ARCHITECT_ROUTE
    module: M_CAAD
    description: The person is the competent authority if it is the Government or an authority authorised under any law to
      issue the completion certificate, or if no such certificate is required from such authority and the person is a registered
      architect.
  LE_CAED_IS_COMPETENT_AUTHORITY:
    outcome: COMPETENT_AUTHORITY_DEFINITION
    expr: G_CA_DEFINITION_OPTIONS
    module: M_CAED
    description: Competent authority is met if the Government, an authorised authority, or the non-requirement plus chartered
      engineer route is met, failure of this definition does not by itself determine any transaction
  LE_CASD:
    outcome: COMPETENT_AUTHORITY_DEFINED
    expr: G_AUTHORITY_ROUTE OR G_SURVEYOR_ROUTE
    module: M_CASD
    description: A person or body is a competent authority for this clause if it is the Government or an authority authorised
      to issue completion certificate, or if no certificate is required from such authority and it is a licensed surveyor
      of the stated body.
  LE_CDI_CONSTRUCTION_DEFINITION:
    outcome: CONSTRUCTION_DEFINITION_MET
    expr: G_CONSTRUCTION_ACTIVITIES
    module: M_CDI
    description: For the purposes of this clause, the expression 'construction' is defined.
  LE_CIRRR:
    outcome: CONSTRUCTION_INCLUDES_WORK
    expr: A_CONTEXT AND G_CONSTRUCTION_CIRRR
    module: M_CIRRR
    description: The work falls within the expression construction when applied for clauses (c) and (d) and it is either a
      listed work that is capitalised and done to the said immovable property or another work that is construction. The list
      is open-ended.
  LE_M_NTTAS:
    outcome: DEEMED_AS_SERVICE_NOT_GOODS
    expr: A_M_NTTAS_01
    module: M_NTTAS
    description: The transaction is deemed to be a supply of services and not a supply of goods if it is specified in a relevant
      notification.
  LE_M_NTTAG:
    outcome: TRANSACTION_TREATED_AS_SUPPLY_OF_GOODS
    expr: A_M_NTTAG_1
    module: M_NTTAG
  LE_SUPPLY_TRAINING_TAXABLE:
    outcome: SUPPLY_TRAINING_TAXABLE
    expr: A_SUPPLY_TRAINING_TAXABLE
    module: M_VACFT
    description: The supply of imparting training on flying aircraft is a taxable supply. (Section 17(5)(aa)(i)(D), part of
      the law)
  LE_M_ROAMTS:
    outcome: COMPULSORY_REGISTRATION_REQUIRED
    expr: G_AGENT_CONDITIONS
    module: M_ROAMTS
    description: the following categories of persons shall be required to be registered under this Act,
  LE_RPTITI_02:
    outcome: RPTITI_02
    expr: A_RPTITI_02
    module: M_RPTITI
    description: The supply consists of taxable services (Section 31(2), part of the law)
  LE_PRE_TAXABLE_GOODS:
    outcome: PRE_TAXABLE_GOODS
    expr: A_PRE_TAXABLE_GOODS
    module: M_ITFGWM
    description: The supply is of taxable goods (Section 31(1), part of the law)
  LE_ITFGNM_02:
    outcome: ITFGNM_02
    expr: A_ITFGNM_02
    module: M_ITFGNM
    description: The supply is of taxable goods (Section 31(1), part of the law)
  LE_BUSINESS_SUPPLY:
    outcome: BUSINESS_SUPPLY
    expr: A_BUSINESS_SUPPLY
    module: M_SBRODP
    description: The supply is in the course or furtherance of business (Schedule I, paragraph 2, part of the law)
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: PD_BUSINESS_SUPPLY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_ATROTA:
    outcome: SUPPLY_OF_SERVICES_DEEMED
    expr: G_AGREED_OBLIGATION_FORM
    module: M_ATROTA
    description: The activity is treated as supply of services if it is agreeing to one of the listed obligations
  LE_IP_SERVICE:
    outcome: SUPPLY_OF_SERVICES_DEEMED
    expr: G_DEEMED_IP_SERVICE
    module: M_TTOIP
    description: The deemed supply of services follows only where the qualifying IP activity is present
  LE_DOISAS_DEEMED:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: G_IT_SOFTWARE_ACTIVITY
    module: M_DOISAS
    description: A listed information technology software activity is treated as a supply of services
  LE_TRTUG:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: G_RIGHT_USE_TEST
    module: M_TRTUG
    description: The following shall be treated as supply of services when both the right-use transfer test and the consideration
      test hold
  LE_COCAS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: G_CONSTRUCTION AND NOT G_CONSIDERATION_EXCEPTION
    module: M_COCAS
    description: The construction is treated as a supply of services unless the exception on timing of receipt of the entire
      consideration applies
  LE_COCAS_EXCEPTION:
    outcome: NOT_DEEMED_BY_PARA_5B
    expr: G_CONSTRUCTION AND G_CONSIDERATION_EXCEPTION
    module: M_COCAS
    description: The exception applies, so this paragraph does not treat the construction as a supply of services
  LE_LITAS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: G_LAND_INTEREST_FORMS
    module: M_LITAS
    description: If any one of the listed land interests is established, the transaction is deemed a supply of services under
      Schedule II paragraph 2(a)
  LE_BLOLS:
    outcome: SUPPLY_OF_SERVICES
    expr: G_BLOLS_FORM AND A_BLOLS_BUILDING AND A_BLOLS_BUSINESS_USE
    module: M_BLOLS
    description: A lease or letting out of a building for business or commerce, wholly or partly, is deemed a supply of services
  LE_TOTISOG:
    outcome: SUPPLY_OF_GOODS
    expr: A_TITLE_TRANSFER
    module: M_TOTISOG
    description: A transfer of the title in goods is deemed a supply of goods
  LE_TOUSIS:
    outcome: SUPPLY_OF_SERVICES
    expr: G_TRANSFER_INTEREST AND A_NO_TITLE_TRANSFER
    module: M_TOUSIS
    description: A transfer of a right in goods or of an undivided share in goods, made without the transfer of title thereof,
      is deemed a supply of services.
  LE_TOTUFPA:
    outcome: SUPPLY_OF_GOODS
    expr: G_TRANSFER_CONDITIONS
    module: M_TOTUFPA
    description: The transaction is a supply of goods only when all three transfer conditions hold.
  LE_ASTMTAG:
    outcome: SUPPLY_OF_GOODS_DEEMED
    expr: G_ASTMTAG_CORE
    module: M_ASTMTAG
    description: All core deeming conditions are met, so the activity is treated as a supply of goods.
  LE_CONSIDERATION_CASH:
    outcome: CONSIDERATION_CASH
    expr: A_CONSIDERATION_CASH_FADSAS
    module: M_FADSAS
    description: Such supply or service is for cash (Schedule II, paragraph 6, part of the law)
  LE_CONSIDERATION_DEFERRED:
    outcome: CONSIDERATION_DEFERRED
    expr: A_CONSIDERATION_DEFERRED_FADSAS
    module: M_FADSAS
    description: Such supply or service is for deferred payment (Schedule II, paragraph 6, part of the law)
  LE_CONSIDERATION_OTHER_VALUABLE:
    outcome: CONSIDERATION_OTHER_VALUABLE
    expr: A_CONSIDERATION_OTHER_VALUABLE_FADSAS
    module: M_FADSAS
    description: Such supply or service is for other valuable consideration (Schedule II, paragraph 6, part of the law)
  LE_WCAS_SERVICE:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: A_COMPOSITE_SUPPLY AND A_WORKS_CONTRACT
    module: M_WCAS
    description: A supply that is a composite supply and a works contract as defined in clause (119) of section 2 is treated
      as a supply of services
  LE_PAYMENT_FOR_SUPPLY:
    outcome: PAYMENT_FOR_SUPPLY
    expr: A_PAYMENT_FOR_SUPPLY
    module: M_RVFAP
    description: The advance payment is with respect to any supply of goods or services or both (Section 31(3), part of the
      law)
  LE_CONSIDERATION_SUPPLY:
    outcome: CONSIDERATION_SUPPLY
    expr: A_CONSIDERATION_SUPPLY
    module: M_TAIID
    description: The supply is made for a consideration. (Section 33, part of the law)
  LE_TOBAIGS:
    outcome: DEEMED_GOODS_SUPPLY_BY_PERSON
    expr: A_BUSINESS_ASSET_GOODS AND G_TRANSFER_OR_DISPOSAL AND A_BY_BUSINESS_PERSON AND A_NO_LONGER_ASSET
    module: M_TOBAIGS
    description: All four conditions must be TRUE for the deeming outcome.
  LE_PUOBG_DEEMED_SERVICE:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: A_PUOBG_PERSON AND A_PUOBG_GOODS AND G_PUOBG_USE
    module: M_PUOBG
    description: The usage or making available of the goods is deemed a supply of services when the goods are business goods,
      the act is by or under the direction of a business person, and at least one of the private or non-business use limbs
      applies.
  LE_BTAGC_DEEMED:
    outcome: DEEMED_SUPPLY_OF_GOODS_BY_PERSON_IN_COURSE_OR_FURTHERANCE_OF_BUSINESS_IMMEDIATELY_BEFORE_CESSATION
    expr: G_DEEMING_CONDITIONS AND NOT A_GOING_CONCERN_TRANSFER
    module: M_BTAGC
    description: The goods are deemed supplied by the person in the course or furtherance of his business immediately before
      he ceases to be a taxable person when he ceases to be a taxable person and the goods form part of the assets of his
      business and the business is not transferred as a going concern to another p
  LE_BCOBPR_DEEMED:
    outcome: DEEMED_SUPPLY_OF_BUSINESS_ASSET_GOODS_BY_PERSON_IN_COURSE_OR_FURTHERANCE_OF_BUSINESS_IMMEDIATELY_BEFORE_CESSATION
    expr: A_BCOBPR_CESSATION AND A_BCOBPR_ASSET_GOODS AND NOT G_BCOBPR_PR_EXCEPTION
    module: M_BCOBPR
    description: Deemed supply arises when the person ceases to be a taxable person and the goods form part of the business
      assets, unless the personal representative exception applies
  LE_RIPAS_OUTCOME:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: A_RENTING_IMMOVABLE_PROPERTY
    module: M_RIPAS
    description: The activity is treated as a supply of services when it is renting of immovable property
triggers:
  CT_LITAS:
    question: Is the arrangement a sale of land rather than a lease, tenancy, easement or licence to occupy land?
