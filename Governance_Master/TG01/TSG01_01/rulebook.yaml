  CT_ASTMTAG_OTHER_VALUABLE:
    question: Is the benefit given for the supply other valuable consideration in the sense of this paragraph?
    trigger: F_SUPPLY_CONSIDERATION_TYPE = 'OTHER_VALUABLE_CONSIDERATION'
    beside: LE_ASTMTAG
