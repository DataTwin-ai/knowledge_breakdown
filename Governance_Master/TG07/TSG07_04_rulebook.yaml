# GOVERNANCE MASTER TSG07_04 TDS (TG07 Reverse Charge, TDS, TCS)
# LAW ARC - 2 laws - status APPROVED
name: TSG07_04 TDS - GOVERNANCE MASTER rulebook
version: TSG07_04
facts:
  F_PTC:
    name: Person Tax Category
    type: CODE
    options:
    - COMPOSITION_S10
    - ISD
    - NON_RESIDENT
    - REGULAR
    - TCS_S52
    - TDS_S51
    - UNKNOWN
    tier: T0
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_FORBRP_A_PPTUS51:
    statement: The person is paying tax under the provisions of section 51 (an excluded category)
    order: LOW
    rule: F_PTC = 'TDS_S51'
    handler: python
groups: {}
outcomes:
  M_FORBRP_LE_PPTUS51:
    outcome: PERSON_PAYS_TAX_UNDER_SECTION_51
    expr: M_FORBRP_A_PPTUS51
    module: M_FORBRP
    description: The person is paying tax under the provisions of section 51 (an excluded category) (Section 39(1), part of
      the law)
  M_FORBRP_LE_PPTUS51_FOSD:
    outcome: PERSON_PAYS_TAX_UNDER_SECTION_51
    expr: M_FORBRP_A_PPTUS51
    module: M_FOSD
    description: The person is paying tax under the provisions of section 51 (an excluded category) (Section 37(1), part of
      the law)
products:
  M_FORBRP_PD_PPTUS51:
    statement: The person is paying tax under the provisions of section 51 (an excluded category)
  M_FORBRP_PD_PPTUS51_FOSD:
    statement: The person is paying tax under the provisions of section 51
compounds:
- id: C_FORBRP
  question: The person is paying tax under the provisions of section 51 (an excluded category)? (Section 39(1))
  includes:
  - M_FORBRP_LE_PPTUS51
  produces:
  - product: M_FORBRP_PD_PPTUS51
    from:
    - M_FORBRP_LE_PPTUS51
- id: C_FOSD
  question: The person is paying tax under the provisions of section 51 (an excluded category)? (Section 37(1))
  includes:
  - M_FORBRP_LE_PPTUS51_FOSD
  produces:
  - product: M_FORBRP_PD_PPTUS51_FOSD
    from:
    - M_FORBRP_LE_PPTUS51_FOSD
time:
  law_date: F_DOI
