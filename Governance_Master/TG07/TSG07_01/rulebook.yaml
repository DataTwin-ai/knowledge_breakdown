# GOVERNANCE MASTER TSG07_01 Reverse charge on notified supplies (TG07 Reverse Charge, TDS, TCS)
# LAW ARC - 24 laws - status NEEDS_REVIEW
name: TSG07_01 Reverse charge on notified supplies - GOVERNANCE MASTER rulebook
version: TSG07_01
facts:
  F_SUPPLY_IS_NOTIFIED_RCM_S9_3:
    name: Supply category is notified for RCM under Section 9(3)
    type: BOOLEAN
    tier: T1
  F_SUPPLY_REVERSE_CHARGE_STATUS:
    name: Whether tax on the supply is paid or liable to be paid on reverse charge basis
    type: CODE
    options:
    - LIABLE_NOT_YET_PAID
    - NOT_REVERSE_CHARGE
    - PAID
    tier: T0
  F_SUPPLY_IS_SERVICE:
    name: The supply is a supply of services
    type: BOOLEAN
    tier: T1
  F_SUPPLY_TAX_ON_REVERSE_CHARGE:
    name: Tax on the supply is paid or liable to be paid on reverse charge basis
    type: BOOLEAN
    tier: T0
  F_GOODS_RECEIPT_DATE:
    name: Date of the receipt of goods
    type: DATE
    tier: T0
  F_SUPPLY_TIME_AT_RECIPIENT_BOOKS_DATE:
    name: The time of supply of the goods falls on the date of entry of the supply in the books of account of the recipient
    type: BOOLEAN
    tier: T0
  F_PERSON_LIABLE_PAY_TAX_RCM:
    name: Person is required to pay tax under reverse charge
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_RCM:
    name: The supply is one on which tax is payable on reverse charge basis
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_IS_REGISTERED_ON_RECEIPT_DATE:
    name: The supplier was registered on the date of receipt of the supply
    type: BOOLEAN
    tier: T1
  F_TRANSACTION_DETAILS:
    name: Details of the transaction and related documents
    type: TEXT
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_REVISED_INVOICE_ISSUE_DATE:
    name: Issue date of the revised invoice
    type: DATE
    tier: T0
  F_REGISTRATION_CERTIFICATE_ISSUE_DATE:
    name: Date of issuance of the certificate of registration
    type: DATE
    tier: T0
  F_REVISED_INVOICE_MANNER_PRESCRIBED_FOLLOWED:
    name: The manner prescribed for issuing a revised invoice was followed
    type: BOOLEAN
    tier: T0
  F_ORIGINAL_INVOICE_ISSUE_DATE:
    name: Issue date of the original invoice being revised
    type: DATE
    tier: T0
  F_REGISTRATION_EFFECTIVE_DATE:
    name: Effective date of registration
    type: DATE
    tier: T0
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_VALUE:
    name: Value of the supply of goods or services or both
    type: AMOUNT
    tier: T1
  F_LOW_VALUE_INVOICE_RULES_FOLLOWED:
    name: Prescribed conditions and manner for not issuing a tax invoice for a low-value supply are followed
    type: BOOLEAN
    tier: T0
  F_DOCUMENT_TYPE:
    name: Type of document
    type: CODE
    options:
    - ASSESSMENT_DOCUMENT
    - BILL_OF_SUPPLY
    - CREDIT_NOTE
    - DEBIT_NOTE
    - DELIVERY_CHALLAN
    - OTHER
    - OTHER_LIKE_DOCUMENT
    - PAYMENT_VOUCHER
    - RECEIPT_VOUCHER
    - REFUND_VOUCHER
    - REVISED_INVOICE
    - SELF_INVOICE
    - SUPPLEMENTARY_INVOICE
    - TAX_INVOICE
    tier: T1
  F_TAX_INVOICE_IS_ISSUED:
    name: A tax invoice was issued for the supply
    type: BOOLEAN
    tier: T0
  F_BOS_LOW_VALUE_RULES_FOLLOWED:
    name: Conditions and manner prescribed for not issuing a bill of supply for a low-value supply are followed
    type: BOOLEAN
    tier: T0
  F_PAYMENT_IS_ADVANCE:
    name: Payment is an advance payment
    type: BOOLEAN
    tier: T1
  F_PAYMENT_RELATES_TO_SUPPLY:
    name: Payment relates to a supply
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_HAS_PRESCRIBED_PARTICULARS:
    name: Document contains prescribed particulars
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_EVIDENCES_PAYMENT:
    name: Document evidences receipt of payment
    type: BOOLEAN
    tier: T1
  F_ADVANCE_PAYMENT_RECEIVED_FOR_SUPPLY:
    name: An advance payment was received for a supply
    type: BOOLEAN
    tier: T1
  F_RECEIPT_VOUCHER_ISSUED_FOR_ADVANCE:
    name: A receipt voucher was issued for the advance payment
    type: BOOLEAN
    tier: T1
  F_SUPPLY_WAS_MADE:
    name: A supply was subsequently made
    type: BOOLEAN
    tier: T0
  F_SUPPLY_GOODS_TYPE:
    name: Type of goods supplied
    type: CODE
    options:
    - PETROLEUM_CRUDE
    - HIGH_SPEED_DIESEL
    - MOTOR_SPIRIT
    - NATURAL_GAS
    - AVIATION_TURBINE_FUEL
    - OTHER
    tier: T1
  F_PETRO_LEVY_EFFECTIVE_DATE:
    name: Notified effective date for levy on specified petroleum products
    type: DATE
    tier: T1
  F_PETRO_LEVY_NOTIFICATION_HAS_COUNCIL_RECOMMENDATION:
    name: Notification for levy on petroleum products states it is on Council's recommendation
    type: BOOLEAN
    tier: T1
  F_SUPPLY_DATE:
    name: Date of supply
    type: DATE
    tier: T1
  F_RECIPIENT_IS_REGISTERED:
    name: Recipient is a registered person
    type: BOOLEAN
    tier: T0
  F_RECIPIENT_IN_NOTIFIED_CLASS_S9_4:
    name: Recipient belongs to a class of persons specified in a notification under CGST Act s9(4)
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IN_NOTIFIED_CATEGORY_S9_4:
    name: Supply is of a category of goods/services specified in a notification under CGST Act s9(4)
    type: BOOLEAN
    tier: T1
  F_SERVICE_IS_NOTIFIED_ECO_LIABILITY:
    name: Service is in a category notified for Electronic Commerce Operator tax liability
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_INTRA_STATE:
    name: Supply is an intra-State supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_THROUGH_ECO:
    name: Supply is facilitated by an electronic commerce operator
    type: BOOLEAN
    tier: T1
  F_ECO_PHYSICAL_PRESENCE_IN_TERRITORY:
    name: Electronic commerce operator has a physical presence in the taxable territory
    type: BOOLEAN
    tier: T1
  F_ECO_HAS_REPRESENTATIVE_IN_TERRITORY:
    name: A person represents the electronic commerce operator in the taxable territory
    type: BOOLEAN
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_M_PTNRCS_1:
    statement: For a supply of a category specified by the Government by notification, the tax shall be paid on a reverse
      charge basis by the recipient of such goods or services or both.
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_M_PTNRCS_2:
    statement: For a supply of a category specified by the Government by notification, all the provisions of this Act shall
      apply to the recipient as if they are the person liable for paying the tax in relation to the supply of such goods or
      services or both.
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_RCM_SUPPLY:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_REVERSE_CHARGE_STATUS IN ['PAID','LIABLE_NOT_YET_PAID']
  A_RCM_SUPPLY_TOSRSD:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_REVERSE_CHARGE_STATUS IN ['PAID','LIABLE_NOT_YET_PAID']
  A_RCM_SERVICES:
    statement: The supply is a supply of services in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE AND F_SUPPLY_REVERSE_CHARGE_STATUS IN ['LIABLE_NOT_YET_PAID','PAID']
  A_RCM_SUPPLY_RTOSRD:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    if_false: Tax on the supply is neither paid nor liable to be paid on reverse charge basis
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_GOODS_RECEIPT_DATE:
    statement: The date of the receipt of goods is one of the dates of which the earliest shall be the time of supply for
      a reverse charge supply
    order: LOW
    rule: F_GOODS_RECEIPT_DATE IS_SET
  A_RCM:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_RCM_TOSGRCI:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
    order: LOW
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_BOOKS_DATE:
    statement: The time of supply shall be the date of entry in the books of account of the recipient of supply
    order: LOW
    rule: F_SUPPLY_TIME_AT_RECIPIENT_BOOKS_DATE = TRUE
  A_RCM_PAYER:
    statement: The person is required to pay tax under reverse charge.
    order: LOW
    rule: F_PERSON_LIABLE_PAY_TAX_RCM = TRUE
  A_RCM_SUPPLY_IRFNI180D:
    statement: The supply is one on which tax is payable on reverse charge basis.
    order: LOW
    rule: F_SUPPLY_IS_RCM = TRUE
  A_1:
    statement: The person is a registered person.
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_2:
    statement: The revised invoice is issued within one month from the date of issuance of the certificate of registration.
    order: HIGH
    interpretation: Was the revised invoice issued within one month from the date the registration certificate was issued?
    grounding:
    - F_REVISED_INVOICE_ISSUE_DATE
    - F_REGISTRATION_CERTIFICATE_ISSUE_DATE
  A_3:
    statement: The revised invoice is issued in the manner prescribed.
    order: HIGH
    interpretation: Was the revised invoice issued in the manner prescribed by the relevant Rules (e.g., CGST Rule 53)?
    grounding:
    - F_REVISED_INVOICE_MANNER_PRESCRIBED_FOLLOWED
  A_4:
    statement: The revised invoice is issued against an invoice already issued during the period beginning with the effective
      date of registration and ending with the date of issuance of the certificate of registration.
    order: HIGH
    interpretation: Was the original invoice issued in the period from the effective registration date up to the certificate
      issue date?
    grounding:
    - F_ORIGINAL_INVOICE_ISSUE_DATE
    - F_REGISTRATION_EFFECTIVE_DATE
    - F_REGISTRATION_CERTIFICATE_ISSUE_DATE
  A_M_NTIBTH_1:
    statement: The person making the supply is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_NTIBTH_2:
    statement: The value of the goods or services or both supplied is less than two hundred rupees
    order: LOW
    rule: F_SUPPLY_VALUE < 200
  A_M_NTIBTH_3:
    statement: The option to not issue a tax invoice is exercised subject to such conditions and in such manner as may be
      prescribed
    order: HIGH
    interpretation: Are the conditions and manner prescribed in the Rules for not issuing a tax invoice for a low-value supply
      followed?
    grounding:
    - F_LOW_VALUE_INVOICE_RULES_FOLLOWED
  A_SUPPLIER_IS_REGISTERED:
    statement: The person who received the payment is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_ADVANCE_PAYMENT_RECEIVED:
    statement: An advance payment is received
    order: LOW
    rule: F_PAYMENT_IS_ADVANCE = TRUE
  A_PAYMENT_FOR_SUPPLY:
    statement: The advance payment is with respect to any supply of goods or services or both
    order: LOW
    rule: F_PAYMENT_RELATES_TO_SUPPLY = TRUE
  A_RECEIPT_VOUCHER_ISSUED:
    statement: A receipt voucher is issued
    order: LOW
    rule: F_DOCUMENT_TYPE = 'RECEIPT_VOUCHER'
  A_OTHER_DOCUMENT_ISSUED:
    statement: Any other document evidencing receipt of payment is issued
    order: LOW
    rule: F_DOCUMENT_TYPE = 'OTHER_LIKE_DOCUMENT'
  A_DOCUMENT_HAS_PARTICULARS:
    statement: The issued document contains such particulars as may be prescribed
    order: HIGH
    interpretation: Does the issued document (receipt voucher or other) contain all particulars prescribed in the relevant
      CGST Rules for such a document?
    grounding:
    - F_DOCUMENT_HAS_PRESCRIBED_PARTICULARS
    - F_TRANSACTION_DETAILS
  A_DOCUMENT_EVIDENCES_PAYMENT:
    statement: The issued document evidences receipt of the payment
    order: LOW
    rule: F_DOCUMENT_EVIDENCES_PAYMENT = TRUE
  A_RVFNS_1:
    statement: The person who received the advance payment is a registered person.
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_RVFNS_2:
    statement: An advance payment was received with respect to a supply of goods or services or both.
    order: LOW
    rule: F_ADVANCE_PAYMENT_RECEIVED_FOR_SUPPLY = TRUE
  A_RVFNS_3:
    statement: A receipt voucher was issued for the advance payment.
    order: LOW
    rule: F_RECEIPT_VOUCHER_ISSUED_FOR_ADVANCE = TRUE
  A_RVFNS_4:
    statement: Subsequently, no supply is made.
    order: LOW
    rule: F_SUPPLY_WAS_MADE = FALSE
  A_RVFNS_5:
    statement: No tax invoice was issued in pursuance of the intended supply.
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = FALSE
  A_LIABLE_PERSON:
    statement: The person is liable to pay tax for such supply.
    order: HIGH
    interpretation: On the transaction details, is the person being tested (supplier, or recipient where tax is payable on
      reverse charge) the person liable to pay tax for this supply under the GST law?
    grounding:
    - F_TRANSACTION_DETAILS
  A_NBOSBTH_1:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_NBOSBTH_2:
    statement: The value of the goods or services or both supplied is less than two hundred rupees
    order: LOW
    rule: F_SUPPLY_VALUE < 200
  A_NBOSBTH_3:
    statement: The non-issuance of the bill of supply is subject to conditions and is done in a manner as may be prescribed
    order: HIGH
    interpretation: Are the conditions and manner prescribed in the Rules for not issuing a bill of supply for a low-value
      supply followed?
    grounding:
    - F_BOS_LOW_VALUE_RULES_FOLLOWED
  A_M_LOCTOPP_1:
    statement: The supply is of petroleum crude
    order: LOW
    rule: F_SUPPLY_GOODS_TYPE = 'PETROLEUM_CRUDE'
  A_M_LOCTOPP_2:
    statement: The supply is of high speed diesel
    order: LOW
    rule: F_SUPPLY_GOODS_TYPE = 'HIGH_SPEED_DIESEL'
  A_M_LOCTOPP_3:
    statement: The supply is of motor spirit (commonly known as petrol)
    order: LOW
    rule: F_SUPPLY_GOODS_TYPE = 'MOTOR_SPIRIT'
  A_M_LOCTOPP_4:
    statement: The supply is of natural gas
    order: LOW
    rule: F_SUPPLY_GOODS_TYPE = 'NATURAL_GAS'
  A_M_LOCTOPP_5:
    statement: The supply is of aviation turbine fuel
    order: LOW
    rule: F_SUPPLY_GOODS_TYPE = 'AVIATION_TURBINE_FUEL'
  A_M_LOCTOPP_6:
    statement: A date for the levy of central tax on the specified petroleum products has been notified by the Government
    order: LOW
    rule: F_PETRO_LEVY_EFFECTIVE_DATE IS_SET
  A_M_LOCTOPP_7:
    statement: The notification for the levy date was made on the recommendations of the Council
    order: LOW
    rule: F_PETRO_LEVY_NOTIFICATION_HAS_COUNCIL_RECOMMENDATION = TRUE
  A_M_LOCTOPP_8:
    statement: The supply takes place on or after the notified effective date
    order: HIGH
    interpretation: Does the date of supply occur on or after the notified effective date for the levy on specified petroleum
      products?
    grounding:
    - F_SUPPLY_DATE
    - F_PETRO_LEVY_EFFECTIVE_DATE
  A_M_PTNROUS_1:
    statement: The supply is received from an unregistered supplier
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = FALSE
  A_M_PTNROUS_2:
    statement: The recipient is a registered person
    order: LOW
    rule: F_RECIPIENT_IS_REGISTERED = TRUE
  A_M_PTNROUS_3:
    statement: The recipient belongs to a specified class of registered persons
    order: LOW
    rule: F_RECIPIENT_IN_NOTIFIED_CLASS_S9_4 = TRUE
  A_M_PTNROUS_4:
    statement: The supply is of specified categories of goods or services or both
    order: LOW
    rule: F_SUPPLY_IN_NOTIFIED_CATEGORY_S9_4 = TRUE
  A_SERVICE_NOTIFIED:
    statement: The supply is of a category of services specified by the Government by notification
    order: LOW
    rule: F_SERVICE_IS_NOTIFIED_ECO_LIABILITY = TRUE
  A_INTRA_STATE_SUPPLY:
    statement: The supply of services is an intra-State supply
    order: LOW
    rule: F_SUPPLY_IS_INTRA_STATE = TRUE
  A_SUPPLIED_THROUGH_ECO:
    statement: The services are supplied through an electronic commerce operator
    order: LOW
    rule: F_SUPPLY_IS_THROUGH_ECO = TRUE
  A_M_EORL_1:
    statement: The electronic commerce operator does not have a physical presence in the taxable territory
    order: LOW
    rule: F_ECO_PHYSICAL_PRESENCE_IN_TERRITORY = FALSE
  A_M_EORL_2:
    statement: A person represents the electronic commerce operator for any purpose in the taxable territory
    order: LOW
    rule: F_ECO_HAS_REPRESENTATIVE_IN_TERRITORY = TRUE
  A_RECIPIENT_IS_REGISTERED:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_SUPPLIER_IS_UNREGISTERED:
    statement: The supplier is not registered on the date of receipt of goods or services or both
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED_ON_RECEIPT_DATE = FALSE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_1:
    name: Conditions for issuing a revised invoice
    logic: ALL
    members:
    - A_1
    - A_2
    - A_3
    - A_4
  G_M_NTIBTH:
    name: Conditions for not issuing a tax invoice for low-value supply
    logic: ALL
    members:
    - A_M_NTIBTH_1
    - A_M_NTIBTH_2
    - A_M_NTIBTH_3
  G_CONDITIONS_RVFAP:
    name: Trigger Conditions
    logic: ALL
    members:
    - A_SUPPLIER_IS_REGISTERED
    - A_ADVANCE_PAYMENT_RECEIVED
    - A_PAYMENT_FOR_SUPPLY
    description: These are the conditions that trigger the obligation to issue a receipt voucher.
  G_FULFILLMENT:
    name: Fulfillment Actions
    logic: ALL
    members:
    - G_DOCUMENT_ISSUED
    - A_DOCUMENT_HAS_PARTICULARS
    - A_DOCUMENT_EVIDENCES_PAYMENT
    description: These are the actions required to fulfill the obligation once triggered.
  G_DOCUMENT_ISSUED:
    name: Document Issued
    logic: ANY
    members:
    - A_RECEIPT_VOUCHER_ISSUED
    - A_OTHER_DOCUMENT_ISSUED
    description: A receipt voucher or another equivalent document must be issued.
  G_M_LOCTOPP_GOODS:
    name: Supply is of a specified petroleum product
    logic: ANY
    members:
    - A_M_LOCTOPP_1
    - A_M_LOCTOPP_2
    - A_M_LOCTOPP_3
    - A_M_LOCTOPP_4
    - A_M_LOCTOPP_5
  G_M_LOCTOPP_CONDS:
    name: Conditions for levy are met
    logic: ALL
    members:
    - A_M_LOCTOPP_6
    - A_M_LOCTOPP_7
    - A_M_LOCTOPP_8
  G_M_PTNROUS_1:
    name: Conditions for RCM on supplies from unregistered persons
    logic: ALL
    members:
    - A_M_PTNROUS_1
    - A_M_PTNROUS_2
    - A_M_PTNROUS_3
    - A_M_PTNROUS_4
  G_CONDITIONS_EOTL:
    name: Conditions for ECO liability under Section 9(5)
    logic: ALL
    members:
    - A_SERVICE_NOTIFIED
    - A_INTRA_STATE_SUPPLY
    - A_SUPPLIED_THROUGH_ECO
    description: All conditions must be met for the ECO to be liable for tax payment and be deemed as the supplier.
  G_M_EORL:
    name: Conditions for representative's liability under S9(5) proviso
    logic: ALL
    members:
    - A_M_EORL_1
    - A_M_EORL_2
  A_LIABLE_UNDER_S9_3:
    name: Any of the referred steps (A_LIABLE_UNDER_S9_3)
    logic: ANY
    members:
    - PD_DEEMING
    - PD_M_EORL
    - PD_M_LOCTOPP
    - PD_M_NBOSBTH
    - PD_M_PTNRCS
    - PD_M_PTNROUS
    - PD_PAYMENT
    description: TRUE when any step of the law this check refers to is TRUE
  G_CONDITIONS:
    name: Conditions for obligation to issue self-invoice
    logic: ALL
    members:
    - A_RECIPIENT_IS_REGISTERED
    - G_RCM_LIABILITY
    - A_SUPPLIER_IS_UNREGISTERED
  G_RCM_LIABILITY:
    name: Recipient is liable to pay tax under RCM
    logic: ANY
    members:
    - A_LIABLE_UNDER_S9_3
    - PD_M_PTNROUS
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_M_PTNRCS:
    outcome: S9_3_RCM_CONSEQUENCES_APPLY
    expr: A_M_PTNRCS_1 AND A_M_PTNRCS_2
    module: M_PTNRCS
    description: If a supply is notified under this section, the recipient is liable to pay tax on RCM basis and is deemed
      the person liable for all Act provisions for that supply.
  LE_RCM_SUPPLY:
    outcome: RCM_SUPPLY
    expr: A_RCM_SUPPLY
    module: M_TOSRPD
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis (Section 13(3),
      part of the law)
  LE_RCM_SUPPLY_TOSRSD:
    outcome: RCM_SUPPLY
    expr: A_RCM_SUPPLY_TOSRSD
    module: M_TOSRSD
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis (Section 13(3),
      part of the law)
  LE_RCM_SERVICES:
    outcome: RCM_SERVICES
    expr: A_RCM_SERVICES
    module: M_RRTOS
    description: The supply is a supply of services in respect of which tax is paid or liable to be paid on reverse charge
      basis (First Proviso to Section 13(3), part of the law)
  LE_RTOSRD:
    outcome: RCM_GOODS_RECEIPT_DATE_IS_CANDIDATE_TIME_OF_SUPPLY
    expr: A_RCM_SUPPLY_RTOSRD AND A_GOODS_RECEIPT_DATE
    module: M_RTOSRD
    description: If tax on the supply is paid or liable to be paid on reverse charge basis, the date of the receipt of goods
      enters the earliest-of comparison for the time of supply under the parent subsection.
  LE_RCM:
    outcome: RCM
    expr: A_RCM
    module: M_RTOSPD
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis (Section 12(3),
      part of the law)
  LE_RCM_TOSGRCI:
    outcome: RCM
    expr: A_RCM_TOSGRCI
    module: M_TOSGRCI
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis. (Section
      12(3), part of the law)
  LE_BOOKS_DATE:
    outcome: BOOKS_DATE
    expr: A_BOOKS_DATE
    module: M_RRTOS
    description: The time of supply shall be the date of entry in the books of account of the recipient of supply (Section
      12(3), Proviso 1, part of the law)
  LE_M_RORCP:
    outcome: COMPULSORY_REGISTRATION_REQUIRED
    expr: A_RCM_PAYER
    module: M_RORCP
    description: Registration is compulsory if the person is required to pay tax under reverse charge.
  LE_RCM_SUPPLY_IRFNI180D:
    outcome: RCM_SUPPLY
    expr: A_RCM_SUPPLY_IRFNI180D
    module: M_IRFNI180D
    description: The supply is one on which tax is payable on reverse charge basis. (Second Proviso to Section 16(2), part
      of the law)
  LE_1:
    outcome: REVISED_INVOICE_MAY_BE_ISSUED
    expr: G_1
    module: M_RIAR
  LE_M_NTIBTH:
    outcome: TAX_INVOICE_NOT_MANDATORY
    expr: G_M_NTIBTH
    module: M_NTIBTH
    description: The option to not issue a tax invoice is available if all conditions are met.
  LE_RVFAP:
    outcome: COMPLIANCE_WITH_S31_3_D
    expr: (NOT G_CONDITIONS_RVFAP) OR G_FULFILLMENT
    module: M_RVFAP
    description: Compliance is met if the conditions for the obligation are not triggered, or if they are triggered and the
      obligation is fulfilled.
  LE_RVFNS:
    outcome: PERMISSION_TO_ISSUE_REFUND_VOUCHER
    expr: A_RVFNS_1 AND A_RVFNS_2 AND A_RVFNS_3 AND A_RVFNS_4 AND A_RVFNS_5
    module: M_RVFNS
  LE_LIABLE_PERSON:
    outcome: LIABLE_PERSON
    expr: A_LIABLE_PERSON
    module: M_TAIID
    description: The person is liable to pay tax for such supply. (Section 33, part of the law)
  LE_M_NBOSBTH:
    outcome: MAY_NOT_ISSUE_BILL_OF_SUPPLY
    expr: A_NBOSBTH_1 AND A_NBOSBTH_2 AND A_NBOSBTH_3
    module: M_NBOSBTH
  LE_M_LOCTOPP:
    outcome: CENTRAL_TAX_LEVIABLE
    expr: G_M_LOCTOPP_GOODS AND G_M_LOCTOPP_CONDS
    module: M_LOCTOPP
  LE_M_PTNROUS:
    outcome: RCM_S9_4_APPLICABLE
    expr: G_M_PTNROUS_1
    module: M_PTNROUS
    description: The conditions for applying reverse charge under a notification issued per Section 9(4) are met. The recipient
      is liable to pay the tax and is deemed the person liable for all provisions of the Act in relation to this supply.
  LE_PAYMENT:
    outcome: ECO_PAYS_TAX_U_S9_5
    expr: G_CONDITIONS_EOTL
    module: M_EOTL
    description: The electronic commerce operator is liable to pay the tax on the specified intra-State supply of services.
  LE_DEEMING:
    outcome: ECO_DEEMED_SUPPLIER_U_S9_5
    expr: G_CONDITIONS_EOTL
    module: M_EOTL
    description: The electronic commerce operator is treated as the supplier for all provisions of the Act in relation to
      the supply.
  LE_M_EORL:
    outcome: REPRESENTATIVE_LIABLE_TO_PAY_TAX
    expr: G_M_EORL
    module: M_EORL
  LE_IFRFUS:
    outcome: OBLIGATION_TO_ISSUE_INVOICE
    expr: G_CONDITIONS
    module: M_IFRFUS
