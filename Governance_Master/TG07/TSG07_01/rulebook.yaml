compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_PTNRCS
  question: 'Section 9(3): Power To Notify Reverse Charge Supplies?'
  includes:
  - LE_M_PTNRCS
  produces:
  - product: PD_M_PTNRCS
    from:
    - LE_M_PTNRCS
- id: C_S13_SS3
  question: 'Section 13(3): which clause applies?'
  includes:
  - LE_RCM_SUPPLY
  - LE_RCM_SUPPLY_TOSRSD
  produces:
  - product: PD_RCM_SUPPLY
    from:
    - LE_RCM_SUPPLY
  - product: PD_RCM_SUPPLY_TOSRSD
    from:
    - LE_RCM_SUPPLY_TOSRSD
- id: C_RRTOS
  question: The supply is a supply of services in respect of which tax is paid or liable to be paid on reverse charge basis?
    (First Proviso to Section 13(3))
  includes:
  - LE_RCM_SERVICES
  produces:
  - product: PD_RCM_SERVICES
    from:
    - LE_RCM_SERVICES
- id: C_S12_SS3
  question: 'Section 12(3): which clause applies?'
  includes:
  - LE_RTOSRD
  - LE_RCM
  - LE_RCM_TOSGRCI
  produces:
  - product: PD_RTOSRD
    from:
    - LE_RTOSRD
  - product: PD_RCM
    from:
    - LE_RCM
  - product: PD_RCM_TOSGRCI
    from:
    - LE_RCM_TOSGRCI
- id: C_RRTOS_RRTOS
  question: The time of supply shall be the date of entry in the books of account of the recipient of supply? (Section 12(3),
    Proviso 1)
  includes:
  - LE_BOOKS_DATE
  produces:
  - product: PD_BOOKS_DATE
    from:
    - LE_BOOKS_DATE
- id: C_RORCP
  question: 'Section 24(iii): Registration Of Reverse Charge Persons?'
  includes:
  - LE_M_RORCP
  produces:
  - product: PD_M_RORCP
    from:
    - LE_M_RORCP
- id: C_IRFNI180D
  question: The supply is one on which tax is payable on reverse charge basis? (Second Proviso to Section 16(2))
  includes:
  - LE_RCM_SUPPLY_IRFNI180D
  produces:
  - product: PD_RCM_SUPPLY_IRFNI180D
    from:
    - LE_RCM_SUPPLY_IRFNI180D
- id: C_TAIID
  question: The person is liable to pay tax for such supply? (Section 33)
  includes:
  - LE_LIABLE_PERSON
  produces:
  - product: PD_LIABLE_PERSON
    from:
    - LE_LIABLE_PERSON
- id: C_NBOSBTH
  question: 'Section 31(3)(c) Proviso: No Bill Of Supply Below Two Hundred?'
  includes:
  - LE_M_NBOSBTH
  produces:
  - product: PD_M_NBOSBTH
    from:
    - LE_M_NBOSBTH
- id: C_LOCTOPP
  question: 'Section 9(2): Levy Of Central Tax On Petroleum Products?'
  includes:
  - LE_M_LOCTOPP
  produces:
  - product: PD_M_LOCTOPP
    from:
    - LE_M_LOCTOPP
- id: C_PTNROUS
  question: 'Section 9(4): Power To Notify RCM On Unregistered Supplies?'
  includes:
  - LE_M_PTNROUS
  produces:
  - product: PD_M_PTNROUS
    from:
    - LE_M_PTNROUS
- id: C_EOTL
  question: 'Section 9(5): E-commerce Operator Tax Liability?'
  includes:
  - LE_PAYMENT
  - LE_DEEMING
  produces:
  - product: PD_PAYMENT
    from:
    - LE_PAYMENT
  - product: PD_DEEMING
    from:
    - LE_DEEMING
- id: C_EORL
  question: 'Section 9(5), first proviso: E-commerce Operator Representative Liability?'
  includes:
  - LE_M_EORL
  produces:
  - product: PD_M_EORL
    from:
    - LE_M_EORL
- id: C_S31_SS3
  question: 'Section 31(3): which clause applies?'
  includes:
  - LE_1
  - LE_M_NTIBTH
  - LE_RVFAP
  - LE_RVFNS
  - LE_IFRFUS
  produces:
  - product: PD_1
    from:
    - LE_1
  - product: PD_M_NTIBTH
    from:
    - LE_M_NTIBTH
  - product: PD_RVFAP
    from:
    - LE_RVFAP
  - product: PD_RVFNS
    from:
    - LE_RVFNS
  - product: PD_IFRFUS
    from:
    - LE_IFRFUS
