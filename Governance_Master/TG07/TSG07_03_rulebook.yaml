# GOVERNANCE MASTER TSG07_03 E-commerce operator liability (TG07 Reverse Charge, TDS, TCS)
# LAW ARC - 5 laws - status NEEDS_REVIEW
name: TSG07_03 E-commerce operator liability - GOVERNANCE MASTER rulebook
version: TSG07_03
facts:
  F_EPPIT:
    name: ECO Physical Presence In Territory
    type: BOOLEAN
    tier: T0
  F_EHRIT:
    name: ECO Has Representative In Territory
    type: BOOLEAN
    tier: T1
  F_EAPFT:
    name: ECO Appointed Person For Tax
    type: BOOLEAN
    tier: T0
  F_NOCR:
    name: Notification On Council Recommendation
    type: BOOLEAN
    tier: T1
  F_NAET:
    name: Notified Activity Entry Text
    type: TEXT
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_SOSL:
    name: State Of Supplier Location
    type: TEXT
    tier: T1
  F_SOPOS:
    name: State Of Place Of Supply
    type: TEXT
    tier: T1
  F_STECO:
    name: Supply Through Electronic Commerce Operator
    type: BOOLEAN
    tier: T1
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_EOAPFT_A_EDNHPP:
    statement: An electronic commerce operator does not have a physical presence in the taxable territory
    order: LOW
    rule: F_EPPIT = FALSE
    handler: python
  M_EOAPFT_A_EDNHR:
    statement: The electronic commerce operator does not have a representative in the said territory
    order: LOW
    rule: F_EHRIT = FALSE
    handler: python
  M_EOAPFT_A_ESATP:
    statement: Such electronic commerce operator shall appoint a person in the taxable territory for the purpose of paying
      tax
    order: HIGH
    interpretation: Does the operator, lacking both a physical presence and a representative in the taxable territory, come
      under a mandatory duty to appoint a person in that territory for paying tax?
    grounding:
    - F_EAPFT
    handler: heavy
  M_EOAPFT_A_APSBL:
    statement: Such person shall be liable to pay tax
    order: HIGH
    interpretation: Is the person appointed by the electronic commerce operator under this proviso liable to pay tax?
    grounding:
    - F_EAPFT
    handler: heavy
  M_ECOPNST_A_NOCR:
    statement: The Government issued the notification on the recommendations of the Council
    order: LOW
    rule: F_NOCR = TRUE
    handler: python
  M_ECOPNST_A_SWNC:
    statement: The services supplied fall within a category of services specified by the Government by notification under
      this provision
    order: HIGH
    interpretation: Does the described service fall within a category of services specified in the notification entry, and
      is the notification one issued under this provision?
    grounding:
    - F_NAET
    - F_DOS
    handler: heavy
  M_ECOPNST_A_SIIS:
    statement: The supply of the services is an intra-State supply
    order: HIGH
    interpretation: On the supplier's State and the State of the place of supply, is this supply of services an intra-State
      supply as the Act's own provisions determine?
    grounding:
    - F_SOSL
    - F_SOPOS
    handler: heavy
  M_ECOPNST_A_SSTO:
    statement: The notified services are supplied through an electronic commerce operator
    order: HIGH
    interpretation: Was the service supplied through an electronic commerce operator, according to the platform order record
      and the invoice?
    grounding:
    - F_STECO
    handler: light
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_EOAPFT_G_NPANR:
    name: No Presence And No Representative
    logic: ALL
    members:
    - M_EOAPFT_A_EDNHPP
    - M_EOAPFT_A_EDNHR
    description: Both absences are cumulative under the words and also
  M_ECOPNST_G_VNOSC:
    name: Valid Notification Of Service Category
    logic: ALL
    members:
    - M_ECOPNST_A_NOCR
    - M_ECOPNST_A_SWNC
    description: The category of services must be specified by notification issued on the Council's recommendation, and the
      supplied service must fall within that category.
  M_ECOPNST_G_ISSTE:
    name: Intra State Supply Through ECO
    logic: ALL
    members:
    - M_ECOPNST_A_SIIS
    - M_ECOPNST_A_SSTO
    description: The supply must be intra-State and the services must be supplied through the electronic commerce operator.
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_EOAPFT_LE_OMAP:
    outcome: ECO_MUST_APPOINT_PAYER
    expr: M_EOAPFT_G_NPANR AND M_EOAPFT_A_ESATP
    module: M_EOAPFT
    description: The appointment duty arises only when both absence conditions hold and the operator comes under the mandatory
      appointment duty
  M_EOAPFT_LE_APLFT:
    outcome: APPOINTED_PERSON_LIABLE
    expr: M_EOAPFT_G_NPANR AND M_EOAPFT_A_APSBL
    module: M_EOAPFT
    description: Liability of the appointed person arises only when both absence conditions hold and the appointed person
      is liable to pay tax under this proviso
  M_ECOPNST_LE_EPNST:
    outcome: ECO_PAYS_TAX_AS_DEEMED_SUPPLIER
    expr: M_ECOPNST_G_VNOSC AND M_ECOPNST_G_ISSTE
    module: M_ECOPNST
    description: 'When a notification issued on the Council''s recommendation specifies the category of services and the intra-State
      supply of those services is made through an electronic commerce operator, the tax is paid by the operator and all provisions
      of this Act apply to him as if he is the supplier liable for '
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_EOAPFT_PD_OMAP:
    statement: The appointment duty arises only when both absence conditions hold and the operator comes under the mandatory
      appointment duty
  M_EOAPFT_PD_APLFT:
    statement: Liability of the appointed person arises only when both absence conditions hold and the appointed person is
      liable to pay tax under this proviso
  M_ECOPNST_PD_EPNST:
    statement: 'When a notification issued on the Council''s recommendation specifies the category of services and the intra-State
      supply of those services is made through an electronic commerce operator, the tax is paid by the operator and all provisions
      of this Act apply to him as if he is the supplier liable for '
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_ISO
  - M_IOSFC_LE_ISIO
  - M_SIAWC_LE_SAIS
  produces:
  - product: M_SIAFOS_PD_ISO
    from:
    - M_SIAFOS_LE_ISO
  - product: M_IOSFC_PD_ISIO
    from:
    - M_IOSFC_LE_ISIO
  - product: M_SIAWC_PD_SAIS
    from:
    - M_SIAWC_LE_SAIS
- id: C_EOAPFT
  question: 'Section 9(5), further proviso: E-commerce Operator Appoints Person For Tax?'
  includes:
  - M_EOAPFT_LE_OMAP
  - M_EOAPFT_LE_APLFT
  produces:
  - product: M_EOAPFT_PD_OMAP
    from:
    - M_EOAPFT_LE_OMAP
  - product: M_EOAPFT_PD_APLFT
    from:
    - M_EOAPFT_LE_APLFT
- id: C_ECOPNST
  question: 'Section 9(5): Electronic Commerce Operator Pays Notified Services Tax?'
  includes:
  - M_ECOPNST_LE_EPNST
  produces:
  - product: M_ECOPNST_PD_EPNST
    from:
    - M_ECOPNST_LE_EPNST
time:
  law_date: F_DOI
