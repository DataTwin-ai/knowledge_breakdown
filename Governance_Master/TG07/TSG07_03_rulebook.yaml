# GOVERNANCE MASTER TSG07_03 E-commerce operator liability (TG07 Reverse Charge, TDS, TCS)
# LAW ARC - 5 laws - status NEEDS_REVIEW
name: TSG07_03 E-commerce operator liability - GOVERNANCE MASTER rulebook
version: TSG07_03
facts:
  F_PECOS:
    name: Person Electronic Commerce Operator Status
    type: BOOLEAN
    tier: T0
  F_EPPIT:
    name: ECO Physical Presence In Territory
    type: BOOLEAN
    tier: T0
  F_EHRIT:
    name: ECO Has Representative In Territory
    type: BOOLEAN
    tier: T1
  F_EAPFT:
    name: ECO Appointed Person For Tax
    type: BOOLEAN
    tier: T0
  F_SIK:
    name: Supply Item Kind
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    - UNKNOWN
    tier: T1
  F_TLIN:
    name: Transaction Listed In Notification
    type: BOOLEAN
    tier: T1
  F_NOCR2:
    name: Notification On Council Recommendation
    type: BOOLEAN
    tier: T1
  F_SISS:
    name: Supply Intra State Status
    type: CODE
    options:
    - INTER_STATE
    - INTRA_STATE
    - UNKNOWN
    tier: T1
  F_STECO:
    name: Supply Through Electronic Commerce Operator
    type: BOOLEAN
    tier: T0
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_EOAPFT_A_PIECO:
    statement: The person is an electronic commerce operator
    order: HIGH
    interpretation: Does the person fall within the meaning of electronic commerce operator under the Act?
    grounding:
    - F_PECOS
    handler: heavy
  M_EOAPFT_A_OHNPP:
    statement: The electronic commerce operator does not have a physical presence in the taxable territory
    order: LOW
    rule: F_EPPIT = FALSE
    handler: python
  M_EOAPFT_A_OHNR:
    statement: The electronic commerce operator does not have a representative in the said territory, being the taxable territory
    order: LOW
    rule: F_EHRIT = FALSE
    handler: python
  M_EOAPFT_A_OATP:
    statement: The electronic commerce operator shall appoint a person in the taxable territory for the purpose of paying
      tax
    order: LOW
    rule: F_EAPFT = TRUE
    handler: python
  M_EOAPFT_A_APLTP:
    statement: Such person, appointed for paying tax, shall be liable to pay tax
    order: HIGH
    interpretation: Is the person appointed under this proviso liable to pay the tax under this proviso?
    grounding:
    - F_EAPFT
    handler: light
  M_ECOPNST_A_SIOS:
    statement: The supply is a supply of services.
    order: LOW
    rule: F_SIK IN ['SERVICES','BOTH']
    handler: python
  M_ECOPNST_A_SCSBN:
    statement: The services supplied fall within a category of services specified by the Government by notification.
    order: LOW
    rule: F_TLIN = TRUE
    handler: python
  M_ECOPNST_A_NOCR:
    statement: The notification specifying the category of services was issued on the recommendations of the Council.
    order: LOW
    rule: F_NOCR2 = TRUE
    handler: python
  M_ECOPNST_A_SIIS:
    statement: The supply of such services is an intra-State supply.
    order: LOW
    rule: F_SISS = 'INTRA_STATE'
    handler: python
  M_ECOPNST_A_SSTO:
    statement: The notified services are supplied through the electronic commerce operator.
    order: LOW
    rule: F_STECO = TRUE
    handler: python
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_EOAPFT_G_NPANR:
    name: No Presence And No Representative
    logic: ALL
    members:
    - M_EOAPFT_A_OHNPP
    - M_EOAPFT_A_OHNR
    description: Both absences must hold together, joined by also.
  M_ECOPNST_G_NCC:
    name: Notified Category Conditions
    logic: ALL
    members:
    - M_ECOPNST_A_SIOS
    - M_ECOPNST_A_SCSBN
    - M_ECOPNST_A_NOCR
    description: The supply is of services in a category specified by a notification issued on the Council's recommendation.
  M_ECOPNST_G_OSC:
    name: Operator Supply Conditions
    logic: ALL
    members:
    - M_ECOPNST_A_SIIS
    - M_ECOPNST_A_SSTO
    description: The supply is intra-State and the services are supplied through the electronic commerce operator.
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_EOAPFT_LE_AOA:
    outcome: APPOINTMENT_REQUIRED
    expr: M_EOAPFT_A_PIECO AND M_EOAPFT_G_NPANR
    module: M_EOAPFT
    description: The proviso conditions are met, so the appointment obligation applies.
  M_EOAPFT_LE_AMUP:
    outcome: APPOINTMENT_MADE
    expr: M_EOAPFT_A_PIECO AND M_EOAPFT_G_NPANR AND M_EOAPFT_A_OATP
    module: M_EOAPFT
    description: The operator has appointed a tax paying person under the proviso.
  M_EOAPFT_LE_APLA:
    outcome: APPOINTED_PERSON_LIABLE
    expr: M_EOAPFT_A_PIECO AND M_EOAPFT_G_NPANR AND M_EOAPFT_A_OATP AND M_EOAPFT_A_APLTP
    module: M_EOAPFT
    description: The appointed person is liable to pay tax under the proviso.
  M_ECOPNST_LE_EPTONS:
    outcome: ECO_PAYS_TAX
    expr: M_ECOPNST_G_NCC AND M_ECOPNST_G_OSC
    module: M_ECOPNST
    description: The tax on the intra-State supply of the notified service shall be paid by the electronic commerce operator.
  M_ECOPNST_LE_ETALS:
    outcome: ECO_DEEMED_SUPPLIER
    expr: M_ECOPNST_G_NCC AND M_ECOPNST_G_OSC
    module: M_ECOPNST
    description: All provisions of the Act apply to the operator as if it is the supplier liable for paying the tax on the
      supply of such services.
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_EOAPFT_PD_AOA:
    statement: The proviso conditions are met, so the appointment obligation applies.
  M_EOAPFT_PD_AMUP:
    statement: The operator has appointed a tax paying person under the proviso.
  M_EOAPFT_PD_APLA:
    statement: The appointed person is liable to pay tax under the proviso.
  M_ECOPNST_PD_EPTONS:
    statement: The tax on the intra-State supply of the notified service shall be paid by the electronic commerce operator.
  M_ECOPNST_PD_ETALS:
    statement: All provisions of the Act apply to the operator as if it is the supplier liable for paying the tax on the supply
      of such services.
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_ISO
  - M_IOSFC_LE_ISIO
  - M_SIAWC_LE_SAIS
  produces:
  - product: M_SIAFOS_PD_ISO
    from:
    - M_SIAFOS_LE_ISO
  - product: M_IOSFC_PD_ISIO
    from:
    - M_IOSFC_LE_ISIO
  - product: M_SIAWC_PD_SAIS
    from:
    - M_SIAWC_LE_SAIS
- id: C_EOAPFT
  question: 'Section 9(5), further proviso: E-commerce Operator Appoints Person For Tax?'
  includes:
  - M_EOAPFT_LE_AOA
  - M_EOAPFT_LE_AMUP
  - M_EOAPFT_LE_APLA
  produces:
  - product: M_EOAPFT_PD_AOA
    from:
    - M_EOAPFT_LE_AOA
  - product: M_EOAPFT_PD_AMUP
    from:
    - M_EOAPFT_LE_AMUP
  - product: M_EOAPFT_PD_APLA
    from:
    - M_EOAPFT_LE_APLA
- id: C_ECOPNST
  question: 'Section 9(5): Electronic Commerce Operator Pays Notified Services Tax?'
  includes:
  - M_ECOPNST_LE_EPTONS
  - M_ECOPNST_LE_ETALS
  produces:
  - product: M_ECOPNST_PD_EPTONS
    from:
    - M_ECOPNST_LE_EPTONS
  - product: M_ECOPNST_PD_ETALS
    from:
    - M_ECOPNST_LE_ETALS
time:
  law_date: F_DOI
