# GOVERNANCE MASTER TSG07_01 Reverse charge on notified supplies (TG07 Reverse Charge, TDS, TCS)
# LAW ARC - 9 laws - status APPROVED
name: TSG07_01 Reverse charge on notified supplies - GOVERNANCE MASTER rulebook
version: TSG07_01
facts:
  F_NOCR:
    name: Notification On Council Recommendation
    type: BOOLEAN
    tier: T1
  F_TLIN:
    name: Transaction Listed In Notification
    type: BOOLEAN
    tier: T1
  F_SCB:
    name: Supply Charge Basis
    type: CODE
    options:
    - FORWARD_CHARGE
    - REVERSE_CHARGE
    - UNKNOWN
    tier: T0
  F_GRD:
    name: Goods Receipt Date
    type: DATE
    tier: T0
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_NRCCOS_A_NOCR:
    statement: The Government issued the notification on the recommendations of the Council.
    order: LOW
    rule: F_NOCR = TRUE
    handler: python
  M_NRCCOS_A_SINC:
    statement: The supply of goods or services or both falls within a category of supply specified by the Government by notification.
    order: LOW
    rule: F_TLIN = TRUE
    handler: python
  M_TOSGRRD_A_TPORC:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: HIGH
    interpretation: Is tax on this supply paid or liable to be paid on reverse charge basis?
    grounding:
    - F_SCB
    handler: light
  M_TOSGRRD_A_ROGDC:
    statement: The date of the receipt of goods is one of the dates of which the earliest is the time of supply
    order: LOW
    rule: F_GRD IS_SET
    handler: python
  M_TOSGRCP_A_SIORC:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: HIGH
    interpretation: Is tax on this supply paid or liable to be paid on reverse charge basis (RCM_PAID or RCM_LIABLE)?
    grounding:
    - F_SCB
    handler: light
  M_RCGTID_A_SIORC:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_RCSPD_A_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_RCSISD_A_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_NRCCOS_G_NSC:
    name: Notified Supply Conditions
    logic: ALL
    members:
    - M_NRCCOS_A_NOCR
    - M_NRCCOS_A_SINC
    description: The notification must be issued on Council recommendation AND the supply must fall within a category it specifies.
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_NRCCOS_LE_RPRCT:
    outcome: RC_TAX_PAYABLE_BY_RECIPIENT
    expr: M_NRCCOS_G_NSC
    module: M_NRCCOS
    description: The tax on a supply in a notified category is paid on reverse charge basis by the recipient of the goods
      or services or both.
  M_NRCCOS_LE_RTALP:
    outcome: RECIPIENT_DEEMED_LIABLE_PERSON
    expr: M_NRCCOS_G_NSC
    module: M_NRCCOS
    description: All provisions of the Act apply to the recipient as if he is the person liable for paying the tax on that
      supply.
  M_TOSGRRD_LE_RDICD:
    outcome: DATE_OF_RECEIPT_OF_GOODS_IS_A_CANDIDATE_DATE_FOR_TIME_OF_SUPPLY
    expr: M_TOSGRRD_A_TPORC AND M_TOSGRRD_A_ROGDC
    module: M_TOSGRRD
    description: When tax is on reverse charge basis and the date of receipt of goods exists, that date takes part in the
      earliest-of determination of the time of supply.
  M_TOSGRCP_LE_SIORC:
    outcome: SUPPLY_IS_ON_REVERSE_CHARGE
    expr: M_TOSGRCP_A_SIORC
    module: M_TOSGRCP
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis (Section 12(3),
      part of the law)
  M_RCGTID_LE_SIORC:
    outcome: SUPPLY_IS_ON_REVERSE_CHARGE
    expr: M_RCGTID_A_SIORC
    module: M_RCGTID
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis. (Section
      12(3), part of the law)
  M_RCSPD_LE_SORCB:
    outcome: SUPPLY_ON_REVERSE_CHARGE_BASIS
    expr: M_RCSPD_A_SORCB
    module: M_RCSPD
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis (Section 13(3),
      part of the law)
  M_RCSISD_LE_SORCB:
    outcome: SUPPLY_ON_REVERSE_CHARGE_BASIS
    expr: M_RCSISD_A_SORCB
    module: M_RCSISD
    description: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis. (Section
      13(3), part of the law)
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_NRCCOS_PD_RPRCT:
    statement: The tax on a supply in a notified category is paid on reverse charge basis by the recipient of the goods or
      services or both.
  M_NRCCOS_PD_RTALP:
    statement: All provisions of the Act apply to the recipient as if he is the person liable for paying the tax on that supply.
  M_TOSGRRD_PD_RDICD:
    statement: When tax is on reverse charge basis and the date of receipt of goods exists, that date takes part in the earliest-of
      determination of the time of supply.
  M_TOSGRCP_PD_SIORC:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
  M_RCGTID_PD_SIORC:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
  M_RCSPD_PD_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
  M_RCSISD_PD_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_ISO
  - M_IOSFC_LE_ISIO
  - M_SIAWC_LE_SAIS
  produces:
  - product: M_SIAFOS_PD_ISO
    from:
    - M_SIAFOS_LE_ISO
  - product: M_IOSFC_PD_ISIO
    from:
    - M_IOSFC_LE_ISIO
  - product: M_SIAWC_PD_SAIS
    from:
    - M_SIAWC_LE_SAIS
- id: C_NRCCOS
  question: 'Section 9(3): Notified Reverse Charge Categories Of Supply?'
  includes:
  - M_NRCCOS_LE_RPRCT
  - M_NRCCOS_LE_RTALP
  produces:
  - product: M_NRCCOS_PD_RPRCT
    from:
    - M_NRCCOS_LE_RPRCT
  - product: M_NRCCOS_PD_RTALP
    from:
    - M_NRCCOS_LE_RTALP
- id: C_S12_SS3
  question: 'Section 12(3): which clause applies?'
  includes:
  - M_TOSGRRD_LE_RDICD
  - M_TOSGRCP_LE_SIORC
  - M_RCGTID_LE_SIORC
  produces:
  - product: M_TOSGRRD_PD_RDICD
    from:
    - M_TOSGRRD_LE_RDICD
  - product: M_TOSGRCP_PD_SIORC
    from:
    - M_TOSGRCP_LE_SIORC
  - product: M_RCGTID_PD_SIORC
    from:
    - M_RCGTID_LE_SIORC
- id: C_S13_SS3
  question: 'Section 13(3): which clause applies?'
  includes:
  - M_RCSPD_LE_SORCB
  - M_RCSISD_LE_SORCB
  produces:
  - product: M_RCSPD_PD_SORCB
    from:
    - M_RCSPD_LE_SORCB
  - product: M_RCSISD_PD_SORCB
    from:
    - M_RCSISD_LE_SORCB
time:
  law_date: F_DOI
