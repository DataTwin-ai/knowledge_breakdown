# GOVERNANCE MASTER TSG07_02 Reverse charge from unregistered persons (TG07 Reverse Charge, TDS, TCS)
# LAW ARC - 4 laws - status APPROVED
name: TSG07_02 Reverse charge from unregistered persons - GOVERNANCE MASTER rulebook
version: TSG07_02
facts:
  F_NOCR:
    name: Notification On Council Recommendation
    type: BOOLEAN
    tier: T1
  F_RRS:
    name: Recipient Registration Status
    type: CODE
    options:
    - REGISTERED
    - UNREGISTERED
    tier: T0
  F_NCD:
    name: Notified Class Description
    type: TEXT
    tier: T1
  F_RDD:
    name: Recipient Description Details
    type: TEXT
    tier: T0
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_TLIN:
    name: Transaction Listed In Notification
    type: BOOLEAN
    tier: T1
  F_SRS:
    name: Supplier Registration Status
    type: CODE
    options:
    - REGISTERED
    - UNREGISTERED
    tier: T0
  F_SRS2:
    name: Supply Receipt Status
    type: CODE
    options:
    - RECEIVED
    - NOT_RECEIVED
    tier: T0
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_RCFUS_A_NOCRI:
    statement: The Government has, on the recommendations of the Council, by notification, specified the class of registered
      persons and the categories of goods or services or both for reverse charge
    order: LOW
    rule: F_NOCR = TRUE
    handler: python
  M_RCFUS_A_RIARP:
    statement: The recipient of the supply is a registered person
    order: LOW
    rule: F_RRS = 'REGISTERED'
    handler: python
  M_RCFUS_A_RINC:
    statement: The recipient belongs to the class of registered persons specified in the notification
    order: HIGH
    interpretation: Does the recipient fall within the class of registered persons described in the notification?
    grounding:
    - F_NCD
    - F_RDD
    handler: light
  M_RCFUS_A_SIOSC:
    statement: The supply is of a specified category of goods or services or both as specified in the notification
    order: HIGH
    interpretation: Does the described supply of goods or services or both fall within a category specified in the notification?
    grounding:
    - F_DOS
    - F_TLIN
    handler: light
  M_RCFUS_A_SIAUP:
    statement: The supply is received from an unregistered supplier
    order: LOW
    rule: F_SRS = 'UNREGISTERED'
    handler: python
  M_RCFUS_A_RRTSS:
    statement: The recipient receives the supply of goods or services or both from the supplier
    order: LOW
    rule: F_SRS2 = 'RECEIVED'
    handler: python
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_RCFUS_G_NRRC:
    name: Notified Registered Recipient Conditions
    logic: ALL
    members:
    - M_RCFUS_A_RIARP
    - M_RCFUS_A_RINC
    description: The recipient is a registered person and belongs to the class specified in the notification.
  M_RCFUS_G_NSRC:
    name: Notified Supply Received Conditions
    logic: ALL
    members:
    - M_RCFUS_A_SIOSC
    - M_RCFUS_A_SIAUP
    - M_RCFUS_A_RRTSS
    description: The supply is of a specified category, is received, and comes from an unregistered supplier.
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_RCFUS_LE_RPTORC:
    outcome: RECIPIENT_PAYS_TAX_ON_REVERSE_CHARGE
    expr: M_RCFUS_A_NOCRI AND M_RCFUS_G_NRRC AND M_RCFUS_G_NSRC
    module: M_RCFUS
    description: Where a notification exists and the recipient, supply and supplier all meet it, the recipient shall pay the
      tax on reverse charge basis.
  M_RCFUS_LE_RDPLFT:
    outcome: ACT_APPLIES_TO_RECIPIENT_AS_PERSON_LIABLE
    expr: M_RCFUS_A_NOCRI AND M_RCFUS_G_NRRC AND M_RCFUS_G_NSRC
    module: M_RCFUS
    description: Under the same conditions, all provisions of the Act apply to the recipient as if he were the person liable
      for paying the tax on that supply (deeming).
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_RCFUS_PD_RPTORC:
    statement: Where a notification exists and the recipient, supply and supplier all meet it, the recipient shall pay the
      tax on reverse charge basis.
  M_RCFUS_PD_RDPLFT:
    statement: Under the same conditions, all provisions of the Act apply to the recipient as if he were the person liable
      for paying the tax on that supply (deeming).
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_ISO
  - M_IOSFC_LE_ISIO
  - M_SIAWC_LE_SAIS
  produces:
  - product: M_SIAFOS_PD_ISO
    from:
    - M_SIAFOS_LE_ISO
  - product: M_IOSFC_PD_ISIO
    from:
    - M_IOSFC_LE_ISIO
  - product: M_SIAWC_PD_SAIS
    from:
    - M_SIAWC_LE_SAIS
- id: C_RCFUS
  question: 'Section 9(4): Reverse Charge For Unregistered Supplies?'
  includes:
  - M_RCFUS_LE_RPTORC
  - M_RCFUS_LE_RDPLFT
  produces:
  - product: M_RCFUS_PD_RPTORC
    from:
    - M_RCFUS_LE_RPTORC
  - product: M_RCFUS_PD_RDPLFT
    from:
    - M_RCFUS_LE_RDPLFT
time:
  law_date: F_DOI
