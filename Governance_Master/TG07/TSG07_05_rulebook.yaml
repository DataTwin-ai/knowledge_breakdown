# GOVERNANCE MASTER TSG07_05 TCS (TG07 Reverse Charge, TDS, TCS)
# LAW ARC - 2 laws - status APPROVED
name: TSG07_05 TCS - GOVERNANCE MASTER rulebook
version: TSG07_05
facts:
  F_PTC:
    name: Person Tax Category
    type: CODE
    options:
    - COMPOSITION_S10
    - ISD
    - NON_RESIDENT
    - REGULAR
    - TCS_S52
    - TDS_S51
    - UNKNOWN
    tier: T0
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_FORBRP_A_PPTUS52:
    statement: The person is paying tax under the provisions of section 52 (an excluded category)
    order: LOW
    rule: F_PTC = 'TCS_S52'
    handler: python
groups: {}
outcomes:
  M_FORBRP_LE_PPTUS52:
    outcome: PERSON_PAYS_TAX_UNDER_SECTION_52
    expr: M_FORBRP_A_PPTUS52
    module: M_FORBRP
    description: The person is paying tax under the provisions of section 52 (an excluded category) (Section 39(1), part of
      the law)
  M_FORBRP_LE_PPTUS52_FOSD:
    outcome: PERSON_PAYS_TAX_UNDER_SECTION_52
    expr: M_FORBRP_A_PPTUS52
    module: M_FOSD
    description: The person is paying tax under the provisions of section 52 (an excluded category) (Section 37(1), part of
      the law)
products:
  M_FORBRP_PD_PPTUS52:
    statement: The person is paying tax under the provisions of section 52 (an excluded category)
  M_FORBRP_PD_PPTUS52_FOSD:
    statement: The person is paying tax under the provisions of section 52
compounds:
- id: C_FORBRP
  question: The person is paying tax under the provisions of section 52 (an excluded category)? (Section 39(1))
  includes:
  - M_FORBRP_LE_PPTUS52
  produces:
  - product: M_FORBRP_PD_PPTUS52
    from:
    - M_FORBRP_LE_PPTUS52
- id: C_FOSD
  question: The person is paying tax under the provisions of section 52 (an excluded category)? (Section 37(1))
  includes:
  - M_FORBRP_LE_PPTUS52_FOSD
  produces:
  - product: M_FORBRP_PD_PPTUS52_FOSD
    from:
    - M_FORBRP_LE_PPTUS52_FOSD
time:
  law_date: F_DOI
