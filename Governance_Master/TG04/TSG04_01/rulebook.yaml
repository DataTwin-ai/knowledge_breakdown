# GOVERNANCE MASTER TSG04_01 Transaction value (TG04 Value)
# LAW ARC - 34 laws - status NEEDS_REVIEW
name: TSG04_01 Transaction value - GOVERNANCE MASTER rulebook
version: TSG04_01
facts:
  F_TRANSACTION_PARTIES_RELATED:
    name: Supplier and recipient are related parties
    type: BOOLEAN
    tier: T1
  F_SUPPLY_PRICE_IS_SOLE_CONSIDERATION:
    name: Price is the sole consideration for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_COVERED_BY_INVOICE:
    name: Extent of supply covered by invoice
    type: AMOUNT
    tier: T1
  F_SUPPLY_VALUE_PRE_CESSATION:
    name: Value of the supply made before cessation
    type: AMOUNT
    tier: T1
  F_ASSET_IS_CG_PM:
    name: Asset is capital goods or plant and machinery
    type: CODE
    options:
    - 'TRUE'
    - 'FALSE'
    tier: T0
  F_SUPPLY_TAXABLE_VALUE_EXCESS_AMOUNT:
    name: Amount by which invoice taxable value exceeds correct taxable value
    type: AMOUNT
    tier: T1
  F_INVOICE_TAXABLE_VALUE:
    name: Taxable value charged in the tax invoice
    type: AMOUNT
    tier: T0
  F_SUPPLY_CORRECT_TAXABLE_VALUE:
    name: Correct taxable value of the supply
    type: AMOUNT
    tier: T1
  F_SUPPLY_VALUE:
    name: Value of the supply of goods or services or both
    type: AMOUNT
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_RELATIONSHIP_P1_ROLE_IN_P2:
    name: Role of person 1 in person 2's business
    type: CODE
    options:
    - OFFICER
    - DIRECTOR
    - OTHER
    - NONE
    tier: T1
  F_RELATIONSHIP_P2_ROLE_IN_P1:
    name: Role of person 2 in person 1's business
    type: CODE
    options:
    - OFFICER
    - DIRECTOR
    - OTHER
    - NONE
    tier: T1
  F_RELATIONSHIP_LEGAL_FORM:
    name: Legal form of relationship between persons
    type: CODE
    options:
    - DIRECTOR
    - EMPLOYER
    - FAMILY
    - NONE
    - PARTNERSHIP
    tier: T1
  F_PERSONS_OWNERSHIP_CONTROL_RECORDS:
    name: Ownership and control records for the two persons
    type: TEXT
    tier: T1
  F_JOINT_CONTROL_EVIDENCE:
    name: Evidence of joint control by two persons over a third person
    type: TEXT
    tier: T1
  F_ENTITY_IS_LEGAL_PERSON:
    name: Entity is a legal person
    type: BOOLEAN
    tier: T1
  F_RELATIONSHIP_SOLE_ROLE:
    name: Sole role of one person in the business of the other
    type: CODE
    options:
    - SOLE_AGENT
    - SOLE_DISTRIBUTOR
    - SOLE_CONCESSIONAIRE
    - NONE
    tier: T1
  F_SUPPLY_LEVY_NATURE:
    name: Nature of the levy amount
    type: CODE
    options:
    - TAX
    - DUTY
    - CESS
    - FEE
    - CHARGE
    - OTHER
    tier: T1
  F_SUPPLY_LEVY_DESCRIPTION:
    name: Description of the levy or charge
    type: TEXT
    tier: T1
  F_SUPPLY_LEVY_GOVERNING_LAW:
    name: Law under which the levy is imposed
    type: CODE
    options:
    - CGST_ACT
    - SGST_ACT
    - UTGST_ACT
    - COMPENSATION_ACT
    - OTHER_LAW_IN_FORCE
    - NO_LAW
    tier: T1
  F_SUPPLY_LEVY_CHARGED_SEPARATELY:
    name: Levy is charged separately by the supplier
    type: BOOLEAN
    tier: T1
  F_SUPPLY_RECIPIENT_INCURRED_AMOUNT:
    name: Amount incurred by the recipient on supplier's behalf
    type: AMOUNT
    tier: T0
  F_SUPPLY_IS_SUPPLIER_LIABILITY:
    name: The amount incurred by the recipient is a liability of the supplier
    type: BOOLEAN
    tier: T1
  F_SUPPLY_AMOUNT_INCLUDED_IN_PRICE:
    name: The amount incurred by the recipient is included in the price paid or payable
    type: BOOLEAN
    tier: T1
  F_SUPPLY_INCIDENTAL_EXPENSES_AMOUNT:
    name: Amount of incidental expenses (e.g., commission, packing) charged by the supplier to the recipient
    type: AMOUNT
    tier: T1
  F_SUPPLY_ANCILLARY_CHARGE_AMOUNT:
    name: Amount charged by the supplier for an activity done in respect of the supply
    type: AMOUNT
    tier: T1
  F_SUPPLY_ANCILLARY_ACTIVITY_TIMING:
    name: Timing of the ancillary activity performed by the supplier
    type: CODE
    options:
    - AT_DELIVERY
    - BEFORE_DELIVERY
    - AFTER_DELIVERY
    tier: T1
  F_ADDITION_TYPE:
    name: Type of addition to value for delayed payment
    type: CODE
    options:
    - INTEREST
    - LATE_FEE
    - OTHER
    - PENALTY
    tier: T1
  F_SUBSIDY_DIRECTLY_LINKED_TO_PRICE:
    name: Subsidy is directly linked to the price of the supply
    type: BOOLEAN
    tier: T1
  F_SUBSIDY_DESCRIPTION:
    name: Description of the subsidy and how it relates to the price
    type: TEXT
    tier: T1
  F_SUBSIDY_AMOUNT:
    name: Amount of the subsidy received in respect of the supply
    type: AMOUNT
    tier: T0
  F_SUBSIDY_PROVIDER:
    name: Provider of the subsidy
    type: CODE
    options:
    - CENTRAL_GOVERNMENT
    - STATE_GOVERNMENT
    - OTHER
    tier: T1
  F_SUBSIDY_RECEIVER_ROLE:
    name: Role of the person who receives the subsidy in relation to the supply
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - OTHER
    tier: T1
  F_SUPPLY_DISCOUNT_TIMING:
    name: Time at which the discount is given relative to the supply
    type: CODE
    options:
    - AFTER_SUPPLY
    - AT_SUPPLY
    - BEFORE_SUPPLY
    tier: T1
  F_SUPPLY_DISCOUNT_RECORDED_IN_INVOICE:
    name: Discount is duly recorded in the invoice issued in respect of the supply
    type: BOOLEAN
    tier: T0
  F_SUPPLY_CONSIDERATION_FORM:
    name: Form in which the consideration for the supply is represented
    type: CODE
    options:
    - DISCOUNT
    - INTEREST
    - OTHER
    tier: T1
  F_DISCOUNT_AGREEMENT_TIMING:
    name: Time at which the agreement establishing the discount was entered into relative to the supply
    type: CODE
    options:
    - BEFORE_SUPPLY
    - AT_SUPPLY
    - AFTER_SUPPLY
    - NO_AGREEMENT
    tier: T1
  F_DISCOUNT_LINKED_TO_INVOICES:
    name: Discount is specifically linked to relevant invoices
    type: BOOLEAN
    tier: T1
  F_ITC_ATTRIBUTABLE_TO_DISCOUNT:
    name: Input tax credit is attributable to the discount
    type: BOOLEAN
    tier: T1
  F_DISCOUNT_DOCUMENT_ISSUED_BY_SUPPLIER:
    name: Document on the basis of which the credit attributable to the discount is determined was issued by the supplier
    type: BOOLEAN
    tier: T1
  F_ITC_REVERSED_BY_RECIPIENT:
    name: Input tax credit attributable to the discount has been reversed by the recipient
    type: BOOLEAN
    tier: T1
  F_M_NSVD_1:
    name: Supply is of a type notified by the Government for special valuation
    type: BOOLEAN
    tier: T1
  F_M_NSVD_2:
    name: The notification for special valuation was issued on the recommendation of the GST Council
    type: BOOLEAN
    tier: T1
  F_M_NSVD_3:
    name: A manner for determining the value of the notified supply is prescribed
    type: BOOLEAN
    tier: T1
  F_PROVISION_CHAPTER_CONTEXT:
    name: Chapter of the Act for the purposes of which the expression plant and machinery is being applied
    type: CODE
    options:
    - CHAPTER_VI
    - OTHER
    - THIS_CHAPTER
    tier: T1
  F_ASSET_KIND:
    name: Kind of item as apparatus, equipment or machinery
    type: CODE
    options:
    - APPARATUS
    - EQUIPMENT
    - MACHINERY
    - OTHER
    tier: T0
  F_ASSET_FIXING_MODE:
    name: Means by which the item is fixed to earth
    type: CODE
    options:
    - BOTH
    - FOUNDATION
    - NONE
    - STRUCTURAL_SUPPORT
    tier: T1
  F_ASSET_USED_FOR_OUTWARD_SUPPLY:
    name: Item is used for making outward supply of goods or services or both
    type: BOOLEAN
    tier: T1
  F_ASSET_USE_DESCRIPTION:
    name: Description of the item, its construction and its use
    type: TEXT
    tier: T1
  F_ASSET_COMPONENT_ROLE:
    name: Role of the item as foundation or structural support of qualifying apparatus, equipment or machinery
    type: CODE
    options:
    - FOUNDATION_OF_QUALIFYING_ASSET
    - NONE
    - STRUCTURAL_SUPPORT_OF_QUALIFYING_ASSET
    tier: T1
  F_ASSET_NATURE:
    name: Nature of the item as land, building or other civil structure
    type: CODE
    options:
    - LAND
    - BUILDING
    - OTHER_CIVIL_STRUCTURE
    - NONE_OF_THESE
    tier: T1
  F_ASSET_IS_TELECOM_TOWER:
    name: Item is a telecommunication tower
    type: BOOLEAN
    tier: T1
  F_ASSET_IS_PIPELINE:
    name: Item is a pipeline
    type: BOOLEAN
    tier: T1
  F_ASSET_LAID_OUTSIDE_FACTORY_PREMISES:
    name: Item is laid outside the factory premises
    type: BOOLEAN
    tier: T1
predicates:
  A_VOSITV_01:
    statement: the supplier and the recipient of the supply are not related
    order: LOW
    rule: F_TRANSACTION_PARTIES_RELATED = FALSE
  A_VOSITV_02:
    statement: the price is the sole consideration for the supply
    order: LOW
    rule: F_SUPPLY_PRICE_IS_SOLE_CONSIDERATION = TRUE
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_LEGAL_PERSON_INCLUDED:
    statement: For the purposes of this Act, the term "person" also includes legal persons
    order: LOW
    rule: F_ENTITY_IS_LEGAL_PERSON = TRUE
  A_SCOPE:
    statement: The expression "plant and machinery" is being applied for the purposes of this Chapter or Chapter VI
    order: LOW
    rule: F_PROVISION_CHAPTER_CONTEXT IN ['THIS_CHAPTER','CHAPTER_VI']
  A_APPARATUS:
    statement: The item is apparatus within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'APPARATUS'
  A_EQUIPMENT:
    statement: The item is equipment within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'EQUIPMENT'
  A_MACHINERY:
    statement: The item is machinery within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'MACHINERY'
  A_FIXED_FOUNDATION:
    statement: The apparatus, equipment or machinery is fixed to earth by foundation
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['FOUNDATION','BOTH']
  A_FIXED_STRUCTURAL:
    statement: The apparatus, equipment or machinery is fixed to earth by structural support
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['STRUCTURAL_SUPPORT','BOTH']
  A_USED:
    statement: The apparatus, equipment or machinery fixed to earth is used for making outward supply of goods or services
      or both
    order: HIGH
    interpretation: On the recorded use of the item, is it used for making outward supply of goods or services or both? Goods-only
      or services-only use both qualify. Missing use evidence gives UNKNOWN
    grounding:
    - F_ASSET_USED_FOR_OUTWARD_SUPPLY
    - F_ASSET_USE_DESCRIPTION
  A_INCL_FOUNDATION:
    statement: The item is such foundation, being the foundation by which apparatus, equipment or machinery used for making
      outward supply of goods or services or both is fixed to earth
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'FOUNDATION_OF_QUALIFYING_ASSET'
  A_INCL_STRUCTURAL:
    statement: The item is such structural support, being the structural support by which apparatus, equipment or machinery
      used for making outward supply of goods or services or both is fixed to earth
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'STRUCTURAL_SUPPORT_OF_QUALIFYING_ASSET'
  A_EXCL_LAND:
    statement: The item is land, which plant and machinery excludes
    order: LOW
    rule: F_ASSET_NATURE = 'LAND'
  A_EXCL_BUILDING:
    statement: The item is a building, which plant and machinery excludes
    order: LOW
    rule: F_ASSET_NATURE = 'BUILDING'
  A_EXCL_CIVIL:
    statement: The item is any other civil structure, which plant and machinery excludes
    order: HIGH
    interpretation: Is the item a civil structure other than land or building? Is such foundation or structural support of
      qualifying plant within this exclusion, despite the express inclusion? The source does not resolve this.
    grounding:
    - F_ASSET_NATURE
    - F_ASSET_USE_DESCRIPTION
    - F_ASSET_COMPONENT_ROLE
  A_CHAPTER_SCOPE:
    statement: The expression plant and machinery is being applied for the purposes of this Chapter or Chapter VI
    order: LOW
    rule: F_PROVISION_CHAPTER_CONTEXT IN ['THIS_CHAPTER','CHAPTER_VI']
  A_APPARATUS_PAMET:
    statement: The item is apparatus within the expression plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'APPARATUS'
  A_EQUIPMENT_PAMET:
    statement: The item is equipment within the expression plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'EQUIPMENT'
  A_MACHINERY_PAMET:
    statement: The item is machinery within the expression plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'MACHINERY'
  A_FIXED_FOUNDATION_PAMET:
    statement: The apparatus, equipment or machinery is fixed to earth by foundation
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['FOUNDATION','BOTH']
  A_FIXED_STRUCTURAL_PAMET:
    statement: The apparatus, equipment or machinery is fixed to earth by structural support
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['STRUCTURAL_SUPPORT','BOTH']
  A_OUTWARD_USE:
    statement: The apparatus, equipment or machinery is used for making outward supply of goods or services or both
    order: LOW
    rule: F_ASSET_USED_FOR_OUTWARD_SUPPLY = TRUE
  A_INCL_FOUNDATION_PAMET:
    statement: The item is the foundation of such apparatus, equipment or machinery as qualifies under the definition, which
      plant and machinery includes
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'FOUNDATION_OF_QUALIFYING_ASSET'
  A_INCL_STRUCTURAL_PAMET:
    statement: The item is a structural support of such apparatus, equipment or machinery as qualifies under the definition,
      which plant and machinery includes
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'STRUCTURAL_SUPPORT_OF_QUALIFYING_ASSET'
  A_TELECOM_TOWER:
    statement: The item is a telecommunication tower, which plant and machinery excludes
    order: LOW
    rule: F_ASSET_IS_TELECOM_TOWER = TRUE
  A_PIPELINE_OUT:
    statement: The item is a pipeline laid outside the factory premises
    order: LOW
    rule: F_ASSET_IS_PIPELINE = TRUE AND F_ASSET_LAID_OUTSIDE_FACTORY_PREMISES = TRUE
  A_SCOPE_PAMEP:
    statement: The expression plant and machinery is being applied for the purposes of this Chapter or Chapter VI
    order: LOW
    rule: F_PROVISION_CHAPTER_CONTEXT IN ['THIS_CHAPTER','CHAPTER_VI']
  A_APPARATUS_PAMEP:
    statement: The item is apparatus within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'APPARATUS'
  A_EQUIPMENT_PAMEP:
    statement: The item is equipment within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'EQUIPMENT'
  A_MACHINERY_PAMEP:
    statement: The item is machinery within the meaning of plant and machinery
    order: LOW
    rule: F_ASSET_KIND = 'MACHINERY'
  A_FIX_FOUNDATION:
    statement: The apparatus, equipment or machinery is fixed to earth by foundation
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['FOUNDATION','BOTH']
  A_FIX_STRUCTURAL:
    statement: The apparatus, equipment or machinery is fixed to earth by structural support
    order: LOW
    rule: F_ASSET_FIXING_MODE IN ['STRUCTURAL_SUPPORT','BOTH']
  A_USED_OUTWARD:
    statement: The apparatus, equipment or machinery is used for making outward supply of goods or services or both
    order: LOW
    rule: F_ASSET_USED_FOR_OUTWARD_SUPPLY = TRUE
  A_FOUNDATION_INCL:
    statement: The item is such foundation, being the foundation by which apparatus, equipment or machinery used for making
      outward supply of goods or services or both is fixed to earth
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'FOUNDATION_OF_QUALIFYING_ASSET'
  A_STRUCT_SUPPORT_INCL:
    statement: The item is such structural support, being the structural support by which apparatus, equipment or machinery
      used for making outward supply of goods or services or both is fixed to earth
    order: LOW
    rule: F_ASSET_COMPONENT_ROLE = 'STRUCTURAL_SUPPORT_OF_QUALIFYING_ASSET'
  A_IFCOSS_EXTENT_OBLIGATION:
    statement: The invoice shall be issued to the extent of the supply made before such cessation.
    order: HIGH
    interpretation: Does the invoice cover the extent of the supply made before the cessation?
    grounding:
    - F_SUPPLY_COVERED_BY_INVOICE
    - F_SUPPLY_VALUE_PRE_CESSATION
  A_M_IOCNFEV_2:
    statement: The taxable value charged in a tax invoice for the supply is found to exceed the correct taxable value
    order: LOW
    rule: F_SUPPLY_TAXABLE_VALUE_EXCESS_AMOUNT > 0
  A_IODNFS_3:
    statement: The taxable value charged in that tax invoice is found to be less than the taxable value payable in respect
      of such supply.
    order: HIGH
    interpretation: Is the taxable value charged in the tax invoice (F_INVOICE_TAXABLE_VALUE) less than the taxable value
      payable for the supply (F_SUPPLY_CORRECT_TAXABLE_VALUE)?
    grounding:
    - F_INVOICE_TAXABLE_VALUE
    - F_SUPPLY_CORRECT_TAXABLE_VALUE
  A_M_NTIBTH_2:
    statement: The value of the goods or services or both supplied is less than two hundred rupees
    order: LOW
    rule: F_SUPPLY_VALUE < 200
  A_NBOSBTH_2:
    statement: The value of the goods or services or both supplied is less than two hundred rupees
    order: LOW
    rule: F_SUPPLY_VALUE < 200
  A_M_RPOOD_1:
    statement: One person is an officer or director of the other person's business.
    order: LOW
    rule: F_RELATIONSHIP_P1_ROLE_IN_P2 IN ['OFFICER', 'DIRECTOR']
  A_M_RPOOD_2:
    statement: The other person is an officer or director of the first person's business.
    order: LOW
    rule: F_RELATIONSHIP_P2_ROLE_IN_P1 IN ['OFFICER', 'DIRECTOR']
  A_RPLRP:
    statement: The persons are legally recognised partners in business.
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'PARTNERSHIP'
  A_M_RPEAE_1:
    statement: The persons are employer and employee.
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'EMPLOYER'
  A_RP25PS_OWNS:
    statement: A person directly or indirectly owns twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly OWN 25% or more of the outstanding
      voting stock or shares in BOTH of the two persons being evaluated?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RP25PS_CONTROLS:
    statement: A person directly or indirectly controls twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly CONTROL 25% or more of the
      outstanding voting stock or shares in BOTH of the two persons being evaluated? This can be through means other than
      direct ownership.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RP25PS_HOLDS:
    statement: A person directly or indirectly holds twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly HOLD 25% or more of the outstanding
      voting stock or shares in BOTH of the two persons being evaluated? This covers various forms of holding, including beneficial
      ownership.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_DIRECT_CONTROL:
    statement: One person directly controls the other person.
    order: HIGH
    interpretation: Based on the provided records, does one person directly control the other? This typically involves majority
      shareholding, voting rights, or power to appoint a majority of directors.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_INDIRECT_CONTROL:
    statement: One person indirectly controls the other person.
    order: HIGH
    interpretation: Based on the provided records, does one person indirectly control the other? This can occur through a
      chain of intermediaries or common control by a third party.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_DIRECT_CONTROL_RPCC:
    statement: Both persons are directly controlled by a third person.
    order: HIGH
    interpretation: Based on ownership and control records, are both persons directly controlled by a common third person
      (e.g., via majority shareholding or board control)?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_INDIRECT_CONTROL_RPCC:
    statement: Both persons are indirectly controlled by a third person.
    order: HIGH
    interpretation: Based on ownership and control records, are both persons indirectly controlled by a common third person
      (e.g., through a chain of intermediary entities)?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RPJC_1:
    statement: Two persons together directly control a third person
    order: HIGH
    interpretation: Based on the evidence, do the two persons being evaluated together directly control a third person?
    grounding:
    - F_JOINT_CONTROL_EVIDENCE
  A_RPJC_2:
    statement: Two persons together indirectly control a third person
    order: HIGH
    interpretation: Based on the evidence, do the two persons being evaluated together indirectly control a third person?
    grounding:
    - F_JOINT_CONTROL_EVIDENCE
  A_FAMILY_MEMBERS:
    statement: The persons are members of the same family
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'FAMILY'
  A_SOLE_AGENT:
    statement: The persons are associated in the business of one another in that one is the sole agent, howsoever described,
      of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_AGENT'
  A_SOLE_DISTRIBUTOR:
    statement: The persons are associated in the business of one another in that one is the sole distributor, howsoever described,
      of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_DISTRIBUTOR'
  A_SOLE_CONCESSIONAIRE:
    statement: The persons are associated in the business of one another in that one is the sole concessionaire, howsoever
      described, of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_CONCESSIONAIRE'
  A_TAX:
    statement: The amount is a tax, being one of the taxes, duties, cesses, fees and charges that the value of supply shall
      include
    order: LOW
    rule: F_SUPPLY_LEVY_NATURE = 'TAX'
  A_DUTY:
    statement: The amount is a duty, being one of the taxes, duties, cesses, fees and charges that the value of supply shall
      include
    order: LOW
    rule: F_SUPPLY_LEVY_NATURE = 'DUTY'
  A_CESS:
    statement: The amount is a cess, being one of the taxes, duties, cesses, fees and charges that the value of supply shall
      include
    order: LOW
    rule: F_SUPPLY_LEVY_NATURE = 'CESS'
  A_FEE:
    statement: The amount is a fee, being one of the taxes, duties, cesses, fees and charges that the value of supply shall
      include
    order: LOW
    rule: F_SUPPLY_LEVY_NATURE = 'FEE'
  A_CHARGE:
    statement: The amount is a charge, being one of the taxes, duties, cesses, fees and charges that the value of supply shall
      include
    order: HIGH
    interpretation: Is the amount a charge of the kind listed with taxes, duties, cesses and fees, including where it carries
      another label?
    grounding:
    - F_SUPPLY_LEVY_NATURE
    - F_SUPPLY_LEVY_DESCRIPTION
  A_LAW_OTHER:
    statement: The tax, duty, cess, fee or charge is levied under any law for the time being in force other than this Act,
      the State Goods and Services Tax Act, the Union Territory Goods and Services Tax Act and the Goods and Services Tax
      (Compensation to States) Act
    order: LOW
    rule: F_SUPPLY_LEVY_GOVERNING_LAW = 'OTHER_LAW_IN_FORCE'
  A_SEPARATE:
    statement: The tax, duty, cess, fee or charge is charged separately by the supplier
    order: LOW
    rule: F_SUPPLY_LEVY_CHARGED_SEPARATELY = TRUE
  A_M_RISLI_1:
    statement: An amount has been incurred by the recipient of the supply.
    order: LOW
    rule: F_SUPPLY_RECIPIENT_INCURRED_AMOUNT IS_SET AND F_SUPPLY_RECIPIENT_INCURRED_AMOUNT > 0
  A_M_RISLI_2:
    statement: The amount incurred by the recipient is an amount the supplier is liable to pay in relation to the supply.
    order: HIGH
    interpretation: Considering the cost incurred by the recipient, was this an amount the supplier was liable to pay under
      the contract or any law?
    grounding:
    - F_SUPPLY_IS_SUPPLIER_LIABILITY
  A_M_RISLI_3:
    statement: The amount incurred by the recipient is not included in the price actually paid or payable for the goods or
      services or both.
    order: LOW
    rule: F_SUPPLY_AMOUNT_INCLUDED_IN_PRICE = FALSE
  A_M_IOIEIV_1:
    statement: Incidental expenses, including commission and packing, were charged by the supplier to the recipient of the
      supply.
    order: LOW
    rule: F_SUPPLY_INCIDENTAL_EXPENSES_AMOUNT > 0
  A_M_IOIEIV_2:
    statement: An amount was charged for something done by the supplier in respect of the supply at the time of, or before,
      the delivery of goods or supply of services.
    order: LOW
    rule: F_SUPPLY_ANCILLARY_CHARGE_AMOUNT > 0 AND F_SUPPLY_ANCILLARY_ACTIVITY_TIMING IN ['AT_DELIVERY', 'BEFORE_DELIVERY']
  A_M_IOIFDP_1:
    statement: Interest is charged for delayed payment of any consideration for the supply.
    order: LOW
    rule: F_ADDITION_TYPE = 'INTEREST'
  A_M_IOIFDP_2:
    statement: A late fee is charged for delayed payment of any consideration for the supply.
    order: LOW
    rule: F_ADDITION_TYPE = 'LATE_FEE'
  A_M_IOIFDP_3:
    statement: A penalty is charged for delayed payment of any consideration for the supply.
    order: LOW
    rule: F_ADDITION_TYPE = 'PENALTY'
  A_SUBSIDY_PRICE_LINKED:
    statement: A subsidy is directly linked to the price of the supply
    order: HIGH
    interpretation: Is the subsidy directly linked to the price of the supply rather than a general grant that is not tied
      to the price?
    grounding:
    - F_SUBSIDY_DIRECTLY_LINKED_TO_PRICE
    - F_SUBSIDY_DESCRIPTION
    - F_SUBSIDY_AMOUNT
  A_SUBSIDY_FROM_CG:
    statement: The subsidy is provided by the Central Government
    order: LOW
    rule: F_SUBSIDY_PROVIDER = 'CENTRAL_GOVERNMENT'
  A_SUBSIDY_FROM_SG:
    statement: The subsidy is provided by a State Government
    order: LOW
    rule: F_SUBSIDY_PROVIDER = 'STATE_GOVERNMENT'
  A_SAIIVE_SCOPE:
    statement: The amount of subsidy is being considered in determining the value of the supply for the purposes of this sub-section
      (Section 15(2))
    order: HIGH
    interpretation: Is the subsidy being taken into account in determining the value of the supply for the purposes of Section
      15(2)?
    grounding:
    - F_SUBSIDY_DESCRIPTION
  A_SAIIVE_RECEIVER:
    statement: The subsidy is received by the supplier of the supply
    order: LOW
    if_false: F_SUBSIDY_RECEIVER_ROLE is RECIPIENT or OTHER
    rule: F_SUBSIDY_RECEIVER_ROLE = 'SUPPLIER'
  A_DISC_BEFORE:
    statement: The value of the supply shall not include any discount which is given before the time of the supply (this timing
      alternative only; recording in the invoice is tested separately)
    order: LOW
    rule: F_SUPPLY_DISCOUNT_TIMING = 'BEFORE_SUPPLY'
  A_DISC_AT:
    statement: The value of the supply shall not include any discount which is given at the time of the supply (this timing
      alternative only; recording in the invoice is tested separately)
    order: LOW
    rule: F_SUPPLY_DISCOUNT_TIMING = 'AT_SUPPLY'
  A_DISC_RECORDED:
    statement: The value of the supply shall not include any discount if such discount has been duly recorded in the invoice
      issued in respect of such supply (this recording condition only; timing is tested separately)
    order: LOW
    rule: F_SUPPLY_DISCOUNT_RECORDED_IN_INVOICE = TRUE
  A_PSDAC_NOT_INCLUDE:
    statement: The amount in question is a discount that the value of the supply shall not include (the prohibition applies
      to any discount that meets the other stated conditions)
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_FORM = 'DISCOUNT'
  A_PSDAC_AFTER:
    statement: The discount is given after the supply has been effected
    order: LOW
    rule: F_SUPPLY_DISCOUNT_TIMING = 'AFTER_SUPPLY'
  A_PSDAC_AGREEMENT:
    statement: Such discount is established in terms of an agreement entered into at or before the time of such supply
    order: LOW
    rule: F_DISCOUNT_AGREEMENT_TIMING IN ['BEFORE_SUPPLY', 'AT_SUPPLY']
  A_PSDAC_LINKED:
    statement: Such discount is specifically linked to relevant invoices
    order: LOW
    rule: F_DISCOUNT_LINKED_TO_INVOICES = TRUE
  A_ITC_ATTRIB:
    statement: Input tax credit is attributable to the discount on the basis of a document issued by the supplier
    order: LOW
    rule: F_ITC_ATTRIBUTABLE_TO_DISCOUNT = TRUE AND F_DISCOUNT_DOCUMENT_ISSUED_BY_SUPPLIER = TRUE
  A_ITC_REV:
    statement: The input tax credit attributable to the discount has been reversed by the recipient of the supply
    order: LOW
    rule: F_ITC_REVERSED_BY_RECIPIENT = TRUE
  A_DISC_AFTER:
    statement: The discount is given after the supply has been effected
    order: LOW
    rule: F_SUPPLY_DISCOUNT_TIMING = 'AFTER_SUPPLY'
  A_M_NSVD_1:
    statement: The supply is of a type notified by the Government.
    order: LOW
    rule: F_M_NSVD_1 = TRUE
  A_M_NSVD_2:
    statement: The notification by the Government was made on the recommendations of the Council.
    order: LOW
    rule: F_M_NSVD_2 = TRUE
  A_M_NSVD_3:
    statement: A manner for determining the value of such supplies has been prescribed.
    order: LOW
    rule: F_M_NSVD_3 = TRUE
  A_SCOPE_CG_PM:
    statement: The case involves capital goods or plant and machinery.
    order: LOW
    rule: F_ASSET_IS_CG_PM = 'TRUE'
groups:
  G_VOSITV_CONDITIONS:
    name: Conditions for accepting transaction value
    logic: ALL
    members:
    - A_VOSITV_01
    - A_VOSITV_02
    description: 'Both conditions must be met: the parties are not related AND the price is the sole consideration for the
      supply.'
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_KIND:
    name: Apparatus equipment or machinery
    logic: ANY
    members:
    - A_APPARATUS
    - A_EQUIPMENT
    - A_MACHINERY
    description: The item is apparatus, equipment or machinery
  G_FIXING:
    name: Fixed to earth by foundation or structural support
    logic: ANY
    members:
    - A_FIXED_FOUNDATION
    - A_FIXED_STRUCTURAL
    description: The item is fixed to earth by foundation or by structural support
  G_CORE:
    name: Core meaning of plant and machinery
    logic: ALL
    members:
    - G_KIND
    - G_FIXING
    - A_USED
    description: Apparatus, equipment or machinery fixed to earth by foundation or structural support and used for making
      outward supply of goods or services or both
  G_INCLUDED:
    name: Included foundation and structural supports
    logic: ANY
    members:
    - A_INCL_FOUNDATION
    - A_INCL_STRUCTURAL
    description: The item is such foundation or such structural support
  G_EXCLUDED:
    name: Excluded land building or other civil structures
    logic: ANY
    members:
    - A_EXCL_LAND
    - A_EXCL_BUILDING
    - A_EXCL_CIVIL
    description: The item is land, building or any other civil structure
  G_CORE_PAMET:
    name: Main or included limb
    logic: ANY
    members:
    - G_MAIN
    - G_INCLUDED_PAMET
    description: The item qualifies through the main means limb or through the includes limb for such foundation and structural
      supports.
  G_MAIN:
    name: Main means limb
    logic: ALL
    members:
    - G_KIND_PAMET
    - G_FIXING_PAMET
    - A_OUTWARD_USE
    description: The item is apparatus, equipment or machinery, is fixed to earth by foundation or structural support, and
      is used for making outward supply of goods or services or both.
  G_KIND_PAMET:
    name: Apparatus equipment or machinery
    logic: ANY
    members:
    - A_APPARATUS_PAMET
    - A_EQUIPMENT_PAMET
    - A_MACHINERY_PAMET
    description: 'The item falls in any one of the listed kinds: apparatus, equipment or machinery.'
  G_FIXING_PAMET:
    name: Fixed by foundation or structural support
    logic: ANY
    members:
    - A_FIXED_FOUNDATION_PAMET
    - A_FIXED_STRUCTURAL_PAMET
    description: The item is fixed to earth by foundation or by structural support, either being sufficient.
  G_INCLUDED_PAMET:
    name: Such foundation and structural supports
    logic: ANY
    members:
    - A_INCL_FOUNDATION_PAMET
    - A_INCL_STRUCTURAL_PAMET
    description: The item is the foundation or a structural support of apparatus, equipment or machinery that itself qualifies
      under the definition.
  G_CORE_PAMEP:
    name: Core plant and machinery limb
    logic: ALL
    members:
    - G_KIND_PAMEP
    - G_FIXING_PAMEP
    - A_USED_OUTWARD
    description: The item is apparatus, equipment or machinery. It is fixed to earth by foundation or structural support.
      It is used for making outward supply of goods or services or both.
  G_KIND_PAMEP:
    name: Kind of item
    logic: ANY
    members:
    - A_APPARATUS_PAMEP
    - A_EQUIPMENT_PAMEP
    - A_MACHINERY_PAMEP
    description: Apparatus, equipment and machinery are the listed kinds. An item qualifies under any one of them.
  G_FIXING_PAMEP:
    name: Fixing to earth
    logic: ANY
    members:
    - A_FIX_FOUNDATION
    - A_FIX_STRUCTURAL
    description: The item is fixed to earth by foundation or by structural support. These are alternatives.
  G_INCLUDED_PAMEP:
    name: Included foundation and structural supports
    logic: ANY
    members:
    - A_FOUNDATION_INCL
    - A_STRUCT_SUPPORT_INCL
    description: Plant and machinery includes such foundation and structural supports of qualifying apparatus, equipment or
      machinery.
  G_M_RPOOD_1:
    name: Reciprocal Officer/Director Roles
    logic: ALL
    members:
    - A_M_RPOOD_1
    - A_M_RPOOD_2
  G_RP25PS:
    name: Holding Condition
    logic: ANY
    members:
    - A_RP25PS_OWNS
    - A_RP25PS_CONTROLS
    - A_RP25PS_HOLDS
    description: The condition is met if any of the holding types (owns, controls, or holds) by a third party are satisfied.
  G_CONTROL:
    name: Test for Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL
    - A_INDIRECT_CONTROL
    description: A test to determine if one person controls another, either directly or indirectly.
  G_M_RPCC:
    name: Common Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL_RPCC
    - A_INDIRECT_CONTROL_RPCC
    description: The condition is met if there is either direct or indirect control by a common third person.
  G_RPJC_1:
    name: Joint control of a third person
    logic: ANY
    members:
    - A_RPJC_1
    - A_RPJC_2
  G_SOLE_ROLE:
    name: Sole agent or sole distributor or sole concessionaire
    logic: ANY
    members:
    - A_SOLE_AGENT
    - A_SOLE_DISTRIBUTOR
    - A_SOLE_CONCESSIONAIRE
    description: Any one of the three sole-role relationships is enough
  G_LEVY_KIND:
    name: Kind of levy
    logic: ANY
    members:
    - A_TAX
    - A_DUTY
    - A_CESS
    - A_FEE
    - A_CHARGE
    description: The amount is any one of a tax, duty, cess, fee or charge. The list taxes, duties, cesses, fees and charges
      covers every kind, so a single amount needs to be only one of them.
  G_M_IOIFDP_1:
    name: Delayed Payment Charges
    logic: ANY
    members:
    - A_M_IOIFDP_1
    - A_M_IOIFDP_2
    - A_M_IOIFDP_3
  G_GOVT_SUBSIDY:
    name: Government provided subsidy
    logic: ANY
    members:
    - A_SUBSIDY_FROM_CG
    - A_SUBSIDY_FROM_SG
    description: The subsidy is provided by the Central Government or by a State Government. Either one triggers the exclusion
  G_SAIIVE_CONDITIONS:
    name: Subsidy inclusion conditions
    logic: ALL
    members:
    - A_SAIIVE_SCOPE
    - A_SAIIVE_RECEIVER
    description: Both the sub-section scope and the receipt of the subsidy by the supplier must hold
  G_DISC_TIMING:
    name: Discount given before or at the time of supply
    logic: ANY
    members:
    - A_DISC_BEFORE
    - A_DISC_AT
    description: The discount is given before the time of the supply OR at the time of the supply.
  G_PSDAC_CONDITIONS:
    name: Post-supply discount exclusion conditions
    logic: ALL
    members:
    - A_PSDAC_NOT_INCLUDE
    - A_PSDAC_AFTER
    - A_PSDAC_AGREEMENT
    - A_PSDAC_LINKED
    description: The amount is a discount that the value shall not include AND it is given after the supply AND it is established
      by an agreement at or before the supply AND it is specifically linked to relevant invoices
  G_PSDIR_COND:
    name: Post-supply discount with recipient ITC reversal
    logic: ALL
    members:
    - A_DISC_AFTER
    - A_ITC_ATTRIB
    - A_ITC_REV
    description: 'All three conditions must hold together: the discount is given after the supply, ITC is attributable to
      it on a supplier document, and that ITC has been reversed by the recipient.'
  G_M_NSVD_1:
    name: Conditions for Prescribed Valuation
    logic: ALL
    members:
    - A_M_NSVD_1
    - A_M_NSVD_2
    - A_M_NSVD_3
    description: All conditions must be met for the special valuation method to apply.
  A_PAYMENT_OBLIGATION:
    name: Any of the referred steps (A_PAYMENT_OBLIGATION)
    logic: ANY
    members:
    - PD_DBOAS
    - PD_DOPIL
    - PD_IOOTIV
    - PD_M_IOIEIV
    - PD_M_IOIFDP
    - PD_M_NSVD
    - PD_M_RISLI
    - PD_M_RPCC
    - PD_M_RPEAE
    - PD_M_RPOOD
    - PD_M_VCBDPM
    - PD_PSDAC
    - PD_PSDIR
    - PD_RP25PS
    - PD_RPDIC
    - PD_RPJC
    - PD_RPLRP
    - PD_RPSAD
    - PD_RPSFM
    - PD_SAIIVE
    - PD_VISLTP
    - PD_VOSITV
    description: TRUE when any step of the law this check refers to is TRUE
  G_M_POCGOC:
    name: Payment obligation on capital goods for cancellation
    logic: ALL
    members:
    - A_SCOPE_CG_PM
    - A_PAYMENT_OBLIGATION
    description: The rule applies to capital goods or plant and machinery, and the required payment must be made.
outcomes:
  LE_VOSITV:
    outcome: VALUE_IS_TRANSACTION_VALUE
    expr: G_VOSITV_CONDITIONS
    module: M_VOSITV
    description: The value of the supply is determined to be the transaction value, defined as the price actually paid or
      payable, if the conditions are met.
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_DOPIL:
    outcome: ENTITY_IS_PERSON_AS_LEGAL_PERSON
    expr: A_LEGAL_PERSON_INCLUDED
    module: M_DOPIL
    description: An entity that is a legal person is within the term person for the purposes of this Act.
  LE_PAMEL:
    outcome: PLANT_AND_MACHINERY
    expr: A_SCOPE AND (G_CORE OR G_INCLUDED) AND NOT G_EXCLUDED
    module: M_PAMEL
    description: Within this Chapter or Chapter VI, an item is plant and machinery when it is qualifying fixed apparatus,
      equipment or machinery used for making outward supply, or when it is such foundation or structural support. In either
      case it must not be land, building or any other civil structure. Whether such
  LE_PAMET:
    outcome: PLANT_AND_MACHINERY_AS_DEFINED
    expr: A_CHAPTER_SCOPE AND G_CORE_PAMET AND NOT A_TELECOM_TOWER
    module: M_PAMET
    description: Within this Chapter or Chapter VI, an item is plant and machinery if it meets the main limb or the included
      foundation or structural support limb, and it is not a telecommunication tower.
  LE_PAMEP_PM:
    outcome: PLANT_AND_MACHINERY
    expr: A_SCOPE_PAMEP AND (G_CORE_PAMEP OR G_INCLUDED_PAMEP) AND NOT A_PIPELINE_OUT
    module: M_PAMEP
    description: Where the definition applies, an item is plant and machinery if it meets the core limb or is an included
      foundation or structural support. It must also not be a pipeline laid outside the factory premises.
  LE_PAMEP_NOT_PM:
    outcome: NOT_PLANT_AND_MACHINERY
    expr: A_SCOPE_PAMEP AND (NOT (G_CORE_PAMEP OR G_INCLUDED_PAMEP) OR A_PIPELINE_OUT)
    module: M_PAMEP
    description: Where the definition applies, an item is not plant and machinery if it meets neither the core limb nor the
      inclusion. An item is also not plant and machinery if it is a pipeline laid outside the factory premises. The pipeline
      exclusion overrides an otherwise qualifying item.
  LE_IFCOSS_EXTENT_OBLIGATION:
    outcome: IFCOSS_EXTENT_OBLIGATION
    expr: A_IFCOSS_EXTENT_OBLIGATION
    module: M_IFCOSS
    description: The invoice shall be issued to the extent of the supply made before such cessation. (Section 31(6), part
      of the law)
  LE_M_IOCNFEV_2:
    outcome: M_IOCNFEV_2
    expr: A_M_IOCNFEV_2
    module: M_IOCNFEV
    description: The taxable value charged in a tax invoice for the supply is found to exceed the correct taxable value (Section
      34(1), part of the law)
  LE_IODNFS_3:
    outcome: IODNFS_3
    expr: A_IODNFS_3
    module: M_IODNFS
    description: The taxable value charged in that tax invoice is found to be less than the taxable value payable in respect
      of such supply. (Section 34(3), part of the law)
  LE_M_NTIBTH_2:
    outcome: M_NTIBTH_2
    expr: A_M_NTIBTH_2
    module: M_NTIBTH
    description: The value of the goods or services or both supplied is less than two hundred rupees (Section 31(3), part
      of the law)
  LE_NBOSBTH_2:
    outcome: NBOSBTH_2
    expr: A_NBOSBTH_2
    module: M_NBOSBTH
    description: The value of the goods or services or both supplied is less than two hundred rupees (Section 31(3)(c) Proviso,
      part of the law)
  LE_M_RPOOD:
    outcome: DEEMED_RELATED_PERSONS
    expr: G_M_RPOOD_1
    module: M_RPOOD
    description: Persons are deemed to be related if they are officers or directors of one another's businesses.
  LE_RPLRP:
    outcome: PD_RPLRP
    expr: A_RPLRP
    module: M_RPLRP
  LE_M_RPEAE:
    outcome: PERSONS_DEEMED_RELATED
    expr: A_M_RPEAE_1
    module: M_RPEAE
    description: If the condition is met, the persons are deemed to be related persons for the purposes of the Act.
  LE_RP25PS:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RP25PS
    module: M_RP25PS
    description: The legal outcome is that the persons are deemed to be related if the condition is met.
  LE_RPDIC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_CONTROL
    module: M_RPDIC
    description: The legal outcome is that the persons are deemed to be 'related persons' for the purposes of the Act.
  LE_M_RPCC:
    outcome: RELATED_PERSONS_DEEMED
    expr: G_M_RPCC
    module: M_RPCC
    description: The persons are deemed to be related persons if the condition of common control is met.
  LE_RPJC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RPJC_1
    module: M_RPJC
  LE_RPSFM:
    outcome: PERSONS_DEEMED_RELATED_PERSONS
    expr: A_FAMILY_MEMBERS
    module: M_RPSFM
    description: Persons are deemed to be related persons for the purposes of this Act if they are members of the same family
  LE_RPSAD:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_SOLE_ROLE
    module: M_RPSAD
    description: Where the persons are associated in the business of one another in that one is the sole agent or sole distributor
      or sole concessionaire of the other howsoever described then they shall be deemed to be related for the purposes of
      this Act
  LE_IOOTIV:
    outcome: VALUE_OF_SUPPLY_INCLUDES_LEVY
    expr: G_LEVY_KIND AND A_LAW_OTHER AND A_SEPARATE
    module: M_IOOTIV
    description: The amount is a tax, duty, cess, fee or charge. It is levied under a law in force other than the four GST
      laws. It is charged separately by the supplier. The value of supply shall then include it.
  LE_M_RISLI:
    outcome: VALUE_INCLUDES_RECIPIENT_INCURRED_AMOUNT
    expr: A_M_RISLI_1 AND A_M_RISLI_2 AND A_M_RISLI_3
    module: M_RISLI
    description: The amount is included in the value of supply if all three conditions are met.
  LE_M_IOIEIV:
    outcome: VALUE_INCLUDES_CHARGES
    expr: A_M_IOIEIV_1 OR A_M_IOIEIV_2
    module: M_IOIEIV
    description: The value of supply includes incidental expenses or other ancillary charges incurred at or before the time
      of supply.
  LE_M_IOIFDP:
    outcome: VALUE_INCLUDES_DELAY_CHARGE
    expr: G_M_IOIFDP_1
    module: M_IOIFDP
  LE_VISLTP:
    outcome: SUBSIDY_INCLUDED_IN_VALUE
    expr: A_SUBSIDY_PRICE_LINKED AND NOT G_GOVT_SUBSIDY
    module: M_VISLTP
    description: The value of supply shall include a subsidy directly linked to the price unless that subsidy is provided
      by the Central Government or a State Government
  LE_SAIIVE:
    outcome: SUBSIDY_AMOUNT_INCLUDED_IN_SUPPLIER_VALUE
    expr: G_SAIIVE_CONDITIONS
    module: M_SAIIVE
    description: Where the subsidy is being considered for the purposes of Section 15(2) and the supplier receives it, the
      amount of subsidy shall be included in that supplier's value of supply
  LE_DBOAS:
    outcome: DISCOUNT_EXCLUDED_FROM_VALUE
    expr: G_DISC_TIMING AND A_DISC_RECORDED
    module: M_DBOAS
    description: The value of the supply shall not include the discount when it is given before or at the time of the supply
      AND it has been duly recorded in the invoice issued in respect of that supply.
  LE_PSDAC:
    outcome: VALUE_SHALL_NOT_INCLUDE_DISCOUNT
    expr: G_PSDAC_CONDITIONS
    module: M_PSDAC
    description: The value of the supply shall not include the discount when the amount is a discount AND it is given after
      the supply AND it is established by an agreement at or before the supply AND it is specifically linked to relevant invoices
  LE_PSDIR:
    outcome: DISCOUNT_EXCLUDED_FROM_VALUE
    expr: G_PSDIR_COND
    module: M_PSDIR
    description: The value of the supply shall not include the discount when it was given after the supply and the attributable
      input tax credit on the supplier's document has been reversed by the recipient.
  LE_M_VCBDPM:
    outcome: USE_PRESCRIBED_VALUATION_RULES
    expr: PD_VOSITV
    module: M_VCBDPM
    description: The value shall be determined using the prescribed valuation rules.
  LE_M_NSVD:
    outcome: PRESCRIBED_VALUATION_APPLIES
    expr: G_M_NSVD_1
    module: M_NSVD
    description: If a supply is notified by the government (on council recommendation) and a valuation manner is prescribed,
      then that prescribed manner applies, overriding general valuation rules.
  LE_M_POCGOC:
    outcome: OBLIGATION_MET
    expr: G_M_POCGOC
    module: M_POCGOC
    description: The obligation to pay the required amount on capital goods or plant and machinery at the time of cancellation
      is met.
triggers:
  CT_IOOTIV_1:
    question: Is an amount labelled other than tax, duty, cess, fee or charge in substance a charge levied under a law in
      force?
    trigger: F_SUPPLY_LEVY_NATURE = 'OTHER'
    beside: LE_IOOTIV
products:
  PD_VOSITV:
    statement: The value of the supply is determined to be the transaction value, defined as the price actually paid or payable,
      if the conditions are met.
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_DOPIL:
    statement: An entity that is a legal person is within the term person for the purposes of this Act.
  PD_PAMEL:
    statement: Within this Chapter or Chapter VI, an item is plant and machinery when it is qualifying fixed apparatus, equipment
      or machinery used for making outward supply, or when it is such foundation or structural support. In either case it
      must not be land, building or any other civil structure. Whether such
  PD_PAMET:
    statement: Within this Chapter or Chapter VI, an item is plant and machinery if it meets the main limb or the included
      foundation or structural support limb, and it is not a telecommunication tower.
  PD_PAMEP_PM:
    statement: Where the definition applies, an item is plant and machinery if it meets the core limb or is an included foundation
      or structural support. It must also not be a pipeline laid outside the factory premises.
  PD_PAMEP_NOT_PM:
    statement: Where the definition applies, an item is not plant and machinery if it meets neither the core limb nor the
      inclusion. An item is also not plant and machinery if it is a pipeline laid outside the factory premises. The pipeline
      exclusion overrides an otherwise qualifying item.
  PD_IFCOSS_EXTENT_OBLIGATION:
    statement: The invoice shall be issued to the extent of the supply made before such cessation.
