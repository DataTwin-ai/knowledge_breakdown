# GOVERNANCE MASTER TSG04_05 Related / distinct persons & agents (TG04 Value)
# LAW ARC - 13 laws - status NEEDS_REVIEW
name: TSG04_05 Related / distinct persons & agents - GOVERNANCE MASTER rulebook
version: TSG04_05
facts:
  F_TRANSACTION_PARTIES_RELATED:
    name: Supplier and recipient are related parties
    type: BOOLEAN
    tier: T1
  F_SUPPLY_PRICE_IS_SOLE_CONSIDERATION:
    name: Price is the sole consideration for the supply
    type: BOOLEAN
    tier: T1
  F_RELATIONSHIP_P1_ROLE_IN_P2:
    name: Role of person 1 in person 2's business
    type: CODE
    options:
    - OFFICER
    - DIRECTOR
    - OTHER
    - NONE
    tier: T1
  F_RELATIONSHIP_P2_ROLE_IN_P1:
    name: Role of person 2 in person 1's business
    type: CODE
    options:
    - OFFICER
    - DIRECTOR
    - OTHER
    - NONE
    tier: T1
  F_RELATIONSHIP_LEGAL_FORM:
    name: Legal form of relationship between persons
    type: CODE
    options:
    - DIRECTOR
    - EMPLOYER
    - FAMILY
    - NONE
    - PARTNERSHIP
    tier: T1
  F_PERSONS_OWNERSHIP_CONTROL_RECORDS:
    name: Ownership and control records for the two persons
    type: TEXT
    tier: T1
  F_JOINT_CONTROL_EVIDENCE:
    name: Evidence of joint control by two persons over a third person
    type: TEXT
    tier: T1
  F_RELATIONSHIP_SOLE_ROLE:
    name: Sole role of one person in the business of the other
    type: CODE
    options:
    - SOLE_AGENT
    - SOLE_DISTRIBUTOR
    - SOLE_CONCESSIONAIRE
    - NONE
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
predicates:
  A_VOSITV_01:
    statement: the supplier and the recipient of the supply are not related
    order: LOW
    rule: F_TRANSACTION_PARTIES_RELATED = FALSE
  A_VOSITV_02:
    statement: the price is the sole consideration for the supply
    order: LOW
    rule: F_SUPPLY_PRICE_IS_SOLE_CONSIDERATION = TRUE
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_M_RPOOD_1:
    statement: One person is an officer or director of the other person's business.
    order: LOW
    rule: F_RELATIONSHIP_P1_ROLE_IN_P2 IN ['OFFICER', 'DIRECTOR']
  A_M_RPOOD_2:
    statement: The other person is an officer or director of the first person's business.
    order: LOW
    rule: F_RELATIONSHIP_P2_ROLE_IN_P1 IN ['OFFICER', 'DIRECTOR']
  A_RPLRP:
    statement: The persons are legally recognised partners in business.
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'PARTNERSHIP'
  A_M_RPEAE_1:
    statement: The persons are employer and employee.
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'EMPLOYER'
  A_RP25PS_OWNS:
    statement: A person directly or indirectly owns twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly OWN 25% or more of the outstanding
      voting stock or shares in BOTH of the two persons being evaluated?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RP25PS_CONTROLS:
    statement: A person directly or indirectly controls twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly CONTROL 25% or more of the
      outstanding voting stock or shares in BOTH of the two persons being evaluated? This can be through means other than
      direct ownership.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RP25PS_HOLDS:
    statement: A person directly or indirectly holds twenty-five per cent or more of the outstanding voting stock or shares
      of both of them.
    order: HIGH
    interpretation: Based on the provided records, does any single person directly or indirectly HOLD 25% or more of the outstanding
      voting stock or shares in BOTH of the two persons being evaluated? This covers various forms of holding, including beneficial
      ownership.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_DIRECT_CONTROL:
    statement: One person directly controls the other person.
    order: HIGH
    interpretation: Based on the provided records, does one person directly control the other? This typically involves majority
      shareholding, voting rights, or power to appoint a majority of directors.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_INDIRECT_CONTROL:
    statement: One person indirectly controls the other person.
    order: HIGH
    interpretation: Based on the provided records, does one person indirectly control the other? This can occur through a
      chain of intermediaries or common control by a third party.
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_DIRECT_CONTROL_RPCC:
    statement: Both persons are directly controlled by a third person.
    order: HIGH
    interpretation: Based on ownership and control records, are both persons directly controlled by a common third person
      (e.g., via majority shareholding or board control)?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_INDIRECT_CONTROL_RPCC:
    statement: Both persons are indirectly controlled by a third person.
    order: HIGH
    interpretation: Based on ownership and control records, are both persons indirectly controlled by a common third person
      (e.g., through a chain of intermediary entities)?
    grounding:
    - F_PERSONS_OWNERSHIP_CONTROL_RECORDS
  A_RPJC_1:
    statement: Two persons together directly control a third person
    order: HIGH
    interpretation: Based on the evidence, do the two persons being evaluated together directly control a third person?
    grounding:
    - F_JOINT_CONTROL_EVIDENCE
  A_RPJC_2:
    statement: Two persons together indirectly control a third person
    order: HIGH
    interpretation: Based on the evidence, do the two persons being evaluated together indirectly control a third person?
    grounding:
    - F_JOINT_CONTROL_EVIDENCE
  A_FAMILY_MEMBERS:
    statement: The persons are members of the same family
    order: LOW
    rule: F_RELATIONSHIP_LEGAL_FORM = 'FAMILY'
  A_SOLE_AGENT:
    statement: The persons are associated in the business of one another in that one is the sole agent, howsoever described,
      of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_AGENT'
  A_SOLE_DISTRIBUTOR:
    statement: The persons are associated in the business of one another in that one is the sole distributor, howsoever described,
      of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_DISTRIBUTOR'
  A_SOLE_CONCESSIONAIRE:
    statement: The persons are associated in the business of one another in that one is the sole concessionaire, howsoever
      described, of the other
    order: LOW
    rule: F_RELATIONSHIP_SOLE_ROLE = 'SOLE_CONCESSIONAIRE'
groups:
  G_VOSITV_CONDITIONS:
    name: Conditions for accepting transaction value
    logic: ALL
    members:
    - A_VOSITV_01
    - A_VOSITV_02
    description: 'Both conditions must be met: the parties are not related AND the price is the sole consideration for the
      supply.'
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_M_RPOOD_1:
    name: Reciprocal Officer/Director Roles
    logic: ALL
    members:
    - A_M_RPOOD_1
    - A_M_RPOOD_2
  G_RP25PS:
    name: Holding Condition
    logic: ANY
    members:
    - A_RP25PS_OWNS
    - A_RP25PS_CONTROLS
    - A_RP25PS_HOLDS
    description: The condition is met if any of the holding types (owns, controls, or holds) by a third party are satisfied.
  G_CONTROL:
    name: Test for Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL
    - A_INDIRECT_CONTROL
    description: A test to determine if one person controls another, either directly or indirectly.
  G_M_RPCC:
    name: Common Control
    logic: ANY
    members:
    - A_DIRECT_CONTROL_RPCC
    - A_INDIRECT_CONTROL_RPCC
    description: The condition is met if there is either direct or indirect control by a common third person.
  G_RPJC_1:
    name: Joint control of a third person
    logic: ANY
    members:
    - A_RPJC_1
    - A_RPJC_2
  G_SOLE_ROLE:
    name: Sole agent or sole distributor or sole concessionaire
    logic: ANY
    members:
    - A_SOLE_AGENT
    - A_SOLE_DISTRIBUTOR
    - A_SOLE_CONCESSIONAIRE
    description: Any one of the three sole-role relationships is enough
outcomes:
  LE_VOSITV:
    outcome: VALUE_IS_TRANSACTION_VALUE
    expr: G_VOSITV_CONDITIONS
    module: M_VOSITV
    description: The value of the supply is determined to be the transaction value, defined as the price actually paid or
      payable, if the conditions are met.
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_M_RPOOD:
    outcome: DEEMED_RELATED_PERSONS
    expr: G_M_RPOOD_1
    module: M_RPOOD
    description: Persons are deemed to be related if they are officers or directors of one another's businesses.
  LE_RPLRP:
    outcome: PD_RPLRP
    expr: A_RPLRP
    module: M_RPLRP
  LE_M_RPEAE:
    outcome: PERSONS_DEEMED_RELATED
    expr: A_M_RPEAE_1
    module: M_RPEAE
    description: If the condition is met, the persons are deemed to be related persons for the purposes of the Act.
  LE_RP25PS:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RP25PS
    module: M_RP25PS
    description: The legal outcome is that the persons are deemed to be related if the condition is met.
  LE_RPDIC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_CONTROL
    module: M_RPDIC
    description: The legal outcome is that the persons are deemed to be 'related persons' for the purposes of the Act.
  LE_M_RPCC:
    outcome: RELATED_PERSONS_DEEMED
    expr: G_M_RPCC
    module: M_RPCC
    description: The persons are deemed to be related persons if the condition of common control is met.
  LE_RPJC:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_RPJC_1
    module: M_RPJC
  LE_RPSFM:
    outcome: PERSONS_DEEMED_RELATED_PERSONS
    expr: A_FAMILY_MEMBERS
    module: M_RPSFM
    description: Persons are deemed to be related persons for the purposes of this Act if they are members of the same family
  LE_RPSAD:
    outcome: PERSONS_DEEMED_RELATED
    expr: G_SOLE_ROLE
    module: M_RPSAD
    description: Where the persons are associated in the business of one another in that one is the sole agent or sole distributor
      or sole concessionaire of the other howsoever described then they shall be deemed to be related for the purposes of
      this Act
products:
  PD_VOSITV:
    statement: The value of the supply is determined to be the transaction value, defined as the price actually paid or payable,
      if the conditions are met.
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_M_RPOOD:
    statement: Persons are deemed to be related if they are officers or directors of one another's businesses.
  PD_RPLRP:
    statement: PD_RPLRP
  PD_M_RPEAE:
    statement: If the condition is met, the persons are deemed to be related persons for the purposes of the Act.
  PD_RP25PS:
    statement: The legal outcome is that the persons are deemed to be related if the condition is met.
  PD_RPDIC:
    statement: The legal outcome is that the persons are deemed to be 'related persons' for the purposes of the Act.
  PD_M_RPCC:
    statement: The persons are deemed to be related persons if the condition of common control is met.
  PD_RPJC:
    statement: PERSONS_DEEMED_RELATED
  PD_RPSFM:
    statement: Persons are deemed to be related persons for the purposes of this Act if they are members of the same family
  PD_RPSAD:
    statement: Where the persons are associated in the business of one another in that one is the sole agent or sole distributor
      or sole concessionaire of the other howsoever described then they shall be deemed to be related for the purposes of
      this Act
compounds:
- id: C_VOSITV
  question: 'Section 15(1): Value Of Supply Is Transaction Value?'
  includes:
  - LE_VOSITV
  produces:
  - product: PD_VOSITV
    from:
    - LE_VOSITV
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_S15_E1_CA
  question: 'Section 15, Explanation (a): which clause applies?'
  includes:
  - LE_M_RPOOD
  - LE_RPLRP
  - LE_M_RPEAE
  - LE_RP25PS
  - LE_RPDIC
  - LE_M_RPCC
  - LE_RPJC
  - LE_RPSFM
  produces:
  - product: PD_M_RPOOD
    from:
    - LE_M_RPOOD
  - product: PD_RPLRP
    from:
    - LE_RPLRP
  - product: PD_M_RPEAE
    from:
    - LE_M_RPEAE
  - product: PD_RP25PS
    from:
    - LE_RP25PS
  - product: PD_RPDIC
    from:
    - LE_RPDIC
  - product: PD_M_RPCC
    from:
    - LE_M_RPCC
  - product: PD_RPJC
    from:
    - LE_RPJC
  - product: PD_RPSFM
    from:
    - LE_RPSFM
- id: C_RPSAD
  question: 'Section 15, Explanation (c): Related Persons Sole Agent Distributor?'
  includes:
  - LE_RPSAD
  produces:
  - product: PD_RPSAD
    from:
    - LE_RPSAD
