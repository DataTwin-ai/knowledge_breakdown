# GOVERNANCE MASTER TSG05_05 Tax period & reporting period (TG05 Time & Period)
# LAW ARC - 4 laws - status APPROVED
name: TSG05_05 Tax period & reporting period - GOVERNANCE MASTER rulebook
version: TSG05_05
facts:
  F_NCD2:
    name: Notified Class Description
    type: TEXT
    tier: T1
  F_PPD:
    name: Person Profile Data
    type: TEXT
    tier: T1
  F_RPB:
    name: Return Period Basis
    type: CODE
    options:
    - QUARTER_OR_PART
    - OTHER
    - UNKNOWN
    tier: T1
  F_NCT:
    name: Notified Conditions Text
    type: TEXT
    tier: T1
  F_NOCR:
    name: Notification On Council Recommendation
    type: BOOLEAN
    tier: T1
  F_RPS:
    name: Registered Person Status
    type: CODE
    options:
    - NOT_REGISTERED
    - REGISTERED
    - UNKNOWN
    tier: T0
  F_RPB2:
    name: Return Period Basis
    type: CODE
    options:
    - CALENDAR_MONTH_OR_PART
    - OTHER
    - UNKNOWN
    tier: T0
  F_TPOR:
    name: Tax Period Of Return
    type: AMOUNT
    tier: T0
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_GPTNQR_A_GNCOP:
    statement: The Government has exercised its power (may) to notify a certain class of registered persons
    order: LOW
    rule: F_NCD2 IS_SET
    handler: python
  M_GPTNQR_A_PFWNC:
    statement: The person falls within the certain class of registered persons notified by the Government
    order: HIGH
    interpretation: Does the person, as shown by the profile data, fall within the class description given in the notification?
      Only the notified class is covered, not all registered persons.
    grounding:
    - F_NCD2
    - F_PPD
    handler: light
  M_GPTNQR_A_NPQR:
    statement: The notified class shall furnish a return for every quarter or part thereof
    order: LOW
    rule: F_RPB = 'QUARTER_OR_PART'
    handler: python
  M_GPTNQR_A_NCAS:
    statement: The person satisfies such conditions and restrictions, if any, as are specified in the notification, to which
      the quarterly return requirement is subject
    order: HIGH
    interpretation: Read the conditions and restrictions text of the notification. If it specifies none, nothing needs to
      be met. Otherwise, do the person's records show that the person meets each condition and restriction listed?
    grounding:
    - F_NCT
    - F_PPD
    handler: heavy
  M_NRCCOS_A_NOCR:
    statement: The Government specifies the category of supply by notification issued on the recommendations of the Council
    order: LOW
    rule: F_NOCR = TRUE
    handler: python
  M_ROFOSD_A_PIRP:
    statement: The person furnishing the details of outward supplies is a registered person.
    order: LOW
    rule: F_RPS = 'REGISTERED'
    handler: python
  M_FORBRP_A_RFCMOP:
    statement: The return is furnished for every calendar month or part thereof
    order: LOW
    rule: F_RPB2 = 'CALENDAR_MONTH_OR_PART'
    handler: python
  M_FOSD_A_SEDTP:
    statement: The outward supplies were effected during a tax period and the details relate to that tax period
    order: HIGH
    interpretation: Were the outward supplies furnished effected during the tax period to which the furnished details relate?
    grounding:
    - F_TPOR
    handler: light
groups:
  M_GPTNQR_G_VNOC:
    name: Valid Notification Of Class
    logic: ALL
    members:
    - M_GPTNQR_A_GNCOP
    - M_NRCCOS_A_NOCR
    description: The Government has notified a class of registered persons and the notification was made on the recommendations
      of the Council.
outcomes:
  M_GPTNQR_LE_QROA:
    outcome: QUARTERLY_RETURN_OBLIGATION_ARISES
    expr: M_GPTNQR_G_VNOC AND M_ROFOSD_A_PIRP AND M_GPTNQR_A_PFWNC AND M_GPTNQR_A_NPQR AND M_GPTNQR_A_NCAS
    module: M_GPTNQR
    description: A registered person in a class notified by the Government on the Council's recommendation must furnish a
      return for every quarter or part thereof, subject to the conditions and restrictions specified in the notification.
  M_GPTNQR_LE_PFWNC:
    outcome: TAXABLE_PERSON_IN_NOTIFIED_CLASS
    expr: M_GPTNQR_A_PFWNC
    module: M_CEOFTL
    description: The person falls within the certain class of registered persons notified by the Government (Section 37(1),
      second proviso, part of the law)
  M_FORBRP_LE_RFCMOP:
    outcome: RETURN_FOR_CALENDAR_MONTH_OR_PART
    expr: M_FORBRP_A_RFCMOP
    module: M_FORBRP
    description: The return is furnished for every calendar month or part thereof (Section 39(1), part of the law)
  M_FOSD_LE_SEDTP:
    outcome: SUPPLIES_EFFECTED_DURING_TAX_PERIOD
    expr: M_FOSD_A_SEDTP
    module: M_FOSD
    description: The outward supplies were effected during a tax period and the details relate to that tax period (Section
      37(1), part of the law)
products:
  M_GPTNQR_PD_QROA:
    statement: A registered person in a class notified by the Government on the Council's recommendation must furnish a return
      for every quarter or part thereof, subject to the conditions and restrictions specified in the notification.
  M_GPTNQR_PD_PFWNC:
    statement: The taxable person falls within the class of taxable persons specified in the notification for which the time
      limit is extended
  M_FORBRP_PD_RFCMOP:
    statement: The return is furnished for every calendar month or part thereof
  M_FOSD_PD_SEDTP:
    statement: The outward supplies were effected during a tax period and the details relate to that tax period
compounds:
- id: C_GPTNQR
  question: 'Section 39(1), proviso: Government Power To Notify Quarterly Returns?'
  includes:
  - M_GPTNQR_LE_QROA
  produces:
  - product: M_GPTNQR_PD_QROA
    from:
    - M_GPTNQR_LE_QROA
- id: C_CEOFTL
  question: The person falls within the certain class of registered persons notified by the Government? (Section 37(1), second
    proviso)
  includes:
  - M_GPTNQR_LE_PFWNC
  produces:
  - product: M_GPTNQR_PD_PFWNC
    from:
    - M_GPTNQR_LE_PFWNC
- id: C_FORBRP
  question: The return is furnished for every calendar month or part thereof? (Section 39(1))
  includes:
  - M_FORBRP_LE_RFCMOP
  produces:
  - product: M_FORBRP_PD_RFCMOP
    from:
    - M_FORBRP_LE_RFCMOP
- id: C_FOSD
  question: The outward supplies were effected during a tax period and the details relate to that tax period? (Section 37(1))
  includes:
  - M_FOSD_LE_SEDTP
  produces:
  - product: M_FOSD_PD_SEDTP
    from:
    - M_FOSD_LE_SEDTP
time:
  law_date: F_DOI
