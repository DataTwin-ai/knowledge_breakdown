outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_1:
    outcome: TIME_OF_SUPPLY_IS_INVOICE_DATE
    expr: A_1 AND A_2 AND A_3
    module: M_TRCSBIB
    description: The time of supply is the date of the invoice.
  LE_DODOROP:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_DETERMINED
    expr: A_PURPOSE AND G_EVENTS AND A_EARLIER
    module: M_DODOROP
    description: The date of receipt of payment is determined under this Explanation when the term is applied for this section
      and at least one of the two dated events is evidenced, and the earlier date prevails.
  LE_BANK_CREDIT_DATE:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_IS_DATE_OF_CREDIT_IN_BANK_ACCOUNT
    expr: A_CREDIT_AFTER_4WD
    module: M_DOPCIBA
    description: The date of receipt of payment shall be the date of credit in the bank account if the credit is after four
      working days from the date of change in the rate of tax
  LE_LAATOS:
    outcome: TAX_LIABILITY_ON_GOODS_ARISES_AT_TIME_OF_SUPPLY
    expr: G_LAATOS
    module: M_LAATOS
    description: Where the liability to pay tax is on goods and the time of supply has been determined under the provisions
      of this section, the liability to pay tax arises at that time of supply.
  LE_TOS_INV:
    outcome: TIME_OF_SUPPLY_GOODS_IS_INVOICE_ISSUE_DATE
    expr: G_TOS_PREREQ AND A_INV_FIRST
    module: M_TOSIID
    description: The time of supply of goods is the date of issue of invoice by the supplier when that date is earlier than
      the section 31 last date or the same as it.
  LE_TOS_LAST:
    outcome: TIME_OF_SUPPLY_GOODS_IS_SECTION_31_LAST_DATE
    expr: G_TOS_PREREQ AND A_LAST_FIRST
    module: M_TOSIID
    description: The time of supply of goods is the last date on which the supplier is required under section 31 to issue
      the invoice when that last date is earlier than the date of issue of invoice. This also applies when it is confirmed
      that no invoice was issued by that last date.
  LE_TOSIPD_CAND:
    outcome: PAYMENT_RECEIPT_DATE_IS_LISTED_CANDIDATE_DATE
    expr: G_TOSIPD_CAND
    module: M_TOSIPD
    description: For a supply of goods, the date on which the supplier receives the payment with respect to the supply is
      one of the dates that enters the earlier-of comparison.
  LE_TOSIPD:
    outcome: TIME_OF_SUPPLY_GOODS_IS_PAYMENT_RECEIPT_DATE
    expr: G_TOSIPD_ALL
    module: M_TOSIPD
    description: The time of supply of goods shall be the date on which the supplier receives the payment with respect to
      the supply where that date is the earlier of the listed dates.
  LE_DSTEOI:
    outcome: DEEMED_SUPPLY_MADE
    expr: G_DSTEOI_TRIGGERS
    module: M_DSTEOI
  LE_DOROPD:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_DETERMINED
    expr: A_FOR_CLAUSE_B AND G_DATE_EVENTS AND A_EARLIER_DATE
    module: M_DOROPD
    description: When clause (b) is being applied, the date on which the supplier receives the payment is the earlier of the
      books-entry date and the bank-credit date.
  LE_TOSFEA:
    outcome: TIME_OF_SUPPLY_OF_EXCESS_AMOUNT_IS_DATE_OF_ISSUE_OF_INVOICE_IN_RESPECT_OF_EXCESS_AMOUNT
    expr: G_EXCESS_RECEIPT_CONDITIONS AND A_SUPPLIER_OPTION
    module: M_TOSFEA
    description: If the supplier of taxable goods receives an excess of up to Rs 1000 over the invoice amount and opts for
      it, the time of supply to the extent of the excess amount is the date of issue of invoice in respect of that excess
      amount.
  LE_RTOSRD:
    outcome: RCM_GOODS_RECEIPT_DATE_IS_CANDIDATE_TIME_OF_SUPPLY
    expr: A_RCM_SUPPLY AND A_GOODS_RECEIPT_DATE
    module: M_RTOSRD
    description: If tax on the supply is paid or liable to be paid on reverse charge basis, the date of the receipt of goods
      enters the earliest-of comparison for the time of supply under the parent subsection.
  LE_RTOSPD:
    outcome: RCM_CLAUSE_B_CANDIDATE_DATE_IS_EARLIER_RECIPIENT_PAYMENT_DATE
    expr: A_RCM AND G_PAYMENT_DATE AND A_EARLIER_RTOSPD
    module: M_RTOSPD
    description: The supply is one on which tax is paid or liable to be paid on reverse charge basis, and at least one recipient
      payment date exists. The earlier of the recipient's books-entry date and bank-debit date is therefore this clause's
      candidate date. The time of supply shall be the earliest of this date an
  LE_TOSGRCI:
    outcome: CLAUSE_12_3_C_CANDIDATE_DATE_ESTABLISHED
    expr: A_RCM_TOSGRCI AND G_DOC AND A_THIRTY_DAY_DATE
    module: M_TOSGRCI
    description: For a reverse charge supply, a supplier-issued invoice or a document in lieu of it gives the clause (c) candidate
      date. That date is the date immediately following thirty days from the date of issue.
  LE_TOSGRCI_EARLIEST:
    outcome: TIME_OF_SUPPLY_NOT_LATER_THAN_CLAUSE_C_DATE
    expr: A_RCM_TOSGRCI AND G_DOC AND A_THIRTY_DAY_DATE AND A_EARLIEST
    module: M_TOSGRCI
    description: For a reverse charge supply, the time of supply shall be the earliest of the listed dates. Where the clause
      (c) date is established, the time of supply is not later than that date. The other listed dates come from sibling clauses
      of the parent CGSTA17_S12_SS3 and are not determined here.
  LE_RRTOS:
    outcome: TIME_OF_SUPPLY_IS_RECIPIENT_BOOKS_ENTRY_DATE
    expr: G_NOT_DETERMINABLE AND A_BOOKS_DATE
    module: M_RRTOS
    description: The time of supply is the recipient's books entry date only when no route under clause (a), (b) or (c) yields
      a time of supply.
  LE_TOSVI:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_ISSUE_OF_VOUCHER
    expr: G_VOUCHER_TOS
    module: M_TOSVI
    description: When vouchers are supplied by a supplier and the supply is identifiable at the point of issue of the voucher,
      the time of supply shall be the date of issue of voucher.
  LE_TOSVR:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_REDEMPTION_DATE
    expr: G_TOSVR_COND
    module: M_TOSVR
    description: Where there is a supply of vouchers by a supplier and the case falls within all other cases, the time of
      supply shall be the date of redemption of voucher.
  LE_TOSUPR:
    outcome: TIME_OF_SUPPLY_IS_RETURN_FILING_DATE
    expr: G_UNDETERMINABLE AND A_PERIODICAL_RETURN
    module: M_TOSUPR
    description: If the time of supply is not determinable under any of sub-sections (2), (3) and (4), and a periodical return
      has to be filed in the case, the time of supply shall be the date on which that return is to be filed.
  LE_TOSUTP:
    outcome: TIME_OF_SUPPLY_IS_DATE_TAX_PAID
    expr: G_NONE_DETERMINABLE AND A_OTHER_CASE
    module: M_TOSUTP
    description: When the time of supply cannot be determined under any of sub-sections (2), (3) or (4), and the case is any
      other case within this residual clause, the time of supply shall be the date on which the tax is paid. The applicability
      of the rule does not depend on the tax having been paid. If the date of
  LE_LAATOS_LAATOS:
    outcome: TOS_SERVICES_GOVERNED_BY_S13
    expr: A_LAATOS_1 AND A_LAATOS_2
    module: M_LAATOS
    description: The liability to pay tax on services arises at the time of supply, and the time of supply is determined under
      the provisions of Section 13.
  LE_M_TOSIOP:
    outcome: PD_M_TOSIOP_TOS
    expr: G_M_TOSIOP_COND
    module: M_TOSIOP
    description: The time of supply is calculated if the applicability conditions are met.
  LE_DODOP:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_FIXED_FOR_CLAUSES_A_B
    expr: PD_M_TOSIOP AND G_EARLIER_DATE
    module: M_DODOP
    description: Where the date of receipt of payment is being determined for clauses (a) and (b) it is the earlier of the
      books-entry date and the bank-credit date.
  LE_TOS_PROVISION_DATE:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_PROVISION_OF_SERVICE
    expr: G_CLAUSE_B_TRIGGER AND A_PROVISION_EARLIER
    module: M_TOSSPOP
    description: Under Section 13(2)(b) the time of supply of services is the date of provision of service when the invoice
      is not issued within the section 31 period and that date is not later than the date of receipt of payment
  LE_TOS_PAYMENT_DATE:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_RECEIPT_OF_PAYMENT
    expr: G_CLAUSE_B_TRIGGER AND A_PAYMENT_EARLIER
    module: M_TOSSPOP
    description: Under Section 13(2)(b) the time of supply of services is the date of receipt of payment when the invoice
      is not issued within the section 31 period and payment is received before the date of provision of service
  LE_TOSRB:
    outcome: TOS_SERVICES_DATE_UNDER_CLAUSE_C_IS_RECIPIENT_BOOKS_DATE
    expr: A_SERVICES AND A_BOOKS_TOSRB AND NOT G_CLAUSE_AB
    module: M_TOSRB
    description: 'This outcome applies where all of the following are true: the supply is of services, the recipient shows
      the receipt of services in his books of account, and neither clause (a) nor clause (b) applies. The date of that books
      entry is then the date under this clause in the earliest-of-the-following-da'
  LE_SDBIOP:
    outcome: SUPPLY_DEEMED_MADE_TO_EXTENT_COVERED
    expr: PD_M_TOSIOP AND G_COVER
    module: M_SDBIOP
    description: Where clauses (a) or (b) are being applied and the supply is covered by the invoice or the payment, the supply
      is deemed made to the extent of that coverage.
  LE_OFTOSFE:
    outcome: TIME_OF_SUPPLY_OF_EXCESS_AMOUNT_IS_DATE_OF_ISSUE_OF_INVOICE_FOR_EXCESS
    expr: G_PROVISO_CONDITIONS
    module: M_OFTOSFE
    description: When all proviso conditions hold, the time of supply to the extent of the excess amount only is the date
      of issue of the invoice relating to that excess amount.
  LE_TOS_RCM_PAYMENT:
    outcome: CLAUSE_A_DATE_IS_EARLIER_OF_RECIPIENT_BOOKS_PAYMENT_DATE_AND_BANK_DEBIT_DATE
    expr: A_RCM_SUPPLY_TOSRPD AND G_EARLIER_PAYMENT_DATE
    module: M_TOSRPD
    description: For a reverse charge supply, the date under clause (a) is the earlier of two dates. If the recipient's books
      entry date is earlier than or the same as the bank debit date, the books entry date is used. If the bank debit date
      is earlier, the bank debit date is used. Under Section 13(3), the time of s
  LE_TOSRSD:
    outcome: TIME_OF_SUPPLY_IS_SIXTY_DAY_DATE
    expr: A_RCM_SUPPLY_TOSRSD AND G_ISSUE_DOC AND A_SIXTY_DAY_DATE AND A_EARLIER_DATE_TOSRSD
    module: M_TOSRSD
    description: For a reverse charge supply, the time of supply is the date immediately following sixty days from the date
      the supplier issued the invoice or a document in lieu of it, when that date is the earlier of the following dates.
  LE_RRTOS_RRTOS:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_ENTRY_IN_RECIPIENT_BOOKS
    expr: A_RCM_SERVICES AND G_NOT_DETERMINABLE_RRTOS AND A_BOOKS_DATE_RRTOS
    module: M_RRTOS
    description: The recipient books-entry date is the time of supply only when the proviso is triggered, that is when neither
      clause (a) nor clause (b) can determine the time of supply.
  LE_TOS_BOOKS:
    outcome: TIME_OF_SUPPLY_IS_RECIPIENT_BOOKS_ENTRY_DATE
    expr: G_CONTEXT AND A_BOOKS_EARLIER
    module: M_RTOSFAE
    description: For a supply by associated enterprises with the service supplier outside India, the time of supply is the
      date of entry in the recipient's books when that date is the earlier date.
  LE_TOS_PAYMENT:
    outcome: TIME_OF_SUPPLY_IS_PAYMENT_DATE
    expr: G_CONTEXT AND A_PAYMENT_EARLIER_RTOSFAE
    module: M_RTOSFAE
    description: For a supply by associated enterprises with the service supplier outside India, the time of supply is the
      date of payment when that date is the earlier date.
  LE_TOSVI_TOSVI:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_ISSUE_DATE
    expr: G_VOUCHER_TOS_TOSVI
    module: M_TOSVI
    description: When the supply is a supply of vouchers by a supplier AND that supply is identifiable at the point of issue
      of the voucher, the time of supply shall be the date of issue of voucher.
  LE_TOSVR_TOSVR:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_REDEMPTION_OF_VOUCHER
    expr: G_VOUCHER_RESIDUAL AND A_REDEMPTION_DATE
    module: M_TOSVR
    description: If the supply is a supply of vouchers by a supplier and it falls in all other cases, the time of supply shall
      be the date of redemption of the voucher.
  LE_TOSRR:
    outcome: TIME_OF_SUPPLY_IS_RETURN_DUE_DATE
    expr: A_TOS_NOT_DETERMINABLE AND A_PERIODIC_RETURN_REQUIRED
    module: M_TOSRR
    description: Both conditions must hold. The time of supply is then mandatorily fixed as the date on which the periodical
      return is to be filed. This is the date the return is due, not the date it is actually filed.
  LE_TOSRTP:
    outcome: TIME_OF_SUPPLY_IS_DATE_TAX_PAID
    expr: G_TOSRTP_COND
    module: M_TOSRTP
    description: If the time of supply cannot be determined under sub-section (2), (3) or (4) and the case is any other case,
      the time of supply shall be the date on which the tax is paid. The tax payment date supplies the outcome date. It is
      not an additional condition
  LE_M_TOSAIV:
    outcome: TIME_OF_SUPPLY_FOR_ADDITION
    expr: G_M_TOSAIV_1
    module: M_TOSAIV
    description: If the conditions are met, the time of supply for the value addition is the date the supplier receives that
      amount.
triggers:
  CT_RETURN_DUE_DATE:
    question: Which periodical return has to be filed in this case and on what date is it to be filed?
    trigger: F_RETURN_PERIODICAL_FILING_REQUIRED = TRUE
    beside: LE_TOSUPR
  CT_NO_RECIPIENT_PAYMENT_DATE:
    question: Tax is paid or liable to be paid on reverse charge basis, but the recipient has neither entered the payment
      in his books nor had it debited in his bank account. Is the clause (a) date not yet determinable, so that only the other
      dates listed under Section 13(3) are relevant?
    trigger: F_SUPPLY_REVERSE_CHARGE_STATUS IN ['PAID','LIABLE_NOT_YET_PAID'] AND F_RECIPIENT_PAYMENT_DATE_ORDER = 'NONE'
    beside: LE_TOS_RCM_PAYMENT
