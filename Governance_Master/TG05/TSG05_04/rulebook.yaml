# GOVERNANCE MASTER TSG05_04 Rate change (TG05 Time & Period)
# LAW ARC - 36 laws - status NEEDS_REVIEW
name: TSG05_04 Rate change - GOVERNANCE MASTER rulebook
version: TSG05_04
facts:
  F_SUPPLY_TIMING_RATE_CHANGE:
    name: Timing of supply completion relative to tax rate change
    type: CODE
    options:
    - AFTER
    - BEFORE
    tier: T1
  F_INVOICE_TIMING_RATE_CHANGE:
    name: Timing of invoice issuance relative to tax rate change
    type: CODE
    options:
    - AFTER
    - BEFORE
    tier: T0
  F_PAYMENT_TIMING_RATE_CHANGE:
    name: Timing of payment receipt relative to tax rate change
    type: CODE
    options:
    - AFTER
    - BEFORE
    tier: T0
  F_PAYMENT_RECEIPT_DATE:
    name: Date of receipt of payment
    type: DATE
    tier: T1
  F_INVOICE_ISSUE_DATE:
    name: Date of issue of invoice
    type: DATE
    tier: T0
  F_PAYMENT_DATE_PURPOSE:
    name: Provision for which the date of receipt of payment is being determined
    type: CODE
    options:
    - THIS_SECTION
    - OTHER
    tier: T1
  F_PAYMENT_BOOKS_ENTRY_DATE:
    name: Date on which the payment is entered in the books of account of the supplier
    type: DATE
    tier: T0
  F_PAYMENT_BANK_CREDIT_DATE:
    name: Date on which the payment is credited to the bank account of the supplier
    type: DATE
    tier: T1
  F_PAYMENT_EARLIER_EVENT:
    name: Which of the books-entry date and the bank-credit date is earlier
    type: CODE
    options:
    - BOOKS_ENTRY
    - BANK_CREDIT
    - SAME_DATE
    tier: T1
  F_PAYMENT_WORKING_DAYS_CREDIT_AFTER_RATE_CHANGE:
    name: Number of working days from the date of change in the rate of tax to the date of credit of the payment in the bank
      account
    type: AMOUNT
    tier: T1
  F_SUPPLY_IS_GOODS:
    name: The supply is a supply of goods
    type: BOOLEAN
    tier: T1
  F_TIME_OF_SUPPLY_GOODS:
    name: Time of supply of the goods as determined under the provisions of Section 12
    type: DATE
    tier: T1
  F_INVOICE_DUE_DATE_S31:
    name: Last date on which the supplier is required under section 31 to issue the invoice with respect to the supply
    type: DATE
    tier: T1
  F_INVOICE_ISSUED_WITHIN_S31_PERIOD:
    name: Invoice issued within period prescribed under Sec 31
    type: BOOLEAN
    tier: T0
  F_SUPPLY_COVERED_BY_PAYMENT:
    name: Extent of supply covered by payment
    type: AMOUNT
    tier: T1
  F_SUPPLY_IS_TAXABLE:
    name: The supply is taxable under the Act
    type: BOOLEAN
    tier: T0
  F_PAYMENT_EXCESS_OVER_INVOICE:
    name: Amount received by the supplier in excess of the amount indicated in the tax invoice (zero if none)
    type: AMOUNT
    tier: T0
  F_SUPPLIER_OPTION_EXERCISED:
    name: Supplier has exercised the option that the date of issue of invoice be the time of supply of the excess amount
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TAX_ON_REVERSE_CHARGE:
    name: Tax on the supply is paid or liable to be paid on reverse charge basis
    type: BOOLEAN
    tier: T0
  F_GOODS_RECEIPT_DATE:
    name: Date of the receipt of goods
    type: DATE
    tier: T0
  F_PAYMENT_RECIPIENT_BOOKS_ENTRY_DATE:
    name: Date of payment as entered in the books of account of the recipient
    type: DATE
    tier: T0
  F_PAYMENT_RECIPIENT_BANK_DEBIT_DATE:
    name: Date on which the payment is debited in the bank account of the recipient
    type: DATE
    tier: T1
  F_PAYMENT_RECIPIENT_EARLIER_DATE:
    name: Earlier of the recipient's books-entry date and bank-debit date for the payment
    type: DATE
    tier: T0
  F_INVOICE_ISSUER:
    name: Person who issued the invoice relied on for the supply
    type: CODE
    options:
    - NONE
    - NONE_ISSUED
    - OTHER
    - RECIPIENT
    - SUPPLIER
    tier: T0
  F_DOCUMENT_ISSUER:
    name: Person who issued the document other than an invoice for the supply
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - OTHER
    - NONE_ISSUED
    tier: T0
  F_DOCUMENT_DESCRIPTION:
    name: Description and function of the document other than an invoice issued for the supply
    type: TEXT
    tier: T1
  F_DOCUMENT_ISSUE_DATE:
    name: Date of issue of the document other than an invoice issued for the supply
    type: DATE
    tier: T0
  F_RCM_THIRTY_DAY_FOLLOWING_DATE:
    name: Date immediately following thirty days from the date of issue of the supplier invoice or document in lieu thereof
    type: DATE
    tier: T0
  F_SUPPLY_TIME_NOT_AFTER_RCM_THIRTY_DAY_DATE:
    name: Time of supply of the goods falls on or before the date immediately following thirty days from the date of issue
      of the supplier invoice or document in lieu thereof
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TIME_AT_RECIPIENT_BOOKS_DATE:
    name: The time of supply of the goods falls on the date of entry of the supply in the books of account of the recipient
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_VOUCHER:
    name: The supply is a supply of vouchers by a supplier
    type: BOOLEAN
    tier: T1
  F_VOUCHER_DESCRIPTION:
    name: Description and terms of the voucher, including what can be obtained against it
    type: TEXT
    tier: T1
  F_VOUCHER_ISSUE_DATE:
    name: Date of issue of voucher
    type: DATE
    tier: T1
  F_RETURN_PERIODICAL_FILING_REQUIRED:
    name: A periodical return has to be filed in the case
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TIME_FIXED_BY_OTHER_CLAUSE:
    name: The time of supply for the case is fixed by another clause of the parent sub-section
    type: BOOLEAN
    tier: T0
  F_ADDITION_TYPE:
    name: Type of addition to value for delayed payment
    type: CODE
    options:
    - INTEREST
    - LATE_FEE
    - OTHER
    - PENALTY
    tier: T1
  F_SUPPLY_IS_SERVICE:
    name: The supply is a supply of services
    type: BOOLEAN
    tier: T1
  F_SERVICE_PAYMENT_DATE_ORDER:
    name: Which of the date of provision of service and the date of receipt of payment is earlier
    type: CODE
    options:
    - PROVISION_FIRST
    - SAME_DATE
    - PAYMENT_FIRST
    - PROVISION_ONLY
    - PAYMENT_ONLY
    tier: T1
  F_RECIPIENT_BOOKS_RECEIPT_DATE:
    name: Date on which the recipient shows the receipt of services in his books of account
    type: DATE
    tier: T0
  F_SERVICE_PROVISION_DATE:
    name: Date of provision of service
    type: DATE
    tier: T1
  F_SUPPLY_COVERED_BY_INVOICE:
    name: Extent of supply covered by invoice
    type: AMOUNT
    tier: T1
  F_PAYMENT_RECORDING_DATE_ORDER:
    name: Which of the date of entry in the supplier's books and the date of credit to his bank account is earlier
    type: CODE
    options:
    - BOOKS_FIRST
    - BANK_FIRST
    - SAME_DATE
    - BOOKS_ONLY
    - BANK_ONLY
    - NONE
    tier: T0
  F_SUPPLY_REVERSE_CHARGE_STATUS:
    name: Whether tax on the supply is paid or liable to be paid on reverse charge basis
    type: CODE
    options:
    - LIABLE_NOT_YET_PAID
    - NOT_REVERSE_CHARGE
    - PAID
    tier: T0
  F_RECIPIENT_PAYMENT_DATE_ORDER:
    name: Which of the recipient books entry date of payment and the recipient bank debit date is earlier
    type: CODE
    options:
    - BANK_FIRST
    - BANK_ONLY
    - BOOKS_FIRST
    - BOOKS_ONLY
    - NONE
    - SAME_DATE
    tier: T0
  F_DOCUMENT_IN_LIEU_DESCRIPTION:
    name: Name, issuer and purpose of the document claimed to be issued by the supplier in lieu of invoice
    type: TEXT
    tier: T1
  F_DOCUMENT_IN_LIEU_ISSUE_DATE:
    name: Date of issue by the supplier of any other document in lieu of invoice
    type: DATE
    tier: T1
  F_SUPPLY_RCM_SIXTY_DAY_DATE:
    name: Date immediately following sixty days from the date of issue of the supplier invoice or document in lieu thereof
    type: DATE
    tier: T1
  F_SUPPLY_RCM_DATE_ORDER:
    name: Order of the sixty-day date against the other following date for reverse charge time of supply
    type: CODE
    options:
    - SIXTY_DAY_DATE_EARLIER
    - SAME_DATE
    - OTHER_DATE_EARLIER
    - SIXTY_DAY_DATE_ONLY
    - NONE
    tier: T1
  F_SUPPLIER_ASSOCIATED_WITH_RECIPIENT:
    name: Supplier and recipient are associated enterprises
    type: BOOLEAN
    tier: T1
  F_PERSON_RELATIONSHIP_DESCRIPTION:
    name: Description of the relationship between supplier and recipient
    type: TEXT
    tier: T1
  F_SUPPLIER_LOCATED_OUTSIDE_INDIA:
    name: Supplier of service is located outside India
    type: BOOLEAN
    tier: T1
  F_SUPPLY_BOOKS_PAYMENT_DATE_ORDER:
    name: Which of the date of entry in the recipient's books and the date of payment is earlier
    type: CODE
    options:
    - BOOKS_FIRST
    - PAYMENT_FIRST
    - SAME_DATE
    - BOOKS_ONLY
    - PAYMENT_ONLY
    - NONE
    tier: T0
  F_VOUCHER_REDEMPTION_DATE:
    name: Date of redemption of voucher
    type: DATE
    tier: T0
  F_RETURN_PERIODICAL_REQUIRED:
    name: A periodical return has to be filed in the case concerned
    type: BOOLEAN
    tier: T0
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_1:
    statement: The goods or services or both have been supplied before the change in rate of tax
    order: LOW
    rule: F_SUPPLY_TIMING_RATE_CHANGE = 'BEFORE'
  A_2:
    statement: The invoice has been issued prior to the change in rate of tax
    order: LOW
    rule: F_INVOICE_TIMING_RATE_CHANGE = 'BEFORE'
  A_3:
    statement: Payment is received after the change in rate of tax
    order: LOW
    rule: F_PAYMENT_TIMING_RATE_CHANGE = 'AFTER'
  A_PURPOSE:
    statement: The expression "the date of receipt of payment" is being applied for the purposes of this section
    order: LOW
    rule: F_PAYMENT_DATE_PURPOSE = 'THIS_SECTION'
  A_BOOKS:
    statement: The payment is entered in the books of account of the supplier, and the date of that entry is a candidate for
      the date of receipt of payment
    order: LOW
    rule: F_PAYMENT_BOOKS_ENTRY_DATE IS_SET
  A_BANK:
    statement: The payment is credited to the bank account of the supplier, and the date of that credit is a candidate for
      the date of receipt of payment
    order: LOW
    rule: F_PAYMENT_BANK_CREDIT_DATE IS_SET
  A_EARLIER:
    statement: The date of receipt of payment shall be the date on which the payment is entered in the books of account of
      the supplier or the date on which the payment is credited to his bank account, whichever is earlier
    order: LOW
    rule: F_PAYMENT_EARLIER_EVENT IN ['BOOKS_ENTRY','BANK_CREDIT','SAME_DATE']
  A_CREDIT_AFTER_4WD:
    statement: The credit of the payment in the bank account is after four working days from the date of change in the rate
      of tax
    order: LOW
    rule: F_PAYMENT_WORKING_DAYS_CREDIT_AFTER_RATE_CHANGE > 4
  A_SUPPLY_IS_GOODS:
    statement: The liability to pay tax is a liability to pay tax on goods, that is the supply concerned is a supply of goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE
  A_TOS_DETERMINED_THIS_SECTION:
    statement: The time of supply, at which the liability to pay tax on goods shall arise, is determined in accordance with
      the provisions of this section
    order: LOW
    if_false: F_TIME_OF_SUPPLY_GOODS not available gives UNKNOWN and not automatic FALSE
    rule: F_TIME_OF_SUPPLY_GOODS IS_SET
  A_GOODS:
    statement: The time of supply being determined is the time of supply of goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE
  A_S31_DUE:
    statement: There is a last date on which the supplier is required, under section 31, to issue the invoice with respect
      to the supply, and that date is ascertained
    order: HIGH
    interpretation: On the facts of the supply, what is the last date on which the supplier is required under section 31 to
      issue the invoice with respect to the supply? The answer depends on section 31, which is not part of this MKP.
    grounding:
    - F_INVOICE_DUE_DATE_S31
  A_INV_FIRST:
    statement: The date of issue of invoice by the supplier is on or before the last date on which he is required, under section
      31, to issue the invoice with respect to the supply, so the date of issue of invoice is the earlier of the two dates
      for the time of supply of goods
    order: LOW
    rule: F_INVOICE_ISSUED_WITHIN_S31_PERIOD = TRUE
  A_LAST_FIRST:
    statement: The last date on which the supplier is required, under section 31, to issue the invoice with respect to the
      supply is earlier than the date of issue of invoice by the supplier, so that last date is the earlier of the two dates
      for the time of supply of goods
    order: LOW
    rule: F_INVOICE_ISSUED_WITHIN_S31_PERIOD = FALSE
  A_GOODS_TOSIPD:
    statement: The supply whose time of supply is being determined is a supply of goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE
  A_PAYRCPT:
    statement: The supplier receives the payment with respect to the supply, and the date on which the supplier receives that
      payment is established
    order: LOW
    rule: F_PAYMENT_RECEIPT_DATE IS_SET AND F_SUPPLY_COVERED_BY_PAYMENT > 0
  A_EARLIER_TOSIPD:
    statement: The date on which the supplier receives the payment with respect to the supply is the earlier of the dates
      listed for the time of supply of goods
    order: HIGH
    interpretation: Compared with the other dates listed in the parent sub-section, as supplied by the product PD_PARENT_DATES,
      is the date on which the supplier receives the payment with respect to the supply the earlier date, so that it is the
      time of supply of goods?
    grounding:
    - F_PAYMENT_RECEIPT_DATE
  A_BOOKS_ENTRY:
    statement: The payment is entered in the supplier's books of account on a date (the date on which the payment is entered
      in his books of account)
    order: LOW
    rule: F_PAYMENT_BOOKS_ENTRY_DATE IS_SET
  A_BANK_CREDIT:
    statement: The payment is credited to the supplier's bank account on a date (the date on which the payment is credited
      to his bank account)
    order: LOW
    rule: F_PAYMENT_BANK_CREDIT_DATE IS_SET
  A_EARLIER_DATE:
    statement: The date on which the supplier receives the payment shall be the date on which the payment is entered in his
      books of account or the date on which the payment is credited to his bank account, whichever is earlier
    order: LOW
    rule: F_PAYMENT_RECEIPT_DATE IS_SET
  A_SUPPLY_TAXABLE_GOODS:
    statement: The supplier receiving the amount is a supplier of taxable goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE AND F_SUPPLY_IS_TAXABLE = TRUE
  A_EXCESS_AMOUNT_RECEIVED:
    statement: The supplier receives an amount in excess of the amount indicated in the tax invoice
    order: LOW
    rule: F_PAYMENT_EXCESS_OVER_INVOICE > 0
  A_EXCESS_AMOUNT_LIMIT:
    statement: The amount received in excess of the amount indicated in the tax invoice is up to one thousand rupees
    order: LOW
    rule: F_PAYMENT_EXCESS_OVER_INVOICE <= 1000
  A_SUPPLIER_OPTION:
    statement: The said supplier opts that the time of supply to the extent of such excess amount be the date of issue of
      invoice in respect of such excess amount
    order: LOW
    rule: F_SUPPLIER_OPTION_EXERCISED = TRUE
  A_RCM_SUPPLY:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    if_false: Tax on the supply is neither paid nor liable to be paid on reverse charge basis
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_GOODS_RECEIPT_DATE:
    statement: The date of the receipt of goods is one of the dates of which the earliest shall be the time of supply for
      a reverse charge supply
    order: LOW
    rule: F_GOODS_RECEIPT_DATE IS_SET
  A_RCM:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_BOOKS_RTOSPD:
    statement: There is a date of payment as entered in the books of account of the recipient
    order: LOW
    if_false: it is confirmed that no payment entry exists in the books of account of the recipient
    rule: F_PAYMENT_RECIPIENT_BOOKS_ENTRY_DATE IS_SET
  A_BANK_RTOSPD:
    statement: There is a date on which the payment is debited in his bank account, his referring to the recipient
    order: LOW
    if_false: it is confirmed that the payment has not been debited in the bank account of the recipient
    rule: F_PAYMENT_RECIPIENT_BANK_DEBIT_DATE IS_SET
  A_EARLIER_RTOSPD:
    statement: Of the date of payment as entered in the books of account of the recipient and the date on which the payment
      is debited in his bank account, whichever is earlier is the date this clause contributes to the earliest-of-dates time
      of supply that shall apply to the reverse charge supply
    order: LOW
    rule: F_PAYMENT_RECIPIENT_EARLIER_DATE IS_SET
  A_RCM_TOSGRCI:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
    order: LOW
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_INVOICE:
    statement: An invoice in respect of the reverse charge supply has been issued by the supplier.
    order: LOW
    rule: F_INVOICE_ISSUER = 'SUPPLIER' AND F_INVOICE_ISSUE_DATE IS_SET
  A_OTHER_DOC:
    statement: Any other document, by whatever name called, has been issued by the supplier in lieu of an invoice in respect
      of the reverse charge supply.
    order: HIGH
    interpretation: Whatever its name, is the document issued by the supplier serving in lieu of an invoice for this supply?
    grounding:
    - F_DOCUMENT_ISSUER
    - F_DOCUMENT_DESCRIPTION
    - F_DOCUMENT_ISSUE_DATE
  A_THIRTY_DAY_DATE:
    statement: The clause (c) date is the date immediately following thirty days from the date of issue of invoice or any
      other document, by whatever name called, in lieu thereof by the supplier.
    order: LOW
    rule: F_RCM_THIRTY_DAY_FOLLOWING_DATE IS_SET
  A_EARLIEST:
    statement: For supplies in respect of which tax is paid or liable to be paid on reverse charge basis, the time of supply
      shall be the earliest of the listed dates, of which the clause (c) date is one, so the time of supply is not later than
      the clause (c) date.
    order: LOW
    rule: F_SUPPLY_TIME_NOT_AFTER_RCM_THIRTY_DAY_DATE = TRUE
  A_BOOKS_DATE:
    statement: The time of supply shall be the date of entry in the books of account of the recipient of supply
    order: LOW
    rule: F_SUPPLY_TIME_AT_RECIPIENT_BOOKS_DATE = TRUE
  A_VOUCHER_SUPPLY:
    statement: The case is a supply of vouchers by a supplier.
    order: LOW
    rule: F_SUPPLY_IS_VOUCHER = TRUE
  A_VOUCHER_IDENTIFIABLE:
    statement: The supply is identifiable at the point of the date of issue of the voucher.
    order: HIGH
    if_false: the supply becomes identifiable only after the date of issue of the voucher
    interpretation: On the date of issue of the voucher, is the supply for which the voucher is given identifiable from the
      voucher and its terms, or does it become identifiable only at a later point?
    grounding:
    - F_VOUCHER_DESCRIPTION
    - F_VOUCHER_ISSUE_DATE
  A_VOUCHER_SUPPLY_TOSVR:
    statement: There is a supply of vouchers by a supplier
    order: LOW
    rule: F_SUPPLY_IS_VOUCHER = TRUE
  A_OTHER_CASES:
    statement: The supply of vouchers by a supplier falls within all other cases, being a voucher case other than the case
      for which the other clause of Section 12(4) fixes the time of supply
    order: HIGH
    if_false: The voucher supply is the case for which the other clause of Section 12(4) fixes the time of supply
    interpretation: Read the voucher terms against the other clause of the parent sub-section CGSTA17_S12_SS4, which is not
      reproduced in this MKP. Is this voucher supply outside the case covered by that clause, so that it falls within all
      other cases? Answer UNKNOWN if the other clause or the voucher terms are unavailable.
    grounding:
    - F_VOUCHER_DESCRIPTION
  A_PERIODICAL_RETURN:
    statement: The case is one where a periodical return has to be filed
    order: LOW
    rule: F_RETURN_PERIODICAL_FILING_REQUIRED = TRUE
  A_OTHER_CASE:
    statement: The case is any other case within the meaning of this residual clause, being a case in which no other clause
      of the parent sub-section fixes the time of supply
    order: HIGH
    interpretation: Is the case one not governed by another clause of the parent sub-section? The words in any other case
      are retained as written. No other clause content is imported from outside the approved MKP
    grounding:
    - F_SUPPLY_TIME_FIXED_BY_OTHER_CLAUSE
  A_LAATOS_1:
    statement: The liability to pay tax on services shall arise at the time of supply
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_LAATOS_2:
    statement: The time of supply is determined in accordance with the provisions of this section
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_M_TOSIOP_1:
    statement: The supply is a supply of services.
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_M_TOSIOP_2:
    statement: The invoice is issued within the period prescribed under section 31.
    order: HIGH
    interpretation: Was the invoice for the supply of services issued within the time period prescribed under Section 31 of
      the CGST Act?
    grounding:
    - F_INVOICE_ISSUED_WITHIN_S31_PERIOD
  A_BOOKS_DATE_DODOP:
    statement: The date of receipt of payment shall be the date on which the payment is entered in the books of account of
      the supplier where that date is earlier than or the same as the date on which the payment is credited to his bank account
    order: LOW
    rule: F_PAYMENT_RECORDING_DATE_ORDER IN ['BOOKS_FIRST','SAME_DATE','BOOKS_ONLY']
  A_BANK_DATE:
    statement: The date of receipt of payment shall be the date on which the payment is credited to the bank account of the
      supplier where that date is earlier than or the same as the date on which the payment is entered in his books of account
    order: LOW
    rule: F_PAYMENT_RECORDING_DATE_ORDER IN ['BANK_FIRST','SAME_DATE','BANK_ONLY']
  A_SERVICE_SUPPLY:
    statement: The time of supply being determined is that of a supply of services
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_INVOICE_NOT_TIMELY:
    statement: The invoice is not issued within the period prescribed under section 31
    order: LOW
    rule: F_INVOICE_ISSUED_WITHIN_S31_PERIOD = FALSE
  A_PROVISION_EARLIER:
    statement: Of the date of provision of service and the date of receipt of payment, the date of provision of service is
      the earlier or the same date
    order: LOW
    rule: F_SERVICE_PAYMENT_DATE_ORDER IN ['PROVISION_FIRST','SAME_DATE','PROVISION_ONLY']
  A_PAYMENT_EARLIER:
    statement: Of the date of provision of service and the date of receipt of payment, the date of receipt of payment is the
      earlier
    order: LOW
    rule: F_SERVICE_PAYMENT_DATE_ORDER IN ['PAYMENT_FIRST','PAYMENT_ONLY']
  A_SERVICES:
    statement: The time of supply being determined is that of a supply of services
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_BOOKS_TOSRB:
    statement: The recipient shows the receipt of services in his books of account on a date, and that date is the date under
      this clause
    order: LOW
    if_false: The recipient's books of account have been examined and they do not show the receipt of the services
    rule: F_RECIPIENT_BOOKS_RECEIPT_DATE IS_SET
  A_CLAUSE_A:
    statement: The provisions of clause (a) apply to this supply of services
    order: HIGH
    interpretation: Do the provisions of clause (a) apply to this supply of services? Use PD_CLAUSE_A_APPLIES where it is
      available. Otherwise decide on the listed facts without inventing the content of clause (a)
    grounding:
    - F_INVOICE_ISSUED_WITHIN_S31_PERIOD
    - F_INVOICE_ISSUE_DATE
    - F_PAYMENT_RECEIPT_DATE
  A_CLAUSE_B:
    statement: The provisions of clause (b) apply to this supply of services
    order: HIGH
    interpretation: Do the provisions of clause (b) apply to this supply of services? Use PD_CLAUSE_B_APPLIES where it is
      available. Otherwise decide on the listed facts without inventing the content of clause (b)
    grounding:
    - F_INVOICE_ISSUED_WITHIN_S31_PERIOD
    - F_SERVICE_PROVISION_DATE
    - F_PAYMENT_RECEIPT_DATE
  A_INVOICE_COVER:
    statement: The supply is covered by the invoice, and is deemed to have been made to the extent it is so covered
    order: LOW
    rule: F_SUPPLY_COVERED_BY_INVOICE > 0
  A_PAYMENT_COVER:
    statement: The supply is covered by the payment, as the case may be, and is deemed to have been made to the extent it
      is so covered
    order: LOW
    rule: F_SUPPLY_COVERED_BY_PAYMENT > 0
  A_TAXABLE_SERVICE_SUPPLIER:
    statement: The supplier is a supplier of taxable service
    order: HIGH
    interpretation: Is the supply a supply of services that is taxable under the Act?
    grounding:
    - F_SUPPLY_IS_SERVICE
  A_EXCESS_RECEIPT_UP_TO_LIMIT:
    statement: The supplier receives an amount up to one thousand rupees in excess of the amount indicated in the tax invoice
    order: LOW
    if_false: excess is zero or negative, or exceeds 1000 rupees
    rule: F_PAYMENT_EXCESS_OVER_INVOICE > 0 AND F_PAYMENT_EXCESS_OVER_INVOICE <= 1000
  A_SUPPLIER_OPTION_EXERCISED:
    statement: The said supplier has exercised the option that the time of supply to the extent of such excess amount be the
      date of issue of invoice relating to such excess amount
    order: LOW
    rule: F_SUPPLIER_OPTION_EXERCISED = TRUE
  A_RCM_SUPPLY_TOSRPD:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_REVERSE_CHARGE_STATUS IN ['PAID','LIABLE_NOT_YET_PAID']
  A_BOOKS_DATE_EARLIER:
    statement: Of the date of payment as entered in the books of account of the recipient and the date on which the payment
      is debited in his bank account, the books of account date is the earlier, the same, or the only date that has occurred
    order: LOW
    rule: F_RECIPIENT_PAYMENT_DATE_ORDER IN ['BOOKS_FIRST','SAME_DATE','BOOKS_ONLY']
  A_BANK_DATE_EARLIER:
    statement: Of the date of payment as entered in the books of account of the recipient and the date on which the payment
      is debited in his bank account, the bank debit date is the earlier or the only date that has occurred
    order: LOW
    rule: F_RECIPIENT_PAYMENT_DATE_ORDER IN ['BANK_FIRST','BANK_ONLY']
  A_RCM_SUPPLY_TOSRSD:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_REVERSE_CHARGE_STATUS IN ['PAID','LIABLE_NOT_YET_PAID']
  A_INVOICE_BASIS:
    statement: The supplier has issued an invoice in respect of the supply, and its date of issue is the starting date from
      which the sixty days run
    order: LOW
    rule: F_INVOICE_ISSUER = 'SUPPLIER' AND F_INVOICE_ISSUE_DATE IS_SET
  A_OTHER_DOC_BASIS:
    statement: The supplier has issued any other document, by whatever name called, in lieu of an invoice in respect of the
      supply, and its date of issue is the starting date from which the sixty days run
    order: HIGH
    interpretation: Is this document, whatever it is called, issued by the supplier in lieu of an invoice for this supply,
      and what is its date of issue?
    grounding:
    - F_DOCUMENT_IN_LIEU_DESCRIPTION
    - F_DOCUMENT_IN_LIEU_ISSUE_DATE
  A_SIXTY_DAY_DATE:
    statement: The candidate time of supply under this clause is the date immediately following sixty days from the date of
      issue of invoice or any other document, by whatever name called, in lieu thereof by the supplier, and that date can
      be determined
    order: LOW
    rule: F_SUPPLY_RCM_SIXTY_DAY_DATE IS_SET
  A_EARLIER_DATE_TOSRSD:
    statement: The time of supply shall be the earlier of the following dates, and the date immediately following sixty days
      from the date of issue of the invoice or other document in lieu thereof by the supplier is not later than the other
      following date
    order: LOW
    rule: F_SUPPLY_RCM_DATE_ORDER IN ['SIXTY_DAY_DATE_EARLIER','SAME_DATE','SIXTY_DAY_DATE_ONLY']
  A_RCM_SERVICES:
    statement: The supply is a supply of services in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE AND F_SUPPLY_REVERSE_CHARGE_STATUS IN ['LIABLE_NOT_YET_PAID','PAID']
  A_BOOKS_DATE_RRTOS:
    statement: The time of supply shall be the date of entry in the books of account of the recipient of supply
    order: LOW
    rule: F_RECIPIENT_BOOKS_RECEIPT_DATE IS_SET
  A_ASSOC:
    statement: The supply is made by associated enterprises
    order: HIGH
    interpretation: Are the supplier and the recipient associated enterprises in respect of this supply?
    grounding:
    - F_SUPPLIER_ASSOCIATED_WITH_RECIPIENT
    - F_PERSON_RELATIONSHIP_DESCRIPTION
  A_LOC:
    statement: The supplier of service is located outside India
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE AND F_SUPPLIER_LOCATED_OUTSIDE_INDIA = TRUE
  A_BOOKS_EARLIER:
    statement: The time of supply shall be the date of entry in the books of account of the recipient of supply, where that
      date is earlier than the date of payment
    order: LOW
    rule: F_SUPPLY_BOOKS_PAYMENT_DATE_ORDER IN ['BOOKS_FIRST','SAME_DATE','BOOKS_ONLY']
  A_PAYMENT_EARLIER_RTOSFAE:
    statement: The time of supply shall be the date of payment, where that date is earlier than the date of entry in the books
      of account of the recipient of supply
    order: LOW
    rule: F_SUPPLY_BOOKS_PAYMENT_DATE_ORDER IN ['PAYMENT_FIRST','SAME_DATE','PAYMENT_ONLY']
  A_VOUCHER_SUPPLY_TOSVI:
    statement: The supply is a supply of vouchers by a supplier
    order: LOW
    rule: F_SUPPLY_IS_VOUCHER = TRUE
  A_SUPPLY_IDENTIFIABLE:
    statement: The supply is identifiable at the point of issue of the voucher
    order: HIGH
    interpretation: On the date of issue of the voucher, was the supply to be made against the voucher identifiable at that
      point, judged from the voucher terms and description?
    grounding:
    - F_VOUCHER_DESCRIPTION
    - F_VOUCHER_ISSUE_DATE
  A_OTHER_CASES_TOSVR:
    statement: The supply of vouchers by a supplier is one of all other cases, that is, not a case for which the time of supply
      of vouchers is otherwise provided
    order: HIGH
    interpretation: Does this supply of vouchers fall within all other cases, rather than a case for which the time of supply
      of vouchers is otherwise provided? The source clause does not name or describe those other cases, so no criterion may
      be assumed from this MKP alone.
    grounding:
    - F_SUPPLY_IS_VOUCHER
    - F_VOUCHER_DESCRIPTION
  A_REDEMPTION_DATE:
    statement: The time of supply of the vouchers shall be the date of redemption of the voucher
    order: LOW
    rule: F_VOUCHER_REDEMPTION_DATE IS_SET
  A_VOUCHER_SUPPLY_TOSVR2:
    statement: The supply is a supply of vouchers by a supplier
    order: LOW
    rule: F_SUPPLY_IS_VOUCHER = TRUE
  A_PERIODIC_RETURN_REQUIRED:
    statement: The case is one where a periodical return has to be filed.
    order: LOW
    rule: F_RETURN_PERIODICAL_REQUIRED = TRUE
  A_OTHERCASE:
    statement: The case is any other case, that is a case not covered by the preceding clause of sub-section (5), which is
      the case in which a periodical return has to be filed
    order: LOW
    rule: F_RETURN_PERIODICAL_REQUIRED = FALSE
  A_M_TOSAIV_1:
    statement: The addition in the value of supply is by way of interest for delayed payment of any consideration.
    order: LOW
    rule: F_ADDITION_TYPE = 'INTEREST'
  A_M_TOSAIV_2:
    statement: The addition in the value of supply is by way of late fee for delayed payment of any consideration.
    order: LOW
    rule: F_ADDITION_TYPE = 'LATE_FEE'
  A_M_TOSAIV_3:
    statement: The addition in the value of supply is by way of penalty for delayed payment of any consideration.
    order: LOW
    rule: F_ADDITION_TYPE = 'PENALTY'
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_EVENTS:
    name: Candidate dates of receipt of payment
    logic: ANY
    members:
    - A_BOOKS
    - A_BANK
    description: The books-entry event and the bank-credit event are alternative candidate events, joined by or.
  G_LAATOS:
    name: Goods liability with determined time of supply
    logic: ALL
    members:
    - A_SUPPLY_IS_GOODS
    - A_TOS_DETERMINED_THIS_SECTION
    description: Both the goods scope and the determination of the time of supply under this section are needed for the liability
      trigger to be fixed.
  G_TOS_PREREQ:
    name: Common prerequisites for the earlier-of comparison
    logic: ALL
    members:
    - A_GOODS
    - A_S31_DUE
    description: The time being fixed is the time of supply of goods. The section 31 last date for issuing the invoice for
      the supply is also ascertained.
  G_TOSIPD_CAND:
    name: Payment date candidate for goods
    logic: ALL
    members:
    - A_GOODS_TOSIPD
    - A_PAYRCPT
    description: The supply is of goods AND the supplier has received the payment with respect to the supply.
  G_TOSIPD_ALL:
    name: Payment date is time of supply
    logic: ALL
    members:
    - G_TOSIPD_CAND
    - A_EARLIER_TOSIPD
    description: The payment date is a candidate date for a goods supply AND it is the earlier of the listed dates.
  A_DSTEOI_INVOICE:
    name: Any of the referred steps (A_DSTEOI_INVOICE)
    logic: ANY
    members:
    - PD_TOS_INV
    - PD_TOS_LAST
    description: TRUE when any step of the law this check refers to is TRUE
  A_DSTEOI_PAYMENT:
    name: Any of the referred steps (A_DSTEOI_PAYMENT)
    logic: ANY
    members:
    - PD_TOS_INV
    - PD_TOS_LAST
    description: TRUE when any step of the law this check refers to is TRUE
  G_DSTEOI_TRIGGERS:
    name: Triggers for deeming supply as made
    logic: ANY
    members:
    - A_DSTEOI_INVOICE
    - A_DSTEOI_PAYMENT
  A_FOR_CLAUSE_B:
    name: Any of the referred steps (A_FOR_CLAUSE_B)
    logic: ANY
    members:
    - PD_DSTEOI
    - PD_TOSIPD
    - PD_TOSIPD_CAND
    description: TRUE when any step of the law this check refers to is TRUE
  G_DATE_EVENTS:
    name: Payment date events
    logic: ANY
    members:
    - A_BOOKS_ENTRY
    - A_BANK_CREDIT
    description: The payment is entered in the supplier's books of account OR credited to the supplier's bank account; these
      are alternative events.
  G_EXCESS_RECEIPT_CONDITIONS:
    name: Supplier of taxable goods receives an excess of up to one thousand rupees over the invoice amount
    logic: ALL
    members:
    - A_SUPPLY_TAXABLE_GOODS
    - A_EXCESS_AMOUNT_RECEIVED
    - A_EXCESS_AMOUNT_LIMIT
    description: All of the supplier, excess receipt and limit conditions must be met.
  G_PAYMENT_DATE:
    name: Recipient payment date alternatives
    logic: ANY
    members:
    - A_BOOKS_RTOSPD
    - A_BANK_RTOSPD
    description: Either the date of payment entered in the recipient's books of account or the date the payment is debited
      in his bank account provides a date for comparison. Both are not required.
  G_DOC:
    name: Supplier-issued invoice or document in lieu
    logic: ANY
    members:
    - A_INVOICE
    - A_OTHER_DOC
    description: Either an invoice issued by the supplier or any other document issued by the supplier in lieu of an invoice
      satisfies the issue-document requirement. A document in lieu qualifies whatever it is called.
  A_NOT_CL_C:
    name: Any of the referred steps (A_NOT_CL_C)
    logic: ANY
    members:
    - PD_TOSGRCI
    - PD_TOSGRCI_EARLIEST
    description: TRUE when any step of the law this check refers to is TRUE
  G_NOT_DETERMINABLE:
    name: Time of supply not determinable under any of clause (a), (b) or (c)
    logic: ALL
    members:
    - PD_RTOSRD
    - PD_RTOSPD
    - A_NOT_CL_C
    description: The text lists clause (a) or clause (b) or clause (c) as the routes of determination, and it must be impossible
      to determine under them, so all three routes must fail.
  G_VOUCHER_TOS:
    name: Voucher time of supply conditions
    logic: ALL
    members:
    - A_VOUCHER_SUPPLY
    - A_VOUCHER_IDENTIFIABLE
    description: Both the supply of vouchers by a supplier and identifiability of the supply at the point of issue are required.
  G_TOSVR_COND:
    name: Voucher supply in residual case
    logic: ALL
    members:
    - A_VOUCHER_SUPPLY_TOSVR
    - A_OTHER_CASES
    description: 'Both conditions must hold: there must be a supply of vouchers by a supplier, and the case must be one of
      all other cases.'
  A_NOT_DET_SS2:
    name: Any of the referred steps (A_NOT_DET_SS2)
    logic: ANY
    members:
    - PD_DOROPD
    - PD_DSTEOI
    - PD_TOSFEA
    - PD_TOSIPD
    - PD_TOSIPD_CAND
    - PD_TOS_INV
    - PD_TOS_LAST
    description: TRUE when any step of the law this check refers to is TRUE
  A_NOT_DET_SS3:
    name: Any of the referred steps (A_NOT_DET_SS3)
    logic: ANY
    members:
    - PD_RRTOS
    - PD_RTOSPD
    - PD_RTOSRD
    - PD_TOSGRCI
    - PD_TOSGRCI_EARLIEST
    description: TRUE when any step of the law this check refers to is TRUE
  A_NOT_DET_SS4:
    name: Any of the referred steps (A_NOT_DET_SS4)
    logic: ANY
    members:
    - PD_TOSVI
    - PD_TOSVR
    description: TRUE when any step of the law this check refers to is TRUE
  G_UNDETERMINABLE:
    name: Time of supply not determinable under sub-sections (2) (3) (4)
    logic: ALL
    members:
    - A_NOT_DET_SS2
    - A_NOT_DET_SS3
    - A_NOT_DET_SS4
    description: It is not possible to determine the time of supply under sub-section (2) or sub-section (3) or sub-section
      (4). The or-list is negated, so none of the three may determine it.
  A_NOT_SS2:
    name: Any of the referred steps (A_NOT_SS2)
    logic: ANY
    members:
    - PD_DOROPD
    - PD_DSTEOI
    - PD_TOSFEA
    - PD_TOSIPD
    - PD_TOSIPD_CAND
    - PD_TOS_INV
    - PD_TOS_LAST
    description: TRUE when any step of the law this check refers to is TRUE
  A_NOT_SS3:
    name: Any of the referred steps (A_NOT_SS3)
    logic: ANY
    members:
    - PD_RRTOS
    - PD_RTOSPD
    - PD_RTOSRD
    - PD_TOSGRCI
    - PD_TOSGRCI_EARLIEST
    description: TRUE when any step of the law this check refers to is TRUE
  A_NOT_SS4:
    name: Any of the referred steps (A_NOT_SS4)
    logic: ANY
    members:
    - PD_TOSVI
    - PD_TOSVR
    description: TRUE when any step of the law this check refers to is TRUE
  G_NONE_DETERMINABLE:
    name: Time of supply undeterminable under sub-sections (2), (3) and (4)
    logic: ALL
    members:
    - A_NOT_SS2
    - A_NOT_SS3
    - A_NOT_SS4
    description: It is not possible to determine the time of supply under sub-section (2) or sub-section (3) or sub-section
      (4). The residual rule is available only when none of them fixes the time
  G_M_TOSIOP_COND:
    name: Applicability Conditions for S13(2)(a)
    logic: ALL
    members:
    - A_M_TOSIOP_1
    - A_M_TOSIOP_2
    description: The rule applies if the supply is of services AND the invoice is issued within the prescribed time.
  G_EARLIER_DATE:
    name: Earlier of books-entry date and bank-credit date
    logic: ANY
    members:
    - A_BOOKS_DATE_DODOP
    - A_BANK_DATE
    description: The date of receipt is whichever of the two alternative dates is earlier - one of the two limbs selects it.
  G_CLAUSE_B_TRIGGER:
    name: Clause (b) applicability
    logic: ALL
    members:
    - A_SERVICE_SUPPLY
    - A_INVOICE_NOT_TIMELY
    description: The supply is a supply of services and the invoice is not issued within the period prescribed under section
      31
  G_CLAUSE_AB:
    name: Clause (a) or clause (b) applies
    logic: ANY
    members:
    - A_CLAUSE_A
    - A_CLAUSE_B
    description: TRUE if the provisions of clause (a) or of clause (b) apply. LE_TOSRB uses NOT G_CLAUSE_AB, so this clause
      applies only where neither clause applies
  G_COVER:
    name: Supply covered by invoice or payment
    logic: ANY
    members:
    - A_INVOICE_COVER
    - A_PAYMENT_COVER
    description: The invoice or, as the case may be, the payment covers the supply. The source does not require both.
  G_PROVISO_CONDITIONS:
    name: Proviso conditions for option on excess amount
    logic: ALL
    members:
    - A_TAXABLE_SERVICE_SUPPLIER
    - A_EXCESS_RECEIPT_UP_TO_LIMIT
    - A_SUPPLIER_OPTION_EXERCISED
    description: The supplier is of taxable service AND receives up to Rs 1000 in excess of the invoice amount AND exercises
      the option.
  G_EARLIER_PAYMENT_DATE:
    name: Earlier recipient payment date
    logic: ANY
    members:
    - A_BOOKS_DATE_EARLIER
    - A_BANK_DATE_EARLIER
    description: One of the recipient's two payment dates is identified as the earlier date. The source joins the dates with
      or and adds whichever is earlier. The two dates are therefore alternatives, and the earlier one is used. Both events
      are not required.
  G_ISSUE_DOC:
    name: Supplier reference document
    logic: ANY
    members:
    - A_INVOICE_BASIS
    - A_OTHER_DOC_BASIS
    description: The sixty days run from the date of issue by the supplier of either an invoice or any other document, by
      whatever name called, in lieu of the invoice.
  G_NOT_DETERMINABLE_RRTOS:
    name: Time of supply not determinable under clause (a) or clause (b)
    logic: ALL
    members:
    - PD_TOS_RCM_PAYMENT
    - PD_TOSRSD
    description: The source says not possible to determine under clause (a) or clause (b). It is read as the fallback applying
      when neither clause can determine the time of supply. If either clause can determine it, the fallback is not needed.
  G_CONTEXT:
    name: Associated enterprise supply with supplier of service outside India
    logic: ALL
    members:
    - A_ASSOC
    - A_LOC
    description: Both context conditions of the proviso must be met together.
  G_VOUCHER_TOS_TOSVI:
    name: Identifiable voucher supply
    logic: ALL
    members:
    - A_VOUCHER_SUPPLY_TOSVI
    - A_SUPPLY_IDENTIFIABLE
    description: Both conditions are required. The supply is a supply of vouchers by a supplier AND the supply is identifiable
      at the point of issue of the voucher.
  G_VOUCHER_RESIDUAL:
    name: Residual voucher supply case
    logic: ALL
    members:
    - A_VOUCHER_SUPPLY_TOSVR2
    - A_OTHER_CASES_TOSVR
