# GOVERNANCE MASTER TSG05_02 Time of supply – services (TG05 Time & Period)
# LAW ARC - 14 laws - status NEEDS_REVIEW
name: TSG05_02 Time of supply – services - GOVERNANCE MASTER rulebook
version: TSG05_02
facts:
  F_PBED:
    name: Payment Books Entry Date
    type: DATE
    tier: T0
  F_PBCD:
    name: Payment Bank Credit Date
    type: DATE
    tier: T1
  F_DOII:
    name: Date Of Invoice Issue
    type: DATE
    tier: T0
  F_IITS:
    name: Invoice Issue Timing Status
    type: CODE
    options:
    - AFTER_DUE_DATE
    - ON_OR_BEFORE_DUE_DATE
    - UNKNOWN
    tier: T0
  F_SPRD:
    name: Supplier Payment Receipt Date
    type: DATE
    tier: T0
  F_IPDO:
    name: Invoice Payment Date Order
    type: CODE
    options:
    - INVOICE_NOT_LATER
    - PAYMENT_EARLIER
    - UNKNOWN
    tier: T0
  F_VSS:
    name: Voucher Supply Status
    type: CODE
    options:
    - NOT_VOUCHER_BY_SUPPLIER
    - UNKNOWN
    - VOUCHER_BY_SUPPLIER
    tier: T1
  F_SIS2:
    name: Supply Identifiability Status
    type: CODE
    options:
    - IDENTIFIABLE
    - NOT_IDENTIFIABLE
    - UNKNOWN
    tier: T1
  F_SCB:
    name: Supply Charge Basis
    type: CODE
    options:
    - FORWARD_CHARGE
    - REVERSE_CHARGE
    - UNKNOWN
    tier: T0
  F_PDIRB:
    name: Payment Date In Recipient Books
    type: DATE
    tier: T0
  F_PDDIB:
    name: Payment Debit Date In Bank
    type: DATE
    tier: T1
  F_PDO:
    name: Payment Date Order
    type: CODE
    options:
    - BANK_EARLIER
    - BOOKS_EARLIER_OR_SAME
    - UNKNOWN
    tier: T0
  F_ICA:
    name: Invoice Covered Amount
    type: AMOUNT
    tier: T1
  F_PCA:
    name: Payment Covered Amount
    type: AMOUNT
    tier: T1
  F_SIK:
    name: Supply Item Kind
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    - UNKNOWN
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_SEA:
    name: Supply Excess Amount
    type: AMOUNT
    tier: T0
  F_SOE:
    name: Supplier Option Elected
    type: BOOLEAN
    tier: T1
  F_PDOS:
    name: Provision Date Order Status
    type: CODE
    options:
    - PROVISION_NOT_LATER
    - PROVISION_LATER
    - NOT_APPLICABLE
    - UNKNOWN
    tier: T1
  F_SRBED:
    name: Supply Recipient Books Entry Date
    type: DATE
    tier: T1
  F_LDID:
    name: Lieu Document Issue Date
    type: DATE
    tier: T0
  F_LDIS:
    name: Lieu Document Issuer Status
    type: CODE
    options:
    - OTHER_PERSON
    - SUPPLIER
    - UNKNOWN
    tier: T1
  F_CCCD:
    name: Clause C Candidate Date
    type: DATE
    tier: T0
  F_STD:
    name: Supply Transaction Date
    type: DATE
    tier: T1
  F_SPCC:
    name: Supply Preceding Case Coverage
    type: CODE
    options:
    - COVERED_BY_PRECEDING_CASE
    - NOT_COVERED
    - UNKNOWN
    tier: T1
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_SDMBIOP_A_ICSE:
    statement: The supply is covered by the invoice to some extent
    order: LOW
    rule: F_ICA > 0
    handler: python
  M_SDMBIOP_A_PCSE:
    statement: The supply is covered by the payment to some extent
    order: LOW
    rule: F_PCA > 0
    handler: python
  M_EOIOPFS_A_SHII:
    statement: The supplier has issued an invoice for the supply of services, so a date of issue of invoice by the supplier
      exists
    order: LOW
    rule: F_DOII IS_SET
    handler: python
  M_EOIOPFS_A_IIWS31P:
    statement: The invoice is issued within the period prescribed under section 31
    order: LOW
    rule: F_IITS = 'ON_OR_BEFORE_DUE_DATE'
    handler: python
  M_EOIOPFS_A_PRDE:
    statement: Payment has been received for the supply of services, so a date of receipt of payment exists
    order: LOW
    rule: F_SPRD IS_SET
    handler: python
  M_EOIOPFS_A_IDNLTP:
    statement: The date of issue of invoice by the supplier is not later than the date of receipt of payment, so the invoice
      date is the earlier date
    order: LOW
    rule: F_IPDO = 'INVOICE_NOT_LATER'
    handler: python
  M_EOIOPFS_A_PDETI:
    statement: The date of receipt of payment is earlier than the date of issue of invoice by the supplier, so the payment
      date is the earlier date
    order: LOW
    rule: F_IPDO = 'PAYMENT_EARLIER'
    handler: python
  M_DOROPD_A_PEIB:
    statement: The payment is entered in the books of account of the supplier, giving a books entry date
    order: LOW
    rule: F_PBED IS_SET
    handler: python
  M_DOROPD_A_PCTB:
    statement: The payment is credited to the bank account of the supplier, giving a bank credit date
    order: LOW
    rule: F_PBCD IS_SET
    handler: python
  M_TOSOSPD_A_INIIP:
    statement: The invoice is not issued within the period prescribed under section 31
    order: LOW
    rule: F_IITS = 'AFTER_DUE_DATE'
    handler: python
  M_TOSOSPD_A_PRDE:
    statement: A date of receipt of payment exists for the service
    order: LOW
    rule: F_SPRD IS_SET
    handler: python
  M_TOSOSPD_A_PDNLTP:
    statement: The date of provision of service is earlier than or the same as the date of receipt of payment
    order: LOW
    rule: F_PDOS = 'PROVISION_NOT_LATER'
    handler: python
  M_TOSSVI_A_SIVBS:
    statement: The supply is a supply of vouchers by a supplier
    order: LOW
    rule: F_VSS = 'VOUCHER_BY_SUPPLIER'
    handler: python
  M_TOSSVI_A_SIAIP:
    statement: The supply is identifiable at the point of issue of the voucher
    order: HIGH
    interpretation: From the voucher, contract or terms and conditions, is the supply to which the voucher relates identifiable
      at the point (date) the voucher is issued?
    grounding:
    - F_SIS2
    handler: light
  M_VSTOSRD_A_SIVBS:
    statement: The supply is a supply of vouchers by a supplier
    order: LOW
    rule: F_VSS = 'VOUCHER_BY_SUPPLIER'
    handler: python
  M_VSTOSRD_A_CNCBPC:
    statement: The case is one of all other cases and is not a case already covered by the preceding case in the same sub-section
      on the time of supply of vouchers
    order: HIGH
    interpretation: Is this voucher supply one that is covered by the preceding case of the same sub-section or is it one
      of all other cases left over after that case? The preceding case is not restated in this MKP so it must be read from
      the parent sub-section
    grounding:
    - F_SPCC
    handler: light
  M_RCSPD_A_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_RCSPD_A_PDEIRB:
    statement: A date of payment is entered in the books of account of the recipient
    order: LOW
    rule: F_PDIRB IS_SET
    handler: python
  M_RCSPD_A_PDIRB:
    statement: The payment is debited in the recipient's bank account on a date
    order: LOW
    rule: F_PDDIB IS_SET
    handler: python
  M_RCSPD_A_BPDIE:
    statement: The date of payment as entered in the books of account of the recipient is earlier than or the same as the
      date on which the payment is debited in the recipient's bank account
    order: LOW
    rule: F_PDO = 'BOOKS_EARLIER_OR_SAME'
    handler: python
  M_RCSPD_A_BDDIE:
    statement: The date on which the payment is debited in the recipient's bank account is earlier than the date of payment
      as entered in the books of account of the recipient
    order: LOW
    rule: F_PDO = 'BANK_EARLIER'
    handler: python
  M_RCSISD_A_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_RCSISD_A_SIIFS:
    statement: An invoice has been issued by the supplier for the supply.
    order: LOW
    rule: F_DOII IS_SET
    handler: python
  M_RCSISD_A_SILD:
    statement: Any other document, by whatever name called, in lieu of an invoice has been issued by the supplier.
    order: LOW
    rule: F_LDID IS_SET AND F_LDIS = 'SUPPLIER'
    handler: python
  M_RCSISD_A_CIDASD:
    statement: The candidate time of supply is the date immediately following sixty days from the date of issue of the invoice
      or of the document in lieu of it.
    order: LOW
    rule: F_CCCD IS_SET
    handler: python
  M_TOSOSEA_A_SOTS:
    statement: The supply is a taxable service and the person receiving the excess amount is the supplier of that taxable
      service
    order: HIGH
    interpretation: Is the supply a service (not goods only) that is taxable, and is the person who receives the amount its
      supplier?
    grounding:
    - F_SIK
    - F_DOS
    handler: heavy
  M_TOSOSEA_A_ARIEOI:
    statement: The supplier receives an amount in excess of the amount indicated in the tax invoice
    order: LOW
    rule: F_SEA > 0
    handler: python
  M_TOSOSEA_A_EAUTTR:
    statement: The amount received in excess of the amount indicated in the tax invoice is up to one thousand rupees
    order: LOW
    rule: F_SEA <= 1000
    handler: python
  M_TOSOSEA_A_SETO:
    statement: The said supplier opts, at the supplier's option, to treat the time of supply to the extent of the excess amount
      as the date of issue of invoice relating to that excess amount
    order: LOW
    rule: F_SOE = TRUE
    handler: python
  M_TOSSRBE_A_SRBER:
    statement: The date of entry of the supply in the books of account of the recipient of supply is recorded
    order: LOW
    rule: F_SRBED IS_SET
    handler: python
  M_LTPTOS_A_SIOS:
    statement: The supply on which the liability to pay tax is being considered is a supply of services
    order: HIGH
    interpretation: Does the description of the supply show that it is a supply of services?
    grounding:
    - F_DOS
    handler: light
  M_LTPTOS_A_TOSDUS:
    statement: The time of supply of the services is determined in accordance with the provisions of this section
    order: HIGH
    interpretation: Under which provision of this section is the time of supply of these services fixed, weighing the supply
      date, the invoice issue date and the payment receipt date, and has that time been established?
    grounding:
    - F_STD
    - F_DOII
    - F_SPRD
    handler: heavy
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_SDMBIOP_G_SCBIOP:
    name: Supply Covered By Invoice Or Payment
    logic: ANY
    members:
    - M_SDMBIOP_A_ICSE
    - M_SDMBIOP_A_PCSE
    description: The supply is covered by the invoice or, as the case may be, by the payment
  M_EOIOPFS_G_TIDC:
    name: Timely Invoice Date Candidate
    logic: ALL
    members:
    - M_EOIOPFS_A_SHII
    - M_EOIOPFS_A_IIWS31P
    description: The invoice date is a candidate only if the supplier issued an invoice and it was issued within the period
      prescribed under section 31.
  M_DOROPD_A_RDITE:
    name: Any of the referred steps (M_DOROPD_A_RDITE)
    logic: ANY
    members:
    - M_EOIOPFS_PD_IDITOS
    - M_EOIOPFS_PD_PDITOS
    description: TRUE when any step of the law this check refers to is TRUE
  M_DOROPD_G_BOBDS:
    name: Books Or Bank Date Source
    logic: ANY
    members:
    - M_DOROPD_A_PEIB
    - M_DOROPD_A_PCTB
    description: At least one payment date must be recorded before the earlier-date rule can apply.
  M_RCSPD_G_BPDA:
    name: Both Payment Dates Available
    logic: ALL
    members:
    - M_RCSPD_A_PDEIRB
    - M_RCSPD_A_PDIRB
    description: Both dates must be available to compare which is earlier. A missing date gives UNKNOWN, not FALSE.
  M_RCSISD_G_IOLDI:
    name: Invoice Or Lieu Document Issued
    logic: ANY
    members:
    - M_RCSISD_A_SIIFS
    - M_RCSISD_A_SILD
    description: The date of issue is that of the supplier's invoice or of any other document, by whatever name called, issued
      in lieu of it by the supplier.
  M_TOSOSEA_G_ERTC:
    name: Excess Receipt Trigger Conditions
    logic: ALL
    members:
    - M_TOSOSEA_A_SOTS
    - M_TOSOSEA_A_ARIEOI
    - M_TOSOSEA_A_EAUTTR
    description: The supplier of taxable service receives an amount over the invoice amount and that excess is up to one thousand
      rupees.
  M_TOSSRBE_A_CCDT:
    name: Any of the referred steps (M_TOSSRBE_A_CCDT)
    logic: ANY
    members:
    - M_RCSISD_PD_SDCDE
    - M_RCSPD_PD_BDITOS
    - M_RCSPD_PD_BDITOS2
    description: TRUE when any step of the law this check refers to is TRUE
  M_TOSSRBE_G_FCG:
    name: Fallback Condition Group
    logic: ALL
    members:
    - M_TOSSRBE_A_CCDT
    - M_TOSSRBE_A_SRBER
    description: Both the not-determinable condition and the recipient books entry condition are required
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_SDMBIOP_LE_SDMTE:
    outcome: DEEMED_MADE_TO_EXTENT
    expr: M_SDMBIOP_G_SCBIOP
    module: M_SDMBIOP
    description: For the purposes of clauses (a) and (b) the supply is deemed made to the extent covered by the invoice or
      the payment
  M_EOIOPFS_LE_IDITOS:
    outcome: TIME_OF_SUPPLY_IS_INVOICE_DATE
    expr: M_EOIOPFS_G_TIDC AND (NOT M_EOIOPFS_A_PRDE OR M_EOIOPFS_A_IDNLTP)
    module: M_EOIOPFS
    description: The invoice issue date is the time of supply when a timely invoice exists and either no payment date exists
      or the invoice date is not later than the payment date.
  M_EOIOPFS_LE_PDITOS:
    outcome: TIME_OF_SUPPLY_IS_PAYMENT_DATE
    expr: M_EOIOPFS_A_PRDE AND (NOT M_EOIOPFS_G_TIDC OR M_EOIOPFS_A_PDETI)
    module: M_EOIOPFS
    description: The date of receipt of payment is the time of supply when payment was received and either there is no timely
      invoice candidate or payment was received earlier than the invoice date.
  M_DOROPD_LE_DORD:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_DETERMINED
    expr: M_DOROPD_G_BOBDS AND M_DOROPD_A_RDITE
    module: M_DOROPD
    description: The receipt date is fixed for clauses (a) and (b) only when at least one payment date is recorded and the
      earlier-date rule is applied.
  M_TOSOSPD_LE_TOSIPD:
    outcome: TIME_OF_SUPPLY_IS_PROVISION_DATE
    expr: M_TOSOSPD_A_INIIP AND (NOT M_TOSOSPD_A_PRDE OR M_TOSOSPD_A_PDNLTP)
    module: M_TOSOSPD
    description: The invoice is not issued within the section 31 period and the date of provision of service is the earlier
      date (or the only date because no payment has been received).
  M_TOSOSPD_LE_TOSIPD2:
    outcome: TIME_OF_SUPPLY_IS_PAYMENT_DATE
    expr: M_TOSOSPD_A_INIIP AND M_TOSOSPD_A_PRDE AND NOT M_TOSOSPD_A_PDNLTP
    module: M_TOSOSPD
    description: The invoice is not issued within the section 31 period and the date of receipt of payment is earlier than
      the date of provision of service.
  M_TOSSVI_LE_VIDO:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_ISSUE_DATE
    expr: M_TOSSVI_A_SIVBS AND M_TOSSVI_A_SIAIP
    module: M_TOSSVI
    description: The time of supply is the date of issue of the voucher when the supply is a supply of vouchers by a supplier
      AND the supply is identifiable at the point of issue.
  M_VSTOSRD_LE_TOSIRD:
    outcome: TOS_IS_VOUCHER_REDEMPTION_DATE
    expr: M_VSTOSRD_A_SIVBS AND M_VSTOSRD_A_CNCBPC
    module: M_VSTOSRD
    description: When the supply is a supply of vouchers by a supplier and the case is one of all other cases the time of
      supply is the date of redemption of the voucher.
  M_RCSPD_LE_BDITOS:
    outcome: TIME_OF_SUPPLY_IS_BOOKS_PAYMENT_DATE
    expr: M_RCSPD_A_SORCB AND M_RCSPD_G_BPDA AND M_RCSPD_A_BPDIE
    module: M_RCSPD
    description: On a reverse charge supply the time of supply is the payment date entered in the recipient's books, where
      that date is earlier than or the same as the bank debit date.
  M_RCSPD_LE_BDITOS2:
    outcome: TIME_OF_SUPPLY_IS_BANK_DEBIT_DATE
    expr: M_RCSPD_A_SORCB AND M_RCSPD_G_BPDA AND M_RCSPD_A_BDDIE
    module: M_RCSPD
    description: On a reverse charge supply the time of supply is the date the payment is debited in the recipient's bank
      account, where that date is earlier than the books payment date.
  M_RCSISD_LE_SDCDE:
    outcome: SIXTY_DAY_CANDIDATE_DATE_ESTABLISHED
    expr: M_RCSISD_A_SORCB AND M_RCSISD_G_IOLDI AND M_RCSISD_A_CIDASD
    module: M_RCSISD
    description: When the supply is on reverse charge basis and the supplier issued an invoice or a document in lieu of it,
      the date immediately following sixty days from that issue date is a candidate time of supply. The actual time of supply
      is the earlier of the applicable candidates, compared outside this MKP.
  M_TOSOSEA_LE_EATRA:
    outcome: EXCESS_TOS_IS_EXCESS_INVOICE_DATE
    expr: M_TOSOSEA_G_ERTC AND M_TOSOSEA_A_SETO
    module: M_TOSOSEA
    description: The proviso fixes the time of supply for the excess amount only when the trigger conditions are met and the
      supplier exercises the option.
  M_TOSSRBE_LE_RBTO:
    outcome: TIME_OF_SUPPLY_RECIPIENT_BOOKS_ENTRY
    expr: M_TOSSRBE_G_FCG
    module: M_TOSSRBE
    description: The proviso gives the recipient books entry date as the time of supply only when the clause condition and
      the recipient entry condition both hold
  M_LTPTOS_LE_TLAATOS:
    outcome: LIABILITY_TO_PAY_TAX_ON_SERVICES_ARISES_AT_TIME_OF_SUPPLY
    expr: M_LTPTOS_A_SIOS AND M_LTPTOS_A_TOSDUS
    module: M_LTPTOS
    description: Where the supply is a supply of services and its time of supply is determined under this section, the liability
      to pay tax arises at that time of supply.
triggers:
  M_RCSISD_CT_LDIC:
    question: Was the document issued in lieu of the invoice actually issued by the supplier?
    trigger: F_LDIS = 'UNKNOWN'
    beside: M_RCSISD_LE_SDCDE
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_SDMBIOP_PD_SDMTE:
    statement: For the purposes of clauses (a) and (b) the supply is deemed made to the extent covered by the invoice or the
      payment
  M_EOIOPFS_PD_IDITOS:
    statement: The invoice issue date is the time of supply when a timely invoice exists and either no payment date exists
      or the invoice date is not later than the payment date.
  M_EOIOPFS_PD_PDITOS:
    statement: The date of receipt of payment is the time of supply when payment was received and either there is no timely
      invoice candidate or payment was received earlier than the invoice date.
  M_DOROPD_PD_DORP:
    statement: The receipt date is fixed for clauses (a) and (b) only when at least one payment date is recorded and the earlier-date
      rule is applied.
  M_TOSOSPD_PD_TOSIPD:
    statement: The invoice is not issued within the section 31 period and the date of provision of service is the earlier
      date (or the only date because no payment has been received).
  M_TOSOSPD_PD_TOSIPD2:
    statement: The invoice is not issued within the section 31 period and the date of receipt of payment is earlier than the
      date of provision of service.
  M_TOSSVI_PD_VIDO:
    statement: The time of supply is the date of issue of the voucher when the supply is a supply of vouchers by a supplier
      AND the supply is identifiable at the point of issue.
  M_VSTOSRD_PD_TOSIRD:
    statement: When the supply is a supply of vouchers by a supplier and the case is one of all other cases the time of supply
      is the date of redemption of the voucher.
  M_RCSPD_PD_BDITOS:
    statement: On a reverse charge supply the time of supply is the payment date entered in the recipient's books, where that
      date is earlier than or the same as the bank debit date.
  M_RCSPD_PD_BDITOS2:
    statement: On a reverse charge supply the time of supply is the date the payment is debited in the recipient's bank account,
      where that date is earlier than the books payment date.
  M_RCSISD_PD_SDCDE:
    statement: When the supply is on reverse charge basis and the supplier issued an invoice or a document in lieu of it,
      the date immediately following sixty days from that issue date is a candidate time of supply. The actual time of supply
      is the earlier of the applicable candidates, compared outside this MKP.
  M_TOSOSEA_PD_EATRA:
    statement: The proviso fixes the time of supply for the excess amount only when the trigger conditions are met and the
      supplier exercises the option.
  M_TOSSRBE_PD_RBTO:
    statement: The proviso gives the recipient books entry date as the time of supply only when the clause condition and the
      recipient entry condition both hold
  M_LTPTOS_PD_TLAATOS:
    statement: Where the supply is a supply of services and its time of supply is determined under this section, the liability
      to pay tax arises at that time of supply.
