# GOVERNANCE MASTER TSG05_03 Advances (TG05 Time & Period)
# LAW ARC - 11 laws - status NEEDS_REVIEW
name: TSG05_03 Advances - GOVERNANCE MASTER rulebook
version: TSG05_03
facts:
  F_PAYMENT_EXCESS_OVER_INVOICE:
    name: Amount received by the supplier in excess of the amount indicated in the tax invoice (zero if none)
    type: AMOUNT
    tier: T0
  F_PAYMENT_RECEIPT_DATE:
    name: Date of receipt of payment
    type: DATE
    tier: T1
  F_SUPPLY_COVERED_BY_PAYMENT:
    name: Extent of supply covered by payment
    type: AMOUNT
    tier: T1
  F_PAYMENT_BOOKS_ENTRY_DATE:
    name: Date on which the payment is entered in the books of account of the supplier
    type: DATE
    tier: T0
  F_PAYMENT_BANK_CREDIT_DATE:
    name: Date on which the payment is credited to the bank account of the supplier
    type: DATE
    tier: T1
  F_SUPPLY_IS_GOODS:
    name: The supply is a supply of goods
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_TAXABLE:
    name: The supply is taxable under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_OPTION_EXERCISED:
    name: Supplier has exercised the option that the date of issue of invoice be the time of supply of the excess amount
    type: BOOLEAN
    tier: T0
  F_PAYMENT_IS_ADVANCE:
    name: Payment is an advance payment
    type: BOOLEAN
    tier: T1
  F_PAYMENT_RELATES_TO_SUPPLY:
    name: Payment relates to a supply
    type: BOOLEAN
    tier: T1
  F_ADVANCE_PAYMENT_RECEIVED_FOR_SUPPLY:
    name: An advance payment was received for a supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_COVERED_BY_INVOICE:
    name: Extent of supply covered by invoice
    type: AMOUNT
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_DOCUMENT_TYPE:
    name: Type of document
    type: CODE
    options:
    - ASSESSMENT_DOCUMENT
    - BILL_OF_SUPPLY
    - CREDIT_NOTE
    - DEBIT_NOTE
    - DELIVERY_CHALLAN
    - OTHER
    - OTHER_LIKE_DOCUMENT
    - PAYMENT_VOUCHER
    - RECEIPT_VOUCHER
    - REFUND_VOUCHER
    - REVISED_INVOICE
    - SELF_INVOICE
    - SUPPLEMENTARY_INVOICE
    - TAX_INVOICE
    tier: T1
  F_DOCUMENT_ISSUER_ROLE:
    name: Role of the entity that issued the document
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - AGENT
    - OTHER
    tier: T1
  F_TAX_INVOICE_ISSUE_DATE:
    name: Date of issue of the tax invoice relating to the supply
    type: DATE
    tier: T1
  F_ORIGINAL_SUPPLY_DATE:
    name: Date of the earlier supply
    type: DATE
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_EXCESS_RECEIPT_UP_TO_LIMIT:
    statement: The supplier receives an amount up to one thousand rupees in excess of the amount indicated in the tax invoice
    order: LOW
    if_false: excess is zero or negative, or exceeds 1000 rupees
    rule: F_PAYMENT_EXCESS_OVER_INVOICE > 0 AND F_PAYMENT_EXCESS_OVER_INVOICE <= 1000
  A_PAYRCPT:
    statement: The supplier receives the payment with respect to the supply, and the date on which the supplier receives that
      payment is established
    order: LOW
    rule: F_PAYMENT_RECEIPT_DATE IS_SET AND F_SUPPLY_COVERED_BY_PAYMENT > 0
  A_SUPPLY_TAXABLE_GOODS:
    statement: The supplier receiving the amount is a supplier of taxable goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE AND F_SUPPLY_IS_TAXABLE = TRUE
  A_EXCESS_AMOUNT_RECEIVED:
    statement: The supplier receives an amount in excess of the amount indicated in the tax invoice
    order: LOW
    rule: F_PAYMENT_EXCESS_OVER_INVOICE > 0
  A_EXCESS_AMOUNT_LIMIT:
    statement: The amount received in excess of the amount indicated in the tax invoice is up to one thousand rupees
    order: LOW
    rule: F_PAYMENT_EXCESS_OVER_INVOICE <= 1000
  A_SUPPLIER_OPTION:
    statement: The said supplier opts that the time of supply to the extent of such excess amount be the date of issue of
      invoice in respect of such excess amount
    order: LOW
    rule: F_SUPPLIER_OPTION_EXERCISED = TRUE
  A_ADVANCE_PAYMENT_RECEIVED:
    statement: An advance payment is received
    order: LOW
    rule: F_PAYMENT_IS_ADVANCE = TRUE
  A_PAYMENT_FOR_SUPPLY:
    statement: The advance payment is with respect to any supply of goods or services or both
    order: LOW
    rule: F_PAYMENT_RELATES_TO_SUPPLY = TRUE
  A_RVFNS_2:
    statement: An advance payment was received with respect to a supply of goods or services or both.
    order: LOW
    rule: F_ADVANCE_PAYMENT_RECEIVED_FOR_SUPPLY = TRUE
  A_DSTEOI_INVOICE:
    statement: For the purposes of clauses (a) and (b), a supply is deemed to have been made to the extent it is covered by
      the invoice.
    order: LOW
    rule: F_SUPPLY_COVERED_BY_INVOICE > 0
  A_DSTEOI_PAYMENT:
    statement: For the purposes of clauses (a) and (b), a supply is deemed to have been made to the extent it is covered by
      the payment.
    order: LOW
    rule: F_SUPPLY_COVERED_BY_PAYMENT > 0
  A_BOOKS_ENTRY:
    statement: The payment is entered in the supplier's books of account on a date (the date on which the payment is entered
      in his books of account)
    order: LOW
    rule: F_PAYMENT_BOOKS_ENTRY_DATE IS_SET
  A_BANK_CREDIT:
    statement: The payment is credited to the supplier's bank account on a date (the date on which the payment is credited
      to his bank account)
    order: LOW
    rule: F_PAYMENT_BANK_CREDIT_DATE IS_SET
  A_EARLIER_DATE:
    statement: The date on which the supplier receives the payment shall be the date on which the payment is entered in his
      books of account or the date on which the payment is credited to his bank account, whichever is earlier
    order: LOW
    rule: F_PAYMENT_RECEIPT_DATE IS_SET
  A_TIIRI_1:
    statement: The document is a revised invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'REVISED_INVOICE'
  A_TIIRI_2:
    statement: The revised invoice was issued by the supplier.
    order: LOW
    rule: F_DOCUMENT_ISSUER_ROLE = 'SUPPLIER'
  A_TIIRI_3:
    statement: The revised invoice is in respect of a supply made earlier.
    order: HIGH
    interpretation: Does the date of issue of the revised invoice (F_TAX_INVOICE_ISSUE_DATE) occur after the date of the supply
      it pertains to (F_ORIGINAL_SUPPLY_DATE)?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_ORIGINAL_SUPPLY_DATE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_EXCESS_RECEIPT_CONDITIONS:
    name: Supplier of taxable goods receives an excess of up to one thousand rupees over the invoice amount
    logic: ALL
    members:
    - A_SUPPLY_TAXABLE_GOODS
    - A_EXCESS_AMOUNT_RECEIVED
    - A_EXCESS_AMOUNT_LIMIT
    description: All of the supplier, excess receipt and limit conditions must be met.
  G_DSTEOI_TRIGGERS:
    name: Triggers for deeming supply as made
    logic: ANY
    members:
    - A_DSTEOI_INVOICE
    - A_DSTEOI_PAYMENT
  A_FOR_CLAUSE_B:
    name: Any of the referred steps (A_FOR_CLAUSE_B)
    logic: ANY
    members:
    - PD_DSTEOI
    - PD_PAYRCPT
    description: TRUE when any step of the law this check refers to is TRUE
  G_DATE_EVENTS:
    name: Payment date events
    logic: ANY
    members:
    - A_BOOKS_ENTRY
    - A_BANK_CREDIT
    description: The payment is entered in the supplier's books of account OR credited to the supplier's bank account; these
      are alternative events.
  G_TIIRI_CONDITIONS:
    name: Conditions for a revised invoice to be treated as a tax invoice
    logic: ALL
    members:
    - A_TIIRI_1
    - A_TIIRI_2
    - A_TIIRI_3
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_EXCESS_RECEIPT_UP_TO_LIMIT:
    outcome: EXCESS_RECEIPT_UP_TO_LIMIT
    expr: A_EXCESS_RECEIPT_UP_TO_LIMIT
    module: M_OFTOSFE
    description: The supplier receives an amount up to one thousand rupees in excess of the amount indicated in the tax invoice
      (Proviso to Section 13(2), part of the law)
  LE_PAYRCPT:
    outcome: PAYRCPT
    expr: A_PAYRCPT
    module: M_TOSIPD
    description: The supplier receives the payment with respect to the supply, and the date on which the supplier receives
      that payment is established (Section 12(2), part of the law)
  LE_TOSFEA:
    outcome: TIME_OF_SUPPLY_OF_EXCESS_AMOUNT_IS_DATE_OF_ISSUE_OF_INVOICE_IN_RESPECT_OF_EXCESS_AMOUNT
    expr: G_EXCESS_RECEIPT_CONDITIONS AND A_SUPPLIER_OPTION
    module: M_TOSFEA
    description: If the supplier of taxable goods receives an excess of up to Rs 1000 over the invoice amount and opts for
      it, the time of supply to the extent of the excess amount is the date of issue of invoice in respect of that excess
      amount.
  LE_ADVANCE_PAYMENT_RECEIVED:
    outcome: ADVANCE_PAYMENT_RECEIVED
    expr: A_ADVANCE_PAYMENT_RECEIVED
    module: M_RVFAP
    description: An advance payment is received (Section 31(3), part of the law)
  LE_PAYMENT_FOR_SUPPLY:
    outcome: PAYMENT_FOR_SUPPLY
    expr: A_PAYMENT_FOR_SUPPLY
    module: M_RVFAP
    description: The advance payment is with respect to any supply of goods or services or both (Section 31(3), part of the
      law)
  LE_RVFNS_2:
    outcome: RVFNS_2
    expr: A_RVFNS_2
    module: M_RVFNS
    description: An advance payment was received with respect to a supply of goods or services or both. (Section 31(3), part
      of the law)
  LE_DSTEOI:
    outcome: DEEMED_SUPPLY_MADE
    expr: G_DSTEOI_TRIGGERS
    module: M_DSTEOI
  LE_DOROPD:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_DETERMINED
    expr: A_FOR_CLAUSE_B AND G_DATE_EVENTS AND A_EARLIER_DATE
    module: M_DOROPD
    description: When clause (b) is being applied, the date on which the supplier receives the payment is the earlier of the
      books-entry date and the bank-credit date.
  LE_TIIRI:
    outcome: TAX_INVOICE_INCLUDES_REVISED_INVOICE
    expr: G_TIIRI_CONDITIONS
    module: M_TIIRI
    description: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised
      invoice issued by the supplier for a supply made earlier.
products:
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_EXCESS_RECEIPT_UP_TO_LIMIT:
    statement: The supplier receives an amount up to one thousand rupees in excess of the amount indicated in the tax invoice
  PD_PAYRCPT:
    statement: The supplier receives the payment with respect to the supply, and the date on which the supplier receives that
      payment is established
  PD_TOSFEA:
    statement: If the supplier of taxable goods receives an excess of up to Rs 1000 over the invoice amount and opts for it,
      the time of supply to the extent of the excess amount is the date of issue of invoice in respect of that excess amount.
  PD_ADVANCE_PAYMENT_RECEIVED:
    statement: An advance payment is received
  PD_PAYMENT_FOR_SUPPLY:
    statement: The advance payment is with respect to any supply of goods or services or both
  PD_RVFNS_2:
    statement: An advance payment was received with respect to a supply of goods or services or both.
  PD_DSTEOI:
    statement: DEEMED_SUPPLY_MADE
  PD_DOROPD:
    statement: When clause (b) is being applied, the date on which the supplier receives the payment is the earlier of the
      books-entry date and the bank-credit date.
  PD_TIIRI:
    statement: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised invoice
      issued by the supplier for a supply made earlier.
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_OFTOSFE
  question: The supplier receives an amount up to one thousand rupees in excess of the amount indicated in the tax invoice?
    (Proviso to Section 13(2))
  includes:
  - LE_EXCESS_RECEIPT_UP_TO_LIMIT
  produces:
  - product: PD_EXCESS_RECEIPT_UP_TO_LIMIT
    from:
    - LE_EXCESS_RECEIPT_UP_TO_LIMIT
- id: C_TOSIPD
  question: The supplier receives the payment with respect to the supply, and the date on which the supplier receives that
    payment is established? (Section 12(2))
  includes:
  - LE_PAYRCPT
  produces:
  - product: PD_PAYRCPT
    from:
    - LE_PAYRCPT
- id: C_TOSFEA
  question: 'Section 12(2), Proviso 1: Time Of Supply For Excess Amount?'
  includes:
  - LE_TOSFEA
  produces:
  - product: PD_TOSFEA
    from:
    - LE_TOSFEA
- id: C_S31_SS3
  question: 'Section 31(3): which clause applies?'
  includes:
  - LE_ADVANCE_PAYMENT_RECEIVED
  - LE_PAYMENT_FOR_SUPPLY
  - LE_RVFNS_2
  produces:
  - product: PD_ADVANCE_PAYMENT_RECEIVED
    from:
    - LE_ADVANCE_PAYMENT_RECEIVED
  - product: PD_PAYMENT_FOR_SUPPLY
    from:
    - LE_PAYMENT_FOR_SUPPLY
  - product: PD_RVFNS_2
    from:
    - LE_RVFNS_2
- id: C_DSTEOI
  question: 'Section 12(2), Explanation 1: Deemed Supply To Extent Of Invoice?'
  includes:
  - LE_DSTEOI
  produces:
  - product: PD_DSTEOI
    from:
    - LE_DSTEOI
- id: C_DOROPD
  question: 'Section 12(2), Explanation 2: Date Of Receipt Of Payment Defined?'
  includes:
  - LE_DOROPD
  produces:
  - product: PD_DOROPD
    from:
    - LE_DOROPD
- id: C_TIIRI
  question: 'Section 31, Explanation 1: Tax Invoice Includes Revised Invoice?'
  includes:
  - LE_TIIRI
  produces:
  - product: PD_TIIRI
    from:
    - LE_TIIRI
