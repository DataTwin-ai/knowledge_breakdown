# GOVERNANCE MASTER TSG05_01 Time of supply – goods (TG05 Time & Period)
# LAW ARC - 40 laws - status NEEDS_REVIEW
name: TSG05_01 Time of supply – goods - GOVERNANCE MASTER rulebook
version: TSG05_01
facts:
  F_SUPPLY_IS_GOODS:
    name: The supply is a supply of goods
    type: BOOLEAN
    tier: T1
  F_TIME_OF_SUPPLY_GOODS:
    name: Time of supply of the goods as determined under the provisions of Section 12
    type: DATE
    tier: T1
  F_INVOICE_ISSUE_DATE:
    name: Date of issue of invoice
    type: DATE
    tier: T0
  F_PAYMENT_RECEIPT_DATE:
    name: Date of receipt of payment
    type: DATE
    tier: T1
  F_SUPPLY_COVERED_BY_PAYMENT:
    name: Extent of supply covered by payment
    type: AMOUNT
    tier: T1
  F_PAYMENT_BOOKS_ENTRY_DATE:
    name: Date on which the payment is entered in the books of account of the supplier
    type: DATE
    tier: T0
  F_PAYMENT_BANK_CREDIT_DATE:
    name: Date on which the payment is credited to the bank account of the supplier
    type: DATE
    tier: T1
  F_SUPPLY_IS_TAXABLE:
    name: The supply is taxable under the Act
    type: BOOLEAN
    tier: T0
  F_PAYMENT_EXCESS_OVER_INVOICE:
    name: Amount received by the supplier in excess of the amount indicated in the tax invoice (zero if none)
    type: AMOUNT
    tier: T0
  F_SUPPLIER_OPTION_EXERCISED:
    name: Supplier has exercised the option that the date of issue of invoice be the time of supply of the excess amount
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TAX_ON_REVERSE_CHARGE:
    name: Tax on the supply is paid or liable to be paid on reverse charge basis
    type: BOOLEAN
    tier: T0
  F_GOODS_RECEIPT_DATE:
    name: Date of the receipt of goods
    type: DATE
    tier: T0
  F_PAYMENT_RECIPIENT_BOOKS_ENTRY_DATE:
    name: Date of payment as entered in the books of account of the recipient
    type: DATE
    tier: T0
  F_PAYMENT_RECIPIENT_BANK_DEBIT_DATE:
    name: Date on which the payment is debited in the bank account of the recipient
    type: DATE
    tier: T1
  F_PAYMENT_RECIPIENT_EARLIER_DATE:
    name: Earlier of the recipient's books-entry date and bank-debit date for the payment
    type: DATE
    tier: T0
  F_INVOICE_ISSUER:
    name: Person who issued the invoice relied on for the supply
    type: CODE
    options:
    - NONE
    - NONE_ISSUED
    - OTHER
    - RECIPIENT
    - SUPPLIER
    tier: T0
  F_DOCUMENT_ISSUER:
    name: Person who issued the document other than an invoice for the supply
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - OTHER
    - NONE_ISSUED
    tier: T0
  F_DOCUMENT_DESCRIPTION:
    name: Description and function of the document other than an invoice issued for the supply
    type: TEXT
    tier: T1
  F_DOCUMENT_ISSUE_DATE:
    name: Date of issue of the document other than an invoice issued for the supply
    type: DATE
    tier: T0
  F_RCM_THIRTY_DAY_FOLLOWING_DATE:
    name: Date immediately following thirty days from the date of issue of the supplier invoice or document in lieu thereof
    type: DATE
    tier: T0
  F_SUPPLY_TIME_NOT_AFTER_RCM_THIRTY_DAY_DATE:
    name: Time of supply of the goods falls on or before the date immediately following thirty days from the date of issue
      of the supplier invoice or document in lieu thereof
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TIME_AT_RECIPIENT_BOOKS_DATE:
    name: The time of supply of the goods falls on the date of entry of the supply in the books of account of the recipient
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_VOUCHER:
    name: The supply is a supply of vouchers by a supplier
    type: BOOLEAN
    tier: T1
  F_VOUCHER_DESCRIPTION:
    name: Description and terms of the voucher, including what can be obtained against it
    type: TEXT
    tier: T1
  F_VOUCHER_ISSUE_DATE:
    name: Date of issue of voucher
    type: DATE
    tier: T1
  F_RETURN_PERIODICAL_FILING_REQUIRED:
    name: A periodical return has to be filed in the case
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TIME_FIXED_BY_OTHER_CLAUSE:
    name: The time of supply for the case is fixed by another clause of the parent sub-section
    type: BOOLEAN
    tier: T0
  F_CAPITAL_GOODS_RETURNED_WITHIN_3Y:
    name: Capital goods were received back by the principal within three years from the date they were sent out
    type: BOOLEAN
    tier: T0
  F_INVOICE_TIMING_VS_REMOVAL:
    name: Timing of invoice issue relative to goods removal
    type: CODE
    options:
    - BEFORE
    - AT
    - AFTER
    tier: T0
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_DOCUMENT_TYPE:
    name: Type of document
    type: CODE
    options:
    - ASSESSMENT_DOCUMENT
    - BILL_OF_SUPPLY
    - CREDIT_NOTE
    - DEBIT_NOTE
    - DELIVERY_CHALLAN
    - OTHER
    - OTHER_LIKE_DOCUMENT
    - PAYMENT_VOUCHER
    - RECEIPT_VOUCHER
    - REFUND_VOUCHER
    - REVISED_INVOICE
    - SELF_INVOICE
    - SUPPLEMENTARY_INVOICE
    - TAX_INVOICE
    tier: T1
  F_DOCUMENT_ISSUER_ROLE:
    name: Role of the entity that issued the document
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - AGENT
    - OTHER
    tier: T1
  F_TAX_INVOICE_ISSUE_DATE:
    name: Date of issue of the tax invoice relating to the supply
    type: DATE
    tier: T1
  F_ORIGINAL_SUPPLY_DATE:
    name: Date of the earlier supply
    type: DATE
    tier: T1
  F_SUPPLY_INVOLVES_MOVEMENT_OF_GOODS:
    name: Supply involves movement of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_TIMING_VS_DELIVERY:
    name: Timing of invoice issue relative to goods delivery
    type: CODE
    options:
    - BEFORE
    - AT
    - AFTER
    tier: T0
  F_INVOICE_TIMING_VS_AVAILABILITY:
    name: Timing of invoice issue relative to goods being made available
    type: CODE
    options:
    - BEFORE
    - AT
    - AFTER
    tier: T0
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_PERSON_SUPPLIES_TAXABLE_GOODS:
    name: Person is engaged in the supply of taxable goods
    type: BOOLEAN
    tier: T0
  F_TAX_INVOICE_IS_ISSUED:
    name: A tax invoice was issued for the supply
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_GOODS_DESCRIPTION:
    name: Invoice contains description of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_GOODS_QUANTITY:
    name: Invoice contains quantity of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_GOODS_VALUE:
    name: Invoice contains value of goods
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_TAX_CHARGED:
    name: Invoice contains tax charged
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_PRESCRIBED_PARTICULARS:
    name: Invoice contains all other prescribed particulars
    type: BOOLEAN
    tier: T0
  F_JURISDICTION_LAW_IS_IN_FORCE:
    name: The relevant legal provision is in force
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_SUPPLY_NATURE:
    name: Nature of the supply as goods, services or both
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SUPPLY_EXEMPTION_STATUS:
    name: Exemption status of the goods or services or both supplied by the person
    type: CODE
    options:
    - NOT_EXEMPT
    - PARTLY_EXEMPT
    - WHOLLY_EXEMPT
    tier: T1
  F_INVOICE_ISSUED_WITHIN_PRESCRIBED_PERIOD_S31_2:
    name: Invoice for services was issued within the period prescribed under Section 31(2)
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_SERVICE_DESCRIPTION:
    name: Invoice contains description of services
    type: BOOLEAN
    tier: T0
  F_INVOICE_CONTAINS_SERVICE_VALUE:
    name: Invoice contains value of services
    type: BOOLEAN
    tier: T0
  F_JURISDICTION_PROVISION_IS_S31_2_PROVISO:
    name: The provision under consideration is the Proviso to Section 31(2)(a) of the CGST Act
    type: BOOLEAN
    tier: T1
  F_SERVICE_CATEGORY:
    name: Category of service supplied
    type: TEXT
    tier: T1
  F_TRANSACTION_DETAILS:
    name: Details of the transaction and related documents
    type: TEXT
    tier: T1
  F_SERVICE_IS_IN_NOTIFIED_CATEGORY_FOR_INVOICE_EXCEPTION:
    name: The service is of a category specified in a notification where a tax invoice is not required, and all conditions
      in the notification are met
    type: BOOLEAN
    tier: T1
  F_REVISED_INVOICE_ISSUE_DATE:
    name: Issue date of the revised invoice
    type: DATE
    tier: T0
  F_REGISTRATION_CERTIFICATE_ISSUE_DATE:
    name: Date of issuance of the certificate of registration
    type: DATE
    tier: T0
  F_REVISED_INVOICE_MANNER_PRESCRIBED_FOLLOWED:
    name: The manner prescribed for issuing a revised invoice was followed
    type: BOOLEAN
    tier: T0
  F_ORIGINAL_INVOICE_ISSUE_DATE:
    name: Issue date of the original invoice being revised
    type: DATE
    tier: T0
  F_REGISTRATION_EFFECTIVE_DATE:
    name: Effective date of registration
    type: DATE
    tier: T0
  F_SUPPLY_VALUE:
    name: Value of the supply of goods or services or both
    type: AMOUNT
    tier: T1
  F_LOW_VALUE_INVOICE_RULES_FOLLOWED:
    name: Prescribed conditions and manner for not issuing a tax invoice for a low-value supply are followed
    type: BOOLEAN
    tier: T0
  F_SUPPLY_IS_EXEMPT:
    name: Supply is an exempt supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_COMPOSITION:
    name: The supplier is paying tax under the composition scheme (Section 10)
    type: BOOLEAN
    tier: T0
  F_BOS_HAS_PRESCRIBED_PARTICULARS:
    name: The bill of supply contains the particulars prescribed in the Rules
    type: BOOLEAN
    tier: T1
  F_BOS_ISSUED_IN_PRESCRIBED_MANNER:
    name: The bill of supply is issued in the manner prescribed in the Rules
    type: BOOLEAN
    tier: T1
  F_BOS_LOW_VALUE_RULES_FOLLOWED:
    name: Conditions and manner prescribed for not issuing a bill of supply for a low-value supply are followed
    type: BOOLEAN
    tier: T0
  F_PAYMENT_IS_ADVANCE:
    name: Payment is an advance payment
    type: BOOLEAN
    tier: T1
  F_PAYMENT_RELATES_TO_SUPPLY:
    name: Payment relates to a supply
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_HAS_PRESCRIBED_PARTICULARS:
    name: Document contains prescribed particulars
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_EVIDENCES_PAYMENT:
    name: Document evidences receipt of payment
    type: BOOLEAN
    tier: T1
  F_ADVANCE_PAYMENT_RECEIVED_FOR_SUPPLY:
    name: An advance payment was received for a supply
    type: BOOLEAN
    tier: T1
  F_RECEIPT_VOUCHER_ISSUED_FOR_ADVANCE:
    name: A receipt voucher was issued for the advance payment
    type: BOOLEAN
    tier: T1
  F_SUPPLY_WAS_MADE:
    name: A supply was subsequently made
    type: BOOLEAN
    tier: T0
  F_RECIPIENT_IS_IN_NOTIFIED_CLASS_FOR_RCM_S9_4:
    name: The recipient belongs to a class of registered persons notified to pay tax on RCM basis for supplies from unregistered
      persons under Section 9(4)
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_REGISTERED_ON_RECEIPT_DATE:
    name: The supplier was registered on the date of receipt of the supply
    type: BOOLEAN
    tier: T1
  F_PAYMENT_VOUCHER_IS_ISSUED:
    name: A payment voucher was issued for the payment
    type: BOOLEAN
    tier: T1
  F_VOUCHER_ISSUE_TIMING_VS_PAYMENT:
    name: Timing of payment voucher issue relative to payment
    type: CODE
    options:
    - BEFORE
    - AT
    - AFTER
    tier: T1
  F_PAYMENT_RECIPIENT_IS_SUPPLIER:
    name: Payment was made to the supplier
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_CONTINUOUS_GOODS:
    name: Supply is a continuous supply of goods
    type: BOOLEAN
    tier: T1
  F_SUPPLY_HAS_SUCCESSIVE_STATEMENTS:
    name: Supply involves successive statements of accounts
    type: BOOLEAN
    tier: T1
  F_SUPPLY_HAS_SUCCESSIVE_PAYMENTS:
    name: Supply involves successive payments
    type: BOOLEAN
    tier: T1
  F_STATEMENT_OF_ACCOUNT_ISSUE_DATE:
    name: Date of issue of the successive statement of accounts
    type: DATE
    tier: T1
  F_PAYMENT_DATE:
    name: Date of payment for the supply
    type: DATE
    tier: T0
  F_SUPPLY_IS_CONTINUOUS_SERVICE:
    name: Supply is a continuous supply of services
    type: BOOLEAN
    tier: T1
  F_PAYMENT_DUE_DATE_ASCERTAINABLE:
    name: Due date of payment is ascertainable from the contract
    type: BOOLEAN
    tier: T1
  F_INVOICE_ISSUED_BY_DUE_DATE:
    name: Invoice was issued on or before the due date of payment
    type: BOOLEAN
    tier: T1
  F_INVOICE_ISSUED_BY_PAYMENT_DATE:
    name: Invoice was issued on or before the date of payment
    type: BOOLEAN
    tier: T1
  F_PAYMENT_LINKED_TO_EVENT_COMPLETION:
    name: Payment for the supply is linked to the completion of an event
    type: BOOLEAN
    tier: T1
  F_INVOICE_ISSUED_BY_EVENT_DEADLINE:
    name: Invoice was issued on or before the date of completion of the event
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_CONTRACTUAL:
    name: The supply is made under a contract
    type: BOOLEAN
    tier: T1
  F_SUPPLY_CEASED_PRE_COMPLETION:
    name: The supply of services ceased before its completion
    type: BOOLEAN
    tier: T1
  F_SUPPLY_CESSATION_DATE:
    name: Date when the supply of services ceases
    type: DATE
    tier: T1
  F_SUPPLY_COVERED_BY_INVOICE:
    name: Extent of supply covered by invoice
    type: AMOUNT
    tier: T1
  F_SUPPLY_VALUE_PRE_CESSATION:
    name: Value of the supply made before cessation
    type: AMOUNT
    tier: T1
  F_GOODS_APPROVAL_STATUS:
    name: Goods are sent or taken on approval for sale or return
    type: BOOLEAN
    tier: T1
  F_GOODS_REMOVED_BEFORE_SUPPLY_OCCURS:
    name: Goods were removed before supply takes place
    type: BOOLEAN
    tier: T0
  F_INVOICE_ISSUED_BY_APPROVAL_DEADLINE:
    name: Invoice was issued by the deadline for approval sales
    type: BOOLEAN
    tier: T0
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_SUPPLY_IS_GOODS:
    statement: The liability to pay tax is a liability to pay tax on goods, that is the supply concerned is a supply of goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE
  A_TOS_DETERMINED_THIS_SECTION:
    statement: The time of supply, at which the liability to pay tax on goods shall arise, is determined in accordance with
      the provisions of this section
    order: LOW
    if_false: F_TIME_OF_SUPPLY_GOODS not available gives UNKNOWN and not automatic FALSE
    rule: F_TIME_OF_SUPPLY_GOODS IS_SET
  A_GOODS_TOSIPD:
    statement: The supply whose time of supply is being determined is a supply of goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE
  A_PAYRCPT:
    statement: The supplier receives the payment with respect to the supply, and the date on which the supplier receives that
      payment is established
    order: LOW
    rule: F_PAYMENT_RECEIPT_DATE IS_SET AND F_SUPPLY_COVERED_BY_PAYMENT > 0
  A_EARLIER:
    statement: The date on which the supplier receives the payment with respect to the supply is the earlier of the dates
      listed for the time of supply of goods
    order: HIGH
    interpretation: Compared with the other dates listed in the parent sub-section, as supplied by the product PD_PARENT_DATES,
      is the date on which the supplier receives the payment with respect to the supply the earlier date, so that it is the
      time of supply of goods?
    grounding:
    - F_PAYMENT_RECEIPT_DATE
  A_SUPPLY_TAXABLE_GOODS:
    statement: The supplier receiving the amount is a supplier of taxable goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE AND F_SUPPLY_IS_TAXABLE = TRUE
  A_EXCESS_AMOUNT_RECEIVED:
    statement: The supplier receives an amount in excess of the amount indicated in the tax invoice
    order: LOW
    rule: F_PAYMENT_EXCESS_OVER_INVOICE > 0
  A_EXCESS_AMOUNT_LIMIT:
    statement: The amount received in excess of the amount indicated in the tax invoice is up to one thousand rupees
    order: LOW
    rule: F_PAYMENT_EXCESS_OVER_INVOICE <= 1000
  A_SUPPLIER_OPTION:
    statement: The said supplier opts that the time of supply to the extent of such excess amount be the date of issue of
      invoice in respect of such excess amount
    order: LOW
    rule: F_SUPPLIER_OPTION_EXERCISED = TRUE
  A_RCM_SUPPLY:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    if_false: Tax on the supply is neither paid nor liable to be paid on reverse charge basis
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_GOODS_RECEIPT_DATE:
    statement: The date of the receipt of goods is one of the dates of which the earliest shall be the time of supply for
      a reverse charge supply
    order: LOW
    rule: F_GOODS_RECEIPT_DATE IS_SET
  A_RCM:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_BOOKS:
    statement: There is a date of payment as entered in the books of account of the recipient
    order: LOW
    if_false: it is confirmed that no payment entry exists in the books of account of the recipient
    rule: F_PAYMENT_RECIPIENT_BOOKS_ENTRY_DATE IS_SET
  A_BANK:
    statement: There is a date on which the payment is debited in his bank account, his referring to the recipient
    order: LOW
    if_false: it is confirmed that the payment has not been debited in the bank account of the recipient
    rule: F_PAYMENT_RECIPIENT_BANK_DEBIT_DATE IS_SET
  A_EARLIER_RTOSPD:
    statement: Of the date of payment as entered in the books of account of the recipient and the date on which the payment
      is debited in his bank account, whichever is earlier is the date this clause contributes to the earliest-of-dates time
      of supply that shall apply to the reverse charge supply
    order: LOW
    rule: F_PAYMENT_RECIPIENT_EARLIER_DATE IS_SET
  A_RCM_TOSGRCI:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis.
    order: LOW
    rule: F_SUPPLY_TAX_ON_REVERSE_CHARGE = TRUE
  A_INVOICE:
    statement: An invoice in respect of the reverse charge supply has been issued by the supplier.
    order: LOW
    rule: F_INVOICE_ISSUER = 'SUPPLIER' AND F_INVOICE_ISSUE_DATE IS_SET
  A_OTHER_DOC:
    statement: Any other document, by whatever name called, has been issued by the supplier in lieu of an invoice in respect
      of the reverse charge supply.
    order: HIGH
    interpretation: Whatever its name, is the document issued by the supplier serving in lieu of an invoice for this supply?
    grounding:
    - F_DOCUMENT_ISSUER
    - F_DOCUMENT_DESCRIPTION
    - F_DOCUMENT_ISSUE_DATE
  A_THIRTY_DAY_DATE:
    statement: The clause (c) date is the date immediately following thirty days from the date of issue of invoice or any
      other document, by whatever name called, in lieu thereof by the supplier.
    order: LOW
    rule: F_RCM_THIRTY_DAY_FOLLOWING_DATE IS_SET
  A_EARLIEST:
    statement: For supplies in respect of which tax is paid or liable to be paid on reverse charge basis, the time of supply
      shall be the earliest of the listed dates, of which the clause (c) date is one, so the time of supply is not later than
      the clause (c) date.
    order: LOW
    rule: F_SUPPLY_TIME_NOT_AFTER_RCM_THIRTY_DAY_DATE = TRUE
  A_BOOKS_DATE:
    statement: The time of supply shall be the date of entry in the books of account of the recipient of supply
    order: LOW
    rule: F_SUPPLY_TIME_AT_RECIPIENT_BOOKS_DATE = TRUE
  A_VOUCHER_SUPPLY:
    statement: The case is a supply of vouchers by a supplier.
    order: LOW
    rule: F_SUPPLY_IS_VOUCHER = TRUE
  A_VOUCHER_IDENTIFIABLE:
    statement: The supply is identifiable at the point of the date of issue of the voucher.
    order: HIGH
    if_false: the supply becomes identifiable only after the date of issue of the voucher
    interpretation: On the date of issue of the voucher, is the supply for which the voucher is given identifiable from the
      voucher and its terms, or does it become identifiable only at a later point?
    grounding:
    - F_VOUCHER_DESCRIPTION
    - F_VOUCHER_ISSUE_DATE
  A_VOUCHER_SUPPLY_TOSVR:
    statement: There is a supply of vouchers by a supplier
    order: LOW
    rule: F_SUPPLY_IS_VOUCHER = TRUE
  A_OTHER_CASES:
    statement: The supply of vouchers by a supplier falls within all other cases, being a voucher case other than the case
      for which the other clause of Section 12(4) fixes the time of supply
    order: HIGH
    if_false: The voucher supply is the case for which the other clause of Section 12(4) fixes the time of supply
    interpretation: Read the voucher terms against the other clause of the parent sub-section CGSTA17_S12_SS4, which is not
      reproduced in this MKP. Is this voucher supply outside the case covered by that clause, so that it falls within all
      other cases? Answer UNKNOWN if the other clause or the voucher terms are unavailable.
    grounding:
    - F_VOUCHER_DESCRIPTION
  A_NOT_RETURNED_3Y:
    statement: The capital goods are not received back by the principal within a period of three years of being sent out.
    order: LOW
    rule: F_CAPITAL_GOODS_RETURNED_WITHIN_3Y = FALSE
  A_CMP_INVOICE_TIMING:
    statement: The tax invoice is issued before or at the time of removal of goods for supply to the recipient
    order: LOW
    rule: F_INVOICE_TIMING_VS_REMOVAL IN ['BEFORE', 'AT']
  A_ITFGNM_03:
    statement: The supply is a case other than one involving movement of goods
    order: LOW
    rule: F_SUPPLY_INVOLVES_MOVEMENT_OF_GOODS = FALSE
  A_ITFGNM_05:
    statement: The tax invoice is issued before or at the time of delivery of goods to the recipient
    order: LOW
    rule: F_INVOICE_TIMING_VS_DELIVERY IN ['BEFORE', 'AT']
  A_ITFGNM_06:
    statement: The tax invoice is issued before or at the time of making the goods available to the recipient
    order: LOW
    rule: F_INVOICE_TIMING_VS_AVAILABILITY IN ['BEFORE', 'AT']
  A_ITFGNM_01:
    statement: The person supplying the goods is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_ITFGNM_02:
    statement: The supply is of taxable goods
    order: LOW
    rule: F_PERSON_SUPPLIES_TAXABLE_GOODS = TRUE
  A_ITFGNM_04:
    statement: A tax invoice is issued for the supply
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = TRUE
  A_ITFGNM_07:
    statement: The tax invoice shows the description of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_DESCRIPTION = TRUE
  A_ITFGNM_08:
    statement: The tax invoice shows the quantity of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_QUANTITY = TRUE
  A_ITFGNM_09:
    statement: The tax invoice shows the value of goods
    order: LOW
    rule: F_INVOICE_CONTAINS_GOODS_VALUE = TRUE
  A_ITFGNM_10:
    statement: The tax invoice shows the tax charged thereon
    order: LOW
    rule: F_INVOICE_CONTAINS_TAX_CHARGED = TRUE
  A_ITFGNM_11:
    statement: The tax invoice shows such other particulars as may be prescribed
    order: HIGH
    interpretation: Does the invoice contain all other particulars prescribed in the relevant Rules (e.g., CGST Rule 46)?
    grounding:
    - F_INVOICE_CONTAINS_PRESCRIBED_PARTICULARS
  A_TIIRI_1:
    statement: The document is a revised invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'REVISED_INVOICE'
  A_TIIRI_2:
    statement: The revised invoice was issued by the supplier.
    order: LOW
    rule: F_DOCUMENT_ISSUER_ROLE = 'SUPPLIER'
  A_TIIRI_3:
    statement: The revised invoice is in respect of a supply made earlier.
    order: HIGH
    interpretation: Does the date of issue of the revised invoice (F_TAX_INVOICE_ISSUE_DATE) occur after the date of the supply
      it pertains to (F_ORIGINAL_SUPPLY_DATE)?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_ORIGINAL_SUPPLY_DATE
  A_M_GPTSTIC_01:
    statement: The Government may specify the categories of goods or supplies for which a tax invoice shall be issued, and
      the time and manner for such issuance as may be prescribed.
    order: LOW
    rule: F_JURISDICTION_LAW_IS_IN_FORCE = TRUE
  A_M_GPTSTIC_02:
    statement: The Government's power to specify is exercised on the recommendations of the Council.
    order: LOW
    rule: F_JURISDICTION_LAW_IS_IN_FORCE = TRUE
  A_M_GPTSTIC_03:
    statement: The Government's power to specify is exercised by notification.
    order: LOW
    rule: F_JURISDICTION_LAW_IS_IN_FORCE = TRUE
  A_RPTITI_01:
    statement: The person supplying the services is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_RPTITI_02:
    statement: The supply consists of taxable services
    order: LOW
    rule: F_SUPPLY_NATURE = 'SERVICES' AND F_SUPPLY_EXEMPTION_STATUS != 'WHOLLY_EXEMPT'
  A_RPTITI_03:
    statement: A tax invoice is issued for the supply of services
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = TRUE
  A_RPTITI_04:
    statement: The tax invoice is issued before or after the provision of service but within a prescribed period
    order: HIGH
    interpretation: Was the tax invoice for the services issued within the period prescribed by the CGST Rules (e.g., Rule
      47)?
    grounding:
    - F_INVOICE_ISSUED_WITHIN_PRESCRIBED_PERIOD_S31_2
  A_RPTITI_05:
    statement: The tax invoice shows the description of the services
    order: LOW
    rule: F_INVOICE_CONTAINS_SERVICE_DESCRIPTION = TRUE
  A_RPTITI_06:
    statement: The tax invoice shows the value of the services
    order: LOW
    rule: F_INVOICE_CONTAINS_SERVICE_VALUE = TRUE
  A_RPTITI_07:
    statement: The tax invoice shows the tax charged thereon
    order: LOW
    rule: F_INVOICE_CONTAINS_TAX_CHARGED = TRUE
  A_RPTITI_08:
    statement: The tax invoice shows such other particulars as may be prescribed
    order: HIGH
    interpretation: Does the tax invoice contain all other particulars prescribed by the CGST Rules (e.g., Rule 46)?
    grounding:
    - F_INVOICE_CONTAINS_PRESCRIBED_PARTICULARS
  A_GOVT_POWER_TO_SPECIFY:
    statement: The Government may specify the categories of services or supplies in respect of which a tax invoice shall be
      issued.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_CONDITION_COUNCIL_RECOMMENDATION:
    statement: The Government's power is to be exercised on the recommendations of the Council.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_CONDITION_BY_NOTIFICATION:
    statement: The Government's power is to be exercised by notification.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_POWER_TO_PRESCRIBE_TIME:
    statement: For specified categories, the time within which a tax invoice shall be issued may be prescribed.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_POWER_TO_PRESCRIBE_MANNER:
    statement: For specified categories, the manner in which a tax invoice shall be issued may be prescribed.
    order: LOW
    rule: F_JURISDICTION_PROVISION_IS_S31_2_PROVISO = TRUE
  A_M_ODDTI_1:
    statement: The supply is of a category of services specified in a notification issued under the proviso to Section 31(2).
    order: HIGH
    interpretation: Given the service category of the supply, is it a category specified in any notification issued by the
      Government under the proviso to Section 31(2)?
    grounding:
    - F_SERVICE_CATEGORY
  A_M_ODDTI_2:
    statement: A document, other than a standard tax invoice, has been issued in relation to the supply.
    order: LOW
    rule: F_DOCUMENT_TYPE != 'TAX_INVOICE'
  A_M_ODDTI_3:
    statement: The transaction and the issued document meet all conditions mentioned in the relevant notification.
    order: HIGH
    interpretation: Do the transaction and the issued document satisfy all conditions stipulated in the relevant notification
      that allows the document to be deemed a tax invoice?
    grounding:
    - F_TRANSACTION_DETAILS
  A_M_TIMNBI_1:
    statement: The supply is of a category of services specified by the Government by notification, for which a tax invoice
      may not be issued, and any conditions mentioned in that notification are met.
    order: HIGH
    interpretation: Is the service one for which a notification under the proviso to S.31(2) allows for non-issuance of a
      tax invoice, and are all conditions in that notification met?
    grounding:
    - F_SERVICE_IS_IN_NOTIFIED_CATEGORY_FOR_INVOICE_EXCEPTION
  A_1:
    statement: The person is a registered person.
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_2:
    statement: The revised invoice is issued within one month from the date of issuance of the certificate of registration.
    order: HIGH
    interpretation: Was the revised invoice issued within one month from the date the registration certificate was issued?
    grounding:
    - F_REVISED_INVOICE_ISSUE_DATE
    - F_REGISTRATION_CERTIFICATE_ISSUE_DATE
  A_3:
    statement: The revised invoice is issued in the manner prescribed.
    order: HIGH
    interpretation: Was the revised invoice issued in the manner prescribed by the relevant Rules (e.g., CGST Rule 53)?
    grounding:
    - F_REVISED_INVOICE_MANNER_PRESCRIBED_FOLLOWED
  A_4:
    statement: The revised invoice is issued against an invoice already issued during the period beginning with the effective
      date of registration and ending with the date of issuance of the certificate of registration.
    order: HIGH
    interpretation: Was the original invoice issued in the period from the effective registration date up to the certificate
      issue date?
    grounding:
    - F_ORIGINAL_INVOICE_ISSUE_DATE
    - F_REGISTRATION_EFFECTIVE_DATE
    - F_REGISTRATION_CERTIFICATE_ISSUE_DATE
  A_M_NTIBTH_1:
    statement: The person making the supply is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_NTIBTH_2:
    statement: The value of the goods or services or both supplied is less than two hundred rupees
    order: LOW
    rule: F_SUPPLY_VALUE < 200
  A_M_NTIBTH_3:
    statement: The option to not issue a tax invoice is exercised subject to such conditions and in such manner as may be
      prescribed
    order: HIGH
    interpretation: Are the conditions and manner prescribed in the Rules for not issuing a tax invoice for a low-value supply
      followed?
    grounding:
    - F_LOW_VALUE_INVOICE_RULES_FOLLOWED
  A_SUPPLYING_EXEMPTED:
    statement: The registered person is supplying exempted goods or services or both.
    order: LOW
    rule: F_SUPPLY_IS_EXEMPT = TRUE
  A_PAYING_TAX_S10:
    statement: The registered person is paying tax under the provisions of section 10.
    order: LOW
    rule: F_SUPPLIER_IS_COMPOSITION = TRUE
  A_BOS_ISSUED_INSTEAD_OF_TI:
    statement: A bill of supply is issued for the supply, instead of a tax invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'BILL_OF_SUPPLY' AND F_TAX_INVOICE_IS_ISSUED = FALSE
  A_BOS_HAS_PRESCRIBED_PARTICULARS:
    statement: The bill of supply contains such particulars as may be prescribed.
    order: LOW
    rule: F_BOS_HAS_PRESCRIBED_PARTICULARS = TRUE
  A_BOS_ISSUED_IN_PRESCRIBED_MANNER:
    statement: The bill of supply is issued in such manner as may be prescribed.
    order: LOW
    rule: F_BOS_ISSUED_IN_PRESCRIBED_MANNER = TRUE
  A_REGISTERED_SUPPLIER:
    statement: The person making the supply is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_SUPPLIER_IS_REGISTERED:
    statement: The person who received the payment is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_ADVANCE_PAYMENT_RECEIVED:
    statement: An advance payment is received
    order: LOW
    rule: F_PAYMENT_IS_ADVANCE = TRUE
  A_PAYMENT_FOR_SUPPLY:
    statement: The advance payment is with respect to any supply of goods or services or both
    order: LOW
    rule: F_PAYMENT_RELATES_TO_SUPPLY = TRUE
  A_RECEIPT_VOUCHER_ISSUED:
    statement: A receipt voucher is issued
    order: LOW
    rule: F_DOCUMENT_TYPE = 'RECEIPT_VOUCHER'
  A_OTHER_DOCUMENT_ISSUED:
    statement: Any other document evidencing receipt of payment is issued
    order: LOW
    rule: F_DOCUMENT_TYPE = 'OTHER_LIKE_DOCUMENT'
  A_DOCUMENT_HAS_PARTICULARS:
    statement: The issued document contains such particulars as may be prescribed
    order: HIGH
    interpretation: Does the issued document (receipt voucher or other) contain all particulars prescribed in the relevant
      CGST Rules for such a document?
    grounding:
    - F_DOCUMENT_HAS_PRESCRIBED_PARTICULARS
    - F_TRANSACTION_DETAILS
  A_DOCUMENT_EVIDENCES_PAYMENT:
    statement: The issued document evidences receipt of the payment
    order: LOW
    rule: F_DOCUMENT_EVIDENCES_PAYMENT = TRUE
  A_RVFNS_1:
    statement: The person who received the advance payment is a registered person.
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_RVFNS_2:
    statement: An advance payment was received with respect to a supply of goods or services or both.
    order: LOW
    rule: F_ADVANCE_PAYMENT_RECEIVED_FOR_SUPPLY = TRUE
  A_RVFNS_3:
    statement: A receipt voucher was issued for the advance payment.
    order: LOW
    rule: F_RECEIPT_VOUCHER_ISSUED_FOR_ADVANCE = TRUE
  A_RVFNS_4:
    statement: Subsequently, no supply is made.
    order: LOW
    rule: F_SUPPLY_WAS_MADE = FALSE
  A_RVFNS_5:
    statement: No tax invoice was issued in pursuance of the intended supply.
    order: LOW
    rule: F_TAX_INVOICE_IS_ISSUED = FALSE
  A_NBOSBTH_1:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_NBOSBTH_2:
    statement: The value of the goods or services or both supplied is less than two hundred rupees
    order: LOW
    rule: F_SUPPLY_VALUE < 200
  A_NBOSBTH_3:
    statement: The non-issuance of the bill of supply is subject to conditions and is done in a manner as may be prescribed
    order: HIGH
    interpretation: Are the conditions and manner prescribed in the Rules for not issuing a bill of supply for a low-value
      supply followed?
    grounding:
    - F_BOS_LOW_VALUE_RULES_FOLLOWED
  A_RECIPIENT_IS_REGISTERED:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_LIABLE_UNDER_S9_4:
    statement: The registered person is liable to pay tax under sub-section (4) of section 9
    order: HIGH
    interpretation: Determine if the recipient belongs to a class of registered persons notified by the Government to pay
      tax on a reverse charge basis for specified categories of supplies received from an unregistered supplier under Section
      9(4).
    grounding:
    - F_RECIPIENT_IS_IN_NOTIFIED_CLASS_FOR_RCM_S9_4
  A_SUPPLIER_IS_UNREGISTERED:
    statement: The supplier is not registered on the date of receipt of goods or services or both
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED_ON_RECEIPT_DATE = FALSE
  A_REGISTERED_PERSON:
    statement: The person liable to pay tax under section 9 is a registered person.
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_ISSUE_PAYMENT_VOUCHER:
    statement: The registered person shall issue a payment voucher.
    order: LOW
    rule: F_PAYMENT_VOUCHER_IS_ISSUED = TRUE
  A_VOUCHER_AT_PAYMENT_TIME:
    statement: The payment voucher is issued at the time of making payment to the supplier.
    order: LOW
    rule: F_VOUCHER_ISSUE_TIMING_VS_PAYMENT = 'AT'
  A_PAYMENT_TO_SUPPLIER:
    statement: The payment is made to the supplier.
    order: LOW
    rule: F_PAYMENT_RECIPIENT_IS_SUPPLIER = TRUE
  A_S31_4_IS_CSG:
    statement: The supply is a continuous supply of goods
    order: LOW
    rule: F_SUPPLY_IS_CONTINUOUS_GOODS = TRUE
  A_S31_4_HAS_STATEMENTS:
    statement: The supply involves successive statements of accounts
    order: LOW
    rule: F_SUPPLY_HAS_SUCCESSIVE_STATEMENTS = TRUE
  A_S31_4_HAS_PAYMENTS:
    statement: The supply involves successive payments
    order: LOW
    rule: F_SUPPLY_HAS_SUCCESSIVE_PAYMENTS = TRUE
  A_S31_4_MEETS_STATEMENT_DEADLINE:
    statement: The invoice is issued before or at the time each such statement is issued
    order: HIGH
    interpretation: For each successive statement of accounts involved, was a corresponding invoice issued on or before the
      date that statement was issued?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_STATEMENT_OF_ACCOUNT_ISSUE_DATE
  A_S31_4_MEETS_PAYMENT_DEADLINE:
    statement: The invoice is issued before or at the time each such payment is received
    order: HIGH
    interpretation: For each successive payment involved, was a corresponding invoice issued on or before the date that payment
      was received?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_PAYMENT_DATE
  A_M_IFCSDDA_CONTINUOUS_SERVICE:
    statement: The supply is a case of continuous supply of services
    order: HIGH
    interpretation: Does the supply qualify as a 'continuous supply of services' as defined in the GST Act?
    grounding:
    - F_SUPPLY_IS_CONTINUOUS_SERVICE
  A_M_IFCSDDA_ASCERTAINABLE_DUE_DATE:
    statement: The due date of payment is ascertainable from the contract
    order: LOW
    rule: F_PAYMENT_DUE_DATE_ASCERTAINABLE = TRUE
  A_M_IFCSDDA_TIMELINE_MET:
    statement: The invoice is issued on or before the due date of payment
    order: LOW
    rule: F_INVOICE_ISSUED_BY_DUE_DATE = TRUE
  A_DUE_DATE_NOT_ASCERTAINABLE:
    statement: The due date of payment is not ascertainable from the contract.
    order: LOW
    rule: F_PAYMENT_DUE_DATE_ASCERTAINABLE = FALSE
  A_COMPLIANCE:
    statement: The invoice is issued before or at the time when the supplier of service receives the payment.
    order: LOW
    rule: F_INVOICE_ISSUED_BY_PAYMENT_DATE = TRUE
  A_IS_CSS:
    statement: The supply is a case of continuous supply of services
    order: HIGH
    interpretation: Does the supply qualify as a 'continuous supply of services' as defined in the GST Act?
    grounding:
    - F_SUPPLY_IS_CONTINUOUS_SERVICE
  A_PAYMENT_LINKED_EVENT:
    statement: The payment for the supply is linked to the completion of an event.
    order: LOW
    rule: F_PAYMENT_LINKED_TO_EVENT_COMPLETION = TRUE
  A_DEADLINE_MET:
    statement: The invoice is issued on or before the date of completion of the event.
    order: LOW
    rule: F_INVOICE_ISSUED_BY_EVENT_DEADLINE = TRUE
  A_CONTINUOUS_SERVICE:
    statement: The supply is a case of continuous supply of services
    order: HIGH
    interpretation: Does the supply qualify as a 'continuous supply of services' as defined in the GST Act?
    grounding:
    - F_SUPPLY_IS_CONTINUOUS_SERVICE
  A_IFCOSS_IS_SERVICE:
    statement: The supply is a supply of services.
    order: LOW
    rule: F_SUPPLY_NATURE = 'SERVICES'
  A_IFCOSS_IS_CONTRACTUAL:
    statement: The supply of services is made under a contract.
    order: LOW
    rule: F_SUPPLY_IS_CONTRACTUAL = TRUE
  A_IFCOSS_CEASED_EARLY:
    statement: The supply of services ceases before its completion.
    order: LOW
    rule: F_SUPPLY_CEASED_PRE_COMPLETION = TRUE
  A_IFCOSS_TIMING_OBLIGATION:
    statement: The invoice shall be issued at the time when the supply ceases.
    order: HIGH
    interpretation: Is the invoice issue date the same as the date the supply of services ceased?
    grounding:
    - F_INVOICE_ISSUE_DATE
    - F_SUPPLY_CESSATION_DATE
  A_IFCOSS_EXTENT_OBLIGATION:
    statement: The invoice shall be issued to the extent of the supply made before such cessation.
    order: HIGH
    interpretation: Does the invoice cover the extent of the supply made before the cessation?
    grounding:
    - F_SUPPLY_COVERED_BY_INVOICE
    - F_SUPPLY_VALUE_PRE_CESSATION
  A_APPROVAL_SALE:
    statement: The goods are sent or taken on approval for sale or return
    order: LOW
    rule: F_GOODS_APPROVAL_STATUS = TRUE
  A_REMOVAL_BEFORE_SUPPLY:
    statement: The goods are removed before the supply takes place
    order: LOW
    rule: F_GOODS_REMOVED_BEFORE_SUPPLY_OCCURS = TRUE
  A_INVOICE_TIMELY:
    statement: The invoice is issued on or before the earlier of the time of supply or six months from the date of removal
    order: LOW
    rule: F_INVOICE_ISSUED_BY_APPROVAL_DEADLINE = TRUE
  A_GOODS:
    statement: The time of supply being determined is the time of supply of goods
    order: LOW
    rule: F_SUPPLY_IS_GOODS = TRUE
  A_BOOKS_ENTRY:
    statement: The payment is entered in the supplier's books of account on a date (the date on which the payment is entered
      in his books of account)
    order: LOW
    rule: F_PAYMENT_BOOKS_ENTRY_DATE IS_SET
  A_BANK_CREDIT:
    statement: The payment is credited to the supplier's bank account on a date (the date on which the payment is credited
      to his bank account)
    order: LOW
    rule: F_PAYMENT_BANK_CREDIT_DATE IS_SET
  A_EARLIER_DATE:
    statement: The date on which the supplier receives the payment shall be the date on which the payment is entered in his
      books of account or the date on which the payment is credited to his bank account, whichever is earlier
    order: LOW
    rule: F_PAYMENT_RECEIPT_DATE IS_SET
  A_PERIODICAL_RETURN:
    statement: The case is one where a periodical return has to be filed
    order: LOW
    rule: F_RETURN_PERIODICAL_FILING_REQUIRED = TRUE
  A_OTHER_CASE:
    statement: The case is any other case within the meaning of this residual clause, being a case in which no other clause
      of the parent sub-section fixes the time of supply
    order: HIGH
    interpretation: Is the case one not governed by another clause of the parent sub-section? The words in any other case
      are retained as written. No other clause content is imported from outside the approved MKP
    grounding:
    - F_SUPPLY_TIME_FIXED_BY_OTHER_CLAUSE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
