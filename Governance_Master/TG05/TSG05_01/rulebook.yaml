outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_LAATOS:
    outcome: TAX_LIABILITY_ON_GOODS_ARISES_AT_TIME_OF_SUPPLY
    expr: G_LAATOS
    module: M_LAATOS
    description: Where the liability to pay tax is on goods and the time of supply has been determined under the provisions
      of this section, the liability to pay tax arises at that time of supply.
  LE_TOSIPD_CAND:
    outcome: PAYMENT_RECEIPT_DATE_IS_LISTED_CANDIDATE_DATE
    expr: G_TOSIPD_CAND
    module: M_TOSIPD
    description: For a supply of goods, the date on which the supplier receives the payment with respect to the supply is
      one of the dates that enters the earlier-of comparison.
  LE_TOSIPD:
    outcome: TIME_OF_SUPPLY_GOODS_IS_PAYMENT_RECEIPT_DATE
    expr: G_TOSIPD_ALL
    module: M_TOSIPD
    description: The time of supply of goods shall be the date on which the supplier receives the payment with respect to
      the supply where that date is the earlier of the listed dates.
  LE_TOSFEA:
    outcome: TIME_OF_SUPPLY_OF_EXCESS_AMOUNT_IS_DATE_OF_ISSUE_OF_INVOICE_IN_RESPECT_OF_EXCESS_AMOUNT
    expr: G_EXCESS_RECEIPT_CONDITIONS AND A_SUPPLIER_OPTION
    module: M_TOSFEA
    description: If the supplier of taxable goods receives an excess of up to Rs 1000 over the invoice amount and opts for
      it, the time of supply to the extent of the excess amount is the date of issue of invoice in respect of that excess
      amount.
  LE_RTOSRD:
    outcome: RCM_GOODS_RECEIPT_DATE_IS_CANDIDATE_TIME_OF_SUPPLY
    expr: A_RCM_SUPPLY AND A_GOODS_RECEIPT_DATE
    module: M_RTOSRD
    description: If tax on the supply is paid or liable to be paid on reverse charge basis, the date of the receipt of goods
      enters the earliest-of comparison for the time of supply under the parent subsection.
  LE_RTOSPD:
    outcome: RCM_CLAUSE_B_CANDIDATE_DATE_IS_EARLIER_RECIPIENT_PAYMENT_DATE
    expr: A_RCM AND G_PAYMENT_DATE AND A_EARLIER_RTOSPD
    module: M_RTOSPD
    description: The supply is one on which tax is paid or liable to be paid on reverse charge basis, and at least one recipient
      payment date exists. The earlier of the recipient's books-entry date and bank-debit date is therefore this clause's
      candidate date. The time of supply shall be the earliest of this date an
  LE_TOSGRCI:
    outcome: CLAUSE_12_3_C_CANDIDATE_DATE_ESTABLISHED
    expr: A_RCM_TOSGRCI AND G_DOC AND A_THIRTY_DAY_DATE
    module: M_TOSGRCI
    description: For a reverse charge supply, a supplier-issued invoice or a document in lieu of it gives the clause (c) candidate
      date. That date is the date immediately following thirty days from the date of issue.
  LE_TOSGRCI_EARLIEST:
    outcome: TIME_OF_SUPPLY_NOT_LATER_THAN_CLAUSE_C_DATE
    expr: A_RCM_TOSGRCI AND G_DOC AND A_THIRTY_DAY_DATE AND A_EARLIEST
    module: M_TOSGRCI
    description: For a reverse charge supply, the time of supply shall be the earliest of the listed dates. Where the clause
      (c) date is established, the time of supply is not later than that date. The other listed dates come from sibling clauses
      of the parent CGSTA17_S12_SS3 and are not determined here.
  LE_RRTOS:
    outcome: TIME_OF_SUPPLY_IS_RECIPIENT_BOOKS_ENTRY_DATE
    expr: G_NOT_DETERMINABLE AND A_BOOKS_DATE
    module: M_RRTOS
    description: The time of supply is the recipient's books entry date only when no route under clause (a), (b) or (c) yields
      a time of supply.
  LE_TOSVI:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_ISSUE_OF_VOUCHER
    expr: G_VOUCHER_TOS
    module: M_TOSVI
    description: When vouchers are supplied by a supplier and the supply is identifiable at the point of issue of the voucher,
      the time of supply shall be the date of issue of voucher.
  LE_TOSVR:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_REDEMPTION_DATE
    expr: G_TOSVR_COND
    module: M_TOSVR
    description: Where there is a supply of vouchers by a supplier and the case falls within all other cases, the time of
      supply shall be the date of redemption of voucher.
  LE_NOT_RETURNED_3Y:
    outcome: NOT_RETURNED_3Y
    expr: A_NOT_RETURNED_3Y
    module: M_DSOUCG
    description: The capital goods are not received back by the principal within a period of three years of being sent out.
      (Section 19(6), part of the law)
  LE_CMP_INVOICE_TIMING:
    outcome: CMP_INVOICE_TIMING
    expr: A_CMP_INVOICE_TIMING
    module: M_ITFGWM
    description: The tax invoice is issued before or at the time of removal of goods for supply to the recipient (Section
      31(1), part of the law)
  LE_ITFGNM:
    outcome: OBLIGATION_MET
    expr: G_ITFGNM_APPLICABILITY AND G_ITFGNM_OBLIGATION
    module: M_ITFGNM
    description: The obligation to issue a tax invoice is met if the applicability conditions and the obligation requirements
      are both fulfilled.
  LE_TIIRI:
    outcome: TAX_INVOICE_INCLUDES_REVISED_INVOICE
    expr: G_TIIRI_CONDITIONS
    module: M_TIIRI
    description: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised
      invoice issued by the supplier for a supply made earlier.
  LE_M_GPTSTIC:
    outcome: POWER_DEFINED
    expr: G_M_GPTSTIC_01
    module: M_GPTSTIC
    description: This provision defines the Government's power to specify tax invoice requirements for certain supplies.
  LE_RPTITI:
    outcome: OBLIGATION_FULFILLED
    expr: G_RPTITI_PRE AND G_RPTITI_FUL
    module: M_RPTITI
  LE_M_GMSSCFI:
    outcome: POWER_EXISTS
    expr: G_M_GMSSCFI
    module: M_GMSSCFI
    description: The Government has the power to specify categories of services or supplies for which special invoicing rules
      apply.
  LE_M_ODDTI:
    outcome: DOCUMENT_DEEMED_TAX_INVOICE
    expr: A_M_ODDTI_1 AND A_M_ODDTI_2 AND A_M_ODDTI_3
    module: M_ODDTI
    description: If all conditions are met, the document is deemed to be a tax invoice.
  LE_M_TIMNBI:
    outcome: PERMISSION_TO_NOT_ISSUE_INVOICE_APPLIES
    expr: A_M_TIMNBI_1
    module: M_TIMNBI
    description: The permission to not issue a tax invoice applies if the service is covered by a specific government notification.
  LE_1:
    outcome: REVISED_INVOICE_MAY_BE_ISSUED
    expr: G_1
    module: M_RIAR
  LE_M_NTIBTH:
    outcome: TAX_INVOICE_NOT_MANDATORY
    expr: G_M_NTIBTH
    module: M_NTIBTH
    description: The option to not issue a tax invoice is available if all conditions are met.
  LE_M_BOSFEOC:
    outcome: PROVISION_COMPLIED_WITH
    expr: (NOT G_APPLICABILITY_CONDITIONS) OR (G_APPLICABILITY_CONDITIONS AND G_OBLIGATION_FULFILLED)
    module: M_BOSFEOC
    description: The obligation to issue a bill of supply is complied with if the conditions do not apply, or if they do apply
      and a compliant bill of supply is issued.
  LE_RVFAP:
    outcome: COMPLIANCE_WITH_S31_3_D
    expr: (NOT G_CONDITIONS) OR G_FULFILLMENT
    module: M_RVFAP
    description: Compliance is met if the conditions for the obligation are not triggered, or if they are triggered and the
      obligation is fulfilled.
  LE_RVFNS:
    outcome: PERMISSION_TO_ISSUE_REFUND_VOUCHER
    expr: A_RVFNS_1 AND A_RVFNS_2 AND A_RVFNS_3 AND A_RVFNS_4 AND A_RVFNS_5
    module: M_RVFNS
  LE_M_NBOSBTH:
    outcome: MAY_NOT_ISSUE_BILL_OF_SUPPLY
    expr: A_NBOSBTH_1 AND A_NBOSBTH_2 AND A_NBOSBTH_3
    module: M_NBOSBTH
  LE_IFRFUS:
    outcome: OBLIGATION_TO_ISSUE_INVOICE
    expr: G_CONDITIONS_IFRFUS
    module: M_IFRFUS
  LE_PVFRP_DUTY_APPLIES:
    outcome: PAYMENT_VOUCHER_DUTY_APPLIES
    expr: G_RCM_RECIPIENT AND A_PAYMENT_TO_SUPPLIER
    module: M_PVFRP
    description: Notwithstanding (LK_S31_1_2), sub-sections (1) and (2) do not gate this duty, the duty applies where a registered
      person liable under section 9 makes payment to the supplier
  LE_PVFRP_OBLIGATION_MET:
    outcome: PAYMENT_VOUCHER_OBLIGATION_MET
    expr: G_RCM_RECIPIENT AND A_PAYMENT_TO_SUPPLIER AND G_VOUCHER_OBLIGATION
    module: M_PVFRP
    description: Met only when the duty applies and the voucher is issued at the time of payment, source states no consequence
      for non-compliance
  LE_S31_4_COMPLIANT:
    outcome: INVOICE_TIMELINE_COMPLIANT
    expr: NOT G_S31_4_APPLICABLE OR ((NOT A_S31_4_HAS_STATEMENTS OR A_S31_4_MEETS_STATEMENT_DEADLINE) AND (NOT A_S31_4_HAS_PAYMENTS
      OR A_S31_4_MEETS_PAYMENT_DEADLINE))
    module: M_IFCSOG
    description: The invoice is issued in compliance with the timelines specified in Section 31(4).
  LE_M_IFCSDDA_TIMELY:
    outcome: INVOICE_TIMELY_S31_5_a
    expr: G_M_IFCSDDA_CONDITIONS AND A_M_IFCSDDA_TIMELINE_MET
    module: M_IFCSDDA
    description: The invoice is considered timely under this provision if all preconditions are met and the invoice is issued
      by the due date of payment.
  LE_IFCSDDNA:
    outcome: INVOICE_TIMING_COMPLIANT
    expr: (NOT G_APPLICABILITY) OR A_COMPLIANCE
    module: M_IFCSDDNA
  LE_IFCSPLTE:
    outcome: INVOICE_TIMELINE_COMPLIANT
    expr: (NOT G_APPLICABILITY_IFCSPLTE) OR A_DEADLINE_MET
    module: M_IFCSPLTE
    description: The invoice is compliant with this timeline rule if the rule does not apply, or if the rule applies and the
      deadline was met.
  LE_IFCOSS:
    outcome: COMPLIANT_WITH_S31_6
    expr: (NOT G_IFCOSS_CONDITIONS) OR G_IFCOSS_OBLIGATIONS
    module: M_IFCOSS
    description: Compliance with Section 31(6) is achieved if the applicability conditions are not met, or if the conditions
      are met and the invoicing obligations are fulfilled.
  LE_M_IFGOA:
    outcome: INVOICE_TIMELY_S31_7
    expr: G_APPLICABILITY_IFGOA AND A_INVOICE_TIMELY
    module: M_IFGOA
  LE_TOS_INV:
    outcome: TIME_OF_SUPPLY_GOODS_IS_INVOICE_ISSUE_DATE
    expr: G_TOS_PREREQ AND A_INV_FIRST
    module: M_TOSIID
    description: The time of supply of goods is the date of issue of invoice by the supplier when that date is earlier than
      the section 31 last date or the same as it.
  LE_TOS_LAST:
    outcome: TIME_OF_SUPPLY_GOODS_IS_SECTION_31_LAST_DATE
    expr: G_TOS_PREREQ AND A_LAST_FIRST
    module: M_TOSIID
    description: The time of supply of goods is the last date on which the supplier is required under section 31 to issue
      the invoice when that last date is earlier than the date of issue of invoice. This also applies when it is confirmed
      that no invoice was issued by that last date.
  LE_DSTEOI:
    outcome: DEEMED_SUPPLY_MADE
    expr: G_DSTEOI_TRIGGERS
    module: M_DSTEOI
  LE_DOROPD:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_DETERMINED
    expr: A_FOR_CLAUSE_B AND G_DATE_EVENTS AND A_EARLIER_DATE
    module: M_DOROPD
    description: When clause (b) is being applied, the date on which the supplier receives the payment is the earlier of the
      books-entry date and the bank-credit date.
  LE_TOSUPR:
    outcome: TIME_OF_SUPPLY_IS_RETURN_FILING_DATE
    expr: G_UNDETERMINABLE AND A_PERIODICAL_RETURN
    module: M_TOSUPR
    description: If the time of supply is not determinable under any of sub-sections (2), (3) and (4), and a periodical return
      has to be filed in the case, the time of supply shall be the date on which that return is to be filed.
  LE_TOSUTP:
    outcome: TIME_OF_SUPPLY_IS_DATE_TAX_PAID
    expr: G_NONE_DETERMINABLE AND A_OTHER_CASE
    module: M_TOSUTP
    description: When the time of supply cannot be determined under any of sub-sections (2), (3) or (4), and the case is any
      other case within this residual clause, the time of supply shall be the date on which the tax is paid. The applicability
      of the rule does not depend on the tax having been paid. If the date of
