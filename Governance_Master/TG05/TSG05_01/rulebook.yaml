    statement: For a supply of goods, the date on which the supplier receives the payment with respect to the supply is one
      of the dates that enters the earlier-of comparison.
  PD_TOSIPD:
    statement: The time of supply of goods shall be the date on which the supplier receives the payment with respect to the
      supply where that date is the earlier of the listed dates.
  PD_TOSFEA:
