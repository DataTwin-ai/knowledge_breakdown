# GOVERNANCE MASTER TSG05_01 Time of supply – goods (TG05 Time & Period)
# LAW ARC - 14 laws - status NEEDS_REVIEW
name: TSG05_01 Time of supply – goods - GOVERNANCE MASTER rulebook
version: TSG05_01
facts:
  F_VSS:
    name: Voucher Supply Status
    type: CODE
    options:
    - NOT_VOUCHER_BY_SUPPLIER
    - UNKNOWN
    - VOUCHER_BY_SUPPLIER
    tier: T1
  F_SIS2:
    name: Supply Identifiability Status
    type: CODE
    options:
    - IDENTIFIABLE
    - NOT_IDENTIFIABLE
    - UNKNOWN
    tier: T1
  F_SRBED:
    name: Supply Recipient Books Entry Date
    type: DATE
    tier: T1
  F_TDUC:
    name: Time Determinable Under Clauses
    type: CODE
    options:
    - 'NO'
    - UNKNOWN
    - 'YES'
    tier: T1
  F_SPRD:
    name: Supplier Payment Receipt Date
    type: DATE
    tier: T0
  F_SCB:
    name: Supply Charge Basis
    type: CODE
    options:
    - FORWARD_CHARGE
    - REVERSE_CHARGE
    - UNKNOWN
    tier: T0
  F_DOII:
    name: Date Of Invoice Issue
    type: DATE
    tier: T0
  F_LDID:
    name: Lieu Document Issue Date
    type: DATE
    tier: T0
  F_LDIS:
    name: Lieu Document Issuer Status
    type: CODE
    options:
    - OTHER_PERSON
    - SUPPLIER
    - UNKNOWN
    tier: T1
  F_CCCD:
    name: Clause C Candidate Date
    type: DATE
    tier: T0
  F_SIK:
    name: Supply Item Kind
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    - UNKNOWN
    tier: T1
  F_PSR:
    name: Payment Supply Reference
    type: TEXT
    tier: T1
  F_GRD:
    name: Goods Receipt Date
    type: DATE
    tier: T0
  F_PDO:
    name: Payment Date Order
    type: CODE
    options:
    - BANK_EARLIER
    - BOOKS_EARLIER_OR_SAME
    - UNKNOWN
    tier: T0
  F_GTS:
    name: Goods Taxable Status
    type: BOOLEAN
    tier: T1
  F_SEA:
    name: Supply Excess Amount
    type: AMOUNT
    tier: T0
  F_SOE:
    name: Supplier Option Elected
    type: BOOLEAN
    tier: T1
  F_IITS:
    name: Invoice Issue Timing Status
    type: CODE
    options:
    - AFTER_DUE_DATE
    - ON_OR_BEFORE_DUE_DATE
    - UNKNOWN
    tier: T0
  F_FOS:
    name: Form Of Supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_SES:
    name: Supply Execution Status
    type: CODE
    options:
    - MADE
    - AGREED_TO_BE_MADE
    - NEITHER
    tier: T1
  F_SCT:
    name: Supply Consideration Type
    type: CODE
    options:
    - BOTH
    - MONEY
    - NONE
    - NON_MONEY
    tier: T1
  F_SLS:
    name: Supplier Legal Status
    type: TEXT
    tier: T0
  F_AOTD:
    name: Activity Or Transaction Description
    type: TEXT
    tier: T1
  F_SIS:
    name: Service Import Status
    type: CODE
    options:
    - IMPORTED
    - NOT_IMPORTED
    - UNKNOWN
    tier: T1
  F_SCS:
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
  F_ASC:
    name: Activity Status Code
    type: CODE
    options:
    - MADE
    - AGREED
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_GVTOSR_A_SIVBS:
    statement: The supply is a supply of vouchers by a supplier
    order: LOW
    rule: F_VSS = 'VOUCHER_BY_SUPPLIER'
    handler: python
  M_GVTOSR_A_CIOTPC:
    statement: The case is one of the 'all other cases', that is a voucher supply case other than the case dealt with in the
      preceding sub-clause (a) of the same sub-section
    order: HIGH
    interpretation: Is this a voucher supply case other than the case covered by the preceding sub-clause (a) of the same
      sub-section? The content of sub-clause (a) is not part of this MKP, so F_SIS2 is used only as the observable input and
      the result stays UNKNOWN if the sibling clause or the fact cannot be established
    grounding:
    - F_SIS2
    handler: light
  M_TOSVI_A_SOVBS:
    statement: The supply is a supply of vouchers by a supplier.
    order: LOW
    rule: F_VSS = 'VOUCHER_BY_SUPPLIER'
    handler: python
  M_TOSVI_A_SIAI:
    statement: The supply is identifiable at the point of issue of the voucher.
    order: HIGH
    interpretation: Does the contract, the terms and conditions or the voucher show that the supply was identifiable at the
      point the voucher was issued?
    grounding:
    - F_SIS2
    handler: light
  M_TOSGAIP_A_SRSA:
    statement: The supplier receives such addition in value, and the date of that receipt fixes the time of supply of the
      addition
    order: LOW
    rule: F_SPRD IS_SET
    handler: python
  M_RCGTID_A_SORCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_RCGTID_A_IIBS:
    statement: An invoice was issued by the supplier for the supply and its date of issue is available
    order: LOW
    rule: F_DOII IS_SET
    handler: python
  M_RCGTID_A_LDIBS:
    statement: Any other document by whatever name called in lieu of an invoice was issued by the supplier and its date of
      issue is available
    order: LOW
    rule: F_LDID IS_SET AND F_LDIS = 'SUPPLIER'
    handler: python
  M_RCGTID_A_DFTDC:
    statement: The date immediately following thirty days from the date of issue of the invoice or other document in lieu
      thereof by the supplier is available as a candidate date for the time of supply
    order: LOW
    rule: F_CCCD IS_SET
    handler: python
  M_TOSGRRD_A_SURCB:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_TOSGRRD_A_GRDIL:
    statement: The date of the receipt of goods is a date listed for determining the time of supply
    order: LOW
    rule: F_GRD IS_SET
    handler: python
  M_TOSGRRD_A_RDIEL:
    statement: The date of the receipt of goods is the earliest of the dates listed for the time of supply
    order: HIGH
    interpretation: Is the date of receipt of goods the earliest of all the dates listed for time of supply on reverse charge
      supplies? Other listed dates are outside this MKP and must be compared with it. If they are not available the answer
      is UNKNOWN.
    grounding:
    - F_GRD
    handler: heavy
  M_TOSGRCP_A_SIORC:
    statement: The supply is one in respect of which tax is paid or liable to be paid on reverse charge basis
    order: LOW
    rule: F_SCB = 'REVERSE_CHARGE'
    handler: python
  M_TOSGRCP_A_BPDIE:
    statement: The date of payment as entered in the books of account of the recipient is the same as or earlier than the
      date on which the payment is debited in his bank account
    order: LOW
    rule: F_PDO = 'BOOKS_EARLIER_OR_SAME'
    handler: python
  M_TOSGRCP_A_BDDIE:
    statement: The date on which the payment is debited in the recipient's bank account is earlier than the date of payment
      as entered in his books of account
    order: LOW
    rule: F_PDO = 'BANK_EARLIER'
    handler: python
  M_FTOSGRB_A_RBED:
    statement: The time of supply shall be the date of entry in the books of account of the recipient of supply
    order: LOW
    rule: F_SRBED IS_SET
    handler: python
  M_TOSGPD_A_SIOG:
    statement: The supply is a supply of goods
    order: LOW
    rule: F_SIK = 'GOODS'
    handler: python
  M_TOSGPD_A_PRFS:
    statement: The supplier receives the payment with respect to the supply
    order: HIGH
    interpretation: Does the payment received by the supplier relate to this supply of goods?
    grounding:
    - F_PSR
    - F_SPRD
    handler: light
  M_TOSGPD_A_PRDIR:
    statement: The date on which the supplier receives the payment with respect to the supply is established
    order: LOW
    rule: F_SPRD IS_SET
    handler: python
  M_TOSGID_A_IIOOBDD:
    statement: The date of issue of invoice by the supplier is not later than the last date on which the supplier is required,
      under section 31, to issue the invoice with respect to the supply, so the invoice issue date is the earlier of the two
      dates
    order: LOW
    rule: F_IITS = 'ON_OR_BEFORE_DUE_DATE'
    handler: python
  M_TOSGID_A_S31DIE:
    statement: The last date on which the supplier is required, under section 31, to issue the invoice with respect to the
      supply is earlier than the date of issue of invoice by the supplier
    order: LOW
    rule: F_IITS = 'AFTER_DUE_DATE'
    handler: python
  M_LTPTOG_A_SIOG:
    statement: The supply on which the liability to pay tax arises is a supply of goods
    order: LOW
    rule: F_SIK IN ['GOODS','BOTH']
    handler: python
  M_LTPTOG_A_TOSDUS:
    statement: The time of supply, at which the liability to pay tax arises, is determined in accordance with the provisions
      of this section
    order: LOW
    rule: F_TDUC = 'YES'
    handler: python
  M_EAOGTOS_A_SOTG:
    statement: The supplier is a supplier of taxable goods
    order: LOW
    rule: F_GTS = TRUE
    handler: python
  M_EAOGTOS_A_SREA:
    statement: The supplier receives an amount in excess of the amount indicated in the tax invoice
    order: LOW
    rule: F_SEA > 0
    handler: python
  M_EAOGTOS_A_EUTOT:
    statement: The amount received is up to one thousand rupees in excess of the amount indicated in the tax invoice, the
      limit being inclusive
    order: LOW
    rule: F_SEA <= 1000
    handler: python
  M_EAOGTOS_A_SEID:
    statement: The said supplier has elected, at the option of the said supplier, to apply the date of issue of invoice as
      the time of supply for such excess amount
    order: LOW
    rule: F_SOE = TRUE
    handler: python
groups:
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_RCGTID_G_SIOLD:
    name: Supplier Invoice Or Lieu Document
    logic: ANY
    members:
    - M_RCGTID_A_IIBS
    - M_RCGTID_A_LDIBS
    description: Either an invoice or any other document in lieu of it was issued by the supplier
  M_TOSGRRD_G_RCRC:
    name: Reverse Charge Receipt Conditions
    logic: ALL
    members:
    - M_TOSGRRD_A_SURCB
    - M_TOSGRRD_A_GRDIL
    - M_TOSGRRD_A_RDIEL
    description: All three must hold - reverse charge supply, a goods receipt date exists, and that date is the earliest of
      the listed dates.
  M_FTOSGRB_A_TNDUC:
    name: Any of the referred steps (M_FTOSGRB_A_TNDUC)
    logic: ANY
    members:
    - M_RCGTID_PD_CCCDA
    - M_TOSGRCP_PD_TOSBD
    - M_TOSGRCP_PD_TOSBD2
    - M_TOSGRRD_PD_RDITOS
    description: TRUE when any step of the law this check refers to is TRUE
  M_FTOSGRB_G_BFTM:
    name: Both Fallback Tests Met
    logic: ALL
    members:
    - M_FTOSGRB_A_TNDUC
    - M_FTOSGRB_A_RBED
    description: Non-determinability under the clauses and the recipient books entry must both hold.
  M_TOSGPD_G_PRTT:
    name: Payment Receipt Tests Together
    logic: ALL
    members:
    - M_TOSGPD_A_PRFS
    - M_TOSGPD_A_PRDIR
    description: The supplier receives payment with respect to the supply AND the date of that receipt is established.
  M_EAOGTOS_G_PCA:
    name: Proviso Conditions All
    logic: ALL
    members:
    - M_EAOGTOS_A_SOTG
    - M_EAOGTOS_A_SREA
    - M_EAOGTOS_A_EUTOT
    - M_EAOGTOS_A_SEID
    description: All four proviso conditions must hold together.
outcomes:
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_GVTOSR_LE_TOSIRD:
    outcome: The time of supply is the date of redemption of the voucher (value taken from F_VRD)
    expr: M_GVTOSR_A_SIVBS AND M_GVTOSR_A_CIOTPC
    module: M_GVTOSR
    description: Where the supply is a supply of vouchers by a supplier and the case is one of the 'all other cases', the
      time of supply shall be the voucher redemption date.
  M_TOSVI_LE_TOSVID:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_ISSUE_DATE
    expr: M_TOSVI_A_SOVBS AND M_TOSVI_A_SIAI
    module: M_TOSVI
    description: 'The time of supply is the date of issue of the voucher when both conditions hold: it is a supply of vouchers
      by a supplier, and the supply is identifiable at the point of issue.'
  M_TOSGAIP_LE_SRSA:
    outcome: SUPPLIER_RECEIVES_SUCH_ADDITION
    expr: M_TOSGAIP_A_SRSA
    module: M_TOSGAIP
    description: The supplier receives such addition in value, and the date of that receipt fixes the time of supply of the
      addition (Section 12(6), part of the law)
  M_RCGTID_LE_CCCDA:
    outcome: CLAUSE_C_CANDIDATE_DATE
    expr: M_RCGTID_A_SORCB AND M_RCGTID_G_SIOLD AND M_RCGTID_A_DFTDC
    module: M_RCGTID
    description: The clause (c) date is a candidate for the time of supply when the supply is under reverse charge and the
      supplier issued an invoice or a document in lieu of it
  M_TOSGRRD_LE_RDITOS:
    outcome: TIME_OF_SUPPLY_IS_GOODS_RECEIPT_DATE
    expr: M_TOSGRRD_G_RCRC
    module: M_TOSGRRD
    description: On a reverse charge supply the time of supply is the date of receipt of goods when that date is the earliest
      of the listed dates.
  M_TOSGRCP_LE_TOSBD:
    outcome: TIME_OF_SUPPLY_IS_BOOKS_PAYMENT_DATE
    expr: M_TOSGRCP_A_SIORC AND M_TOSGRCP_A_BPDIE
    module: M_TOSGRCP
    description: For a reverse charge supply where the books payment date is the same as or earlier than the bank debit date,
      the time of supply is the date of payment entered in the recipient's books.
  M_TOSGRCP_LE_TOSBD2:
    outcome: TIME_OF_SUPPLY_IS_BANK_DEBIT_DATE
    expr: M_TOSGRCP_A_SIORC AND M_TOSGRCP_A_BDDIE
    module: M_TOSGRCP
    description: For a reverse charge supply where the bank debit date is earlier than the books payment date, the time of
      supply is the date on which the payment is debited in the recipient's bank account.
  M_FTOSGRB_LE_FTA:
    outcome: TIME_OF_SUPPLY_FALLBACK
    expr: M_FTOSGRB_G_BFTM
    module: M_FTOSGRB
    description: Fallback applies only when the non-determinability condition and the recipient books entry both hold.
  M_TOSGPD_LE_PDICD:
    outcome: PAYMENT_RECEIPT_DATE_IS_CANDIDATE_TIME_OF_SUPPLY
    expr: M_TOSGPD_A_SIOG AND M_TOSGPD_G_PRTT
    module: M_TOSGPD
    description: For a supply of goods where the supplier receives payment with respect to the supply, the date of that receipt
      is the date offered by this clause as the time of supply. Under the parent chapeau it is the earlier of the listed dates.
  M_TOSGID_LE_TIIID:
    outcome: TIME_OF_SUPPLY_IS_INVOICE_ISSUE_DATE
    expr: M_TOSGID_A_IIOOBDD
    module: M_TOSGID
    description: The time of supply of goods is the date of issue of the invoice by the supplier. This applies when that date
      is not later than the section 31 last date, and on a tie both dates are the same.
  M_TOSGID_LE_TIS31LD:
    outcome: TIME_OF_SUPPLY_IS_LAST_DATE_TO_ISSUE_INVOICE
    expr: M_TOSGID_A_S31DIE
    module: M_TOSGID
    description: The time of supply of goods is the last date on which the supplier is required under section 31 to issue
      the invoice. This applies when that date is earlier than the invoice issue date.
  M_LTPTOG_LE_GTLAAS:
    outcome: LIABILITY_TO_PAY_TAX_ON_GOODS_ARISES_AT_TIME_OF_SUPPLY
    expr: M_LTPTOG_A_SIOG AND M_LTPTOG_A_TOSDUS
    module: M_LTPTOG
    description: For a supply of goods, the liability to pay tax arises at the time of supply, once that time is determined
      under the provisions of this section.
  M_EAOGTOS_LE_ETOS:
    outcome: TIME_OF_SUPPLY_EXCESS_INVOICE_DATE
    expr: M_EAOGTOS_G_PCA
    module: M_EAOGTOS
    description: The excess-amount time of supply outcome applies only when all proviso conditions hold together.
triggers:
  M_FTOSGRB_CT_DRR:
    question: Does the time of supply determination record show whether clause (a), clause (b) or clause (c) fixes the time
      of supply?
    trigger: F_TDUC = 'UNKNOWN'
    beside: M_FTOSGRB_LE_FTA
products:
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_GVTOSR_PD_TOSIRD:
    statement: Where the supply is a supply of vouchers by a supplier and the case is one of the 'all other cases', the time
      of supply shall be the voucher redemption date.
  M_TOSVI_PD_TOSVID:
    statement: 'The time of supply is the date of issue of the voucher when both conditions hold: it is a supply of vouchers
      by a supplier, and the supply is identifiable at the point of issue.'
  M_TOSGAIP_PD_SRSA:
    statement: The supplier receives such addition in value, and the date of that receipt fixes the time of supply of the
      addition
  M_RCGTID_PD_CCCDA:
    statement: The clause (c) date is a candidate for the time of supply when the supply is under reverse charge and the supplier
      issued an invoice or a document in lieu of it
  M_TOSGRRD_PD_RDITOS:
    statement: On a reverse charge supply the time of supply is the date of receipt of goods when that date is the earliest
      of the listed dates.
  M_TOSGRCP_PD_TOSBD:
    statement: For a reverse charge supply where the books payment date is the same as or earlier than the bank debit date,
      the time of supply is the date of payment entered in the recipient's books.
  M_TOSGRCP_PD_TOSBD2:
    statement: For a reverse charge supply where the bank debit date is earlier than the books payment date, the time of supply
      is the date on which the payment is debited in the recipient's bank account.
  M_FTOSGRB_PD_FTA:
    statement: Fallback applies only when the non-determinability condition and the recipient books entry both hold.
  M_TOSGPD_PD_PDICD:
    statement: For a supply of goods where the supplier receives payment with respect to the supply, the date of that receipt
      is the date offered by this clause as the time of supply. Under the parent chapeau it is the earlier of the listed dates.
  M_TOSGID_PD_TIIID:
    statement: The time of supply of goods is the date of issue of the invoice by the supplier. This applies when that date
      is not later than the section 31 last date, and on a tie both dates are the same.
  M_TOSGID_PD_TIS31LD:
    statement: The time of supply of goods is the last date on which the supplier is required under section 31 to issue the
      invoice. This applies when that date is earlier than the invoice issue date.
  M_LTPTOG_PD_GTLAAS:
    statement: For a supply of goods, the liability to pay tax arises at the time of supply, once that time is determined
      under the provisions of this section.
  M_EAOGTOS_PD_ETOS:
    statement: The excess-amount time of supply outcome applies only when all proviso conditions hold together.
