# GOVERNANCE MASTER TSG05_01 Time of supply – goods (TG05 Time & Period)
# LAW ARC - 6 laws - status APPROVED
name: TSG05_01 Time of supply – goods - GOVERNANCE MASTER rulebook
version: TSG05_01
facts:
  # ---- level 1: gate facts - if one is false, that law stops here
  F_ASK:  # 1. 1 gate | 1 law(s)
    name: Activity Subject Kind
    type: CODE
    options:
    - GOODS
    - SERVICES
    - OTHER
    tier: T1
    origin:
      document: SALE_INVOICE
      method: READ
      uses: [SALE_INVOICE.line_description, SALE_INVOICE.hsn_sac]
      how_to_get: Read SALE_INVOICE.line_description, with SALE_INVOICE.hsn_sac as a hint. Decide whether the treatment or process is applied to goods (GOODS), to a service (SERVICES) or to something else (OTHER). A job-work or processing description for another person's material gives GOODS.
      fallback: 'Read CONTRACT.subject and CONTRACT.property_description. If still unclear, ask the user: ''On what is the treatment or process performed: goods, services or something else?'''
      when_missing: ASK
      as_of: date of supply
      level: LINE_ITEM
      ai_level: LOW
      cost: HIGH
      example: GOODS
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_BAS:  # 2. 1 gate | 1 law(s)
    name: Business Asset Status
    type: CODE
    options:
    - PART_OF_BUSINESS_ASSETS
    - NOT_PART_OF_BUSINESS_ASSETS
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Were these goods part of the assets of your business before they were transferred or disposed of?'' Yes gives PART_OF_BUSINESS_ASSETS, no gives NOT_PART_OF_BUSINESS_ASSETS.', fallback: 'Check CONTRACT.property_description for the goods being listed as business assets. If still unclear, stop and ask again.', when_missing: ASK, as_of: just before the transfer or disposal, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: PART_OF_BUSINESS_ASSETS, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_GOR:  # 3. 1 gate | 1 law(s)
    name: Goods Owner Relation
    type: CODE
    options:
    - OWNED_BY_ANOTHER_PERSON
    - OWNED_BY_PERFORMER
    - OTHER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.parties]
      how_to_get: Read CONTRACT.subject and CONTRACT.parties for a job-work or processing agreement. If the goods being treated belong to the customer or principal, the value is OWNED_BY_ANOTHER_PERSON. If the performer owns them, OWNED_BY_PERFORMER. Otherwise OTHER.
      fallback: Read SALE_INVOICE.line_description for words like 'job work' or 'goods supplied by customer'. If still unclear, ask the user who owns the goods being processed.
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: OWNED_BY_ANOTHER_PERSON
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SPRD:  # 4. 1 gate | 1 law(s)
    name: Supply Payment Receipt Date
    type: DATE
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''On what date did the supplier receive payment for this supply (bank credit, cash or advance received)?'' Take the date given. If several payments were received, take the first one for the part concerned.', fallback: 'If the user does not know, ask for the bank statement or receipt date; otherwise leave unknown.', when_missing: UNKNOWN, as_of: the date of receipt itself, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: '2024-06-15', confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  # ---- level 2: asked only when that law's gates pass
  F_FOGU:  # 5. 2 | 1 law(s) | asked only if M_PUOBGIS: F_BAS
    name: Form Of Goods Use
    type: CODE
    options:
    - MADE_AVAILABLE_TO_ANY_PERSON
    - NOT_USED
    - PRIVATE_USE
    - USED_BY_PERSON
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''How were the goods used? Put to private use, used by a person, made available to any person for use, or not used at all?''', fallback: 'Read CONTRACT.subject for a lending, loan-for-use or private-use arrangement.', when_missing: UNKNOWN, as_of: date of use, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: PRIVATE_USE, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_POGU:  # 6. 2 | 1 law(s) | asked only if M_PUOBGIS: F_BAS
    name: Purpose Of Goods Use
    type: CODE
    options:
    - BUSINESS
    - NON_BUSINESS
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: ''Are the goods put to private use or used for something other than the business, or are they made available to another person for such a use?'' If yes, the value is NON_BUSINESS. If the goods are used only for the business, the value is BUSINESS.', fallback: 'Read the purpose of use from CONTRACT.subject if a contract exists. If it is still unclear, mark UNKNOWN.', when_missing: UNKNOWN, as_of: date of the use or of making the goods available, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: NON_BUSINESS, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  # ---- LAST: only heavy checks (free text) need these
  F_SCS:  # 7. LAST (heavy check only) | 3 law(s)
    name: Supply Consideration Status
    type: CODE
    options:
    - AGREED
    - NONE
    - PAID
    tier: T1
    origin:
      document: CONTRACT
      method: DERIVED
      uses: [CONTRACT.consideration, CONTRACT.consideration_type]
      how_to_get: Read consideration and consideration_type from the contract. If consideration is blank or nil / zero (or the type says no consideration, e.g. gift), the value is NONE. If consideration_type or the papers show it has been paid (cash, bank, advance received), the value is PAID. If an amount or benefit is promised but not yet paid, the value is AGREED.
      fallback: 'Use SALE_INVOICE.total_value: if it is above zero there is a consideration (AGREED, or PAID if payment is shown). Otherwise ask the user: ''Is anything paid or promised in return for this supply?'''
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: AGREED
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOAOT:  # 8. LAST (heavy check only) | 2 law(s) | asked only if M_TOPOGIS: F_ASK + F_GOR
    name: Description Of Activity Or Transaction
    type: TEXT
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.property_description, CONTRACT.employment_terms]
      how_to_get: Read the contract subject, then property_description if it is about property, or employment_terms if it is about employment. Write a short plain-text description of the activity or transaction and who does it for whom.
      fallback: 'Use SALE_INVOICE.line_description. If that is also missing, ask the user: Please describe the activity or transaction.'
      when_missing: ASK
      as_of: date of the activity or transaction
      level: TRANSACTION
      ai_level: LOW
      cost: HIGH
      example: Sale of a vacant plot of land to a buyer
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_ASIS:  # 9. LAST (heavy check only) | 1 law(s)
    name: Activity Schedule I Status
    type: CODE
    options:
    - NOT_SPECIFIED_IN_SCHEDULE_I
    - SPECIFIED_IN_SCHEDULE_I
    tier: T1
    source_kind: READ
    origin:
      document: SYSTEM
      method: ASK
      uses: [F_DOTS, SALE_INVOICE.line_description, CONTRACT.subject]
      how_to_get: Compare the description of the activity (from F_DOTS or SALE_INVOICE.line_description or CONTRACT.subject) against the list of activities specified in Schedule I of the CGST Act. If it matches any activity listed, the value is SPECIFIED_IN_SCHEDULE_I. Otherwise, it is NOT_SPECIFIED_IN_SCHEDULE_I.
      fallback: UNKNOWN
      when_missing: UNKNOWN
      as_of: Date of supply/activity
      level: TRANSACTION
      ai_level: NONE
      cost: MEDIUM
      example: SPECIFIED_IN_SCHEDULE_I
      confidence: low
      sensitive: false
      reviewed: false
      origin_by: AI
  F_DOGU:  # 10. LAST (heavy check only) | 1 law(s) | asked only if M_PUOBGIS: F_BAS
    name: Direction Of Goods Use
    type: CODE
    options:
    - BY_BUSINESS_PERSON
    - OTHER
    - UNDER_BUSINESS_PERSON_DIRECTION
    tier: T1
    origin: {document: USER, method: ASK, how_to_get: 'Ask the user: Were the goods used by the business person themself, or by someone else under their direction? Map the answer to BY_BUSINESS_PERSON, UNDER_BUSINESS_PERSON_DIRECTION or OTHER.', fallback: 'If a contract or invoice exists, read its subject or line description to find who uses the goods. If it is still unclear, ask again.', when_missing: ASK, as_of: time the goods were used or made available, level: TRANSACTION, ai_level: NONE, cost: HIGH, example: UNDER_BUSINESS_PERSON_DIRECTION, confidence: medium, sensitive: false, reviewed: false, origin_by: AI}
  F_FOS:  # 11. LAST (heavy check only) | 1 law(s)
    name: Form Of Supply
    type: CODE
    options:
    - BARTER
    - DISPOSAL
    - EXCHANGE
    - LEASE
    - LICENCE
    - OTHER
    - RENTAL
    - SALE
    - TRANSFER
    tier: T1
    origin:
      document: CONTRACT
      method: READ
      uses: [CONTRACT.subject, CONTRACT.consideration_type, SALE_INVOICE.line_description]
      how_to_get: 'Read CONTRACT.subject and CONTRACT.consideration_type. Decide the form of supply: SALE for a price in money with transfer of title, BARTER if the consideration is other goods or services, EXCHANGE, LEASE, RENTAL, LICENCE, TRANSFER or DISPOSAL as the wording says. Use OTHER if none fits.'
      fallback: If there is no contract, read SALE_INVOICE.line_description and invoice_type. If that is also unclear, ask the user how the supply was made.
      when_missing: ASK
      as_of: date of supply
      level: TRANSACTION
      ai_level: HIGH
      cost: HIGH
      example: SALE
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_PBAD:  # 12. LAST (heavy check only) | 1 law(s) | asked only if M_PUOBGIS: F_BAS
    name: Person Business Activity Description
    type: TEXT
    tier: T1
    origin:
      document: GST_REGISTRATION
      method: FIELD
      uses: [GST_REGISTRATION.nature_of_business]
      how_to_get: Search the registration by the person's gstin. Copy nature_of_business as the description of what business the person carries on. If the registration is found and the field is filled, that is the value.
      fallback: 'Ask the user: ''Does this person carry on a business? If yes, what business?'''
      when_missing: ASK
      as_of: date the goods were put to private use or made available
      level: TAXPAYER
      ai_level: NONE
      cost: LOW
      example: Wholesale trading of electronic goods
      confidence: medium
      sensitive: false
      reviewed: false
      origin_by: AI
  F_SBC:  # 13. LAST (heavy check only) | 1 law(s)
    name: Supply Business Context
    type: CODE
    options:
    - IN_BUSINESS
    - NOT_IN_BUSINESS
    - UNKNOWN
    tier: T1
    source_kind: READ
  F_TN:  # 14. LAST (heavy check only) | 1 law(s)
    name: Transaction Nature
    type: CODE
    options:
    - DOMESTIC_GOODS
    - DOMESTIC_SERVICES
    - IMPORT_GOODS
    - IMPORT_SERVICES
    - OTHER
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a sale'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a transfer'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a barter'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is an exchange'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a licence.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a licence'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a rental'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAL2:
    statement: The supply of goods or services or both is a lease.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a lease'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal.
    order: HIGH
    interpretation: 'Decide whether: The supply of goods or services or both is a disposal'
    grounding:
    - F_FOS
    handler: light
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both is a form other than the specified examples.
    order: HIGH
    interpretation: Does the described activity qualify as a form of supply under Section 7(1)(a), even though it is not one
      of the listed examples (sale, transfer, etc.)?
    grounding:
    - F_FOS
    - F_DOAOT
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply is made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SAFC:
    statement: The supply is agreed to be made for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The supply is agreed to be made for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAFOS_A_SICOB:
    statement: The supply is made by a person in the course or furtherance of business.
    order: HIGH
    interpretation: Is the supply made in the course or furtherance of the person's business?
    grounding:
    - F_SBC
    - F_DOAOT
    handler: heavy
  M_IOSFC_A_TIAIOS:
    statement: The transaction is an import of services.
    order: HIGH
    interpretation: 'Decide whether: The transaction is an import of services'
    grounding:
    - F_TN
    handler: light
  M_IOSFC_A_IIFAC:
    statement: The import of services is for a consideration.
    order: HIGH
    interpretation: 'Decide whether: The import of services is for a consideration'
    grounding:
    - F_SCS
    handler: light
  M_SIAWC_A_AISISI:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_ASIS
    handler: heavy
  M_SIAWC_A_AIWC:
    statement: The activity is made or agreed to be made without a consideration
    order: HIGH
    interpretation: 'Decide whether: The activity is made or agreed to be made without a consideration'
    grounding:
    - F_SCS
    handler: light
  M_TOSGPD_A_SRPFS:
    statement: The supplier receives the payment with respect to the supply, on a date of receipt
    order: LOW
    if_false: no payment receipt date is recorded for the supply
    rule: F_SPRD IS_SET
    handler: python
  M_TOPOGIS_A_AITOP:
    statement: The activity performed is any treatment or process
    order: HIGH
    interpretation: Does the described activity qualify as a treatment or process in its ordinary sense, the word any being
      unrestricted
    grounding:
    - F_DOAOT
    handler: heavy
  M_TOPOGIS_A_AATG:
    statement: The treatment or process is applied to goods
    order: LOW
    rule: F_ASK = 'GOODS'
    handler: python
  M_TOPOGIS_A_GBTAP:
    statement: The goods to which the treatment or process is applied belong to another person
    order: LOW
    rule: F_GOR = 'OWNED_BY_ANOTHER_PERSON'
    handler: python
  M_PUOBGIS_A_PCOAB:
    statement: The person by whom or under whose direction the goods are used or made available is a person carrying on a
      business
    order: HIGH
    interpretation: Does the described activity of the person amount to carrying on a business?
    grounding:
    - F_PBAD
    handler: heavy
  M_PUOBGIS_A_UIBOUD:
    statement: The usage or making available of the goods is by, or under the direction of, the person carrying on the business
    order: HIGH
    interpretation: Is the goods use carried out by the business person, or by another person under that person's direction?
    grounding:
    - F_DOGU
    handler: light
  M_PUOBGIS_A_GPTAPU:
    statement: The goods are put to any private use
    order: LOW
    rule: F_FOGU = 'PRIVATE_USE'
    handler: python
  M_PUOBGIS_A_GUFNBP:
    statement: The goods are used for any purpose other than a purpose of the business
    order: LOW
    rule: F_FOGU = 'USED_BY_PERSON' AND F_POGU = 'NON_BUSINESS'
    handler: python
  M_PUOBGIS_A_GMAFNBU:
    statement: The goods are made available to any person for use, for any purpose other than a purpose of the business
    order: LOW
    rule: F_FOGU = 'MADE_AVAILABLE_TO_ANY_PERSON' AND F_POGU = 'NON_BUSINESS'
    handler: python
  M_TOBASOG_A_GFBA:
    statement: Goods forming part of the assets of a business
    order: LOW
    rule: F_BAS = 'PART_OF_BUSINESS_ASSETS'
    handler: python
groups:
  M_SIAFOS_G_QFOS:
    name: Qualifying Forms Of Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL2
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: The supply must take one of the listed forms or another qualifying form.
  M_SIAFOS_G_SFC:
    name: Supply For Consideration
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply must be made or agreed to be made for a consideration.
  M_IOSFC_G_CFIOSTBS:
    name: Conditions For Import Of Service To Be Supply
    logic: ALL
    members:
    - M_IOSFC_A_TIAIOS
    - M_IOSFC_A_IIFAC
    description: Both conditions must be met. The business test is explicitly not a condition for this type of supply.
  M_TOPOGIS_G_TOAG:
    name: Treatment On Another Goods
    logic: ALL
    members:
    - M_TOPOGIS_A_AITOP
    - M_TOPOGIS_A_AATG
    - M_TOPOGIS_A_GBTAP
    description: All three conditions must be satisfied together
  M_PUOBGIS_G_BPAGC:
    name: Business Person And Goods Context
    logic: ALL
    members:
    - M_PUOBGIS_A_PCOAB
    - M_PUOBGIS_A_UIBOUD
    - M_TOBASOG_A_GFBA
    description: A person carrying on a business, by or under whose direction the use occurs, and goods held or used for that
      business.
  M_PUOBGIS_G_PONBUR:
    name: Private Or Non Business Use Routes
    logic: ANY
    members:
    - M_PUOBGIS_A_GPTAPU
    - M_PUOBGIS_A_GUFNBP
    - M_PUOBGIS_A_GMAFNBU
    description: 'Any one of: private use, use for a non-business purpose, or making available to any person for use for a
      non-business purpose.'
outcomes:
  M_SIAFOS_LE_IISUS71A:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAFOS_G_QFOS AND M_SIAFOS_G_SFC AND M_SIAFOS_A_SICOB
    module: M_SIAFOS
    description: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_LE_IOSFCIS:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_CFIOSTBS
    module: M_IOSFC
    description: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_SIAWC_LE_IISFSIA:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_A_AISISI AND M_SIAWC_A_AIWC
    module: M_SIAWC
    description: The transaction is included in the scope of supply if it is a Schedule I activity and is without consideration.
  M_TOSGPD_LE_PDCO:
    outcome: PAYMENT_RECEIPT_DATE_IS_CANDIDATE_FOR_TIME_OF_SUPPLY_OF_GOODS
    expr: M_TOSGPD_A_SRPFS
    module: M_TOSGPD
    description: When the supplier receives payment with respect to the supply, the date of receipt is a candidate time of
      supply of goods, and the earlier of the listed dates applies.
  M_TOPOGIS_LE_TOAGIS:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TOPOGIS_G_TOAG
    module: M_TOPOGIS
    description: The deemed supply of services follows when the whole treatment group is satisfied
  M_PUOBGIS_LE_BGPUDS:
    outcome: USAGE_OR_MAKING_AVAILABLE_DEEMED_SUPPLY_OF_SERVICES
    expr: M_PUOBGIS_G_BPAGC AND M_PUOBGIS_G_PONBUR
    module: M_PUOBGIS
    description: The deeming applies when the business context is met and at least one of the three use routes is met.
products:
  M_SIAFOS_PD_IISUS71A:
    statement: A transaction is included in the definition of supply if it is a qualifying form of supply, for a consideration,
      and in the course or furtherance of business.
  M_IOSFC_PD_IOSFCIS:
    statement: The transaction is included in the scope of supply if it meets the conditions for an import of service for
      consideration.
  M_SIAWC_PD_IISFSIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity and is without consideration.
  M_TOSGPD_PD_PDCO:
    statement: When the supplier receives payment with respect to the supply, the date of receipt is a candidate time of supply
      of goods, and the earlier of the listed dates applies.
  M_TOPOGIS_PD_TOAGIS:
    statement: The deemed supply of services follows when the whole treatment group is satisfied
  M_PUOBGIS_PD_BGPUDS:
    statement: The deeming applies when the business context is met and at least one of the three use routes is met.
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - M_SIAFOS_LE_IISUS71A
  - M_IOSFC_LE_IOSFCIS
  - M_SIAWC_LE_IISFSIA
  produces:
  - product: M_SIAFOS_PD_IISUS71A
    from:
    - M_SIAFOS_LE_IISUS71A
  - product: M_IOSFC_PD_IOSFCIS
    from:
    - M_IOSFC_LE_IOSFCIS
  - product: M_SIAWC_PD_IISFSIA
    from:
    - M_SIAWC_LE_IISFSIA
- id: C_TOSGPD
  question: 'Section 12(2)(b): Time Of Supply Goods Payment Date?'
  includes:
  - M_TOSGPD_LE_PDCO
  produces:
  - product: M_TOSGPD_PD_PDCO
    from:
    - M_TOSGPD_LE_PDCO
- id: C_TOPOGIS
  question: 'Schedule II, paragraph 3: Treatment Or Process On Goods Is Services?'
  includes:
  - M_TOPOGIS_LE_TOAGIS
  produces:
  - product: M_TOPOGIS_PD_TOAGIS
    from:
    - M_TOPOGIS_LE_TOAGIS
- id: C_PUOBGIS
  question: 'Schedule II, paragraph 4(b): Private Use Of Business Goods Is Services?'
  includes:
  - M_PUOBGIS_LE_BGPUDS
  produces:
  - product: M_PUOBGIS_PD_BGPUDS
    from:
    - M_PUOBGIS_LE_BGPUDS
time:
  law_date: F_DOI
