outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_LAATOS:
    outcome: TOS_SERVICES_GOVERNED_BY_S13
    expr: A_LAATOS_1 AND A_LAATOS_2
    module: M_LAATOS
    description: The liability to pay tax on services arises at the time of supply, and the time of supply is determined under
      the provisions of Section 13.
  LE_TOSRB:
    outcome: TOS_SERVICES_DATE_UNDER_CLAUSE_C_IS_RECIPIENT_BOOKS_DATE
    expr: A_SERVICES AND A_BOOKS AND NOT G_CLAUSE_AB
    module: M_TOSRB
    description: 'This outcome applies where all of the following are true: the supply is of services, the recipient shows
      the receipt of services in his books of account, and neither clause (a) nor clause (b) applies. The date of that books
      entry is then the date under this clause in the earliest-of-the-following-da'
  LE_OFTOSFE:
    outcome: TIME_OF_SUPPLY_OF_EXCESS_AMOUNT_IS_DATE_OF_ISSUE_OF_INVOICE_FOR_EXCESS
    expr: G_PROVISO_CONDITIONS
    module: M_OFTOSFE
    description: When all proviso conditions hold, the time of supply to the extent of the excess amount only is the date
      of issue of the invoice relating to that excess amount.
  LE_TOS_RCM_PAYMENT:
    outcome: CLAUSE_A_DATE_IS_EARLIER_OF_RECIPIENT_BOOKS_PAYMENT_DATE_AND_BANK_DEBIT_DATE
    expr: A_RCM_SUPPLY AND G_EARLIER_PAYMENT_DATE
    module: M_TOSRPD
    description: For a reverse charge supply, the date under clause (a) is the earlier of two dates. If the recipient's books
      entry date is earlier than or the same as the bank debit date, the books entry date is used. If the bank debit date
      is earlier, the bank debit date is used. Under Section 13(3), the time of s
  LE_TOSRSD:
    outcome: TIME_OF_SUPPLY_IS_SIXTY_DAY_DATE
    expr: A_RCM_SUPPLY_TOSRSD AND G_ISSUE_DOC AND A_SIXTY_DAY_DATE AND A_EARLIER_DATE
    module: M_TOSRSD
    description: For a reverse charge supply, the time of supply is the date immediately following sixty days from the date
      the supplier issued the invoice or a document in lieu of it, when that date is the earlier of the following dates.
  LE_RRTOS:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_ENTRY_IN_RECIPIENT_BOOKS
    expr: A_RCM_SERVICES AND G_NOT_DETERMINABLE AND A_BOOKS_DATE_RRTOS
    module: M_RRTOS
    description: The recipient books-entry date is the time of supply only when the proviso is triggered, that is when neither
      clause (a) nor clause (b) can determine the time of supply.
  LE_TOS_BOOKS:
    outcome: TIME_OF_SUPPLY_IS_RECIPIENT_BOOKS_ENTRY_DATE
    expr: G_CONTEXT AND A_BOOKS_EARLIER
    module: M_RTOSFAE
    description: For a supply by associated enterprises with the service supplier outside India, the time of supply is the
      date of entry in the recipient's books when that date is the earlier date.
  LE_TOS_PAYMENT:
    outcome: TIME_OF_SUPPLY_IS_PAYMENT_DATE
    expr: G_CONTEXT AND A_PAYMENT_EARLIER_RTOSFAE
    module: M_RTOSFAE
    description: For a supply by associated enterprises with the service supplier outside India, the time of supply is the
      date of payment when that date is the earlier date.
  LE_TOSVI:
    outcome: TIME_OF_SUPPLY_IS_VOUCHER_ISSUE_DATE
    expr: G_VOUCHER_TOS
    module: M_TOSVI
    description: When the supply is a supply of vouchers by a supplier AND that supply is identifiable at the point of issue
      of the voucher, the time of supply shall be the date of issue of voucher.
  LE_TOSVR:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_REDEMPTION_OF_VOUCHER
    expr: G_VOUCHER_RESIDUAL AND A_REDEMPTION_DATE
    module: M_TOSVR
    description: If the supply is a supply of vouchers by a supplier and it falls in all other cases, the time of supply shall
      be the date of redemption of the voucher.
  LE_M_TOSAIV:
    outcome: TIME_OF_SUPPLY_FOR_ADDITION
    expr: G_M_TOSAIV_1
    module: M_TOSAIV
    description: If the conditions are met, the time of supply for the value addition is the date the supplier receives that
      amount.
  LE_TIIRI:
    outcome: TAX_INVOICE_INCLUDES_REVISED_INVOICE
    expr: G_TIIRI_CONDITIONS
    module: M_TIIRI
    description: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised
      invoice issued by the supplier for a supply made earlier.
  LE_OBLIGATION_MET:
    outcome: OBLIGATION_MET
    expr: (NOT G_PRECONDITIONS) OR G_COMPLIANCE
    module: M_ITFGWM
    description: The obligation to issue a tax invoice under this provision is met if the preconditions do not apply, or if
      they do, the compliance requirements are fulfilled.
  LE_ITFGNM:
    outcome: OBLIGATION_MET
    expr: G_ITFGNM_APPLICABILITY AND G_ITFGNM_OBLIGATION
    module: M_ITFGNM
    description: The obligation to issue a tax invoice is met if the applicability conditions and the obligation requirements
      are both fulfilled.
  LE_M_GPTSTIC:
    outcome: POWER_DEFINED
    expr: G_M_GPTSTIC_01
    module: M_GPTSTIC
    description: This provision defines the Government's power to specify tax invoice requirements for certain supplies.
  LE_RPTITI:
    outcome: OBLIGATION_FULFILLED
    expr: G_RPTITI_PRE AND G_RPTITI_FUL
    module: M_RPTITI
  LE_M_GMSSCFI:
    outcome: POWER_EXISTS
    expr: G_M_GMSSCFI
    module: M_GMSSCFI
    description: The Government has the power to specify categories of services or supplies for which special invoicing rules
      apply.
  LE_M_ODDTI:
    outcome: DOCUMENT_DEEMED_TAX_INVOICE
    expr: A_M_ODDTI_1 AND A_M_ODDTI_2 AND A_M_ODDTI_3
    module: M_ODDTI
    description: If all conditions are met, the document is deemed to be a tax invoice.
  LE_M_TIMNBI:
    outcome: PERMISSION_TO_NOT_ISSUE_INVOICE_APPLIES
    expr: A_M_TIMNBI_1
    module: M_TIMNBI
    description: The permission to not issue a tax invoice applies if the service is covered by a specific government notification.
  LE_1:
    outcome: REVISED_INVOICE_MAY_BE_ISSUED
    expr: G_1
    module: M_RIAR
  LE_M_NTIBTH:
    outcome: TAX_INVOICE_NOT_MANDATORY
    expr: G_M_NTIBTH
    module: M_NTIBTH
    description: The option to not issue a tax invoice is available if all conditions are met.
  LE_M_BOSFEOC:
    outcome: PROVISION_COMPLIED_WITH
    expr: (NOT G_APPLICABILITY_CONDITIONS) OR (G_APPLICABILITY_CONDITIONS AND G_OBLIGATION_FULFILLED)
    module: M_BOSFEOC
    description: The obligation to issue a bill of supply is complied with if the conditions do not apply, or if they do apply
      and a compliant bill of supply is issued.
  LE_RVFAP:
    outcome: COMPLIANCE_WITH_S31_3_D
    expr: (NOT G_CONDITIONS) OR G_FULFILLMENT
    module: M_RVFAP
    description: Compliance is met if the conditions for the obligation are not triggered, or if they are triggered and the
      obligation is fulfilled.
  LE_IFCSDDNA:
    outcome: INVOICE_TIMING_COMPLIANT
    expr: (NOT G_APPLICABILITY) OR A_COMPLIANCE
    module: M_IFCSDDNA
  LE_M_IFCSDDA_TIMELY:
    outcome: INVOICE_TIMELY_S31_5_a
    expr: G_M_IFCSDDA_CONDITIONS AND A_M_IFCSDDA_TIMELINE_MET
    module: M_IFCSDDA
    description: The invoice is considered timely under this provision if all preconditions are met and the invoice is issued
      by the due date of payment.
  LE_IFCSPLTE:
    outcome: INVOICE_TIMELINE_COMPLIANT
    expr: (NOT G_APPLICABILITY_IFCSPLTE) OR A_DEADLINE_MET
    module: M_IFCSPLTE
    description: The invoice is compliant with this timeline rule if the rule does not apply, or if the rule applies and the
      deadline was met.
  LE_RVFNS:
    outcome: PERMISSION_TO_ISSUE_REFUND_VOUCHER
    expr: A_RVFNS_1 AND A_RVFNS_2 AND A_RVFNS_3 AND A_RVFNS_4 AND A_RVFNS_5
    module: M_RVFNS
  LE_M_NBOSBTH:
    outcome: MAY_NOT_ISSUE_BILL_OF_SUPPLY
    expr: A_NBOSBTH_1 AND A_NBOSBTH_2 AND A_NBOSBTH_3
    module: M_NBOSBTH
  LE_IFRFUS:
    outcome: OBLIGATION_TO_ISSUE_INVOICE
    expr: G_CONDITIONS_IFRFUS
    module: M_IFRFUS
  LE_PVFRP_DUTY_APPLIES:
    outcome: PAYMENT_VOUCHER_DUTY_APPLIES
    expr: G_RCM_RECIPIENT AND A_PAYMENT_TO_SUPPLIER
    module: M_PVFRP
    description: Notwithstanding (LK_S31_1_2), sub-sections (1) and (2) do not gate this duty, the duty applies where a registered
      person liable under section 9 makes payment to the supplier
  LE_PVFRP_OBLIGATION_MET:
    outcome: PAYMENT_VOUCHER_OBLIGATION_MET
    expr: G_RCM_RECIPIENT AND A_PAYMENT_TO_SUPPLIER AND G_VOUCHER_OBLIGATION
    module: M_PVFRP
    description: Met only when the duty applies and the voucher is issued at the time of payment, source states no consequence
      for non-compliance
  LE_S31_4_COMPLIANT:
    outcome: INVOICE_TIMELINE_COMPLIANT
    expr: NOT G_S31_4_APPLICABLE OR ((NOT A_S31_4_HAS_STATEMENTS OR A_S31_4_MEETS_STATEMENT_DEADLINE) AND (NOT A_S31_4_HAS_PAYMENTS
      OR A_S31_4_MEETS_PAYMENT_DEADLINE))
    module: M_IFCSOG
    description: The invoice is issued in compliance with the timelines specified in Section 31(4).
  LE_IFCOSS:
    outcome: COMPLIANT_WITH_S31_6
    expr: (NOT G_IFCOSS_CONDITIONS) OR G_IFCOSS_OBLIGATIONS
    module: M_IFCOSS
    description: Compliance with Section 31(6) is achieved if the applicability conditions are not met, or if the conditions
      are met and the invoicing obligations are fulfilled.
  LE_M_IFGOA:
    outcome: INVOICE_TIMELY_S31_7
    expr: G_APPLICABILITY_IFGOA AND A_INVOICE_TIMELY
    module: M_IFGOA
  LE_M_TOSIOP:
    outcome: PD_M_TOSIOP_TOS
    expr: G_M_TOSIOP_COND
    module: M_TOSIOP
    description: The time of supply is calculated if the applicability conditions are met.
  LE_DODOP:
    outcome: DATE_OF_RECEIPT_OF_PAYMENT_FIXED_FOR_CLAUSES_A_B
    expr: PD_M_TOSIOP AND G_EARLIER_DATE
    module: M_DODOP
    description: Where the date of receipt of payment is being determined for clauses (a) and (b) it is the earlier of the
      books-entry date and the bank-credit date.
  LE_TOS_PROVISION_DATE:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_PROVISION_OF_SERVICE
    expr: G_CLAUSE_B_TRIGGER AND A_PROVISION_EARLIER
    module: M_TOSSPOP
    description: Under Section 13(2)(b) the time of supply of services is the date of provision of service when the invoice
      is not issued within the section 31 period and that date is not later than the date of receipt of payment
  LE_TOS_PAYMENT_DATE:
    outcome: TIME_OF_SUPPLY_IS_DATE_OF_RECEIPT_OF_PAYMENT
    expr: G_CLAUSE_B_TRIGGER AND A_PAYMENT_EARLIER
    module: M_TOSSPOP
    description: Under Section 13(2)(b) the time of supply of services is the date of receipt of payment when the invoice
      is not issued within the section 31 period and payment is received before the date of provision of service
  LE_SDBIOP:
    outcome: SUPPLY_DEEMED_MADE_TO_EXTENT_COVERED
    expr: PD_M_TOSIOP AND G_COVER
    module: M_SDBIOP
    description: Where clauses (a) or (b) are being applied and the supply is covered by the invoice or the payment, the supply
      is deemed made to the extent of that coverage.
  LE_TOSRR:
    outcome: TIME_OF_SUPPLY_IS_RETURN_DUE_DATE
    expr: A_TOS_NOT_DETERMINABLE AND A_PERIODIC_RETURN_REQUIRED
    module: M_TOSRR
    description: Both conditions must hold. The time of supply is then mandatorily fixed as the date on which the periodical
      return is to be filed. This is the date the return is due, not the date it is actually filed.
  LE_TOSRTP:
    outcome: TIME_OF_SUPPLY_IS_DATE_TAX_PAID
    expr: G_TOSRTP_COND
    module: M_TOSRTP
    description: If the time of supply cannot be determined under sub-section (2), (3) or (4) and the case is any other case,
      the time of supply shall be the date on which the tax is paid. The tax payment date supplies the outcome date. It is
      not an additional condition
triggers:
  CT_NO_RECIPIENT_PAYMENT_DATE:
    question: Tax is paid or liable to be paid on reverse charge basis, but the recipient has neither entered the payment
      in his books nor had it debited in his bank account. Is the clause (a) date not yet determinable, so that only the other
      dates listed under Section 13(3) are relevant?
    trigger: F_SUPPLY_REVERSE_CHARGE_STATUS IN ['PAID','LIABLE_NOT_YET_PAID'] AND F_RECIPIENT_PAYMENT_DATE_ORDER = 'NONE'
    beside: LE_TOS_RCM_PAYMENT
