    statement: The invoice is issued before or at the time each such statement is issued
    order: HIGH
    interpretation: For each successive statement of accounts involved, was a corresponding invoice issued on or before the
      date that statement was issued?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_STATEMENT_OF_ACCOUNT_ISSUE_DATE
  A_S31_4_MEETS_PAYMENT_DEADLINE:
    statement: The invoice is issued before or at the time each such payment is received
    order: HIGH
    interpretation: For each successive payment involved, was a corresponding invoice issued on or before the date that payment
      was received?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_PAYMENT_DATE
  A_IFCOSS_IS_SERVICE:
    statement: The supply is a supply of services.
    order: LOW
    rule: F_SUPPLY_NATURE = 'SERVICES'
  A_IFCOSS_IS_CONTRACTUAL:
    statement: The supply of services is made under a contract.
    order: LOW
    rule: F_SUPPLY_IS_CONTRACTUAL = TRUE
  A_IFCOSS_CEASED_EARLY:
    statement: The supply of services ceases before its completion.
    order: LOW
    rule: F_SUPPLY_CEASED_PRE_COMPLETION = TRUE
  A_IFCOSS_TIMING_OBLIGATION:
    statement: The invoice shall be issued at the time when the supply ceases.
    order: HIGH
    interpretation: Is the invoice issue date the same as the date the supply of services ceased?
    grounding:
    - F_INVOICE_ISSUE_DATE
    - F_SUPPLY_CESSATION_DATE
  A_IFCOSS_EXTENT_OBLIGATION:
    statement: The invoice shall be issued to the extent of the supply made before such cessation.
    order: HIGH
    interpretation: Does the invoice cover the extent of the supply made before the cessation?
    grounding:
    - F_SUPPLY_COVERED_BY_INVOICE
    - F_SUPPLY_VALUE_PRE_CESSATION
  A_APPROVAL_SALE:
    statement: The goods are sent or taken on approval for sale or return
    order: LOW
    rule: F_GOODS_APPROVAL_STATUS = TRUE
  A_REMOVAL_BEFORE_SUPPLY:
    statement: The goods are removed before the supply takes place
    order: LOW
    rule: F_GOODS_REMOVED_BEFORE_SUPPLY_OCCURS = TRUE
  A_INVOICE_TIMELY:
    statement: The invoice is issued on or before the earlier of the time of supply or six months from the date of removal
    order: LOW
    rule: F_INVOICE_ISSUED_BY_APPROVAL_DEADLINE = TRUE
  A_M_TOSIOP_1:
    statement: The supply is a supply of services.
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_BOOKS_DATE:
    statement: The date of receipt of payment shall be the date on which the payment is entered in the books of account of
      the supplier where that date is earlier than or the same as the date on which the payment is credited to his bank account
    order: LOW
    rule: F_PAYMENT_RECORDING_DATE_ORDER IN ['BOOKS_FIRST','SAME_DATE','BOOKS_ONLY']
  A_BANK_DATE:
    statement: The date of receipt of payment shall be the date on which the payment is credited to the bank account of the
      supplier where that date is earlier than or the same as the date on which the payment is entered in his books of account
    order: LOW
    rule: F_PAYMENT_RECORDING_DATE_ORDER IN ['BANK_FIRST','SAME_DATE','BANK_ONLY']
  A_SERVICE_SUPPLY:
    statement: The time of supply being determined is that of a supply of services
    order: LOW
    rule: F_SUPPLY_IS_SERVICE = TRUE
  A_PROVISION_EARLIER:
    statement: Of the date of provision of service and the date of receipt of payment, the date of provision of service is
      the earlier or the same date
    order: LOW
    rule: F_SERVICE_PAYMENT_DATE_ORDER IN ['PROVISION_FIRST','SAME_DATE','PROVISION_ONLY']
  A_PAYMENT_EARLIER:
    statement: Of the date of provision of service and the date of receipt of payment, the date of receipt of payment is the
      earlier
    order: LOW
    rule: F_SERVICE_PAYMENT_DATE_ORDER IN ['PAYMENT_FIRST','PAYMENT_ONLY']
  A_INVOICE_COVER:
    statement: The supply is covered by the invoice, and is deemed to have been made to the extent it is so covered
    order: LOW
    rule: F_SUPPLY_COVERED_BY_INVOICE > 0
  A_PAYMENT_COVER:
    statement: The supply is covered by the payment, as the case may be, and is deemed to have been made to the extent it
      is so covered
    order: LOW
    rule: F_SUPPLY_COVERED_BY_PAYMENT > 0
  A_PERIODIC_RETURN_REQUIRED:
    statement: The case is one where a periodical return has to be filed.
    order: LOW
    rule: F_RETURN_PERIODICAL_REQUIRED = TRUE
  A_OTHERCASE:
    statement: The case is any other case, that is a case not covered by the preceding clause of sub-section (5), which is
      the case in which a periodical return has to be filed
    order: LOW
    rule: F_RETURN_PERIODICAL_REQUIRED = FALSE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_CLAUSE_AB:
    name: Clause (a) or clause (b) applies
    logic: ANY
    members:
    - A_CLAUSE_A
    - A_CLAUSE_B
    description: TRUE if the provisions of clause (a) or of clause (b) apply. LE_TOSRB uses NOT G_CLAUSE_AB, so this clause
      applies only where neither clause applies
  G_PROVISO_CONDITIONS:
    name: Proviso conditions for option on excess amount
    logic: ALL
    members:
    - A_TAXABLE_SERVICE_SUPPLIER
    - A_EXCESS_RECEIPT_UP_TO_LIMIT
    - A_SUPPLIER_OPTION_EXERCISED
    description: The supplier is of taxable service AND receives up to Rs 1000 in excess of the invoice amount AND exercises
      the option.
  G_EARLIER_PAYMENT_DATE:
    name: Earlier recipient payment date
    logic: ANY
    members:
    - A_BOOKS_DATE_EARLIER
    - A_BANK_DATE_EARLIER
    description: One of the recipient's two payment dates is identified as the earlier date. The source joins the dates with
      or and adds whichever is earlier. The two dates are therefore alternatives, and the earlier one is used. Both events
      are not required.
  G_ISSUE_DOC:
    name: Supplier reference document
    logic: ANY
    members:
    - A_INVOICE_BASIS
    - A_OTHER_DOC_BASIS
    description: The sixty days run from the date of issue by the supplier of either an invoice or any other document, by
      whatever name called, in lieu of the invoice.
  G_NOT_DETERMINABLE:
    name: Time of supply not determinable under clause (a) or clause (b)
    logic: ALL
    members:
    - PD_TOS_RCM_PAYMENT
    - PD_TOSRSD
    description: The source says not possible to determine under clause (a) or clause (b). It is read as the fallback applying
      when neither clause can determine the time of supply. If either clause can determine it, the fallback is not needed.
  G_CONTEXT:
    name: Associated enterprise supply with supplier of service outside India
    logic: ALL
    members:
    - A_ASSOC
    - A_LOC
    description: Both context conditions of the proviso must be met together.
  G_VOUCHER_TOS:
    name: Identifiable voucher supply
    logic: ALL
    members:
    - A_VOUCHER_SUPPLY
    - A_SUPPLY_IDENTIFIABLE
    description: Both conditions are required. The supply is a supply of vouchers by a supplier AND the supply is identifiable
      at the point of issue of the voucher.
  G_VOUCHER_RESIDUAL:
    name: Residual voucher supply case
    logic: ALL
    members:
    - A_VOUCHER_SUPPLY_TOSVR
    - A_OTHER_CASES
    description: The supply is a supply of vouchers by a supplier and it is one of all other cases.
  G_M_TOSAIV_1:
    name: Value Addition Type
    logic: ANY
    members:
    - A_M_TOSAIV_1
    - A_M_TOSAIV_2
    - A_M_TOSAIV_3
    description: The addition to value must be for interest, a late fee, or a penalty due to delayed payment.
  G_TIIRI_CONDITIONS:
    name: Conditions for a revised invoice to be treated as a tax invoice
    logic: ALL
    members:
    - A_TIIRI_1
    - A_TIIRI_2
    - A_TIIRI_3
  G_PRECONDITIONS:
    name: Preconditions
    logic: ALL
    members:
    - A_PRE_SUPPLIER_REGISTERED
    - A_PRE_TAXABLE_GOODS
    - A_PRE_GOODS_MOVEMENT
    description: The conditions that trigger the obligation to issue a tax invoice under this rule.
  G_COMPLIANCE:
    name: Compliance Requirements
    logic: ALL
    members:
    - A_CMP_INVOICE_ISSUED
    - A_CMP_INVOICE_TIMING
    - G_INVOICE_CONTENTS
    description: The requirements for fulfilling the obligation, including issuance, timing, and content of the invoice.
  G_INVOICE_CONTENTS:
    name: Invoice Contents
    logic: ALL
    members:
    - A_CNT_DESCRIPTION
    - A_CNT_QUANTITY
    - A_CNT_VALUE
    - A_CNT_TAX
    - A_CNT_PRESCRIBED_PARTICULARS
    description: The details that must be shown on the tax invoice.
  G_ITFGNM_APPLICABILITY:
    name: Applicability Conditions
    logic: ALL
    members:
    - A_ITFGNM_01
    - A_ITFGNM_02
    - A_ITFGNM_03
    description: The obligation applies to a registered person supplying taxable goods in a case not involving movement of
      goods.
  G_ITFGNM_OBLIGATION:
    name: Obligation Requirements
    logic: ALL
    members:
    - A_ITFGNM_04
    - G_ITFGNM_TIMING
    - G_ITFGNM_CONTENT
    description: The obligation requires issuing a compliant invoice within the specified time.
  G_ITFGNM_TIMING:
    name: Invoice Timing
    logic: ANY
    members:
    - A_ITFGNM_05
    - A_ITFGNM_06
    description: The invoice must be issued before or at the time of delivery OR making the goods available.
  G_ITFGNM_CONTENT:
    name: Invoice Content
    logic: ALL
    members:
    - A_ITFGNM_07
    - A_ITFGNM_08
    - A_ITFGNM_09
    - A_ITFGNM_10
    - A_ITFGNM_11
    description: The invoice must show all prescribed particulars.
  G_M_GPTSTIC_01:
    name: Conditions for Government's power to specify invoice rules
    logic: ALL
    members:
    - A_M_GPTSTIC_01
    - A_M_GPTSTIC_02
    - A_M_GPTSTIC_03
    description: The power is defined by its scope and the conditions for its exercise.
  G_RPTITI_PRE:
    name: Preconditions
    logic: ALL
    members:
    - A_RPTITI_01
    - A_RPTITI_02
  G_RPTITI_FUL:
    name: Fulfillment
    logic: ALL
    members:
    - A_RPTITI_03
    - A_RPTITI_04
    - G_RPTITI_CON
  G_RPTITI_CON:
    name: Invoice Content
    logic: ALL
    members:
    - A_RPTITI_05
    - A_RPTITI_06
    - A_RPTITI_07
    - A_RPTITI_08
  G_M_GMSSCFI:
    name: Components of the Government's power to specify invoice rules
    logic: ALL
    members:
    - A_GOVT_POWER_TO_SPECIFY
    - A_CONDITION_COUNCIL_RECOMMENDATION
    - A_CONDITION_BY_NOTIFICATION
    - A_POWER_TO_PRESCRIBE_TIME
    - A_POWER_TO_PRESCRIBE_MANNER
    description: The power comprises the ability to specify categories and rules, subject to procedural conditions.
  G_1:
    name: Conditions for issuing a revised invoice
    logic: ALL
    members:
    - A_1
    - A_2
    - A_3
    - A_4
  G_M_NTIBTH:
    name: Conditions for not issuing a tax invoice for low-value supply
    logic: ALL
    members:
    - A_M_NTIBTH_1
    - A_M_NTIBTH_2
    - A_M_NTIBTH_3
  G_APPLICABILITY_CONDITIONS:
    name: Applicability Conditions
    logic: ALL
    members:
    - A_REGISTERED_SUPPLIER
    - G_SUPPLIER_CATEGORY
    description: The obligation applies if the supplier is a registered person AND is either making an exempt supply OR is
      a composition taxpayer.
  G_SUPPLIER_CATEGORY:
    name: Supplier Category
    logic: ANY
    members:
    - A_SUPPLYING_EXEMPTED
    - A_PAYING_TAX_S10
    description: The supplier is either making an exempt supply or is a composition taxpayer.
  G_OBLIGATION_FULFILLED:
    name: Obligation Fulfillment
    logic: ALL
    members:
    - A_BOS_ISSUED_INSTEAD_OF_TI
    - A_BOS_HAS_PRESCRIBED_PARTICULARS
    - A_BOS_ISSUED_IN_PRESCRIBED_MANNER
    description: The obligation is fulfilled if a bill of supply is issued instead of a tax invoice, and it contains the prescribed
      particulars and is issued in the prescribed manner.
  G_CONDITIONS:
    name: Trigger Conditions
    logic: ALL
    members:
    - A_SUPPLIER_IS_REGISTERED
    - A_ADVANCE_PAYMENT_RECEIVED
    - A_PAYMENT_FOR_SUPPLY
    description: These are the conditions that trigger the obligation to issue a receipt voucher.
  G_FULFILLMENT:
    name: Fulfillment Actions
    logic: ALL
    members:
    - G_DOCUMENT_ISSUED
    - A_DOCUMENT_HAS_PARTICULARS
    - A_DOCUMENT_EVIDENCES_PAYMENT
    description: These are the actions required to fulfill the obligation once triggered.
  G_DOCUMENT_ISSUED:
    name: Document Issued
    logic: ANY
    members:
    - A_RECEIPT_VOUCHER_ISSUED
    - A_OTHER_DOCUMENT_ISSUED
    description: A receipt voucher or another equivalent document must be issued.
  G_APPLICABILITY:
    name: Applicability Conditions
    logic: ALL
    members:
    - A_IS_CSS
    - A_DUE_DATE_NOT_ASCERTAINABLE
    - PD_RVFAP
  G_M_IFCSDDA_CONDITIONS:
    name: Preconditions for applying Section 31(5)(a)
    logic: ALL
