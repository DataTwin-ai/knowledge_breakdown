# GOVERNANCE MASTER TSG05_03 Advances (TG05 Time & Period)
# LAW ARC - 1 laws - status APPROVED
name: TSG05_03 Advances - GOVERNANCE MASTER rulebook
version: TSG05_03
facts:
  F_SPRD:
    name: Supplier Payment Receipt Date
    type: DATE
    tier: T0
  F_PSR:
    name: Payment Supply Reference
    type: TEXT
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_TOSGPD_A_SRPFS:
    statement: The supplier receives the payment with respect to the supply.
    order: HIGH
    if_false: the payment record shows the payment relates to a different supply, or no payment has been received by the supplier
    interpretation: Does the payment record show that the supplier received a payment with respect to the supply described
      in the invoice or contract? If so, the receipt date is F_SPRD.
    grounding:
    - F_SPRD
    - F_PSR
    handler: light
groups: {}
outcomes:
  M_TOSGPD_LE_PRDC:
    outcome: PAYMENT_RECEIPT_DATE_IS_CANDIDATE_TIME_OF_SUPPLY
    expr: M_TOSGPD_A_SRPFS
    module: M_TOSGPD
    description: When the supplier receives the payment with respect to the supply, the date of that receipt is a date for
      the 'earlier of' rule on the time of supply of goods. The comparison with the other dates is decided in the parent provision.
products:
  M_TOSGPD_PD_PRDC:
    statement: When the supplier receives the payment with respect to the supply, the date of that receipt is a date for the
      'earlier of' rule on the time of supply of goods. The comparison with the other dates is decided in the parent provision.
compounds:
- id: C_TOSGPD
  question: 'Section 12(2)(b): Time Of Supply Goods Payment Date?'
  includes:
  - M_TOSGPD_LE_PRDC
  produces:
  - product: M_TOSGPD_PD_PRDC
    from:
    - M_TOSGPD_LE_PRDC
time:
  law_date: F_DOI
