# GOVERNANCE MASTER TSG10_01 Credit notes, returns & cancellation (TG10 Adjustments)
# LAW ARC - 9 laws - status NEEDS_REVIEW
name: TSG10_01 Credit notes, returns & cancellation - GOVERNANCE MASTER rulebook
version: TSG10_01
facts:
  F_TAX_INVOICE_EXISTS_FOR_SUPPLY:
    name: One or more tax invoices were issued for the supply
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TAXABLE_VALUE_EXCESS_AMOUNT:
    name: Amount by which invoice taxable value exceeds correct taxable value
    type: AMOUNT
    tier: T1
  F_SUPPLY_TAX_CHARGED_EXCESS_AMOUNT:
    name: Amount by which invoice tax charged exceeds correct tax payable
    type: AMOUNT
    tier: T1
  F_SUPPLY_GOODS_RETURNED:
    name: Goods supplied were returned by the recipient
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_DEFICIENT:
    name: Supplied goods or services were found to be deficient
    type: BOOLEAN
    tier: T1
  F_CREDIT_NOTE_ISSUER_IS_SUPPLIER:
    name: Credit note issuer is the supplier of the original supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_CREDIT_NOTE_RECIPIENT_IS_SUPPLY_RECIPIENT:
    name: Credit note recipient is the recipient of the original supply
    type: BOOLEAN
    tier: T1
  F_CREDIT_NOTE_COVERS_SINGLE_FY_SUPPLIES:
    name: Credit note pertains to supplies made within a single financial year
    type: BOOLEAN
    tier: T0
  F_CREDIT_NOTE_CONTAINS_PRESCRIBED_PARTICULARS:
    name: Credit note contains all particulars prescribed in the Rules
    type: BOOLEAN
    tier: T1
  F_DOCUMENT_TYPE:
    name: Type of document
    type: CODE
    options:
    - ASSESSMENT_DOCUMENT
    - BILL_OF_SUPPLY
    - CREDIT_NOTE
    - DEBIT_NOTE
    - DELIVERY_CHALLAN
    - OTHER
    - OTHER_LIKE_DOCUMENT
    - PAYMENT_VOUCHER
    - RECEIPT_VOUCHER
    - REFUND_VOUCHER
    - REVISED_INVOICE
    - SELF_INVOICE
    - SUPPLEMENTARY_INVOICE
    - TAX_INVOICE
    tier: T1
  F_CREDIT_NOTE_RELATES_TO_SUPPLY:
    name: Credit note relates to a supply
    type: BOOLEAN
    tier: T0
  F_CN_DECLARED_IN_ISSUE_MONTH_RETURN:
    name: Credit note declared in the return for the month of issue
    type: BOOLEAN
    tier: T1
  F_CN_DECLARED_BY_STATUTORY_DEADLINE:
    name: Credit note declared by the statutory deadline (whichever is earlier)
    type: BOOLEAN
    tier: T0
  F_TAX_ADJUSTMENT_MANNER_IS_PRESCRIBED:
    name: Tax liability adjustment follows the prescribed manner
    type: BOOLEAN
    tier: T0
  F_SUPPLY_TAX_INCIDENCE_PASSED:
    name: Incidence of tax and interest on the supply passed on to another person
    type: BOOLEAN
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
  F_DOCUMENT_ISSUER_ROLE:
    name: Role of the entity that issued the document
    type: CODE
    options:
    - SUPPLIER
    - RECIPIENT
    - AGENT
    - OTHER
    tier: T1
  F_TAX_INVOICE_ISSUE_DATE:
    name: Date of issue of the tax invoice relating to the supply
    type: DATE
    tier: T1
  F_ORIGINAL_SUPPLY_DATE:
    name: Date of the earlier supply
    type: DATE
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_M_IOCNFEV_1:
    statement: One or more tax invoices have been issued for the supply
    order: LOW
    rule: F_TAX_INVOICE_EXISTS_FOR_SUPPLY = TRUE
  A_M_IOCNFEV_2:
    statement: The taxable value charged in a tax invoice for the supply is found to exceed the correct taxable value
    order: LOW
    rule: F_SUPPLY_TAXABLE_VALUE_EXCESS_AMOUNT > 0
  A_M_IOCNFEV_3:
    statement: The tax charged in a tax invoice for the supply is found to exceed the correct tax payable
    order: LOW
    rule: F_SUPPLY_TAX_CHARGED_EXCESS_AMOUNT > 0
  A_M_IOCNFEV_4:
    statement: The goods supplied are returned by the recipient
    order: LOW
    rule: F_SUPPLY_GOODS_RETURNED = TRUE
  A_M_IOCNFEV_5:
    statement: The goods or services or both supplied are found to be deficient
    order: HIGH
    interpretation: Based on the contract and evidence, are the supplied goods or services considered deficient?
    grounding:
    - F_SUPPLY_IS_DEFICIENT
  A_M_IOCNFEV_6A:
    statement: The credit note is issued by the person who supplied the goods or services or both
    order: LOW
    rule: F_CREDIT_NOTE_ISSUER_IS_SUPPLIER = TRUE
  A_M_IOCNFEV_6B:
    statement: The person who supplied such goods or services or both is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_IOCNFEV_7:
    statement: The credit note is issued to the recipient of the supply
    order: LOW
    rule: F_CREDIT_NOTE_RECIPIENT_IS_SUPPLY_RECIPIENT = TRUE
  A_M_IOCNFEV_8:
    statement: The credit note is for supplies made in a financial year
    order: LOW
    rule: F_CREDIT_NOTE_COVERS_SINGLE_FY_SUPPLIES = TRUE
  A_M_IOCNFEV_9:
    statement: The credit note contains such particulars as may be prescribed
    order: HIGH
    interpretation: Does the credit note contain all the particulars prescribed under the CGST Rules?
    grounding:
    - F_CREDIT_NOTE_CONTAINS_PRESCRIBED_PARTICULARS
  A_ISSUER_CONTEXT:
    statement: A registered person issues a credit note in relation to a supply of goods or services or both
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE AND F_DOCUMENT_TYPE = 'CREDIT_NOTE' AND F_CREDIT_NOTE_RELATES_TO_SUPPLY = TRUE
  A_DECLARATION_TIMING:
    statement: The credit note is declared in the return for the month during which it was issued
    order: LOW
    rule: F_CN_DECLARED_IN_ISSUE_MONTH_RETURN = TRUE
  A_DECLARATION_DEADLINE:
    statement: 'The credit note is declared not later than the earlier of: September following the end of the financial year
      of supply, or the date of furnishing the relevant annual return'
    order: LOW
    rule: F_CN_DECLARED_BY_STATUTORY_DEADLINE = TRUE
  A_ADJUSTMENT_MANNER:
    statement: The tax liability is adjusted in the manner prescribed
    order: HIGH
    interpretation: Is the tax liability adjusted in the manner prescribed by the relevant Rules?
    grounding:
    - F_TAX_ADJUSTMENT_MANNER_IS_PRESCRIBED
  A_M_NRITIP_1:
    statement: the incidence of tax and interest on such supply has been passed on to any other person
    order: HIGH
    interpretation: This condition checks if the economic burden of the tax and interest has been shifted to another party,
      such as the recipient. If so, the supplier cannot reduce their output tax liability, as this would lead to unjust enrichment.
    grounding:
    - F_SUPPLY_TAX_INCIDENCE_PASSED
  A_IODNFS_1:
    statement: One or more tax invoices have been issued for the supply
    order: LOW
    rule: F_TAX_INVOICE_EXISTS_FOR_SUPPLY = TRUE
  A_ADJUSTMENT_IN_PRESCRIBED_MANNER:
    statement: The tax liability is adjusted in the manner prescribed
    order: HIGH
    interpretation: Is the tax liability adjusted in the manner prescribed by the relevant Rules?
    grounding:
    - F_TAX_ADJUSTMENT_MANNER_IS_PRESCRIBED
  A_TIIRI_1:
    statement: The document is a revised invoice.
    order: LOW
    rule: F_DOCUMENT_TYPE = 'REVISED_INVOICE'
  A_TIIRI_2:
    statement: The revised invoice was issued by the supplier.
    order: LOW
    rule: F_DOCUMENT_ISSUER_ROLE = 'SUPPLIER'
  A_TIIRI_3:
    statement: The revised invoice is in respect of a supply made earlier.
    order: HIGH
    interpretation: Does the date of issue of the revised invoice (F_TAX_INVOICE_ISSUE_DATE) occur after the date of the supply
      it pertains to (F_ORIGINAL_SUPPLY_DATE)?
    grounding:
    - F_TAX_INVOICE_ISSUE_DATE
    - F_ORIGINAL_SUPPLY_DATE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_M_IOCNFEV_ALL:
    name: Overall Conditions
    logic: ALL
    members:
    - G_M_IOCNFEV_REASONS
    - A_M_IOCNFEV_6A
    - A_M_IOCNFEV_6B
    - A_M_IOCNFEV_7
    - A_M_IOCNFEV_8
    - A_M_IOCNFEV_9
    description: All conditions regarding the reason for issuance and the properties of the credit note and its issuer must
      be met.
  G_M_IOCNFEV_REASONS:
    name: Reasons for Issuance
    logic: ANY
    members:
    - G_M_IOCNFEV_REASON_1
    - A_M_IOCNFEV_4
    - A_M_IOCNFEV_5
    description: At least one of the specified reasons for issuing a credit note must exist.
  G_M_IOCNFEV_REASON_1:
    name: Invoice Error Reason
    logic: ALL
    members:
    - A_M_IOCNFEV_1
    - G_M_IOCNFEV_EXCESS_TYPE
    description: A tax invoice must have been issued, and it must contain an error in value or tax.
  G_M_IOCNFEV_EXCESS_TYPE:
    name: Type of Excess Charge
    logic: ANY
    members:
    - A_M_IOCNFEV_2
    - A_M_IOCNFEV_3
    description: The error can be either in the taxable value or the tax charged.
  G_TIIRI_CONDITIONS:
    name: Conditions for a revised invoice to be treated as a tax invoice
    logic: ALL
    members:
    - A_TIIRI_1
    - A_TIIRI_2
    - A_TIIRI_3
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_M_IOCNFEV:
    outcome: CREDIT_NOTE_MAY_BE_ISSUED
    expr: G_M_IOCNFEV_ALL
    module: M_IOCNFEV
  LE_M_DOCNIR:
    outcome: CREDIT_NOTE_ADJUSTMENT_VALID
    expr: A_ISSUER_CONTEXT AND A_DECLARATION_TIMING AND A_DECLARATION_DEADLINE AND A_ADJUSTMENT_MANNER
    module: M_DOCNIR
    description: The tax adjustment for a credit note is valid if the issuer is a registered person, the declaration is made
      in the month of issue and before the final deadline, and the adjustment follows the prescribed manner.
  LE_M_NRITIP:
    outcome: REDUCTION_NOT_PERMITTED
    expr: A_M_NRITIP_1
    module: M_NRITIP
    description: The supplier is not permitted to reduce their output tax liability.
  LE_IODNFS_1:
    outcome: IODNFS_1
    expr: A_IODNFS_1
    module: M_IODNFS
    description: One or more tax invoices have been issued for the supply (Section 34(3), part of the law)
  LE_ADJUSTMENT_IN_PRESCRIBED_MANNER:
    outcome: ADJUSTMENT_IN_PRESCRIBED_MANNER
    expr: A_ADJUSTMENT_IN_PRESCRIBED_MANNER
    module: M_DODNIR
    description: The tax liability is adjusted in the manner prescribed (Section 34(4), part of the law)
  LE_TIIRI:
    outcome: TAX_INVOICE_INCLUDES_REVISED_INVOICE
    expr: G_TIIRI_CONDITIONS
    module: M_TIIRI
    description: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised
      invoice issued by the supplier for a supply made earlier.
products:
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_M_IOCNFEV:
    statement: CREDIT_NOTE_MAY_BE_ISSUED
  PD_M_DOCNIR:
    statement: The tax adjustment for a credit note is valid if the issuer is a registered person, the declaration is made
      in the month of issue and before the final deadline, and the adjustment follows the prescribed manner.
  PD_M_NRITIP:
    statement: The supplier is not permitted to reduce their output tax liability.
  PD_IODNFS_1:
    statement: Invoice Issued
  PD_ADJUSTMENT_IN_PRESCRIBED_MANNER:
    statement: Prescribed Adjustment Manner
  PD_TIIRI:
    statement: For the purposes of Section 31, a document is included in the expression 'tax invoice' if it is a revised invoice
      issued by the supplier for a supply made earlier.
compounds:
- id: C_S7_SS1
  question: 'Section 7(1): which clause applies?'
  includes:
  - LE_SIAFOS
  - LE_M_IOSFC
  - LE_SISIA
  produces:
  - product: PD_SIAFOS
    from:
    - LE_SIAFOS
  - product: PD_M_IOSFC
    from:
    - LE_M_IOSFC
  - product: PD_SISIA
    from:
    - LE_SISIA
- id: C_IOCNFEV
  question: 'Section 34(1): Issuance Of Credit Note For Excess Value?'
  includes:
  - LE_M_IOCNFEV
  produces:
  - product: PD_M_IOCNFEV
    from:
    - LE_M_IOCNFEV
- id: C_DOCNIR
  question: 'Section 34(2): Declaration Of Credit Note In Return?'
  includes:
  - LE_M_DOCNIR
  produces:
  - product: PD_M_DOCNIR
    from:
    - LE_M_DOCNIR
- id: C_NRITIP
  question: 'Section 34(2), Proviso 1: No Reduction If Tax Incidence Passed?'
  includes:
  - LE_M_NRITIP
  produces:
  - product: PD_M_NRITIP
    from:
    - LE_M_NRITIP
- id: C_IODNFS
  question: One or more tax invoices have been issued for the supply? (Section 34(3))
  includes:
  - LE_IODNFS_1
  produces:
  - product: PD_IODNFS_1
    from:
    - LE_IODNFS_1
- id: C_DODNIR
  question: The tax liability is adjusted in the manner prescribed? (Section 34(4))
  includes:
  - LE_ADJUSTMENT_IN_PRESCRIBED_MANNER
  produces:
  - product: PD_ADJUSTMENT_IN_PRESCRIBED_MANNER
    from:
    - LE_ADJUSTMENT_IN_PRESCRIBED_MANNER
- id: C_TIIRI
  question: 'Section 31, Explanation 1: Tax Invoice Includes Revised Invoice?'
  includes:
  - LE_TIIRI
  produces:
  - product: PD_TIIRI
    from:
    - LE_TIIRI
