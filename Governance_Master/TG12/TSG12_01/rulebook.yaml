# GOVERNANCE MASTER TSG12_01 Tax payment & ledgers (TG12 Payment, Interest & Fees)
# LAW ARC - 14 laws - status NEEDS_REVIEW
name: TSG12_01 Tax payment & ledgers - GOVERNANCE MASTER rulebook
version: TSG12_01
facts:
  F_ITC_S49_MANNER_RECORD:
    name: Record of how the credit was taken with reference to section 49
    type: TEXT
    tier: T0
  F_ITC_CREDITED_TO_ELECTRONIC_LEDGER:
    name: The amount of credit is credited to the electronic credit ledger of the person
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_IS_CASUAL_TAXPAYER:
    name: Supplier is a casual taxable person
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER:
    name: Supplier is a non-resident taxable person
    type: BOOLEAN
    tier: T0
  F_DEPOSIT_FOR_EXTENSION_IS_ADEQUATE:
    name: Additional deposit for extension is equivalent to the estimated tax liability for the extension period
    type: BOOLEAN
    tier: T1
  F_PAYMENT_LEDGER_USED:
    name: Electronic ledger or ledgers debited for the payment
    type: CODE
    options:
    - ELECTRONIC_CREDIT_LEDGER
    - ELECTRONIC_CASH_LEDGER
    - BOTH
    - OTHER
    tier: T1
  F_S41_COMPLIANCE_STATUS:
    name: Status of compliance with the provisions of Section 41
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_TAX_PAYMENT_METHOD:
    name: Method of supplier's tax payment to government for the supply
    type: CODE
    options:
    - PAID_IN_CASH
    - PAID_VIA_ITC
    - NOT_PAID
    tier: T1
  F_SUPPLIER_ITC_IS_ADMISSIBLE:
    name: Whether the input tax credit used by the supplier to pay tax was admissible for that supply
    type: BOOLEAN
    tier: T0
  F_LIABILITY_ACCRUAL_DATE:
    name: Date on which the liability or obligation accrued
    type: DATE
    tier: T1
  F_REGISTRATION_CANCELLATION_DATE:
    name: Date of cancellation of registration
    type: DATE
    tier: T1
  F_CANCELLATION_PAYMENT_LEDGER:
    name: Ledger(s) used for payment of cancellation liability under Section 29(5)
    type: CODE
    options:
    - ELEC_CREDIT_LEDGER
    - ELEC_CASH_LEDGER
    - BOTH
    tier: T0
  F_SUPPLY_ORIGIN_LOCATION:
    name: Geographical origin of the supply
    type: CODE
    options:
    - TERRITORIAL_WATERS_OF_INDIA
    - OTHER
    tier: T1
  F_DAYS_BETWEEN_APP_AND_COMMENCEMENT:
    name: Number of days between registration application submission and business commencement
    type: AMOUNT
    tier: T0
  F_PERSON_HAS_SEZ_UNIT:
    name: Person has a unit in a Special Economic Zone
    type: BOOLEAN
    tier: T1
  F_PERSON_IS_SEZ_DEVELOPER:
    name: Person is a Special Economic Zone developer
    type: BOOLEAN
    tier: T1
  F_REGISTRATION_VALIDITY_TEST_DATE:
    name: Date on which the validity of the certificate of registration is being tested
    type: DATE
    tier: T0
  F_REGISTRATION_EFFECTIVE_DATE:
    name: Effective date of registration
    type: DATE
    tier: T0
  F_REGISTRATION_APPLICATION_PERIOD_END_DATE:
    name: Last date of the period specified in the application for registration
    type: DATE
    tier: T0
  F_SUPPLY_TAXABILITY_RESULT:
    name: Recorded result of the prior taxability determination for the supply made by the person
    type: CODE
    options:
    - TAXABLE
    - NOT_TAXABLE
    tier: T0
  F_SUPPLY_DATE:
    name: Date of supply
    type: DATE
    tier: T1
  F_REGISTRATION_CERTIFICATE_ISSUE_DATE:
    name: Date of issuance of the certificate of registration
    type: DATE
    tier: T0
  F_APPLICATION_EXTENSION_REASON:
    name: Reason provided for seeking extension of time
    type: TEXT
    tier: T1
  F_REGISTRATION_EXTENSION_GRANTED:
    name: Proper officer has granted an extension of the registration period
    type: BOOLEAN
    tier: T1
  F_REGISTRATION_EXTENSION_DAYS:
    name: Duration of the granted registration period extension
    type: AMOUNT
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_MANNER:
    statement: The credit of input tax is taken in the manner specified in section 49
    order: HIGH
    interpretation: Was the credit taken in the manner specified in section 49? Section 49 is not loaded here, and its content
      must not be assumed.
    grounding:
    - F_ITC_S49_MANNER_RECORD
  A_LEDGER:
    statement: The said amount of input tax credit shall be credited to the electronic credit ledger of such person
    order: LOW
    rule: F_ITC_CREDITED_TO_ELECTRONIC_LEDGER = TRUE
  A_DEBIT_CREDIT_LEDGER:
    statement: The amount required under section 18(4) is paid by way of debit in the electronic credit ledger
    order: LOW
    rule: F_PAYMENT_LEDGER_USED IN ['ELECTRONIC_CREDIT_LEDGER', 'BOTH']
  A_DEBIT_CASH_LEDGER:
    statement: The amount required under section 18(4) is paid by way of debit in the electronic cash ledger
    order: LOW
    rule: F_PAYMENT_LEDGER_USED IN ['ELECTRONIC_CASH_LEDGER', 'BOTH']
  A_M_ICTPTG_1:
    statement: The entitlement to the credit is subject to the provisions of section 41.
    order: HIGH
    interpretation: Are the provisions of Section 41 complied with in respect of the supply?
    grounding:
    - F_S41_COMPLIANCE_STATUS
  A_M_ICTPTG_2:
    statement: The tax charged in respect of the supply has been actually paid to the Government in cash.
    order: LOW
    rule: F_SUPPLIER_TAX_PAYMENT_METHOD = 'PAID_IN_CASH'
  A_M_ICTPTG_3:
    statement: The tax charged in respect of the supply has been actually paid to the Government through utilisation of input
      tax credit.
    order: LOW
    rule: F_SUPPLIER_TAX_PAYMENT_METHOD = 'PAID_VIA_ITC'
  A_M_ICTPTG_4:
    statement: The input tax credit utilised to pay the tax was admissible in respect of the said supply.
    order: HIGH
    interpretation: Was the input tax credit utilised by the supplier to pay tax on this supply admissible to the supplier
      under the relevant provisions?
    grounding:
    - F_SUPPLIER_ITC_IS_ADMISSIBLE
  A_M_LCARC_1:
    statement: The cancellation of registration shall not affect the liability of the person to pay tax and other dues under
      this Act for any period prior to the date of cancellation, whether or not such tax and other dues are determined before
      or after the date of cancellation.
    order: HIGH
    interpretation: This provision establishes that a person's liability to pay tax and other dues that arose during a period
      before their registration was cancelled continues to exist even after the cancellation. The timing of the determination
      or assessment of these dues (whether before or after the cancellation date) does not extinguish the liability.
    grounding:
    - F_LIABILITY_ACCRUAL_DATE
    - F_REGISTRATION_CANCELLATION_DATE
  A_M_LCARC_2:
    statement: The cancellation of registration shall not affect the liability of the person to discharge any obligation under
      this Act or the rules made thereunder for any period prior to the date of cancellation.
    order: HIGH
    interpretation: This provision establishes that a person's liability to discharge any non-monetary obligation under the
      GST Act or its rules (such as filing final returns or preserving records) that arose during a period before their registration
      was cancelled continues to exist even after the cancellation.
    grounding:
    - F_LIABILITY_ACCRUAL_DATE
    - F_REGISTRATION_CANCELLATION_DATE
  A_M_POORC_3:
    statement: The amount is paid by way of debit in the electronic credit ledger.
    order: LOW
    rule: F_CANCELLATION_PAYMENT_LEDGER IN ['ELEC_CREDIT_LEDGER', 'BOTH']
  A_M_POORC_4:
    statement: The amount is paid by way of debit in the electronic cash ledger.
    order: LOW
    rule: F_CANCELLATION_PAYMENT_LEDGER IN ['ELEC_CASH_LEDGER', 'BOTH']
  A_M_RFSFTW_1:
    statement: The person makes a supply from the territorial waters of India.
    order: LOW
    rule: F_SUPPLY_ORIGIN_LOCATION = 'TERRITORIAL_WATERS_OF_INDIA'
  A_IS_CTP:
    statement: The person is a casual taxable person
    order: LOW
    rule: F_SUPPLIER_IS_CASUAL_TAXPAYER = TRUE
  A_IS_NRTP:
    statement: The person is a non-resident taxable person
    order: LOW
    rule: F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER = TRUE
  A_TIMING_OBLIGATION:
    statement: The person shall apply for registration at least five days prior to the commencement of business
    order: LOW
    rule: F_DAYS_BETWEEN_APP_AND_COMMENCEMENT >= 5
  A_M_SRFSU_1:
    statement: A person has a unit, as defined in the Special Economic Zones Act, 2005, in a Special Economic Zone
    order: LOW
    rule: F_PERSON_HAS_SEZ_UNIT = TRUE
  A_M_SRFSU_2:
    statement: A person is a Special Economic Zone developer
    order: LOW
    rule: F_PERSON_IS_SEZ_DEVELOPER = TRUE
  A_CASUAL:
    statement: The certificate of registration is issued to a casual taxable person
    order: LOW
    rule: F_SUPPLIER_IS_CASUAL_TAXPAYER = TRUE
  A_NONRES:
    statement: The certificate of registration is issued to a non-resident taxable person
    order: LOW
    rule: F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER = TRUE
  A_VALIDITY:
    statement: The tested date falls within the validity of the certificate of registration, which shall be valid for the
      period specified in the application for registration or ninety days from the effective date of registration, whichever
      is earlier
    order: HIGH
    interpretation: 'Is the test date (F_REGISTRATION_VALIDITY_TEST_DATE) on or after the effective date of registration (F_REGISTRATION_EFFECTIVE_DATE)
      and on or before the earlier of: (a) the period end date specified in the application (F_REGISTRATION_APPLICATION_PERIOD_END_DATE),
      and (b) ninety days from the effective date of registration?'
    grounding:
    - F_REGISTRATION_VALIDITY_TEST_DATE
    - F_REGISTRATION_EFFECTIVE_DATE
    - F_REGISTRATION_APPLICATION_PERIOD_END_DATE
  A_TAXABLE:
    statement: Such casual or non-resident taxable person makes a taxable supply
    order: LOW
    rule: F_SUPPLY_TAXABILITY_RESULT = 'TAXABLE'
  A_AFTER_CERT:
    statement: Such person shall make taxable supplies only after the issuance of the certificate of registration
    order: HIGH
    interpretation: Is the date of the taxable supply (F_SUPPLY_DATE) after the date of issuance of the certificate of registration
      (F_REGISTRATION_CERTIFICATE_ISSUE_DATE)?
    grounding:
    - F_SUPPLY_DATE
    - F_REGISTRATION_CERTIFICATE_ISSUE_DATE
  A_M_EORP_1:
    statement: Sufficient cause is shown by the said taxable person
    order: HIGH
    interpretation: Has the taxable person shown sufficient cause for the proper officer to grant an extension of the registration
      period?
    grounding:
    - F_APPLICATION_EXTENSION_REASON
  A_M_EORP_2:
    statement: The proper officer extends the said period of ninety days
    order: LOW
    rule: F_REGISTRATION_EXTENSION_GRANTED = TRUE
  A_M_EORP_3:
    statement: The extension is for a further period not exceeding ninety days
    order: LOW
    rule: F_REGISTRATION_EXTENSION_DAYS <= 90
  A_ADFE_2:
    statement: The additional tax deposited for the extension is equivalent to the estimated tax liability for the extension
      period.
    order: LOW
    rule: F_DEPOSIT_FOR_EXTENSION_IS_ADEQUATE = TRUE
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_M_ICTPTG_1:
    name: ITC Entitlement Conditions
    logic: ALL
    members:
    - A_M_ICTPTG_1
    - G_M_ICTPTG_2
    description: The claim must be subject to Section 41, and the tax must have been paid to the government.
  G_M_ICTPTG_2:
    name: Tax Payment Condition
    logic: ANY
    members:
    - A_M_ICTPTG_2
    - G_M_ICTPTG_3
    description: The tax must have been paid to the government either in cash or via admissible ITC.
  G_M_ICTPTG_3:
    name: Payment Via Admissible ITC
    logic: ALL
    members:
    - A_M_ICTPTG_3
    - A_M_ICTPTG_4
    description: Payment via ITC requires both that the method was ITC and the credit used was admissible.
  G_PERSON_TYPE:
    name: Person Type
    logic: ANY
    members:
    - A_IS_CTP
    - A_IS_NRTP
    description: The person is either a casual taxable person or a non-resident taxable person.
  G_M_SRFSU_1:
    name: Person is an SEZ unit holder or developer
    logic: ANY
    members:
    - A_M_SRFSU_1
    - A_M_SRFSU_2
  G_PERSON:
    name: Casual or non-resident taxable person
    logic: ANY
    members:
    - A_CASUAL
    - A_NONRES
    description: Either category brings the certificate and the person within Section 27(1)
  A_ADFE_1:
    name: Any of the referred steps (A_ADFE_1)
    logic: ANY
    members:
    - PD_M_EORP_1
    - PD_SUPPLY_AFTER_CERT
    - PD_VALIDITY
    description: TRUE when any step of the law this check refers to is TRUE
outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_MANNER:
    outcome: MANNER
    expr: A_MANNER
    module: M_EFITC
    description: The credit of input tax is taken in the manner specified in section 49 (Section 16(1), part of the law)
  LE_LEDGER:
    outcome: LEDGER
    expr: A_LEDGER
    module: M_EFITC
    description: The said amount of input tax credit shall be credited to the electronic credit ledger of such person (Section
      16(1), part of the law)
  LE_DEBIT_CREDIT_LEDGER:
    outcome: DEBIT_CREDIT_LEDGER
    expr: A_DEBIT_CREDIT_LEDGER
    module: M_POOCOE
    description: The amount required under section 18(4) is paid by way of debit in the electronic credit ledger (Section
      18(4), part of the law)
  LE_DEBIT_CASH_LEDGER:
    outcome: DEBIT_CASH_LEDGER
    expr: A_DEBIT_CASH_LEDGER
    module: M_POOCOE
    description: The amount required under section 18(4) is paid by way of debit in the electronic cash ledger (Section 18(4),
      part of the law)
  LE_M_ICTPTG:
    outcome: ITC_ENTITLEMENT_DENIED_BY_S16_2_c
    expr: NOT G_M_ICTPTG_1
    module: M_ICTPTG
  LE_M_LCARC_1:
    outcome: TAX_LIABILITY_UNAFFECTED
    expr: A_M_LCARC_1
    module: M_LCARC
    description: The legal consequence that a pre-existing liability to pay tax and other dues is not affected by the cancellation
      of registration.
  LE_M_LCARC_2:
    outcome: OBLIGATION_UNAFFECTED
    expr: A_M_LCARC_2
    module: M_LCARC
    description: The legal consequence that a pre-existing liability to discharge other obligations is not affected by the
      cancellation of registration.
  LE_M_POORC_3:
    outcome: M_POORC_3
    expr: A_M_POORC_3
    module: M_POORC
    description: The amount is paid by way of debit in the electronic credit ledger. (Section 29(5), part of the law)
  LE_M_POORC_4:
    outcome: M_POORC_4
    expr: A_M_POORC_4
    module: M_POORC
    description: The amount is paid by way of debit in the electronic cash ledger. (Section 29(5), part of the law)
  LE_M_RFSFTW_1:
    outcome: REGISTRATION_REQUIRED_IN_SPECIFIED_LOCATION
    expr: A_M_RFSFTW_1
    module: M_RFSFTW
    description: If a person makes a supply from the territorial waters of India, they are obligated to obtain registration
      in the coastal State or Union territory where the nearest point of the appropriate baseline is located.
  LE_M_RFCONP:
    outcome: OBLIGATION_MET
    expr: G_PERSON_TYPE AND A_TIMING_OBLIGATION
    module: M_RFCONP
    description: The obligation to apply for registration is met if the person is a casual or non-resident taxable person
      and applies at least five days before business commencement.
  LE_M_SRFSU:
    outcome: OBLIGATION_TO_APPLY_FOR_SEPARATE_REGISTRATION
    expr: G_M_SRFSU_1
    module: M_SRFSU
    description: If the person has an SEZ unit or is an SEZ developer, they are obligated to apply for a separate registration,
      which is distinct from any business place outside the SEZ in the same State or UT.
  LE_VALIDITY:
    outcome: CERTIFICATE_VALID_ON_TEST_DATE
    expr: G_PERSON AND A_VALIDITY
    module: M_VOCRC
    description: The certificate issued to a casual or non-resident taxable person is valid on the tested date only within
      the earlier of the period specified in the application or ninety days from the effective date of registration
  LE_SUPPLY_AFTER_CERT:
    outcome: TAXABLE_SUPPLY_AFTER_CERTIFICATE_COMPLIANT
    expr: G_PERSON AND A_TAXABLE AND A_AFTER_CERT
    module: M_VOCRC
    description: A taxable supply by such casual or non-resident taxable person complies with Section 27(1) only if it is
      made after the issuance of the certificate of registration
  LE_M_EORP_1:
    outcome: REGISTRATION_PERIOD_EXTENSION_IS_VALID
    expr: A_M_EORP_1 AND A_M_EORP_2 AND A_M_EORP_3
    module: M_EORP
    description: The extension of the registration period is valid if sufficient cause was shown, the proper officer granted
      the extension, and the extension period does not exceed 90 days.
  LE_ADFE:
    outcome: ADDITIONAL_DEPOSIT_OBLIGATION_COMPLIED_WITH
    expr: NOT A_ADFE_1 OR A_ADFE_2
    module: M_ADFE
    description: The law is complied with if either no extension is sought, or if an extension is sought and the required
      additional deposit has been made.
products:
  PD_SIAFOS:
    statement: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  PD_M_IOSFC:
    statement: SUPPLY_INCLUDED
  PD_SISIA:
    statement: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  PD_MANNER:
    statement: The credit of input tax is taken in the manner specified in section 49
  PD_LEDGER:
    statement: The said amount of input tax credit shall be credited to the electronic credit ledger of such person
  PD_DEBIT_CREDIT_LEDGER:
    statement: The amount required under section 18(4) is paid by way of debit in the electronic credit ledger
  PD_DEBIT_CASH_LEDGER:
    statement: The amount required under section 18(4) is paid by way of debit in the electronic cash ledger
  PD_M_ICTPTG:
    statement: ITC_ENTITLEMENT_DENIED_BY_S16_2_c
  PD_M_LCARC_1:
    statement: The legal consequence that a pre-existing liability to pay tax and other dues is not affected by the cancellation
      of registration.
  PD_M_LCARC_2:
    statement: The legal consequence that a pre-existing liability to discharge other obligations is not affected by the cancellation
      of registration.
  PD_M_POORC_3:
    statement: The amount is paid by way of debit in the electronic credit ledger.
  PD_M_POORC_4:
    statement: The amount is paid by way of debit in the electronic cash ledger.
  PD_M_RFSFTW_1:
    statement: If a person makes a supply from the territorial waters of India, they are obligated to obtain registration
      in the coastal State or Union territory where the nearest point of the appropriate baseline is located.
  PD_M_RFCONP:
    statement: The obligation to apply for registration is met if the person is a casual or non-resident taxable person and
      applies at least five days before business commencement.
  PD_M_SRFSU:
    statement: If the person has an SEZ unit or is an SEZ developer, they are obligated to apply for a separate registration,
      which is distinct from any business place outside the SEZ in the same State or UT.
  PD_VALIDITY:
    statement: The certificate issued to a casual or non-resident taxable person is valid on the tested date only within the
      earlier of the period specified in the application or ninety days from the effective date of registration
  PD_SUPPLY_AFTER_CERT:
    statement: A taxable supply by such casual or non-resident taxable person complies with Section 27(1) only if it is made
      after the issuance of the certificate of registration
  PD_M_EORP_1:
    statement: The extension of the registration period is valid if sufficient cause was shown, the proper officer granted
      the extension, and the extension period does not exceed 90 days.
  PD_ADFE:
    statement: The law is complied with if either no extension is sought, or if an extension is sought and the required additional
      deposit has been made.
