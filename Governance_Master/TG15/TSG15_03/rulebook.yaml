compounds:
- id: C_S20_E1_CA
  question: 'Section 20, Explanation (a): which clause applies?'
  includes:
  - LE_RPPFY
  - LE_RPLAQ
  produces:
  - product: PD_RPPFY
    from:
    - LE_RPPFY
  - product: PD_RPLAQ
    from:
    - LE_RPLAQ
- id: C_S20_E1
  question: 'Section 20, Explanation : which clause applies?'
  includes:
  - LE_MOROC
  - LE_TURNOVER_MEANING
  produces:
  - product: PD_MOROC
    from:
    - LE_MOROC
  - product: PD_TURNOVER_MEANING
    from:
    - LE_TURNOVER_MEANING
- id: C_LCARC
  question: 'Section 29(3): Liability Continues After Registration Cancellation?'
  includes:
  - LE_M_LCARC_1
  - LE_M_LCARC_2
  produces:
  - product: PD_M_LCARC_1
    from:
    - LE_M_LCARC_1
  - product: PD_M_LCARC_2
    from:
    - LE_M_LCARC_2
- id: C_ISDDC
  question: 'Section 20(1): Input Service Distributor Distributes Credit?'
  includes:
  - LE_ISDDC
  produces:
  - product: PD_ISDDC
    from:
    - LE_ISDDC
- id: C_S20_SS2
  question: 'Section 20(2): which clause applies?'
  includes:
  - LE_CDAPD
  - LE_M_DNEAC
  - LE_CATOR_1
  - LE_CATMR
  - LE_CATAR
  produces:
  - product: PD_CDAPD
    from:
    - LE_CDAPD
  - product: PD_M_DNEAC
    from:
    - LE_M_DNEAC
  - product: PD_CATOR_1
    from:
    - LE_CATOR_1
  - product: PD_CATMR
    from:
    - LE_CATMR
  - product: PD_CATAR
    from:
    - LE_CATAR
- id: C_ROEDC
  question: 'Section 21: Recovery Of Excess Distributed Credit?'
  includes:
  - LE_EXCESS_RECOVERY
  - LE_RECOVERY_CONSEQUENCES
  produces:
  - product: PD_EXCESS_RECOVERY
    from:
    - LE_EXCESS_RECOVERY
  - product: PD_RECOVERY_CONSEQUENCES
    from:
    - LE_RECOVERY_CONSEQUENCES
