outcomes:
  LE_SIAFOS:
    outcome: SUPPLY_INCLUDED_S7_1_a
    expr: G_FORMS AND G_TIMING AND A_CONSIDERATION AND A_PERSON AND A_BUSINESS
    module: M_SIAFOS
    description: The transaction is included in the definition of supply under Section 7(1)(a) if it meets all the specified
      conditions.
  LE_M_IOSFC:
    outcome: SUPPLY_INCLUDED
    expr: A_M_IOSFC_1 AND A_M_IOSFC_2
    module: M_IOSFC
  LE_SISIA:
    outcome: SUPPLY_INCLUDED
    expr: A_SCHEDULE_I_ACTIVITY AND G_STATUS AND A_NO_CONSIDERATION
    module: M_SISIA
    description: The transaction is included in the scope of supply if it is a Schedule I activity, made or agreed to be made,
      and is without consideration.
  LE_PROHIBITION_VIOLATED:
    outcome: PROHIBITION_VIOLATED
    expr: A_PERSON_UNREGISTERED AND A_TAX_COLLECTED
    module: M_UPSNCT
  LE_M_RPTCGBL:
    outcome: UNAUTHORISED_TAX_COLLECTION
    expr: A_REGISTERED_PERSON AND A_COLLECTS_TAX AND NOT G_AUTHORISED_COLLECTION
    module: M_RPTCGBL
    description: The prohibition on unauthorised tax collection is triggered if a registered person collects tax and that
      collection is not in accordance with the Act or the Rules.
  LE_M_CFFOM:
    outcome: REGISTRATION_CANCELLATION_PERMITTED
    expr: G_M_CFFOM_1
    module: M_CFFOM
    description: The grounds for cancellation by a proper officer are met if the registration was obtained by fraud, wilful
      misstatement, or suppression of facts.
  LE_CLRM_OPT:
    outcome: S10_1_A_MANUFACTURER_MAY_OPT_COMPOSITION
    expr: G_CLRM_ELIG AND A_CLRM_MANUF AND A_CLRM_COND
    module: M_CLRM
    description: A registered manufacturer whose preceding-year aggregate turnover did not exceed fifty lakh rupees may opt
      for the composition amount under clause (a), subject to prescribed conditions and restrictions. This is a permission,
      not an obligation.
  LE_CLRM_RATE:
    outcome: S10_1_A_AMOUNT_AT_PRESCRIBED_RATE_NOT_EXCEEDING_ONE_PERCENT
    expr: G_CLRM_ELIG AND A_CLRM_MANUF AND A_CLRM_COND AND A_CLRM_OPT AND G_CLRM_RATE
    module: M_CLRM
    description: Where an eligible manufacturer has opted, the amount payable in lieu of section 9(1) tax is calculated at
      the prescribed rate, which does not exceed one per cent. of turnover in State or turnover in Union territory
  LE_CLRM_S9:
    outcome: S10_1_A_OPTION_SUBJECT_TO_S9_3_AND_S9_4
    expr: A_CLRM_OPT AND G_CLRM_S9
    module: M_CLRM
    description: The composition option and the in-lieu amount operate subject to the provisions of section 9(3) and 9(4).
      Where tax on a supply is payable under either sub-section, those provisions prevail over this clause. The option does
      not displace them, and the subjection is not a bar to opting.
  LE_OPTION:
    outcome: COMPOSITION_OPTION_UNDER_S10_1_B_AVAILABLE
    expr: G_ELIG
    module: M_CRFSIIRS
    description: The permissive option under this clause is available when every eligibility element holds. Because the clause
      uses may, availability does not mean that the option has been exercised.
  LE_AMOUNT:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX_AT_S10_1_B_RATE
    expr: G_ELIG AND A_OPT AND G_AMOUNT
    module: M_CRFSIIRS
    description: An eligible person who has opted pays an amount in lieu of tax under section 9(1). The amount is calculated
      at the prescribed rate. That rate must not exceed two and a half per cent. of turnover in State or turnover in Union
      territory.
  LE_M_CRFOS:
    outcome: COMPOSITION_SCHEME_OPTION_AVAILABLE
    expr: G_M_CRFOS_ELIGIBILITY AND A_M_CRFOS_7
    module: M_CRFOS
  LE_EOIFTFC:
    outcome: VALUE_NOT_TAKEN_INTO_ACCOUNT_IN_TURNOVER
    expr: A_PROVISO_CTX AND A_TERRITORY AND A_EXEMPT_SVC AND G_FORM AND G_CONSIDERATION
    module: M_EOIFTFC
    description: The value (to the extent of interest or discount) of an exempt supply of services provided by extending deposits,
      loans or advances shall not be taken into account for determining the value of turnover in a State or Union territory
      for the second proviso.
  LE_GPTICL:
    outcome: COMPOSITION_LIMIT_INCREASE_AUTHORISED
    expr: G_INCREASE
    module: M_GPTICL
    description: An increase of the fifty lakh rupees limit is authorised under this proviso only if it is made by Government
      notification, to a higher amount, not above one crore and fifty lakh rupees, and as recommended by the Council
  LE_M_PSOSBCD:
    outcome: SERVICE_SUPPLY_PERMITTED_BY_PROVISO
    expr: G_M_PSOSBCD_1 AND A_M_PSOSBCD_2 AND A_M_PSOSBCD_3 AND A_M_PSOSBCD_4
    module: M_PSOSBCD
  LE_OPT:
    outcome: MAY_OPT_COMPOSITION_S10_2A
    expr: G_ELIG_CIFNS
    module: M_CIFNS
    description: The person may opt to pay the composition amount when all of this clause's eligibility conditions are met.
      This is a permission, not an obligation, and it applies notwithstanding contrary provisions of the Act
  LE_PAYMENT:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX
    expr: G_ELIG_CIFNS AND A_OPT_LIEU AND A_RATE_PRESCRIBED AND A_RATE_CAP
    module: M_CIFNS
    description: An eligible person who has opted pays, in lieu of tax under sub-section (1) of section 9, an amount calculated
      at the prescribed rate, and that rate does not exceed three per cent. of turnover in State or turnover in Union territory
  LE_RCM:
    outcome: S9_3_S9_4_PROVISIONS_PREVAIL_OVER_OPTION
    expr: A_OPT_LIEU AND G_RCM
    module: M_CIFNS
    description: The option is subject to the provisions of sub-sections (3) and (4) of section 9. Where those provisions
      apply, they continue to apply despite the option
  LE_M_CIFIS_1:
    outcome: COMPOSITION_OPTION_AVAILABLE_S10_2A
    expr: G_M_CIFIS_1
    module: M_CIFIS
    description: The option to pay tax under Section 10(2A) is available only when all four eligibility conditions are met.
      The provision permits the option and does not oblige the person to take it.
  LE_M_CIFIS_2:
    outcome: COMPOSITION_AMOUNT_PAYABLE_IN_LIEU_OF_S9_1_TAX
    expr: G_M_CIFIS_1 AND A_M_CIFIS_5 AND G_M_CIFIS_3 AND G_M_CIFIS_2
    module: M_CIFIS
    description: An eligible registered person who has opted pays an amount of tax at the prescribed rate, not exceeding three
      per cent., of the turnover in State or turnover in Union territory. This amount replaces the tax payable under sub-section
      (1) of section 9.
  LE_M_CIFIS_3:
    outcome: S9_3_AND_S9_4_PROVISIONS_PREVAIL_OVER_S10_2A_OPTION
