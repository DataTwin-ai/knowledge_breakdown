# GOVERNANCE MASTER TSG15_05 Offences & penalties (TG15 Administration)
# LAW ARC - 18 laws - status NEEDS_REVIEW
name: TSG15_05 Offences & penalties - GOVERNANCE MASTER rulebook
version: TSG15_05
facts:
  F_SUPPLIER_COMPLIES_WITH_COMPOSITION_CONDITIONS:
    name: Supplier complies with all prescribed conditions for composition scheme
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_ACTIVITY_DESCRIPTION:
    name: Description of supplier's activity
    type: TEXT
    tier: T0
  F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY:
    name: Supplier's aggregate turnover in the preceding financial year
    type: AMOUNT
    tier: T1
  F_SUPPLIER_IS_REGISTERED:
    name: Supplier is a registered person
    type: BOOLEAN
    tier: T0
  F_AMOUNT_COLLECTED_AS_TAX:
    name: Amount collected by way of tax
    type: AMOUNT
    tier: T0
  F_SUPPLY_CONTEXT:
    name: Context of the supply
    type: TEXT
    tier: T1
  F_PERSON_IS_REGISTERED:
    name: Person using the goods or services is a registered person
    type: BOOLEAN
    tier: T0
  F_REGISTRATION_OBTAINED_BY_FRAUD:
    name: Registration obtained by means of fraud
    type: BOOLEAN
    tier: T1
  F_REGISTRATION_OBTAINED_BY_WILFUL_MISSTATEMENT:
    name: Registration obtained by means of wilful misstatement
    type: BOOLEAN
    tier: T0
  F_REGISTRATION_OBTAINED_BY_SUPPRESSION_OF_FACTS:
    name: Registration obtained by means of suppression of facts
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_COMPOSITION_CATEGORY:
    name: Supplier's category for composition levy
    type: CODE
    options:
    - MANUFACTURER
    - OTHER
    - RESTAURANT_SERVICE
    tier: T0
  F_SUPPLIER_HAS_OPTED_COMPOSITION:
    name: Supplier has opted for the composition scheme
    type: BOOLEAN
    tier: T1
  F_COMPOSITION_RATE_APPLIED:
    name: Composition rate applied to compute the amount payable
    type: AMOUNT
    tier: T0
  F_COMPOSITION_RATE_BASE:
    name: Turnover base on which the composition amount is calculated
    type: CODE
    options:
    - TURNOVER_IN_STATE
    - TURNOVER_IN_UT
    - OTHER
    tier: T0
  F_SUPPLY_IS_NOTIFIED_RCM_S9_3:
    name: Supply category is notified for RCM under Section 9(3)
    type: BOOLEAN
    tier: T1
  F_SUPPLY_IS_UNDER_RCM_S9_4:
    name: Supply is liable to reverse charge under Section 9(4)
    type: BOOLEAN
    tier: T0
  F_SERVICE_IS_SCH_II_P6B:
    name: Service is of the nature referred to in Schedule II, paragraph 6(b)
    type: BOOLEAN
    tier: T1
  F_COMPOSITION_PRESCRIBED_CONDITIONS_MET:
    name: Records show compliance with the conditions and restrictions prescribed for the composition option
    type: BOOLEAN
    tier: T1
  F_PERSON_COMPOSITION_OPTION:
    name: Composition scheme option chosen by the person
    type: CODE
    options:
    - OTHER
    - S10_1_A
    - S10_1_B
    - S10_1_C
    - S10_2A
    tier: T0
  F_COMPOSITION_RATE_MATCHES_PRESCRIBED:
    name: Rate applied to compute the composition amount is the prescribed rate
    type: BOOLEAN
    tier: T0
  F_COMPOSITION_RATE_EXCEEDS_CEILING:
    name: Prescribed composition rate exceeds the statutory ceiling stated in the clause
    type: BOOLEAN
    tier: T1
  F_COMPOSITION_TAX_BASE:
    name: Turnover base on which the composition amount is calculated
    type: CODE
    options:
    - TURNOVER_IN_STATE
    - TURNOVER_IN_UT
    - OTHER
    tier: T0
  F_TURNOVER_DETERMINATION_PURPOSE:
    name: Provision for which the value of turnover is being determined
    type: CODE
    options:
    - ISD_CREDIT_DISTRIBUTION
    - OTHER
    - SECOND_PROVISO_S10_1
    tier: T0
  F_TURNOVER_TERRITORY_LEVEL:
    name: Territorial level at which the turnover is determined
    type: CODE
    options:
    - STATE
    - UT
    - OTHER
    tier: T0
  F_SUPPLY_IS_EXEMPT:
    name: Supply is an exempt supply
    type: BOOLEAN
    tier: T1
  F_SUPPLY_TYPE:
    name: Type of supply
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    tier: T1
  F_SERVICE_NATURE:
    name: Nature of service provided
    type: CODE
    options:
    - ADVANCE_EXTENSION
    - DEPOSIT_EXTENSION
    - LOAN_EXTENSION
    - OTHER
    tier: T1
  F_SUPPLY_CONSIDERATION_FORM:
    name: Form in which the consideration for the supply is represented
    type: CODE
    options:
    - DISCOUNT
    - INTEREST
    - OTHER
    tier: T1
  F_NOTIFICATION_ISSUER:
    name: Authority issuing the notification that changes the composition limit
    type: CODE
    options:
    - GOVERNMENT
    - OTHER
    tier: T1
  F_NOTIFICATION_LIMIT_INCREASE_ISSUED:
    name: A notification increasing the fifty lakh rupees composition limit has been issued
    type: BOOLEAN
    tier: T1
  F_NOTIFIED_COMPOSITION_LIMIT_AMOUNT:
    name: Higher composition limit amount stated in the notification
    type: AMOUNT
    tier: T1
  F_NOTIFIED_AMOUNT_RECOMMENDED_BY_COUNCIL:
    name: Notified higher limit amount is the amount recommended by the Council
    type: BOOLEAN
    tier: T1
  F_SERVICE_VALUE_SUPPLIED:
    name: Value of services supplied (other than Sch II, para 6(b) services)
    type: AMOUNT
    tier: T0
  F_TURNOVER_PREV_FY_IN_STATE:
    name: Turnover in State/UT in the preceding financial year
    type: AMOUNT
    tier: T1
  F_PERSON_ELIGIBLE_COMPOSITION_SS2:
    name: Person is eligible to opt to pay tax under sub-section (2) of the composition levy provision
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_ENGAGED_IN_NON_LEVIABLE_SUPPLY:
    name: Supplier is engaged in making any supply of goods or services which are not leviable to tax under this Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_COMPOSITION_RATE_PERCENT:
    name: Rate used to calculate the composition amount as a percentage of turnover in State or turnover in Union territory
    type: AMOUNT
    tier: T0
  F_SUPPLIER_MAKES_INTERSTATE_OUTWARD_SUPPLIES:
    name: Supplier is engaged in making inter-State outward supplies of goods or services
    type: BOOLEAN
    tier: T0
  F_TAX_COMPOSITION_RATE:
    name: Rate at which the composition amount of tax is calculated
    type: AMOUNT
    tier: T1
  F_TAX_COMPOSITION_BASE:
    name: Turnover on which the composition amount of tax is calculated
    type: CODE
    options:
    - OTHER
    - TURNOVER_IN_STATE
    - TURNOVER_IN_UT
    tier: T1
  F_SUPPLIER_MAKES_SUPPLY_VIA_TCS_ECO:
    name: Supplier is engaged in making any supply of goods or services through an electronic commerce operator who is required
      to collect tax at source under section 52
    type: BOOLEAN
    tier: T1
    ask: Is the supplier engaged in making any supply of goods or services through an electronic commerce operator who is
      required to collect tax at source under Section 52?
  F_SUPPLIER_SERVICES_SUPPLIED:
    name: Services supplied by the supplier
    type: TEXT
    tier: T1
  F_GOODS_MANUFACTURED_BY_SUPPLIER:
    name: Goods manufactured by the supplier
    type: TEXT
    tier: T0
  F_SUPPLIER_IS_CASUAL_TAXPAYER:
    name: Supplier is a casual taxable person
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER:
    name: Supplier is a non-resident taxable person
    type: BOOLEAN
    tier: T0
  F_TAX_COMPOSITION_RATE_IS_PRESCRIBED:
    name: Rate used for the composition amount is the rate prescribed under the law
    type: BOOLEAN
    tier: T1
  F_TFOS:
    name: Form of supply
    type: CODE
    options:
    - SALE
    - TRANSFER
    - BARTER
    - EXCHANGE
    - LICENCE
    - RENTAL
    - LEASE
    - DISPOSAL
    - OTHER
    tier: T1
  F_SUPPLY_DESCRIPTION:
    name: Description of supply
    type: TEXT
    tier: T1
  F_SUPPLY_STATUS:
    name: Status of supply
    type: CODE
    options:
    - AGREED
    - MADE
    tier: T1
  F_SUPPLY_CONSIDERATION_EXISTS:
    name: Consideration exists for the supply
    type: BOOLEAN
    tier: T1
  F_SUPPLIER_IS_A_PERSON:
    name: Supplier is a 'person' under the Act
    type: BOOLEAN
    tier: T0
  F_SUPPLIER_LOCATION:
    name: Location of supplier
    type: TEXT
    tier: T1
  F_RECIPIENT_LOCATION:
    name: Location of recipient
    type: TEXT
    tier: T1
  F_SUPPLY_PLACE:
    name: Place of supply
    type: TEXT
    tier: T1
predicates:
  A_SALE:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_TFOS = 'SALE'
  A_TRANSFER:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_TFOS = 'TRANSFER'
  A_BARTER:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_TFOS = 'BARTER'
  A_EXCHANGE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_TFOS = 'EXCHANGE'
  A_LICENCE:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_TFOS = 'LICENCE'
  A_RENTAL:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_TFOS = 'RENTAL'
  A_LEASE:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_TFOS = 'LEASE'
  A_DISPOSAL:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_TFOS = 'DISPOSAL'
  A_OTHER_FORM:
    statement: The supply of goods or services or both is another qualifying form
    order: HIGH
    interpretation: Based on the description, is the transaction a form of supply similar in nature to sale, transfer, barter,
      exchange, licence, rental, lease, or disposal?
    grounding:
    - F_TFOS
    - F_SUPPLY_DESCRIPTION
  A_MADE:
    statement: The supply is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED:
    statement: The supply is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_CONSIDERATION:
    statement: The supply is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_PERSON:
    statement: The supply is by a person
    order: LOW
    rule: F_SUPPLIER_IS_A_PERSON = TRUE
  A_BUSINESS:
    statement: The supply is in the course or furtherance of business
    order: HIGH
    interpretation: Based on the supplier's activity description, is this supply made in the course or furtherance of their
      business?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
  A_M_IOSFC_1:
    statement: The transaction is an import of services
    order: HIGH
    interpretation: Based on the supplier location, recipient location, and place of supply, is this an 'import of services'?
    grounding:
    - F_SUPPLIER_LOCATION
    - F_RECIPIENT_LOCATION
    - F_SUPPLY_PLACE
  A_M_IOSFC_2:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = TRUE
  A_SCHEDULE_I_ACTIVITY:
    statement: The activity is specified in Schedule I
    order: HIGH
    interpretation: Is the described activity one of the activities specified in Schedule I of the CGST Act?
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLY_DESCRIPTION
  A_MADE_SISIA:
    statement: The activity is made
    order: LOW
    rule: F_SUPPLY_STATUS = 'MADE'
  A_AGREED_SISIA:
    statement: The activity is agreed to be made
    order: LOW
    rule: F_SUPPLY_STATUS = 'AGREED'
  A_NO_CONSIDERATION:
    statement: The activity is without a consideration
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_EXISTS = FALSE
  A_PERSON_UNREGISTERED:
    statement: The person is not a registered person.
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = FALSE
  A_TAX_COLLECTED:
    statement: The person collects an amount by way of tax under this Act in respect of a supply of goods or services or both.
    order: LOW
    rule: F_AMOUNT_COLLECTED_AS_TAX > 0
  A_COLLECTS_TAX:
    statement: The person collects an amount as tax
    order: LOW
    rule: F_AMOUNT_COLLECTED_AS_TAX > 0
  A_ACCORDANCE_WITH_ACT:
    statement: The collection of tax is in accordance with the provisions of this Act
    order: HIGH
    interpretation: Is the collection of this tax amount for this supply permissible under the provisions of the Act?
    grounding:
    - F_AMOUNT_COLLECTED_AS_TAX
    - F_SUPPLY_CONTEXT
  A_ACCORDANCE_WITH_RULES:
    statement: The collection of tax is in accordance with the rules made thereunder
    order: HIGH
    interpretation: Is the collection of this tax amount for this supply permissible under the rules made under the Act?
    grounding:
    - F_AMOUNT_COLLECTED_AS_TAX
    - F_SUPPLY_CONTEXT
  A_REGISTERED_PERSON:
    statement: The person is a registered person
    order: LOW
    rule: F_PERSON_IS_REGISTERED = TRUE
  A_M_CFFOM_1:
    statement: The registration has been obtained by means of fraud.
    order: HIGH
    interpretation: Was the registration obtained by means of fraud?
    grounding:
    - F_REGISTRATION_OBTAINED_BY_FRAUD
  A_M_CFFOM_2:
    statement: The registration has been obtained by means of wilful misstatement.
    order: HIGH
    interpretation: Was the registration obtained by means of a wilful misstatement?
    grounding:
    - F_REGISTRATION_OBTAINED_BY_WILFUL_MISSTATEMENT
  A_M_CFFOM_3:
    statement: The registration has been obtained by means of suppression of facts.
    order: HIGH
    interpretation: Was the registration obtained by means of suppression of facts?
    grounding:
    - F_REGISTRATION_OBTAINED_BY_SUPPRESSION_OF_FACTS
  A_CLRM_REG:
    statement: The person opting under Section 10(1)(a) is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_CLRM_TO:
    statement: The registered person's aggregate turnover in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_CLRM_MANUF:
    statement: The registered person is a manufacturer, which is the case to which the one per cent. ceiling in Section 10(1)(a)
      applies
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_CATEGORY = 'MANUFACTURER'
  A_CLRM_OPT:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount calculated at such rate as may be prescribed
    order: LOW
    rule: F_SUPPLIER_HAS_OPTED_COMPOSITION = TRUE
  A_CLRM_COND:
    statement: The option and the amount payable satisfy such conditions and restrictions as may be prescribed
    order: HIGH
    interpretation: Do the person's option and payment satisfy the conditions and restrictions prescribed for Section 10(1)(a)?
      Those conditions are not stated in this MKP and must not be assumed.
    grounding:
    - F_SUPPLIER_COMPLIES_WITH_COMPOSITION_CONDITIONS
  A_CLRM_RATEPRE:
    statement: The amount payable in lieu of section 9(1) tax is calculated at such rate as may be prescribed
    order: HIGH
    interpretation: Is the rate applied to compute the amount the rate prescribed for a manufacturer under Section 10(1)(a)?
      No rate value is stated in this MKP.
    grounding:
    - F_COMPOSITION_RATE_APPLIED
  A_CLRM_CAP:
    statement: The rate does not exceed one per cent. of the turnover in State or turnover in Union territory in case of a
      manufacturer
    order: LOW
    rule: F_COMPOSITION_RATE_APPLIED <= 1 AND F_COMPOSITION_RATE_BASE IN ['TURNOVER_IN_STATE', 'TURNOVER_IN_UT']
  A_CLRM_S93:
    statement: Tax on the supply is payable under the provisions of sub-section (3) of section 9, to which the Section 10(1)(a)
      option is subject
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_CLRM_S94:
    statement: Tax on the supply is payable under the provisions of sub-section (4) of section 9, to which the Section 10(1)(a)
      option is subject
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_REG:
    statement: The person who may opt to pay an amount in lieu of tax under this clause is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_TURN:
    statement: The aggregate turnover of the registered person in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_SCH2:
    statement: The person is engaged in making supplies referred to in clause (b) of paragraph 6 of Schedule II
    order: LOW
    rule: F_SERVICE_IS_SCH_II_P6B = TRUE
  A_S9:
    statement: The composition option under this clause has effect notwithstanding anything to the contrary contained in this
      Act. It operates subject to the provisions of sub-sections (3) and (4) of section 9 and is not displaced by those provisions
      for the supplies concerned
    order: HIGH
    interpretation: Applying sub-sections (3) and (4) of section 9 to the supplies concerned, do those provisions prevail
      so as to displace the composition option or amount to that extent (answer FALSE), or does the option remain operative
      (answer TRUE)?
    grounding:
    - F_SUPPLY_IS_NOTIFIED_RCM_S9_3
    - F_SUPPLY_IS_UNDER_RCM_S9_4
  A_COND:
    statement: The option to pay the composition amount under this clause is exercised subject to such conditions and restrictions
      as may be prescribed, and those prescribed conditions and restrictions are satisfied
    order: HIGH
    interpretation: Has the person satisfied every condition and restriction prescribed for the composition option? The source
      does not state those conditions, so they must come from the prescribed rules
    grounding:
    - F_COMPOSITION_PRESCRIBED_CONDITIONS_MET
  A_OPT:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount calculated under this clause
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_1_B'
  A_PRESCRIBED:
    statement: The amount in lieu of tax is calculated at such rate as may be prescribed
    order: LOW
    rule: F_COMPOSITION_RATE_MATCHES_PRESCRIBED = TRUE
  A_RATECAP:
    statement: For persons engaged in making supplies referred to in clause (b) of paragraph 6 of Schedule II, the prescribed
      rate at which the amount is calculated does not exceed two and a half per cent. of the turnover in State or turnover
      in Union territory
    order: LOW
    rule: F_COMPOSITION_RATE_EXCEEDS_CEILING = FALSE
  A_BASE_STATE:
    statement: The composition amount is calculated on the turnover in State
    order: LOW
    rule: F_COMPOSITION_TAX_BASE = 'TURNOVER_IN_STATE'
  A_BASE_UT:
    statement: The composition amount is calculated on the turnover in Union territory
    order: LOW
    rule: F_COMPOSITION_TAX_BASE = 'TURNOVER_IN_UT'
  A_M_CRFOS_2:
    statement: The person's aggregate turnover in the preceding financial year did not exceed fifty lakh rupees
    order: HIGH
    interpretation: Does the person's aggregate turnover in the preceding financial year exceed fifty lakh rupees?
    grounding:
    - F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY
  A_M_CRFOS_3:
    statement: The person is an 'other supplier' for the purposes of the composition levy
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_CATEGORY = 'OTHER'
  A_M_CRFOS_4:
    statement: The composition levy option is subject to the provisions of sub-section (3) of section 9
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = FALSE
  A_M_CRFOS_5:
    statement: The composition levy option is subject to the provisions of sub-section (4) of section 9
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = FALSE
  A_M_CRFOS_6:
    statement: The option is subject to such conditions and restrictions as may be prescribed
    order: HIGH
    interpretation: Does the supplier meet all prescribed conditions and restrictions for the composition scheme as detailed
      in the CGST Rules?
    grounding:
    - F_SUPPLIER_COMPLIES_WITH_COMPOSITION_CONDITIONS
  A_M_CRFOS_7:
    statement: The registered person opts to pay tax under the composition scheme in lieu of the tax payable under sub-section
      (1) of section 9
    order: LOW
    rule: F_SUPPLIER_HAS_OPTED_COMPOSITION = TRUE
  A_M_CRFOS_1:
    statement: The person is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_PROVISO_CTX:
    statement: The value of turnover is being determined for the purposes of the second proviso
    order: LOW
    rule: F_TURNOVER_DETERMINATION_PURPOSE = 'SECOND_PROVISO_S10_1'
  A_TERRITORY:
    statement: The value of turnover is being determined in a State or Union territory
    order: LOW
    rule: F_TURNOVER_TERRITORY_LEVEL = 'STATE' OR F_TURNOVER_TERRITORY_LEVEL = 'UT'
  A_EXEMPT_SVC:
    statement: The supply is an exempt supply of services
    order: LOW
    if_false: the supply is not exempt, or is a supply of goods
    rule: F_SUPPLY_IS_EXEMPT = TRUE AND F_SUPPLY_TYPE = 'SERVICES'
  A_DEPOSIT:
    statement: The exempt supply of services is provided by way of extending deposits
    order: LOW
    rule: F_SERVICE_NATURE = 'DEPOSIT_EXTENSION'
  A_LOAN:
    statement: The exempt supply of services is provided by way of extending loans
    order: LOW
    rule: F_SERVICE_NATURE = 'LOAN_EXTENSION'
  A_ADVANCE:
    statement: The exempt supply of services is provided by way of extending advances
    order: LOW
    rule: F_SERVICE_NATURE = 'ADVANCE_EXTENSION'
  A_INTEREST:
    statement: In so far as the consideration for the exempt supply of services is represented by way of interest
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_FORM = 'INTEREST'
  A_DISCOUNT:
    statement: In so far as the consideration for the exempt supply of services is represented by way of discount
    order: LOW
    rule: F_SUPPLY_CONSIDERATION_FORM = 'DISCOUNT'
  A_NOTIF:
    statement: The Government increases the said limit of fifty lakh rupees by notification
    order: LOW
    rule: F_NOTIFICATION_ISSUER = 'GOVERNMENT' AND F_NOTIFICATION_LIMIT_INCREASE_ISSUED = TRUE
  A_HIGHER:
    statement: The Government increases the said limit of fifty lakh rupees to such higher amount, being an amount higher
      than fifty lakh rupees
    order: LOW
    rule: F_NOTIFIED_COMPOSITION_LIMIT_AMOUNT > 5000000
  A_CAP:
    statement: The higher amount to which the limit is increased is not exceeding one crore and fifty lakh rupees
    order: LOW
    rule: F_NOTIFIED_COMPOSITION_LIMIT_AMOUNT <= 15000000
  A_REC:
    statement: The higher amount to which the limit is increased is as may be recommended by the Council
    order: LOW
    rule: F_NOTIFIED_AMOUNT_RECOMMENDED_BY_COUNCIL = TRUE
  A_M_PSOSBCD_2:
    statement: The person supplies services
    order: LOW
    rule: F_SUPPLY_TYPE = 'SERVICES'
  A_M_PSOSBCD_3:
    statement: The services are other than those referred to in clause (b) of paragraph 6 of Schedule II
    order: LOW
    rule: F_SERVICE_IS_SCH_II_P6B = FALSE
  A_M_PSOSBCD_4:
    statement: The value of services supplied does not exceed the higher of ten per cent. of turnover in a State or Union
      territory in the preceding financial year or five lakh rupees
    order: HIGH
    interpretation: 'This condition is met if the value of services supplied (F_SERVICE_VALUE_SUPPLIED) is less than or equal
      to the maximum of two values: (1) 10% of the turnover in the State/UT in the preceding financial year (F_TURNOVER_PREV_FY_IN_STATE),
      and (2) 5,00,000 INR.'
    grounding:
    - F_SERVICE_VALUE_SUPPLIED
    - F_TURNOVER_PREV_FY_IN_STATE
  A_REG_CIFNS:
    statement: The person seeking to exercise the option is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_NOT_ELIG_SS2:
    statement: The registered person is not eligible to opt to pay tax under sub-section (2)
    order: LOW
    rule: F_PERSON_ELIGIBLE_COMPOSITION_SS2 = FALSE
  A_TURNOVER:
    statement: The registered person's aggregate turnover in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_NO_NONLEVIABLE:
    statement: The registered person is not engaged in making any supply of goods or services which are not leviable to tax
      under this Act
    order: LOW
    rule: F_SUPPLIER_ENGAGED_IN_NON_LEVIABLE_SUPPLY = FALSE
  A_OPT_LIEU:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount of tax under this option
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_2A'
  A_RATE_PRESCRIBED:
    statement: The amount of tax is calculated at such rate as may be prescribed
    order: HIGH
    interpretation: Is the rate used to calculate the composition amount the rate prescribed for this option for the relevant
      period?
    grounding:
    - F_SUPPLIER_COMPOSITION_RATE_PERCENT
  A_RATE_CAP:
    statement: The rate at which the amount of tax is calculated does not exceed three per cent. of the turnover in State
      or turnover in Union territory
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_RATE_PERCENT <= 3
  A_RCM_S9_3:
    statement: The supply falls within the provisions of sub-section (3) of section 9, to which the option to pay tax in lieu
      is subject
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_RCM_S9_4:
    statement: The supply falls within the provisions of sub-section (4) of section 9, to which the option to pay tax in lieu
      is subject
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_M_CIFIS_1:
    statement: The person seeking to opt under Section 10(2A) is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_M_CIFIS_3:
    statement: The aggregate turnover of the registered person in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_M_CIFIS_4:
    statement: The registered person is not engaged in making any inter-State outward supplies of goods or services
    order: LOW
    rule: F_SUPPLIER_MAKES_INTERSTATE_OUTWARD_SUPPLIES = FALSE
  A_M_CIFIS_5:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount of tax under Section 10(2A)
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_2A'
  A_M_CIFIS_6:
    statement: The amount of tax is calculated at such rate as may be prescribed
    order: HIGH
    interpretation: Is the rate applied the rate prescribed for the Section 10(2A) option? This provision does not state the
      rate.
    grounding:
    - F_TAX_COMPOSITION_RATE
  A_M_CIFIS_7:
    statement: The rate at which the amount of tax is calculated does not exceed three per cent. of the turnover in State
      or turnover in Union territory
    order: LOW
    rule: F_TAX_COMPOSITION_RATE <= 3
  A_M_CIFIS_8:
    statement: The amount of tax is calculated on the turnover in State
    order: LOW
    rule: F_TAX_COMPOSITION_BASE = 'TURNOVER_IN_STATE'
  A_M_CIFIS_9:
    statement: The amount of tax is calculated on the turnover in Union territory
    order: LOW
    rule: F_TAX_COMPOSITION_BASE = 'TURNOVER_IN_UT'
  A_M_CIFIS_10:
    statement: The supply falls within sub-section (3) of section 9, to which the option under Section 10(2A) remains subject
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_M_CIFIS_11:
    statement: The supply falls within sub-section (4) of section 9, to which the option under Section 10(2A) remains subject
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_NOT_VIA_ECO:
    statement: The person is not engaged in making any supply of goods or services through an electronic commerce operator
      who is required to collect tax at source under section 52
    order: LOW
    rule: F_SUPPLIER_MAKES_SUPPLY_VIA_TCS_ECO = FALSE
  A_SUBJECT_S9_3:
    statement: The option under this clause is subject to the provisions of sub-section (3) of section 9
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_SUBJECT_S9_4:
    statement: The option under this clause is subject to the provisions of sub-section (4) of section 9
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_REGISTERED:
    statement: The person seeking to exercise the option is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_NOT_ELIG_SUB2:
    statement: The registered person is not eligible to opt to pay tax under sub-section (2)
    order: LOW
    rule: F_PERSON_ELIGIBLE_COMPOSITION_SS2 = FALSE
  A_TURNOVER_CIFES:
    statement: The registered person's aggregate turnover in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_INLIEU:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount of tax under this option
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_2A'
  A_RATE_CAP_CIFES:
    statement: The rate at which the amount of tax is calculated does not exceed three per cent. of the turnover in State
      or turnover in Union territory
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_RATE_PERCENT <= 3
  A_NOT_NOTIF_SVC:
    statement: He is not a supplier of such services as may be notified by the Government on the recommendations of the Council
    order: HIGH
    if_false: The person supplies services so notified
    interpretation: Do any services supplied by the person fall within services notified by the Government on the recommendations
      of the Council for this provision? The condition is met only if none do.
    grounding:
    - F_SUPPLIER_SERVICES_SUPPLIED
  A_BASE:
    statement: The amount of tax is calculated on the turnover in State or turnover in Union territory
    order: LOW
    rule: F_TAX_COMPOSITION_BASE IN ['TURNOVER_IN_STATE', 'TURNOVER_IN_UT']
  A_REG_CIFNP:
    statement: The person is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_NOT_ELIG_S10_2:
    statement: The registered person is not eligible to opt to pay tax under sub-section (2)
    order: LOW
    rule: F_PERSON_ELIGIBLE_COMPOSITION_SS2 = FALSE
  A_TURNOVER_CIFNP:
    statement: The aggregate turnover of the registered person in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_NOT_NOTIF_MFR:
    statement: The registered person is not a manufacturer of such goods as may be notified by the Government on the recommendations
      of the Council.
    order: HIGH
    interpretation: Based on the supplier's activities and products, confirm that they are NOT a manufacturer of any goods
      that have been notified by the Government (on the Council's recommendation) as ineligible for the composition scheme.
    grounding:
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_GOODS_MANUFACTURED_BY_SUPPLIER
  A_S9_3:
    statement: The supply falls within sub-section (3) of section 9, to which the option under Section 10(2A) remains subject
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_S9_4:
    statement: The supply falls within sub-section (4) of section 9, to which the option under Section 10(2A) remains subject
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_OPTED:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount of tax under this option
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_2A'
  A_RATE_CAP_CIFNP:
    statement: The rate at which the amount of tax is calculated does not exceed three per cent. of the turnover in State
      or turnover in Union territory
    order: LOW
    rule: F_TAX_COMPOSITION_RATE <= 3
  A_REG_CIFCN:
    statement: The person opting to pay tax under sub-section (2A) of section 10 is a registered person
    order: LOW
    rule: F_SUPPLIER_IS_REGISTERED = TRUE
  A_NOT_S2:
    statement: The registered person is not eligible to opt to pay tax under sub-section (2) of section 10
    order: LOW
    rule: F_PERSON_ELIGIBLE_COMPOSITION_SS2 = FALSE
  A_TURNOVER_CIFCN:
    statement: The aggregate turnover of the registered person in the preceding financial year did not exceed fifty lakh rupees
    order: LOW
    rule: F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY <= 5000000
  A_NOT_CTP:
    statement: The registered person is not a casual taxable person
    order: LOW
    rule: F_SUPPLIER_IS_CASUAL_TAXPAYER = FALSE
  A_NOT_NRTP:
    statement: The registered person is not a non-resident taxable person
    order: LOW
    rule: F_SUPPLIER_IS_NON_RESIDENT_TAXPAYER = FALSE
  A_OPTED_CIFCN:
    statement: The registered person has opted to pay, in lieu of the tax payable by him under sub-section (1) of section
      9, an amount of tax under sub-section (2A) of section 10
    order: LOW
    rule: F_PERSON_COMPOSITION_OPTION = 'S10_2A'
  A_RATE_PRESCRIBED_CIFCN:
    statement: The amount of tax is calculated at such rate as may be prescribed
    order: LOW
    rule: F_TAX_COMPOSITION_RATE_IS_PRESCRIBED = TRUE
  A_RATE_CAP_CIFCN:
    statement: The rate at which the amount of tax is calculated does not exceed three per cent. of the turnover in State
      or turnover in Union territory
    order: LOW
    rule: F_SUPPLIER_COMPOSITION_RATE_PERCENT <= 3
  A_BASE_CIFCN:
    statement: The amount of tax is calculated on the turnover in State or turnover in Union territory
    order: LOW
    rule: F_TAX_COMPOSITION_BASE IN ['TURNOVER_IN_STATE', 'TURNOVER_IN_UT']
  A_S9_3_SUPPLY:
    statement: The supply in question is one to which the provisions of sub-section (3) of section 9 apply, and the option
      under sub-section (2A) of section 10 remains subject to those provisions
    order: LOW
    rule: F_SUPPLY_IS_NOTIFIED_RCM_S9_3 = TRUE
  A_S9_4_SUPPLY:
    statement: The supply in question is one to which the provisions of sub-section (4) of section 9 apply, and the option
      under sub-section (2A) of section 10 remains subject to those provisions
    order: LOW
    rule: F_SUPPLY_IS_UNDER_RCM_S9_4 = TRUE
  A_INELIGIBLE:
    statement: The taxable person was not eligible to pay tax under the sub-section ((1) or (2A), as the case may be) under
      which the tax was paid
    order: HIGH
    if_false: the person met all eligibility requirements of the sub-section under which tax was paid
    interpretation: Did the person fail to meet the eligibility requirements of the sub-section (sub-section (1) or sub-section
      (2A)) under which tax was paid? Eligibility requirements are read from that sub-section and are not stated in this MKP
    grounding:
    - F_SUPPLIER_COMPLIES_WITH_COMPOSITION_CONDITIONS
    - F_SUPPLIER_ACTIVITY_DESCRIPTION
    - F_SUPPLIER_AGGREGATE_TURNOVER_PREV_FY
groups:
  G_FORMS:
    name: Forms of Supply
    logic: ANY
    members:
    - A_SALE
    - A_TRANSFER
    - A_BARTER
    - A_EXCHANGE
    - A_LICENCE
    - A_RENTAL
    - A_LEASE
    - A_DISPOSAL
    - A_OTHER_FORM
    description: The supply must take one of the listed or other similar forms.
  G_TIMING:
    name: Supply Timing
    logic: ANY
    members:
    - A_MADE
    - A_AGREED
    description: The supply must be either made or agreed to be made.
  G_STATUS:
    name: Supply Status
    logic: ANY
    members:
    - A_MADE_SISIA
    - A_AGREED_SISIA
    description: The activity is either made or agreed to be made.
  G_AUTHORISED_COLLECTION:
    name: Authorised Collection
    logic: ANY
    members:
    - A_ACCORDANCE_WITH_ACT
    - A_ACCORDANCE_WITH_RULES
    description: The collection is considered authorised if it is in accordance with either the Act or the Rules.
  G_M_CFFOM_1:
    name: Grounds for cancellation due to misrepresentation
    logic: ANY
    members:
    - A_M_CFFOM_1
    - A_M_CFFOM_2
    - A_M_CFFOM_3
  G_CLRM_ELIG:
    name: Registered person turnover eligibility
    logic: ALL
    members:
    - A_CLRM_REG
    - A_CLRM_TO
    description: The person is registered and the preceding-year aggregate turnover did not exceed fifty lakh rupees
  G_CLRM_RATE:
    name: Prescribed rate within manufacturer ceiling
    logic: ALL
    members:
    - A_CLRM_RATEPRE
    - A_CLRM_CAP
    description: The amount is computed at the prescribed rate, and that rate does not exceed one per cent. of turnover in
      State or Union territory
  G_CLRM_S9:
    name: Section 9(3) or 9(4) supply
    logic: ANY
    members:
    - A_CLRM_S93
    - A_CLRM_S94
    description: Tax on the supply is payable under section 9(3) or under section 9(4)
  G_ELIG:
    name: Clause (b) composition eligibility
    logic: ALL
    members:
    - A_REG
    - A_TURN
    - A_SCH2
    - A_S9
    - A_COND
    description: All of the following hold. The person is registered. The preceding-year aggregate turnover limit is met.
      The person is engaged in Schedule II para 6(b) supplies. The option operates within the subjection to section 9(3) and
      9(4). The prescribed conditions and restrictions are satisfied.
  G_AMOUNT:
    name: Composition amount computation
    logic: ALL
    members:
    - A_PRESCRIBED
    - A_RATECAP
    - G_BASE
    description: The amount is calculated at the prescribed rate. That rate does not exceed two and a half per cent. and is
      applied to turnover in State or turnover in Union territory.
  G_BASE:
    name: Turnover base alternatives
    logic: ANY
    members:
    - A_BASE_STATE
    - A_BASE_UT
    description: The base is turnover in State or, alternatively, turnover in Union territory.
  G_M_CRFOS_ELIGIBILITY:
    name: Eligibility Criteria
    logic: ALL
    members:
    - A_M_CRFOS_1
    - A_M_CRFOS_2
    - A_M_CRFOS_3
    - G_M_CRFOS_NO_RCM
    - A_M_CRFOS_6
  G_M_CRFOS_NO_RCM:
    name: RCM Inapplicability
    logic: ALL
    members:
    - A_M_CRFOS_4
    - A_M_CRFOS_5
  G_FORM:
    name: Form of exempt financial service
    logic: ANY
    members:
    - A_DEPOSIT
    - A_LOAN
    - A_ADVANCE
    description: The services are provided by way of extending deposits, loans or advances. These are alternatives.
  G_CONSIDERATION:
    name: Form of consideration
    logic: ANY
    members:
    - A_INTEREST
    - A_DISCOUNT
    description: The consideration is represented by way of interest or discount. These are alternatives.
  G_INCREASE:
    name: Conditions of a valid limit increase
    logic: ALL
    members:
    - A_NOTIF
    - A_HIGHER
    - A_CAP
    - A_REC
    description: All four conditions must hold together
  A_M_PSOSBCD_1A:
    name: Any of the referred steps (A_M_PSOSBCD_1A)
    logic: ANY
    members:
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    description: TRUE when any step of the law this check refers to is TRUE
  A_M_PSOSBCD_1B:
    name: Any of the referred steps (A_M_PSOSBCD_1B)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_M_PSOSBCD_1:
    name: Person has opted for composition levy under specified clauses
    logic: ANY
    members:
    - A_M_PSOSBCD_1A
    - A_M_PSOSBCD_1B
    - PD_M_CRFOS
  A_NOT_ELIG_SS1:
    name: Any of the referred steps (A_NOT_ELIG_SS1)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_ELIG_CIFNS:
    name: Eligibility conditions of the clause
    logic: ALL
    members:
    - A_REG_CIFNS
    - G_NOT_ELIG
    - A_TURNOVER
    - A_NO_NONLEVIABLE
    description: All conditions are joint requirements
  G_NOT_ELIG:
    name: Not eligible under sub-section (1) and sub-section (2)
    logic: ALL
    members:
    - A_NOT_ELIG_SS1
    - A_NOT_ELIG_SS2
    description: The person must be ineligible under both sub-section (1) and sub-section (2)
  G_RCM:
    name: Sub-section (3) or (4) of section 9 applies
    logic: ANY
    members:
    - A_RCM_S9_3
    - A_RCM_S9_4
    description: Either preserved provision, if it applies, prevails over the option
  A_M_CIFIS_2:
    name: Any of the referred steps (A_M_CIFIS_2)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_M_CIFIS_1:
    name: S10(2A) eligibility conditions
    logic: ALL
    members:
    - A_M_CIFIS_1
    - A_M_CIFIS_2
    - A_M_CIFIS_3
    - A_M_CIFIS_4
    description: The person is registered, is not eligible under sub-section (1) and sub-section (2), has preceding-year aggregate
      turnover not exceeding fifty lakh rupees, and is not engaged in any inter-State outward supply of goods or services.
  G_M_CIFIS_2:
    name: Turnover base alternatives
    logic: ANY
    members:
    - A_M_CIFIS_8
    - A_M_CIFIS_9
    description: The amount is calculated on the turnover in State or on the turnover in Union territory.
  G_M_CIFIS_3:
    name: Prescribed rate within ceiling
    logic: ALL
    members:
    - A_M_CIFIS_6
    - A_M_CIFIS_7
    description: The rate is the prescribed rate and does not exceed three per cent.
  G_M_CIFIS_4:
    name: Section 9(3) or 9(4) applies
    logic: ANY
    members:
    - A_M_CIFIS_10
    - A_M_CIFIS_11
    description: The supply falls within sub-section (3) of section 9 or within sub-section (4) of section 9.
  A_NOT_ELIG_SUB1:
    name: Any of the referred steps (A_NOT_ELIG_SUB1)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_CONDITIONS:
    name: Option conditions under this clause
    logic: ALL
    members:
    - A_REGISTERED
    - G_NOT_ELIGIBLE
    - A_TURNOVER_CIFES
    - A_NOT_VIA_ECO
    description: All of these conditions must hold together. The person is registered. The person is not eligible under sub-section
      (1) and sub-section (2). Aggregate turnover in the preceding financial year did not exceed fifty lakh rupees. The person
      is not engaged in making any supply of goods or services through
  G_NOT_ELIGIBLE:
    name: Ineligibility under sub-section (1) and sub-section (2)
    logic: ALL
    members:
    - A_NOT_ELIG_SUB1
    - A_NOT_ELIG_SUB2
    description: The source wording is not eligible to opt to pay tax under sub-section (1) and sub-section (2). This group
      reads that wording as ineligibility under both sub-sections, as the source states it. Any further reading of how the
      two sub-sections interact is left to GKP.
  G_SUBJECT_S9:
    name: Preserved section 9 provisions
    logic: ANY
    members:
    - A_SUBJECT_S9_3
    - A_SUBJECT_S9_4
    description: The option is subject to both sub-section (3) and sub-section (4) of section 9. Whichever of those provisions
      applies prevails over the option.
  A_NOT_ELIG_S10_1:
    name: Any of the referred steps (A_NOT_ELIG_S10_1)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_ELIG_CIFNP:
    name: Section 10(2A) eligibility conditions
    logic: ALL
    members:
    - A_REG_CIFNP
    - A_NOT_ELIG_S10_1
    - A_NOT_ELIG_S10_2
    - A_TURNOVER_CIFNP
    - G_NOT_NOTIFIED
    description: All listed conditions must hold jointly.
  G_NOT_NOTIFIED:
    name: Not a notified manufacturer or supplier
    logic: ALL
    members:
    - A_NOT_NOTIF_MFR
    - A_NOT_NOTIF_SVC
    description: The person must not be a manufacturer of notified goods or a supplier of notified services. Neither excluded
      status may be present.
  G_S9_RCM:
    name: Section 9(3) or 9(4) engaged
    logic: ANY
    members:
    - A_S9_3
    - A_S9_4
    description: The subject-to priority is engaged if either sub-section (3) or sub-section (4) of section 9 applies.
  A_NOT_S1:
    name: Any of the referred steps (A_NOT_S1)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPTION
    description: TRUE when any step of the law this check refers to is TRUE
  G_INELIG:
    name: Ineligible under sub-sections (1) and (2)
    logic: ALL
    members:
    - A_NOT_S1
    - A_NOT_S2
    description: The person is not eligible to opt under sub-section (1) and is not eligible to opt under sub-section (2).
      Both are required
  G_EXCL:
    name: Neither casual nor non-resident
    logic: ALL
    members:
    - A_NOT_CTP
    - A_NOT_NRTP
    description: The person is neither a casual taxable person nor a non-resident taxable person
  G_AMOUNT_CIFCN:
    name: Composition amount computation
    logic: ALL
    members:
    - A_RATE_PRESCRIBED_CIFCN
    - A_RATE_CAP_CIFCN
    - A_BASE_CIFCN
    description: The amount is computed at the prescribed rate, the rate does not exceed three per cent., and the base is
      the turnover in State or turnover in Union territory
  G_S9_SUPPLY:
    name: Supply under section 9(3) or 9(4)
    logic: ANY
    members:
    - A_S9_3_SUPPLY
    - A_S9_4_SUPPLY
    description: The supply is one to which section 9(3) or section 9(4) applies
  A_BELIEF:
    name: Any of the referred steps (A_BELIEF)
    logic: ANY
    members:
    - PD_AMOUNT
    - PD_AMOUNT_CIFNP
    - PD_AMOUNT_S10_2A
    - PD_CLRM_OPT
    - PD_CLRM_RATE
    - PD_CLRM_S9
    - PD_ELIG
    - PD_EOIFTFC
    - PD_GPTICL
    - PD_M_CIFIS_1
    - PD_M_CIFIS_2
    - PD_M_CIFIS_3
    - PD_M_CRFOS
    - PD_M_PSOSBCD
    - PD_OPT
    - PD_OPTION
    - PD_OPTION_CIFNP
