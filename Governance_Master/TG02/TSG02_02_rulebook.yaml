# GOVERNANCE MASTER TSG02_02 Rate by item (TG02 Classification & Rate)
# LAW ARC - 1 laws - status APPROVED
name: TSG02_02 Rate by item - GOVERNANCE MASTER rulebook
version: TSG02_02
facts:
  F_SIK:
    name: Supply Item Kind
    type: CODE
    options:
    - BOTH
    - GOODS
    - SERVICES
    - UNKNOWN
    tier: T1
  F_SCSST:
    name: Supply Cites Sub Section Two
    type: CODE
    options:
    - CITED_SUB_SECTION_2
    - NOT_CITED
    - UNKNOWN
    tier: T1
  F_DOS:
    name: Description Of Supply
    type: TEXT
    tier: T1
  F_ACTR:
    name: Applied Central Tax Rate
    type: AMOUNT
    tier: T1
  F_ARN:
    name: Applicable Rate Notification
    type: TEXT
    tier: T1
  F_NOCR:
    name: Notification On Council Recommendation
    type: BOOLEAN
    tier: T1
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_LOCGAST_A_SIGOS:
    statement: The supply is of goods or services or both
    order: LOW
    rule: F_SIK IN ['GOODS', 'SERVICES', 'BOTH']
    handler: python
  M_LOCGAST_A_SSTDL:
    statement: The supply falls within the provisions of sub-section (2), so the levy under sub-section (1) is displaced for
      the supply
    order: HIGH
    interpretation: Read the text of sub-section (2) against the description of the supply and the basis cited on the document.
      Does sub-section (2) displace the levy of central tax under sub-section (1) for this supply?
    grounding:
    - F_SCSST
    - F_DOS
    handler: heavy
  M_LOCGAST_A_RNETPC:
    statement: The central tax rate applied does not exceed twenty per cent
    order: LOW
    rule: F_ACTR <= 20
    handler: python
  M_LOCGAST_A_RNOCR:
    statement: The rate is one notified by the Government on the recommendations of the Council
    order: HIGH
    interpretation: Is the applied rate set by a notification issued by the Government on the recommendations of the Council?
    grounding:
    - F_ARN
    - F_NOCR
    handler: light
groups: {}
outcomes:
  M_LOCGAST_LE_SIGOS:
    outcome: SUPPLY_IS_GOODS_OR_SERVICES
    expr: M_LOCGAST_A_SIGOS
    module: M_LOCGAST
    description: The supply is of goods or services or both (Section 9(1), part of the law)
  M_LOCGAST_LE_SSTDL:
    outcome: SUB_SECTION_TWO_DISPLACES_LEVY
    expr: M_LOCGAST_A_SSTDL
    module: M_LOCGAST
    description: The supply falls within the provisions of sub-section (2), so the levy under sub-section (1) is displaced
      for the supply (Section 9(1), part of the law)
  M_LOCGAST_LE_RNETPC:
    outcome: RATE_NOT_EXCEEDING_TWENTY_PER_CENT
    expr: M_LOCGAST_A_RNETPC
    module: M_LOCGAST
    description: The central tax rate applied does not exceed twenty per cent (Section 9(1), part of the law)
  M_LOCGAST_LE_RNOCR:
    outcome: RATE_NOTIFIED_ON_COUNCIL_RECOMMENDATION
    expr: M_LOCGAST_A_RNOCR
    module: M_LOCGAST
    description: The rate is one notified by the Government on the recommendations of the Council (Section 9(1), part of the
      law)
products:
  M_LOCGAST_PD_SIGOS:
    statement: The supply is of goods or services or both
  M_LOCGAST_PD_SSTDL:
    statement: The supply falls within the provisions of sub-section (2), so the levy under sub-section (1) is displaced for
      the supply
  M_LOCGAST_PD_RNETPC:
    statement: The central tax rate applied does not exceed twenty per cent
  M_LOCGAST_PD_RNOCR:
    statement: The rate is one notified by the Government on the recommendations of the Council
compounds:
- id: C_LOCGAST
  question: The supply is of goods or services or both; The supply falls within the provisions of sub-section (2), so the
    levy under sub-section (1) is displaced for the supply; The central tax rate applied does not exceed twenty per cent;
    The rate is one notified by the Government on the recommendations of the
  includes:
  - M_LOCGAST_LE_SIGOS
  - M_LOCGAST_LE_SSTDL
  - M_LOCGAST_LE_RNETPC
  - M_LOCGAST_LE_RNOCR
  produces:
  - product: M_LOCGAST_PD_SIGOS
    from:
    - M_LOCGAST_LE_SIGOS
  - product: M_LOCGAST_PD_SSTDL
    from:
    - M_LOCGAST_LE_SSTDL
  - product: M_LOCGAST_PD_RNETPC
    from:
    - M_LOCGAST_LE_RNETPC
  - product: M_LOCGAST_PD_RNOCR
    from:
    - M_LOCGAST_LE_RNOCR
time:
  law_date: F_DOI
