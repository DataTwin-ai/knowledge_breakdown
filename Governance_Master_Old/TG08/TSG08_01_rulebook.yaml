# GOVERNANCE MASTER TSG08_01 Tax invoice (TG08 Documents)
# LAW ARC - 2 laws - status APPROVED
name: TSG08_01 Tax invoice - GOVERNANCE MASTER rulebook
version: TSG08_01
facts:
  F_IITS:
    name: Invoice Issue Timing Status
    type: CODE
    options:
    - AFTER_DUE_DATE
    - ON_OR_BEFORE_DUE_DATE
    - UNKNOWN
    tier: T0
  F_DOI:
    name: Date Of Invoice
    type: DATE
    tier: T0
predicates:
  M_EOIOPFS_A_IIWS31P:
    statement: The invoice is issued within the period prescribed under section 31
    order: LOW
    rule: F_IITS = 'ON_OR_BEFORE_DUE_DATE'
    handler: python
  M_TOSOSPD_A_INIIP:
    statement: The invoice is not issued within the period prescribed under section 31
    order: LOW
    rule: F_IITS = 'AFTER_DUE_DATE'
    handler: python
groups: {}
outcomes:
  M_EOIOPFS_LE_IIWS31P:
    outcome: INVOICE_ISSUED_WITHIN_SECTION_31_PERIOD
    expr: M_EOIOPFS_A_IIWS31P
    module: M_EOIOPFS
    description: The invoice is issued within the period prescribed under section 31 (Section 13(2), part of the law)
  M_TOSOSPD_LE_INIIP:
    outcome: INVOICE_NOT_ISSUED_IN_PERIOD
    expr: M_TOSOSPD_A_INIIP
    module: M_TOSOSPD
    description: The invoice is not issued within the period prescribed under section 31 (Section 13(2), part of the law)
products:
  M_EOIOPFS_PD_IIWS31P:
    statement: The invoice is issued within the period prescribed under section 31
  M_TOSOSPD_PD_INIIP:
    statement: The invoice is not issued within the period prescribed under section 31
compounds:
- id: C_S13_SS2
  question: 'Section 13(2): which clause applies?'
  includes:
  - M_EOIOPFS_LE_IIWS31P
  - M_TOSOSPD_LE_INIIP
  produces:
  - product: M_EOIOPFS_PD_IIWS31P
    from:
    - M_EOIOPFS_LE_IIWS31P
  - product: M_TOSOSPD_PD_INIIP
    from:
    - M_TOSOSPD_LE_INIIP
time:
  law_date: F_DOI
