predicates:
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_SIAFOS_A_SIAS:
    statement: The supply of goods or services or both is a sale
    order: LOW
    rule: F_FOS = 'SALE'
    handler: python
  M_SIAFOS_A_SIAT:
    statement: The supply of goods or services or both is a transfer
    order: LOW
    rule: F_FOS = 'TRANSFER'
    handler: python
  M_SIAFOS_A_SIAB:
    statement: The supply of goods or services or both is a barter
    order: LOW
    rule: F_FOS = 'BARTER'
    handler: python
  M_SIAFOS_A_SIAE:
    statement: The supply of goods or services or both is an exchange
    order: LOW
    rule: F_FOS = 'EXCHANGE'
    handler: python
  M_SIAFOS_A_SIALG:
    statement: The supply of goods or services or both is a licence
    order: LOW
    rule: F_FOS = 'LICENCE'
    handler: python
  M_SIAFOS_A_SIAR:
    statement: The supply of goods or services or both is a rental
    order: LOW
    rule: F_FOS = 'RENTAL'
    handler: python
  M_SIAFOS_A_SIAL:
    statement: The supply of goods or services or both is a lease
    order: LOW
    rule: F_FOS = 'LEASE'
    handler: python
  M_SIAFOS_A_SIAD:
    statement: The supply of goods or services or both is a disposal
    order: LOW
    rule: F_FOS = 'DISPOSAL'
    handler: python
  M_SIAFOS_A_SIAF:
    statement: The supply of goods or services or both takes another form of supply that is not one of the listed examples
      of sale, transfer, barter, exchange, licence, rental, lease or disposal
    order: HIGH
    interpretation: Does the described transaction amount to a form of supply of goods or services or both other than the
      listed examples, since the list is illustrative only?
    grounding:
    - F_FOS
    - F_DOS
    handler: light
  M_SIAFOS_A_SMFC:
    statement: The supply was made for a consideration
    order: LOW
    rule: F_SES = 'MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SAFC:
    statement: The supply was agreed to be made for a consideration
    order: LOW
    rule: F_SES = 'AGREED_TO_BE_MADE' AND F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_SIAWC_A_ASISI:
    statement: The activity is one of the activities specified in Schedule I
    order: HIGH
    interpretation: Does the described activity fall within an activity specified in Schedule I of the Act?
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_CALS_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CALS_A_AIAI:
    statement: The competent authority is an authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the authority authorised under any law for the time being in force to issue a completion certificate?
    grounding:
    - F_IAUL
    handler: heavy
  M_CALS_A_CNRFA:
    statement: A completion certificate is not required from the Government or the authority authorised to issue it (non-requirement
      of such certificate from such authority)
    order: HIGH
    interpretation: Is there a non-requirement of a completion certificate from such authority for the property or work concerned?
    grounding:
    - F_CCR
    handler: light
  M_CALS_A_AILS:
    statement: The competent authority is a licensed surveyor of the respective local body of the city or town or village
      or development or planning authority
    order: HIGH
    interpretation: Is the person a licensed surveyor of the respective local body of the city or town or village or of the
      development or planning authority? The source wording is ambiguous on how the list attaches and is retained as written.
    grounding:
    - F_SLS2
    handler: heavy
  M_DOCACE_A_CAIG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_DOCACE_A_AULA:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue completion certificates under a law for the time being in
      force?
    grounding:
    - F_CIT
    handler: heavy
  M_DOCACE_A_CNRFA:
    statement: In case of non-requirement of such completion certificate from such authority, the certificate is not required
      from that authority
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_DOCACE_A_CERWI:
    statement: The competent authority is a chartered engineer registered with the Institution of Engineers (India)
    order: LOW
    rule: F_CERS = 'REGISTERED_IEI'
    handler: python
  M_CAA_A_AITG:
    statement: The competent authority is the Government
    order: LOW
    rule: F_CIT = 'GOVERNMENT'
    handler: python
  M_CAA_A_AAUL:
    statement: The competent authority is any authority authorised to issue completion certificate under any law for the time
      being in force
    order: HIGH
    interpretation: Is the issuing authority authorised to issue a completion certificate under any law for the time being
      in force?
    grounding:
    - F_IAUL
    handler: light
  M_CAA_A_CNRFA:
    statement: A completion certificate is not required from the Government or authority authorised under any law to issue
      it
    order: LOW
    rule: F_CCR = 'NOT_REQUIRED'
    handler: python
  M_CAA_A_ARWC:
    statement: The competent authority is an architect registered with the Council of Architecture constituted under the Architects
      Act, 1972
    order: LOW
    rule: F_ACR = TRUE
    handler: python
  M_BICMF_A_PFSOC:
    statement: The provision is made for a subscription or any other consideration
    order: LOW
    rule: F_SCT IN ['MONEY', 'NON_MONEY', 'BOTH']
    handler: python
  M_BITCM_A_CDNROM:
    statement: In this Act the context does not require a meaning of business other than this inclusive definition
    order: HIGH
    interpretation: Does the provision in which business is used, or a related provision, require a meaning of business other
      than the inclusive definition, with UNKNOWN left unresolved
    grounding:
    - F_DCS
    handler: heavy
  M_BITCM_A_AIT:
    statement: The activity is a trade, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a trade in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIC:
    statement: The activity is commerce, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity commerce in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIM:
    statement: The activity is manufacture, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity manufacture in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIP:
    statement: The activity is a profession, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a profession in its ordinary sense
    grounding:
    - F_AOTD
