groups:
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_CALS_G_PAA:
    name: Primary Authority Alternatives
    logic: ANY
    members:
    - M_CALS_A_AITG
    - M_CALS_A_AIAI
    description: The Government or any authority authorised to issue completion certificate under any law for the time being
      in force.
  M_CALS_G_SRC:
    name: Surveyor Route Conditions
    logic: ALL
    members:
    - M_CALS_A_CNRFA
    - M_CALS_A_AILS
    description: Where a completion certificate is not required from such authority - the licensed surveyor listed in the
      clause.
  M_DOCACE_G_GOAIR:
    name: Government Or Authorised Issuer Route
    logic: ANY
    members:
    - M_DOCACE_A_CAIG
    - M_DOCACE_A_AULA
    description: The competent authority is the Government or an authority authorised to issue the completion certificate
  M_DOCACE_G_ERCNR:
    name: Engineer Route Certificate Not Required
    logic: ALL
    members:
    - M_DOCACE_A_CNRFA
    - M_DOCACE_A_CERWI
    description: Where the certificate is not required from such authority, a chartered engineer registered with the Institution
      of Engineers (India) is the competent authority
  M_CAA_G_GOAA:
    name: Government Or Authorised Authority
    logic: ANY
    members:
    - M_CAA_A_AITG
    - M_CAA_A_AAUL
    description: The Government or any authority authorised under any law in force to issue a completion certificate
  M_CAA_G_RAR:
    name: Registered Architect Route
    logic: ALL
    members:
    - M_CAA_A_CNRFA
    - M_CAA_A_ARWC
    description: No certificate is required from such authority and the certifier is a registered architect
  M_BITCM_G_LOSA:
    name: Listed Or Similar Activity
    logic: ANY
    members:
    - M_BITCM_A_AIT
    - M_BITCM_A_AIC
    - M_BITCM_A_AIM
    - M_BITCM_A_AIP
    - M_BITCM_A_AIV
    - M_BITCM_A_AIA
    - M_BITCM_A_AIW
    - M_BITCM_A_AIOS
    description: The activity is any listed kind or any other similar activity
  M_BIIA_G_CRA:
    name: Connection Relation Alternatives
    logic: ANY
    members:
    - M_BIIA_A_AICWSCA
    - M_BIIA_A_AITSCA
    - M_BIIA_A_AATSCA
    description: Any one of connection, incidental or ancillary relation to sub-clause (a) suffices
  M_BISFCOC_G_SOAF:
    name: Supply Or Acquisition Form
    logic: ANY
    members:
    - M_BISFCOC_A_TIAS
    - M_BISFCOC_A_TIAA
    description: Either a supply or an acquisition qualifies.
  M_BISFCOC_G_GOSS:
    name: Goods Or Services Subject
    logic: ANY
    members:
    - M_BISFCOC_A_SIGIC
    - M_BISFCOC_A_SIS
    description: Goods (including capital goods) or services qualify. A transaction covering both also qualifies. It is not
      goods only or services only.
  M_BISFCOC_G_COCE:
    name: Commencement Or Closure Event
    logic: ANY
    members:
    - M_BISFCOC_A_CWBC
    - M_BISFCOC_A_CWBC2
    description: Connection with either commencement or closure of business qualifies.
  M_BIAFC_G_ACG:
    name: Admission Conditions Group
    logic: ALL
    members:
    - M_BIAFC_A_AOPTP
    - M_BIAFC_A_AFAC
    description: Both the admission activity and the consideration for it must be met
  M_DOBSBOH_G_OIT:
    name: Office Inclusion Tests
    logic: ALL
    members:
    - M_DOBSBOH_A_SSAOH
    - M_DOBSBOH_A_OAICOF
    description: Both the office holder service test and the office acceptance test are required for this inclusion
  M_BIRCA_G_RCOBR:
    name: Race Club Or Bookmaker Route
    logic: ANY
    members:
    - M_BIRCA_G_AIOARCIF
    - M_BIRCA_G_LBIC
    description: Either the race club activity route or the licensed book maker in such club route.
  M_BIRCA_G_LBIC:
    name: Licensed Bookmaker In Club
    logic: ALL
    members:
    - M_BIRCA_A_BMHL
    - M_BIRCA_A_AOBIC
    description: The book maker is licensed and the activity is carried on in such race club.
  M_BIRCA_G_AIOARCIF:
    name: Activity Is Of A Race Club In Force
    logic: ANY
    members:
    - M_BIRCA_A_AIOARC
    - M_BIRCA_A_RCSTB
    description: M_BIRCA_A_AIOARC from 2019-02-01, the old wording before
  M_BIPAA_G_PAUG:
    name: Public Authority Undertaking Group
    logic: ALL
    members:
    - M_BIPAA_A_UIGOA
    - M_BIPAA_A_EAPA
    description: Both the undertaker and the public authority capacity must be present.
  M_DOEC_G_SRO:
    name: Supply Route Options
    logic: ANY
    members:
    - M_DOEC_A_SOGOS
    - M_DOEC_A_DPON
    description: A supply of goods or services or both satisfies the route, and so does an included digital product supplied
      over a digital or electronic network
  M_DOGO_G_GBCD:
    name: Goods By Core Definition
    logic: ALL
    members:
    - M_DOGO_A_TIIMP
    - M_DOGO_A_TIINM
    - M_DOGO_A_TIINS
  M_DOGO_G_GBSI:
    name: Goods By Specific Inclusion
    logic: ANY
    members:
    - M_DOGO_A_TIIAAC
    - M_DOGO_A_TIIGC
    - M_DOGO_A_TIIG
    - M_DOGO_G_ATLAATBS
  M_DOGO_G_ATLAATBS:
    name: Attached To Land And Agreed To Be Severed
    logic: ALL
    members:
    - M_DOGO_A_IIATL
    - M_DOGO_A_IIATBS
  M_DOCOP_G_PTA:
    name: Payment Timing Alternatives
    logic: ANY
    members:
    - M_DOCOP_A_PHBM
    - M_DOCOP_A_PITBM
    description: The payment is either already made or is to be made. Both events are not required.
  M_DOCOP_G_PRC:
    name: Payment Route Conditions
    logic: ALL
    members:
    - M_DOCOP_G_PTA
    - M_DOCOP_A_PIIMOO
    - M_DOCOP_A_PLTTS
    - M_DOCOP_A_PIROO
    description: The payment must be made or to be made, in money or otherwise, be linked to the supply, and be paid by the
      recipient or any other person.
  M_CMVOAF_G_AAVC:
    name: Act And Value Core
    logic: ALL
    members:
    - M_CMVOAF_A_CIAOF
    - M_CMVOAF_A_AHAMV
    description: There must be an act or forbearance, and its monetary value is what is included.
  M_CMVOAF_G_SLA:
    name: Supply Link Alternatives
    logic: ANY
    members:
    - M_CMVOAF_A_AIROS
    - M_CMVOAF_A_AIRTS
    - M_CMVOAF_A_AFIOS
    description: The act or forbearance must be in respect of, in response to, or for the inducement of the supply. Any one
      route is enough.
  M_DOS2_G_SC:
    name: Service Criteria
    logic: ANY
    members:
    - M_DOS2_G_BDOS
    - M_DOS2_G_IFMA
  M_DOS2_G_BDOS:
    name: Base Definition Of Service
    logic: ALL
    members:
    - M_DOS2_A_TSING
    - M_DOS2_A_TSINM
    - M_DOS2_A_TSINS
  M_DOS2_G_IFMA:
    name: Inclusion For Money-Related Activities
    logic: ALL
    members:
    - M_DOS2_A_ARTUOCOM
    - M_DOS2_A_SCICFTA
  M_PIAOP_G_EIAOB:
    name: Entity Is AOP Or BOI
    logic: ANY
    members:
    - M_PIAOP_A_EIAAOP
    - M_PIAOP_A_EIABOI
  M_PISCOGC_G_EISCOGC:
    name: Entity Is Statutory Corp Or Govt Co
    logic: ANY
    members:
    - M_PISCOGC_A_EIASC
    - M_PISCOGC_A_EIAGC
    description: The entity is either a statutory corporation or a Government company.
  M_PIFBC_G_FBCC:
    name: Foreign Body Corporate Conditions
    logic: ALL
    members:
    - M_PIFBC_A_EIBC
    - M_PIFBC_A_BCIOI
    description: All conditions for a foreign body corporate to be included in the definition of 'person'.
  M_PICOSG_G_IAGE:
    name: Is A Government Entity
    logic: ANY
    members:
    - M_PICOSG_A_PICG
    - M_PICOSG_A_PISG
    description: Checks if the entity is either the Central Government or a State Government.
  M_DOC3_G_CTT:
    name: Council Term Test
    logic: ALL
    members:
    - M_DOC3_A_CDNROM
    - M_DOC3_A_BIGC
    description: Both the context test and the body identity test must hold for the defined meaning to apply.
  M_DOCOA_G_DMC:
    name: Defined Meaning Conditions
    logic: ALL
    members:
    - M_DOCOA_A_CDNROM
    - M_DOCOA_A_ANBG
    description: Both the context test and the notification test must hold for the defined meaning
  M_DOCFS_G_ECW:
    name: Extended Construction Works
    logic: ANY
    members:
    - M_DOCFS_A_WIAA
    - M_DOCFS_A_WIAA2
    - M_DOCFS_A_WIAR
    - M_DOCFS_A_WIAR2
    description: Any one of the four listed works, which the expression includes.
  M_DOCFS_G_ECSC:
    name: Existing Civil Structure Condition
    logic: ALL
    members:
    - M_DOCFS_A_SEBW
    - M_DOCFS_A_SIC
    description: The listed works must be carried out on an existing civil structure, so both qualifiers apply together.
  M_DOMAIE_G_IIAQFOM:
    name: Item Is A Qualifying Form Of Money
    logic: ANY
    members:
    - M_DOMAIE_A_IIILT
    - M_DOMAIE_A_IIAFC
    - M_DOMAIE_A_IIAC
    - M_DOMAIE_A_IIAPN
    - M_DOMAIE_A_IIABOE
    - M_DOMAIE_A_IIALOC
    - M_DOMAIE_A_IIAD
    - M_DOMAIE_A_IIAPO
    - M_DOMAIE_A_IIATC
    - M_DOMAIE_A_IIAMO
    - M_DOMAIE_A_IIAPR
    - M_DOMAIE_A_IIAER
    - M_DOMAIE_A_IIIRBR
  M_DOMAIE_G_IIUFAQP:
    name: Item Is Used For A Qualifying Purpose
    logic: ANY
    members:
    - M_DOMAIE_A_IIUTSAO
    - M_DOMAIE_A_IIUTED
  M_NTTAG_A_STS7S:
    name: Any of the referred steps (M_NTTAG_A_STS7S)
    logic: ANY
    members:
    - M_IOSFC_PD_ISIO
    - M_SIAFOS_PD_ISO
    - M_SIAWC_PD_SAIS
    description: TRUE when any step of the law this check refers to is TRUE
  M_LOBIS_G_BLDC:
    name: Building Lease Deeming Conditions
    logic: ALL
    members:
    - M_LOBIS_A_LOLO
    - M_LOBIS_A_PIAB
    - M_LOBIS_A_LFBOC
    description: The lease or letting out, the building subject and the business or commerce purpose must all hold.
  M_LOLIS_G_LIA:
    name: Land Interest Alternatives
    logic: ANY
    members:
    - M_LOLIS_A_TILOL
    - M_LOLIS_A_TITOL
    - M_LOLIS_A_TIEOL
    - M_LOLIS_A_TILTOL
    description: Any one of the four listed interests in land is enough
  M_TOTIG2_G_TTTG:
    name: Title Transfer Terms Group
    logic: ALL
    members:
    - M_TOTIG2_A_ATOTIG
    - M_TOTIG2_A_ASPP
    - M_TOTIG2_A_PPAFD
    - M_TOTIG2_A_PUFC
    description: All four title transfer terms must hold together, as the source joins them with an agreement, a future date
      and payment upon full consideration.
  M_ROIPS_G_ROIP:
    name: Renting Of Immovable Property
    logic: ALL
    members:
    - M_ROIPS_A_TIR
    - M_ROIPS_A_RPII
    description: Both the renting form and the immovable property subject must hold
  M_COCAS_G_COS:
    name: Construction Object Scope
    logic: ANY
    members:
    - M_COCAS_A_AICOS
    - M_COCAS_A_BIFS
    description: Construction of a complex, building, civil structure or part thereof, and the inclusive (non-exhaustive)
      route of a complex or building intended for sale to a buyer wholly or partly.
  M_COCAS_G_CTE:
    name: Consideration Timing Exception
    logic: ANY
    members:
    - M_COCAS_A_ECACC
    - M_COCAS_A_ECAFO
    description: Entire consideration received after the earlier of completion certificate (where required) or first occupation.
      Receipt after either event satisfies this because of whichever is earlier.
  M_TTOIPS_G_IPUF:
    name: Intellectual Property Use Forms
    logic: ANY
    members:
    - M_TTOIPS_A_TITT
    - M_TTOIPS_A_TPIU
    description: Either the temporary transfer form or the permitted use or enjoyment form is enough
  M_RTODAS_G_AOK:
    name: Agreed Obligation Kind
    logic: ANY
    members:
    - M_RTODAS_A_OTRFA
    - M_RTODAS_A_OTTS
    - M_RTODAS_A_OTDA
    description: The agreed obligation is one of the three listed kinds
  M_TORTUGS_G_DST:
    name: Deemed Service Test
    logic: ALL
    members:
    - M_TORTUGS_A_TORTUG
    - M_TORTUGS_A_CDOVC
    description: Both the right to use transfer and the consideration must be met for the deeming to apply.
  M_SOGBUA_G_SCM:
    name: Supply Conditions Met
    logic: ALL
    members:
    - M_SOGBUA_A_SIUA
    - M_SOGBUA_A_RIMT
    - M_SOGBUA_A_SIIG
    description: All three supply conditions are required together
  M_SOGBUA_G_CFM:
    name: Consideration Form Met
    logic: ANY
    members:
    - M_SOGBUA_A_CPIC
    - M_SOGBUA_A_CIDP
    - M_SOGBUA_A_CIOV
    description: Any one of the listed consideration forms satisfies the requirement
outcomes:
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_CALS_LE_CADM:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CALS_G_PAA OR M_CALS_G_SRC
    module: M_CALS
    description: The expression competent authority is satisfied by either the primary authority route or the licensed surveyor
      route.
  M_DOCACE_LE_CADO:
    outcome: COMPETENT_AUTHORITY_DEFINED
    expr: M_DOCACE_G_GOAIR OR M_DOCACE_G_ERCNR
    module: M_DOCACE
    description: The entity is a competent authority for paragraph 5(b) under the exhaustive definition
  M_CAA_LE_CAO:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CAA_G_GOAA OR M_CAA_G_RAR
    module: M_CAA
    description: The certifying body is a competent authority if it is the Government or an authority authorised under law,
      or if no certificate is required from such authority and it is a registered architect
  M_BICMF_LE_PFSOC:
    outcome: PROVISION_FOR_SUBSCRIPTION_OR_CONSIDERATION
    expr: M_BICMF_A_PFSOC
    module: M_BICMF
    description: The provision is made for a subscription or any other consideration (Section 2(17), part of the law)
  M_BITCM_LE_B:
    outcome: BUSINESS_INCLUDED
    expr: M_BITCM_A_CDNROM AND M_BITCM_G_LOSA
    module: M_BITCM
    description: The clause applies and the activity falls within the inclusive list or is a similar activity
  M_BIIA_LE_BIQA:
    outcome: BUSINESS_INCLUDED_UNDER_LIMB_B
    expr: M_BIIA_A_IIAOT AND M_BIIA_G_CRA AND M_BIIA_A_CDNROM
    module: M_BIIA
    description: Business includes the item when it is an activity or transaction, has a required relation to sub-clause (a),
      and no contrary context applies
  M_BIAROF_LE_BIOR:
    outcome: BUSINESS_INCLUDED
    expr: M_BIAROF_A_CRNOM AND M_BIAROF_A_AINOSA
    module: M_BIAROF
    description: The activity or transaction is included in business under this limb when no contrary context applies and
      it is in the nature of sub-clause (a), regardless of frequency.
  M_BISFCOC_LE_BICCA:
    outcome: BUSINESS_INCLUDES_THE_ACTIVITY
    expr: M_BISFCOC_A_NCCA AND M_BISFCOC_G_SOAF AND M_BISFCOC_G_GOSS AND M_BISFCOC_G_COCE
    module: M_BISFCOC
    description: The supply or acquisition is treated as included in business when no contrary context applies, it is a supply
      or acquisition of goods or services, and it is connected with commencement or closure of business.
  M_BIAFC_LE_BAI:
    outcome: BUSINESS_INCLUDES_ADMISSION
    expr: M_BIAFC_G_ACG AND M_BIAFC_A_CDNOR
    module: M_BIAFC
    description: Admission of persons to premises for a consideration is business under this inclusion when the context does
      not otherwise require
  M_DOBSBOH_LE_OSBI:
    outcome: INCLUDED_IN_BUSINESS
    expr: M_DOBSBOH_A_CDNRO AND M_DOBSBOH_G_OIT
    module: M_DOBSBOH
    description: Services supplied as holder of an office are business when the context does not require another meaning and
      both office tests are met
  M_BIRCA_LE_RCAIB:
    outcome: ACTIVITY_INCLUDED_IN_BUSINESS_UNDER_THIS_CLAUSE
    expr: M_BIRCA_A_CDNROM AND M_BIRCA_G_RCOBR
    module: M_BIRCA
    description: The activity is included in business when the context does not require another meaning and it is either a
      race club activity or a licensed book maker activity in such club.
  M_BIPAA_LE_PABI:
    outcome: BUSINESS_INCLUDED
    expr: M_BIPAA_G_PAUG AND M_BIPAA_A_NCSC
    module: M_BIPAA
    description: The activity or transaction is business under this inclusive clause when a listed public body undertakes
      it as a public authority and the context does not require another meaning.
  M_DOEC_LE_ECO:
    outcome: IS_ELECTRONIC_COMMERCE
    expr: M_DOEC_G_SRO AND M_DOEC_A_CDNROM
    module: M_DOEC
    description: Electronic commerce is established only when a supply route is met and the context does not require another
      meaning
  M_DOGO_LE_DOIAG:
    outcome: IS_GOODS
    expr: M_DOGO_A_CDNROM AND (M_DOGO_G_GBCD OR M_DOGO_G_GBSI)
    module: M_DOGO
  M_DOOT_LE_TIOATS:
    outcome: TAX_IS_ON_A_TAXABLE_SUPPLY
    expr: M_DOOT_A_TIOATS
    module: M_DOOT
    description: The tax is chargeable under this Act on a taxable supply of goods or services or both. (Section 2(82), part
      of the law)
  M_ROSUWC_LE_CIPFTS:
    outcome: CONSIDERATION_IS_PAYABLE_FOR_THE_SUPPLY
    expr: M_ROSUWC_A_CIPFTS
    module: M_ROSUWC
    description: A consideration is payable for the supply of goods or services or both. (Section 2(93), part of the law)
  M_TSD_LE_SIGOSOB:
    outcome: SUPPLY_IS_GOODS_OR_SERVICES_OR_BOTH
    expr: M_TSD_A_SIGOSOB
    module: M_TSD
    description: The supply is of goods or services or both (Section 2(108), part of the law)
  M_DOCOP_LE_CIBD:
    outcome: CONSIDERATION_INCLUDED
    expr: M_DOCOP_A_CDNRO AND M_DOCOP_A_SIGOS AND M_DOCOP_G_PRC AND NOT M_DOCOP_A_PIGS
    module: M_DOCOP
    description: The payment is consideration under this clause when the context does not require otherwise, the supply is
      of goods or services or both, the payment route tests are met, and the payment is not a Central or State Government
      subsidy.
  M_CMVOAF_LE_AVCAC:
    outcome: CONSIDERATION_INCLUDES_ACT_VALUE
    expr: NOT M_CMVOAF_A_CORDM AND M_CMVOAF_G_AAVC AND M_CMVOAF_G_SLA AND M_CMVOAF_A_ABROO AND M_CMVOAF_A_SOGOS AND NOT M_CMVOAF_A_SGBG
    module: M_CMVOAF
    description: The monetary value of an act or forbearance is included in consideration when the definition is not displaced
      by context, the act is linked to the supply by at least one of the three routes, and the item is not a Government subsidy.
  M_CMVOAF_LE_GSEFC:
    outcome: SUBSIDY_EXCLUDED_FROM_CONSIDERATION
    expr: NOT M_CMVOAF_A_CORDM AND M_CMVOAF_A_SGBG
    module: M_CMVOAF
    description: A subsidy given by the Central Government or a State Government is not included in consideration, unless
      the context otherwise requires.
  M_SITIS_LE_SIS:
    outcome: IS_SERVICE
    expr: M_SITIS_A_SIST
    module: M_SITIS
    description: Determines if the activity is considered a service based on this clarification.
  M_DOS2_LE_TTIAS:
    outcome: IS_SERVICE
    expr: M_DOS2_A_DAUCRO AND M_DOS2_G_SC
    module: M_DOS2
  M_DOPI_LE_PDII:
    outcome: PERSON_INCLUDES_INDIVIDUAL
    expr: M_DOPI_A_PII AND M_DOPI_A_CDNO
    module: M_DOPI
    description: Determines if an individual is considered a 'person' under this specific inclusive definition, considering
      the context.
  M_PIHUF_LE_PIH:
    outcome: PERSON_INCLUDES_HUF
    expr: M_PIHUF_A_EIHUF
    module: M_PIHUF
    description: This clause contributes to the definition of 'person' by including a Hindu Undivided Family.
  M_PIC_LE_CIP:
    outcome: ENTITY_IS_PERSON_VIA_COMPANY
    expr: M_PIC_A_EIAC
    module: M_PIC
  M_DOPF_LE_PIF:
    outcome: IS_PERSON
    expr: M_DOPF_A_AFIIITDOP
    module: M_DOPF
  M_PILLP_LE_LIIP:
    outcome: IS_PERSON
    expr: M_PILLP_A_LLPIP AND M_PILLP_A_CAI
    module: M_PILLP
  M_PIAOP_LE_IAPUS84F:
    outcome: IS_PERSON_UNDER_S2_84_f
    expr: M_PIAOP_A_CDNRDM AND M_PIAOP_G_EIAOB
    module: M_PIAOP
  M_PISCOGC_LE_IIIPDS84G:
    outcome: IS_INCLUDED_IN_PERSON_DEFINITION_S2_84_g
    expr: M_PISCOGC_A_CDNRO AND M_PISCOGC_G_EISCOGC
    module: M_PISCOGC
    description: The entity is included in the definition of 'person' under Section 2(84)(g).
  M_PIFBC_LE_PIFBC:
    outcome: PERSON_INCLUDED
    expr: M_PIFBC_G_FBCC AND M_PIFBC_A_DAUCRO
    module: M_PIFBC
    description: Determines if an entity is considered a 'person' under this Act because it is a body corporate incorporated
      outside India, unless the context otherwise requires.
  M_PICS_LE_CSIP:
    outcome: M_PICS_PD_IPCS
    expr: M_PICS_A_CDNOR AND M_PICS_A_EIRCS
    module: M_PICS
    description: This LE determines if a co-operative society is considered a 'person' under this specific sub-clause, subject
      to contextual requirements.
  M_PILA_LE_LAIP:
    outcome: ENTITY_IS_PERSON
    expr: M_PILA_A_UTCOR AND M_PILA_A_PIALA
    module: M_PILA
    description: Determines if an entity is considered a 'person' under this specific inclusive definition.
  M_PICOSG_LE_GEIAP:
    outcome: PERSON_INCLUDED
    expr: M_PICOSG_A_CDNOR AND M_PICOSG_G_IAGE
    module: M_PICOSG
    description: Determines if a Central or State Government is included in the definition of 'person' under this clause,
      considering contextual requirements.
  M_PIS_LE_P:
    outcome: PERSON_INCLUDES_SOCIETY
    expr: M_PIS_A_EIAS AND M_PIS_A_CDNRO
    module: M_PIS
    description: Determines if a society is included in the definition of 'person' based on the Act and context.
  M_PIT_LE_PDI:
    outcome: PERSON_INCLUDED
    expr: M_PIT_A_PIT AND M_PIT_A_CDNRO
    module: M_PIT
    description: Determines if a trust is included in the definition of 'person' based on the explicit inclusion and contextual
      requirements.
  M_PIAJP_LE_P:
    outcome: PERSON_INCLUDES_AJP
    expr: M_PIAJP_A_EIAAJP AND M_PIAJP_A_ANIPC
    module: M_PIAJP
    description: Determines if an entity qualifies as an artificial juridical person under this specific clause of the definition
      of 'person', subject to contextual requirements.
  M_DOC3_LE_CDO:
    outcome: COUNCIL_MEANING_APPLIES
    expr: M_DOC3_G_CTT
    module: M_DOC3
    description: The term Council carries the defined meaning only where the body is the GST Council and the context does
      not require another meaning.
  M_DOG_LE_GDM:
    outcome: IS_GOVERNMENT_AS_DEFINED
    expr: M_DOG_A_ITCG AND M_DOG_A_CDNROM
    module: M_DOG
    description: Determines if an entity qualifies as 'Government' according to Section 2(53).
  M_DONAN_LE_ND:
    outcome: NOTIFICATION_DEFINED
    expr: M_DONAN_A_NMPIOG AND (NOT M_DONAN_A_DAUCRO)
    module: M_DONAN
    description: Determines if a given item qualifies as a 'notification' under the Act, subject to contextual override.
  M_DONAN_LE_RTI:
    outcome: RELATED_TERMS_INTERPRETED
    expr: M_DONAN_A_NANCA AND (NOT M_DONAN_A_DAUCRO)
    module: M_DONAN
    description: Provides the rule for construing 'notify' and 'notified' based on the definition of 'notification' and contextual
      override.
  M_DOCOA_LE_CAD:
    outcome: DEFINED_MEANING
    expr: M_DOCOA_G_DMC
    module: M_DOCOA
    description: The defined meaning applies where the context does not require otherwise and the authority is notified by
      the Government
  M_DOCOA_LE_COD:
    outcome: CONTEXT_MEANING_APPLIES
    expr: NOT M_DOCOA_A_CDNROM
    module: M_DOCOA
    description: The definition does not govern the term where the context requires another meaning
  M_DOCFS_LE_CMO:
    outcome: WITHIN_CONSTRUCTION
    expr: (M_DOCFS_G_ECW AND M_DOCFS_G_ECSC) OR M_DOCFS_A_OCBLW
    module: M_DOCFS
    description: The activity is within construction for this clause if it is a listed extended work on an existing civil
      structure, or other construction within the open inclusion.
  M_DOMAIE_LE_IIDAM:
    outcome: IS_MONEY
    expr: M_DOMAIE_A_CDNROM AND M_DOMAIE_G_IIAQFOM AND M_DOMAIE_G_IIUFAQP AND M_DOMAIE_A_CNHFNV
    module: M_DOMAIE
  M_ACD_LE_ACDPT:
    outcome: ACTIONABLE_CLAIM_MEANING_AS_PER_TPA
    expr: M_ACD_A_ACMR AND NOT M_ACD_A_CRO
    module: M_ACD
    description: The TPA meaning applies to actionable claim in this Act unless the context otherwise requires
  M_DOSE_LE_SDBS:
    outcome: SECURITIES_DEFINED_BY_SCRA
    expr: M_DOSE_A_CAD AND M_DOSE_A_SSD
    module: M_DOSE
    description: The definition of 'securities' is established by reference to the SCRA, 1956, if the context of this Act
      allows.
  M_NTTAG_LE_TTAG:
    outcome: TREATED_AS_SUPPLY_OF_GOODS_UNDER_NOTIFICATION
    expr: M_NTTAG_A_STS7S AND M_NTTAG_A_NOCR AND M_NTTAG_A_TSBN AND M_NTTAG_A_TAGNS
    module: M_NTTAG
    description: The transaction is treated as a supply of goods and not as a supply of services only when it is specified
      by notification issued on the Council recommendation, the notified treatment is goods, and the notification stays within
      sub-sections (1), (1A) and (2).
  M_LOBIS_LE_BLIS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_LOBIS_G_BLDC
    module: M_LOBIS
    description: A lease or letting out of a building for business or commerce, wholly or partly, is deemed a supply of services.
  M_LOLIS_LE_LIDS:
    outcome: SUPPLY_OF_SERVICES
    expr: M_LOLIS_G_LIA
    module: M_LOLIS
    description: The land interest is deemed a supply of services when one of the four listed interests applies
  M_TOTIG2_LE_TTDGS:
    outcome: SUPPLY_OF_GOODS_DEEMED
    expr: M_TOTIG2_G_TTTG
    module: M_TOTIG2
    description: When all title transfer terms hold the transaction is deemed a supply of goods.
  M_ROIPS_LE_RTASS:
    outcome: SUPPLY_OF_SERVICES_DEEMED
    expr: M_ROIPS_G_ROIP
    module: M_ROIPS
    description: Renting of immovable property is treated as supply of services when the renting of immovable property group
      holds
  M_COCAS_LE_CDSOS:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: M_COCAS_G_COS AND NOT M_COCAS_G_CTE
    module: M_COCAS
    description: Construction of the specified immovable property is treated as a supply of services unless the entire consideration
      was received after the earlier of completion certificate (where required) or first occupation.
  M_TTOIPS_LE_IPSD:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TTOIPS_A_RIIP AND M_TTOIPS_G_IPUF
    module: M_TTOIPS
    description: The transaction is treated as a supply of services when the right is an intellectual property right and the
      transaction is a temporary transfer or permits use or enjoyment of it
  M_RTODAS_LE_DSS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_RTODAS_A_PATO AND M_RTODAS_G_AOK
    module: M_RTODAS
    description: An agreed obligation of a listed kind is treated as a supply of services
  M_TORTUGS_LE_DSO:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_TORTUGS_G_DST
    module: M_TORTUGS
    description: The transaction is deemed a supply of services when the right to use transfer and the consideration test
      are both met.
  M_FODCSAS_LE_SFVC:
    outcome: SUPPLY_FOR_VALUABLE_CONSIDERATION
    expr: M_FODCSAS_A_SFVC
    module: M_FODCSAS
    description: The supply or service is for cash, deferred payment or other valuable consideration (Schedule II, paragraph
      6, part of the law)
  M_SOGBUA_LE_DSOG:
    outcome: DEEMED_SUPPLY_OF_GOODS
    expr: M_SOGBUA_G_SCM AND M_SOGBUA_G_CFM
    module: M_SOGBUA
    description: The listed supply is treated as a supply of goods when all supply conditions are met and the consideration
      form is met
  M_NSSOLAB_LE_SIAS:
    outcome: SUPPLY_IS_A_SALE
    expr: M_NSSOLAB_A_SIAS
    module: M_NSSOLAB
    description: The transaction takes the form of a sale (Schedule III paragraph 5, part of the law)
  M_DNPFGOS_LE_DNTAP:
    outcome: DEPOSIT_NOT_CONSIDERED_PAYMENT_FOR_SUPPLY
    expr: M_DNPFGOS_A_DGFS AND NOT M_DNPFGOS_A_SADAC
    module: M_DNPFGOS
    description: The deposit shall not be considered as payment made for the supply when it is not applied by the supplier
      as consideration.
  M_DNPFGOS_LE_DAAC:
    outcome: PROVISO_BAR_DOES_NOT_APPLY
    expr: M_DNPFGOS_A_DGFS AND M_DNPFGOS_A_SADAC
    module: M_DNPFGOS
    description: The bar in the proviso does not apply because the supplier applies the deposit as consideration for the said
      supply.
triggers:
  M_BIAFC_CT_CRT:
    question: Do the related provisions require a meaning of business other than the inclusive one?
    trigger: F_DCS = 'UNKNOWN'
    beside: M_BIAFC_LE_BAI
  M_LOLIS_CT_LIR:
    question: Is the interest in land granted a lease, tenancy, easement or licence to occupy land despite another label?
    trigger: F_SLIT IN ['OTHER', 'UNKNOWN']
    beside: M_LOLIS_LE_LIDS
  M_TTOIPS_CT_TBR:
    question: Does the contract make the transfer temporary, or is it an outright transfer that another provision must decide
    trigger: F_IPUF = 'UNKNOWN'
    beside: M_TTOIPS_LE_IPSD
products:
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_CALS_PD_CADM:
    statement: The expression competent authority is satisfied by either the primary authority route or the licensed surveyor
      route.
  M_DOCACE_PD_CADO:
    statement: The entity is a competent authority for paragraph 5(b) under the exhaustive definition
  M_CAA_PD_CAO:
    statement: The certifying body is a competent authority if it is the Government or an authority authorised under law,
      or if no certificate is required from such authority and it is a registered architect
  M_BICMF_PD_PFSOC:
    statement: The provision is made for a subscription or any other consideration
  M_BITCM_PD_B:
    statement: The clause applies and the activity falls within the inclusive list or is a similar activity
  M_BIIA_PD_BIQA:
    statement: Business includes the item when it is an activity or transaction, has a required relation to sub-clause (a),
      and no contrary context applies
  M_BIAROF_PD_BIOR:
    statement: The activity or transaction is included in business under this limb when no contrary context applies and it
      is in the nature of sub-clause (a), regardless of frequency.
  M_BISFCOC_PD_BICCA:
    statement: The supply or acquisition is treated as included in business when no contrary context applies, it is a supply
      or acquisition of goods or services, and it is connected with commencement or closure of business.
  M_BIAFC_PD_BAI:
    statement: Admission of persons to premises for a consideration is business under this inclusion when the context does
      not otherwise require
  M_DOBSBOH_PD_OSBI:
    statement: Services supplied as holder of an office are business when the context does not require another meaning and
      both office tests are met
  M_BIRCA_PD_RCAIB:
    statement: The activity is included in business when the context does not require another meaning and it is either a race
      club activity or a licensed book maker activity in such club.
  M_BIPAA_PD_PABI:
    statement: The activity or transaction is business under this inclusive clause when a listed public body undertakes it
      as a public authority and the context does not require another meaning.
  M_DOEC_PD_ECO:
    statement: Electronic commerce is established only when a supply route is met and the context does not require another
      meaning
  M_DOGO_PD_DOIAG:
    statement: IS_GOODS
  M_DOOT_PD_TIOATS:
    statement: The tax is chargeable under this Act on a taxable supply of goods or services or both.
  M_ROSUWC_PD_CIPFTS:
    statement: A consideration is payable for the supply of goods or services or both.
  M_TSD_PD_SIGOSOB:
    statement: The supply is of goods or services or both
  M_DOCOP_PD_CIBD:
    statement: The payment is consideration under this clause when the context does not require otherwise, the supply is of
      goods or services or both, the payment route tests are met, and the payment is not a Central or State Government subsidy.
  M_CMVOAF_PD_AVCAC:
    statement: The monetary value of an act or forbearance is included in consideration when the definition is not displaced
      by context, the act is linked to the supply by at least one of the three routes, and the item is not a Government subsidy.
  M_CMVOAF_PD_GSEFC:
    statement: A subsidy given by the Central Government or a State Government is not included in consideration, unless the
      context otherwise requires.
  M_SITIS_PD_SIS:
    statement: Determines if the activity is considered a service based on this clarification.
  M_DOS2_PD_TTIAS:
    statement: IS_SERVICE
  M_DOPI_PD_PDII:
    statement: Determines if an individual is considered a 'person' under this specific inclusive definition, considering
      the context.
  M_PIHUF_PD_PIH:
    statement: This clause contributes to the definition of 'person' by including a Hindu Undivided Family.
  M_PIC_PD_CIP:
    statement: ENTITY_IS_PERSON_VIA_COMPANY
  M_DOPF_PD_PIF:
    statement: IS_PERSON
  M_PILLP_PD_LIIP:
    statement: IS_PERSON
  M_PIAOP_PD_IAPUS84F:
    statement: IS_PERSON_UNDER_S2_84_f
  M_PISCOGC_PD_IIIPDS84G:
    statement: The entity is included in the definition of 'person' under Section 2(84)(g).
  M_PIFBC_PD_PIFBC:
    statement: Determines if an entity is considered a 'person' under this Act because it is a body corporate incorporated
      outside India, unless the context otherwise requires.
  M_PICS_PD_CSIP:
    statement: This LE determines if a co-operative society is considered a 'person' under this specific sub-clause, subject
      to contextual requirements.
  M_PILA_PD_LAIP:
    statement: Determines if an entity is considered a 'person' under this specific inclusive definition.
  M_PICOSG_PD_GEIAP:
    statement: Determines if a Central or State Government is included in the definition of 'person' under this clause, considering
      contextual requirements.
  M_PIS_PD_P:
    statement: Determines if a society is included in the definition of 'person' based on the Act and context.
  M_PIT_PD_PDI:
    statement: Determines if a trust is included in the definition of 'person' based on the explicit inclusion and contextual
      requirements.
  M_PIAJP_PD_P:
    statement: Determines if an entity qualifies as an artificial juridical person under this specific clause of the definition
      of 'person', subject to contextual requirements.
  M_DOC3_PD_CDO:
    statement: The term Council carries the defined meaning only where the body is the GST Council and the context does not
      require another meaning.
  M_DOG_PD_GDM:
    statement: Determines if an entity qualifies as 'Government' according to Section 2(53).
  M_DONAN_PD_ND:
    statement: Determines if a given item qualifies as a 'notification' under the Act, subject to contextual override.
  M_DONAN_PD_RTI:
    statement: Provides the rule for construing 'notify' and 'notified' based on the definition of 'notification' and contextual
      override.
  M_DOCOA_PD_CAD:
    statement: The defined meaning applies where the context does not require otherwise and the authority is notified by the
      Government
  M_DOCOA_PD_COD:
    statement: The definition does not govern the term where the context requires another meaning
  M_DOCFS_PD_CMO:
    statement: The activity is within construction for this clause if it is a listed extended work on an existing civil structure,
      or other construction within the open inclusion.
  M_DOMAIE_PD_IIDAM:
    statement: IS_MONEY
  M_ACD_PD_ACDPT:
    statement: The TPA meaning applies to actionable claim in this Act unless the context otherwise requires
  M_DOSE_PD_SDBS:
    statement: The definition of 'securities' is established by reference to the SCRA, 1956, if the context of this Act allows.
  M_NTTAG_PD_TTAG:
    statement: The transaction is treated as a supply of goods and not as a supply of services only when it is specified by
      notification issued on the Council recommendation, the notified treatment is goods, and the notification stays within
      sub-sections (1), (1A) and (2).
  M_LOBIS_PD_BLIS:
    statement: A lease or letting out of a building for business or commerce, wholly or partly, is deemed a supply of services.
  M_LOLIS_PD_LIDS:
    statement: The land interest is deemed a supply of services when one of the four listed interests applies
  M_TOTIG2_PD_TTDGS:
    statement: When all title transfer terms hold the transaction is deemed a supply of goods.
  M_ROIPS_PD_RTASS:
    statement: Renting of immovable property is treated as supply of services when the renting of immovable property group
      holds
  M_COCAS_PD_CDSOS:
    statement: Construction of the specified immovable property is treated as a supply of services unless the entire consideration
      was received after the earlier of completion certificate (where required) or first occupation.
  M_TTOIPS_PD_IPSD:
    statement: The transaction is treated as a supply of services when the right is an intellectual property right and the
      transaction is a temporary transfer or permits use or enjoyment of it
  M_RTODAS_PD_DSS:
    statement: An agreed obligation of a listed kind is treated as a supply of services
  M_TORTUGS_PD_DSO:
    statement: The transaction is deemed a supply of services when the right to use transfer and the consideration test are
      both met.
  M_FODCSAS_PD_SFVC:
    statement: The supply or service is for cash, deferred payment or other valuable consideration
  M_SOGBUA_PD_DSOG:
    statement: The listed supply is treated as a supply of goods when all supply conditions are met and the consideration
      form is met
  M_NSSOLAB_PD_SIAS:
    statement: The transaction takes the form of a sale
  M_DNPFGOS_PD_DNTAP:
    statement: The deposit shall not be considered as payment made for the supply when it is not applied by the supplier as
      consideration.
  M_DNPFGOS_PD_DAAC:
    statement: The bar in the proviso does not apply because the supplier applies the deposit as consideration for the said
      supply.
