    statement: The subject of the transaction is not 'money'.
    order: HIGH
    interpretation: Based on the item's nature and the definition in Section 2(75), is the item classified as 'money'?
    grounding:
    - F_IIM
    handler: light
  M_DOS2_A_TSINS:
    statement: The subject of the transaction is not 'securities'.
    order: HIGH
    interpretation: Based on the item's nature and the definition in Section 2(101), is the item classified as 'securities'?
    grounding:
    - F_IIS
    handler: light
  M_DOS2_A_ARTUOCOM:
    statement: The activity relates to the use of money or its conversion by cash or by any other mode, from one form, currency
      or denomination, to another.
    order: HIGH
    interpretation: Does the described activity relate to the use of money or its conversion (e.g., currency exchange, forex
      services, arranging loans)?
    grounding:
    - F_PAD
    handler: heavy
  M_DOS2_A_SCICFTA:
    statement: A separate consideration is charged for the activity.
    order: LOW
    rule: F_SCICFA = TRUE
    handler: python
  M_SGOSRDP_A_SICOB:
    statement: The supply is made in the course or furtherance of business
    order: HIGH
    interpretation: Is the activity of making the supply in the course or furtherance of business? Ordinary activity that
      is not business does not satisfy this atom
    grounding:
    - F_AOTD
    handler: heavy
  M_SIAWC_A_AMOA:
    statement: The activity is made or agreed to be made
    order: LOW
    rule: F_ASC IN ['MADE', 'AGREED']
    handler: python
  M_SIAWC_A_MWAC:
    statement: The activity is made or agreed to be made without a consideration
    order: LOW
    rule: F_SCS = 'NONE'
    handler: python
  M_LOBIS_A_LFBOC:
    statement: The building is leased or let out for business or commerce, either wholly or partly
    order: HIGH
    interpretation: Is the building leased or let out for business or commerce, either for the whole building or for only
      a part of it? A letting wholly for private residence does not meet this condition.
    grounding:
    - F_AOTD
    - F_DOS
    handler: heavy
  M_PUOBGIS_A_UDBBP:
    statement: The putting to use, use or making available of the goods is by or under the direction of a person carrying
      on a business
    order: HIGH
    interpretation: Is the person who puts the goods to use, uses them or makes them available a person carrying on a business,
      or acting under the direction of such a person?
    grounding:
    - F_PBDS
    handler: heavy
  M_PUOBGIS_A_GHFBP:
    statement: The goods are held or used for the purposes of the business
    order: HIGH
    interpretation: Are the goods held or used for the purposes of the business?
    grounding:
    - F_GBH
    handler: light
  M_PUOBGIS_A_GPTPU:
    statement: The goods are put to any private use
    order: HIGH
    interpretation: Are the goods put to any private use?
    grounding:
    - F_GUK
    handler: light
  M_PUOBGIS_A_GUFNBP:
    statement: The goods are used for any purpose other than a purpose of the business
    order: HIGH
    interpretation: Are the goods used for a purpose other than a purpose of the business?
    grounding:
    - F_GUK
    - F_GUP
    handler: light
  M_PUOBGIS_A_GMAFNBU:
    statement: The goods are made available to any person for use for any purpose other than a purpose of the business
    order: HIGH
    interpretation: Are the goods made available to any person for use for a purpose other than a purpose of the business?
    grounding:
    - F_GUK
    - F_GUP
    handler: light
  M_DNPFGOS_A_DGFS:
    statement: A deposit is given in respect of the supply of goods or services or both
    order: HIGH
    interpretation: Was the sum given as a deposit in respect of the supply of goods or services or both?
    grounding:
    - F_PODG
    handler: light
  M_DNPFGOS_A_SADAC:
    statement: The supplier applies such deposit as consideration for the said supply
    order: LOW
    rule: F_AODA = 'APPLIED_AS_CONSIDERATION'
    handler: python
groups:
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_BIRCA_G_RCOBR:
    name: Race Club Or Bookmaker Route
    logic: ANY
    members:
    - M_BIRCA_G_AIOARCIF
    - M_BIRCA_G_LBIC
    description: Either the race club activity route or the licensed book maker in such club route.
  M_BIRCA_G_LBIC:
    name: Licensed Bookmaker In Club
    logic: ALL
    members:
    - M_BIRCA_A_BMHL
    - M_BIRCA_A_AOBIC
    description: The book maker is licensed and the activity is carried on in such race club.
  M_BIRCA_G_AIOARCIF:
    name: Activity Is Of A Race Club In Force
    logic: ANY
    members:
    - M_BIRCA_A_AIOARC
    - M_BIRCA_A_RCSTB
    description: M_BIRCA_A_AIOARC from 2019-02-01, the old wording before
  M_BITCM_G_LOSA:
    name: Listed Or Similar Activity
    logic: ANY
    members:
    - M_BITCM_A_AIT
    - M_BITCM_A_AIC
    - M_BITCM_A_AIM
    - M_BITCM_A_AIP
    - M_BITCM_A_AIV
    - M_BITCM_A_AIA
    - M_BITCM_A_AIW
    - M_BITCM_A_AIOS
    description: The activity is any listed kind or any other similar activity
  M_BIIA_G_CRA:
    name: Connection Relation Alternatives
    logic: ANY
    members:
    - M_BIIA_A_AICWSCA
    - M_BIIA_A_AITSCA
    - M_BIIA_A_AATSCA
    description: Any one of connection, incidental or ancillary relation to sub-clause (a) suffices
  M_BIAFC_G_ACG:
    name: Admission Conditions Group
    logic: ALL
    members:
    - M_BIAFC_A_AOPTP
    - M_BIAFC_A_AFAC
    description: Both the admission activity and the consideration for it must be met
  M_BICMF_G_CBMC:
    name: Club Benefit Members Conditions
    logic: ALL
    members:
    - M_BICMF_A_PICOSB
    - M_BICMF_A_PIFOB
    - M_BICMF_A_FPTIM
    - M_BICMF_A_PFSOC
    description: The provision must be by a club or similar body, be of facilities or benefits, be to its members and be for
      consideration.
  M_BIPAA_G_PAUG:
    name: Public Authority Undertaking Group
    logic: ALL
    members:
    - M_BIPAA_A_UIGOA
    - M_BIPAA_A_EAPA
    description: Both the undertaker and the public authority capacity must be present.
  M_BISFCOC_G_SOAF:
    name: Supply Or Acquisition Form
    logic: ANY
    members:
    - M_BISFCOC_A_TIAS
    - M_BISFCOC_A_TIAA
    description: Either a supply or an acquisition qualifies.
  M_BISFCOC_G_GOSS:
    name: Goods Or Services Subject
    logic: ANY
    members:
    - M_BISFCOC_A_SIGIC
    - M_BISFCOC_A_SIS
    description: Goods (including capital goods) or services qualify. A transaction covering both also qualifies. It is not
      goods only or services only.
  M_BISFCOC_G_COCE:
    name: Commencement Or Closure Event
    logic: ANY
    members:
    - M_BISFCOC_A_CWBC
    - M_BISFCOC_A_CWBC2
    description: Connection with either commencement or closure of business qualifies.
  M_DOBSBOH_G_OIT:
    name: Office Inclusion Tests
    logic: ALL
    members:
    - M_DOBSBOH_A_SSAOH
    - M_DOBSBOH_A_OAICOF
    description: Both the office holder service test and the office acceptance test are required for this inclusion
  M_DOGO_G_GBCD:
    name: Goods By Core Definition
    logic: ALL
    members:
    - M_DOGO_A_TIIMP
    - M_DOGO_A_TIINM
    - M_DOGO_A_TIINS
  M_DOGO_G_GBSI:
    name: Goods By Specific Inclusion
    logic: ANY
    members:
    - M_DOGO_A_TIIAAC
    - M_DOGO_A_TIIGC
    - M_DOGO_A_TIIG
    - M_DOGO_G_ATLAATBS
  M_DOGO_G_ATLAATBS:
    name: Attached To Land And Agreed To Be Severed
    logic: ALL
    members:
    - M_DOGO_A_IIATL
    - M_DOGO_A_IIATBS
  M_PIAOP_G_EIAOB:
    name: Entity Is AOP Or BOI
    logic: ANY
    members:
    - M_PIAOP_A_EIAAOP
    - M_PIAOP_A_EIABOI
  M_PISCOGC_G_EISCOGC:
    name: Entity Is Statutory Corp Or Govt Co
    logic: ANY
    members:
    - M_PISCOGC_A_EIASC
    - M_PISCOGC_A_EIAGC
    description: The entity is either a statutory corporation or a Government company.
  M_PIFBC_G_FBCC:
    name: Foreign Body Corporate Conditions
    logic: ALL
    members:
    - M_PIFBC_A_EIBC
    - M_PIFBC_A_BCIOI
    description: All conditions for a foreign body corporate to be included in the definition of 'person'.
  M_PICOSG_G_IAGE:
    name: Is A Government Entity
    logic: ANY
    members:
    - M_PICOSG_A_PICG
    - M_PICOSG_A_PISG
    description: Checks if the entity is either the Central Government or a State Government.
  M_MDAMC_G_TFM:
    name: Test For Manufacture
    logic: ALL
    members:
    - M_MDAMC_A_PORMOI
    - M_MDAMC_A_EONPWDI
    description: Groups the conditions that constitute the definition of manufacture.
  M_DOCOP_G_PTA:
    name: Payment Timing Alternatives
    logic: ANY
    members:
    - M_DOCOP_A_PHBM
    - M_DOCOP_A_PITBM
    description: The payment is either already made or is to be made. Both events are not required.
  M_DOCOP_G_PRC:
    name: Payment Route Conditions
    logic: ALL
    members:
    - M_DOCOP_G_PTA
    - M_DOCOP_A_PIIMOO
    - M_DOCOP_A_PLTTS
    - M_DOCOP_A_PIROO
    description: The payment must be made or to be made, in money or otherwise, be linked to the supply, and be paid by the
      recipient or any other person.
  M_CMVOAF_G_AAVC:
    name: Act And Value Core
    logic: ALL
    members:
    - M_CMVOAF_A_CIAOF
    - M_CMVOAF_A_AHAMV
    description: There must be an act or forbearance, and its monetary value is what is included.
  M_CMVOAF_G_SLA:
    name: Supply Link Alternatives
    logic: ANY
    members:
    - M_CMVOAF_A_AIROS
    - M_CMVOAF_A_AIRTS
    - M_CMVOAF_A_AFIOS
    description: The act or forbearance must be in respect of, in response to, or for the inducement of the supply. Any one
      route is enough.
  M_DOMAIE_G_IIAQFOM:
    name: Item Is A Qualifying Form Of Money
    logic: ANY
    members:
    - M_DOMAIE_A_IIILT
    - M_DOMAIE_A_IIAFC
    - M_DOMAIE_A_IIAC
    - M_DOMAIE_A_IIAPN
    - M_DOMAIE_A_IIABOE
    - M_DOMAIE_A_IIALOC
    - M_DOMAIE_A_IIAD
    - M_DOMAIE_A_IIAPO
    - M_DOMAIE_A_IIATC
    - M_DOMAIE_A_IIAMO
    - M_DOMAIE_A_IIAPR
    - M_DOMAIE_A_IIAER
    - M_DOMAIE_A_IIIRBR
  M_DOMAIE_G_IIUFAQP:
    name: Item Is Used For A Qualifying Purpose
    logic: ANY
    members:
    - M_DOMAIE_A_IIUTSAO
    - M_DOMAIE_A_IIUTED
  M_LAMAP_G_DAC:
    name: Definition Applies Conditions
    logic: ALL
    members:
    - M_LAMAP_A_CDNOR
    - M_LAMAP_A_BIAP
    description: Both the context condition and the Panchayat definition must hold for the definition to apply.
  M_DOLAM_G_BDC:
    name: Both Definition Conditions
    logic: ALL
    members:
    - M_DOLAM_A_CDNROM
    - M_DOLAM_A_BIMPC
    description: Both the context limb and the Municipality limb must be met
  M_LAMRODC_G_CTFLA:
    name: Council Type For Local Authority
    logic: ANY
    members:
    - M_LAMRODC_A_EIRC
    - M_LAMRODC_A_EIDC
    description: Checks if the entity is either a Regional Council or a District Council.
  M_LAMRC371A_G_CFLAD:
    name: Conditions For Local Authority Definition
    logic: ALL
    members:
    - M_LAMRC371A_A_UCOR
    - M_LAMRC371A_A_EIRCUA371A
  M_DOS2_G_SC:
    name: Service Criteria
    logic: ANY
    members:
    - M_DOS2_G_BDOS
    - M_DOS2_G_IFMA
  M_DOS2_G_BDOS:
    name: Base Definition Of Service
    logic: ALL
    members:
    - M_DOS2_A_TSING
    - M_DOS2_A_TSINM
    - M_DOS2_A_TSINS
  M_DOS2_G_IFMA:
    name: Inclusion For Money-Related Activities
    logic: ALL
    members:
    - M_DOS2_A_ARTUOCOM
    - M_DOS2_A_SCICFTA
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SGOSRDP_PD_SICOB
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_PUOBGIS_G_POONBU:
    name: Private Or Other Non Business Use
    logic: ANY
    members:
    - M_PUOBGIS_A_GPTPU
    - M_PUOBGIS_A_GUFNBP
    - M_PUOBGIS_A_GMAFNBU
    description: Goods are put to any private use, or are used for a non-business purpose, or are made available to any person
      for use for a non-business purpose.
  M_PUOBGIS_G_APFDC:
    name: All Paragraph Four Deeming Conditions
    logic: ALL
    members:
    - M_PUOBGIS_A_UDBBP
    - M_PUOBGIS_A_GHFBP
    - M_PUOBGIS_G_POONBU
    description: Direction by a business person, business goods, and one of the use forms must all hold.
outcomes:
  M_SIAFOS_LE_SBPIB:
    outcome: SUPPLY_BY_PERSON_IN_BUSINESS
    expr: M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The supply is made or agreed to be made by a person in the course or furtherance of business (Section 7(1),
      part of the law)
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_BIRCA_LE_RCAIB:
    outcome: ACTIVITY_INCLUDED_IN_BUSINESS_UNDER_THIS_CLAUSE
    expr: M_BIRCA_A_CDNROM AND M_BIRCA_G_RCOBR
    module: M_BIRCA
    description: The activity is included in business when the context does not require another meaning and it is either a
      race club activity or a licensed book maker activity in such club.
  M_BIAROF_LE_BIOR:
    outcome: BUSINESS_INCLUDED
    expr: M_BIAROF_A_CRNOM AND M_BIAROF_A_AINOSA
    module: M_BIAROF
    description: The activity or transaction is included in business under this limb when no contrary context applies and
      it is in the nature of sub-clause (a), regardless of frequency.
  M_BITCM_LE_B:
    outcome: BUSINESS_INCLUDED
    expr: M_BITCM_A_CDNROM AND M_BITCM_G_LOSA
    module: M_BITCM
    description: The clause applies and the activity falls within the inclusive list or is a similar activity
  M_BIIA_LE_BIQA:
    outcome: BUSINESS_INCLUDED_UNDER_LIMB_B
    expr: M_BIIA_A_IIAOT AND M_BIIA_G_CRA AND M_BIIA_A_CDNROM
    module: M_BIIA
    description: Business includes the item when it is an activity or transaction, has a required relation to sub-clause (a),
      and no contrary context applies
  M_BIAFC_LE_BAI:
    outcome: BUSINESS_INCLUDES_ADMISSION
    expr: M_BIAFC_G_ACG AND M_BIAFC_A_CDNOR
    module: M_BIAFC
    description: Admission of persons to premises for a consideration is business under this inclusion when the context does
      not otherwise require
  M_BICMF_LE_CMFBI:
    outcome: BUSINESS_INCLUDED
    expr: M_BICMF_A_CDNRO AND M_BICMF_G_CBMC
    module: M_BICMF
    description: This inclusion applies when the context does not require another meaning and all four club-benefit conditions
      are met.
  M_BIPAA_LE_PABI:
    outcome: BUSINESS_INCLUDED
    expr: M_BIPAA_G_PAUG AND M_BIPAA_A_NCSC
    module: M_BIPAA
    description: The activity or transaction is business under this inclusive clause when a listed public body undertakes
      it as a public authority and the context does not require another meaning.
  M_BISFCOC_LE_BICCA:
    outcome: BUSINESS_INCLUDES_THE_ACTIVITY
    expr: M_BISFCOC_A_NCCA AND M_BISFCOC_G_SOAF AND M_BISFCOC_G_GOSS AND M_BISFCOC_G_COCE
    module: M_BISFCOC
    description: The supply or acquisition is treated as included in business when no contrary context applies, it is a supply
      or acquisition of goods or services, and it is connected with commencement or closure of business.
  M_DOBSBOH_LE_OSBI:
    outcome: INCLUDED_IN_BUSINESS
    expr: M_DOBSBOH_A_CDNRO AND M_DOBSBOH_G_OIT
    module: M_DOBSBOH
    description: Services supplied as holder of an office are business when the context does not require another meaning and
      both office tests are met
  M_DOAFGOS_LE_COSORB:
    outcome: CARRIES_ON_SUPPLY_OR_RECEIPT_BUSINESS
    expr: M_DOAFGOS_A_COSORB
    module: M_DOAFGOS
    description: The person carries on the business of supply or receipt of goods or services or both (Section 2(5), part
      of the law)
  M_DOIS_LE_SUICOB:
    outcome: SERVICE_USED_IN_COURSE_OF_BUSINESS
    expr: M_DOIS_A_SUICOB
    module: M_DOIS
    description: The service is used or intended to be used in the course or furtherance of business (Section 2(60), part
      of the law)
  M_DOOS_LE_SIICOFOB:
    outcome: SUPPLY_IS_IN_COURSE_OR_FURTHERANCE_OF_BUSINESS
    expr: M_DOOS_A_SIICOFOB
    module: M_DOOS
    description: The supply is made in the course or furtherance of business (Section 2(83), part of the law)
  M_DOCG_LE_GUIB:
    outcome: GOODS_USED_IN_BUSINESS
    expr: M_DOCG_A_GUIB
    module: M_DOCG
    description: The goods are used or intended to be used in the course or furtherance of business (Section 2(19), part of
      the law)
  M_DOCTP_LE_TICOFOB:
    outcome: TRANSACTIONS_IN_COURSE_OR_FURTHERANCE_OF_BUSINESS
    expr: M_DOCTP_A_TICOFOB
    module: M_DOCTP
    description: The transactions are undertaken in the course or furtherance of business (Section 2(20), part of the law)
  M_DOGO_LE_DOIAG:
    outcome: IS_GOODS
    expr: M_DOGO_A_CDNROM AND (M_DOGO_G_GBCD OR M_DOGO_G_GBSI)
    module: M_DOGO
  M_DOPI_LE_PDII:
    outcome: PERSON_INCLUDES_INDIVIDUAL
    expr: M_DOPI_A_PII AND M_DOPI_A_CDNO
    module: M_DOPI
    description: Determines if an individual is considered a 'person' under this specific inclusive definition, considering
      the context.
  M_PIHUF_LE_PIH:
    outcome: PERSON_INCLUDES_HUF
    expr: M_PIHUF_A_EIHUF
    module: M_PIHUF
    description: This clause contributes to the definition of 'person' by including a Hindu Undivided Family.
  M_PIC_LE_CIP:
    outcome: ENTITY_IS_PERSON_VIA_COMPANY
    expr: M_PIC_A_EIAC
    module: M_PIC
  M_DOPF_LE_PIF:
    outcome: IS_PERSON
    expr: M_DOPF_A_AFIIITDOP
    module: M_DOPF
  M_PILLP_LE_LIIP:
    outcome: IS_PERSON
    expr: M_PILLP_A_LLPIP AND M_PILLP_A_CAI
    module: M_PILLP
  M_PIAOP_LE_IAPUS84F:
    outcome: IS_PERSON_UNDER_S2_84_f
    expr: M_PIAOP_A_CDNRDM AND M_PIAOP_G_EIAOB
    module: M_PIAOP
  M_PISCOGC_LE_IIIPDS84G:
    outcome: IS_INCLUDED_IN_PERSON_DEFINITION_S2_84_g
    expr: M_PISCOGC_A_CDNRO AND M_PISCOGC_G_EISCOGC
    module: M_PISCOGC
    description: The entity is included in the definition of 'person' under Section 2(84)(g).
  M_PIFBC_LE_PIFBC:
    outcome: PERSON_INCLUDED
    expr: M_PIFBC_G_FBCC AND M_PIFBC_A_DAUCRO
    module: M_PIFBC
    description: Determines if an entity is considered a 'person' under this Act because it is a body corporate incorporated
      outside India, unless the context otherwise requires.
  M_PICS_LE_CSIP:
    outcome: M_PICS_PD_IPCS
    expr: M_PICS_A_CDNOR AND M_PICS_A_EIRCS
    module: M_PICS
    description: This LE determines if a co-operative society is considered a 'person' under this specific sub-clause, subject
      to contextual requirements.
  M_PILA_LE_LAIP:
    outcome: ENTITY_IS_PERSON
    expr: M_PILA_A_UTCOR AND M_PILA_A_PIALA
    module: M_PILA
    description: Determines if an entity is considered a 'person' under this specific inclusive definition.
  M_PICOSG_LE_GEIAP:
    outcome: PERSON_INCLUDED
    expr: M_PICOSG_A_CDNOR AND M_PICOSG_G_IAGE
    module: M_PICOSG
    description: Determines if a Central or State Government is included in the definition of 'person' under this clause,
      considering contextual requirements.
  M_PIS_LE_P:
    outcome: PERSON_INCLUDES_SOCIETY
    expr: M_PIS_A_EIAS AND M_PIS_A_CDNRO
    module: M_PIS
    description: Determines if a society is included in the definition of 'person' based on the Act and context.
  M_PIT_LE_PDI:
    outcome: PERSON_INCLUDED
    expr: M_PIT_A_PIT AND M_PIT_A_CDNRO
    module: M_PIT
    description: Determines if a trust is included in the definition of 'person' based on the explicit inclusion and contextual
      requirements.
  M_PIAJP_LE_P:
    outcome: PERSON_INCLUDES_AJP
    expr: M_PIAJP_A_EIAAJP AND M_PIAJP_A_ANIPC
    module: M_PIAJP
    description: Determines if an entity qualifies as an artificial juridical person under this specific clause of the definition
      of 'person', subject to contextual requirements.
  M_MDAMC_LE_AIM:
    outcome: IS_MANUFACTURE
    expr: M_MDAMC_A_CDNROM AND M_MDAMC_G_TFM
    module: M_MDAMC
    description: Determines if an activity qualifies as 'manufacture' based on the statutory definition.
  M_MDAMC_LE_PIM:
    outcome: IS_MANUFACTURER
    expr: M_MDAMC_A_CDNROM AND M_MDAMC_G_TFM
    module: M_MDAMC
    description: Determines if a person is a 'manufacturer' by applying the test for 'manufacture' to their activity.
  M_DOCOP_LE_CIBD:
    outcome: CONSIDERATION_INCLUDED
    expr: M_DOCOP_A_CDNRO AND M_DOCOP_A_SIGOS AND M_DOCOP_G_PRC AND NOT M_DOCOP_A_PIGS
    module: M_DOCOP
    description: The payment is consideration under this clause when the context does not require otherwise, the supply is
      of goods or services or both, the payment route tests are met, and the payment is not a Central or State Government
      subsidy.
  M_CMVOAF_LE_AVCAC:
    outcome: CONSIDERATION_INCLUDES_ACT_VALUE
    expr: NOT M_CMVOAF_A_CORDM AND M_CMVOAF_G_AAVC AND M_CMVOAF_G_SLA AND M_CMVOAF_A_ABROO AND M_CMVOAF_A_SOGOS AND NOT M_CMVOAF_A_SGBG
    module: M_CMVOAF
    description: The monetary value of an act or forbearance is included in consideration when the definition is not displaced
      by context, the act is linked to the supply by at least one of the three routes, and the item is not a Government subsidy.
  M_CMVOAF_LE_GSEFC:
    outcome: SUBSIDY_EXCLUDED_FROM_CONSIDERATION
    expr: NOT M_CMVOAF_A_CORDM AND M_CMVOAF_A_SGBG
    module: M_CMVOAF
    description: A subsidy given by the Central Government or a State Government is not included in consideration, unless
      the context otherwise requires.
  M_DOMAIE_LE_IIDAM:
    outcome: IS_MONEY
    expr: M_DOMAIE_A_CDNROM AND M_DOMAIE_G_IIAQFOM AND M_DOMAIE_G_IIUFAQP AND M_DOMAIE_A_CNHFNV
    module: M_DOMAIE
  M_DOG_LE_GDM:
    outcome: IS_GOVERNMENT_AS_DEFINED
    expr: M_DOG_A_ITCG AND M_DOG_A_CDNROM
    module: M_DOG
    description: Determines if an entity qualifies as 'Government' according to Section 2(53).
  M_LAMAP_LE_LADA:
    outcome: IS_LOCAL_AUTHORITY
    expr: M_LAMAP_G_DAC
    module: M_LAMAP
    description: The definition applies only if the context does not otherwise require and the body is a Panchayat as defined
      in clause (d) of article 243 of the Constitution.
  M_DOLAM_LE_LADA:
    outcome: LOCAL_AUTHORITY_TERM
    expr: M_DOLAM_G_BDC
    module: M_DOLAM
    description: The term local authority takes this definition when the context does not otherwise require a different meaning
      and the body is a Municipality
  M_LAMCB_LE_LAD:
    outcome: IS_LOCAL_AUTHORITY_D
    expr: M_LAMCB_A_CDNROM AND M_LAMCB_A_PIACB
    module: M_LAMCB
    description: Determines if an entity qualifies as a 'local authority' under this specific definition.
  M_LAMRODC_LE_LAD:
    outcome: IS_LOCAL_AUTHORITY
    expr: M_LAMRODC_A_CALAD AND M_LAMRODC_G_CTFLA AND M_LAMRODC_A_CCUSS
    module: M_LAMRODC
    description: Determines if an entity qualifies as a 'local authority' based on the definition in Section 2(69)(e).
  M_LAMDB_LE_ILA:
    outcome: IS_LOCAL_AUTHORITY
    expr: M_LAMDB_A_CDNROM AND M_LAMDB_A_EIADB AND M_LAMDB_A_BCUA371A37
    module: M_LAMDB
    description: Determines if an entity qualifies as a 'local authority' under this specific definition
  M_LAMRC371A_LE_ILA:
    outcome: IS_LOCAL_AUTHORITY
    expr: M_LAMRC371A_G_CFLAD
    module: M_LAMRC371A
  M_DOSIUT_LE_SVS103I:
    outcome: IS_STATE_VIA_S2_103_INCLUSION
    expr: M_DOSIUT_A_CNOM AND M_DOSIUT_A_SIUTWL
    module: M_DOSIUT
    description: Determines if a territory is considered a 'State' by virtue of the inclusion specified in Section 2(103).
  M_SITIS_LE_SIS:
    outcome: IS_SERVICE
    expr: M_SITIS_A_SIST
    module: M_SITIS
    description: Determines if the activity is considered a service based on this clarification.
  M_DOS2_LE_TTIAS:
    outcome: IS_SERVICE
    expr: M_DOS2_A_DAUCRO AND M_DOS2_G_SC
    module: M_DOS2
  M_SGOSRDP_LE_SICOB:
    outcome: SUPPLY_IN_COURSE_OF_BUSINESS
    expr: M_SGOSRDP_A_SICOB
    module: M_SGOSRDP
    description: The supply is made in the course or furtherance of business (Schedule I, paragraph 2, part of the law)
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_LOBIS_LE_LFBOC:
    outcome: LETTING_FOR_BUSINESS_OR_COMMERCE
    expr: M_LOBIS_A_LFBOC
    module: M_LOBIS
    description: The building is leased or let out for business or commerce, either wholly or partly (Schedule II, paragraph
      2, part of the law)
  M_PUOBGIS_LE_PUDSS:
    outcome: The usage or making available of such goods is a supply of services
    expr: M_PUOBGIS_G_APFDC
    module: M_PUOBGIS
    description: 'All deeming conditions are met: directed by a business person, goods held or used for the business, and
      private use or non-business use or making available.'
  M_DNPFGOS_LE_DNTAP:
    outcome: DEPOSIT_NOT_CONSIDERED_PAYMENT_FOR_SUPPLY
    expr: M_DNPFGOS_A_DGFS AND NOT M_DNPFGOS_A_SADAC
    module: M_DNPFGOS
    description: The deposit shall not be considered as payment made for the supply when it is not applied by the supplier
      as consideration.
  M_DNPFGOS_LE_DAAC:
    outcome: PROVISO_BAR_DOES_NOT_APPLY
    expr: M_DNPFGOS_A_DGFS AND M_DNPFGOS_A_SADAC
    module: M_DNPFGOS
    description: The bar in the proviso does not apply because the supplier applies the deposit as consideration for the said
      supply.
triggers:
  M_BIAFC_CT_CRT:
    question: Do the related provisions require a meaning of business other than the inclusive one?
    trigger: F_DCS = 'UNKNOWN'
    beside: M_BIAFC_LE_BAI
products:
  M_SIAFOS_PD_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_BIRCA_PD_RCAIB:
    statement: The activity is included in business when the context does not require another meaning and it is either a race
      club activity or a licensed book maker activity in such club.
  M_BIAROF_PD_BIOR:
    statement: The activity or transaction is included in business under this limb when no contrary context applies and it
      is in the nature of sub-clause (a), regardless of frequency.
  M_BITCM_PD_B:
    statement: The clause applies and the activity falls within the inclusive list or is a similar activity
  M_BIIA_PD_BIQA:
    statement: Business includes the item when it is an activity or transaction, has a required relation to sub-clause (a),
      and no contrary context applies
  M_BIAFC_PD_BAI:
    statement: Admission of persons to premises for a consideration is business under this inclusion when the context does
      not otherwise require
  M_BICMF_PD_CMFBI:
    statement: This inclusion applies when the context does not require another meaning and all four club-benefit conditions
      are met.
  M_BIPAA_PD_PABI:
    statement: The activity or transaction is business under this inclusive clause when a listed public body undertakes it
      as a public authority and the context does not require another meaning.
  M_BISFCOC_PD_BICCA:
    statement: The supply or acquisition is treated as included in business when no contrary context applies, it is a supply
      or acquisition of goods or services, and it is connected with commencement or closure of business.
  M_DOBSBOH_PD_OSBI:
    statement: Services supplied as holder of an office are business when the context does not require another meaning and
      both office tests are met
  M_DOAFGOS_PD_COSORB:
    statement: The person carries on the business of supply or receipt of goods or services or both
  M_DOIS_PD_SUICOB:
    statement: The service is used or intended to be used in the course or furtherance of business
  M_DOOS_PD_SIICOFOB:
    statement: The supply is made in the course or furtherance of business
  M_DOCG_PD_GUIB:
    statement: The goods are used or intended to be used in the course or furtherance of business
  M_DOCTP_PD_TICOFOB:
    statement: The transactions are undertaken in the course or furtherance of business
  M_DOGO_PD_DOIAG:
    statement: IS_GOODS
  M_DOPI_PD_PDII:
    statement: Determines if an individual is considered a 'person' under this specific inclusive definition, considering
      the context.
  M_PIHUF_PD_PIH:
    statement: This clause contributes to the definition of 'person' by including a Hindu Undivided Family.
  M_PIC_PD_CIP:
    statement: ENTITY_IS_PERSON_VIA_COMPANY
  M_DOPF_PD_PIF:
    statement: IS_PERSON
  M_PILLP_PD_LIIP:
    statement: IS_PERSON
  M_PIAOP_PD_IAPUS84F:
    statement: IS_PERSON_UNDER_S2_84_f
  M_PISCOGC_PD_IIIPDS84G:
    statement: The entity is included in the definition of 'person' under Section 2(84)(g).
  M_PIFBC_PD_PIFBC:
    statement: Determines if an entity is considered a 'person' under this Act because it is a body corporate incorporated
      outside India, unless the context otherwise requires.
  M_PICS_PD_CSIP:
    statement: This LE determines if a co-operative society is considered a 'person' under this specific sub-clause, subject
      to contextual requirements.
  M_PILA_PD_LAIP:
    statement: Determines if an entity is considered a 'person' under this specific inclusive definition.
  M_PICOSG_PD_GEIAP:
    statement: Determines if a Central or State Government is included in the definition of 'person' under this clause, considering
      contextual requirements.
  M_PIS_PD_P:
    statement: Determines if a society is included in the definition of 'person' based on the Act and context.
  M_PIT_PD_PDI:
    statement: Determines if a trust is included in the definition of 'person' based on the explicit inclusion and contextual
      requirements.
  M_PIAJP_PD_P:
    statement: Determines if an entity qualifies as an artificial juridical person under this specific clause of the definition
      of 'person', subject to contextual requirements.
  M_MDAMC_PD_AIM:
    statement: Determines if an activity qualifies as 'manufacture' based on the statutory definition.
  M_MDAMC_PD_PIM:
    statement: Determines if a person is a 'manufacturer' by applying the test for 'manufacture' to their activity.
  M_DOCOP_PD_CIBD:
    statement: The payment is consideration under this clause when the context does not require otherwise, the supply is of
      goods or services or both, the payment route tests are met, and the payment is not a Central or State Government subsidy.
  M_CMVOAF_PD_AVCAC:
    statement: The monetary value of an act or forbearance is included in consideration when the definition is not displaced
      by context, the act is linked to the supply by at least one of the three routes, and the item is not a Government subsidy.
  M_CMVOAF_PD_GSEFC:
    statement: A subsidy given by the Central Government or a State Government is not included in consideration, unless the
      context otherwise requires.
  M_DOMAIE_PD_IIDAM:
    statement: IS_MONEY
  M_DOG_PD_GDM:
    statement: Determines if an entity qualifies as 'Government' according to Section 2(53).
  M_LAMAP_PD_LADA:
    statement: The definition applies only if the context does not otherwise require and the body is a Panchayat as defined
      in clause (d) of article 243 of the Constitution.
  M_DOLAM_PD_LADA:
    statement: The term local authority takes this definition when the context does not otherwise require a different meaning
      and the body is a Municipality
  M_LAMCB_PD_LAD:
    statement: Determines if an entity qualifies as a 'local authority' under this specific definition.
  M_LAMRODC_PD_LAD:
    statement: Determines if an entity qualifies as a 'local authority' based on the definition in Section 2(69)(e).
  M_LAMDB_PD_ILA:
    statement: Determines if an entity qualifies as a 'local authority' under this specific definition
  M_LAMRC371A_PD_ILA:
    statement: IS_LOCAL_AUTHORITY
  M_DOSIUT_PD_SVS103I:
    statement: Determines if a territory is considered a 'State' by virtue of the inclusion specified in Section 2(103).
  M_SITIS_PD_SIS:
    statement: Determines if the activity is considered a service based on this clarification.
  M_DOS2_PD_TTIAS:
    statement: IS_SERVICE
  M_SGOSRDP_PD_SICOB:
    statement: The supply is made in the course or furtherance of business
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_LOBIS_PD_LFBOC:
    statement: The building is leased or let out for business or commerce, either wholly or partly
  M_PUOBGIS_PD_PUDSS:
    statement: 'All deeming conditions are met: directed by a business person, goods held or used for the business, and private
      use or non-business use or making available.'
  M_DNPFGOS_PD_DNTAP:
    statement: The deposit shall not be considered as payment made for the supply when it is not applied by the supplier as
      consideration.
  M_DNPFGOS_PD_DAAC:
    statement: The bar in the proviso does not apply because the supplier applies the deposit as consideration for the said
      supply.
