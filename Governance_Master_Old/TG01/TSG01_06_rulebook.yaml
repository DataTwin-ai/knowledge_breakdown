predicates:
  M_SIAFOS_A_SBPIB:
    statement: The supply is made or agreed to be made by a person in the course or furtherance of business
    order: HIGH
    interpretation: Given the supplier and the activity described, is the supply made or agreed to be made by a person in
      the course or furtherance of business?
    grounding:
    - F_SLS
    - F_AOTD
    handler: heavy
  M_IOSFC_A_SIIOS:
    statement: The transaction is an import of services within the meaning of the Act
    order: HIGH
    interpretation: Is the service an import of services in its statutory sense, given the service import status evidence
    grounding:
    - F_SIS
    handler: heavy
  M_IOSFC_A_IIFC:
    statement: The import of services is for a consideration
    order: LOW
    rule: F_SCS IN ['PAID', 'AGREED']
    handler: python
  M_BIRCA_A_CDNROM:
    statement: The context of this Act does not otherwise require a meaning of business other than the inclusive meaning given
      in this clause
    order: HIGH
    interpretation: Does the context in which business is used require a meaning other than this inclusive meaning? (NO_CONTRARY_CONTEXT
      means the condition is met)
    grounding:
    - F_DCS
    handler: light
  M_BIRCA_A_AIOARC:
    statement: The activity is an activity of a race club including by way of totalisator or a license to book maker (illustrative
      and not a closed list)
    order: HIGH
    interpretation: Is the described activity an activity of a race club including activity by way of totalisator or a license
      to book maker?
    grounding:
    - F_AOTD
    handler: light
    valid_from: '2019-02-01'
  M_BIRCA_A_BMHL:
    statement: The book maker whose activity is tested is a licensed book maker
    order: LOW
    rule: F_BLS = 'LICENSED'
    handler: python
    valid_from: '2019-02-01'
  M_BIRCA_A_AOBIC:
    statement: The activity is an activity of a licensed book maker in such race club
    order: HIGH
    interpretation: Is the described activity an activity of a book maker carried on in such race club?
    grounding:
    - F_AOTD
    handler: light
    valid_from: '2019-02-01'
  M_BIRCA_A_RCSTB:
    statement: The activity is a service provided by a race club by way of totalisator or a licence to book maker in such
      club
    order: HIGH
    interpretation: Is the described activity a service provided by a race club by way of totalisator or a licence to book
      maker in such club?
    grounding:
    - F_AOTD
    handler: light
    valid_to: '2019-01-31'
  M_BIAROF_A_CRNOM:
    statement: The context of the provision in which business is used does not otherwise require a different meaning from
      this definition
    order: HIGH
    interpretation: Does the provision in which business is used, or a related provision, require a meaning of business different
      from this definition?
    grounding:
    - F_DCS
    handler: light
  M_BIAROF_A_AINOSA:
    statement: The activity or transaction is in the nature of sub-clause (a), whether or not there is volume, frequency,
      continuity or regularity of such transaction
    order: HIGH
    interpretation: Is the activity or transaction of the nature described in sub-clause (a), without requiring any volume,
      frequency, continuity or regularity?
    grounding:
    - F_AOTD
    handler: heavy
  M_BITCM_A_CDNROM:
    statement: In this Act the context does not require a meaning of business other than this inclusive definition
    order: HIGH
    interpretation: Does the provision in which business is used, or a related provision, require a meaning of business other
      than the inclusive definition, with UNKNOWN left unresolved
    grounding:
    - F_DCS
    handler: heavy
  M_BITCM_A_AIT:
    statement: The activity is a trade, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a trade in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIC:
    statement: The activity is commerce, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity commerce in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIM:
    statement: The activity is manufacture, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity manufacture in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIP:
    statement: The activity is a profession, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a profession in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIV:
    statement: The activity is a vocation, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a vocation in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIA:
    statement: The activity is an adventure, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity an adventure as the term is used in this Act
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIW:
    statement: The activity is a wager, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity a wager in its ordinary sense
    grounding:
    - F_AOTD
    handler: light
  M_BITCM_A_AIOS:
    statement: The activity is any other similar activity to those listed, whether or not it is for a pecuniary benefit
    order: HIGH
    interpretation: Is the described activity similar in kind to trade, commerce, manufacture, profession, vocation, adventure
      or wager, the list being open and not exhaustive
    grounding:
    - F_AOTD
    handler: heavy
  M_BIIA_A_IIAOT:
    statement: The item is an activity or transaction
    order: HIGH
    interpretation: Is the described item an activity or a transaction?
    grounding:
    - F_AOTD
    handler: light
  M_BIIA_A_AICWSCA:
    statement: The activity or transaction is in connection with sub-clause (a)
    order: HIGH
    interpretation: Does the described activity or transaction have a connection with the activity described in sub-clause
      (a)?
    grounding:
    - F_AOTD
    - F_LCD
    handler: heavy
  M_BIIA_A_AITSCA:
    statement: The activity or transaction is incidental to sub-clause (a)
    order: HIGH
    interpretation: Is the described activity or transaction incidental to the activity described in sub-clause (a)?
    grounding:
    - F_AOTD
    - F_LCD
    handler: heavy
  M_BIIA_A_AATSCA:
    statement: The activity or transaction is ancillary to sub-clause (a)
    order: HIGH
    interpretation: Is the described activity or transaction ancillary to the activity described in sub-clause (a)?
    grounding:
    - F_AOTD
    - F_LCD
    handler: heavy
  M_BIIA_A_CDNROM:
    statement: The context does not otherwise require business to bear a meaning other than this inclusive definition
    order: HIGH
    interpretation: Does the provision or its context require business to bear a meaning other than this inclusive definition?
    grounding:
    - F_DCS
    - F_SCW
    handler: heavy
  M_BIAFC_A_AOPTP:
    statement: The activity is the admission of persons to any premises
    order: HIGH
    interpretation: Does the described activity admit persons to a premises?
    grounding:
    - F_AOTD
    handler: light
  M_BIAFC_A_AFAC:
    statement: The admission of persons is for a consideration, whether money, non-money or both
    order: LOW
    rule: F_SCT IN ['MONEY','NON_MONEY','BOTH']
    handler: python
  M_BIAFC_A_CDNOR:
    statement: The context in which business is used does not otherwise require a meaning other than the inclusive definition
    order: HIGH
    interpretation: Do the term's context and related provisions require a meaning of business other than this inclusive one?
    grounding:
    - F_DCS
    handler: heavy
  M_BICMF_A_CDNRO:
    statement: In this Act, the context does not otherwise require a different meaning of 'business' than the inclusive meaning
      in this clause
    order: HIGH
    interpretation: Does the provision in which 'business' is used, or a related provision, require a different meaning so
      that this inclusive meaning should not apply?
    grounding:
    - F_DCS
    - F_SCW
    handler: heavy
  M_BICMF_A_PICOSB:
    statement: The provision is made by a club, association, society, or any such body
    order: HIGH
    interpretation: Is the provider a club, association or society, or a body of the same kind as these, judged from its legal
      form and the activity it carries on?
    grounding:
    - F_PLET
    - F_AOTD
    handler: heavy
  M_BICMF_A_PIFOB:
    statement: The provision is of facilities or benefits
    order: HIGH
    interpretation: Does the activity description show a provision of facilities or benefits?
    grounding:
    - F_AOTD
    handler: light
  M_BICMF_A_FPTIM:
    statement: The facilities or benefits are provided to its members, that is the members of the providing body
    order: LOW
    rule: F_RMS = 'MEMBER'
    handler: python
  M_BICMF_A_PFSOC:
    statement: The provision is made for a subscription or any other consideration
    order: LOW
    rule: F_SCT IN ['MONEY', 'NON_MONEY', 'BOTH']
    handler: python
  M_BIPAA_A_UIGOA:
    statement: The activity or transaction is undertaken by the Central Government, a State Government or any local authority
    order: LOW
    rule: F_AUT IN ['CENTRAL_GOVERNMENT','STATE_GOVERNMENT','LOCAL_AUTHORITY']
    handler: python
  M_BIPAA_A_EAPA:
    statement: The Central Government, State Government or local authority is engaged in the activity or transaction as a
      public authority
    order: HIGH
    interpretation: Is the listed authority engaged in this activity or transaction in its capacity as a public authority?
    grounding:
    - F_AOTD
    - F_AUT
    handler: heavy
  M_BIPAA_A_NCSC:
    statement: Unless the context otherwise requires, the context of the provision in which business is used does not require
      a different meaning of business
    order: HIGH
    interpretation: Do the provision in which the term is used and the related provisions show that business must bear another
      meaning here?
    grounding:
    - F_DCS
    - F_SCW
    handler: heavy
  M_BISFCOC_A_NCCA:
    statement: Unless the context otherwise requires, the term business takes this inclusive meaning, so the context of the
      provision where business is used does not require a different meaning
    order: HIGH
    interpretation: Does the context of the provision in which business is used require a meaning other than this inclusive
      definition?
    grounding:
    - F_DCS
    handler: light
  M_BISFCOC_A_TIAS:
    statement: The transaction is a supply of the goods or services concerned, made by the person whose business is being
      tested
    order: LOW
    rule: F_SOAD = 'SUPPLY'
    handler: python
  M_BISFCOC_A_TIAA:
    statement: The transaction is an acquisition of the goods or services concerned, made by the person whose business is
      being tested
    order: LOW
    rule: F_SOAD = 'ACQUISITION'
    handler: python
  M_BISFCOC_A_SIGIC:
    statement: The supply or acquisition is of goods including capital goods
    order: LOW
    rule: F_SIK IN ['GOODS', 'CAPITAL_GOODS', 'BOTH']
    handler: python
  M_BISFCOC_A_SIS:
    statement: The supply or acquisition is of services
    order: LOW
    rule: F_SIK IN ['SERVICES', 'BOTH']
    handler: python
  M_BISFCOC_A_CWBC:
    statement: The supply or acquisition is in connection with commencement of business
    order: HIGH
    interpretation: Is this supply or acquisition in connection with the commencement of the business? Weigh the described
      activity against the business event.
    grounding:
    - F_BLES
    - F_AOTD
    handler: heavy
  M_BISFCOC_A_CWBC2:
    statement: The supply or acquisition is in connection with closure of business
    order: HIGH
    interpretation: Is this supply or acquisition in connection with the closure of the business? Weigh the described activity
      against the business event.
    grounding:
    - F_BLES
    - F_AOTD
    handler: heavy
  M_DOBSBOH_A_CDNRO:
    statement: The context of this Act does not otherwise require a different meaning of business
    order: LOW
    rule: F_DCS = 'NO_CONTRARY_CONTEXT'
    handler: python
  M_DOBSBOH_A_SSAOH:
    statement: The services are supplied by a person as the holder of an office
    order: HIGH
    interpretation: Are the services supplied by the person in the capacity of holder of an office?
