groups:
  M_DOCFP2_G_CRA:
    name: Court Route Alternatives
    logic: ANY
    members:
    - M_DOCFP2_A_DCII
    - M_DOCFP2_A_HCII
    - M_DOCFP2_A_SCII
    - M_DOCFP2_A_OBQAC
    description: Any one qualifying route makes the body a court for paragraph 2
  M_SIAFOS_G_LOOF:
    name: Listed Or Other Form
    logic: ANY
    members:
    - M_SIAFOS_A_SIAS
    - M_SIAFOS_A_SIAT
    - M_SIAFOS_A_SIAB
    - M_SIAFOS_A_SIAE
    - M_SIAFOS_A_SIALG
    - M_SIAFOS_A_SIAR
    - M_SIAFOS_A_SIAL
    - M_SIAFOS_A_SIAD
    - M_SIAFOS_A_SIAF
    description: Any one of the listed forms, or any other qualifying form of supply, is enough. The list is illustrative.
  M_SIAFOS_G_MOAS:
    name: Made Or Agreed Supply
    logic: ANY
    members:
    - M_SIAFOS_A_SMFC
    - M_SIAFOS_A_SAFC
    description: The supply is either made for a consideration or agreed to be made for a consideration. Both events are not
      required.
  M_IOSFC_G_ISS:
    name: Import Services Scope
    logic: ALL
    members:
    - M_IOSFC_A_SIIOS
    - M_IOSFC_A_IIFC
    description: Both the import of services limb and the for a consideration limb are needed for this inclusion.
  M_SIAWC_G_ASCM:
    name: All Schedule Conditions Met
    logic: ALL
    members:
    - M_SIAWC_A_ASISI
    - M_SIAWC_A_AMOA
    - M_SIAWC_A_MWAC
    description: Each atom is tested independently and all three are required.
  M_CALS_G_PAA:
    name: Primary Authority Alternatives
    logic: ANY
    members:
    - M_CALS_A_AITG
    - M_CALS_A_AIAI
