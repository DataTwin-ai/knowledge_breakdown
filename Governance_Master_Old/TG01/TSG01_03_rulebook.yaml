outcomes:
  M_MOWG_LE_WGMO:
    outcome: The term warehoused goods used for paragraph 8 carries the meaning given in the Customs Act, 1962
    expr: M_MOWG_A_CAWGM
    module: M_MOWG
    description: 'Single legal outcome: the Customs Act meaning governs the term for paragraph 8, with no different meaning
      to be applied.'
  M_DOCFP2_LE_CDFP2:
    outcome: COURT_FOR_PARA2
    expr: M_DOCFP2_G_CRA
    module: M_DOCFP2
    description: The body is a court for paragraph 2 where at least one court route applies
  M_SIAFOS_LE_ISO:
    outcome: INCLUDED_IN_SUPPLY
    expr: M_SIAFOS_G_LOOF AND M_SIAFOS_G_MOAS AND M_SIAFOS_A_SBPIB
    module: M_SIAFOS
    description: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_LE_ISIO:
    outcome: SUPPLY_INCLUDED
    expr: M_IOSFC_G_ISS
    module: M_IOSFC
    description: Import of services for a consideration is included in supply whether or not in the course or furtherance
      of business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_LE_SAIS:
    outcome: SUPPLY_INCLUDED
    expr: M_SIAWC_G_ASCM
    module: M_SIAWC
    description: The activity is included in supply when all three schedule conditions are met.
  M_CALS_LE_CADM:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CALS_G_PAA OR M_CALS_G_SRC
    module: M_CALS
    description: The expression competent authority is satisfied by either the primary authority route or the licensed surveyor
      route.
  M_DOCACE_LE_CADO:
    outcome: COMPETENT_AUTHORITY_DEFINED
    expr: M_DOCACE_G_GOAIR OR M_DOCACE_G_ERCNR
    module: M_DOCACE
    description: The entity is a competent authority for paragraph 5(b) under the exhaustive definition
  M_CAA_LE_CAO:
    outcome: IS_COMPETENT_AUTHORITY
    expr: M_CAA_G_GOAA OR M_CAA_G_RAR
    module: M_CAA
    description: The certifying body is a competent authority if it is the Government or an authority authorised under law,
      or if no certificate is required from such authority and it is a registered architect
  M_DOCFS_LE_CMO:
    outcome: WITHIN_CONSTRUCTION
    expr: (M_DOCFS_G_ECW AND M_DOCFS_G_ECSC) OR M_DOCFS_A_OCBLW
    module: M_DOCFS
    description: The activity is within construction for this clause if it is a listed extended work on an existing civil
      structure, or other construction within the open inclusion.
  M_PAANGNS_LE_TNGNS:
    outcome: TREATED_NEITHER_SUPPLY_OF_GOODS_NOR_SUPPLY_OF_SERVICES
    expr: M_PAANGNS_G_APAC
    module: M_PAANGNS
    description: When all three conditions hold the activity is deemed neither a supply of goods nor a supply of services.
  M_TOPOGAS_LE_DSO:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TOPOGAS_G_TAOT
    module: M_TOPOGAS
    description: Where the treatment or process test and the another-person goods test are both met, the activity is deemed
      a supply of services
  M_ACNGNS_LE_ACNS:
    outcome: NEITHER_SUPPLY
    expr: M_ACNGNS_A_AIAC AND NOT M_ACNGNS_A_CILBG
    module: M_ACNGNS
    description: Entry 6 applies only where the activity is an actionable claim and the claim is not of the excluded lottery,
      betting or gambling kind.
  M_SBCOT_LE_NSO:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: M_SBCOT_G_CTC
    module: M_SBCOT
    description: Outcome applies only when all court and Tribunal conditions hold
  M_DBCPH_LE_NSO:
    outcome: NEITHER_SUPPLY
    expr: M_DBCPH_G_DPCG
    module: M_DBCPH
    description: All three conjunctive tests must hold for the paragraph 3(b) outcome
  M_FPBM_LE_NSO:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: M_FPBM_G_MFG
    module: M_FPBM
    description: The activity is treated neither as a supply of goods nor a supply of services when the member function group
      is true
  M_ESICOE_LE_NSO:
    outcome: NEITHER_SUPPLY
    expr: M_ESICOE_G_ESG
    module: M_ESICOE
    description: Outcome is neither a supply of goods nor a supply of services only when the whole employee service group
      is TRUE
  M_NSOGWEI_LE_NSO:
    outcome: NEITHER_SUPPLY_OF_GOODS_NOR_SERVICES
    expr: M_NSOGWEI_G_NTTM
    module: M_NSOGWEI
    description: All paragraph 7 conditions hold, so the movement is neither a supply of goods nor a supply of services.
  M_SOWGBC_LE_NSO:
    outcome: NEITHER_SUPPLY
    expr: M_SOWGBC_G_WSE AND M_SOWGBC_A_SBHCC
    module: M_SOWGBC
    description: The warehoused supply elements are all met and the supply occurs before clearance for home consumption.
  M_SOGBCBC_LE_NSCT:
    outcome: NEITHER_SUPPLY
    expr: M_SOGBCBC_G_CTA AND M_SOGBCBC_G_DACW
    module: M_SOGBCBC
    description: The consignee goods transfer is treated as neither supply of goods nor supply of services only when both
      the transfer act and the dispatch and clearance window are met
  M_TOTIG_LE_TTDGS:
    outcome: SUPPLY_OF_GOODS
    expr: M_TOTIG_G_TGC
    module: M_TOTIG
    description: A transfer of title in goods is deemed a supply of goods.
  M_TORIGIS_LE_TDSS:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TORIGIS_G_TSA AND M_TORIGIS_A_TWT
    module: M_TORIGIS
    description: The transfer subject condition holds and the transfer is without transfer of title, so the transaction is
      a supply of services
  M_TOTIG2_LE_TTDGS:
    outcome: SUPPLY_OF_GOODS_DEEMED
    expr: M_TOTIG2_G_TTTG
    module: M_TOTIG2
    description: When all title transfer terms hold the transaction is deemed a supply of goods.
  M_LOLIS_LE_LIDS:
    outcome: SUPPLY_OF_SERVICES
    expr: M_LOLIS_G_LIA
    module: M_LOLIS
    description: The land interest is deemed a supply of services when one of the four listed interests applies
  M_LOBIS_LE_BLIS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_LOBIS_G_BLDC
    module: M_LOBIS
    description: A lease or letting out of a building for business or commerce, wholly or partly, is deemed a supply of services.
  M_TOBAG_LE_DGSR:
    outcome: DEEMED_SUPPLY_OF_GOODS_BY_PERSON
    expr: M_TOBAG_G_DSC
    module: M_TOBAG
    description: Where all four conditions are met, the transfer or disposal is a supply of goods by the person
  M_PUOBGIS_LE_PUDSS:
    outcome: The usage or making available of such goods is a supply of services
    expr: M_PUOBGIS_G_APFDC
    module: M_PUOBGIS
    description: 'All deeming conditions are met: directed by a business person, goods held or used for the business, and
      private use or non-business use or making available.'
  M_PRETDS_LE_GDSOC:
    outcome: DEEMED_SUPPLY_APPLIES
    expr: M_PRETDS_G_DCM AND NOT M_PRETDS_G_PREM
    module: M_PRETDS
    description: The goods are deemed to be supplied by the person in the course or furtherance of his business immediately
      before he ceases to be a taxable person. This applies when the deeming conditions are met and the personal representative
      exception is not met.
  M_PRETDS_LE_DDBPR:
    outcome: DEEMING_DISAPPLIED
    expr: M_PRETDS_G_DCM AND M_PRETDS_G_PREM
    module: M_PRETDS
    description: The deemed supply under paragraph 4(c)(ii) does not apply because the business is carried on by a personal
      representative who is deemed to be a taxable person. This says nothing on whether the transaction is a supply on any
      other basis.
  M_BTAGC_LE_GDS:
    outcome: DEEMED_SUPPLY_OF_GOODS
    expr: M_BTAGC_G_DCM AND NOT M_BTAGC_A_BTAGC
    module: M_BTAGC
    description: The goods are deemed supplied when the deeming conditions hold and the business is not transferred as a going
      concern to another person.
  M_ROIPS_LE_RTASS:
    outcome: SUPPLY_OF_SERVICES_DEEMED
    expr: M_ROIPS_G_ROIP
    module: M_ROIPS
    description: Renting of immovable property is treated as supply of services when the renting of immovable property group
      holds
  M_COCAS_LE_CDSOS:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: M_COCAS_G_COS AND NOT M_COCAS_G_CTE
    module: M_COCAS
    description: Construction of the specified immovable property is treated as a supply of services unless the entire consideration
      was received after the earlier of completion certificate (where required) or first occupation.
  M_NSSOLAB_LE_LOBNS:
    outcome: NEITHER_SUPPLY
    expr: M_NSSOLAB_A_SIAS AND M_NSSOLAB_G_LOBO AND NOT (M_NSSOLAB_A_SIOB AND M_NSSOLAB_A_BSUST)
    module: M_NSSOLAB
    description: The transaction is a sale of land, or a sale of building that is not one to which clause (b) of paragraph
      5 of Schedule II applies.
  M_SOFBCOM_LE_NSO:
    outcome: NEITHER_SUPPLY
    expr: M_SOFBCOM_G_FRS
    module: M_SOFBCOM
    description: The service is treated as neither supply under this Schedule III entry when any listed funeral, burial, crematorium
      or mortuary service is established, or when transportation of the deceased is established as included in such a service
  M_ANGNS_LE_TNGNS:
    outcome: TREATED_NEITHER_SUPPLY_OF_GOODS_NOR_SUPPLY_OF_SERVICES
    expr: M_ANGNS_A_ASISIII
    module: M_ANGNS
    description: If the activity or transaction is specified in Schedule III, it shall be treated neither as a supply of goods
      nor as a supply of services, notwithstanding sub-section (1).
  M_TTOIPS_LE_IPSD:
    outcome: SUPPLY_OF_SERVICES
    expr: M_TTOIPS_A_RIIP AND M_TTOIPS_G_IPUF
    module: M_TTOIPS
    description: The transaction is treated as a supply of services when the right is an intellectual property right and the
      transaction is a temporary transfer or permits use or enjoyment of it
  M_ISDS_LE_DSSO:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_ISDS_G_SST
    module: M_ISDS
    description: Deemed supply of services where a listed software activity is performed on information technology software
  M_RTODAS_LE_DSS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_RTODAS_A_PATO AND M_RTODAS_G_AOK
    module: M_RTODAS
    description: An agreed obligation of a listed kind is treated as a supply of services
  M_TORTUGS_LE_DSO:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_TORTUGS_G_DST
    module: M_TORTUGS
    description: The transaction is deemed a supply of services when the right to use transfer and the consideration test
      are both met.
  M_FODCSAS_LE_FDCDS:
    outcome: DEEMED_SUPPLY_OF_SERVICES
    expr: M_FODCSAS_A_SIACS AND M_FODCSAS_A_GSIAM AND M_FODCSAS_G_FOQDG AND M_FODCSAS_A_SFVC
    module: M_FODCSAS
    description: 'All conditions together: a composite supply of goods in any manner, the goods being food or other article
      for human consumption or a qualifying drink, for cash, deferred payment or other valuable consideration.'
  M_SOGBUA_LE_DSOG:
    outcome: DEEMED_SUPPLY_OF_GOODS
    expr: M_SOGBUA_G_SCM AND M_SOGBUA_G_CFM
    module: M_SOGBUA
    description: The listed supply is treated as a supply of goods when all supply conditions are met and the consideration
      form is met
  M_WCCSTAS_LE_WCDO:
    outcome: TREATED_AS_SUPPLY_OF_SERVICES
    expr: M_WCCSTAS_G_WCCG
    module: M_WCCSTAS
    description: A composite supply that is a works contract is treated as a supply of services
triggers:
  M_NSOGWEI_CT_TSR:
    question: Are the documents unclear about whether the origin or destination place lies in the non-taxable territory, or
      whether the goods entered India?
    trigger: F_SOTS = 'UNKNOWN' OR F_SDTS = 'UNKNOWN' OR F_GIES = 'UNKNOWN'
    beside: M_NSOGWEI_LE_NSO
  M_SOWGBC_CT_CTD:
    question: Do the documents show whether the supply was made before clearance for home consumption?
    trigger: F_SCT2 = 'UNKNOWN'
    beside: M_SOWGBC_LE_NSO
  M_SOGBCBC_CT_DTC:
    question: Do the bill of lading and endorsement records confirm the order of dispatch, endorsement and home clearance?
    trigger: F_SDT = 'UNKNOWN' OR F_GCS = 'UNKNOWN'
    beside: M_SOGBCBC_LE_NSCT
  M_LOLIS_CT_LIR:
    question: Is the interest in land granted a lease, tenancy, easement or licence to occupy land despite another label?
    trigger: F_SLIT IN ['OTHER', 'UNKNOWN']
    beside: M_LOLIS_LE_LIDS
  M_TTOIPS_CT_TBR:
    question: Does the contract make the transfer temporary, or is it an outright transfer that another provision must decide
    trigger: F_IPUF = 'UNKNOWN'
    beside: M_TTOIPS_LE_IPSD
products:
  M_MOWG_PD_WGMO:
    statement: 'Single legal outcome: the Customs Act meaning governs the term for paragraph 8, with no different meaning
      to be applied.'
  M_DOCFP2_PD_CDFP2:
    statement: The body is a court for paragraph 2 where at least one court route applies
  M_SIAFOS_PD_ISO:
    statement: The transaction falls within the inclusive meaning of supply when it takes a listed or other form of supply,
      is made or agreed to be made for a consideration, and is by a person in the course or furtherance of business.
  M_IOSFC_PD_ISIO:
    statement: Import of services for a consideration is included in supply whether or not in the course or furtherance of
      business. Inclusion is not exhaustive and no business-context condition is applied.
  M_SIAWC_PD_SAIS:
    statement: The activity is included in supply when all three schedule conditions are met.
  M_CALS_PD_CADM:
    statement: The expression competent authority is satisfied by either the primary authority route or the licensed surveyor
      route.
  M_DOCACE_PD_CADO:
    statement: The entity is a competent authority for paragraph 5(b) under the exhaustive definition
  M_CAA_PD_CAO:
    statement: The certifying body is a competent authority if it is the Government or an authority authorised under law,
      or if no certificate is required from such authority and it is a registered architect
  M_DOCFS_PD_CMO:
    statement: The activity is within construction for this clause if it is a listed extended work on an existing civil structure,
      or other construction within the open inclusion.
  M_PAANGNS_PD_TNGNS:
    statement: When all three conditions hold the activity is deemed neither a supply of goods nor a supply of services.
  M_TOPOGAS_PD_DSO:
    statement: Where the treatment or process test and the another-person goods test are both met, the activity is deemed
      a supply of services
  M_ACNGNS_PD_ACNS:
    statement: Entry 6 applies only where the activity is an actionable claim and the claim is not of the excluded lottery,
      betting or gambling kind.
  M_SBCOT_PD_NSO:
    statement: Outcome applies only when all court and Tribunal conditions hold
  M_DBCPH_PD_NSO:
    statement: All three conjunctive tests must hold for the paragraph 3(b) outcome
  M_FPBM_PD_NSO:
    statement: The activity is treated neither as a supply of goods nor a supply of services when the member function group
      is true
  M_ESICOE_PD_NSO:
    statement: Outcome is neither a supply of goods nor a supply of services only when the whole employee service group is
      TRUE
  M_NSOGWEI_PD_NSO:
    statement: All paragraph 7 conditions hold, so the movement is neither a supply of goods nor a supply of services.
  M_SOWGBC_PD_NSO:
    statement: The warehoused supply elements are all met and the supply occurs before clearance for home consumption.
  M_SOGBCBC_PD_NSCT:
    statement: The consignee goods transfer is treated as neither supply of goods nor supply of services only when both the
      transfer act and the dispatch and clearance window are met
  M_TOTIG_PD_TTDGS:
    statement: A transfer of title in goods is deemed a supply of goods.
  M_TORIGIS_PD_TDSS:
    statement: The transfer subject condition holds and the transfer is without transfer of title, so the transaction is a
      supply of services
  M_TOTIG2_PD_TTDGS:
    statement: When all title transfer terms hold the transaction is deemed a supply of goods.
  M_LOLIS_PD_LIDS:
    statement: The land interest is deemed a supply of services when one of the four listed interests applies
  M_LOBIS_PD_BLIS:
    statement: A lease or letting out of a building for business or commerce, wholly or partly, is deemed a supply of services.
  M_TOBAG_PD_DGSR:
    statement: Where all four conditions are met, the transfer or disposal is a supply of goods by the person
  M_PUOBGIS_PD_PUDSS:
    statement: 'All deeming conditions are met: directed by a business person, goods held or used for the business, and private
      use or non-business use or making available.'
  M_PRETDS_PD_GDSOC:
    statement: The goods are deemed to be supplied by the person in the course or furtherance of his business immediately
      before he ceases to be a taxable person. This applies when the deeming conditions are met and the personal representative
      exception is not met.
  M_PRETDS_PD_DDBPR:
    statement: The deemed supply under paragraph 4(c)(ii) does not apply because the business is carried on by a personal
      representative who is deemed to be a taxable person. This says nothing on whether the transaction is a supply on any
      other basis.
  M_BTAGC_PD_GDS:
    statement: The goods are deemed supplied when the deeming conditions hold and the business is not transferred as a going
      concern to another person.
  M_ROIPS_PD_RTASS:
    statement: Renting of immovable property is treated as supply of services when the renting of immovable property group
      holds
  M_COCAS_PD_CDSOS:
    statement: Construction of the specified immovable property is treated as a supply of services unless the entire consideration
      was received after the earlier of completion certificate (where required) or first occupation.
  M_NSSOLAB_PD_LOBNS:
    statement: The transaction is a sale of land, or a sale of building that is not one to which clause (b) of paragraph 5
      of Schedule II applies.
  M_SOFBCOM_PD_NSO:
    statement: The service is treated as neither supply under this Schedule III entry when any listed funeral, burial, crematorium
      or mortuary service is established, or when transportation of the deceased is established as included in such a service
  M_ANGNS_PD_TNGNS:
    statement: If the activity or transaction is specified in Schedule III, it shall be treated neither as a supply of goods
      nor as a supply of services, notwithstanding sub-section (1).
  M_TTOIPS_PD_IPSD:
    statement: The transaction is treated as a supply of services when the right is an intellectual property right and the
      transaction is a temporary transfer or permits use or enjoyment of it
  M_ISDS_PD_DSSO:
    statement: Deemed supply of services where a listed software activity is performed on information technology software
  M_RTODAS_PD_DSS:
    statement: An agreed obligation of a listed kind is treated as a supply of services
  M_TORTUGS_PD_DSO:
    statement: The transaction is deemed a supply of services when the right to use transfer and the consideration test are
      both met.
  M_FODCSAS_PD_FDCDS:
    statement: 'All conditions together: a composite supply of goods in any manner, the goods being food or other article
      for human consumption or a qualifying drink, for cash, deferred payment or other valuable consideration.'
  M_SOGBUA_PD_DSOG:
    statement: The listed supply is treated as a supply of goods when all supply conditions are met and the consideration
      form is met
  M_WCCSTAS_PD_WCDO:
    statement: A composite supply that is a works contract is treated as a supply of services
