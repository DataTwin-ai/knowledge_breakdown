predicates:
  M_MOWG_A_CAWGM:
    statement: The expression warehoused goods used for the purposes of paragraph 8 shall have the same meaning as assigned
      to it in the Customs Act, 1962
    order: HIGH
    interpretation: Is the goods or transaction in question within the meaning of warehoused goods given in the Customs Act,
      1962, as applied for paragraph 8?
    grounding:
    - F_GWS
    handler: light
    valid_from: '2019-02-01'
  M_DOCFP2_A_DCII:
    statement: The body is a District Court, which the term court for paragraph 2 includes
    order: LOW
    rule: F_CL = 'DISTRICT_COURT'
    handler: python
    valid_from: '2019-02-01'
  M_DOCFP2_A_HCII:
    statement: The body is a High Court, which the term court for paragraph 2 includes
    order: LOW
    rule: F_CL = 'HIGH_COURT'
    handler: python
    valid_from: '2019-02-01'
  M_DOCFP2_A_SCII:
    statement: The body is a Supreme Court, which the term court for paragraph 2 includes
    order: LOW
    rule: F_CL = 'SUPREME_COURT'
    handler: python
    valid_from: '2019-02-01'
  M_DOCFP2_A_OBQAC:
    statement: The body is a court in its ordinary legal sense, other than a District Court, High Court or Supreme Court,
      which the open term court for paragraph 2 may still include
    order: HIGH
    interpretation: Is the body a court in its ordinary legal sense, though not one of the three named courts, so that the
      inclusive term court for paragraph 2 covers it? A failed listed test alone does not decide this
    grounding:
    - F_SPT
    - F_CL
    handler: heavy
    valid_from: '2019-02-01'
