    rule: F_SES2 = 'EXISTING'
    handler: python
  M_DOCFS_A_SIC:
    statement: The structure worked on is a civil structure, as the qualifier of any existing civil structure requires
    order: HIGH
    if_false: The structure is not a civil structure
    interpretation: Is the structure worked on a civil structure, rather than another kind of structure?
    grounding:
    - F_SCS2
    handler: light
  M_DOCFS_A_OCBLW:
    statement: The activity is construction beyond the listed works, which the open word includes
    order: HIGH
    if_false: The activity is not construction in its ordinary sense
    interpretation: Is the described activity construction in a sense similar to additions, alterations, replacements or remodelling,
      even though it is not one of the listed works? The source does not state whether the existing civil structure condition
